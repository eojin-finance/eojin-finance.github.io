.grp{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--ink-3);
  padding:10px 8px 4px;text-transform:uppercase}
.item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:3px;font-size:.83rem;
  color:var(--ink-2);cursor:pointer;line-height:1.45;border:none;background:none;width:100%;
  text-align:left;font-family:var(--sans)}
.item:hover{background:var(--surface-3)}
.item.sel{background:var(--accent-soft);color:var(--accent-2);font-weight:500}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .dt{font-family:var(--mono);font-size:.64rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item.cancelled .nm{text-decoration:line-through;opacity:.55}
.dotc{width:6px;height:6px;border-radius:50%;flex:none;background:var(--ink-3)}
.dotc[data-type="정기"]{background:var(--accent)}
.dotc[data-type="킥오프"]{background:var(--warn)}
.dotc[data-type="1:1"]{background:var(--danger)}
.dotc[data-type="임시"]{background:var(--rule-2)}
.empty{color:var(--ink-3);font-size:.8rem;padding:10px 8px}

/* ── 본문 ── */
.main{overflow-y:auto;padding:26px 34px 120px;min-width:0;position:relative}
/* 본문만 가운데 두면 코멘트가 화면 밖으로 밀리고, 왼쪽에 붙이면 한쪽으로 쏠린다.
   "본문 + 여백 + 코멘트" 를 한 덩어리로 보고 그 덩어리를 가운데 둔다.
   자리가 모자라면 max() 가 0 이 되어 저절로 왼쪽 정렬로 떨어진다 — 미디어쿼리가 필요 없다. */
:root{ --doc:820px; --rail:330px; --railgap:56px; }
.wrap{max-width:var(--doc);margin-right:0;
  margin-left:max(0px, calc((100% - var(--doc) - var(--rail) - var(--railgap)) / 2))}
.savebar{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.76rem;
  color:var(--ink-2);margin-bottom:14px;letter-spacing:.04em;flex-wrap:wrap}
.savebar .pulse{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.savebar .pulse.busy{background:var(--warn)}
.savebar .sync{margin-left:auto;border:1px solid var(--rule);border-radius:2px;padding:2px 8px;
  color:var(--ink-2)}
.savebar .danger{color:var(--danger)}
.ghost{border:1px solid var(--rule);background:var(--surface);border-radius:3px;padding:3px 9px;
  font-size:.72rem;color:var(--ink-2);cursor:pointer}

.banner{background:var(--danger-soft);border-left:3px solid var(--danger);padding:12px 15px;
  border-radius:0 3px 3px 0;margin-bottom:16px;font-size:.86rem;display:flex;gap:12px;
  align-items:center;flex-wrap:wrap}
.banner b{color:var(--danger)}
.banner span{flex:1;min-width:11em}
.banner button{margin-left:0}
.banner.warn,.banner.conflict{background:var(--warn-soft);border-left-color:var(--warn)}
.banner.warn b,.banner.conflict b{color:var(--warn)}

h1.doctitle{font-family:var(--serif);font-size:2rem;font-weight:700;letter-spacing:-.01em;
  margin:0 0 16px;outline:none;line-height:1.25}
h1.doctitle:empty::before{content:"제목 없는 회의";color:var(--ink-3)}

.props{border-top:1px solid var(--rule);margin-bottom:26px}
.prop{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:6px 2px;
  border-bottom:1px solid var(--rule);font-size:.85rem;align-items:center}
.prop .lab{color:var(--ink-3);font-size:.79rem}
.prop input,.prop select{border:1px solid transparent;background:none;color:var(--ink);

  width:100%;font-variant-numeric:tabular-nums}
.prop input:hover,.prop select:hover{background:var(--surface-2)}

.prop .row input[type=date]{min-width:152px}

/* ── 블록 에디터 ── */
.doc{outline:none;font-size:.95rem;line-height:1.78;min-height:340px}

.doc .b[data-t=ul]{padding-left:22px}
.doc .b[data-t=ul]::before{content:"•";position:absolute;left:8px;color:var(--ink-3)}
.doc .b[data-t=quote]{border-left:2px solid var(--accent);padding-left:14px;color:var(--ink-2);
  font-family:var(--serif);font-size:1rem;margin:12px 0}
.doc .b[data-t=todo]{padding-left:68px}

.doc .b.st-done{color:var(--ink-3)}
.doc .b.st-done > *:not(.st){text-decoration:line-through;text-decoration-color:var(--rule-2)}
.doc .b.st-hold{color:var(--ink-3)}

.st.k-done{background:var(--accent-soft);color:var(--accent-2)}

.doc b, .doc strong{font-weight:700}

.fmt{position:fixed;z-index:24;display:flex;align-items:center;gap:1px;background:var(--surface);

<script>(function(){
  var bar=document.getElementById('demobar'), pill=document.getElementById('dbr-pill'), b=document.body;
  // 띠를 본문 여백 밖까지 펼친다 (데모마다 body 여백이 달라서 실제 값을 읽는다)
  // 앱 CSS 가 띠보다 늦게 오는 데모가 있어(body margin 8 → 0) 로드 때 다시 잰다
  function fit(){ var cs=getComputedStyle(b), pt=parseFloat(cs.paddingTop)+parseFloat(cs.marginTop), pl=parseFloat(cs.paddingLeft)+parseFloat(cs.marginLeft), pr=parseFloat(cs.paddingRight)+parseFloat(cs.marginRight);
    bar.style.margin=(-pt)+'px '+(-pr)+'px '+pt+'px '+(-pl)+'px'; }
  fit(); document.addEventListener('DOMContentLoaded',fit); window.addEventListener('load',fit);
  function tg(btn,box){ btn.addEventListener('click',function(){ box.hidden=!box.hidden; btn.setAttribute('aria-expanded',String(!box.hidden)); }); }
  tg(document.getElementById('dbr-q'),document.getElementById('dbr-info'));
  tg(document.getElementById('dbr-q2'),document.getElementById('dbr-pop'));
  document.addEventListener('keydown',function(e){ if(e.key!=='Escape')return; ['dbr-info','dbr-pop'].forEach(function(id,i){ var x=document.getElementById(id); if(!x.hidden){ x.hidden=true; document.getElementById(i?'dbr-q2':'dbr-q').setAttribute('aria-expanded','false'); } }); });
  // 앱바가 화면에 있으면 알약은 숨긴다 (숨은 알약은 Tab 으로도 안 잡히게 inert)
  function show(on){ if(on){ pill.removeAttribute('data-off'); pill.inert=false; } else { pill.setAttribute('data-off',''); pill.inert=true; document.getElementById('dbr-pop').hidden=true; document.getElementById('dbr-q2').setAttribute('aria-expanded','false'); } }
  show(false);
  if('IntersectionObserver' in window) new IntersectionObserver(function(en){ show(!en[0].isIntersecting); }).observe(bar);
})();</script>

<script>
  /* 첫 화면 데이터는 서버가 이 페이지에 실어 보낸다 — 로딩 왕복 0회. */
  var BOOT = __demoBoot();

<script>
(function () {
"use strict";

/* ══════════ 상태 ══════════ */
var S = { me: '', people: [], templates: [], meetings: [], actions: [], cur: null,
           view: 'meetings', boardWho: '', boardSt: '', calEvents: null, calMine: true,
           timer: null, saving: false, dirty: false, tagFilter: '', retry: 0, bodyHits: null,
           mcache: {}, opening: '' };

var listEl   = document.getElementById('list');
var detailEl = document.getElementById('detail');
var slashEl  = document.getElementById('slash');
var qEl      = document.getElementById('q');

/** google.script.run 은 콜백만 받는다. 한 번 감싸두면 나머지를 async/await 로 쓸 수 있다. */
function call(fn) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok === false) rej(Object.assign(new Error(r.message), { code: r.code, data: r.data }));
        else res(r && r.ok ? r.data : r);
      })
      .withFailureHandler(rej)[fn].apply(null, args);
  });
}

function toast(msg, ms) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, ms || 2600);
}

/** innerHTML 문자열을 조립하는 곳마다 거친다. 속성값에도 그대로 쓸 수 있게 따옴표까지 막는다. */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function uid() { return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function nameOf(v) {
  for (var i = 0; i < S.people.length; i++) if (S.people[i].email === v) return S.people[i].name;
  return v;
}

/* ══════════ 부팅 ══════════
   목록도 본문도 페이지에 이미 실려 온다. 서버를 다시 부르지 않고 바로 그린다.
   (실제 호출은 파일 맨 끝 — 그래야 아래에서 잡는 DOM 참조들이 다 준비된 뒤에 돈다) */
/* 로딩 실측. 콘솔(F12)에 찍힌다 — 체감이 아니라 숫자로 이야기하려고. */
/* 로딩 실측. 콘솔(F12)에 찍힌다 — 체감이 아니라 숫자로 이야기하려고.
   GAS 웹앱은 iframe 안에서 돌아서 navigation timing 은 바깥 네트워크가 아니라
   iframe 자체 문서를 잰다. 그래서 그 값은 믿을 게 못 되고, 서버 구간만 본다. */
function logTiming() {
  try {
    console.log('[회의록] 서버 총 ' + (window.__totalMs || '?') + 'ms (데이터 ' + (BOOT.serverMs || '?') +
                ' · 템플릿 ' + (window.__evalMs || '?') + ')   ' + ((BOOT.laps || []).join('  ·  ') || ''));
  } catch (e) {}
}

function boot() {
  if (!BOOT || !BOOT.ok) {
    listEl.innerHTML = '<div class="empty">불러오지 못했습니다: ' +
      esc((BOOT && BOOT.message) || '알 수 없는 오류') + '</div>';
    return;
  }
  S.me = BOOT.me; S.myName = BOOT.myName || ''; S.people = BOOT.people; S.templates = BOOT.templates;
  S.meetings = BOOT.meetings; S.types = BOOT.types; S.statuses = BOOT.statuses;
  S.actions = BOOT.actions || [];

  if (BOOT.meeting) {
    S.cur = BOOT.meeting;
    renderDetail(BOOT.meeting);
  }
  renderList();
  syncLateBadge();
  applyTheme();

  if (BOOT.meeting) S.mcache[BOOT.meeting.id] = BOOT.meeting;

  /* 예전엔 접속할 때마다 1.2초 뒤 캘린더를 미리 받았다 — 탭을 안 열어도 4초짜리 서버 실행이
     매번 하나씩 더 돌았다. 이제 캘린더 탭에 마우스·포커스가 갈 때만 받는다. */
  var calNav = document.querySelector('.nav[data-v="calendar"]');
  function prefetchCal() {
    if (S.calEvents || S.calLoading) return;
    S.calLoading = true;
    call('api_listCalendarEvents', 45)
      .then(function (d) { S.calEvents = d.events; })
      .catch(function () {})
      .then(function () { S.calLoading = false; });
  }
  if (calNav) {
    calNav.addEventListener('mouseenter', prefetchCal);
    calNav.addEventListener('focus', prefetchCal);
  }
}

/* ══════════ 목록 ══════════ */
var tagbarEl = document.getElementById('tagbar');

/** 쓰인 적 있는 태그만 띄운다 — 없으면 줄 자체를 감춘다. */
function renderTagbar() {
  var tags = allTags();
  // 마지막 하나를 본문에서 지우면 그 태그로 건 필터도 같이 풀려야 한다
  if (S.tagFilter && tags.indexOf(S.tagFilter) < 0) S.tagFilter = '';
  if (!tags.length) { tagbarEl.hidden = true; tagbarEl.innerHTML = ''; S.tagFilter = ''; return; }
  tagbarEl.hidden = false;
  tagbarEl.innerHTML = tags.map(function (t) {
    return '<button data-tg="' + esc(t) + '"' + (S.tagFilter === t ? ' class="on"' : '') + '>#' + esc(t) + '</button>';
  }).join('');
  [].forEach.call(tagbarEl.querySelectorAll('[data-tg]'), function (b) {
    b.addEventListener('click', function () {
      S.tagFilter = (S.tagFilter === b.dataset.tg) ? '' : b.dataset.tg;   // 다시 누르면 해제
      renderList();
    });
  });
}

function renderList() {
  renderTagbar();
  var q = (qEl.value || '').trim().toLowerCase();
  var tf = (S.tagFilter || '').toLowerCase();
  var rows = S.meetings.filter(function (m) {
    if (tf && !(m.tags || []).some(function (t) { return String(t).toLowerCase() === tf; })) return false;
    if (!q) return true;
    return (m.title + ' ' + m.attendees.join(' ') + ' ' + m.tags.join(' ') + ' ' + m.type)
      .toLowerCase().indexOf(q) !== -1;
  });

  var more = q.length >= 2
    ? '<button class="ghost bodysearch" id="btnBodySearch">본문에서 "' + esc(q) + '" 찾기</button>'
    : '';
  function wireMore() {
    var b = document.getElementById('btnBodySearch');
    if (b) b.addEventListener('click', runBodySearch);
  }

  if (!rows.length) {
    listEl.innerHTML = '<div class="empty">' + (q || tf ? '제목·참석자·태그에는 없어.' : '아직 회의가 없어.') + '</div>' + more;
    wireMore();
    return;
  }

  var html = '', lastGrp = '';
  rows.forEach(function (m) {
    var grp = (m.startAt || '').slice(0, 7).replace('-', '년 ') + '월';
    if (grp !== lastGrp) { html += '<div class="grp">' + (m.startAt ? grp : '날짜 미정') + '</div>'; lastGrp = grp; }
    html += '<button class="item' + (S.cur && S.cur.id === m.id ? ' sel' : '') +
            (m.status === '취소' ? ' cancelled' : '') + '" data-id="' + esc(m.id) + '">' +
            '<i class="dotc" data-type="' + esc(m.type) + '" title="' + esc(m.type || '유형 미지정') + '"></i>' +
            '<span class="nm">' + esc(m.title) + '</span>' +
            '<span class="dt">' + esc((m.startAt || '').slice(5, 10).replace('-', '/')) + '</span>' +
            '</button>';
  });
  listEl.innerHTML = html + more;
  wireMore();

  [].forEach.call(listEl.querySelectorAll('.item'), function (b) {
    b.addEventListener('click', function () { openMeeting(b.dataset.id); });
    b.addEventListener('mouseenter', function () { prefetchMeeting(b.dataset.id); });
  });
}

qEl.addEventListener('input', function () { S.bodyHits = null; renderList(); });
qEl.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); runBodySearch(); }   // 엔터는 본문까지 뒤진다
});

/* ══════════ 상세 ══════════ */
function listRow(id) {
  for (var i = 0; i < S.meetings.length; i++) if (S.meetings[i].id === id) return S.meetings[i];
  return null;
}

/**
 * 예전엔 회의를 누를 때마다 화면을 비우고 서버를 1~2초 기다렸다. 방금 본 회의도 똑같이.
 * 이제 들고 있는 본문의 rev 가 목록의 rev 와 같으면 바로 그리고, 최신인지는 뒤에서 확인한다.
 */
function openMeeting(id) {
  flushSave();
  if (S.dirty) doSave();
  S.view = 'meetings';
  S.opening = id;
  [].forEach.call(document.querySelectorAll('.nav'), function (n) {
    n.classList.toggle('on', n.dataset.v === 'meetings');
  });

  var hit = S.mcache[id], row = listRow(id);
  if (hit && (!row || Number(row.rev) === Number(hit.rev))) {
    S.cur = hit;
    renderDetail(hit);
    renderList();
    revalidate(id);
    return;
  }

  detailEl.innerHTML = '<div class="loading"><span class="spin"></span>여는 중…</div>';
  call('api_getMeeting', id).then(function (m) {
    S.mcache[id] = m;
    if (S.opening !== id) return;          // 그 사이 다른 회의를 눌렀다 — 늦게 온 응답은 그리지 않는다
    S.cur = m;
    renderDetail(m);
    renderList();
  }).catch(function (e) { toast('열지 못했습니다: ' + e.message); });
}

/** 즉시 그린 본문이 서버와 같은지 뒤에서 확인. 다르면 아직 손대기 전일 때만 바꿔 그린다. */
function revalidate(id) {
  call('api_getMeeting', id).then(function (m) {
    var had = S.mcache[id];
    var row = listRow(id);
    if (row && Number(m.rev) > Number(row.rev)) row.rev = m.rev;
    var isCur = S.cur && S.cur.id === id;

    if (!had || Number(had.rev) === Number(m.rev)) {
      if (!isCur) S.mcache[id] = m;
      return;
    }
    if (isCur) {
      /* 지금 열려 있는 회의는, 아직 손대기 전일 때만 서버 본으로 바꾼다.
         고치는 중이면 화면도 캐시도 그대로 둔다 — 여기서 캐시를 서버 본으로 바꿔 두면
         다른 회의에 갔다 돌아올 때 방금 친 내용이 빠진 본문이 그려진다.
         저장하면 rev 가 달라 충돌 배너가 안전하게 받는다. */
      if (!S.dirty && !S.saving && !S.timer) {
        S.mcache[id] = m;
        S.cur = m;
        renderDetail(m);
        toast('다른 곳에서 고친 내용으로 새로 맞췄어.');
      }
      return;
    }
    S.mcache[id] = m;
  }).catch(function () {});
}

/* 목록에 마우스를 올려 두면 그 회의를 미리 받아 둔다. 한 번에 하나씩만. */
var prefetchTimer = null, prefetching = '';
function prefetchMeeting(id) {
  clearTimeout(prefetchTimer);
  if (!id || S.mcache[id] || prefetching) return;
  prefetchTimer = setTimeout(function () {
    if (S.mcache[id] || prefetching) return;
    prefetching = id;
    call('api_getMeeting', id)
      .then(function (m) { S.mcache[id] = m; })
      .catch(function () {})
      .then(function () { prefetching = ''; });
  }, 250);
}

function renderDetail(m) {
  var calLocked = !!m.gcalEventId;   // 일정 항목은 구글 캘린더가 주인
  var ro = m.canEdit === false;                 // 읽기 전용으로 초대된 사람
  var mine = m.canManage === true;              // 판정은 서버가 한다
  var d = (m.startAt || '').slice(0, 10);
  var t1 = (m.startAt || '').slice(11, 16);
  var t2 = (m.endAt || '').slice(11, 16);

  detailEl.innerHTML =
    '<div class="savebar">' +
      '<i class="pulse" id="pulse"></i><span id="saveTxt">저장됨</span>' +
      '<button class="vis' + (m.visibility === '참석자' ? ' locked' : '') + '" id="btnShare"' +
        (mine ? '' : ' disabled') + '>' +
        (m.visibility === '참석자' ? '🔒 참석자만' : '🌐 전체 공개') +
        (m.viewers && m.viewers.length ? ' +' + m.viewers.length : '') + '</button>' +
      '<span class="sync">rev ' + m.rev + ' · ' + esc(m.syncState) + '</span>' +
      '<button class="ghost" id="btnLink">링크 복사</button>' +
      (ro ? '' :
        '<button class="ghost" id="btnCancel">' +
        (m.status === '취소' ? '취소 해제' : '취소로 표시') + '</button>') +
      (mine ? '<button class="ghost" id="btnDel">삭제</button>' : '') +
    '</div>' +
    '<div id="bannerSlot"></div>' +
    (ro ? '<div class="robar">읽기 권한으로 공유된 회의록이야. 본문은 못 고치지만 <b>코멘트</b>는 남길 수 있어.</div>' : '') +
    '<h1 class="doctitle" id="title" contenteditable="true" spellcheck="false"></h1>' +
    '<div class="props">' +
      row('📅 일시', '<span class="row">' +
        '<input type="date" id="f_date" value="' + d + '">' +
        '<input type="time" id="f_t1" value="' + t1 + '">–' +
        '<input type="time" id="f_t2" value="' + t2 + '"></span>') +
      (calLocked ? '<div class="callock">📆 일시·장소·참석자는 <b>구글 캘린더</b>가 주인이야. 바꾸려면 캘린더에서 고치면 5분 안에 여기 반영돼.</div>' : '') +
      row('📍 장소', '<input id="f_loc" value="' + esc(m.location).replace(/"/g, '&quot;') + '" placeholder="회의실 / 링크">') +
      row('👥 참석자', '<input id="f_att" value="' +
          esc(m.attendees.join(', ')).replace(/"/g, '&quot;') + '" placeholder="쉼표로 구분">') +
      row('🗂 유형', sel('f_type', S.types, m.type)) +
      row('⚙️ 상태', sel('f_status', S.statuses, m.status)) +
      row('📎 첨부', '<div class="atts" id="attSlot"></div>') +
    '</div>' +

    '<div class="doc' + (ro ? ' ro' : '') + '" id="doc"' +
      (ro ? '' : ' contenteditable="true"') + ' spellcheck="false"></div>' +
    '<div id="cmtSlot"></div>';

  document.getElementById('title').textContent = m.title;

  var doc = document.getElementById('doc');
  (m.body.length ? m.body : [{ t: 'p', x: '' }]).forEach(function (b) { doc.appendChild(blockEl(b)); });
  doc.lastChild.setAttribute('data-ph', '/ 를 입력해 블록 추가…');

  if (calLocked) {
    // 서버가 어차피 무시하지만, 고칠 수 있는 것처럼 보이면 안 된다
    document.getElementById('title').removeAttribute('contenteditable');
    ['f_date', 'f_t1', 'f_t2', 'f_loc', 'f_att'].forEach(function (id) {
      document.getElementById(id).disabled = true;
    });
  }

  if (ro) {
    // 편집 경로를 붙이지 않는다. 서버도 막지만 화면에서도 손댈 수 없게.
    document.getElementById('title').removeAttribute('contenteditable');
    ['f_date', 'f_t1', 'f_t2', 'f_loc', 'f_att', 'f_type', 'f_status'].forEach(function (id) {
      document.getElementById(id).disabled = true;
    });
  } else {
    bindEditor(doc);
    ['title', 'f_date', 'f_t1', 'f_t2', 'f_loc', 'f_att', 'f_type', 'f_status'].forEach(function (id) {
      var el = document.getElementById(id);
      el.addEventListener('input', markDirty);
      el.addEventListener('change', markDirty);
    });
  }
  paintBadges(m);
  attachPicker(document.getElementById('f_att'));
  renderComments(m);
  renderAttachments(m, ro);
  bindDetailButtons(m, mine, ro);

  setStatus('저장됨', false);
}

function row(lab, val) { return '<div class="prop"><span class="lab">' + lab + '</span><span>' + val + '</span></div>'; }
function sel(id, opts, cur) {
  return '<select id="' + id + '">' + opts.map(function (o) {
    return '<option' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>';
  }).join('') + '</select>';
}

function refreshList() {
  return call('api_listMeetings').then(function (rows) { S.meetings = rows; renderList(); });
}


/* ══════════ 상세 화면 버튼 ══════════ */
function bindDetailButtons(m, mine, ro) {
  var link = document.getElementById('btnLink');
  if (link) link.addEventListener('click', function () {
    navigator.clipboard.writeText(location.href.split('?')[0] + '?id=' + m.id)
      .then(function () { toast('링크를 복사했어. 볼 권한이 있는 사람만 열려.'); })
      .catch(function () { toast('복사 실패. 주소창에 ?id=' + m.id + ' 를 붙여줘.'); });
  });

  var share = document.getElementById('btnShare');
  if (share && mine) share.addEventListener('click', function (e) {
    e.stopPropagation();
    openShare(m, share);
  });

  var cancel = document.getElementById('btnCancel');
  if (cancel) cancel.addEventListener('click', function () {
    var undo = m.status === '취소';
    if (!undo && !confirm('이 회의록을 "취소" 상태로 표시할까?\n\n· 회의록은 그대로 남고 목록에 취소선만 그어져\n· 구글 캘린더 일정은 건드리지 않아')) return;
    cancel.disabled = true;
    call('api_cancelMeeting', m.id, undo).then(function () {
      return refreshList().then(function () { openMeeting(m.id); });
    }).catch(function (e) { cancel.disabled = false; toast(e.message); });
  });

  var del = document.getElementById('btnDel');
  if (del) del.addEventListener('click', function () {
    if (!confirm('"' + m.title + '" 회의록을 완전히 삭제할까?\n\n· 본문·액션아이템·코멘트가 함께 지워져\n· 되돌릴 수 없어\n· 구글 캘린더 일정은 그대로 남아')) return;
    del.disabled = true;
    call('api_deleteMeeting', m.id).then(function (r) {
      S.cur = null;
      toast('삭제했어: ' + r.title);
      return refreshList().then(function () {
        if (S.meetings.length) openMeeting(S.meetings[0].id);
        else detailEl.innerHTML = '<div class="empty" style="padding:60px 0;text-align:center">회의록이 없어.</div>';
      });
    }).catch(function (e) { del.disabled = false; toast('삭제 실패: ' + e.message); });
  });
}

/* ══════════ 공개 범위 ══════════ */
var shareEl = document.getElementById('sharemenu');

function openShare(m, anchor) {
  var vis = m.visibility || '전체';
  shareEl.innerHTML =
    '<div class="sh">이 회의록을 볼 수 있는 사람</div>' +
    '<div class="opt' + (vis === '참석자' ? ' on' : '') + '" data-v="참석자">🔒' +
      '<span><b>참석자만</b><span>참석자 명단에 있는 사람과 작성자만 열 수 있어. 목록에도 안 뜸.</span></span></div>' +
    '<div class="opt' + (vis === '전체' ? ' on' : '') + '" data-v="전체">🌐' +
      '<span><b>전체 공개</b><span>example.com 계정이면 누구나 보고 고칠 수 있어.</span></span></div>' +
    '<label>읽기 권한으로 추가</label>' +
    '<input id="sh_viewers" placeholder="이름 또는 이메일, 쉼표로 구분" value="' +
      esc((m.viewers || []).join(', ')) + '">' +
    '<div class="hint">여기 넣은 사람은 <b>볼 수만</b> 있어. 본문은 못 고치고 <b>코멘트는 남길 수 있어.</b></div>';

  var r = anchor.getBoundingClientRect();
  shareEl.hidden = false;
  shareEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 310)) + 'px';
  shareEl.style.top = (r.bottom + 6) + 'px';

  [].forEach.call(shareEl.querySelectorAll('[data-v]'), function (b) {
    b.addEventListener('click', function () {
      [].forEach.call(shareEl.querySelectorAll('[data-v]'), function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      saveShare(m);
    });
  });
  var vin = document.getElementById('sh_viewers');
  attachPicker(vin);
  vin.addEventListener('change', function () { saveShare(m); });
}

function saveShare(m) {
  var on = shareEl.querySelector('[data-v].on');
  var vin = document.getElementById('sh_viewers');
  if (!on || !vin) return;

  m.visibility = on.dataset.v;
  m.viewers = vin.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);

  // 공개 범위도 본문과 같은 저장 경로로 보낸다 — rev 충돌 처리를 한 군데로 모으려고
  markDirty();
  var btn = document.getElementById('btnShare');
  if (btn) {
    btn.classList.toggle('locked', m.visibility === '참석자');
    btn.textContent = (m.visibility === '참석자' ? '🔒 참석자만' : '🌐 전체 공개') +
      (m.viewers.length ? ' +' + m.viewers.length : '');
  }
}

document.addEventListener('click', function (e) {
  if (shareEl && !shareEl.hidden && !shareEl.contains(e.target)) shareEl.hidden = true;
});

/* ══════════ 코멘트 ══════════
   본문을 못 고치는 사람도 여기엔 쓸 수 있다. 그래야 읽기 권한 공유가 의미를 갖는다. */
function renderComments(m) {
  var slot = document.getElementById('cmtSlot');
  if (!slot) return;
  var list = m.comments || [];

  slot.innerHTML = '<div class="cmts"><h3>코멘트</h3>' +
    '<p class="lead">' + (list.length ? list.length + '개' : '아직 없어') +
    ' · 이 회의록을 볼 수 있는 사람이면 누구나 남길 수 있어</p>' +
    '<div id="cmtList">' + list.map(cmtHTML).join('') + '</div>' +
    '<div class="cmtnew">' +
      '<div class="av me">' + esc(initials(S.myName || S.me)) + '</div>' +
      '<div style="flex:1">' +
        '<textarea id="cmtText" placeholder="의견이나 질문을 남겨줘"></textarea>' +
        '<div class="cmtsend"><span class="k">Ctrl+Enter</span>' +
        '<button class="btn primary" id="cmtSend">남기기</button></div>' +
      '</div>' +
    '</div></div>';

  bindComments(m);
}

function cmtHTML(c) {
  var mine = S.me && c.author && c.author.toLowerCase() === S.me.toLowerCase();
  return '<div class="cmt" data-c="' + esc(c.id) + '">' +
    '<div class="av' + (mine ? ' me' : '') + '">' + esc(initials(c.authorName)) + '</div>' +
    '<div class="bd"><div class="hd"><b>' + esc(c.authorName) + '</b>' +
      '<time>' + esc((c.createdAt || '').replace('T', ' ').slice(0, 16)) + '</time>' +
      (mine ? '<button data-del="' + esc(c.id) + '">삭제</button>' : '') +
    '</div>' + (c.blockId ? '<div class="anch">문단 코멘트</div>' : '') +
    '<div class="tx">' + esc(c.text) + '</div></div></div>';
}

function initials(s) {
  s = String(s || '?');
  return s.indexOf('@') > 0 ? s.charAt(0).toUpperCase() : s.slice(-2);
}

function bindComments(m) {
  var send = document.getElementById('cmtSend');
  var box = document.getElementById('cmtText');
  if (!send || !box) return;

  function post() {
    var t = box.value.trim();
    if (!t) return;
    send.disabled = true;
    send.innerHTML = '<span class="spin"></span>';
    call('api_addComment', m.id, t).then(function (list) {
      m.comments = list;
      box.value = '';
      renderComments(m);
    }).catch(function (e) {
      send.disabled = false;
      send.textContent = '남기기';
      toast(e.message);
    });
  }

  send.addEventListener('click', post);
  box.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); post(); }
  });

  [].forEach.call(document.querySelectorAll('[data-del]'), function (b) {
    b.addEventListener('click', function () {
      if (!confirm('이 코멘트를 지울까?')) return;
      call('api_deleteComment', b.dataset.del).then(function (list) {
        m.comments = list;
        renderComments(m);
      }).catch(function (e) { toast(e.message); });
    });
  });
}


/* ══════════ 문단 코멘트 ══════════
   회의록은 "여기 이 문장"에 대한 얘기가 대부분이라, 글 전체에 매다는 것보다
   문단에 앵커를 거는 쪽이 훨씬 쓸모 있다. blockId 로 묶어 둔다. */
var cgut = document.getElementById('cgutter');
var cthread = document.getElementById('cthread');
var cHot = null;      // 지금 ＋ 버튼이 가리키는 블록
var cOpen = null;     // 열려 있는 스레드의 blockId

function byBlock(m) {
  var g = {};
  (m.comments || []).forEach(function (c) {
    if (!c.blockId) return;
    (g[c.blockId] = g[c.blockId] || []).push(c);
  });
  return g;
}

/** 코멘트가 달린 문단에 개수 배지를 붙인다. 배지는 글이 아니므로 직렬화에서 빠진다. */
function paintBadges(m) {
  var doc = document.getElementById('doc');
  if (!doc) return;
  [].forEach.call(doc.querySelectorAll('.cbadge'), function (b) { b.remove(); });

  var g = byBlock(m);
  Object.keys(g).forEach(function (bid) {
    var blk = doc.querySelector('.b[data-id="' + bid + '"]');
    if (!blk) return;
    var b = document.createElement('span');
    b.className = 'cbadge';
    b.contentEditable = 'false';
    b.dataset.bid = bid;
    b.textContent = '💬 ' + g[bid].length;
    blk.appendChild(b);
  });
}

/* ＋ 버튼: 왼쪽 ⠿ 핸들과 같은 방식으로 하나만 두고 커서를 따라 옮긴다 */
function moveCGutter(blk) {
  if (!cgut) return;
  // 이미 코멘트가 있는 문단은 배지가 그 자리를 쓴다 — 둘이 겹치면 아무것도 못 누른다
  if (!blk || blk.querySelector('.cbadge')) { cgut.hidden = true; cHot = null; return; }
  cHot = blk;
  var p = posIn(blk);
  cgut.hidden = false;
  cgut.style.top = (p.top + 1) + 'px';
  cgut.style.left = (p.left + p.w + 12) + 'px';
}

if (cgut) {
  cgut.addEventListener('click', function (e) {
    e.stopPropagation();
    if (cHot) openThread(cHot.dataset.id, cgut);
  });
}

document.addEventListener('click', function (e) {
  if (!cthread || cthread.hidden) return;
  if (cthread.contains(e.target)) return;
  if (e.target.closest && (e.target.closest('.cbadge') || e.target.closest('#cgutter'))) return;
  cthread.hidden = true;
  cOpen = null;
});

function openThread(blockId, anchor) {
  var m = S.cur;
  if (!m || !blockId) return;
  cOpen = blockId;

  var list = (m.comments || []).filter(function (c) { return c.blockId === blockId; });
  var blk = document.querySelector('.doc .b[data-id="' + blockId + '"]');
  var quote = blk ? blk.textContent.replace(/💬\s*\d+/, '').trim() : '';

  cthread.innerHTML =
    '<div class="qt">' + esc(quote.slice(0, 90) + (quote.length > 90 ? '…' : '')) + '</div>' +
    '<div class="tl">' + (list.length ? list.map(cmtHTML).join('') :
      '<p class="none">이 문단에 처음 남기는 코멘트야.</p>') + '</div>' +
    '<textarea id="ctText" placeholder="이 문단에 대해…"></textarea>' +
    '<div class="cmtsend"><span class="k">Ctrl+Enter</span>' +
    '<button class="btn primary" id="ctSend">남기기</button></div>';

  /* 글을 가리지 않는 게 핵심이다.
     본문 오른쪽 여백에 자리가 있으면 거기 세우고, 좁으면 문단 아래로 내린다. */
  cthread.hidden = false;
  var W = cthread.offsetWidth || 330;
  var mw = mainEl.clientWidth;

  if (blk) {
    var p = posIn(blk);
    var right = p.left + p.w + 56;   // --railgap 과 같은 값
    if (right + W <= mw) {
      cthread.style.left = right + 'px';
      cthread.style.top = p.top + 'px';
    } else {
      cthread.style.left = Math.max(0, Math.min(p.left, mw - W)) + 'px';
      cthread.style.top = (p.top + p.h + 8) + 'px';
    }
  } else {
    var a = posIn(anchor);
    cthread.style.left = Math.max(0, Math.min(a.left, mw - W)) + 'px';
    cthread.style.top = (a.top + 26) + 'px';
  }

  var send = document.getElementById('ctSend');
  var box = document.getElementById('ctText');
  box.focus();

  function post() {
    var t = box.value.trim();
    if (!t) return;
    send.disabled = true;
    send.innerHTML = '<span class="spin"></span>';
    call('api_addComment', m.id, t, blockId).then(function (all) {
      m.comments = all;
      paintBadges(m);
      renderComments(m);
      openThread(blockId, anchor);     // 새 글이 보이도록 다시 그린다
    }).catch(function (e) {
      send.disabled = false;
      send.textContent = '남기기';
      toast(e.message);
    });
  }
  send.addEventListener('click', post);
  box.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); post(); }
    if (e.key === 'Escape') { cthread.hidden = true; cOpen = null; }
  });

  [].forEach.call(cthread.querySelectorAll('[data-del]'), function (b) {
    b.addEventListener('click', function () {
      if (!confirm('이 코멘트를 지울까?')) return;
      call('api_deleteComment', b.dataset.del).then(function (all) {
        m.comments = all;
        paintBadges(m);
        renderComments(m);
        openThread(blockId, anchor);
      }).catch(function (e) { toast(e.message); });
    });
  });
}


/* ══════════ 사람 고르기 드롭다운 ══════════
   <datalist> 는 브라우저가 그리는 목록이라 앱 디자인과 따로 논다 —
   폭·글꼴·색을 못 잡고, 팀/직책 같은 부가 정보도 못 보여준다.
   쉼표로 구분된 입력칸에 붙는 자체 드롭다운으로 대체한다. */
var pickEl = document.getElementById('pickmenu');
var pickCtx = null;

function hidePick() { pickEl.hidden = true; pickCtx = null; }

/** 커서 앞의 마지막 쉼표 뒤 조각이 지금 입력 중인 이름이다. */
function pickSeg(input) {
  var v = input.value;
  var at = input.selectionStart == null ? v.length : input.selectionStart;
  var head = v.slice(0, at);
  var from = head.lastIndexOf(',') + 1;
  return { from: from, to: at, q: head.slice(from).trim() };
}

function drawPick(input) {
  var seg = pickSeg(input);
  var q = seg.q.toLowerCase();

  // 이미 적어 넣은 사람은 목록에서 뺀다
  var taken = {};
  input.value.split(',').forEach(function (s, i) {
    var t = s.trim().toLowerCase();
    if (t && i !== input.value.slice(0, seg.to).split(',').length - 1) taken[t] = true;
  });

  var hits = S.people.filter(function (p) {
    if (taken[p.name.toLowerCase()] || taken[p.email.toLowerCase()]) return false;
    if (!q) return true;
    return p.name.toLowerCase().indexOf(q) >= 0 || p.email.toLowerCase().indexOf(q) >= 0;
  });   // 자르지 않는다 — 인원이 9명인데 8개만 보여주면 한 명이 늘 안 보인다

  if (!hits.length) { hidePick(); return; }

  pickEl.innerHTML = '<div class="sh">구성원</div>' + hits.map(function (p, i) {
    return '<button data-nm="' + esc(p.name) + '"' + (i === 0 ? ' class="on"' : '') + '>' +
      '<span class="nm">' + esc(p.name) + '</span>' +
      '<code>' + esc([p.team, p.role].filter(Boolean).join(' · ')) + '</code></button>';
  }).join('');

  var r = input.getBoundingClientRect();
  pickEl.hidden = false;
  pickEl.style.left = Math.max(8, Math.min(r.left, window.innerWidth - r.width - 8)) + 'px';
  pickEl.style.top = (r.bottom + 4) + 'px';
  pickEl.style.width = Math.max(r.width, 230) + 'px';   // 입력칸과 같은 폭
  pickEl.style.maxHeight = '280px';
  pickEl.style.overflowY = 'auto';
  pickCtx = { input: input, seg: seg };
}

function applyPick(name) {
  if (!pickCtx) return;
  var input = pickCtx.input, seg = pickCtx.seg;
  var v = input.value;
  var before = v.slice(0, seg.from);
  var after = v.slice(seg.to);
  var pad = before && !/[\s]$/.test(before) ? ' ' : '';
  var ins = pad + name + (after.trim() ? ', ' : ', ');

  input.value = before + ins + after;
  var caret = (before + ins).length;
  input.setSelectionRange(caret, caret);
  hidePick();
  input.focus();
  input.dispatchEvent(new Event('input', { bubbles: true }));   // 자동저장이 알아채도록
}

pickEl.addEventListener('mousedown', function (e) { e.preventDefault(); });
pickEl.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-nm]');
  if (b) applyPick(b.dataset.nm);
});

/** 쉼표로 구분된 사람 입력칸에 드롭다운을 붙인다. */
function attachPicker(input) {
  if (!input || input.dataset.picker) return;
  input.dataset.picker = '1';
  input.removeAttribute('list');            // 브라우저 기본 목록은 끈다
  input.setAttribute('autocomplete', 'off');

  input.addEventListener('focus', function () { drawPick(input); });
  input.addEventListener('input', function () { drawPick(input); });
  input.addEventListener('click', function () { drawPick(input); });

  input.addEventListener('keydown', function (e) {
    if (pickEl.hidden) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); moveMenu(pickEl, e.key === 'ArrowDown' ? 1 : -1); return;
    }
    if (e.key === 'Enter' || e.key === 'Tab') {
      var on = pickEl.querySelector('button.on');
      if (on) { e.preventDefault(); applyPick(on.dataset.nm); }
      return;
    }
    if (e.key === 'Escape') { e.preventDefault(); hidePick(); }
  });

  input.addEventListener('blur', function () { setTimeout(hidePick, 120); });
}

document.addEventListener('mousedown', function (e) {
  if (pickEl.hidden) return;
  if (pickEl.contains(e.target)) return;
  if (pickCtx && e.target === pickCtx.input) return;
  hidePick();
});

/* ══════════ 해시태그 ══════════
   본문에 #태그 를 칩으로 넣는다. 저장할 때 서버가 본문에서 긁어 회의의 tags 로 올리고,
   사이드바에서 태그로 목록을 거를 수 있다. */
var tagEl = document.getElementById('tagmenu');
var tagCtx = null;

function hideTag() { tagEl.hidden = true; tagCtx = null; }

/** 지금까지 쓰인 태그를 모은다. 새 태그도 자유롭게 만들 수 있다. */
function allTags() {
  var seen = {}, out = [];
  (S.meetings || []).forEach(function (m) {
    (m.tags || []).forEach(function (t) {
      var k = String(t).trim();
      if (k && !seen[k.toLowerCase()]) { seen[k.toLowerCase()] = true; out.push(k); }
    });
  });
  return out.sort();
}

/** 블록에서 가장 먼저 나오는 텍스트 노드 — 캐럿이 줄 맨 앞인지 보려고 쓴다. */
function firstText(blk) {
  var w = document.createTreeWalker(blk, NodeFilter.SHOW_TEXT, null, false);
  return w.nextNode();
}

function maybeTag(blk) {
  try {
    var sel = window.getSelection(), r = sel.getRangeAt(0), node = r.startContainer;
    if (node.nodeType !== 3) { hideTag(); return false; }

    var head = node.textContent.slice(0, r.startOffset);
    var m = head.match(/#([^\s#]{0,24})$/);
    if (!m) { hideTag(); return false; }

    /* 줄 맨 앞의 # · ## 는 제목 단축키다. 거기서 메뉴를 띄우면 제목 칠 때마다 걸리적거린다. */
    if (head.length === m[0].length && node === firstText(blk)) { hideTag(); return false; }

    var q = m[1].trim(), ql = q.toLowerCase();
    var hits = allTags().filter(function (t) { return !ql || t.toLowerCase().indexOf(ql) >= 0; });
    var exact = hits.some(function (t) { return t.toLowerCase() === ql; });

    var html = '<div class="sh">태그</div>';
    if (q && !exact) html += '<button data-tg="' + esc(q) + '" class="on">' +
      '<span class="tag">#' + esc(q) + '</span><code>새로 만들기</code></button>';
    html += hits.map(function (t, i) {
      return '<button data-tg="' + esc(t) + '"' + ((!q || exact) && i === 0 ? ' class="on"' : '') + '>' +
        '<span class="tag">#' + esc(t) + '</span></button>';
    }).join('');
    if (!q && !hits.length) html += '<div class="none">아직 태그가 없어. 이어서 이름을 치면 새로 만들어져.</div>';

    tagEl.innerHTML = html;
    var rect = r.getBoundingClientRect();
    tagEl.hidden = false;
    tagEl.style.left = Math.max(8, Math.min(rect.left || 40, window.innerWidth - 240)) + 'px';
    tagEl.style.top  = ((rect.bottom || rect.top || 100) + 6) + 'px';
    tagEl.style.maxHeight = '280px';
    tagEl.style.overflowY = 'auto';

    tagCtx = { node: node, at: r.startOffset - m[0].length, end: r.startOffset, blk: blk };
    hideAt(); hideSlash();
    return true;
  } catch (e) { hideTag(); return false; }
}

function pickTag(name) {
  if (!tagCtx) return;
  var c = tagCtx;
  hideTag();
  insertChip(c, 'tag', '#' + name);
  markDirty();
}

tagEl.addEventListener('mousedown', function (e) { e.preventDefault(); });
tagEl.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-tg]');
  if (b) pickTag(b.dataset.tg);
});

/**
 * 멘션·태그를 칩으로 끼워 넣는다.
 * 뒤에 일반 공백 텍스트 노드를 두고 캐럿을 거기로 옮겨야,
 * 이어서 친 글자가 칩 안으로 빨려 들어가지 않는다.
 */
function insertChip(ctx, cls, text) {
  try {
    ctx.node.deleteData(ctx.at, ctx.end - ctx.at);

    var r = document.createRange();
    r.setStart(ctx.node, ctx.at);
    r.collapse(true);

    var chip = document.createElement('span');
    chip.className = cls;
    chip.textContent = text;

    var pad = document.createTextNode(' ');
    r.insertNode(pad);
    r.insertNode(chip);

    var r2 = document.createRange();
    r2.setStart(pad, 1);
    r2.collapse(true);
    var s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r2);
  } catch (e) {}
}

/* ══════════ 본문 전문 검색 ══════════
   사이드바 검색은 제목·참석자·태그만 걸린다. 본문까지 뒤지려면 시트를 읽어야 해서,
   부팅을 무겁게 하지 않으려고 사용자가 명시적으로 요청할 때만 서버에 묻는다. */
function runBodySearch() {
  var q = (qEl.value || '').trim();
  if (q.length < 2) { toast('두 글자 이상 입력해줘.'); return; }

  listEl.innerHTML = '<div class="loading"><span class="spin"></span>본문에서 찾는 중…</div>';
  call('api_searchBody', q).then(function (hits) {
    S.bodyHits = hits;
    if (!hits.length) {
      listEl.innerHTML = '<div class="empty">본문에도 "' + esc(q) + '" 가 없어.</div>';
      return;
    }
    listEl.innerHTML = '<div class="grp">본문 검색 · ' + hits.length + '건</div>' +
      hits.map(function (h) {
        return '<button class="item hit" data-id="' + esc(h.id) + '">' +
          '<span class="nm">' + esc(h.title) + '</span>' +
          '<span class="dt">' + esc((h.startAt || '').slice(5, 10).replace('-', '/')) + '</span>' +
          '<span class="snip">' + esc(h.snippet) + '</span></button>';
      }).join('') +
      '<button class="ghost bodysearch" id="btnBackList">← 목록으로</button>';

    [].forEach.call(listEl.querySelectorAll('.item'), function (b) {
      b.addEventListener('click', function () { openMeeting(b.dataset.id); });
    });
    var back = document.getElementById('btnBackList');
    if (back) back.addEventListener('click', function () { S.bodyHits = null; renderList(); });
  }).catch(function (e) {
    listEl.innerHTML = '<div class="empty">본문 검색 실패 — ' + esc(e.message) + '</div>';
  });
}

/* ══════════ 액션보드에서 바로 상태 변경 ══════════
   예전엔 보드가 읽기 전용이라, 지연 항목 하나를 고치려고 출처 회의록을 열고 닫아야 했다.
   항목 10개면 왕복 8회에 화면 전환 12회 — 매주 반복되는 고정비였다. */
var boardSt = null;

function openBoardStMenu(a, anchor) {
  boardSt = a;
  stMenu.innerHTML = '<div class="sh">상태</div>' + ST.map(function (s) {
    return '<button data-bn="' + esc(s.n) + '"' + (a.status === s.n ? ' class="on"' : '') + '>' +
      '<span class="st k-' + s.k + '">' + esc(s.n) + '</span></button>';
  }).join('');
  var r = anchor.getBoundingClientRect();
  stMenu.hidden = false;
  stMenu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 180)) + 'px';
  stMenu.style.top = (r.bottom + 6) + 'px';
}

function setBoardStatus(name) {
  var a = boardSt;
  if (!a) return;
  hideSt();
  var before = a.status;
  a.status = name;                      // 먼저 화면부터 바꾼다 — 기다림이 없게
  drawBoard();

  call('api_setActionStatus', a.meetingId, a.blockId, name).then(function () {
    // 열어 둔 회의록이 그 회의라면 본문 배지도 맞춘다
    if (S.cur && S.cur.id === a.meetingId) openMeeting(a.meetingId);
    toast('상태를 ' + name + '(으)로 바꿨어.');
  }).catch(function (e) {
    a.status = before;                  // 실패하면 되돌린다
    drawBoard();
    toast('상태를 바꾸지 못했어 — ' + e.message);
  });
}

/* ══════════ 첨부(HTML 보고서) ══════════
   보고서는 sandbox iframe(srcdoc)에 띄운다. allow-same-origin 을 주지 않아서
   보고서 안의 스크립트는 빈 출처에서 돌고 앱(google.script.run)에 닿지 못한다.
   보고서 자체의 내비게이션(이전/다음 등)은 그대로 움직인다. */
var ATT_MAX = 5 * 1024 * 1024;

function fmtSize(n) {
  return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';
}

function renderAttachments(m, ro) {
  var slot = document.getElementById('attSlot');
  if (!slot) return;
  var list = m.attachments || [];

  slot.innerHTML = list.map(function (a) {
    return '<span class="att">' +
      '<button type="button" class="att-open" data-att="' + esc(a.id) + '" data-attnm="' + esc(a.name) + '">' +
        esc(String(a.name).replace(/\.html?$/i, '')) + '</button>' +
      '<span class="att-size">' + fmtSize(a.size) + '</span>' +
      (ro ? '' : '<button type="button" class="att-del" data-attdel="' + esc(a.id) + '" ' +
                 'aria-label="첨부 삭제" title="첨부 삭제">✕</button>') +
      '</span>';
  }).join('') +
  (ro ? (list.length ? '' : '<span class="att-none">없음</span>')
      : '<button type="button" class="att-add" id="attAdd">＋ HTML 보고서</button>' +
        '<input type="file" accept=".html,.htm,text/html" id="attFile" hidden>');

  [].forEach.call(slot.querySelectorAll('[data-att]'), function (b) {
    b.addEventListener('click', function () { openAttachment(b.dataset.att, b.dataset.attnm); });
  });

  [].forEach.call(slot.querySelectorAll('[data-attdel]'), function (b) {
    b.addEventListener('click', function () {
      if (!confirm('이 첨부를 지울까? 드라이브 파일은 휴지통으로 가서 되살릴 수 있어.')) return;
      call('api_deleteAttachment', b.dataset.attdel).then(function (as) {
        m.attachments = as;
        renderAttachments(m, ro);
        toast('첨부를 지웠어.');
      }).catch(function (e) { toast('지우지 못했어 — ' + e.message); });
    });
  });

  var add = document.getElementById('attAdd'), inp = document.getElementById('attFile');
  if (!add || !inp) return;
  add.addEventListener('click', function () { inp.click(); });
  inp.addEventListener('change', function () {
    var f = inp.files && inp.files[0];
    inp.value = '';
    if (!f) return;
    if (f.size > ATT_MAX) { toast('5MB 이하 파일만 첨부할 수 있어.'); return; }

    var rd = new FileReader();
    rd.onload = function () {
      add.disabled = true;
      add.textContent = '올리는 중…';
      call('api_addAttachment', m.id, f.name, String(rd.result || '')).then(function (as) {
        m.attachments = as;
        renderAttachments(m, ro);
        toast('첨부했어.');
      }).catch(function (e) {
        renderAttachments(m, ro);
        toast('첨부하지 못했어 — ' + e.message);
      });
    };
    rd.onerror = function () { toast('파일을 읽지 못했어.'); };
    rd.readAsText(f, 'UTF-8');
  });
}

/** 전체 화면으로 연다. 닫기 버튼과 Esc(보고서 바깥에 포커스가 있을 때)로 닫는다. */
function openAttachment(id, name) {
  var view = document.createElement('div');
  view.className = 'attview';
  view.setAttribute('role', 'dialog');
  view.setAttribute('aria-label', name || '첨부 보고서');
  view.innerHTML =
    '<div class="attbar"><b>' + esc(String(name || '').replace(/\.html?$/i, '')) + '</b>' +
    '<button type="button" class="btn" id="attClose">닫기</button></div>' +
    '<div class="attbody"><div class="loading"><span class="spin"></span>여는 중…</div></div>';
  document.body.appendChild(view);

  function close() {
    document.removeEventListener('keydown', onKey, true);
    view.remove();
  }
  function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); close(); } }
  document.addEventListener('keydown', onKey, true);
  var btn = document.getElementById('attClose');
  btn.addEventListener('click', close);
  btn.focus();

  call('api_getAttachment', id).then(function (a) {
    var fr = document.createElement('iframe');
    fr.setAttribute('sandbox', 'allow-scripts');
    fr.setAttribute('title', a.name);
    fr.srcdoc = a.html;
    var body = view.querySelector('.attbody');
    if (!body) return;            // 그 사이 닫았다
    body.innerHTML = '';
    body.appendChild(fr);
  }).catch(function (e) {
    var body = view.querySelector('.attbody');
    if (body) body.innerHTML = '<div class="empty" style="padding:40px">열지 못했어 — ' + esc(e.message) + '</div>';
  });
}

/* ══════════ 테마 ══════════
   고른 값은 이 브라우저에만 남는다(사람마다 다른 게 자연스럽다).
   저장이 막힌 환경에서도 앱은 그냥 기본값으로 돌아야 하므로 전부 감싼다. */
var themeEl = document.getElementById('thememenu');

function readPref(k, d) {
  try { return localStorage.getItem('mtg.' + k) || d; } catch (e) { return d; }
}
function writePref(k, v) {
  try { localStorage.setItem('mtg.' + k, v); } catch (e) {}
}

function applyTheme() {
  var mode = readPref('theme', 'auto');
  var accent = readPref('accent', '');
  var r = document.documentElement;
  if (mode === 'auto') r.removeAttribute('data-theme');
  else r.setAttribute('data-theme', mode);
  if (accent) r.setAttribute('data-accent', accent);
  else r.removeAttribute('data-accent');

  [].forEach.call(themeEl.querySelectorAll('[data-mode]'), function (b) {
    b.classList.toggle('on', b.dataset.mode === mode);
  });
  [].forEach.call(themeEl.querySelectorAll('[data-accent]'), function (b) {
    b.classList.toggle('on', b.dataset.accent === accent);
  });
}

document.getElementById('btnTheme').addEventListener('click', function (e) {
  e.stopPropagation();
  if (!themeEl.hidden) { themeEl.hidden = true; return; }
  var r = this.getBoundingClientRect();
  themeEl.hidden = false;
  themeEl.style.left = (r.left + 4) + 'px';
  themeEl.style.top = Math.max(8, r.top - themeEl.offsetHeight - 6) + 'px';
});

themeEl.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('button');
  if (!b) return;
  if (b.dataset.mode !== undefined) writePref('theme', b.dataset.mode);
  if (b.dataset.accent !== undefined) writePref('accent', b.dataset.accent);
  applyTheme();
});

document.addEventListener('click', function (e) {
  if (!themeEl.hidden && !themeEl.contains(e.target)) themeEl.hidden = true;
});

/* ══════════ 아직 없는 화면 ══════════ */
function comingSoon(icon, title, lead, items, note) {
  return '<div class="soon"><div class="ic">' + icon + '</div>' +
    '<h2>' + esc(title) + '</h2>' +
    '<p class="badge">준비 중입니다</p>' +
    '<p>' + lead + '</p>' +
    '<ul>' + items.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
    (note ? '<p class="note">' + note + '</p>' : '') + '</div>';
}

/* ══════════ 캘린더에서 가져오기 ══════════
   회의실 캘린더엔 전사 예약이 다 들어온다. 자동으로 긁어오면 목록이 남의 일정으로 덮인다.
   그래서 목록만 보여 주고, 고른 것만 회의록으로 만든다. */
function drawCalendar() {
  if (S.calEvents) { drawCalList(); return; }   // 미리 받아둔 게 있으면 즉시
  detailEl.innerHTML = '<div class="bhead"><h2>캘린더에서 가져오기</h2></div>' +
    '<div class="loading"><span class="spin"></span>구글 캘린더에서 일정을 읽는 중…</div>';

  call('api_listCalendarEvents', 45).then(function (d) {
    S.calEvents = d.events;
    drawCalList();
  }).catch(function (e) {
    detailEl.innerHTML = comingSoon('📆', '캘린더', '아직 연결되지 않았어.',
      ['편집기 → 서비스 → <b>Calendar API v3</b> 추가',
       '편집기에서 <b>installSyncTrigger</b> 한 번 실행'],
      '오류: ' + esc(e.message));
  });
}

function drawCalList() {
  var evs = S.calEvents || [];
  var only = S.calMine;
  var minesOnly = evs.filter(function (e) { return e.mine || e.linkedId; });
  var shown = only ? minesOnly : evs;

  var html = '<div class="bhead"><h2>캘린더에서 가져오기</h2>' +
    '<span class="sub">고른 일정만 회의록이 된다. 연결한 뒤엔 양쪽이 자동으로 맞춰진다.</span></div>' +
    '<div class="filters">' +
      '<button class="fbtn' + (only ? ' on' : '') + '" data-mine="1">내가 만든 것 ' + minesOnly.length + '</button>' +
      '<button class="fbtn' + (only ? '' : ' on') + '" data-mine="">전체 ' + evs.length + '</button>' +
      '<span style="margin-left:auto;font-size:.76rem;color:var(--ink-3)">지난 2주 ~ 앞으로 6주</span>' +
    '</div>';

  if (!shown.length) {
    detailEl.innerHTML = html + '<div class="empty" style="padding:40px 0">가져올 일정이 없어.</div>';
    bindCalList();
    return;
  }

  html += '<table class="acts-t"><tbody>';
  var lastDay = '';
  shown.forEach(function (e) {
    var day = (e.startAt || '').slice(0, 10);
    if (day !== lastDay) {
      html += '<tr class="dayrow"><td colspan="4">' + esc(day.replace(/-/g, '.')) + ' ' + dow_(day) + '</td></tr>';
      lastDay = day;
    }
    html += '<tr>' +
      '<td class="due">' + esc((e.startAt || '').slice(11, 16)) + '</td>' +
      '<td class="txt">' + esc(e.title) +
        (e.repeating ? ' <span class="chip">반복</span>' : '') +
        (e.location ? '<div style="font-size:.76rem;color:var(--ink-3)">' + esc(e.location) + '</div>' : '') +
      '</td>' +
      '<td class="who">' + (e.attendees.length ? '<span class="chip">' + e.attendees.length + '명</span>' : '') + '</td>' +
      '<td style="text-align:right">' + (e.linkedId
          ? '<button class="fbtn" data-open="' + esc(e.linkedId) + '">회의록 열기 →</button>'
          : '<button class="fbtn" data-imp="' + esc(e.eventId) + '">＋ 회의록 만들기</button>') +
      '</td></tr>';
  });
  detailEl.innerHTML = html + '</tbody></table>';
  bindCalList();
}

function bindCalList() {
  [].forEach.call(detailEl.querySelectorAll('[data-mine]'), function (b) {
    b.addEventListener('click', function () { S.calMine = !!b.dataset.mine; drawCalList(); });
  });
  [].forEach.call(detailEl.querySelectorAll('[data-open]'), function (b) {
    b.addEventListener('click', function () { openMeeting(b.dataset.open); });
  });
  [].forEach.call(detailEl.querySelectorAll('[data-imp]'), function (b) {
    b.addEventListener('click', function () {
      b.disabled = true;
      b.textContent = '만드는 중…';
      call('api_importEvents', [b.dataset.imp], '').then(function (r) {
        if (!r.made.length) { toast('이미 연결된 일정이야.'); return null; }
        return refreshList().then(function () {
          toast('회의록을 만들었어.');
          openMeeting(r.made[0]);
        });
      }).catch(function (e) {
        b.disabled = false;
        b.textContent = '＋ 회의록 만들기';
        toast('실패: ' + e.message);
      });
    });
  });
}

function dow_(d) {
  if (!d) return '';
  return '(' + ['일', '월', '화', '수', '목', '금', '토'][new Date(d + 'T00:00').getDay()] + ')';
}

[].forEach.call(document.querySelectorAll('.nav'), function (b) {
  b.addEventListener('click', function () { setView(b.dataset.v); });
});

function setView(v) {
  if (v === S.view) return;
  flushSave();
  if (S.dirty) doSave();                 // 보드로 넘어가기 전에 쓰던 건 넘긴다
  S.view = v;
  [].forEach.call(document.querySelectorAll('.nav'), function (b) {
    b.classList.toggle('on', b.dataset.v === v);
  });

  if (v === 'board') drawBoard();
  else if (v === 'calendar') drawCalendar();
  else if (S.cur) renderDetail(S.cur);
  else detailEl.innerHTML = '<div class="empty" style="padding:60px 0;text-align:center">' +
    '왼쪽에서 회의를 고르거나 새로 만들어줘.</div>';
  renderList();
}

function today_() {
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function plusDays_(n) {
  var d = new Date();
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

/**
 * 완료와 보류는 기한을 따지지 않는다 — 세워 둔 일이 "지연"으로 잡히면
 * 지연 숫자가 금세 의미를 잃는다. 나머지만 기한으로 줄을 세운다.
 */
function bucketOf(a) {
  if (a.status === '완료') return 'done';
  if (a.status === '보류') return 'hold';
  if (!a.dueDate) return 'nodue';
  var t = today_();
  if (a.dueDate < t) return 'late';
  if (a.dueDate <= plusDays_(7)) return 'week';
  return 'later';
}

function stBadge(name) {
  return '<button type="button" class="st k-' + stKey(name || '요청') + '" ' +
         'aria-label="후속조치 상태: ' + esc(name || '요청') + '. 눌러서 변경">' + esc(name || '요청') + '</button>';
}

function lateCount() {
  return (S.actions || []).filter(function (a) { return bucketOf(a) === 'late'; }).length;
}

function syncLateBadge() {
  var el = document.getElementById('navLate');
  if (el) { var n = lateCount(); el.textContent = n ? n + ' 지연' : ''; }
}

function drawBoard() {
  var rows = S.actions || [];
  var who = S.boardWho || '';
  var shown = who ? rows.filter(function (a) { return a.assignee === who; }) : rows;

  var names = {};
  rows.forEach(function (a) { if (a.assignee) names[a.assignee] = (names[a.assignee] || 0) + 1; });

  var chips = '<button class="fbtn' + (who ? '' : ' on') + '" data-who="">전체 ' + rows.length + '</button>';
  Object.keys(names).sort().forEach(function (n) {
    chips += '<button class="fbtn' + (who === n ? ' on' : '') + '" data-who="' + esc(n) + '">' +
             esc(n) + ' ' + names[n] + '</button>';
  });

  var groups = [
    ['late',  '지연', true], ['week', '이번 주', false], ['later', '이후', false],
    ['nodue', '기한 없음', false], ['hold', '보류', false], ['done', '완료', false]
  ];

  var st = {};
  rows.forEach(function (a) { st[a.status] = (st[a.status] || 0) + 1; });
  var stChips = ST.filter(function (s) { return st[s.n]; }).map(function (s) {
    return '<button class="fbtn' + (S.boardSt === s.n ? ' on' : '') + '" data-st="' + esc(s.n) + '">' +
      esc(s.n) + ' ' + st[s.n] + '</button>';
  }).join('');

  if (S.boardSt) shown = shown.filter(function (a) { return a.status === S.boardSt; });

  var html = '<div class="bhead"><h2>액션아이템</h2>' +
    '<span class="sub">회의록의 후속 조치를 모아서 본다. 상태를 바꾸려면 출처 회의에서.</span></div>' +
    '<div class="filters">' + chips + '</div>' +
    '<div class="filters"><button class="fbtn' + (S.boardSt ? '' : ' on') + '" data-st="">모든 상태</button>' +
    stChips + '</div>';

  var any = false;
  groups.forEach(function (g) {
    var list = shown.filter(function (a) { return bucketOf(a) === g[0]; })
      .sort(function (a, b) { return (a.dueDate || '9999').localeCompare(b.dueDate || '9999'); });
    if (!list.length) return;
    any = true;
    html += '<div class="grouphdr' + (g[2] ? ' od' : '') + '">' + g[1] +
            '<span class="ct">' + list.length + '</span></div><table class="acts-t"><tbody>';
    list.forEach(function (a) {
      html += '<tr class="' + (a.status === '완료' ? 'done' : '') + '">' +
        '<td class="stcol" data-actst="' + esc(a.meetingId) + '|' + esc(a.blockId || '') + '">' +
          stBadge(a.status) + '</td>' +
        '<td class="txt">' + esc(a.content) + '</td>' +
        '<td class="who">' + (a.assignee
            ? '<span class="chip' + (a.assignee === myName() ? ' p' : '') + '">' + esc(a.assignee) + '</span>'
            : '<span class="chip none">담당 미정</span>') + '</td>' +
        '<td class="due">' + esc(a.dueDate || '—') + '</td>' +
        '<td>' + duePill(a) + '</td>' +
        '<td class="src" data-go="' + esc(a.meetingId) + '">' + esc(a.meetingTitle) + ' →</td>' +
        '</tr>';
    });
    html += '</tbody></table>';
  });

  if (!any) {
    html += '<div class="empty" style="padding:40px 0">' +
      (who ? esc(who) + ' 님 앞으로 잡힌 게 없어.'
           : '아직 없어. 회의록에서 <code>[] </code> 로 체크박스를 만들고 <b>@이름</b> 과 <b>9/30</b> 을 넣으면 여기 잡혀.') +
      '</div>';
  }
  detailEl.innerHTML = html;

  [].forEach.call(detailEl.querySelectorAll('[data-who]'), function (b) {
    b.addEventListener('click', function () { S.boardWho = b.dataset.who; drawBoard(); });
  });
  [].forEach.call(detailEl.querySelectorAll('[data-st]'), function (b) {
    b.addEventListener('click', function () { S.boardSt = b.dataset.st; drawBoard(); });
  });
  [].forEach.call(detailEl.querySelectorAll('[data-actst]'), function (td) {
    td.addEventListener('click', function (e) { e.stopPropagation();
      var p = td.dataset.actst.split('|');
      var hit = null;
      S.actions.forEach(function (x) {
        if (x.meetingId === p[0] && String(x.blockId || '') === (p[1] || '')) hit = x;
      });
      if (!hit) { toast('그 후속조치를 못 찾았어. 새로고침해줘.'); return; }
      if (!hit.blockId) { toast('출처 회의록에서 바꿔줘 — 이 항목은 블록 정보가 없어.'); return; }
      openBoardStMenu(hit, td);
    });
  });
  [].forEach.call(detailEl.querySelectorAll('[data-go]'), function (b) {
    b.addEventListener('click', function () { openMeeting(b.dataset.go); });
  });
  syncLateBadge();
}

function duePill(a) {
  if (a.status === '완료') return '';
  if (a.status === '보류') return '';
  if (!a.dueDate) return '';
  var t = today_();
  if (a.dueDate < t) {
    var days = Math.round((new Date(t) - new Date(a.dueDate)) / 864e5);
    return '<span class="pill late">' + days + '일 지연</span>';
  }
  var d = Math.round((new Date(a.dueDate) - new Date(t)) / 864e5);
  if (d === 0) return '<span class="pill soon">오늘</span>';
  if (d <= 7) return '<span class="pill soon">D-' + d + '</span>';
  return '';
}

function myName() {
  for (var i = 0; i < S.people.length; i++) if (S.people[i].email === S.me) return S.people[i].name;
  return '';
}

/* ══════════ 서식 허용 목록 ══════════
   본문은 제한된 HTML 로 저장된다. 붙여넣기든 저장이든 이 목록을 통과한 것만 남는다. */
var OK_TAG = { B: 'b', STRONG: 'b', I: 'i', EM: 'i', U: 'u', S: 's', STRIKE: 's', MARK: 'mark', SPAN: 'span', BR: 'br' };
var OK_CLS = /^(hl-[ygbp]|fg-[roglb]|men|tag)$/;
var BLOCKISH = /^(P|DIV|LI|H[1-6]|TR|BLOCKQUOTE|SECTION|ARTICLE)$/;

function sanitizeHTML(html) {
  var src = document.createElement('div');
  src.innerHTML = String(html == null ? '' : html);
  var out = document.createElement('div');
  sanWalk(src, out);
  return out.innerHTML;
}

function sanWalk(from, to) {
  [].forEach.call(from.childNodes, function (n) {
    if (n.nodeType === 3) { to.appendChild(document.createTextNode(n.nodeValue)); return; }
    if (n.nodeType !== 1) return;

    var tag = n.tagName;
    if (tag === 'BR') { to.appendChild(document.createElement('br')); return; }

    // 허용 안 되는 태그는 껍데기만 버리고 안의 글은 살린다
    if (!OK_TAG[tag]) {
      sanWalk(n, to);
      if (BLOCKISH.test(tag) && to.lastChild) to.appendChild(document.createElement('br'));
      return;
    }

    var cls = (n.getAttribute('class') || '').split(/\s+/).filter(function (c) { return OK_CLS.test(c); });

    // 워드·구글 문서에서 붙여넣으면 서식이 style 로 온다 — 태그로 바꿔 살린다
    var st = n.style || {}, wraps = [];
    if (/^(bold|[6-9]00)$/.test(st.fontWeight || '')) wraps.push('b');
    if (st.fontStyle === 'italic') wraps.push('i');
    if ((st.textDecorationLine || st.textDecoration || '').indexOf('underline') >= 0) wraps.push('u');
    if ((st.textDecorationLine || st.textDecoration || '').indexOf('line-through') >= 0) wraps.push('s');

    if ((tag === 'SPAN' || tag === 'MARK') && !cls.length && !wraps.length) { sanWalk(n, to); return; }

    var host = to;
    wraps.forEach(function (w) { var e = document.createElement(w); host.appendChild(e); host = e; });

    if (tag === 'SPAN' && !cls.length) { sanWalk(n, host); return; }

    var el = document.createElement(OK_TAG[tag]);
    if (cls.length) el.className = cls.join(' ');
    host.appendChild(el);
    sanWalk(n, el);
  });
}

/** 체크박스를 뺀 순수 본문 HTML. */
function htmlOf(el) {
  var c = el.cloneNode(true);
  [].forEach.call(c.querySelectorAll('.st, .cbadge'), function (k) { k.parentNode.removeChild(k); });
  return sanitizeHTML(c.innerHTML);
}

/* ══════════ 블록 ══════════ */
/* 후속 조치는 체크/미체크 두 칸으로는 안 담긴다.
   실제로는 요청해 두고 기다리거나, 피드백을 받는 중이거나, 잠깐 세워 둔 상태가 있다. */
var ST = [
  { k: 'req',  n: '요청' },
  { k: 'prog', n: '진행' },
  { k: 'fb',   n: '피드백' },
  { k: 'hold', n: '보류' },
  { k: 'done', n: '완료' }
];
var ST_DEFAULT = '요청';

function stKey(name) {
  for (var i = 0; i < ST.length; i++) if (ST[i].n === name) return ST[i].k;
  return 'req';
}

function blockEl(b) {
  var el = document.createElement('div');
  el.className = 'b';
  el.dataset.t = b.t || 'p';
  el.dataset.id = b.id || uid();

  if (el.dataset.t === 'todo') {
    // 예전 데이터(done: true/false)도 그대로 열린다
    setBlockStatus(el, b.st || (b.done ? '완료' : ST_DEFAULT));
  }
  if (el.dataset.t === 'div') el.contentEditable = 'false';
  else if (b.x) el.insertAdjacentHTML('beforeend', sanitizeHTML(b.x));
  return el;
}

function stEl(name) {
  var s = document.createElement('span');
  s.className = 'st k-' + stKey(name);
  s.contentEditable = 'false';
  s.textContent = name;
  return s;
}

/** 캐럿이 지금 놓인 블록. 단축키로 상태를 바꾸려면 이게 필요하다. */
function curBlock() {
  try {
    var n = window.getSelection().getRangeAt(0).startContainer;
    if (n.nodeType === 3) n = n.parentNode;
    return n.closest ? n.closest(".b") : null;
  } catch (e) { return null; }
}

function setBlockStatus(el, name) {
  el.dataset.st = name;
  el.classList.toggle('st-done', name === '완료');
  el.classList.toggle('st-hold', name === '보류');
  var old = el.querySelector(':scope > .st');
  var fresh = stEl(name);
  if (old) el.replaceChild(fresh, old);
  else el.insertBefore(fresh, el.firstChild);
}

/** 상태 배지는 글이 아니다 — 잘라내기·이어붙이기·직렬화에서 전부 빼야 한다. */
function isChk(n) {
  return n.nodeType === 1 && n.classList &&
         (n.classList.contains('st') || n.classList.contains('cbadge'));
}

/** 캐럿을 놓을 텍스트 노드. 없으면 하나 만들어 둔다. */
function textNode(el) {
  var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode: function (n) { return isChk(n.parentNode) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; } });
  var n = w.nextNode();
  if (n) return n;
  var t = document.createTextNode('');
  el.appendChild(t);
  return t;
}

function caret(el, pos) {
  if (el.dataset.t === 'div') return;
  var r = document.createRange(), s = window.getSelection();
  if (pos < 0) { r.selectNodeContents(el); r.collapse(false); }
  else { var tn = textNode(el); r.setStart(tn, Math.min(pos, tn.length)); r.collapse(true); }
  s.removeAllRanges(); s.addRange(r);
}

/** 타입만 갈아끼우고 서식이 붙은 내용은 그대로 옮긴다. */
function setType(el, t) {
  var kids = [].slice.call(el.childNodes).filter(function (n) { return !isChk(n); });
  el.dataset.t = t;
  el.classList.remove('done');
  el.removeAttribute('contenteditable');
  while (el.firstChild) el.removeChild(el.firstChild);
  if (t === 'todo') setBlockStatus(el, ST_DEFAULT);
  if (t === 'div') el.contentEditable = 'false';
  else kids.forEach(function (n) { el.appendChild(n); });
}

function blockOf(node) {
  var doc = document.getElementById('doc');
  while (node && node !== doc) {
    if (node.parentNode === doc) return node;
    node = node.parentNode;
  }
  return null;
}

function serialize() {
  var doc = document.getElementById('doc');
  return [].map.call(doc.children, function (el) {
    return {
      id: el.dataset.id || uid(),
      t: el.dataset.t || 'p',
      x: el.dataset.t === 'div' ? '' : htmlOf(el),
      st: el.dataset.t === 'todo' ? (el.dataset.st || ST_DEFAULT) : ''
    };
  });
}

/* ══════════ 에디터 ══════════ */
var MD = [
  [/^# /, 'h2'], [/^## /, 'h3'], [/^- /, 'ul'],
  [/^\[\] /, 'todo'], [/^\[ \] /, 'todo'], [/^> /, 'quote'], [/^---$/, 'div']
];

function bindEditor(doc) {
  // 코멘트 배지를 누르면 그 문단 스레드가 열린다
  doc.addEventListener('click', function (e) {
    var bg = e.target.closest && e.target.closest('.cbadge');
    if (!bg) return;
    e.preventDefault();
    e.stopPropagation();
    openThread(bg.dataset.bid, bg);
  });

  // 상태 배지를 누르면 다섯 가지 중에 고른다
  doc.addEventListener('click', function (e) {
    var badge = e.target.closest && e.target.closest('.st');
    if (!badge) return;
    e.preventDefault();
    e.stopPropagation();
    boardSt = null;
    openStMenu(badge.parentNode, badge);
  });

  doc.addEventListener('keydown', function (e) {
    /* 블록 이동·복제·삭제는 단축키가 있는데, 정작 제일 자주 쓰는 상태 전환만 마우스 전용이었다. */
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key >= '1' && e.key <= '5') {
      var b = curBlock();
      if (b && b.dataset.t === 'todo') {
        e.preventDefault();
        setBlockStatus(b, ST[Number(e.key) - 1].n);
        return;
      }
    }
    if (!tagEl.hidden) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moveMenu(tagEl, e.key === 'ArrowDown' ? 1 : -1); return; }
      if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        var onT = tagEl.querySelector('button.on');
        if (onT) pickTag(onT.dataset.tg);
        return;
      }
      if (e.key === 'Escape') { e.preventDefault(); hideTag(); return; }
    }
    if (!atEl.hidden) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moveMenu(atEl, e.key === 'ArrowDown' ? 1 : -1); return; }
      if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        var on = atEl.querySelector('button.on');
        if (on) pickAt(on.dataset.nm);
        return;
      }
      if (e.key === 'Escape') { e.preventDefault(); hideAt(); return; }
    }
    if (!slashEl.hidden) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moveSlash(e.key === 'ArrowDown' ? 1 : -1); return; }
      if (e.key === 'Enter') { e.preventDefault(); var on = slashEl.querySelector('button.on'); if (on) on.click(); return; }
      if (e.key === 'Escape') { e.preventDefault(); hideSlash(); return; }
    }

    var blk = blockOf(window.getSelection().anchorNode);
    if (!blk) return;

    // 블록 통째로 다루기 — 캐럿이 있는 블록이 대상이다
    var mod = e.ctrlKey || e.metaKey;
    if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      e.preventDefault();
      blockAction(e.key === 'ArrowUp' ? 'up' : 'down', blk);
      caret(blk, -1);
      return;
    }
    if (mod && e.shiftKey && e.key === 'Backspace') { e.preventDefault(); blockAction('del', blk); return; }
    if (mod && e.shiftKey && (e.key === 'D' || e.key === 'd')) { e.preventDefault(); blockAction('dup', blk); return; }

    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      var t = blk.dataset.t;
      var tail = cutTail(blk);                       // 서식까지 통째로 떼어 온다
      var hasTail = !!(tail && tail.textContent.length);
      // 빈 리스트 항목에서 Enter 를 또 누르면 목록을 빠져나온다
      if ((t === 'ul' || t === 'todo') && !blk.textContent.trim() && !hasTail) {
        setType(blk, 'p'); caret(blk, 0); markDirty(); return;
      }
      var nb = blockEl({ t: (t === 'ul' || t === 'todo') ? t : 'p', x: '' });
      if (tail) nb.appendChild(tail);
      blk.parentNode.insertBefore(nb, blk.nextSibling);
      caret(nb, 0);
      markDirty();
      return;
    }

    if (e.key === 'Backspace') {
      var s = window.getSelection();
      if (!s.isCollapsed || s.anchorOffset !== 0) return;
      if (s.anchorNode !== textNode(blk) && s.anchorNode !== blk) return;
      e.preventDefault();

      if (blk.dataset.t !== 'p') { setType(blk, 'p'); caret(blk, 0); markDirty(); return; }

      var prev = blk.previousElementSibling;
      if (!prev) return;
      if (prev.dataset.t === 'div') { prev.remove(); markDirty(); return; }

      // 이어붙일 자리에 빈 텍스트 노드를 심어 두고, 서식이 붙은 자식들을 그대로 옮긴다
      var seam = document.createTextNode('');
      prev.appendChild(seam);
      [].slice.call(blk.childNodes).forEach(function (n) { if (!isChk(n)) prev.appendChild(n); });
      blk.remove();

      var r = document.createRange(), s = window.getSelection();
      r.setStart(seam, 0); r.collapse(true);
      s.removeAllRanges(); s.addRange(r);
      markDirty();
    }
  });

  // 붙여넣기는 반드시 허용 목록을 통과시킨다. 여러 줄이면 줄마다 블록으로 쪼갠다.
  doc.addEventListener('paste', function (e) {
    e.preventDefault();
    var cd = e.clipboardData || window.clipboardData;
    if (!cd) return;
    var txt = cd.getData('text/plain') || '';
    var html = cd.getData('text/html') || '';

    if (txt.indexOf('\n') === -1) {
      document.execCommand('insertHTML', false, html ? sanitizeHTML(html) : escapeHTML(txt));
      markDirty();
      return;
    }

    var blk = blockOf(window.getSelection().anchorNode);
    if (!blk) return;
    var lines = txt.split(/\r?\n/).filter(function (l, i, a) { return l.trim() || i === a.length - 1; });
    var tail = cutTail(blk);
    document.execCommand('insertHTML', false, escapeHTML(lines[0]));

    var at = blk;
    for (var i = 1; i < lines.length; i++) {
      var nb = blockEl({ t: 'p', x: escapeHTML(lines[i]) });
      at.parentNode.insertBefore(nb, at.nextSibling);
      at = nb;
    }
    if (tail && tail.textContent.length) at.appendChild(tail);
    caret(at, -1);
    markDirty();
  });

  doc.addEventListener('input', function () {
    var doc2 = document.getElementById('doc');
    if (!doc2.children.length) doc2.appendChild(blockEl({ t: 'p', x: '' }));

    var blk = blockOf(window.getSelection().anchorNode);
    if (blk) {
      // 마크다운 단축: "# " 를 치는 순간 제목으로 바뀐다
      if (blk.dataset.t === 'p') {
        var tx = blk.textContent;
        for (var i = 0; i < MD.length; i++) {
          var m = tx.match(MD[i][0]);
          if (m) {
            textNode(blk).deleteData(0, m[0].length);
            setType(blk, MD[i][1]);
            if (MD[i][1] === 'div') {
              var nb = blockEl({ t: 'p', x: '' });
              blk.parentNode.insertBefore(nb, blk.nextSibling);
              caret(nb, 0);
            } else caret(blk, 0);
            break;
          }
        }
      }
      if (maybeAt(blk)) hideTag();
      else if (!maybeTag(blk)) maybeSlash(blk);
    }
    markDirty();
  });
}

// 회의를 열 때마다 에디터를 새로 그리므로, 문서 전역 리스너는 여기서 한 번만 건다.
document.addEventListener('click', function (e) {
  if (!slashEl.hidden && !slashEl.contains(e.target)) hideSlash();
  if (!stMenu.hidden && !stMenu.contains(e.target)) hideSt();
  if (!tagEl.hidden && !tagEl.contains(e.target)) hideTag();
  if (!blkMenu.hidden && !blkMenu.contains(e.target) && e.target !== gDrag) blkMenu.hidden = true;
});

/* ══════════ 인라인 서식 ══════════ */
var fmtEl = document.getElementById('fmt');

function hideFmt() { fmtEl.hidden = true; }

/** 글자를 고르면 그 위에 막대가 뜬다. 고른 게 없으면 숨는다. */
function syncFmt() {
  var doc = document.getElementById('doc');
  var sel = window.getSelection();
  if (!doc || !sel || !sel.rangeCount || sel.isCollapsed) return hideFmt();

  var r = sel.getRangeAt(0);
  if (!doc.contains(r.commonAncestorContainer)) return hideFmt();

  var rect = r.getBoundingClientRect();
  if (!rect.width && !rect.height) return hideFmt();

  fmtEl.hidden = false;
  var w = fmtEl.offsetWidth || 300, h = fmtEl.offsetHeight || 32;
  fmtEl.style.left = Math.max(8, Math.min(rect.left + rect.width / 2 - w / 2, window.innerWidth - w - 8)) + 'px';
  // position:fixed 라 뷰포트 좌표를 그대로 쓴다. 위에 자리가 없으면 아래로 붙인다.
  fmtEl.style.top = (rect.top - h - 8 < 8 ? rect.bottom + 8 : rect.top - h - 8) + 'px';
}

document.addEventListener('selectionchange', syncFmt);
fmtEl.addEventListener('mousedown', function (e) { e.preventDefault(); });  // 선택이 풀리지 않게

/* 막대가 안 닫히는 경우를 전부 막는다.
   본문 밖을 클릭하면 selectionchange 가 안 오기 때문에 따로 닫아 줘야 한다. */
document.addEventListener('mousedown', function (e) {
  if (fmtEl.hidden) return;
  if (fmtEl.contains(e.target)) return;                 // 막대 자신
  var doc = document.getElementById('doc');
  if (doc && doc.contains(e.target)) return;            // 본문 안이면 selectionchange 가 처리
  hideFmt();
});

document.addEventListener('keydown', function (e) {
  if (e.key === "Escape") { hideFmt(); hideSlash(); hideAt(); hideSt(); hideTag(); blkMenu.hidden = true; }
});

// 본문은 .main 안에서 스크롤된다 — 스크롤하면 붙어 있던 자리가 의미를 잃으니 닫는다
document.getElementById('main').addEventListener('scroll', function () {
  hideFmt(); hideSlash(); hideAt(); hideSt(); hideTag(); blkMenu.hidden = true;
}, { passive: true });

window.addEventListener('blur', hideFmt);

fmtEl.addEventListener('click', function (e) {
  var btn = e.target.closest && e.target.closest('button');
  if (!btn) return;

  if (btn.dataset.c) document.execCommand(btn.dataset.c, false, null);
  else if (btn.dataset.hl) wrapSel('mark', btn.dataset.hl);
  else if (btn.dataset.fg) wrapSel('span', btn.dataset.fg);
  else if (btn.dataset.clear) clearFmt();

  markDirty();
  syncFmt();
});

/**
 * 고른 범위를 태그로 감싼다. 같은 색이 이미 걸려 있으면 벗긴다(토글).
 * surroundContents 는 범위가 태그 경계를 걸치면 던지므로, 그때는 꺼내서 다시 넣는다.
 */
function wrapSel(tag, cls) {
  var sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;

  var same = closestFmt(sel.getRangeAt(0).commonAncestorContainer, cls);
  if (same) { unwrap(same); return; }

  var r = sel.getRangeAt(0);
  var el = document.createElement(tag);
  el.className = cls;
  try { r.surroundContents(el); }
  catch (e) { el.appendChild(r.extractContents()); r.insertNode(el); }

  var nr = document.createRange();
  nr.selectNodeContents(el);
  sel.removeAllRanges(); sel.addRange(nr);
}

function closestFmt(node, cls) {
  var doc = document.getElementById('doc');
  while (node && node !== doc) {
    if (node.nodeType === 1 && node.classList && node.classList.contains(cls)) return node;
    node = node.parentNode;
  }
  return null;
}

function unwrap(el) {
  var p = el.parentNode;
  while (el.firstChild) p.insertBefore(el.firstChild, el);
  p.removeChild(el);
  p.normalize();
}

/** 고른 범위의 서식을 전부 벗긴다 — 굵기·기울임뿐 아니라 형광펜·글자색까지. */
function clearFmt() {
  var sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  document.execCommand('removeFormat', false, null);

  var doc = document.getElementById('doc');
  var r = sel.getRangeAt(0);
  [].slice.call(doc.querySelectorAll('mark,span[class]')).forEach(function (el) {
    if (r.intersectsNode(el)) unwrap(el);
  });
}

/* ══════════ 블록 이동 · 삭제 ══════════ */
var mainEl  = document.getElementById('main');
var gutter  = document.getElementById('gutter');
var gDrag   = document.getElementById('gDrag');
var dropEl  = document.getElementById('dropline');
var blkMenu = document.getElementById('blkmenu');
var hotBlk  = null;   // 지금 핸들이 가리키는 블록
var drag    = null;

// posIn() 은 .main 기준 좌표를 준다. 핸들과 삽입선도 .main 안에 있어야 기준이 맞는다.
// (#detail 만 다시 그려지므로 .main 의 다른 자식은 살아남는다)
mainEl.appendChild(gutter);
mainEl.appendChild(dropEl);
if (cgut) mainEl.appendChild(cgut);       // 코멘트 ＋ 도 같은 좌표계여야 한다
if (cthread) mainEl.appendChild(cthread); // 스레드도 — 본문 옆에 나란히 세우려고

/** 요소의 위치를 .main 의 스크롤 좌표계로 옮긴다. 핸들과 삽입선이 같은 기준을 쓴다. */
function posIn(el) {
  var r = el.getBoundingClientRect(), m = mainEl.getBoundingClientRect();
  return { top: r.top - m.top + mainEl.scrollTop, left: r.left - m.left, h: r.height, w: r.width };
}

mainEl.addEventListener('mousemove', function (e) {
  if (drag) return;
  var doc = document.getElementById('doc');
  if (!doc) return;

  var el = document.elementFromPoint(e.clientX, e.clientY);
  var blk = el && el !== doc ? blockOf(el) : null;
  if (!blk) {
    // 블록 왼쪽 여백에 있어도 핸들이 유지되도록, 같은 높이의 블록을 찾아준다
    var m = mainEl.getBoundingClientRect();
    if (e.clientX > m.left && e.clientX < m.right) {
      [].forEach.call(doc.children, function (b) {
        var r = b.getBoundingClientRect();
        if (e.clientY >= r.top && e.clientY <= r.bottom) blk = b;
      });
    }
  }
  if (!blk) { gutter.hidden = true; hotBlk = null; moveCGutter(null); return; }

  hotBlk = blk;
  var p = posIn(blk);
  gutter.hidden = false;
  gutter.style.top = (p.top + 1) + 'px';
  gutter.style.left = Math.max(2, p.left - 26) + 'px';
  moveCGutter(blk);
});

mainEl.addEventListener('mouseleave', function () {
  if (!drag && blkMenu.hidden) { gutter.hidden = true; hotBlk = null; if (cthread.hidden) moveCGutter(null); }
});

/* ── 끌어서 이동 ── */
gDrag.addEventListener('mousedown', function (e) {
  if (!hotBlk) return;
  e.preventDefault();
  drag = { el: hotBlk, moved: false, target: null };
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
});

function onDragMove(e) {
  if (!drag) return;
  if (!drag.moved) { drag.moved = true; drag.el.classList.add('dragging'); blkMenu.hidden = true; }

  var doc = document.getElementById('doc');
  var kids = [].slice.call(doc.children);
  var t = null;
  for (var i = 0; i < kids.length; i++) {
    var r = kids[i].getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) { t = { el: kids[i], before: true }; break; }
  }
  if (!t) t = { el: kids[kids.length - 1], before: false };
  drag.target = t;

  var p = posIn(t.el);
  dropEl.hidden = false;
  dropEl.style.top = (t.before ? p.top - 1 : p.top + p.h - 1) + 'px';
  dropEl.style.left = p.left + 'px';
  dropEl.style.width = p.w + 'px';
}

function onDragEnd() {
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
  dropEl.hidden = true;
  if (!drag) return;

  var d = drag;
  drag = null;
  d.el.classList.remove('dragging');

  if (!d.moved) { openBlkMenu(); return; }          // 끌지 않고 눌렀다 뗐으면 메뉴
  if (!d.target || d.target.el === d.el) return;

  if (d.target.before) d.target.el.parentNode.insertBefore(d.el, d.target.el);
  else d.target.el.parentNode.insertBefore(d.el, d.target.el.nextSibling);
  markDirty();
}

/* ── 핸들 메뉴 ── */
function openBlkMenu() {
  if (!hotBlk) return;
  var r = gutter.getBoundingClientRect();
  blkMenu.hidden = false;
  blkMenu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 230)) + 'px';
  blkMenu.style.top = (r.bottom + 4) + 'px';
}

blkMenu.addEventListener('mousedown', function (e) { e.preventDefault(); });
blkMenu.addEventListener('click', function (e) {
  var btn = e.target.closest && e.target.closest('[data-a]');
  if (!btn || !hotBlk) return;
  blkMenu.hidden = true;
  blockAction(btn.dataset.a, hotBlk);
});

/** 위/아래 이동, 복제, 삭제. 마지막 블록을 지우면 빈 문단 하나는 남긴다. */
function blockAction(a, blk) {
  var doc = document.getElementById('doc');
  if (!doc || !blk || blk.parentNode !== doc) return;

  if (a === 'up') {
    var prev = blk.previousElementSibling;
    if (prev) doc.insertBefore(blk, prev);
  } else if (a === 'down') {
    var next = blk.nextElementSibling;
    if (next) doc.insertBefore(next, blk);
  } else if (a === 'dup') {
    var copy = blockEl({ t: blk.dataset.t, x: htmlOf(blk), st: blk.dataset.st });
    doc.insertBefore(copy, blk.nextSibling);
    caret(copy, -1);
  } else if (a === 'del') {
    var focus = blk.previousElementSibling || blk.nextElementSibling;
    blk.remove();
    if (!doc.children.length) {
      focus = blockEl({ t: 'p', x: '' });
      doc.appendChild(focus);
    }
    if (focus) caret(focus, -1);
    hotBlk = null;
    gutter.hidden = true;
  }
  markDirty();
}

/** 캐럿 뒤쪽을 서식째 떼어 낸다. 새 블록에 그대로 붙일 수 있는 조각을 돌려준다. */
function cutTail(blk) {
  try {
    var sel = window.getSelection(), r = sel.getRangeAt(0);
    var rr = document.createRange();
    rr.selectNodeContents(blk);
    rr.setStart(r.endContainer, r.endOffset);
    return rr.extractContents();
  } catch (e) { return null; }
}

function escapeHTML(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ── / 커맨드 ── */
var slashCtx = null;

function maybeSlash(blk) {
  try {
    var sel = window.getSelection(), r = sel.getRangeAt(0), node = r.startContainer;
    if (node.nodeType !== 3 || node.textContent.slice(0, r.startOffset).slice(-1) !== '/') return hideSlash();

    var rect = r.getBoundingClientRect();
    slashEl.hidden = false;
    slashEl.style.left = Math.max(8, Math.min(rect.left || 40, window.innerWidth - 230)) + 'px';
    slashEl.style.top  = ((rect.bottom || rect.top || 100) + 6) + 'px';
    [].forEach.call(slashEl.querySelectorAll('button'), function (b, i) { b.classList.toggle('on', i === 0); });
    slashCtx = { node: node, offset: r.startOffset, blk: blk };
  } catch (e) { hideSlash(); }
}

function hideSlash() { slashEl.hidden = true; slashCtx = null; }

/* ── 후속 조치 상태 ── */
var stMenu = document.getElementById('stmenu');
var stBlk = null;

function openStMenu(blk, anchor) {
  stBlk = blk;
  stMenu.innerHTML = '<div class="sh">상태</div>' + ST.map(function (s) {
    return '<button data-n="' + esc(s.n) + '"' +
      (blk.dataset.st === s.n ? ' class="on"' : '') + '>' +
      '<span class="st k-' + s.k + '">' + esc(s.n) + '</span></button>';
  }).join('');

  var r = anchor.getBoundingClientRect();
  stMenu.hidden = false;
  stMenu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 180)) + 'px';
  stMenu.style.top = (r.bottom + 6) + 'px';
}

function hideSt() { stMenu.hidden = true; stBlk = null; }

stMenu.addEventListener('mousedown', function (e) { e.preventDefault(); });
stMenu.addEventListener('click', function (e) {
  var bb = e.target.closest && e.target.closest('[data-bn]');
