  if (bb) { setBoardStatus(bb.dataset.bn); return; }
  var b = e.target.closest && e.target.closest('[data-n]');
  if (!b || !stBlk) return;
  setBlockStatus(stBlk, b.dataset.n);
  hideSt();
  markDirty();
});

/* ── @ 멘션 ──
   저장할 때 서버가 "@이름" 을 정규식으로 읽어 담당자로 뽑는다.
   손으로 쳐도 되지만, 골라 넣으면 명부의 이름과 정확히 맞아서 액션보드에서 안 흩어진다. */
var atEl = document.getElementById('atmenu');
var atCtx = null;

function hideAt() { atEl.hidden = true; atCtx = null; }

function maybeAt(blk) {
  try {
    var sel = window.getSelection(), r = sel.getRangeAt(0), node = r.startContainer;
    if (node.nodeType !== 3) { hideAt(); return false; }

    var m = node.textContent.slice(0, r.startOffset).match(/@([^\s@]{0,12})$/);
    if (!m) { hideAt(); return false; }

    var q = m[1].toLowerCase();
    var hits = S.people.filter(function (p) {
      return !q || p.name.toLowerCase().indexOf(q) === 0 || p.email.toLowerCase().indexOf(q) === 0;
    });   // 자르지 않는다 — 인원보다 적게 보여주면 늘 누군가 빠진다
    if (!hits.length) { hideAt(); return false; }

    atEl.innerHTML = '<div class="sh">담당자</div>' + hits.map(function (p, i) {
      return '<button data-nm="' + esc(p.name) + '"' + (i === 0 ? ' class="on"' : '') + '>' +
        esc(p.name) + '<code>' + esc([p.team, p.role].filter(Boolean).join(' · ')) + '</code></button>';
    }).join('');

    var rect = r.getBoundingClientRect();
    atEl.hidden = false;
    atEl.style.left = Math.max(8, Math.min(rect.left || 40, window.innerWidth - 230)) + 'px';
    atEl.style.top  = ((rect.bottom || rect.top || 100) + 6) + 'px';
    atEl.style.maxHeight = '280px';
    atEl.style.overflowY = 'auto';
    atCtx = { node: node, at: r.startOffset - m[0].length, end: r.startOffset, blk: blk };
    hideSlash();
    return true;
  } catch (e) { hideAt(); return false; }
}

function pickAt(name) {
  if (!atCtx) return;
  var c = atCtx;
  hideAt();
  insertChip(c, 'men', '@' + name);
  markDirty();
}

atEl.addEventListener('mousedown', function (e) { e.preventDefault(); });
atEl.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-nm]');
  if (b) pickAt(b.dataset.nm);
});

function moveSlash(dir) { moveMenu(slashEl, dir); }

function moveMenu(menu, dir) {
  var btns = [].slice.call(menu.querySelectorAll('button'));
  if (!btns.length) return;
  var i = -1;
  btns.forEach(function (b, k) { if (b.classList.contains('on')) i = k; });
  btns.forEach(function (b) { b.classList.remove('on'); });
  btns[(i + dir + btns.length) % btns.length].classList.add('on');
}

slashEl.addEventListener('mousedown', function (e) { e.preventDefault(); });
slashEl.addEventListener('click', function (e) {
  var btn = e.target.closest && e.target.closest('[data-t]');
  if (!btn || !slashCtx) return;
  var c = slashCtx, t = btn.dataset.t;
  hideSlash();
  try {
    c.node.deleteData(c.offset - 1, 1);           // 방금 친 "/" 를 지우고
    setType(c.blk, t);                             // 블록 타입을 바꾼다
    if (t === 'div') {
      var nb = blockEl({ t: 'p', x: '' });
      c.blk.parentNode.insertBefore(nb, c.blk.nextSibling);
      caret(nb, 0);
    } else caret(c.blk, -1);
  } catch (e2) {}
  markDirty();
});

/* ══════════ 자동저장 ══════════ */
function setStatus(txt, busy) {
  var s = document.getElementById('saveTxt'), p = document.getElementById('pulse');
  if (s) s.textContent = txt;
  if (p) p.className = 'pulse' + (busy ? ' busy' : '');
}

function markDirty() {
  if (!S.cur) return;
  S.dirty = true;
  setStatus('수정됨', true);   // 실제로 보내는 순간에만 '저장 중'
  clearTimeout(S.timer);
  S.timer = setTimeout(doSave, 1000);
}

function flushSave() { if (S.timer) { clearTimeout(S.timer); S.timer = null; } }

function val(id) { var e = document.getElementById(id); return e ? e.value : ''; }

function doSave() {
  if (!S.cur) return;

  /* 저장 왕복 중에 타이머가 터지면 예전엔 그냥 빠져나가고 다시 예약하지 않았다.
     그 사이에 친 글자는 영영 저장되지 않는데, 앞선 저장의 성공 콜백이
     "저장됨"을 찍어서 화면은 저장됐다고 거짓말을 했다. */
  if (S.saving) { clearTimeout(S.timer); S.timer = setTimeout(doSave, 400); return; }

  var titleEl = document.getElementById('title');
  if (!titleEl) return;

  /* 응답이 늦게 도착하는 사이에 다른 회의로 옮겨갈 수 있다.
     그때 S.cur 을 다시 읽으면 A 의 저장 결과가 B 에 꽂힌다 — 대상을 여기서 고정한다. */
  var cur = S.cur;

  S.timer = null;
  S.saving = true;
  setStatus('저장 중…', true);
  var d = val('f_date');
  var locked = !!cur.gcalEventId;
  var payload = {
    id: cur.id,
    rev: cur.rev,
    meta: {
      title: locked ? undefined : titleEl.textContent.trim(),
      type: val('f_type'),
      status: val('f_status'),
      location: locked ? undefined : val('f_loc'),
      startAt: locked ? undefined : (d && val('f_t1') ? d + 'T' + val('f_t1') : (d || '')),
      endAt:   locked ? undefined : (d && val('f_t2') ? d + 'T' + val('f_t2') : ''),
      attendees: locked ? undefined :
        val('f_att').split(',').map(function (s) { return s.trim(); }).filter(Boolean),
      visibility: cur.visibility,
      viewers: cur.viewers || []
    },
    body: serialize()
  };
  /* 보내는 순간 들고 있는 본문도 지금 화면으로 맞춘다. 응답 전에 다른 회의에 갔다가
     돌아오면 캐시에서 그리는데, 그때 고치기 전 본문이 나오면 방금 친 내용을 덮어쓰게 된다.
     todoSig 비교용으로 이전 본문은 따로 쥐고 있는다. */
  var prevBody = cur.body;
  cur.body = payload.body;

  /* 응답이 오지도 실패하지도 않으면 S.saving 이 true 로 굳어서 이후 저장이 전부 무시된다.
     화면은 "저장 중…"을 계속 띄우고 사용자는 그걸 믿는다. */
  var alive = true;
  var watchdog = setTimeout(function () {
    if (!alive) return;
    alive = false;
    S.saving = false;
    saveFailed(cur, { message: '응답이 없습니다' });
  }, 25000);

  call('api_saveMeeting', payload).then(function (r) {
    if (!alive) return;
    alive = false; clearTimeout(watchdog);
    S.saving = false;
    S.retry = 0;
    clearBanner();

    applyServerMeta(cur, r);
    /* 응답 전에 다른 회의로 넘어갔어도 본문은 맞춘다. 예전엔 rev 만 새것이고 본문은 옛것으로 남아,
       본문을 캐시해 두면 마지막 1초 안에 친 내용이 경고 없이 사라질 수 있었다. */
    var todoChanged = todoSig(prevBody) !== todoSig(payload.body);
    cur.body = payload.body;
    S.mcache[cur.id] = cur;

    if (S.cur === cur) {
      S.dirty = false;
      var sync = document.querySelector('.savebar .sync');
      if (sync) sync.textContent = 'rev ' + r.rev + ' · ' + (cur.syncState || '');
      setStatus('저장됨 · ' + String(r.updatedAt || '').slice(11, 16), false);
      if (r.warn) banner('warn', r.warn, null);
      var p = document.getElementById('saveTxt');
      if (p) p.classList.remove('danger');
    }
    renderList();

    // 후속 조치가 바뀐 때만 받는다. 예전엔 자동저장마다 서버 실행이 2번씩 돌았다.
    if (todoChanged) call('api_listActions').then(function (as) {
      S.actions = as;
      syncLateBadge();
      if (S.view === 'board') drawBoard();
    }).catch(function () { toast('액션보드 갱신에 실패했어. 새로고침하면 맞춰져.'); });

  }).catch(function (e) {
    if (!alive) return;
    alive = false; clearTimeout(watchdog);
    S.saving = false;
    if (e.code === 'CONFLICT') { showConflict(e, cur); return; }
    if (e.code === 'TOO_LONG') { S.dirty = true; banner('danger', e.message, null); setStatus('저장 안 됨 — 너무 김', false); return; }
    saveFailed(cur, e);
  });
}

/**
 * 서버가 확정한 값으로 회의와 목록 행을 맞춘다.
 * '보낸 값'이 아니라 '받은 값'이어야 한다 — 서버는 빈 제목을 거부하고,
 * 태그는 본문에서 새로 뽑고, 캘린더가 주인인 항목은 아예 받지 않는다.
 * 예전엔 rev 와 tags 만 맞춰서, 탭을 다녀오면 옛 제목이 되살아나 시트를 덮어썼다.
 */
/** 후속 조치 블록만 뽑은 지문. 저장 전후가 같으면 액션보드를 다시 받을 필요가 없다. */
function todoSig(body) {
  return JSON.stringify((body || []).filter(function (b) { return b.t === 'todo'; })
    .map(function (b) { return [b.id, b.x, b.st]; }));
}

function applyServerMeta(m, r) {
  if (!m || !r || !r.meta) return;
  var F = ['title', 'type', 'status', 'location', 'startAt', 'endAt',
           'attendees', 'tags', 'visibility', 'viewers'];
  F.forEach(function (k) { if (r.meta[k] !== undefined) m[k] = r.meta[k]; });
  m.rev = r.rev;
  m.updatedBy = r.updatedBy;
  m.updatedAt = r.updatedAt;

  for (var i = 0; i < S.meetings.length; i++) {
    if (S.meetings[i].id !== m.id) continue;
    F.forEach(function (k) { if (r.meta[k] !== undefined) S.meetings[i][k] = r.meta[k]; });
    S.meetings[i].rev = r.rev;
    break;
  }
  // 제목 칸이 서버 값과 다르면(빈 제목을 거부당한 경우) 화면을 서버에 맞춘다
  if (S.cur === m) {
    var t = document.getElementById('title');
    if (t && r.meta.title !== undefined && t.textContent.trim() !== r.meta.title) {
      t.textContent = r.meta.title;
    }
  }
}

/** 저장 실패. 조용히 회색 글씨만 바꾸던 걸 배너 + 자동 재시도로 바꾼다. */
function saveFailed(cur, e) {
  S.dirty = true;
  S.retry = (S.retry || 0) + 1;
  var msg = (e && e.message) || '알 수 없는 오류';

  if (S.retry <= 5 && navigator.onLine !== false) {
    var wait = Math.min(1000 * Math.pow(2, S.retry), 15000);
    clearTimeout(S.timer);
    S.timer = setTimeout(doSave, wait);
    banner('warn', '저장이 안 되고 있어 — ' + Math.round(wait / 1000) + '초 뒤 다시 시도할게 (' +
                   S.retry + '/5)', null);
    setStatus('재시도 중…', true);
  } else {
    banner('danger', '저장 실패 — ' + msg + '. 지금 화면의 내용은 아직 서버에 없어.',
      [{ t: '지금 다시 시도', f: function () { S.retry = 0; doSave(); } },
       { t: '내 수정본 복사', f: function () { copyDraft(cur); } }]);
    setStatus('저장 실패', false);
    var p = document.getElementById('saveTxt');
    if (p) p.classList.add('danger');
  }
}

/* ══════════ 배너 ══════════ */
function banner(kind, text, actions) {
  var slot = document.getElementById('bannerSlot');
  if (!slot) { toast(text); return; }
  var html = '<div class="banner ' + kind + '"><b>' +
    (kind === 'danger' ? '저장 안 됨' : kind === 'warn' ? '알림' : '충돌') + '</b>' +
    '<span>' + esc(text) + '</span>';
  (actions || []).forEach(function (a, i) {
    html += '<button class="btn" data-ba="' + i + '">' + esc(a.t) + '</button>';
  });
  slot.innerHTML = html + '</div>';
  (actions || []).forEach(function (a, i) {
    var b = slot.querySelector('[data-ba="' + i + '"]');
    if (b) b.addEventListener('click', a.f);
  });
}
function clearBanner() {
  var slot = document.getElementById('bannerSlot');
  if (slot) slot.innerHTML = '';
}

/** 마지막 탈출구. 서버에 못 넣은 글을 사람이 들고 나갈 수 있게 한다. */
function copyDraft(m) {
  var txt = (m && m.title ? m.title + '\n\n' : '') +
    serialize().map(function (b) {
      var t = String(b.x || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]*>/g, '')
        .replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
        .replace(/&quot;/g, '"').replace(/&amp;/g, '&');
      if (b.t === 'h2') return '\n## ' + t;
      if (b.t === 'h3') return '\n### ' + t;
      if (b.t === 'ul') return '· ' + t;
      if (b.t === 'todo') return '[' + (b.st || '요청') + '] ' + t;
      if (b.t === 'quote') return '> ' + t;
      if (b.t === 'div') return '---';
      return t;
    }).join('\n');

  function done(okMsg) { toast(okMsg); }
  try {
    navigator.clipboard.writeText(txt).then(function () { done('복사했어. 안전한 곳에 붙여넣어 둬.'); },
                                            function () { fallback(); });
  } catch (e) { fallback(); }

  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done('복사했어. 안전한 곳에 붙여넣어 둬.'); }
    catch (e2) { done('복사에 실패했어 — 본문을 직접 드래그해서 복사해줘.'); }
    document.body.removeChild(ta);
  }
}

/**
 * 충돌. 예전엔 "서버 버전 불러오기" 버튼 하나뿐이라,
 * 유일한 선택지가 45분치 회의록을 통째로 버리는 것이었다.
 */
function showConflict(e, cur) {
  var m = cur || S.cur;
  var who = (e.data && e.data.updatedBy) || '다른 사람';
  var when = String((e.data && e.data.updatedAt) || '').replace('T', ' ');
  var byCal = who === '캘린더';

  S.dirty = true;
  stashDraft(m);
  banner('conflict',
    byCal ? '구글 캘린더에서 일시·참석자가 바뀌었어. 본문은 그대로 두고 다시 저장하면 돼.'
          : who + ' 님이 ' + when + '에 먼저 저장했어. 지금 화면의 수정 내용은 아직 서버에 없어.',
    [{ t: '내 수정본 복사', f: function () { copyDraft(m); } },
     { t: '다시 저장 시도', f: function () { refetchRevThenSave(m); } },
     { t: '서버 버전 불러오기', f: function () {
         if (!confirm('지금 화면의 수정 내용은 사라지고 서버 버전으로 덮어써. 계속할까?')) return;
         openMeeting(m.id);
       } }]);
  setStatus('저장 안 됨 — 충돌', false);
}

/** 서버의 최신 rev 만 받아와 다시 저장한다. 본문은 지금 화면 것을 쓴다. */
function refetchRevThenSave(m) {
  setStatus('서버 버전 확인 중…', true);
  call('api_getMeeting', m.id).then(function (fresh) {
    m.rev = fresh.rev;
    clearBanner();
    S.retry = 0;
    doSave();
  }).catch(function (err) {
    banner('danger', '서버 버전을 못 읽었어 — ' + err.message,
      [{ t: '내 수정본 복사', f: function () { copyDraft(m); } }]);
  });
}

/** 못 보낸 초안을 이 브라우저에 남겨 둔다. 새로고침해도 글이 통째로 사라지지는 않게. */
function stashDraft(m) {
  try {
    localStorage.setItem('mtg.draft.' + m.id,
      JSON.stringify({ at: Date.now(), title: m.title, body: serialize() }));
  } catch (e) {}
}

window.addEventListener('offline', function () {
  if (S.cur) banner('warn', '인터넷이 끊겼어. 지금 쓰는 내용은 아직 서버에 없어 — 연결되면 자동으로 보낼게.', null);
});
window.addEventListener('online', function () {
  if (S.dirty) { S.retry = 0; clearBanner(); doSave(); } else clearBanner();
});

/** 진짜로 안 넘어간 변경이 있을 때만 붙잡는다. 매번 물으면 아무도 안 읽게 된다. */
window.addEventListener('beforeunload', function (e) {
  if (!S.dirty && !S.timer && !S.saving) return;
  doSave();
  e.preventDefault();
  e.returnValue = '';
});

/* ══════════ 새 회의 ══════════ */
document.getElementById('btnNew').addEventListener('click', function () {
  var today = new Date();
  var d = today.getFullYear() + '-' + pad(today.getMonth() + 1) + '-' + pad(today.getDate());

  var mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML =
    '<div class="modal">' +
      '<h2>새 회의</h2>' +
      fld('제목', '<input id="n_title" placeholder="예: 재무팀 주간회의" autofocus>') +
      fld('날짜 · 시간', '<span class="row"><input type="date" id="n_date" value="' + d + '">' +
          '<input type="time" id="n_t1" value="10:00"><input type="time" id="n_t2" value="11:00"></span>') +
      fld('장소', '<input id="n_loc" placeholder="회의실 / 링크">') +
      fld('유형', sel('n_type', S.types, '정기')) +
      fld('템플릿', '<select id="n_tpl"><option value="">없음 (빈 문서)</option>' +
          S.templates.map(function (t) { return '<option value="' + esc(t.id) + '">' + esc(t.name) + '</option>'; }).join('') +
          '</select>') +
      fld('참석자', '<input id="n_att" placeholder="쉼표로 구분">') +
      '<div class="acts"><button class="btn" id="n_cancel">취소</button>' +
      '<button class="btn primary" id="n_ok">만들기</button></div>' +
    '</div>';
  document.body.appendChild(mask);

  var close = function () {
    document.removeEventListener('keydown', onModalKey, true);
    mask.remove();
  };
  /* Escape 로 닫고 Enter 로 만든다. 예전엔 마스크 클릭과 취소 버튼뿐이었다. */
  function onModalKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); close(); return; }
    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && !document.getElementById('n_ok').disabled) {
      e.preventDefault();
      document.getElementById('n_ok').click();
    }
  }
  document.addEventListener('keydown', onModalKey, true);
  mask.addEventListener('click', function (e) { if (e.target === mask) close(); });
  document.getElementById('n_cancel').addEventListener('click', close);
  attachPicker(document.getElementById('n_att'));
  document.getElementById('n_title').focus();

  document.getElementById('n_ok').addEventListener('click', function () {
    var dd = val('n_date');
    var btn = document.getElementById('n_ok');
    btn.disabled = true; btn.textContent = '만드는 중…';
    call('api_createMeeting', {
      title: val('n_title') || '제목 없는 회의',
      type: val('n_type'),
      startAt: dd + 'T' + val('n_t1'),
      endAt: dd + 'T' + val('n_t2'),
      location: val('n_loc'),
      templateId: val('n_tpl'),
      attendees: val('n_att').split(',').map(function (s) { return s.trim(); }).filter(Boolean),
      by: S.me
    }).then(function (r) {
      close();
      if (!r.meeting) { refreshList().then(function () { openMeeting(r.id); }); return; }
      // 예전엔 만들기 → 목록 다시 받기 → 본문 다시 받기, 왕복 3번을 차례로 기다렸다
      var m = r.meeting;
      S.mcache[m.id] = m;
      S.meetings.push({
        id: m.id, title: m.title || '(제목 없음)', type: m.type, status: m.status,
        startAt: m.startAt, endAt: m.endAt, location: m.location, attendees: m.attendees || [],
        tags: m.tags || [], owner: m.owner, syncState: m.syncState, visibility: m.visibility,
        viewers: m.viewers || [], createdBy: m.createdBy, updatedAt: m.updatedAt, rev: m.rev
      });
      S.meetings.sort(function (a, b) { return (b.startAt || '').localeCompare(a.startAt || ''); });
      S.view = 'meetings';
      S.opening = m.id;
      S.cur = m;
      renderDetail(m);
      renderList();
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = '만들기';
      toast('만들지 못했습니다: ' + e.message);
    });
  });
});

function fld(lab, inner) { return '<div class="fld"><label>' + lab + '</label>' + inner + '</div>'; }
function pad(n) { return (n < 10 ? '0' : '') + n; }

boot();
setTimeout(logTiming, 0);

})();
</script>
