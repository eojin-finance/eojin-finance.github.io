.drop input{display:none}

/* 파일 목록 */
.flist{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.fit{display:flex;align-items:center;gap:9px;font-size:13px;background:var(--card2);
  border:1px solid var(--hair);border-radius:9px;padding:6px 11px}
.fit .nm2{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fit .sz{color:var(--mut);font-size:12px;flex:0 0 auto}
.xbtn{border:none;background:none;color:var(--red);cursor:pointer;font-size:14px;padding:0 4px}

/* 결과 매트릭 */
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
.met{background:var(--card2);border:1px solid var(--hair);border-radius:12px;padding:10px 14px}
.met span{display:block;font-size:12px;color:var(--mut);font-weight:600}
.met b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.vline{margin-top:10px;font-size:13px}
.vline .y{color:var(--acc)} .vline .n{color:var(--red)}

/* 상태 배지 */
.bd{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;
  padding:1px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);
  color:var(--ink2);white-space:nowrap}
.bd.ok{border-color:var(--acc2dim);background:var(--tint);color:var(--acc2)}
.bd.bad{border-color:var(--errbd);background:var(--errbg);color:var(--errink)}
.bd.run{border-color:var(--acc2dim);background:var(--card2);color:var(--acc2)}
.bd.dim{opacity:.6}

/* 근거·룰 패널 */
.panel{background:var(--card2);border-left:3px solid var(--acc2);border-radius:0 10px 10px 0;
  padding:13px 15px;font-size:12.5px;margin-top:12px}
.panel.why{font-family:Consolas,"D2Coding",monospace;white-space:pre-wrap;line-height:1.7;
  color:var(--ink2)}
.panel h4{margin:12px 0 6px;font-size:12px;color:var(--mut);font-weight:700}
.panel h4:first-child{margin-top:0}
.panel table{font-size:12.5px;border-collapse:collapse}
.panel th{font-size:11px;padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;
  color:var(--mut);font-weight:600}
.panel td{padding:3px 4px;border:none}
.panel input{width:100%;min-width:56px;padding:4px 7px;font-size:12.5px;
  font-family:Consolas,monospace;background:var(--card);border:1px solid var(--line);
  border-radius:6px;color:var(--ink)}
.panel input:focus{outline:none;border-color:var(--mut)}
.panel .act{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lk{color:var(--acc2);cursor:pointer;font-size:12.5px;font-weight:600;padding:2px 4px;border-radius:6px}
.lk:hover{background:var(--card)}
.mut{color:var(--mut)}

/* ── 집계 ── */
.aggbar{display:flex;gap:10px;align-items:center;margin:14px 0 12px;flex-wrap:wrap}
.prog{display:none;margin:0 0 12px}
.prog.on{display:block}
.track{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.fill{height:100%;width:0;background:var(--acc);transition:width .25s ease}
.ptext{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-top:6px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:4px 0;box-shadow:0 1px 2px var(--shadow);overflow-x:auto}
table.agg{border-collapse:collapse;width:100%;font-size:13.5px}
table.agg th{text-align:left;font-weight:600;color:var(--mut);font-size:12px;
  border-bottom:1px solid var(--line);padding:9px 10px;white-space:nowrap}
table.agg th.num,table.agg td.num{text-align:right;font-variant-numeric:tabular-nums}
table.agg td{border-bottom:1px solid var(--hair);padding:7px 10px}
table.agg tr:hover td{background:var(--card2)}
table.agg tr.sum td{border-top:2px solid var(--line);border-bottom:none;font-weight:800;
  background:var(--card2)}

/* 스켈레톤·토스트·테마픽커 */
.sk{display:inline-block;height:11px;border-radius:3px;background:
  linear-gradient(90deg,var(--card2) 25%,var(--line) 37%,var(--card2) 63%);
  background-size:400% 100%;animation:sh 1.3s ease infinite}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--line);color:var(--ink);
  padding:10px 18px;border-radius:12px;font-size:13.5px;opacity:0;
  transition:opacity .2s;pointer-events:none;z-index:9;box-shadow:0 4px 16px var(--shadow)}
.toast.on{opacity:1}
.thwrap{position:relative}
.sws{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:50;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;
  box-shadow:0 10px 26px var(--shadow);gap:5px;align-items:center;flex-wrap:nowrap}
.thwrap.open .sws{display:flex}
.sws .gap{width:1px;height:18px;background:var(--line);margin:0 3px}
button.sw{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);cursor:pointer;
  padding:0;position:relative;overflow:hidden}
button.sw i{position:absolute;right:2px;bottom:2px;width:9px;height:9px;border-radius:50%}
button.sw.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--accdim)}
button.sw:hover{transform:scale(1.12)}
</style>
<title>위탁매출 정산 관리 (데모) — 이어진 포트폴리오</title></head>
<body>
<div id="demobar">
  <b>데모</b>
  <span>위탁매출 정산 관리 앱 그대로 — 채널 룰(헤더행·소계 위치·산식·파라미터) 편집 화면은 실제 로직이고, 정산서 파일과 계산 결과는 가상값입니다. 판매처 이름은 번호로 가렸습니다.</span>
  <a href="../../">← 포트폴리오</a>
</div>
<style>
#demobar{position:sticky;top:0;z-index:9999;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:#fff8e1;border-bottom:1px solid #f0dfa8;padding:9px 16px;font-size:12.5px;color:#6b5b21;
  font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}
#demobar b{background:#6b5b21;color:#fff8e1;padding:2px 8px;border-radius:10px;font-size:11.5px}
#demobar a{margin-left:auto;color:#6b5b21;font-weight:700;text-decoration:none}
</style>

<div class="wrap">
  <header>
    <div class="brand">위탁 <em>정산</em></div>
    <nav class="tabs">
      <button id="tabReg" class="on" onclick="showTab('reg')">등록</button>
      <button id="tabAgg" onclick="showTab('agg')">집계</button>
    </nav>
    <div class="hright">
      <input class="t num" id="month" value="2026-05" onchange="loadList(true)">
      <button class="b sm" onclick="loadList(true)">새로고침</button>
      <button class="b sm" onclick="addChannel()">＋ 채널</button>
      <button class="b sm" onclick="openFolder()">Drive</button>
      <span class="thwrap" id="thwrap">
        <button class="b sm" onclick="document.getElementById('thwrap').classList.toggle('open')">테마</button>
        <span class="sws" id="theme"></span>
      </span>
    </div>
  </header>

  <!-- ── 등록 ── -->
  <section class="tab on" id="sec_reg">
    <div class="split">
      <div class="llist" id="llist"></div>
      <div class="detail" id="detail"><div class="card mut">채널을 선택하세요</div></div>
    </div>
  </section>

  <!-- ── 집계 ── -->
  <section class="tab" id="sec_agg">
    <div class="aggbar">
      <button class="b pri" id="btnAll" onclick="calcAll()">전 채널 계산</button>
      <button class="b" onclick="stopAll()" id="btnStop" style="display:none">중지</button>
      <button class="b" onclick="exportFile('witaExportMonth','월파일')">📊 월파일 다운로드</button>
      <button class="b" onclick="exportFile('witaExportJournal','전표입력')">🧾 전표입력 다운로드</button>
      <span class="mut" id="aggmsg" style="font-size:13px"></span>
    </div>
    <div class="prog" id="prog">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="ptext"><span id="pnow"></span><span id="ppct"></span></div>
    </div>
    <div class="tcard">
      <table class="agg">
        <thead><tr>
          <th style="width:36px">시트</th><th>판매처</th><th>브랜드</th><th>본부</th>
          <th class="num">상품매출(−v)</th><th class="num">상품매출(+v)</th><th class="num">기타매출</th>
          <th class="num">수수료(별도)</th><th class="num">수수료(계산서)</th><th class="num">패널티</th><th class="num">정산대상액</th>
          <th class="num">실수취율</th><th>입금예정</th>
          <th style="width:70px">검증</th>
        </tr></thead>
        <tbody id="aggbody"></tbody>
      </table>
    </div>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script>
var CH = [], RESULT = {}, RULE = null, SEL = null, RUN = false, STOP = false;
var ITEMS = ['상품매출', '기타매출', '수수료_별도', '수수료_계산서', '정산금액'];

function $(id) { return document.getElementById(id); }
function mon() { return $('month').value.trim(); }
function fmt(n) { return (n === null || n === undefined || n === '') ? '' : Number(n).toLocaleString(); }
/* 실수취율 = 정산대상액 ÷ (상품매출+기타매출). 원가가 없어 마진율은 못 내고, 몰에 떼이고 남는 비율을 본다 */
function rate(v) {
  var sales = (v['상품매출'] || 0) + (v['기타매출'] || 0);
  if (!sales || v['정산금액'] === undefined) return '';
  return (v['정산금액'] / sales * 100).toFixed(1) + '%';
}
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
var toastT = null;
function toast(s) {
  var t = $('toast'); t.textContent = s; t.className = 'toast on';
  clearTimeout(toastT); toastT = setTimeout(function () { t.className = 'toast'; }, 2600);
}
function kb(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB'; }

function showTab(k) {
  $('tabReg').className = k === 'reg' ? 'on' : '';
  $('tabAgg').className = k === 'agg' ? 'on' : '';
  $('sec_reg').className = 'tab' + (k === 'reg' ? ' on' : '');
  $('sec_agg').className = 'tab' + (k === 'agg' ? ' on' : '');
  if (k === 'agg') drawAgg();
}

/* ── 목록 ── */
function loadList(fresh) {
  /* stale-while-revalidate: 직전 목록을 즉시 그리고, 뒤에서 최신본으로 바꾼다.
     스켈레톤은 캐시가 없는 첫 방문에만 보인다. */
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem('wita_list_' + mon()) || 'null'); } catch (e) {}
  if (cached && cached.length) {
    CH = cached; drawList(); if (SEL) drawDetail(); drawAgg();
  } else {
    var h = '';
    for (var i = 0; i < 10; i++)
      h += '<div class="chc"><span class="sk" style="width:' + (110 + (i * 17) % 70) + 'px"></span><br>' +
           '<span class="sk" style="width:70px"></span></div>';
    $('llist').innerHTML = h;
  }
  google.script.run.withSuccessHandler(function (res) {
    CH = res.채널;
    try { localStorage.setItem('wita_list_' + mon(), JSON.stringify(CH)); } catch (e) {}
    /* 서버에 저장된 지난 계산 결과 복원 — 지금 세션에서 계산 중이거나 더 새 결과가 있으면 유지 */
    Object.keys(res.결과 || {}).forEach(function (sn) {
      if (!RESULT[sn] || (!RESULT[sn].__running && !RESULT[sn].근거)) RESULT[sn] = res.결과[sn];
    });
    drawList();
    if (SEL) drawDetail();
    drawAgg();
  }).withFailureHandler(function (e) {
    if (!cached) $('llist').innerHTML =
      '<div class="chc" style="color:var(--red)">불러오기 실패: ' + esc(e.message) + '</div>';
    else toast('목록 갱신 실패: ' + e.message);
  }).witaChannelList(mon(), !!fresh);
}

function chOf(sn) {
  return CH.filter(function (c) { return c.시트 === sn; })[0];
}

function drawList() {
  var h = '';
  CH.forEach(function (c) {
    var r = RESULT[c.시트];
    var badge;
    if (r && r.__running) badge = '<span class="bd run">계산중</span>';
    else if (r && r.검증) badge = r.검증.통과 ? '<span class="bd ok">통과</span>'
      : '<span class="bd bad">차이</span>';
    else if (r && r.문제 && r.문제.length) badge = '<span class="bd bad">실패</span>';
    else if (c.파일수) badge = '<span class="bd">파일 ' + c.파일수 + '</span>';
    else badge = '<span class="bd dim">파일없음</span>';
    h += '<div class="chc' + (SEL === c.시트 ? ' on' : '') + '" onclick="selCh(\'' + c.시트 + '\')">' +
      '<div class="t"><div><span class="sn">' + c.시트 + '</span><span class="nm">' + esc(c.판매처) + '</span></div>' +
      badge + '</div>' +
      '<div class="sub">' + esc(c.브랜드) + (c.본부 ? ' · ' + esc(c.본부) : '') + '</div></div>';
  });
  $('llist').innerHTML = h;
}

function selCh(sn) {
  SEL = sn; RULE = null;
  drawList(); drawDetail();
}

/* ── 상세 ── */
function drawDetail() {
  var c = chOf(SEL);
  if (!c) { $('detail').innerHTML = '<div class="card mut">채널을 선택하세요</div>'; return; }
  var r = RESULT[SEL];
  var h = '<div class="card">';
  h += '<div class="dhead"><h2>' + esc(c.판매처) + '</h2>' +
       '<span class="chip">' + c.시트 + '</span>' +
       (c.브랜드 ? '<span class="chip acc">' + esc(c.브랜드) + '</span>' : '') +
       (c.본부 ? '<span class="chip">' + esc(c.본부) + '</span>' : '') +
       (c.입금주기 ? '<span class="chip">입금 ' + esc(c.입금주기) + (c.입금예정일 ? ' → ' + esc(c.입금예정일) : '') + '</span>' : '') +
       '<span style="flex:1"></span>' +
       '<button class="b sm pri" onclick="calcOne(\'' + SEL + '\')">계산</button>' +
       '<span class="lk" onclick="openRule(\'' + SEL + '\')">룰 편집</span></div>';
  if (c.어드민경로) h += '<div class="path">어드민 경로 · ' + esc(c.어드민경로) + '</div>';

  /* 필요파일 체크리스트 */
  if ((c.필요파일 || []).length) {
    h += '<div class="need">';
    c.필요파일.forEach(function (n) {
      var st = n.확보 ? '<span class="st y">●</span>' : (n.선택 ? '<span class="st n">○</span>' : '<span class="st n">◌</span>');
      h += '<div class="it">' + st + '<span class="role">' + esc(n.역할) + '</span>' +
           '<span class="kw">파일명에 "' + esc(n.키워드) + '"</span>' +
           (n.선택 ? '<span class="pt">(선택)</span>' : '') +
           (n.경로 ? '<span class="pt">· ' + esc(n.경로) + '</span>' : '') + '</div>';
    });
    h += '</div>';
  }

  /* 드롭존 */
  h += '<div class="drop" id="drop" onclick="document.getElementById(\'fi\').click()">' +
       '<b>정산파일 끌어다 놓기</b><span>또는 클릭해서 선택 · 여러 파일 가능</span>' +
       '<input type="file" id="fi" multiple onchange="pickFiles(this.files)"></div>';

  /* 올라온 파일 */
  if ((c.파일 || []).length) {
    h += '<div class="flist">';
    c.파일.forEach(function (f) {
      h += '<div class="fit"><span class="nm2">' + esc(f.name) + '</span>' +
           '<span class="sz">' + kb(f.size) + ' · ' + esc(f.updated) + '</span>' +
           '<button class="xbtn" onclick="delFile(\'' + esc(f.name).replace(/'/g, "\\'") + '\')">×</button></div>';
    });
    h += '</div>';
  }
  h += '</div>';

  /* 결과 */
  if (r && !r.__running && (r.값 || r.문제)) {
    h += '<div class="card">';
    if (r.값 && Object.keys(r.값).length) {
      h += '<div class="mets">';
      [['상품매출', '상품매출(+v)'], ['기타매출', '기타매출'], ['수수료_별도', '수수료(별도)'],
       ['수수료_계산서', '수수료(계산서)'], ['패널티', '패널티'], ['정산금액', '정산대상액']].forEach(function (p) {
        if (r.값[p[0]] !== undefined)
          h += '<div class="met"><span>' + p[1] + '</span><b>' + fmt(r.값[p[0]]) + '</b></div>';
      });
      if (rate(r.값)) h += '<div class="met"><span>실수취율</span><b>' + rate(r.값) + '</b></div>';
      h += '</div>';
    }
    if (r.검증) {
      h += '<div class="vline">검증 · ' + r.검증.식 + ' → ' +
        (r.검증.통과 ? '<span class="y">통과</span>'
                     : '<span class="n">차이 ' + fmt(r.검증.차이) + '</span>') +
        (r.검증.힌트 ? '<div class="mut" style="font-size:12px;margin-top:3px">' + esc(r.검증.힌트) + '</div>' : '') + '</div>';
    }
    if (r.문제 && r.문제.length) {
      h += '<div class="vline n" style="color:var(--red)">' +
           r.문제.map(function (p) { return '⚠ ' + esc(p); }).join('<br>') + '</div>';
    }
    if (r.근거) {
      h += '<div style="margin-top:10px"><span class="lk" onclick="toggleWhy()">' +
           (r.__open ? '근거 접기' : '근거 펼치기 (어느 컬럼을 어떻게 더했는지)') + '</span></div>';
      if (r.__open) h += '<div class="panel why">' + esc(whyText(r)) + '</div>';
    }
    h += '</div>';
  } else if (r && r.__running) {
    h += '<div class="card"><span class="bd run">계산중…</span></div>';
  }

  /* 룰 편집 */
  if (RULE) h += rulePanel();

  $('detail').innerHTML = h;
  bindDrop();
}

function whyText(r) {
  var s = [];
  (r.파일 || []).forEach(function (f) { s.push('[' + f.역할 + '] ' + f.파일명); });
  if (r.근거) {
    s.push('');
    Object.keys(r.근거).forEach(function (k) {
      var g = r.근거[k];
      s.push(k + ' = ' + fmt(g.값));
      s.push('   ' + g.산식);
      (g.세부 || []).forEach(function (d) {
        s.push('      ' + d.함수 + '(' + d.인자 + ') = ' + fmt(d.값));
      });
    });
  }
  return s.join('\n');
}

function toggleWhy() {
  var r = RESULT[SEL]; if (!r) return;
  r.__open = !r.__open; drawDetail();
}

/* ── 업로드 (클릭 + 드래그) ── */
function bindDrop() {
  var d = $('drop'); if (!d) return;
  ['dragenter', 'dragover'].forEach(function (ev) {
    d.addEventListener(ev, function (e) { e.preventDefault(); d.className = 'drop hot'; });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    d.addEventListener(ev, function (e) { e.preventDefault(); d.className = 'drop'; });
  });
  d.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files.length) pickFiles(e.dataTransfer.files);
  });
}

function pickFiles(fileList) {
  var files = Array.prototype.slice.call(fileList);
  if (!files.length || !SEL) return;
  var sn = SEL, done = 0;
  toast(sn + ' 업로드 0/' + files.length);
  (function next(i) {
    if (i >= files.length) {
      toast(sn + ' 업로드 완료 ' + done + '개 — 자동 계산');
      loadList(true);
      calcOne(sn);          /* 업로드 끝나면 그 채널은 바로 계산 */
      return;
    }
    var f = files[i];
    var fr = new FileReader();
    fr.onload = function () {
      google.script.run.withSuccessHandler(function () {
        done++; toast(sn + ' 업로드 ' + done + '/' + files.length); next(i + 1);
      }).withFailureHandler(function (e) {
        toast('실패: ' + f.name + ' — ' + e.message); next(i + 1);
      }).witaUpload({ month: mon(), sheet: sn, name: f.name,
                      mimeType: f.type, dataBase64: fr.result.split(',')[1] });
    };
    fr.readAsDataURL(f);
  })(0);
}

function delFile(name) {
  if (!confirm('삭제할까요?\n' + name)) return;
  google.script.run.withSuccessHandler(function () { toast('삭제됨'); loadList(true); })
    .withFailureHandler(function (e) { toast('삭제 실패: ' + e.message); })
    .witaDeleteFile(mon(), SEL, name);
}

/* ── 계산 ── */
function calcOne(sn) {
  RESULT[sn] = RESULT[sn] || {};
  RESULT[sn].__running = true;
  drawList(); if (SEL === sn) drawDetail();
  google.script.run.withSuccessHandler(function (r) {
    r.__open = RESULT[sn] && RESULT[sn].__open;
    RESULT[sn] = r;
    drawList(); if (SEL === sn) drawDetail(); drawAgg();
    if (r.문제 && r.문제.length) toast(sn + ' — ' + r.문제[0]);
  }).withFailureHandler(function (e) {
    RESULT[sn] = { 문제: [e.message] };
    drawList(); if (SEL === sn) drawDetail(); drawAgg();
  }).witaComputeChannel(mon(), sn, null);
}

/* ── 집계 ── */
function drawAgg() {
  var h = '', tot = { mv: 0, pv: 0, etc: 0, s1: 0, s2: 0, st: 0 };
  CH.forEach(function (c) {
    var r = RESULT[c.시트], v = (r && r.값) || {};
    var pv = v['상품매출'], mv = pv === undefined ? undefined : Math.round(pv / 1.1);
    var badge = '';
    if (r && r.__running) badge = '<span class="bd run">…</span>';
    else if (r && r.검증) badge = r.검증.통과 ? '<span class="bd ok">통과</span>'
      : '<span class="bd bad">' + fmt(r.검증.차이) + '</span>';
    else if (r && r.문제 && r.문제.length) badge = '<span class="bd bad">실패</span>';
    else if (!c.파일수) badge = '<span class="bd dim">파일없음</span>';
    if (pv !== undefined) {
      tot.mv += mv; tot.pv += pv; tot.etc += (v['기타매출'] || 0);
      tot.s1 += (v['수수료_별도'] || 0); tot.s2 += (v['수수료_계산서'] || 0);
    tot.pen = (tot.pen || 0) + (v['패널티'] || 0); tot.st += (v['정산금액'] || 0);
    }
    h += '<tr onclick="showTab(\'reg\');selCh(\'' + c.시트 + '\')" style="cursor:pointer">' +
      '<td class="mut num">' + c.시트 + '</td>' +
      '<td style="font-weight:600">' + esc(c.판매처) + '</td>' +
      '<td class="mut">' + esc(c.브랜드) + '</td>' +
      '<td class="mut">' + esc(c.본부) + '</td>' +
      '<td class="num">' + fmt(mv) + '</td>' +
      '<td class="num">' + fmt(pv) + '</td>' +
      '<td class="num">' + fmt(v['기타매출']) + '</td>' +
      '<td class="num">' + fmt(v['수수료_별도']) + '</td>' +
      '<td class="num">' + fmt(v['수수료_계산서']) + '</td>' +
      '<td class="num">' + fmt(v['패널티']) + '</td>' +
      '<td class="num">' + fmt(v['정산금액']) + '</td>' +
      '<td class="num mut">' + rate(v) + '</td>' +
      '<td class="mut" style="white-space:nowrap">' + (c.입금예정일 || '') + '</td>' +
      '<td>' + badge + '</td></tr>';
  });
  h += '<tr class="sum"><td></td><td>합계</td><td></td><td></td>' +
    '<td class="num">' + fmt(tot.mv) + '</td><td class="num">' + fmt(tot.pv) + '</td>' +
    '<td class="num">' + fmt(tot.etc) + '</td><td class="num">' + fmt(tot.s1) + '</td>' +
    '<td class="num">' + fmt(tot.s2) + '</td><td class="num">' + fmt(tot.pen || 0) + '</td>' +
    '<td class="num">' + fmt(tot.st) + '</td>' +
    '<td class="num">' + rate({ 상품매출: tot.pv, 기타매출: tot.etc, 정산금액: tot.st }) + '</td>' +
    '<td></td><td></td></tr>';
  $('aggbody').innerHTML = h;
}

function calcAll() {
  var targets = CH.filter(function (c) { return c.파일수 > 0; }).map(function (c) { return c.시트; });
  if (!targets.length) { toast('파일이 올라온 채널이 없습니다'); return; }
  RUN = true; STOP = false;
  $('btnAll').disabled = true; $('btnStop').style.display = '';
  $('prog').className = 'prog on';
  var i = 0, t0 = Date.now();
  (function next() {
    if (STOP || i >= targets.length) { finish(t0); return; }
    var sn = targets[i], c = chOf(sn);
    var pct = Math.round(i / targets.length * 100);
    $('fill').style.width = pct + '%';
    $('pnow').textContent = sn + ' ' + (c ? c.판매처 : '') + ' 계산 중 (' + (i + 1) + '/' + targets.length + ')';
    $('ppct').textContent = pct + '%';
    RESULT[sn] = RESULT[sn] || {}; RESULT[sn].__running = true; drawAgg();
    google.script.run.withSuccessHandler(function (r) {
      RESULT[sn] = r; i++; drawAgg(); drawList(); next();
    }).withFailureHandler(function (e) {
      RESULT[sn] = { 문제: [e.message] }; i++; drawAgg(); drawList(); next();
    }).witaComputeChannel(mon(), sn, null);
  })();
}

function finish(t0) {
  RUN = false;
  $('btnAll').disabled = false; $('btnStop').style.display = 'none';
  $('fill').style.width = '100%'; $('ppct').textContent = '100%';
  var ok = 0, bad = 0;
  Object.keys(RESULT).forEach(function (sn) {
    var r = RESULT[sn];
    if (r.검증 && r.검증.통과) ok++;
    else if ((r.문제 || []).length || (r.검증 && !r.검증.통과)) bad++;
  });
  $('pnow').textContent = '완료 · ' + Math.round((Date.now() - t0) / 1000) + '초 · 통과 ' + ok + ' / 확인필요 ' + bad;
  $('aggmsg').textContent = '';
  drawAgg(); drawList();
  setTimeout(function () { $('prog').className = 'prog'; }, 5000);
}

function stopAll() { STOP = true; toast('중지 — 진행 중인 채널까지만'); }

function exportFile(fn, label) {
  toast(label + ' 생성 중... (raw 탭 포함, 수십 초)');
  google.script.run.withSuccessHandler(function (r) {
    toast(label + ' 완료 — 다운로드 시작');
    window.open(r.url, '_blank');
  }).withFailureHandler(function (e) { toast(label + ' 실패: ' + e.message); })[fn](mon());
}

function openFolder() {
  google.script.run.withSuccessHandler(function (url) { window.open(url, '_blank'); })
    .withFailureHandler(function (e) { toast('실패: ' + e.message); })
    .witaRootFolderUrl();
}

/* ── 룰 편집 ── */
function openRule(sn) {
  if (RULE) { RULE = null; drawDetail(); return; }
  toast('룰 불러오는 중...');
  google.script.run.withSuccessHandler(function (r) { RULE = r; drawDetail(); })
    .withFailureHandler(function (e) { toast('룰 로드 실패: ' + e.message); })
    .witaRuleOf(sn);
}

function rulePanel() {
  var d = RULE;
  var h = '<div class="card"><div class="panel" style="border-left-color:var(--acc)">';
  ['채널', '파일', '집계', '산출', '파라미터'].forEach(function (key) {
    var cols = d.컬럼[key].filter(function (c) { return c !== '시트'; });
    h += '<h4>' + key + '</h4><div style="overflow-x:auto"><table id="rt_' + key + '"><tr>';
    cols.forEach(function (c) { h += '<th>' + c + '</th>'; });
    h += '<th style="width:22px"></th></tr>';
    (d[key] || []).forEach(function (row) {
      h += '<tr>';
      cols.forEach(function (c) {
        h += '<td><input value="' + esc(row[c]) + '" data-col="' + c + '"></td>';
      });
      h += '<td><button class="xbtn" onclick="this.closest(\'tr\').remove()">×</button></td></tr>';
    });
    h += '</table></div><span class="lk" onclick="addRuleRow(\'' + key + '\')">＋ 행</span>';
  });
  h += '<div class="act">' +
       '<button class="b sm pri" onclick="saveRule()">저장</button>' +
       '<button class="b sm" onclick="openRule()">닫기</button>' +
       '<button class="b sm" onclick="delChannel()" style="color:var(--red)">채널 삭제</button>' +
       '<span class="mut" style="font-size:12px">Drive _rules.json 저장 · 버전 기록으로 되돌리기 가능</span>' +
       '</div></div></div>';
  return h;
}

function addRuleRow(key) {
  var t = document.getElementById('rt_' + key);
  var cols = RULE.컬럼[key].filter(function (c) { return c !== '시트'; });
  var tr = t.insertRow(-1);
  cols.forEach(function (c) {
    tr.insertCell(-1).innerHTML = '<input value="" data-col="' + c + '">';
  });
  tr.insertCell(-1).innerHTML = '<button class="xbtn" onclick="this.closest(\'tr\').remove()">×</button>';
}

function saveRule() {
  var payload = {};
  ['채널', '파일', '집계', '산출', '파라미터'].forEach(function (key) {
    var t = document.getElementById('rt_' + key);
    var rows = [];
    for (var i = 1; i < t.rows.length; i++) {
      var o = {}, ins = t.rows[i].querySelectorAll('input');
      for (var j = 0; j < ins.length; j++) o[ins[j].getAttribute('data-col')] = ins[j].value;
      rows.push(o);
    }
    payload[key] = rows;
  });
  toast('저장 중...');
  google.script.run.withSuccessHandler(function (r) {
    RULE = r; toast('룰 저장 완료'); loadList(true);
  }).withFailureHandler(function (e) { toast('저장 실패: ' + e.message); })
    .witaSaveRuleOf(SEL, payload);
}

function addChannel() {
  var sn = prompt('새 채널 시트번호 (예: 33)');
  if (!sn) return;
  var seller = prompt('판매처 이름') || '';
  google.script.run.withSuccessHandler(function () {
    toast(sn + ' 채널 추가됨'); SEL = sn; loadList(true);
  }).withFailureHandler(function (e) { toast('추가 실패: ' + e.message); })
    .witaAddChannel(sn, seller);
}

function delChannel() {
  if (!confirm(SEL + ' 채널의 룰을 삭제할까요? (Drive 버전 기록으로 되돌릴 수 있습니다)')) return;
  google.script.run.withSuccessHandler(function () {
    RULE = null; SEL = null; toast('삭제됨'); loadList(true);
  }).withFailureHandler(function (e) { toast('삭제 실패: ' + e.message); })
    .witaDeleteChannel(SEL);
}

var THEME_KEYS = ['lime','cyan','violet','steel','paper','linen','green','mono'];
var THEME_VARS = ['acc','acc2','accdim','acc2dim','bg','card','card2','line','hair','tint',
  'ink','ink2','mut','onacc','errbd','errbg','errink','shadow','red'];

function applyTheme(k) {
  var t = THEMES[k] || THEMES.lime;
  var r = document.documentElement.style;
  THEME_VARS.forEach(function (v) { if (t[v]) r.setProperty('--' + v, t[v]); });
  document.documentElement.style.colorScheme = (t.tone === '밝은' ? 'light' : 'dark');
  try { localStorage.setItem('wita_theme', k); } catch (e) {}
}

function initTheme() {
  var box = $('theme');
  var tones = ['어두운', '중간', '밝은'];
  var h = [];
  tones.forEach(function (tone, ti) {
    if (ti) h.push('<span class="gap"></span>');
    THEME_KEYS.filter(function (k) { return THEMES[k].tone === tone; }).forEach(function (k) {
      var t = THEMES[k];
      h.push('<button class="sw" data-t="' + k + '" title="' + t.name + ' · ' + tone +
        '" style="background:' + t.bg + '"><i style="background:' + t.acc + '"></i></button>');
    });
  });
  box.innerHTML = h.join('');
  var saved = 'lime';
  try { saved = localStorage.getItem('wita_theme') || 'lime'; } catch (e) {}
  if (!THEMES[saved]) saved = 'lime';
  function mark(k) {
    box.querySelectorAll('button.sw').forEach(function (b) {
      b.className = 'sw' + (b.getAttribute('data-t') === k ? ' on' : '');
    });
  }
  applyTheme(saved); mark(saved);
  box.querySelectorAll('button.sw').forEach(function (b) {
    b.addEventListener('click', function () {
      applyTheme(b.getAttribute('data-t')); mark(b.getAttribute('data-t'));
    });
  });
  document.addEventListener('click', function (ev) {
    var w = $('thwrap');
    if (w && !w.contains(ev.target)) w.classList.remove('open');
  });
}

initTheme();
loadList(false);
