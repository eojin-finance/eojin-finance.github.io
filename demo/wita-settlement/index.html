/**
 * 위탁매출 정산 관리 — 웹앱 진입 + 계산 오케스트레이션
 *
 * 폴더 구조:  <루트>/<YYYY-MM>/<시트번호>/  에 어드민 원본을 넣는다.
 * 계산 결과는 값만 주는 게 아니라 "어느 파일 어느 컬럼을 어떻게 더했는지"(근거)를 같이 준다.
 * 6·7월에 이 시스템을 안 쓰게 된 이유 중 하나가 "결과를 못 믿겠다" 였기 때문.
 */

var WITA_PROP_ROOT = 'witaRootFolderId';
var WITA_ITEMS = ['상품매출', '기타매출', '수수료_별도', '수수료_계산서', '정산금액'];

/* 채널별 입금 주기 — 26.01~07 회계시스템 외상매출금 원장 × 위탁 정산대상액 129건 매칭으로 도출.
   룰의 '입금주기' 값이 있으면 그게 우선. 형식: '익월 N일' | '익월 말일' | '익익월' */
var WITA_CYCLE = {
  '채널03': '익월 10일', '채널02': '익월 10일', '채널01': '익월 10일',
  '채널04': '익월 10일', '채널05': '익월 10일', '채널06': '익월 10일',
  '채널08': '익월 20일', '채널10': '익월 20일',
  '채널12': '익월 1일', '채널15': '익월 말일',
  '채널19': '익익월'
};

function witaCycleOf(seller, ruleCycle) {
  if (ruleCycle) return String(ruleCycle);
  var s = String(seller || '');
  var best = '';
  Object.keys(WITA_CYCLE).forEach(function (k) {
    if (s.indexOf(k) === 0 && k.length > best.length) best = k;
  });
  return best ? WITA_CYCLE[best] : '';
}

/** '2026-05' + '익월 10일' -> '2026-06-10' (말일·익익월 처리 포함) */
function witaPayDate(month, cycle) {
  if (!cycle) return '';
  var y = +month.slice(0, 4), m = +month.slice(5, 7);
  var plus = cycle.indexOf('익익월') >= 0 ? 2 : 1;
  m += plus; while (m > 12) { m -= 12; y++; }
  var dm = cycle.match(/(\d+)\s*일/);
  var day;
  if (cycle.indexOf('말일') >= 0) day = new Date(y, m, 0).getDate();
  else if (dm) day = +dm[1];
  else return y + '-' + ('0' + m).slice(-2) + ' 중';   // 익익월(변동) 등 날짜 미상
  return y + '-' + ('0' + m).slice(-2) + '-' + ('0' + day).slice(-2);
}

function doGet(e) {
  // ?action=... 은 개발용 진입점 — 로컬에서 배포URL만 호출해 검증할 수 있게 둔다.
  var p = (e && e.parameter) || {};
  if (p.action) {
    var out;
    try {
      if (p.action === 'init') out = { ok: true, 룰: witaResetRules(), 캐시: '비움' };
      else if (p.action === 'rule') out = witaRuleOf(p.sheet);
      else if (p.action === 'list') out = witaChannelList(p.month || '2026-05', p.fresh === '1');
      else if (p.action === 'clearCache') { witaClearRuleCache(); out = { ok: true, 캐시: '비움' }; }
      else if (p.action === 'compute') out = witaComputeChannel(p.month, p.sheet, null);
      else if (p.action === 'computeAll') out = witaComputeAll(p.month);
      else if (p.action === 'folder') out = { url: witaRootFolder().getUrl(), id: witaRootFolder().getId() };
      else if (p.action === 'exportMonth') out = witaExportMonth(p.month);
      else if (p.action === 'exportJournal') out = witaExportJournal(p.month);
      else out = { ok: false, error: 'unknown action: ' + p.action };
    } catch (err) {
      out = { ok: false, error: String(err && err.message || err), stack: String(err && err.stack || '').substring(0, 500) };
    }
    return ContentService.createTextOutput(JSON.stringify(out))
      .setMimeType(ContentService.MimeType.JSON);
  }
  return HtmlService.createTemplateFromFile('Index')
    .evaluate()
    .setTitle('위탁매출 정산 관리')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1');
}

function witaRootFolderUrl() { return witaRootFolder().getUrl(); }

/**
 * 화면에서 파일 업로드 -> <루트>/<월>/<시트>/ 에 저장.
 * @param {Object} payload {month, sheet, name, mimeType, dataBase64}
 */
function witaUpload(payload) {
  var root = witaRootFolder();
  var mf = witaChildFolder(root, payload.month, true);
  var cf = witaChildFolder(mf, String(payload.sheet), true);
  // 같은 이름이 있으면 교체 (재업로드가 흔함)
  var old = cf.getFilesByName(payload.name);
  while (old.hasNext()) old.next().setTrashed(true);
  var blob = Utilities.newBlob(
    Utilities.base64Decode(payload.dataBase64),
    payload.mimeType || 'application/octet-stream',
    payload.name);
  var f = cf.createFile(blob);
  try { CacheService.getScriptCache().remove('list_' + payload.month); } catch (e) {}
  return { ok: true, name: f.getName(), size: f.getSize() };
}

/** 채널 폴더의 파일 삭제 */
function witaDeleteFile(month, sheetNo, name) {
  var root = witaRootFolder();
  var mf = witaChildFolder(root, month, false);
  if (!mf) return { ok: false };
  var cf = witaChildFolder(mf, String(sheetNo), false);
  if (!cf) return { ok: false };
  var it = cf.getFilesByName(name), n = 0;
  while (it.hasNext()) { it.next().setTrashed(true); n++; }
  try { CacheService.getScriptCache().remove('list_' + month); } catch (e) {}
  return { ok: true, 삭제: n };
}

/* ===== 계산 결과 영속화 =====
   결과가 화면 메모리에만 있으면 새로고침에 사라진다 — 월별 _results_<월>.json 에 저장해
   다음에 열어도 집계탭이 채워져 있게 한다. 근거(trace)는 커서 제외, 값·검증·문제만. */
function witaResultsFileName(month) { return '_results_' + month + '.json'; }

function witaReadResults(month) {
  var it = witaRootFolder().getFilesByName(witaResultsFileName(month));
  if (!it.hasNext()) return {};
  try { return JSON.parse(it.next().getBlob().getDataAsString('UTF-8')); }
  catch (e) { return {}; }
}

function witaSaveResult(month, sn, slim) {
  var root = witaRootFolder();
  var name = witaResultsFileName(month);
  var it = root.getFilesByName(name);
  var data = {};
  var file = null;
  if (it.hasNext()) {
    file = it.next();
    try { data = JSON.parse(file.getBlob().getDataAsString('UTF-8')); } catch (e) {}
  }
  data[sn] = slim;
  if (file) file.setContent(JSON.stringify(data));
  else root.createFile(name, JSON.stringify(data), MimeType.PLAIN_TEXT);
  try { CacheService.getScriptCache().remove('list_' + month); } catch (e) {}
}

/** 전 채널 계산 (파일이 올라온 채널만) */
function witaComputeAll(month) {
  var list = witaChannelList(month).채널;
  var res = [], tot = {};
  WITA_ITEMS.forEach(function (k) { tot[k] = 0; });
  list.forEach(function (c) {
    if (!c.파일수) return;
    var r = witaComputeChannel(month, c.시트, null);
    WITA_ITEMS.forEach(function (k) { tot[k] += Number(r.값[k] || 0); });
    res.push({ 시트: r.시트, 판매처: r.판매처, 값: r.값,
               검증: r.검증 ? (r.검증.통과 ? 'OK' : '차이 ' + r.검증.차이) : '-',
               문제: r.문제 });
  });
  return { 월: month, 채널수: res.length, 합계: tot, 결과: res };
}

function include(name) {
  return HtmlService.createHtmlOutputFromFile(name).getContent();
}

/** 업로드 루트 폴더 (없으면 생성) */
function witaRootFolder() {
  var props = PropertiesService.getScriptProperties();
  var id = props.getProperty(WITA_PROP_ROOT);
  if (id) {
    try { return DriveApp.getFolderById(id); } catch (e) { /* 삭제됨 -> 재생성 */ }
  }
  var f = DriveApp.createFolder('위탁매출_정산파일');
  props.setProperty(WITA_PROP_ROOT, f.getId());
  return f;
}

/** 시트번호 정규화 — 시트에 숫자로 저장되면 '01'이 1이 되어버린다 */
function witaSn(v) {
  var s = String(v === null || v === undefined ? '' : v).trim();
  return /^\d$/.test(s) ? '0' + s : s;
}

function witaChildFolder(parent, name, create) {
  var nm = String(name);
  var it = parent.getFoldersByName(nm);
  if (it.hasNext()) return it.next();
  // '01' <-> '1' 별칭도 찾아본다 (0 패딩 유실 시기에 만들어진 폴더 호환)
  var alt = /^0\d$/.test(nm) ? nm.replace(/^0/, '') : (/^\d$/.test(nm) ? '0' + nm : null);
  if (alt) {
    var it2 = parent.getFoldersByName(alt);
    if (it2.hasNext()) return it2.next();
  }
  return create ? parent.createFolder(nm) : null;
}

 * 요청 1회 안에서는 캐시로 재사용한다.
 */
var _witaScanCache = {};

/** Drive REST 호출 (files.list) — DriveApp 반복보다 몇 배 빠르다 */
function witaDriveList(q, fields) {
  var out = [], pageToken = null;
  do {
    var url = 'https://www.googleapis.com/drive/v3/files?pageSize=1000' +
      '&q=' + encodeURIComponent(q + " and trashed=false") +
      '&fields=' + encodeURIComponent('nextPageToken,files(' + fields + ')') +
      (pageToken ? '&pageToken=' + pageToken : '');
    var res = UrlFetchApp.fetch(url, {
      headers: { Authorization: 'Bearer ' + ScriptApp.getOAuthToken() },
      muteHttpExceptions: true
    });
    if (res.getResponseCode() >= 300)
      throw new Error('Drive 조회 실패: ' + res.getContentText().substring(0, 150));
    var j = JSON.parse(res.getContentText());
    out = out.concat(j.files || []);
    pageToken = j.nextPageToken;
  } while (pageToken);
  return out;
}

/**
 * 월 폴더 스캔 — DriveApp 으로 폴더 26개를 순회하면 폴더당 수백 ms 라 목록이 늦다.
 * Drive REST 로 ①채널 폴더 목록 1회 ②전 폴더의 파일을 'in parents' OR 로 1회 = 총 2회 호출.
 */
function witaScanMonth(month, fresh) {
  if (!fresh && _witaScanCache[month]) return _witaScanCache[month];
  var map = {};
  var root = witaRootFolder();
  var months = witaDriveList("'" + root.getId() + "' in parents and name='" + month +
    "' and mimeType='application/vnd.google-apps.folder'", 'id,name');
  if (months.length) {
    var chs = witaDriveList("'" + months[0].id + "' in parents and mimeType='application/vnd.google-apps.folder'", 'id,name');
    if (chs.length) {
      var byId = {};
      chs.forEach(function (c) { byId[c.id] = witaSn(c.name); map[byId[c.id]] = map[byId[c.id]] || []; });
      // 폴더 30개 안팎이라 쿼리 길이는 문제 없다 (26개 × ~50자)
      var q = '(' + chs.map(function (c) { return "'" + c.id + "' in parents"; }).join(' or ') + ')';
      witaDriveList(q, 'id,name,size,modifiedTime,parents').forEach(function (f) {
        var sn = byId[(f.parents || [])[0]];
        if (!sn) return;
        map[sn].push({ id: f.id, name: f.name, size: Number(f.size || 0),
          updated: Utilities.formatDate(new Date(f.modifiedTime), 'Asia/Seoul', 'MM-dd HH:mm') });
      });
    }
  }
  _witaScanCache[month] = map;
  return map;
}

function witaChannelFiles(month, sheetNo) {
  return witaScanMonth(month)[witaSn(sheetNo)] || [];
}

/**
 * 산출 산식들이 참조하는 컬럼명 모으기 (메인 파일 판별용).
 * top_lookup 의 라벨도 포함해야 한다 — 원본모드에서는 그 라벨이 곧 컬럼명이고,
 * 채널04·채널33톡처럼 산식이 전부 top_lookup 인 채널은 이게 없으면 후보가 0개가 된다.
 */
function witaWantedCols(outputs) {
  var set = {};
  Object.keys(outputs || {}).forEach(function (k) {
    var s = String(outputs[k]), m;
    var re = /col_sum(?:_all)?\(([^(),]+)\)/g;
    while ((m = re.exec(s)) !== null) set[m[1].trim()] = 1;
    var re2 = /col_sumif\(([^,]+),/g;
    while ((m = re2.exec(s)) !== null) set[m[1].trim()] = 1;
    // top_lookup(라벨행, 값행, 라벨) / top_lookup0(...) 의 3번째 인자
    var re3 = /top_lookup0?\(\s*\d+\s*,\s*\d+\s*,([^()]*(?:\([^()]*\)[^()]*)*)\)/g;
    while ((m = re3.exec(s)) !== null) set[m[1].trim()] = 1;
  });
  return Object.keys(set).filter(function (x) { return x && x !== '0'; });
}

/** 파일명 키워드로 역할 매칭 */
function witaMatchFile(files, keyword) {
  if (!keyword) return null;
  var kw = String(keyword).replace(/\s+/g, '');
  // '(메인)' 같은 표기는 키워드가 아니라 '첫 파일' 을 뜻한다
  if (kw === '(메인)' || kw === '메인') return files.length ? files[0] : null;
  for (var i = 0; i < files.length; i++) {
    if (files[i].name.replace(/\s+/g, '').indexOf(kw) >= 0) return files[i];
  }
  return null;
}

/**
 * 채널 1개 계산.
 * @return {{시트, 판매처, ok, 값:{}, 근거:{}, 문제:[]}}
 */
function witaComputeChannel(month, sheetNo, paramsOverride) {
  var rules = witaLoadRules();
  sheetNo = witaSn(sheetNo);
  var r = rules[sheetNo];
  if (!r) return { 시트: sheetNo, ok: false, 문제: ['룰에 없는 채널'] };

  var files = witaChannelFiles(month, sheetNo);
  var out = { 시트: sheetNo, 판매처: r.판매처, 브랜드: r.브랜드, 본부: r.본부,
              ok: false, 값: {}, 근거: {}, 문제: [], 파일: [] };
  if (!files.length) { out.문제.push('업로드된 파일 없음'); return out; }

  // ★같은 파일 + 같은 룰이면 결과도 같다 — 지문이 일치하면 저장된 결과를 그대로 반환.
  //   (엑셀이 빠른 원리와 동일: 바뀐 것만 다시 계산한다)
  var fp = files.map(function (f) { return f.id + ':' + f.updated; }).sort().join('|') +
           '#' + Utilities.base64Encode(Utilities.computeDigest(
                 Utilities.DigestAlgorithm.MD5, JSON.stringify(r)));
  if (!paramsOverride) {
    var saved = witaReadResults(month)[sheetNo];
    if (saved && saved.fp === fp) {
      saved.시트 = sheetNo; saved.판매처 = r.판매처; saved.브랜드 = r.브랜드; saved.본부 = r.본부;
      saved.캐시 = true;
      return saved;
    }
  }

  // 파라미터: 기본값 <- 시트, 덮어쓰기 <- 화면 입력
  var params = {};
  Object.keys(r.파라미터).forEach(function (k) { params[k] = r.파라미터[k]; });
  if (paramsOverride) Object.keys(paramsOverride).forEach(function (k) {
    if (paramsOverride[k] !== '' && paramsOverride[k] !== null) params[k] = paramsOverride[k];
  });

  // 0) 역추출 모드 — 월파일에서 뽑은 '역추출_<시트>.csv' 가 있으면 그걸로 계산.
  //    어드민 원본을 다시 안 받아도 과거 월을 통째로 재현할 수 있다.
  //    역추출 시트는 소계 미니표를 포함한 풀시트라, 원본모드 변환 없이(plain)
  //    채널의 헤더행·소계위치와 역추출 산식(top_lookup 등)을 그대로 쓴다.
  var exMain = null;
  for (var xi = 0; xi < files.length; xi++) {
    if (files[xi].name === '역추출_' + sheetNo + '.csv') { exMain = files[xi]; break; }
  }
  if (exMain && (r.산출R || Object.keys(r.산출).length)) {
    out.파일.push({ 역할: '역추출', 파일명: exMain.name });
    var exRows, exCtx = null, exSubs = {};
    try {
      exRows = witaLoadFile(DriveApp.getFileById(exMain.id));
      exCtx = new WitaCtx(exRows, r.헤더행, r.소계위치, false);
    } catch (e0) {
      out.문제.push('역추출 파일 해석 불가: ' + e0.message);
      return out;
    }
    // 부속 탭 (17-1, 21-2 ...) — 파일 룰의 sub: 역할로 정의됨
    Object.keys(r.파일).forEach(function (role) {
      if (role.indexOf('sub:') !== 0) return;
      var name = role.substring(4);
      var fs2 = r.파일[role];
      var hit2 = null;
      for (var yj = 0; yj < files.length; yj++) {
        if (files[yj].name === '역추출_' + name + '.csv') { hit2 = files[yj]; break; }
      }
      if (!hit2) return;
      try {
        var rows2 = witaLoadFile(DriveApp.getFileById(hit2.id));
        var ctx2 = new WitaCtx(rows2, fs2.파일헤더행 || 1, fs2.소계위치, false);
        var aggs2 = r.집계[role] || {};
        Object.keys(aggs2).forEach(function (an) {
          try {
            // sub(17-1, 배송비) 참조 키는 'sub:' 접두사 없이 저장
            exSubs[name + ' ' + an] = witaEvaluate(aggs2[an], ctx2, exSubs, params);
          } catch (e2) { out.문제.push(role + '.' + an + ': ' + e2.message); }
        });
      } catch (e1) { out.문제.push(role + ' 해석 불가: ' + e1.message); }
    });
    var exOuts = r.산출R || r.산출;
    var exOk = true;
    for (var xk = 0; xk < WITA_ITEMS.length; xk++) {
      var item0 = WITA_ITEMS[xk], expr0 = exOuts[item0];
      if (!expr0) { out.문제.push('역추출 산식 없음: ' + item0); exOk = false; continue; }
      var tr0 = [];
      try {
        out.값[item0] = Math.round(witaEvaluate(expr0, exCtx, exSubs, params, tr0));
        out.근거[item0] = { 산식: expr0, 값: out.값[item0], 세부: tr0 };
      } catch (e3) { out.문제.push(item0 + ': ' + e3.message); exOk = false; }
    }
    if (exOk) {
      var pen0 = params['패널티'] !== undefined && params['패널티'] !== '' ? Math.round(Number(params['패널티']) || 0) : 0;
      if (pen0) out.값['패널티'] = pen0;
      var lhs0 = (out.값['상품매출'] || 0) + (out.값['기타매출'] || 0) -
                 (out.값['수수료_별도'] || 0) - (out.값['수수료_계산서'] || 0) - pen0;
      var rhs0 = out.값['정산금액'] || 0;
      out.검증 = { 식: '상품 + 기타 − 별도 − 계산서 − 패널티 = 정산', 좌변: lhs0, 우변: rhs0,
                   차이: lhs0 - rhs0, 통과: Math.abs(lhs0 - rhs0) <= 1 };
    }
    out.ok = exOk && out.문제.length === 0;
    try {
      witaSaveResult(month, sheetNo, {
        값: out.값, 검증: out.검증 || null, 문제: out.문제, 파일: out.파일, fp: fp,
        시각: Utilities.formatDate(new Date(), 'Asia/Seoul', 'MM-dd HH:mm') });
    } catch (e4) {}
    return out;
  }

  // 1) 컨텍스트 준비
  //    (가) files 룰이 있는 멀티파일 채널 -> 역할별 매칭 후 집계 선계산
  //    (나) files 룰이 없는 단일파일 채널(채널20 등) -> 올라온 첫 파일을 메인으로
  //        어느 쪽이든 원본모드 컨텍스트를 쓴다(소계행 없음 -> top_lookup을 col_sum으로 변환).
  var subvals = {}, mainCtx = null;
  var roles = Object.keys(r.파일);
  if (roles.length) {
    for (var i = 0; i < roles.length; i++) {
      var role = roles[i], fspec = r.파일[role];
      var hit = witaMatchFile(files, fspec.키워드);
      if (!hit) {
        if (!fspec.선택) out.문제.push('파일 없음: ' + role + ' (키워드 "' + fspec.키워드 + '")');
        continue;
      }
      out.파일.push({ 역할: role, 파일명: hit.name });
      var rows;
      try {
        rows = witaLoadFile(DriveApp.getFileById(hit.id));
      } catch (e) {
        out.문제.push(role + ' 읽기 실패: ' + e.message);
        continue;
      }
      var plain = fspec.컨텍스트 === 'plain';
      // 파일 수준 헤더행이 지정돼 있으면 그게 최우선 (채널27 4행, 채널03 2행, 채널23 3행)
      var hrow = fspec.파일헤더행 || (plain ? r.헤더행 : (witaDetectHeader(rows) || r.헤더행));
      // 그룹헤더의 빈칸을 왼쪽 값으로 채움 — 채널27처럼 동명 컬럼을 col_sum_all 로 합치는 채널에 필수
      if (fspec.헤더왼쪽채움) witaFillHeaderLeft(rows, hrow);
      if (fspec.헤더보조행) witaMergeHeader(rows, hrow, fspec.헤더보조행);
      var ctx = new WitaCtx(rows, hrow, fspec.소계위치, !plain);
      if (!mainCtx) mainCtx = ctx;
      var aggs = r.집계[role] || {};
      (function (ctx2, role2, fname, ov) {
        Object.keys(aggs).forEach(function (an) {
          var tr = [];
          try {
            var v = witaEvaluate(aggs[an], ctx2, subvals, params, tr);
            subvals[role2 + ' ' + an] = v;
            out.근거[role2 + ' / ' + an] = { 산식: aggs[an], 값: Math.round(v), 세부: tr, 파일: fname };
          } catch (e) {
            out.문제.push(role2 + '.' + an + ': ' + e.message);
          }
        });
        // param_override: 이 파일이 올라왔으면 집계값이 수기 파라미터를 이긴다.
        // (채널29 패널티, 채널15 패널티, 채널35 부담할인 — 우선순위 파일 > 수기 > 기본값)
        Object.keys(ov || {}).forEach(function (pname) {
          var k = role2 + ' ' + ov[pname];
          if (subvals[k] !== undefined) {
            params[pname] = subvals[k];
            out.근거['파라미터 / ' + pname] = {
              산식: '파일 ' + fname + ' 의 [' + ov[pname] + '] 값으로 덮어씀',
              값: Math.round(subvals[k]), 세부: [] };
          }
        });
      })(ctx, role, hit.name, fspec.덮어쓰기);
    }
  } else {
    // 단일파일 채널이라도 폴더엔 부속 파일이 같이 있을 수 있다(채널20 = 정산내역 + 부가세 + 현금영수증).
    // Drive 목록은 순서를 보장하지 않으므로 '첫 파일'에 기대면 안 된다.
    // -> 산출 산식이 요구하는 컬럼이 실제로 있는 파일을 메인으로 고른다.
    var wanted = witaWantedCols(r.산출);
    var cands = files.slice().sort(function (a, b) { return a.name < b.name ? -1 : 1; });
    var picked = null, tried = [];
    for (var ci = 0; ci < cands.length; ci++) {
      var cand = cands[ci];
      try {
        var rowsC = witaLoadFile(DriveApp.getFileById(cand.id));
        var hC = witaDetectHeader(rowsC) || r.헤더행;
        var ctxC = new WitaCtx(rowsC, hC, 'above_header', true);
        var hit2 = 0;
        for (var wi = 0; wi < wanted.length; wi++) {
          try { ctxC.colIdx(wanted[wi]); hit2++; } catch (e2) {}
        }
        tried.push(cand.name + '(' + hit2 + '/' + wanted.length + ')');
        if (!picked || hit2 > picked.hit) picked = { file: cand, ctx: ctxC, hit: hit2, hrow: hC };
        if (wanted.length && hit2 === wanted.length) break;   // 완전 일치면 더 볼 것 없음
      } catch (e3) {
        tried.push(cand.name + '(읽기실패)');
      }
    }
    if (picked && picked.hit > 0) {
      mainCtx = picked.ctx;
      out.파일.push({ 역할: '(메인)', 파일명: picked.file.name });
      out.헤더행 = picked.hrow;
      if (wanted.length && picked.hit < wanted.length)
        out.문제.push('일부 컬럼을 못 찾음 (' + picked.hit + '/' + wanted.length + ') — 파일 확인 필요');
    } else {
      out.문제.push('산식에 맞는 파일을 못 찾음. 후보: ' + tried.join(', '));
    }
  }
  if (!mainCtx) { out.문제.push('메인 파일을 읽지 못했습니다'); return out; }

  // 2) 5개 산출값
  var okAll = true;
  for (var k = 0; k < WITA_ITEMS.length; k++) {
    var item = WITA_ITEMS[k], expr = r.산출[item];
    if (!expr) { out.문제.push('산식 없음: ' + item); okAll = false; continue; }
    var tr2 = [];
    try {
      var val = witaEvaluate(expr, mainCtx, subvals, params, tr2);
      out.값[item] = Math.round(val);
      out.근거[item] = { 산식: expr, 값: Math.round(val), 세부: tr2 };
    } catch (e) {
      out.문제.push(item + ': ' + e.message);
      okAll = false;
    }
  }

  // 3) 자체 검증식 — 상품 + 기타 − 별도 − 계산서 − 패널티 = 정산
  //    (월파일 TTL 의 대사식과 동일. 패널티를 빼지 않으면 채널29·채널16·채널23 가 항상 "차이"로 떴다)
  if (okAll) {
    var pen = params['패널티'] !== undefined && params['패널티'] !== '' ? Math.round(Number(params['패널티']) || 0) : 0;
    if (pen) out.값['패널티'] = pen;
    var lhs = (out.값['상품매출'] || 0) + (out.값['기타매출'] || 0) -
              (out.값['수수료_별도'] || 0) - (out.값['수수료_계산서'] || 0) - pen;
    var rhs = out.값['정산금액'] || 0;
    var diff = lhs - rhs;
    out.검증 = { 식: '상품 + 기타 − 별도 − 계산서 − 패널티 = 정산', 좌변: lhs, 우변: rhs, 차이: diff,
                 통과: Math.abs(diff) <= 1,
                 힌트: Math.abs(diff) > 1 && !pen ?
                   '차이가 패널티·기타공제라면 룰 편집 > 파라미터에 "패널티" 를 등록하세요' : '' };
  }
  out.ok = okAll && out.문제.length === 0;
  // 슬림 결과를 저장 — 집계탭이 새로고침 후에도 채워져 있게
  try {
    witaSaveResult(month, sheetNo, {
      값: out.값, 검증: out.검증 || null, 문제: out.문제, 파일: out.파일, fp: fp,
      시각: Utilities.formatDate(new Date(), 'Asia/Seoul', 'MM-dd HH:mm') });
  } catch (e) { /* 저장 실패해도 계산 결과는 반환 */ }
  return out;
}

/** 화면용: 채널 목록 + 파일 현황 */
function witaChannelList(month, fresh) {
  var cache = CacheService.getScriptCache();
  if (fresh) { witaClearRuleCache(); cache.remove('list_' + month); witaScanMonth(month, true); }
  else {
    var hit = cache.get('list_' + month);
    if (hit) { try { return JSON.parse(hit); } catch (e) {} }
  }
  var rules = witaLoadRules();
  var scan = witaScanMonth(month);
  var out = [];
  Object.keys(rules).sort().forEach(function (sn) {
    var r = rules[sn];
    var files = scan[sn] || [];
    var need = Object.keys(r.파일).filter(function (k) { return !r.파일[k].선택; });
    var got = need.filter(function (k) { return !!witaMatchFile(files, r.파일[k].키워드); });
    // 상세 화면의 필요파일 체크리스트용 — 역할별 확보 여부 + 어드민 경로
    var checklist = Object.keys(r.파일).map(function (k) {
      var fs = r.파일[k];
      return { 역할: k, 키워드: fs.키워드, 경로: fs.경로 || '', 선택: fs.선택,
               확보: !!witaMatchFile(files, fs.키워드) };
    });
    var cyc = witaCycleOf(r.판매처, r.입금주기);
    out.push({
      시트: sn, 판매처: r.판매처, 브랜드: r.브랜드, 본부: r.본부,
      원본모드: r.원본모드, 어드민경로: r.어드민경로,
      입금주기: cyc, 입금예정일: witaPayDate(month, cyc),
      필요: need.length, 확보: got.length, 파일수: files.length,
      파일: files.map(function (f) { return { name: f.name, size: f.size, updated: f.updated }; }),
      필요파일: checklist,
      파라미터: Object.keys(r.파라미터)
    });
  });
  var result = { 월: month, 채널: out, 결과: witaReadResults(month) };
  try { CacheService.getScriptCache().put('list_' + month, JSON.stringify(result), 90); } catch (e) {}
  return result;
}

/**
 * 위탁매출 계산엔진 (파이썬 src/wita/engine.py 이식본)
 *
 * 규칙 어휘
 *   col_sum(헤더명)                 헤더 아래 데이터행의 해당 컬럼 합
 *   col_sum_all(헤더명)             동명 컬럼 전부 합 (그룹헤더 펼친 경우)
 *   col_sumif(합계열, 조건열, 값)    조건 일치 행만 합 (값이 빈칸이면 '빈칸인 행')
 *   top_lookup(라벨행, 값행, 라벨)   헤더 위 미니표에서 라벨 찾아 값행 읽기
 *   top_lookup0(...)                위와 같되 라벨 없으면 0 (IFERROR 대응)
 *   cell(행, 열문자)                 특정 셀 직접
 *   sub(역할, 집계명)                다른 파일의 선계산 집계값
 *   param(이름)                      수기 파라미터
 *   ROUND(x, n)                      엑셀식 반올림 (JS Math.round 와 음수 처리가 다름)
 *
 * ★함정: col_sumif 를 col_sum 보다, col_sum_all 을 col_sum 보다 먼저 치환해야 한다.
 *        (접두어가 겹쳐서 순서가 틀리면 엉뚱하게 잘림)
 */

/** 숫자 파싱 — 콤마·공백 제거, 빈값/'-'는 0 */
function wNum(v) {
  if (v === null || v === undefined) return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  var s = String(v).trim().replace(/,/g, '').replace(/ /g, '');
  if (s === '' || s === '-' || s === 'None' || s === 'nan') return 0;
  // (1,234) 형태 음수
  var m = s.match(/^\((.+)\)$/);
  if (m) { var n0 = parseFloat(m[1]); return isFinite(n0) ? -n0 : 0; }
  var n = parseFloat(s);
  return isFinite(n) ? n : 0;
}

function wNorm(s) { return String(s === null || s === undefined ? '' : s).replace(/\s+/g, ''); }

/** 엑셀식 반올림 (0.5는 항상 절대값 증가 방향) */
function wRound(x, n) {
  n = n || 0;
  var m = Math.pow(10, n);
  return Math.floor(Math.abs(x) * m + 0.5) / m * (x >= 0 ? 1 : -1);
}

/**
 * 한 파일(2D 배열)의 컨텍스트.
 * @param {Array<Array>} rows  0-based 2D
 * @param {number} headerRow   1-based 헤더 행번호
 * @param {string} subtotal    'above_header' | 'below_header'
 */
function WitaCtx(rows, headerRow, subtotal, originalMode) {
  this.rows = rows || [];
  this.headerRow = headerRow || 1;
  this.header = (this.rows[this.headerRow - 1] || []).map(function (c) {
    return String(c === null || c === undefined ? '' : c).trim();
  });
  this.hnorm = this.header.map(wNorm);
  // 데이터 시작(0-based). 소계행이 헤더 바로 아래면 한 행 더 건너뛴다.
  this.dataStart = this.headerRow + (subtotal === 'below_header' ? 1 : 0);
  // 원본모드: 어드민 원본에는 월파일에 있던 소계행이 없다.
  // 그래서 top_lookup(헤더행, 소계행, 라벨)은 col_sum(라벨)과 수학적으로 같다 → 자동 변환.
  // (파이썬 original.py 의 OriginalCtx 와 동일 동작)
  this.originalMode = !!originalMode;
}

WitaCtx.prototype.colIdx = function (name) {
  var nm = String(name).trim();
  var i = this.header.indexOf(nm);
  if (i >= 0) return i;
  var n = wNorm(nm);
  i = this.hnorm.indexOf(n);
  if (i >= 0) return i;
  throw new Error('컬럼 없음: ' + nm + ' (헤더: ' + this.header.slice(0, 12).join(' | ') + ')');
};

WitaCtx.prototype.col_sum = function (name) {
  var ci = this.colIdx(name), s = 0;
  for (var r = this.dataStart; r < this.rows.length; r++) {
    var row = this.rows[r];
    if (row && ci < row.length) s += wNum(row[ci]);
  }
  return s;
};

WitaCtx.prototype.col_sum_all = function (name) {
  var n = wNorm(name), idxs = [], s = 0;
  for (var i = 0; i < this.hnorm.length; i++) if (this.hnorm[i] === n) idxs.push(i);
  if (!idxs.length) throw new Error('컬럼 없음: ' + name);
  for (var r = this.dataStart; r < this.rows.length; r++) {
    var row = this.rows[r];
    if (!row) continue;
    for (var k = 0; k < idxs.length; k++) if (idxs[k] < row.length) s += wNum(row[idxs[k]]);
  }
  return s;
};

WitaCtx.prototype.col_sumif = function (sumCol, critCol, critVal) {
  var si = this.colIdx(sumCol), ci = this.colIdx(critCol);
  var want = String(critVal === undefined ? '' : critVal).trim();
  var s = 0;
  for (var r = this.dataStart; r < this.rows.length; r++) {
    var row = this.rows[r];
    if (!row || ci >= row.length) continue;
    var got = String(row[ci] === null || row[ci] === undefined ? '' : row[ci]).trim();
    if (got === want && si < row.length) s += wNum(row[si]);
  }
  return s;
};

WitaCtx.prototype.top_lookup = function (labelRow, valueRow, label) {
  var want = String(label).trim();
  // 원본모드에서 라벨이 헤더 컬럼명이면 = 소계 참조였던 것 → 데이터 합으로 동치 변환
  if (this.originalMode) {
    if (this.header.indexOf(want) >= 0 || this.hnorm.indexOf(wNorm(want)) >= 0) {
      return this.col_sum(want);
    }
  }
  var lr = this.rows[labelRow - 1] || [];
  for (var i = 0; i < lr.length; i++) {
    if (String(lr[i] === null || lr[i] === undefined ? '' : lr[i]).trim() === want) {
      var vr = this.rows[valueRow - 1] || [];
      return wNum(vr[i]);
    }
  }
  throw new Error(labelRow + '행에서 라벨 없음: ' + want);
};

WitaCtx.prototype.top_lookup0 = function (labelRow, valueRow, label) {
  try { return this.top_lookup(labelRow, valueRow, label); } catch (e) { return 0; }
};

/** 엑셀 열문자 -> 0-based 인덱스 (A=0, AA=26) */
function wColLetter(s) {
  s = String(s).trim().toUpperCase();
  var n = 0;
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i) - 64;
    if (c < 1 || c > 26) throw new Error('열문자 아님: ' + s);
    n = n * 26 + c;
  }
  return n - 1;
}

WitaCtx.prototype.cell = function (row, colLetter) {
  var ci = wColLetter(colLetter);
  var r = this.rows[row - 1] || [];
  return ci < r.length ? wNum(r[ci]) : 0;
};

/** expr 에서 fn( ... ) 하나를 찾아 [시작, 끝+1, 인자문자열] — 괄호 중첩 대응 */
function wFindCall(expr, fn) {
  var i = expr.indexOf(fn + '(');
  if (i < 0) return null;
  var depth = 0;
  for (var j = i + fn.length; j < expr.length; j++) {
    if (expr[j] === '(') depth++;
    else if (expr[j] === ')') {
      depth--;
      if (depth === 0) return [i, j + 1, expr.substring(i + fn.length + 1, j)];
    }
  }
  throw new Error('괄호 불일치: ' + expr);
}

/** 인자 문자열을 n개로 자르기 (파이썬 split(',', n) 과 동일: 마지막은 안 자름) */
function wSplitArgs(s, n) {
  var out = [], cur = '', cnt = 0;
  for (var i = 0; i < s.length; i++) {
    if (s[i] === ',' && cnt < n) { out.push(cur); cur = ''; cnt++; }
    else cur += s[i];
  }
  out.push(cur);
  return out;
}

/**
 * 규칙식 -> 숫자.
 * @param {string} expr
 * @param {WitaCtx} ctx      기본 컨텍스트 (없어도 됨 — sub/param 만 쓰는 식)
 * @param {Object} subvals   {"역할 집계명": 값}
 * @param {Object} params    수기 파라미터
 * @param {Array}  trace     (선택) 치환 로그를 담을 배열 — 화면에 근거 표시용
 */
function witaEvaluate(expr, ctx, subvals, params, trace) {
  expr = String(expr);
  var guard = 0;
  var push = function (kind, arg, val) {
    if (trace) trace.push({ 함수: kind, 인자: String(arg).trim(), 값: val });
  };
  while (true) {
    if (++guard > 500) throw new Error('치환 루프 과다: ' + expr);
    var hit;

    hit = wFindCall(expr, 'param');
    if (hit) {
      var pname = hit[2].trim();
      if (!params || params[pname] === undefined || params[pname] === '')
        throw new Error('파라미터 없음: ' + pname + ' (화면에서 입력 필요)');
      var pv = wNum(params[pname]);
      push('param', pname, pv);
      expr = expr.substring(0, hit[0]) + '(' + pv + ')' + expr.substring(hit[1]);
      continue;
    }
    // ★ col_sum_all -> col_sumif -> col_sum 순서 (접두어 겹침)
    hit = wFindCall(expr, 'col_sum_all');
    if (hit) {
      var v1 = ctx.col_sum_all(hit[2]);
      push('col_sum_all', hit[2], v1);
      expr = expr.substring(0, hit[0]) + '(' + v1 + ')' + expr.substring(hit[1]);
      continue;
    }
    hit = wFindCall(expr, 'col_sumif');
    if (hit) {
      var a2 = wSplitArgs(hit[2], 2);
      var v2 = ctx.col_sumif(a2[0], a2[1], a2[2]);
      push('col_sumif', hit[2], v2);
      expr = expr.substring(0, hit[0]) + '(' + v2 + ')' + expr.substring(hit[1]);
      continue;
    }
    hit = wFindCall(expr, 'col_sum');
    if (hit) {
      var v3 = ctx.col_sum(hit[2]);
      push('col_sum', hit[2], v3);
      expr = expr.substring(0, hit[0]) + '(' + v3 + ')' + expr.substring(hit[1]);
      continue;
    }
    hit = wFindCall(expr, 'top_lookup0');
    if (hit) {
      var a4 = wSplitArgs(hit[2], 2);
      var v4 = ctx.top_lookup0(parseInt(a4[0], 10), parseInt(a4[1], 10), a4[2]);
      push('top_lookup0', hit[2], v4);
      expr = expr.substring(0, hit[0]) + '(' + v4 + ')' + expr.substring(hit[1]);
      continue;
    }
    hit = wFindCall(expr, 'top_lookup');
    if (hit) {
      var a5 = wSplitArgs(hit[2], 2);
      var v5 = ctx.top_lookup(parseInt(a5[0], 10), parseInt(a5[1], 10), a5[2]);
      push('top_lookup', hit[2], v5);
      expr = expr.substring(0, hit[0]) + '(' + v5 + ')' + expr.substring(hit[1]);
      continue;
    }
    hit = wFindCall(expr, 'cell');
    if (hit) {
      var a6 = wSplitArgs(hit[2], 1);
      var v6 = ctx.cell(parseInt(a6[0], 10), a6[1]);
      push('cell', hit[2], v6);
      expr = expr.substring(0, hit[0]) + '(' + v6 + ')' + expr.substring(hit[1]);
      continue;
    }
    hit = wFindCall(expr, 'sub');
    if (hit) {
      var a7 = wSplitArgs(hit[2], 1);
      var k = a7[0].trim() + ' ' + a7[1].trim();
      if (!subvals || subvals[k] === undefined)
        throw new Error('집계 없음: [' + k + '] · 있는 키: ' + (subvals ? Object.keys(subvals).join(' | ') : '(없음)'));
      push('sub', hit[2], subvals[k]);
      expr = expr.substring(0, hit[0]) + '(' + subvals[k] + ')' + expr.substring(hit[1]);
      continue;
    }
    break;
  }
  return witaArith(expr);
}

/**
 * 산술만 남은 식을 계산. eval 대신 자체 파서 — 함수 치환이 덜 된 경우를 조용히 넘기지 않는다.
 * 지원: + - * / ( ) 숫자, ROUND(x,n)
 */
function witaArith(expr) {
  // ROUND 먼저 처리 (중첩 대응)
  var g = 0;
  while (true) {
    if (++g > 200) throw new Error('ROUND 루프 과다');
    var hit = wFindCall(expr, 'ROUND');
    if (!hit) break;
    var a = wSplitArgs(hit[2], 1);
    var x = witaArith(a[0]);
    var n = a.length > 1 && String(a[1]).trim() !== '' ? witaArith(a[1]) : 0;
    expr = expr.substring(0, hit[0]) + '(' + wRound(x, n) + ')' + expr.substring(hit[1]);
  }
  if (!/^[\d\s+\-*/().eE]*$/.test(expr))
    throw new Error('식에 미치환 토큰이 남음: ' + expr.substring(0, 120));
  var s = expr.replace(/\s+/g, '');
  if (s === '') return 0;
  var pos = 0;
  function parseExpr() {
    var v = parseTerm();
    while (pos < s.length && (s[pos] === '+' || s[pos] === '-')) {
      var op = s[pos++];
      var r = parseTerm();
      v = op === '+' ? v + r : v - r;
    }
    return v;
  }
  function parseTerm() {
    var v = parseFactor();
    while (pos < s.length && (s[pos] === '*' || s[pos] === '/')) {
      var op = s[pos++];
      var r = parseFactor();
      v = op === '*' ? v * r : (r === 0 ? 0 : v / r);
    }
    return v;
  }
  function parseFactor() {
    if (s[pos] === '+') { pos++; return parseFactor(); }
    if (s[pos] === '-') { pos++; return -parseFactor(); }
    if (s[pos] === '(') {
      pos++;
      var v = parseExpr();
      if (s[pos] !== ')') throw new Error('괄호 불일치');
      pos++;
      return v;
    }
    var st = pos;
    while (pos < s.length && /[\d.eE]/.test(s[pos])) {
      // 지수표기 1e-5 의 부호
      if ((s[pos] === 'e' || s[pos] === 'E') && (s[pos + 1] === '+' || s[pos + 1] === '-')) pos++;
      pos++;
    }
    var num = parseFloat(s.substring(st, pos));
    if (!isFinite(num)) throw new Error('숫자 파싱 실패: ' + s.substring(st, st + 20));
    return num;
  }
  var out = parseExpr();
  if (pos !== s.length) throw new Error('식 해석 실패(남은 문자): ' + s.substring(pos, pos + 20));
  return out;
}


/**
 * 정산파일 로더 (파이썬 src/wita/original.py 의 _load_original_raw 이식본)
 *
 * 어드민이 주는 파일은 확장자를 못 믿는다. magic bytes 로 진짜 포맷을 판별한다.
 *   PK..        -> 진짜 xlsx  : Drive 변환 후 시트로 읽기
 *   D0CF11E0    -> 진짜 xls   : Drive 변환 (단, 암호화면 GAS 로는 불가)
 *   그 외        -> HTML 위장  : 텍스트로 읽어 <table> 파싱
 *
 * 파이썬판과의 유일한 차이: 암호화 엑셀(채널17·채널35)은 GAS 에서 복호화가
 * 불가능하므로 명확한 에러로 되돌린다 — 조용히 빈 값을 내지 않는다.
 */

var WITA_CACHE_PROP = 'witaFileCache';

/**
 * 시트 값 정규화.
 * ★getDisplayValues() 를 쓰면 안 된다 — 셀 서식이 적용된 '보이는 문자열'이라
 *   소수점이 반올림된 채로 합산돼 원본과 값이 달라진다(채널19에서 실제로 2,219,974 차이).
 *   getValues() 로 실제 값을 받고, 날짜만 문자열로 바꿔 파이썬(dtype=str)과 동작을 맞춘다.
 */
function witaNormalizeValues(vals) {
  return vals.map(function (row) {
    return row.map(function (v) {
      if (v === null || v === undefined) return '';
      if (Object.prototype.toString.call(v) === '[object Date]')
        return Utilities.formatDate(v, 'Asia/Seoul', 'yyyy-MM-dd');
      return v;   // number 는 숫자 그대로, 문자열은 문자열 그대로
    });
  });
}

/** Blob 앞부분 바이트로 포맷 판별 */
function witaSniff(blob) {
  var b = blob.getBytes();
  if (b.length >= 2 && (b[0] & 0xff) === 0x50 && (b[1] & 0xff) === 0x4b) return 'xlsx';
  if (b.length >= 4 && (b[0] & 0xff) === 0xd0 && (b[1] & 0xff) === 0xcf &&
      (b[2] & 0xff) === 0x11 && (b[3] & 0xff) === 0xe0) return 'ole';
  return 'text';
}

/** 여러 인코딩으로 시도해 한글이 안 깨지는 쪽을 고른다 */
function witaDecode(blob) {
  var encs = ['UTF-8', 'EUC-KR'];
  var best = null, bestBad = 1e9;
  for (var i = 0; i < encs.length; i++) {
    var t;
    try { t = blob.getDataAsString(encs[i]); } catch (e) { continue; }
    // 치환문자(U+FFFD) 개수가 적은 쪽이 올바른 인코딩
    var bad = (t.match(/�/g) || []).length;
    if (bad < bestBad) { bestBad = bad; best = t; }
    if (bad === 0) break;
  }
  return best || '';
}

/**
 * HTML 표 -> 2D 배열 (XmlService 는 어드민 HTML 의 비정형 태그에 자주 실패해서 정규식 사용)
 *
 * ★colspan / rowspan 을 반드시 펼쳐야 한다.
 *   채널03 정산내역은 1행이 그룹헤더(병합), 2행이 서브헤더, 3행이 합계인데
 *   병합을 1칸으로 넣으면 열 위치가 어긋나 top_lookup(1,3,라벨) 이 엉뚱한 값을 읽는다.
 *   (파이썬 pandas.read_html 은 자동으로 펼쳐준다)
 */
function witaParseHtmlTable(html) {
  var tables = html.match(/<table[\s\S]*?<\/table>/gi) || [];
  if (!tables.length) tables = [html];
  var best = [], bestN = -1;

  function cellText(c) {
    return c.replace(/<br\s*\/?>/gi, ' ')
      .replace(/<[^>]+>/g, '')
      .replace(/&nbsp;/gi, ' ')
      .replace(/&amp;/gi, '&').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
      .replace(/&quot;/gi, '"').replace(/&#39;/gi, "'")
      .trim();
  }
  function spanOf(tag, name) {
    var m = tag.match(new RegExp(name + '\\s*=\\s*["\']?(\\d+)', 'i'));
    var n = m ? parseInt(m[1], 10) : 1;
    return (isFinite(n) && n > 0) ? n : 1;
  }

  for (var t = 0; t < tables.length; t++) {
    var rows = [];
    var carry = {};          // {열: {v:값, n:남은행수}}  rowspan 전파용
    var trs = tables[t].match(/<tr[\s\S]*?<\/tr>/gi) || [];
    for (var i = 0; i < trs.length; i++) {
      var cells = trs[i].match(/<t[dh][^>]*>[\s\S]*?<\/t[dh]>/gi) || [];
      var row = [], col = 0;
      var place = function () {                    // rowspan 으로 내려온 값 먼저 채움
        while (carry[col]) {
          row[col] = carry[col].v;
          if (--carry[col].n <= 0) delete carry[col];
          col++;
        }
      };
      place();
      for (var j = 0; j < cells.length; j++) {
        var open = cells[j].match(/<t[dh][^>]*>/i)[0];
        var v = cellText(cells[j]);
        var cs = spanOf(open, 'colspan'), rs = spanOf(open, 'rowspan');
        for (var k = 0; k < cs; k++) {
          row[col] = v;
          if (rs > 1) carry[col] = { v: v, n: rs - 1 };
          col++;
          place();
        }
      }
      for (var z = 0; z < row.length; z++) if (row[z] === undefined) row[z] = '';
      if (row.length) rows.push(row);
    }
    if (rows.length > bestN) { bestN = rows.length; best = rows; }
  }
  return best;
}

/** CSV 텍스트 -> 2D (따옴표 안의 콤마/개행 대응) */
function witaParseCsv(text) {
  return Utilities.parseCsv(text);
}

/**
 * Drive 파일을 Google Sheets 로 변환해 2D 로 읽는다. 변환본은 즉시 삭제.
 * @param {Blob} blob
 * @param {string} name
 */
/**
 * 변환 결과 캐시.
 * Drive 변환은 파일당 수 초가 걸린다. 같은 파일을 다시 계산할 때마다 변환하면
 * 26채널 재계산이 몇 분이 된다 -> 변환된 시트를 지우지 않고 보관해 재사용.
 * 키 = 원본파일ID + 최종수정시각 (파일이 바뀌면 자동으로 새 키가 되어 갱신된다.
 *      파이썬판이 mtime 으로 캐시하던 것과 같은 발상)
 */
function witaCacheFolder() {
  var root = witaRootFolder();
  var it = root.getFoldersByName('_변환캐시');
  return it.hasNext() ? it.next() : root.createFolder('_변환캐시');
}

function witaConvertCached(file) {
  var key = 'wc_' + file.getId() + '_' + file.getLastUpdated().getTime();
  var cf = witaCacheFolder();
  var it = cf.getFilesByName(key);
  if (it.hasNext()) {
    try {
      return witaNormalizeValues(
        SpreadsheetApp.openById(it.next().getId()).getSheets()[0].getDataRange().getValues());
    } catch (e) { /* 캐시가 깨졌으면 재변환 */ }
  }
  var res = witaViaDriveConvertRaw(file.getBlob(), file.getName());
  try {
    var conv = DriveApp.getFileById(res.id);
    conv.setName(key);
    cf.addFile(conv);
    DriveApp.getRootFolder().removeFile(conv);
  } catch (e) { /* 이동 실패해도 값은 이미 얻었다 */ }
  return res.values;
}

function witaViaDriveConvert(blob, name) {
  return witaViaDriveConvertRaw(blob, name).values;
}

function witaViaDriveConvertRaw(blob, name) {
  var token = ScriptApp.getOAuthToken();
  var meta = { name: 'wita_tmp_' + name, mimeType: MimeType.GOOGLE_SHEETS };
  var boundary = '-------wita' + Date.now();
  var payload = Utilities.newBlob(
    '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' +
    JSON.stringify(meta) + '\r\n--' + boundary + '\r\nContent-Type: application/octet-stream\r\n\r\n'
  ).getBytes()
    .concat(blob.getBytes())
    .concat(Utilities.newBlob('\r\n--' + boundary + '--').getBytes());

  var res = UrlFetchApp.fetch(
    'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true', {
      method: 'post',
      contentType: 'multipart/related; boundary=' + boundary,
      payload: payload,
      headers: { Authorization: 'Bearer ' + token },
      muteHttpExceptions: true
    });
  if (res.getResponseCode() >= 300)
    throw new Error('Drive 변환 실패(' + res.getResponseCode() + '): ' +
                    res.getContentText().substring(0, 200));
  var id = JSON.parse(res.getContentText()).id;
  var sh = SpreadsheetApp.openById(id).getSheets()[0];
  return { id: id, values: witaNormalizeValues(sh.getDataRange().getValues()) };
}

/**
 * 파일 1개 -> 2D 배열.
 * @param {GoogleAppsScript.Drive.File} file
 */
function witaLoadFile(file) {
  var name = file.getName();
  var blob = file.getBlob();
  var kind = witaSniff(blob);

  if (/\.csv$/i.test(name)) return witaParseCsv(witaDecode(blob));

  if (kind === 'ole') {
    // 암호화 여부는 OLE 내부를 봐야 정확하지만, GAS 는 어차피 복호화를 못 한다.
    // Drive 변환을 시도하고 실패하면 암호화로 안내한다.
    try {
      return witaConvertCached(file);
    } catch (e) {
      throw new Error('이 파일은 GAS에서 열 수 없습니다 (암호화된 엑셀로 보임). ' +
        '엑셀에서 암호를 풀어 다시 저장한 뒤 올려주세요. — ' + name);
    }
  }
  if (kind === 'xlsx') return witaConvertCached(file);

  // text: HTML 위장 or 순수 텍스트
  var text = witaDecode(blob);
  if (/<\s*table/i.test(text)) return witaParseHtmlTable(text);
  if (text.indexOf('\t') >= 0) {
    return text.split(/\r?\n/).map(function (l) { return l.split('\t'); });
  }
  return witaParseCsv(text);
}

/** 헤더행 자동탐지 — 비어있지 않은 셀 수가 최대치의 80% 이상인 첫 행(1-based) */
function witaDetectHeader(rows, scan) {
  scan = scan || 20;
  var counts = [];
  for (var i = 0; i < Math.min(scan, rows.length); i++) {
    var c = 0, r = rows[i] || [];
    for (var j = 0; j < r.length; j++) if (String(r[j] || '').trim() !== '') c++;
    counts.push(c);
  }
  if (!counts.length) return 1;
  var mx = Math.max.apply(null, counts);
  // 파이썬판과 동일 조건: 최대치의 80% 이상 && 최소 3칸 (제목 한 줄짜리를 헤더로 오인하지 않게)
  for (var k = 0; k < counts.length; k++) if (counts[k] >= mx * 0.8 && counts[k] >= 3) return k + 1;
  return counts.indexOf(mx) + 1;
}

/** 그룹헤더 빈칸을 왼쪽 값으로 채움 (채널27 4행 그룹헤더 대응) */
function witaFillHeaderLeft(rows, headerRow) {
  var h = rows[headerRow - 1];
  if (!h) return;
  var last = '';
  for (var i = 0; i < h.length; i++) {
    var v = String(h[i] || '').trim();
    if (v) last = v; else h[i] = last;
  }
}

/** 2단 헤더 병합 — 메인행 빈칸을 보조행 값으로 보충 (채널23몰 3행+4행) */
function witaMergeHeader(rows, headerRow, helperRow) {
  var h = rows[headerRow - 1], s = rows[helperRow - 1];
  if (!h || !s) return;
  for (var i = 0; i < Math.max(h.length, s.length); i++) {
    if (!String(h[i] || '').trim() && String(s[i] || '').trim()) h[i] = s[i];
  }
}


/**
 * 룰 저장소 — Drive JSON 파일 1개.
 *
 * 왜 시트가 아니라 Drive JSON 인가 (어진 결정, 2026-08-28):
 *   - 관리 지점을 웹앱 하나로 (시트를 따로 열 일이 없어야 한다)
 *   - Drive 는 파일 버전 이력을 자동 보관하므로 룰을 잘못 고쳐도 되돌릴 수 있다
 *     ※ GAS 배포 버전 기록은 '코드'만 담는다. 스크립트 속성에 넣은 데이터는 거기 안 들어가고
 *       키당 9KB 제한도 있어서(룰이 26KB) 부적합.
 *
 * 파일: <업로드 루트>/_rules.json
 * 구조: { 채널:[...], 파일:[...], 집계:[...], 산출:[...], 파라미터:[...] }
 */

var WITA_RULES_FILE = '_rules.json';

var WITA_COLS = {
  채널: ['시트', '판매처', '브랜드', '본부', '헤더행', '소계위치', '원본모드', '입금주기', '어드민경로'],
  파일: ['시트', '역할', '파일명키워드', '소계위치', '파일헤더행', '헤더왼쪽채움', '헤더보조행',
        '선택', '컨텍스트', '파라미터덮어쓰기', '경로'],
  집계: ['시트', '역할', '집계명', '산식'],
  산출: ['시트', '항목', '산식', '모드'],
  파라미터: ['시트', '이름', '기본값'],
  부가세: ['시트', '구분', '파일키워드', '합계컬럼', '키컬럼', '메인파일', '메인키']
};
var WITA_KEYS = ['채널', '파일', '집계', '산출', '파라미터', '부가세'];

/** 룰 JSON 파일 (없으면 시드로 생성) */
function witaRulesFile(create) {
  var root = witaRootFolder();
  var it = root.getFilesByName(WITA_RULES_FILE);
  if (it.hasNext()) return it.next();
  if (!create) return null;
  return root.createFile(WITA_RULES_FILE,
    JSON.stringify(witaRulesSeed(), null, 1), MimeType.PLAIN_TEXT);
}

/** 원본 룰 데이터(행 배열) 읽기 */
function witaRulesData() {
  var f = witaRulesFile(true);
  try {
    return JSON.parse(f.getBlob().getDataAsString('UTF-8'));
  } catch (e) {
    throw new Error('_rules.json 을 읽지 못했습니다: ' + e.message +
      ' — Drive 에서 이전 버전으로 되돌리거나 [룰 초기화]를 실행하세요.');
  }
}

/** 룰 저장. Drive 가 이전 내용을 버전으로 보관하므로 되돌리기가 가능하다. */
function witaSaveRules(data) {
  WITA_KEYS.forEach(function (k) {
    if (data[k] && !(data[k] instanceof Array))
      throw new Error('저장 거부: ' + k + ' 가 배열이 아닙니다');
  });
  if (!data['채널'] || !data['채널'].length)
    throw new Error('저장 거부: 채널이 비어 있습니다');
  witaRulesFile(true).setContent(JSON.stringify(data, null, 1));
  witaClearRuleCache();
  return { ok: true, 저장시각: Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm:ss') };
}

/** 시드로 되돌리기 (파일 버전이 남으므로 안전) */
function witaResetRules() {
  witaRulesFile(true).setContent(JSON.stringify(witaRulesSeed(), null, 1));
  witaClearRuleCache();
  var d = witaRulesData();
  return WITA_KEYS.map(function (k) { return k + '(' + (d[k] || []).length + ')'; });
}

/** 계산용 채널별 룰 (5분 캐시 — 계산마다 파일을 다시 읽지 않게) */
function witaLoadRules() {
  var cache = CacheService.getScriptCache();
  var hit = cache.get('witaRules');
  if (hit) {
    try { return JSON.parse(hit); } catch (e) { /* 깨졌으면 새로 읽는다 */ }
  }
  var built = witaBuildRules(witaRulesData());
  try { cache.put('witaRules', JSON.stringify(built), 300); } catch (e) { /* 100KB 초과 시 생략 */ }
  return built;
}

function witaClearRuleCache() {
  CacheService.getScriptCache().remove('witaRules');
  return true;
}

/** 행 배열 -> 채널별 구조 */
function witaBuildRules(d) {
  var ch = {};
  (d['채널'] || []).forEach(function (r) {
    var sn = witaSn(r['시트']);
    if (!sn) return;
    ch[sn] = {
      시트: sn, 판매처: r['판매처'], 브랜드: r['브랜드'], 본부: r['본부'],
      헤더행: Number(r['헤더행']) || 1,
      소계위치: String(r['소계위치'] || 'above_header'),
      원본모드: String(r['원본모드'] || 'N') === 'Y',
      입금주기: r['입금주기'] || '',
      어드민경로: r['어드민경로'],
      파일: {}, 집계: {}, 산출: {}, 파라미터: {}
    };
  });
  var numOrNull = function (v) {
    return (v === '' || v === undefined || v === null) ? null : Number(v);
  };
  (d['파일'] || []).forEach(function (r) {
    var c = ch[witaSn(r['시트'])]; if (!c) return;
    c.파일[String(r['역할']).trim()] = {
      키워드: String(r['파일명키워드'] || '').trim(),
      소계위치: String(r['소계위치'] || 'above_header'),
      파일헤더행: numOrNull(r['파일헤더행']),
      헤더왼쪽채움: String(r['헤더왼쪽채움'] || '') === 'Y',
      헤더보조행: numOrNull(r['헤더보조행']),
      선택: String(r['선택'] || 'N') === 'Y',
      컨텍스트: String(r['컨텍스트'] || ''),
      덮어쓰기: witaParseOverride(r['파라미터덮어쓰기']),
      경로: r['경로']
    };
  });
  (d['집계'] || []).forEach(function (r) {
    var c = ch[witaSn(r['시트'])]; if (!c) return;
    var role = String(r['역할']).trim();
    if (!c.집계[role]) c.집계[role] = {};
    c.집계[role][String(r['집계명']).trim()] = String(r['산식']);
  });
  (d['산출'] || []).forEach(function (r) {
    var c = ch[witaSn(r['시트'])]; if (!c) return;
    var mode = String(r['모드'] || '');
    var item = String(r['항목']).trim();
    if (mode === '역추출') {
      // 역추출 산식(월파일 시트용)은 따로 보관 — 역추출 CSV 로 계산할 때 쓴다
      if (!c.산출R) c.산출R = {};
      c.산출R[item] = String(r['산식']);
      if (!c.산출[item]) c.산출[item] = String(r['산식']);   // 원본 산식이 없는 채널은 이걸 기본으로
      return;
    }
    c.산출[item] = String(r['산식']);
  });
  (d['파라미터'] || []).forEach(function (r) {
    var c = ch[witaSn(r['시트'])]; if (!c) return;
    c.파라미터[String(r['이름']).trim()] = r['기본값'];
  });
  (d['부가세'] || []).forEach(function (r) {
    var c = ch[witaSn(r['시트'])]; if (!c) return;
    if (!c.부가세) c.부가세 = [];
    c.부가세.push({ 구분: r['구분'], 파일키워드: String(r['파일키워드'] || ''),
      합계컬럼: String(r['합계컬럼'] || '').split(';').filter(String),
      키컬럼: String(r['키컬럼'] || '').split(';').filter(String),
      메인파일: String(r['메인파일'] || ''), 메인키: String(r['메인키'] || '').split(';').filter(String) });
  });
  return ch;
}

/** "패널티=보상합; 부담할인=부담할인합" -> {패널티:'보상합', ...} */
function witaParseOverride(s) {
  var out = {};
  String(s || '').split(';').forEach(function (part) {
    var i = part.indexOf('=');
    if (i > 0) out[part.substring(0, i).trim()] = part.substring(i + 1).trim();
  });
  return out;
}

/* ===== 화면용 룰 편집 API ===== */

/** 채널 하나의 모든 룰 행 */
function witaRuleOf(sheetNo) {
  var sn = witaSn(sheetNo);
  var d = witaRulesData();
  var pick = function (key) {
    return (d[key] || []).filter(function (r) { return witaSn(r['시트']) === sn; });
  };
  var o = { 시트: sn, 컬럼: WITA_COLS };
  WITA_KEYS.forEach(function (k) { o[k] = pick(k); });
  return o;
}

/** 채널 하나의 룰을 통째로 교체 저장 */
function witaSaveRuleOf(sheetNo, payload) {
  var sn = witaSn(sheetNo);
  var d = witaRulesData();
  WITA_KEYS.forEach(function (key) {
    var others = (d[key] || []).filter(function (r) { return witaSn(r['시트']) !== sn; });
    var mine = (payload[key] || []).filter(function (r) {
      // 전부 빈 행은 버린다
      return WITA_COLS[key].some(function (col) {
        return col !== '시트' && String(r[col] === undefined ? '' : r[col]).trim() !== '';
      });
    }).map(function (r) {
      var o = {};
      WITA_COLS[key].forEach(function (col) {
        o[col] = (col === '시트') ? sn : (r[col] === undefined ? '' : r[col]);
      });
      return o;
    });
    d[key] = others.concat(mine);
  });
  witaSaveRules(d);
  return witaRuleOf(sn);
}

/** 신규 채널 추가 (빈 골격) */
function witaAddChannel(sheetNo, seller) {
  var sn = witaSn(sheetNo);
  var d = witaRulesData();
  if ((d['채널'] || []).some(function (r) { return witaSn(r['시트']) === sn; }))
    throw new Error('이미 있는 채널입니다: ' + sn);
  d['채널'].push({ 시트: sn, 판매처: seller || '', 브랜드: '', 본부: '',
                  헤더행: 1, 소계위치: 'above_header', 원본모드: 'N', 어드민경로: '' });
  ['상품매출', '기타매출', '수수료_별도', '수수료_계산서', '정산금액'].forEach(function (item) {
    d['산출'].push({ 시트: sn, 항목: item, 산식: '0', 모드: '원본' });
  });
  witaSaveRules(d);
  return witaRuleOf(sn);
}

/** 채널 삭제 */
function witaDeleteChannel(sheetNo) {
  var sn = witaSn(sheetNo);
  var d = witaRulesData();
  WITA_KEYS.forEach(function (key) {
    d[key] = (d[key] || []).filter(function (r) { return witaSn(r['시트']) !== sn; });
  });
  witaSaveRules(d);
  return { ok: true };
}

/**
 * 엑셀 다운로드 — 실제 월파일(07월_위탁매출_v8)·전표입력(_v7) 레이아웃 재현
 *
 * 방식: 임시 Google Sheets 를 만들어 채우고 xlsx export 링크 반환.
 * 카과/현과: 세무구분 채널(채널20·채널12·채널35·채널07·채널29·채널09직접발행)만 분해.
 *   분해값은 <루트>/_taxsplit_<월>.json (부가세 분해파일에서 추출). 없으면 건별=전액.
 */

var WITA_TTL_HEADER = ['판매처', '브랜드명', '본부명', '시트명',
  '상품매출(-v)', '상품매출(+v)', '기타매출(+v)',
  '판매수수료\n(별도반영/v+)', '판매수수료\n(계산서발행/v+)', '정산대상액', '패널티', '대사'];

function witaExportFolder() {
  var root = witaRootFolder();
  var it = root.getFoldersByName('_다운로드');
  return it.hasNext() ? it.next() : root.createFolder('_다운로드');
}

function witaReadTaxSplit(month) {
  var it = witaRootFolder().getFilesByName('_taxsplit_' + month + '.json');
  if (!it.hasNext()) return {};
  try { return JSON.parse(it.next().getBlob().getDataAsString('UTF-8')); } catch (e) { return {}; }
}

function witaSupply(v) { return Math.round(v / 1.1); }   // 공급가 (엑셀 ROUND(/1.1) 동일)

/**
 * 부가세 분해 자동계산 (파이썬 tax_split_compute 이식).
 * 분해파일(부가세신고데이터·VATDeclaration·현금영수증 등)을 채널 폴더에서 찾아
 * 카과/현과 v+ 합계를 구하고, main_key 가 있으면 당월 매출 주문키와 교집합만 합산.
 * 컬럼 매칭: 정확일치 우선, 없으면 부분포함 (파이썬 _col_of 와 동일 — '신용카드'가
 * '신용카드 매출전표'에 매칭되는 식).
 */
function witaColOf(ctx, name) {
  var n = wNorm(name);
  for (var i = 0; i < ctx.hnorm.length; i++) if (ctx.hnorm[i] === n) return i;
  for (var j = 0; j < ctx.hnorm.length; j++)
    if (ctx.hnorm[j] && ctx.hnorm[j].indexOf(n) >= 0) return j;
  return -1;
}

function witaKeyOf(row, idxs) {
  return idxs.map(function (i) {
    var v = String(i < row.length ? row[i] : '').trim();
    // '3.0' 같은 숫자꼬리 정규화 (엑셀 숫자화 대응)
    if (/^\d+\.0$/.test(v)) v = v.slice(0, -2);
    return v;
  }).join('_');
}

function witaTaxSplitCompute(month, sn, r) {
  if (!r.부가세 || !r.부가세.length) return null;
  var files = witaChannelFiles(month, sn);
  var loadByKw = function (kw) {
    if (!kw) return null;
    var kwn = wNorm(kw);
    for (var i = 0; i < files.length; i++) {
      if (wNorm(files[i].name).indexOf(kwn) >= 0)
        return witaLoadFile(DriveApp.getFileById(files[i].id));
    }
    return null;
  };
  // main_key 집합: 키워드 파일 -> 없으면 역추출_<sn>.csv 로 폴백
  var mkCfg = r.부가세[0];
  var mainSet = null;
  if (mkCfg.메인키.length) {
    var mrows = loadByKw(mkCfg.메인파일);
    if (!mrows) {
      for (var f2 = 0; f2 < files.length; f2++)
        if (files[f2].name === '역추출_' + sn + '.csv')
          mrows = witaLoadFile(DriveApp.getFileById(files[f2].id));
    }
    if (mrows) {
      var mh = witaDetectHeader(mrows);
      var mctx = new WitaCtx(mrows, mh, 'above_header', false);
      var mIdx = mkCfg.메인키.map(function (k) { return witaColOf(mctx, k); });
      if (mIdx.indexOf(-1) < 0) {
        mainSet = {};
        for (var mr2 = mctx.dataStart; mr2 < mrows.length; mr2++) {
          var kk = witaKeyOf(mrows[mr2], mIdx);
          if (kk.replace(/_/g, '')) mainSet[kk] = 1;
        }
      }
    }
  }
  var out = {}, any = false;
  r.부가세.forEach(function (g) {
    var rows = loadByKw(g.파일키워드);
    if (!rows) return;
    var h = witaDetectHeader(rows);
    var ctx = new WitaCtx(rows, h, 'above_header', false);
    var sumIdx = g.합계컬럼.map(function (s2) { return witaColOf(ctx, s2); })
      .filter(function (x) { return x >= 0; });
    if (!sumIdx.length) return;
    var keyIdx = null;
    if (mainSet && g.키컬럼.length) {
      keyIdx = g.키컬럼.map(function (k) { return witaColOf(ctx, k); });
      if (keyIdx.indexOf(-1) >= 0) keyIdx = null;
    }
    var s = 0;
    for (var i2 = ctx.dataStart; i2 < rows.length; i2++) {
      if (keyIdx && !mainSet[witaKeyOf(rows[i2], keyIdx)]) continue;
      for (var j2 = 0; j2 < sumIdx.length; j2++) s += wNum(rows[i2][sumIdx[j2]]);
    }
    // v+ 합계 -> 공급가 저장 (전표입력 시트가 공급가 기준)
    out[g.구분] = witaSupply(s);
    out[g.구분 + 'v+'] = Math.round(s);
    any = true;
  });
  return any ? out : null;
}

/** 채널별 계산결과 -> 공통 행 데이터 */
function witaChannelRows(month) {
  var rules = witaLoadRules();
  var results = witaReadResults(month);
  var ts = witaReadTaxSplit(month);
  var out = [];
  Object.keys(rules).sort().forEach(function (sn) {
    var r = rules[sn], res = results[sn];
    var v = (res && res.값) || {};
    var label = r.판매처 + '(' + (r.브랜드 || '') + ')';
    out.push({
      sn: sn, 판매처: r.판매처, 브랜드: r.브랜드, 본부: r.본부, 적요: label,
      pv: v['상품매출'] || 0, etc: v['기타매출'] || 0,
      s1: v['수수료_별도'] || 0, s2: v['수수료_계산서'] || 0,
      pen: v['패널티'] || 0, st: v['정산금액'] || 0,
      계산됨: v['상품매출'] !== undefined,
      분해: (function () {
        try {
          var auto = witaTaxSplitCompute(month, sn, r);
          if (auto) return auto;              // 분해파일이 있으면 자동계산이 최우선
        } catch (e) { /* 분해 실패는 건별=전액으로 폴백 */ }
        return ts[label] || null;             // 없으면 월별 추출값(_taxsplit json)
      })()
    });
  });
  return out;
}

/** 시트에 2D 채우기 */
function witaFillSheet(sh, rows) {
  if (!rows.length) return;
  var w = 0;
  rows.forEach(function (r) { if (r.length > w) w = r.length; });
  var norm = rows.map(function (r) {
    var o = r.slice();
    while (o.length < w) o.push('');
    return o;
  });
  sh.getRange(1, 1, norm.length, w).setValues(norm);
}

/** TTL 시트 — 월파일 v8 레이아웃 (A열 여백, R2 제목, R5 헤더, R6 합계) */
function witaBuildTtl(ss, month, chs) {
  var mNo = String(+month.slice(5, 7));
  var ttl = ss.getSheets()[0];
  ttl.setName('TTL');
  var rows = [];
  rows.push([mNo, '', mNo + '월']);
  rows.push(['', mNo + '월 위탁 매출 정산']);
  rows.push(['']);
  rows.push(['', '매출', '', '', '', '', '', '', '매입', '', '기타']);
  rows.push([''].concat(WITA_TTL_HEADER));
  var tot = [0, 0, 0, 0, 0, 0, 0];
  var body = [];
  chs.forEach(function (c) {
    var mv = witaSupply(c.pv);
    var chk = c.계산됨 ? (c.pv + c.etc - c.s1 - c.s2 - c.pen - c.st === 0) : '';
    body.push(['', c.판매처, c.브랜드, c.본부, c.sn,
               c.계산됨 ? mv : '', c.계산됨 ? c.pv : '', c.계산됨 ? c.etc : '',
               c.계산됨 ? c.s1 : '', c.계산됨 ? c.s2 : '', c.계산됨 ? c.st : '',
               c.pen || '', chk]);
    tot[0] += mv; tot[1] += c.pv; tot[2] += c.etc; tot[3] += c.s1; tot[4] += c.s2;
    tot[5] += c.st; tot[6] += c.pen;
  });
  rows.push(['', '합계', '', '', '', tot[0], tot[1], tot[2], tot[3], tot[4], tot[5], tot[6] || '', '']);
  rows = rows.concat(body);
  witaFillSheet(ttl, rows);
  ttl.getRange(5, 2, 1, WITA_TTL_HEADER.length).setFontWeight('bold');
  ttl.getRange(6, 2, 1, WITA_TTL_HEADER.length).setFontWeight('bold');
  ttl.setFrozenRows(6);
  return ttl;
}

/** 월파일: TTL + 채널별 raw 탭 */
function witaExportMonth(month) {
  var name = month.slice(5, 7) + '월_위탁매출';
  var ss = SpreadsheetApp.create('wita_export_' + Date.now());
  witaBuildTtl(ss, month, witaChannelRows(month));
  var scan = witaScanMonth(month);
  Object.keys(scan).sort().forEach(function (sn) {
    (scan[sn] || []).forEach(function (f) {
      var m = f.name.match(/^역추출_(.+)\.csv$/);
      if (!m) return;
      try {
        var rows = witaLoadFile(DriveApp.getFileById(f.id));
        if (!rows.length) return;
        witaFillSheet(ss.insertSheet(m[1]), rows);
      } catch (e) { /* 한 탭 실패가 전체를 막지 않게 */ }
    });
  });
  return witaFinishExport(ss, name);
}

/**
 * 전표입력 파일: 전표입력(27열) + TTL + 직접입금 + 원장대사 + 전표
 * 전표입력 시트 열 구조는 실제 v7 과 동일:
 *   A세무구분표시 B판매처 C거래처명 D적요 E브랜드명 F본부명 G상품매출(+v)
 *   H건별공급가 I세액 J카과공급가 K세액 L현과공급가 M세액 N현과(직접발행v+) O공급가 P세액
 *   Q대사 R기타매출(+v) S건별공급가 T세액 U수수료별도(-v+) V공급가(+) W세액(-) X실제세액 Y패널티 Z정산대상액
 */
function witaExportJournal(month) {
  var name = month.slice(5, 7) + '월_위탁매출_전표입력';
  var mNo = String(+month.slice(5, 7));
  var chs = witaChannelRows(month);
  var vendors = witaVendors();
  var ss = SpreadsheetApp.create('wita_journal_' + Date.now());

  /* ── 전표입력 시트 ── */
  var je = ss.getSheets()[0];
  je.setName('전표입력');
  var H = ['', '판매처', '거래처명', '적요', '브랜드명', '본부명', '상품매출(+v)',
           '건별', '세액', '카과', '세액', '현과', '세액', '현과(직접발행)', '공급가', '세액', '대사',
           '기타매출(+v)', '건별', '세액', '판매수수료\n(별도반영/v+)', '건별', '세액', '실제세액',
           '패널티', '정산대상액'];
  var rows = [];
  rows.push([mNo, '', mNo + '월']);
  rows.push(['', mNo + '월 위탁 매출 정산']);
  rows.push(['']);
  rows.push(H);
  var body = [], T = {};
  ['pv','g','gv','k','kv','h','hv','d','ds','dv','etc','es','ev','s1','s1s','s1v','pen','st'].forEach(function (k) { T[k] = 0; });
  chs.forEach(function (c) {
    if (!c.계산됨) return;
    var ven = vendors[c.적요] || vendors[c.판매처] || {};
    var sp = c.분해 || {};
    var kv = (sp['카과'] || 0), hv = (sp['현과'] || 0);            // 공급가 기준으로 저장돼 있음
    var kAll = Math.round(kv * 1.1), hAll = Math.round(hv * 1.1);  // v+ 환산
    var dAll = sp['현과직접발행'] || 0;                             // v+ 기준
    var ds = witaSupply(dAll), dv = dAll - ds;
    var gAll = c.pv - kAll - hAll - dAll;                          // 건별(v+)
    var g = witaSupply(gAll), gv = gAll - g;
    var es = witaSupply(c.etc), ev = c.etc - es;
    var s1s = witaSupply(c.s1), s1v = c.s1 - s1s;
    var chk = (g + gv + kv + (kAll - kv) + hv + (hAll - hv) + dAll) === c.pv;
    body.push([sp && (kv || hv || dAll) ? '세무구분' : '',
      c.판매처, ven['거래처명'] || '', c.적요, c.브랜드, c.본부, c.pv,
      g, gv, kv, kAll - kv, hv, hAll - hv, dAll, ds, dv, chk,
      c.etc, es, ev, -c.s1, s1s, -(c.s1 - s1s), '', c.pen || 0, c.st]);
    T.pv += c.pv; T.g += g; T.gv += gv; T.k += kv; T.kv += kAll - kv;
    T.h += hv; T.hv += hAll - hv; T.d += dAll; T.ds += ds; T.dv += dv;
    T.etc += c.etc; T.es += es; T.ev += ev;
    T.s1 += -c.s1; T.s1s += s1s; T.s1v += -(c.s1 - s1s); T.pen += c.pen; T.st += c.st;
  });
  rows.push(['', '합계', '', '', '', '', T.pv, T.g, T.gv, T.k, T.kv, T.h, T.hv, T.d, T.ds, T.dv, '',

/** TTL 을 두 번째 이후 시트로 추가하는 변형 */
function witaBuildTtl2(ss, month, chs) {
  var sh = ss.insertSheet('TTL');
  var tmp = ss.getSheets()[0];
  // witaBuildTtl 은 첫 시트를 쓰므로 직접 구성
  var mNo = String(+month.slice(5, 7));
  var rows = [];
  rows.push([mNo, '', mNo + '월']);
  rows.push(['', mNo + '월 위탁 매출 정산']);
  rows.push(['']);
  rows.push(['', '매출', '', '', '', '', '', '', '매입', '', '기타']);
  rows.push([''].concat(WITA_TTL_HEADER));
  var tot = [0, 0, 0, 0, 0, 0, 0], body = [];
  chs.forEach(function (c) {
    var mv = witaSupply(c.pv);
    body.push(['', c.판매처, c.브랜드, c.본부, c.sn,
               c.계산됨 ? mv : '', c.계산됨 ? c.pv : '', c.계산됨 ? c.etc : '',
               c.계산됨 ? c.s1 : '', c.계산됨 ? c.s2 : '', c.계산됨 ? c.st : '', c.pen || '',
               c.계산됨 ? (c.pv + c.etc - c.s1 - c.s2 - c.pen - c.st === 0) : '']);
    tot[0] += mv; tot[1] += c.pv; tot[2] += c.etc; tot[3] += c.s1; tot[4] += c.s2;
    tot[5] += c.st; tot[6] += c.pen;
  });
  rows.push(['', '합계', '', '', '', tot[0], tot[1], tot[2], tot[3], tot[4], tot[5], tot[6] || '', '']);
  witaFillSheet(sh, rows.concat(body));
  sh.getRange(5, 2, 2, WITA_TTL_HEADER.length).setFontWeight('bold');
  sh.setFrozenRows(6);
}

}
