// 소모품 협의 회의메모 웹앱 (독립형)
// 회의 참여자가 URL로 접속해 항목별 메모를 입력하면 협의 시트의 '회의메모' 탭에 누적 저장.
// 배포자(lej) 권한으로 실행되므로 작성자는 화면에서 직접 입력받는다.
// GAS 함정 주의: 인라인 스크립트에 리터럴 달러-중괄호/백틱 금지, 이모지 금지.

var SHEET_ID = 'DEMO';
var MEMO_SHEET = '회의메모';
var AGENDA_SHEET = '협의항목';

function doGet() {
  return HtmlService.createTemplateFromFile('Index')
    .evaluate()
    .setTitle('소모품 협의 회의메모')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1');
}

function include(name) {
  return HtmlService.createHtmlOutputFromFile(name).getContent();
}

function ss_() {
  return SpreadsheetApp.openById(SHEET_ID);
}

function getAgendaItems() {
  var sh = ss_().getSheetByName(AGENDA_SHEET);
  var items = [];
  if (!sh) return items;
  var last = sh.getLastRow();
  if (last < 1) return items;
  var data = sh.getRange(1, 1, last, 4).getValues();
  for (var i = 0; i < data.length; i++) {
    var no = data[i][1];
    var name = data[i][2];
    if (name && String(name).trim() && no !== '' && !isNaN(no)) {
      items.push('No.' + no + ' ' + String(name).trim());
    }
  }
  return items;
}

// 협의항목 탭을 구조화해서 반환 — 안건 화면용
function getAgenda() {
  var sh = ss_().getSheetByName(AGENDA_SHEET);
  var res = { title: '협의 안건', intro: '', items: [] };
  if (!sh) return res;
  var last = sh.getLastRow();
  if (last < 1) return res;
  var data = sh.getRange(1, 1, last, 7).getValues();
  if (data[0] && data[0][0]) res.title = String(data[0][0]).trim();
  if (data[1] && data[1][0]) res.intro = String(data[1][0]).trim();
  for (var i = 0; i < data.length; i++) {
    var no = data[i][1];
    var name = data[i][2];
    if (name && String(name).trim() && no !== '' && !isNaN(no)) {
      res.items.push({
        group: String(data[i][0] || '').trim(),
        no: no,
        item: String(data[i][2] || '').trim(),
        plan: String(data[i][3] || '').trim(),
        question: String(data[i][4] || '').trim(),
        opinion: String(data[i][5] || '').trim(),
        result: String(data[i][6] || '').trim()
      });
    }
  }
  return res;
}

function ensureMemoSheet_() {
  var ss = ss_();
  var sh = ss.getSheetByName(MEMO_SHEET);
  if (!sh) {
    sh = ss.insertSheet(MEMO_SHEET);
    sh.getRange(1, 1, 1, 4).setValues([['시각', '작성자', '항목', '메모']]);
    sh.setFrozenRows(1);
    sh.getRange(1, 1, 1, 4).setFontWeight('bold').setBackground('#f1f3f4');
    sh.setColumnWidth(1, 120);
    sh.setColumnWidth(2, 170);
    sh.setColumnWidth(3, 240);
    sh.setColumnWidth(4, 520);
    sh.getRange(1, 4, sh.getMaxRows(), 1).setWrap(true);
  }
  return sh;
}

function saveMemo(payload) {
  var memo = payload && payload.memo ? String(payload.memo).trim() : '';
  if (!memo) throw new Error('메모 내용을 입력해주세요.');
  var who = payload && payload.who ? String(payload.who).trim() : '';
  if (!who) who = '(작성자 미입력)';
  var item = payload && payload.item ? String(payload.item).trim() : '(항목 미지정)';
  var sh = ensureMemoSheet_();
  var now = Utilities.formatDate(new Date(), 'Asia/Seoul', 'MM/dd HH:mm');
  sh.appendRow([now, who, item, memo]);
  SpreadsheetApp.flush();
  return getRecent();
}

function getRecent() {
  var sh = ss_().getSheetByName(MEMO_SHEET);
  if (!sh) return [];
  var last = sh.getLastRow();
  var n = Math.min(15, last - 1);
  if (n <= 0) return [];
  var rows = sh.getRange(last - n + 1, 1, n, 4).getValues();
  var out = [];
  for (var i = rows.length - 1; i >= 0; i--) {
    out.push({ t: rows[i][0], who: rows[i][1], item: rows[i][2], memo: rows[i][3] });
  }
  return out;
}

      padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: 700; display: inline-block; }
    .btn-memo:hover { background: #e2ecfb; }
    .inline-memo { margin-top: 8px; background: #f6f8fa; border: 1px solid #e0e4e9; border-radius: 8px; padding: 10px; }
    .inline-memo textarea { min-height: 60px; margin-top: 6px; }
    .inline-memo input { margin-bottom: 2px; }
    .im-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .im-row button { flex: 0 0 auto; width: auto; margin: 0; padding: 8px 18px; font-size: 13px; font-weight: 700;
      color: #fff; background: #1a73e8; border: none; border-radius: 6px; cursor: pointer; }
    .im-row button:disabled { background: #9aa0a6; }
    .im-msg { font-size: 12px; min-height: 14px; }
    .im-label { font-size: 11px; font-weight: 700; color: #5f6368; }

    /* 메모 입력 */
    label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 4px; }
    label.first { margin-top: 0; }
    select, textarea, input { width: 100%; font-size: 14px; padding: 9px; border: 1px solid #dadce0;
      border-radius: 8px; font-family: inherit; }
    textarea { resize: vertical; min-height: 84px; }
    button.save { margin-top: 12px; width: 100%; padding: 12px; font-size: 15px; font-weight: 700; color: #fff;
      background: #1a73e8; border: none; border-radius: 8px; cursor: pointer; }
    button.save:disabled { background: #9aa0a6; }
    .msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
    .ok { color: #188038; }
    .err { color: #d93025; }
    .recent-title { font-size: 13px; font-weight: 700; color: #444; margin: 4px 0 8px; }
    .card { border: 1px solid #eee; border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; background: #fafbfc; }
    .card .meta { font-size: 10px; color: #80868b; margin-bottom: 3px; }
    .card .citem { font-size: 11px; font-weight: 700; color: #1a73e8; }
    .card .cmemo { font-size: 13px; white-space: pre-wrap; word-break: break-word; margin-top: 3px; }
    .empty { font-size: 12px; color: #9aa0a6; }
    .loading { font-size: 13px; color: #9aa0a6; padding: 8px; }
  </style>
<title>회의 메모 컨테이너 (데모) — 이어진 포트폴리오</title></head>
<body>
<div id="demobar">
  <b>데모</b>
  <span>협의 시트에 붙여 쓰는 회의 메모 앱 그대로. 안건·메모는 이 페이지 안 메모리에 저장되고 새로고침하면 초기화됩니다.</span>
  <a href="../../">← 포트폴리오</a>
</div>
<style>
#demobar{position:sticky;top:0;z-index:9999;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:#fff8e1;border-bottom:1px solid #f0dfa8;padding:9px 16px;font-size:12.5px;color:#6b5b21;
  font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}
#demobar b{background:#6b5b21;color:#fff8e1;padding:2px 8px;border-radius:10px;font-size:11.5px}
#demobar a{margin-left:auto;color:#6b5b21;font-weight:700;text-decoration:none}
</style>

  <div class="wrap">
    <header>
      <h1 id="title">소모품 협의 회의</h1>
      <div class="sub" id="intro">안건을 보며 회의하고, 메모 탭에서 논의 내용을 바로 기록하세요.</div>
    </header>

    <div class="tabs">
      <div class="tab active" id="tabAgenda" onclick="showView('agenda')">안건</div>
      <div class="tab" id="tabMemo" onclick="showView('memo')">메모</div>
    </div>

    <!-- 안건 화면 -->
    <div id="viewAgenda">
      <div id="agendaBox"><div class="loading">안건 불러오는 중...</div></div>
    </div>

    <!-- 메모 화면 -->
    <div id="viewMemo" class="hidden">
      <div class="panel">
        <label class="first" for="who">작성자 (이 기기에 저장돼요)</label>
        <input id="who" type="text" placeholder="이름 입력 (예: 데모 사용자)">
        <label for="item">협의 항목</label>
        <select id="item"><option value="(항목 미지정)">(불러오는 중...)</option></select>
        <label for="memo">메모</label>
        <textarea id="memo" placeholder="회의 중 논의/결정 사항을 입력"></textarea>
        <button class="save" id="saveBtn" onclick="save()">저장</button>
        <div id="msg" class="msg"></div>
      </div>
      <div class="panel">
        <div class="recent-title">최근 메모</div>
        <div id="recent"><div class="empty">불러오는 중...</div></div>
      </div>
    </div>
  </div>

  <script>
    var GROUP_COLORS = {
      'A': '#1a73e8', 'B': '#12886a', 'C': '#b06000', 'D': '#8430ce', 'E': '#c2185b'
    };
    function esc(s) {
      s = (s == null) ? '' : String(s);
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function groupColor(g) {
      var key = (g || '').charAt(0).toUpperCase();
      return GROUP_COLORS[key] || '#5f6368';
    }
    function showView(v) {
      var a = v === 'agenda';
      document.getElementById('viewAgenda').className = a ? '' : 'hidden';
      document.getElementById('viewMemo').className = a ? 'hidden' : '';
      document.getElementById('tabAgenda').className = a ? 'tab active' : 'tab';
      document.getElementById('tabMemo').className = a ? 'tab' : 'tab active';
    }

    // ----- 안건 -----
    function fieldHtml(label, text, cls) {
      if (!text) return '';
      var box = cls ? (' ftext ' + cls) : ' ftext';
      return '<div class="field"><div class="flabel">' + esc(label) + '</div>'
        + '<div class="' + box.trim() + '">' + esc(text) + '</div></div>';
    }
    var inlineLabels = [];
    function renderAgenda(data) {
      document.getElementById('title').textContent = data.title || '소모품 협의 회의';
      if (data.intro) document.getElementById('intro').textContent = data.intro;
      var items = data.items || [];
      var box = document.getElementById('agendaBox');
      if (!items.length) { box.innerHTML = '<div class="empty">안건이 없습니다.</div>'; return; }
      var html = '';
      var curGroup = null;
      inlineLabels = [];
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        inlineLabels[i] = 'No.' + it.no + ' ' + it.item;
        if (it.group !== curGroup) {
          if (curGroup !== null) html += '</div></div>';
          curGroup = it.group;
          var col = groupColor(curGroup);
          html += '<div class="grp"><div class="grp-head" style="background:' + col + '">'
            + esc(curGroup) + '</div><div class="grp-body">';
        }
        var done = it.result && it.result.length > 0;
        var chip = done ? '<span class="chip done">확정</span>' : '<span class="chip open">논의중</span>';
        html += '<div class="agenda">'
          + '<div class="a-top"><span class="no">No.' + esc(it.no) + '</span>'
          + '<span class="a-title">' + esc(it.item) + '</span>' + chip + '</div>'
          + fieldHtml('현재안 · 제안', it.plan, '')
          + fieldHtml('인사팀에 드리는 질문', it.question, '')
          + fieldHtml('인사팀 의견', it.opinion, 'opinion')
          + fieldHtml('협의 결과 (확정)', it.result, 'result')
          + '<button class="btn-memo" id="imbtn_' + i + '" onclick="toggleMemo(' + i + ')">+ 이 항목에 메모</button>'
          + '<div class="inline-memo hidden" id="im_' + i + '">'
          + '<span class="im-label">작성자</span>'
          + '<input id="im_who_' + i + '" type="text" placeholder="이름 입력 (이 기기에 저장돼요)">'
          + '<textarea id="im_memo_' + i + '" placeholder="이 항목에 대한 회의 메모 입력"></textarea>'
          + '<div class="im-row"><button id="im_save_' + i + '" onclick="saveInline(' + i + ')">저장</button>'
          + '<span class="im-msg" id="im_msg_' + i + '"></span></div>'
          + '</div>'
          + '</div>';
      }
      if (curGroup !== null) html += '</div></div>';
      box.innerHTML = html;
    }
    function toggleMemo(i) {
      var box = document.getElementById('im_' + i);
      var btn = document.getElementById('imbtn_' + i);
      var open = box.className.indexOf('hidden') >= 0;
      if (open) {
        box.className = 'inline-memo';
        btn.textContent = '- 메모 접기';
        var who = document.getElementById('im_who_' + i);
        if (!who.value) { try { who.value = window.localStorage.getItem('memo_who') || ''; } catch (e) {} }
        document.getElementById('im_memo_' + i).focus();
      } else {
        box.className = 'inline-memo hidden';
        btn.textContent = '+ 이 항목에 메모';
      }
    }
    function saveInline(i) {
      var btn = document.getElementById('im_save_' + i);
      var msg = document.getElementById('im_msg_' + i);
      var who = document.getElementById('im_who_' + i).value;
      var memo = document.getElementById('im_memo_' + i).value;
      if (!who || !who.trim()) { msg.className = 'im-msg err'; msg.textContent = '작성자 이름을 입력해주세요.'; return; }
      if (!memo || !memo.trim()) { msg.className = 'im-msg err'; msg.textContent = '메모를 입력해주세요.'; return; }
      saveWho(who.trim());
      btn.disabled = true;
      msg.className = 'im-msg';
      msg.textContent = '저장 중...';
      google.script.run
        .withSuccessHandler(function (list) {
          document.getElementById('im_memo_' + i).value = '';
          msg.className = 'im-msg ok';
          msg.textContent = '저장 완료';
          render(list);
          btn.disabled = false;
        })
        .withFailureHandler(function (e) {
          msg.className = 'im-msg err';
          msg.textContent = '저장 실패: ' + (e && e.message ? e.message : e);
          btn.disabled = false;
        })
        .saveMemo({ who: who.trim(), item: inlineLabels[i], memo: memo });
    }

    // ----- 메모 -----
    function loadWho() {
      try { var v = window.localStorage.getItem('memo_who'); if (v) document.getElementById('who').value = v; } catch (e) {}
    }
    function saveWho(v) { try { window.localStorage.setItem('memo_who', v); } catch (e) {} }
    function loadItems() {
      google.script.run.withSuccessHandler(function (items) {
        var sel = document.getElementById('item');
        sel.innerHTML = '';
        var o0 = document.createElement('option');
        o0.value = '(항목 미지정)'; o0.textContent = '(항목 미지정)';
        sel.appendChild(o0);
        for (var i = 0; i < items.length; i++) {
          var o = document.createElement('option');
          o.value = items[i]; o.textContent = items[i];
          sel.appendChild(o);
        }
        var etc = document.createElement('option');
        etc.value = '기타'; etc.textContent = '기타';
        sel.appendChild(etc);
      }).getAgendaItems();
    }
    function render(list) {
      var box = document.getElementById('recent');
      if (!list || !list.length) { box.innerHTML = '<div class="empty">아직 메모가 없습니다.</div>'; return; }
      var html = '';
      for (var i = 0; i < list.length; i++) {
        var r = list[i];
        html += '<div class="card"><div class="meta">' + esc(r.t) + ' | ' + esc(r.who) + '</div>'
          + '<div class="citem">' + esc(r.item) + '</div>'
          + '<div class="cmemo">' + esc(r.memo) + '</div></div>';
      }
      box.innerHTML = html;
    }
    function save() {
      var btn = document.getElementById('saveBtn');
      var msg = document.getElementById('msg');
      var who = document.getElementById('who').value;
      var memo = document.getElementById('memo').value;
      var item = document.getElementById('item').value;
      if (!who || !who.trim()) { msg.className = 'msg err'; msg.textContent = '작성자 이름을 입력해주세요.'; return; }
      if (!memo || !memo.trim()) { msg.className = 'msg err'; msg.textContent = '메모를 입력해주세요.'; return; }
      saveWho(who.trim());
      btn.disabled = true; msg.className = 'msg'; msg.textContent = '저장 중...';
      google.script.run
        .withSuccessHandler(function (list) {
          document.getElementById('memo').value = '';
          msg.className = 'msg ok'; msg.textContent = '저장 완료';
          render(list); btn.disabled = false;
        })
        .withFailureHandler(function (e) {
          msg.className = 'msg err';
          msg.textContent = '저장 실패: ' + (e && e.message ? e.message : e);
          btn.disabled = false;
        })
        .saveMemo({ who: who.trim(), item: item, memo: memo });
    }

    // 초기 로딩
    google.script.run.withSuccessHandler(renderAgenda).getAgenda();
    loadWho();
    loadItems();
    google.script.run.withSuccessHandler(render).getRecent();
  </script>
</body>
</html>
