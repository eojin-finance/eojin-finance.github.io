<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>재고 에이징·충당 비교 (데모) — 이어진 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============================================================
   example-ui tokens.css  —  샘플기업 재무 웹앱 공용 디자인 토큰 v1.2 (2026-09-23 · 09-28 .dd 드롭다운 · .dlg 대화상자 · 10-02 .drp 기간 선택)
   사용법: <style> 맨 위에 이 파일 내용을 붙이고, 앱 고유 CSS는 이 변수만 참조한다.
   규칙: 색·크기·간격·반경·그림자·모션 값을 앱 CSS에 리터럴로 쓰지 않는다. 전부 var().
   ============================================================ */

/* ---------- 0. 폰트 ----------
   Pretendard Variable (CDN). 오프라인·차단 환경이면 system-ui → Apple SD Gothic Neo → 맑은 고딕으로 내려간다.
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
*/

:root{
  /* 서체 */
  --font-sans:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,"Malgun Gothic",monospace;   /* ID·코드·해시 전용. 금액엔 쓰지 않는다 */

  /* 타입 스케일 — 8단계만 쓴다. 이 외 크기는 금지 */
  --fs-11:11px;  /* caption  — eyebrow·단위·메타. 본문 금지 */
  --fs-12:12px;  /* small    — 표 보조열·배지 */
  --fs-13:13px;  /* body-s   — 밀도 높은 표 본문(최소 본문) */
  --fs-14:14px;  /* body     — 기본 본문·입력·버튼 */
  --fs-16:16px;  /* title-s  — 카드 제목 */
  --fs-18:18px;  /* title    — 섹션 제목 */
  --fs-22:22px;  /* headline — 화면 제목 */
  --fs-28:28px;  /* display  — KPI 핵심 숫자 */
  --lh-tight:1.2; --lh-body:1.5; --lh-display:1.1;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;
  --ls-tight:-0.01em; --ls-display:-0.02em;

  /* 간격 — 4px 기반 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px;

  /* 반경 — 바깥 반경 = 안 반경 + 패딩 (동심원 규칙) */
  --r-1:4px;   /* 칩·작은 입력 */
  --r-2:8px;   /* 버튼·입력·탭 */
  --r-3:12px;  /* 카드·패널 */
  --r-4:16px;  /* 시트·모달·팝오버 */
  --r-pill:999px;

  /* 터치·클릭 목표 */
  --hit:40px;        /* 데스크톱 최소 클릭 높이 (WCAG 24 이상, 권장 40) */
  --hit-touch:44px;  /* 모바일 최소 (Apple 44pt) */
  --row-dense:36px; --row-comfy:44px;   /* 표 행 높이 */

  /* ---------- 색 (라이트) ----------
     중립 회색 11단계 + 브랜드 1색 + 의미색 4종. 그 외 색은 만들지 않는다. */
  --g0:#FFFFFF; --g50:#F9FAFB; --g100:#F2F4F6; --g200:#E5E8EB; --g300:#D1D6DB; --g400:#B0B8C1;
  --g500:#8B95A1; --g600:#6B7684; --g700:#4E5968; --g800:#333D4B; --g900:#191F28;

  --bg:var(--g50);            /* 페이지 바탕 */
  --surface:var(--g0);        /* 카드·패널 */
  --surface-2:var(--g100);    /* 표 머리·구분 영역 */
  --line:var(--g200);         /* 기본 구분선 */
  --line-strong:var(--g300);  /* 입력 테두리 */
  --ink:var(--g900);          /* 본문 */
  --ink-2:var(--g700);        /* 보조 */
  --ink-3:var(--g600);        /* 라벨·캡션 (4.5:1 유지되는 가장 밝은 회색) */
  --ink-4:var(--g400);        /* 비활성·플레이스홀더 */

  --brand:#3182F6; --brand-hover:#1B64DA; --brand-soft:#E8F3FF; --brand-ink:#1B64DA; --on-brand:#FFFFFF;
  --neg:#E5484D;  --neg-soft:#FDECEC;  --neg-ink:#C0353A;     /* 마이너스·오류·삭제 */
  --pos:#1E9E5B;  --pos-soft:#E6F6EC;  --pos-ink:#177A46;     /* 완료·일치 (금액 +에는 쓰지 않는다) */
  --warn:#DB8600; --warn-soft:#FFF3DC; --warn-ink:#9A5F00;    /* 대기·주의 */
  --info:var(--brand); --info-soft:var(--brand-soft);

  --focus:0 0 0 3px rgba(49,130,246,.35);
  --shadow-1:0 1px 2px rgba(25,31,40,.06);
  --shadow-2:0 2px 8px -2px rgba(25,31,40,.10),0 1px 2px rgba(25,31,40,.06);
  --shadow-3:0 12px 32px -12px rgba(25,31,40,.22),0 2px 6px rgba(25,31,40,.08);

  /* 글라스 — 떠 있는 층(앱바·툴바·시트)에만 */
  --glass-bg:rgba(255,255,255,.66); --glass-line:rgba(255,255,255,.55); --glass-blur:18px; --glass-sat:1.4;

  /* ---------- 모션 ----------
     들어올 땐 ease-out·짧게, 나갈 땐 더 짧게. 레이아웃 속성은 애니메이션하지 않는다 (transform·opacity만). */
  --dur-1:120ms;  /* hover·press·토글 */
  --dur-2:200ms;  /* 열림·페이드·탭 전환 (기본) */
  --dur-3:320ms;  /* 시트·모달·큰 이동 */
  --dur-exit:150ms;
  --ease-out:cubic-bezier(0,0,0,1);           /* 등장 */
  --ease-in:cubic-bezier(0.3,0,1,1);          /* 퇴장 */
  --ease-std:cubic-bezier(0.2,0,0,1);         /* 상태 전환 */
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1); /* 강조 튐 — 작은 요소에만 */
}

/* ---------- 색 (다크) ---------- */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --g0:#101318; --g50:#14181E; --g100:#1B2027; --g200:#252C35; --g300:#323A45; --g400:#4A5462;
  --g500:#6B7684; --g600:#8B95A1; --g700:#B0B8C1; --g800:#D1D6DB; --g900:#F2F4F6;
  --bg:var(--g50); --surface:var(--g100); --surface-2:var(--g200); --line:var(--g200); --line-strong:var(--g300);
  --brand:#4E96FA; --brand-hover:#74AEFF; --brand-soft:#17304F; --brand-ink:#8CBEFF; --on-brand:#0B1220;
  --neg:#F0656A; --neg-soft:#3A1F21; --neg-ink:#FF8A8E;
  --pos:#3FBF7A; --pos-soft:#17301F; --pos-ink:#6FDB9E;
  --warn:#F0A63A; --warn-soft:#3A2B12; --warn-ink:#FFC46B;
  --focus:0 0 0 3px rgba(78,150,250,.45);
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 2px 8px -2px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  --shadow-3:0 12px 32px -12px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.5);
  --glass-bg:rgba(20,24,30,.58); --glass-line:rgba(255,255,255,.10);
}}
:root[data-theme="dark"]{
  --g0:#101318; --g50:#14181E; --g100:#1B2027; --g200:#252C35; --g300:#323A45; --g400:#4A5462;
  --g500:#6B7684; --g600:#8B95A1; --g700:#B0B8C1; --g800:#D1D6DB; --g900:#F2F4F6;
  --bg:var(--g50); --surface:var(--g100); --surface-2:var(--g200); --line:var(--g200); --line-strong:var(--g300);
  --brand:#4E96FA; --brand-hover:#74AEFF; --brand-soft:#17304F; --brand-ink:#8CBEFF; --on-brand:#0B1220;
  --neg:#F0656A; --neg-soft:#3A1F21; --neg-ink:#FF8A8E;
  --pos:#3FBF7A; --pos-soft:#17301F; --pos-ink:#6FDB9E;
  --warn:#F0A63A; --warn-soft:#3A2B12; --warn-ink:#FFC46B;
  --focus:0 0 0 3px rgba(78,150,250,.45);
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 2px 8px -2px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  --shadow-3:0 12px 32px -12px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.5);
  --glass-bg:rgba(20,24,30,.58); --glass-line:rgba(255,255,255,.10);
}

/* ============================================================
   1. 베이스 — 모든 앱 공통. 여기 있는 건 앱에서 다시 쓰지 않는다.
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fw-regular) var(--fs-14)/var(--lh-body) var(--font-sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"tnum" 1;/* 숫자 폭 고정 = 표에서 자릿수 맞음 */
  word-break:keep-all;overflow-wrap:break-word;/* 한글은 단어 단위로 끊고, 긴 URL·코드만 비상 분리 */}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}   /* 제목 줄 길이 고르게 — keep-all 과 함께여야 한글에서 동작 */
p{text-wrap:pretty}            /* 마지막 줄 외톨이 단어 방지 */
em,i{font-style:normal;font-weight:var(--fw-semibold)} /* 한글엔 이탤릭이 없다 — 기울이지 말고 굵게 */
h1{font-size:var(--fs-22);font-weight:var(--fw-bold);line-height:var(--lh-tight);letter-spacing:var(--ls-tight)}
h2{font-size:var(--fs-18);font-weight:var(--fw-semibold);line-height:var(--lh-tight)}
h3{font-size:var(--fs-16);font-weight:var(--fw-semibold);line-height:var(--lh-tight)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus)}
::selection{background:var(--brand-soft)}

/* 숫자 */
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.num.neg{color:var(--neg-ink)}     /* 마이너스만 색 — 플러스는 잉크색 그대로 */
.unit{font-size:var(--fs-12);color:var(--ink-3);margin-left:2px;font-weight:var(--fw-regular)}
.mono{font-family:var(--font-mono);font-size:.93em}

/* 텍스트 */
.eyebrow{font-size:var(--fs-11);font-weight:var(--fw-semibold);letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase}
.caption{font-size:var(--fs-12);color:var(--ink-3)}
.muted{color:var(--ink-3)}

/* 표면 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);box-shadow:var(--shadow-1)}
.card>.card-h{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line)}
.card>.card-b{padding:var(--sp-4)}

/* 버튼 — 4종만: primary / secondary / ghost / danger. 크기 2종 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);height:var(--hit);padding:0 var(--sp-4);
  border-radius:var(--r-2);border:1px solid transparent;font-weight:var(--fw-medium);font-size:var(--fs-14);white-space:nowrap;
  transition:background-color var(--dur-1) var(--ease-std),border-color var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std),transform var(--dur-1) var(--ease-std)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--on-brand)} .btn.primary:hover{background:var(--brand-hover)}
.btn.secondary{background:var(--surface);border-color:var(--line-strong);color:var(--ink)} .btn.secondary:hover{background:var(--surface-2)}
.btn.ghost{background:transparent;color:var(--ink-2)} .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--neg-soft);color:var(--neg-ink)} .btn.danger:hover{background:var(--neg);color:#fff}
.btn.sm{height:32px;padding:0 var(--sp-3);font-size:var(--fs-13)}
.btn.sq{width:var(--hit);padding:0} .btn.sm.sq{width:32px}   /* 기호 하나짜리(?·×·⋯) 버튼은 정사각형 */
/* 한 줄 = 높이 하나 — 툴바·동작칸·필터 줄에 놓인 버튼·드롭다운·입력·세그먼트는 같은 높이. .sm 은 표 칸·줄글 안에서만 */
.toolbar .btn.sm,.actions .btn.sm{height:var(--hit);padding:0 var(--sp-4);font-size:var(--fs-14)}
.toolbar .seg,.actions .seg{height:var(--hit);align-items:stretch} .toolbar .seg>button,.actions .seg>button{height:auto}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.busy{position:relative;color:transparent!important;pointer-events:none}
.btn.busy::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid currentColor;
  border-color:var(--ink-4) var(--ink-4) var(--ink-4) transparent;animation:spin .7s linear infinite}
.btn.primary.busy::after{border-color:rgba(255,255,255,.75) rgba(255,255,255,.75) rgba(255,255,255,.75) transparent}
@keyframes spin{to{transform:rotate(360deg)}}

/* 입력 */
.input,input[type=text],input[type=number],input[type=date],select,textarea{
  height:var(--hit);padding:0 var(--sp-3);border:1px solid var(--line-strong);border-radius:var(--r-2);background:var(--surface);
  transition:border-color var(--dur-1) var(--ease-std),box-shadow var(--dur-1) var(--ease-std)}
textarea{height:auto;padding:var(--sp-2) var(--sp-3)}
input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:var(--brand);box-shadow:var(--focus)}
input::placeholder{color:var(--ink-4)}
input[aria-invalid="true"]{border-color:var(--neg)}
.field{display:flex;flex-direction:column;gap:var(--sp-1)}
.field>label{font-size:var(--fs-13);font-weight:var(--fw-medium);color:var(--ink-2)}
.field>.help{font-size:var(--fs-12);color:var(--ink-3)} .field>.error{font-size:var(--fs-12);color:var(--neg-ink)}

/* 세그먼트·탭 */
.seg{display:inline-flex;padding:2px;background:var(--surface-2);border-radius:var(--r-2);gap:2px}
.seg>button{height:32px;padding:0 var(--sp-3);border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-weight:var(--fw-medium);font-size:var(--fs-13);
  transition:background-color var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std),box-shadow var(--dur-1) var(--ease-std)}
.seg>button[aria-pressed="true"],.seg>button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.tabs{display:flex;gap:var(--sp-1);border-bottom:1px solid var(--line)}
.tabs>button{position:relative;height:var(--hit);padding:0 var(--sp-3);border:0;background:transparent;color:var(--ink-3);font-weight:var(--fw-medium);
  transition:color var(--dur-1) var(--ease-std)}
.tabs>button:hover{color:var(--ink)}
.tabs>button[aria-selected="true"]{color:var(--ink)}
.tabs>button[aria-selected="true"]::after{content:"";position:absolute;left:var(--sp-3);right:var(--sp-3);bottom:-1px;height:2px;border-radius:1px;background:var(--brand)}

/* 배지·칩 — 색은 의미색 4종만 */
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 var(--sp-2);border-radius:var(--r-pill);font-size:var(--fs-12);font-weight:var(--fw-medium);white-space:nowrap;
  background:var(--surface-2);color:var(--ink-2)}
.badge.neg{background:var(--neg-soft);color:var(--neg-ink)} .badge.pos{background:var(--pos-soft);color:var(--pos-ink)}
.badge.warn{background:var(--warn-soft);color:var(--warn-ink)} .badge.info{background:var(--brand-soft);color:var(--brand-ink)}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* 표 — 세로선 없음, 가로선 1px, 머리 sticky, 숫자 우측 tabular */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-3);background:var(--surface)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-13)}
.tbl th{position:sticky;top:0;z-index:1;height:var(--row-dense);padding:0 var(--sp-3);background:var(--surface-2);color:var(--ink-3);
  font-size:var(--fs-12);font-weight:var(--fw-semibold);text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{height:var(--row-dense);padding:0 var(--sp-3);border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background-color var(--dur-1) var(--ease-std)}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tbody tr[aria-selected="true"] td{background:var(--brand-soft)}
.tbl th.num,.tbl td.num{text-align:right}
.tbl tr.total td{font-weight:var(--fw-semibold);background:var(--surface-2);border-top:1px solid var(--line-strong)}
.tbl.comfy th,.tbl.comfy td{height:var(--row-comfy)}
.tbl td.first{position:sticky;left:0;background:var(--surface);z-index:1}

/* KPI 타일 — 숫자가 가장 크고, 라벨은 위에 작게 */
.kpi{display:flex;flex-direction:column;gap:var(--sp-1);padding:var(--sp-4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3)}
.kpi>.k{font-size:var(--fs-13);color:var(--ink-3);font-weight:var(--fw-medium)}
.kpi>.v{font-size:var(--fs-28);font-weight:var(--fw-bold);letter-spacing:var(--ls-display);line-height:var(--lh-display);font-variant-numeric:tabular-nums}
.kpi>.d{font-size:var(--fs-12);color:var(--ink-3)}
.kpi>.d.neg{color:var(--neg-ink)} .kpi>.d.pos{color:var(--pos-ink)}

/* 알림 — 결과는 남고, 정보는 사라진다 */
.toasts{position:fixed;right:var(--sp-4);bottom:var(--sp-4);z-index:80;display:flex;flex-direction:column;gap:var(--sp-2);width:min(400px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-3);
  background:var(--g900);color:var(--g0);box-shadow:var(--shadow-3);font-size:var(--fs-13);
  animation:toast-in var(--dur-2) var(--ease-out) both}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .toast{background:var(--g200);color:var(--g900)} }
:root[data-theme="dark"] .toast{background:var(--g200);color:var(--g900)}
.toast.out{animation:toast-out var(--dur-exit) var(--ease-in) both}
@keyframes toast-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(6px)}}
.toast .x{margin-left:auto;background:none;border:0;color:inherit;opacity:.6;padding:0 2px} .toast .x:hover{opacity:1}
.inline-msg{display:flex;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-2);font-size:var(--fs-13);background:var(--surface-2);color:var(--ink-2)}
.inline-msg.neg{background:var(--neg-soft);color:var(--neg-ink)} .inline-msg.warn{background:var(--warn-soft);color:var(--warn-ink)}
.inline-msg.pos{background:var(--pos-soft);color:var(--pos-ink)} .inline-msg.info{background:var(--brand-soft);color:var(--brand-ink)}

/* 스켈레톤 — 300ms 넘게 기다리면 스피너 대신 이걸 */
.skel{position:relative;overflow:hidden;background:var(--surface-2);border-radius:var(--r-1);color:transparent!important;min-height:1em}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shimmer 1.4s var(--ease-std) infinite}
@keyframes shimmer{to{transform:translateX(100%)}}

/* 빈 상태 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-2);padding:var(--sp-12) var(--sp-4);text-align:center;color:var(--ink-3)}
.empty>b{font-size:var(--fs-16);color:var(--ink);font-weight:var(--fw-semibold)}

/* 떠 있는 층 — 글라스 */
.glass{background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  border:1px solid var(--glass-line);box-shadow:var(--shadow-2)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .glass{background:var(--surface)} }
@media (prefers-reduced-transparency:reduce){ .glass{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none} }
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--sp-3);height:56px;padding:0 var(--sp-5);border-bottom:1px solid var(--line)}

/* 시트·모달·팝오버 — 등장 200 ease-out, 퇴장 150 ease-in */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(15,20,28,.45);animation:fade-in var(--dur-2) var(--ease-out) both}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:61;width:min(560px,calc(100vw - 32px));max-height:min(80vh,720px);overflow:auto;
  background:var(--surface);border-radius:var(--r-4);box-shadow:var(--shadow-3);animation:pop-in var(--dur-3) var(--ease-out) both}
.sheet.out,.scrim.out{animation:fade-out var(--dur-exit) var(--ease-in) both}
.popover{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);box-shadow:var(--shadow-3);padding:var(--sp-2);
  animation:pop-in var(--dur-2) var(--ease-out) both;transform-origin:top left}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-out{to{opacity:0}}
@keyframes pop-in{from{opacity:0;transform:translate(-50%,-50%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.popover{animation-name:pop-in-tl} @keyframes pop-in-tl{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}

/* 드롭다운 — 내재화 (components.js ddEnhanceAll). 네이티브 <select> 목록은 OS 가 그려서 서체·색·다크모드·보조 문구를 못 바꾼다.
   <select> 는 .dd 안에 숨겨 두고 .dd-btn(닫힌 모양) + .dd-list(펼친 목록, body 에 fixed) 를 앱이 그린다 */
.dd{position:relative;display:inline-flex;max-width:100%}
.dd[hidden],.dd>select{display:none}
.dd-btn{display:inline-flex;align-items:center;gap:var(--sp-2);width:100%;min-width:120px;height:var(--hit);padding:0 var(--sp-2) 0 var(--sp-3);
  border:1px solid var(--line-strong);border-radius:var(--r-2);background:var(--surface);color:var(--ink);text-align:left;white-space:nowrap;
  transition:border-color var(--dur-1) var(--ease-std),background-color var(--dur-1) var(--ease-std)}
.dd-btn:hover{background:var(--surface-2)}
.dd-btn[aria-expanded="true"]{border-color:var(--brand)}
.dd-btn:disabled{opacity:.45;cursor:not-allowed}
.dd-btn.sm{height:32px;font-size:var(--fs-13)}
.dd-v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dd-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dd-note{font-size:var(--fs-12);color:var(--ink-3);font-weight:var(--fw-regular)}
.dd-chev{flex:none;color:var(--ink-3);transition:transform var(--dur-1) var(--ease-std)}
.dd-btn[aria-expanded="true"] .dd-chev{transform:rotate(180deg)}
.dd-list{position:fixed;z-index:70;overflow:auto;scrollbar-width:thin;scrollbar-gutter:stable;/* 폭을 잴 때도 스크롤바 자리를 넣는다 — 달이 많으면 «202…» 로 잘렸다 */max-width:min(480px,calc(100vw - 16px));padding:var(--sp-1);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-3);box-shadow:var(--shadow-3);font-size:var(--fs-14);
  animation:dd-in var(--dur-2) var(--ease-out) both;transform-origin:top left}
.dd-list.up{transform-origin:bottom left;animation-name:dd-in-up}
.dd-list.out{animation:fade-out var(--dur-exit) var(--ease-in) both}
.dd-q{position:sticky;top:0;z-index:1;width:100%;height:32px;margin-bottom:var(--sp-1);padding:0 var(--sp-3);border:1px solid var(--line-strong);border-radius:var(--r-2);background:var(--surface)}
.dd-grp{padding:var(--sp-2) var(--sp-3) var(--sp-1);font-size:var(--fs-12);font-weight:var(--fw-semibold);color:var(--ink-3)}
.dd-opt{display:flex;align-items:center;gap:var(--sp-2);min-height:36px;padding:0 var(--sp-3) 0 var(--sp-2);border-radius:var(--r-2);cursor:pointer;white-space:nowrap;color:var(--ink)}
.dd-opt[data-act]{background:var(--surface-2)}
.dd-check{flex:none;visibility:hidden;color:var(--brand)}
.dd-opt[aria-selected="true"] .dd-check{visibility:visible}   /* 선택 = 체크 기호 + 브랜드색. 굵게는 안 쓴다 */
.dd-opt[aria-disabled="true"]{color:var(--ink-4);cursor:default}
.dd-opt .dd-note{margin-left:auto;padding-left:var(--sp-4)}
.dd-none{padding:var(--sp-3);font-size:var(--fs-13);color:var(--ink-3)}
/* 목록은 scale 하지 않는다 — 줄었다 커지는 동안 버튼과 끝선이 어긋나 보인다 */
@keyframes dd-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes dd-in-up{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 대화상자 — 내재화 (components.js ask·tell). alert/confirm/prompt 대신 <dialog class="dlg"> + showModal()
   버튼은 왼쪽 "닫기"(ghost) · 오른쪽 행동 동사. 위험 동작은 기본 포커스가 "닫기" */
dialog.dlg{width:min(440px,calc(100vw - 32px));padding:0;border:0;border-radius:var(--r-4);background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-3);animation:dlg-in var(--dur-3) var(--ease-out) both}
dialog.dlg::backdrop{background:rgba(15,20,28,.45);animation:fade-in var(--dur-2) var(--ease-out) both}
dialog.dlg.out,dialog.dlg.out::backdrop{animation:fade-out var(--dur-exit) var(--ease-in) both}
.dlg-h{padding:var(--sp-5) var(--sp-6) 0}
.dlg-b{padding:var(--sp-3) var(--sp-6) var(--sp-5);color:var(--ink-2)}
.dlg-b .input{width:100%;margin-top:var(--sp-3)}
.dlg-f{display:flex;justify-content:flex-end;gap:var(--sp-2);padding:0 var(--sp-6) var(--sp-5)}
@keyframes dlg-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* 기간 선택 — 내재화 (components.js drp). 기간 조회는 전부 이 래퍼 하나. date 입력 두 개를 나란히 두지 않는다.
   버튼 = "시작 ~ 끝" + 달력 아이콘 / 펼침 = 빠른 선택 3줄 + 달력 2장 + 선택 기간 N일 · 닫기 · 적용 (회계시스템 기간 선택기 모양) */
.drp{display:inline-flex;max-width:100%}
.drp-btn{display:inline-flex;align-items:center;gap:var(--sp-2);height:var(--hit);padding:0 var(--sp-3);border:1px solid var(--line-strong);border-radius:var(--r-2);
  background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;transition:border-color var(--dur-1) var(--ease-std),background-color var(--dur-1) var(--ease-std)}
.drp-btn:hover{background:var(--surface-2)}
.drp-btn[aria-expanded="true"]{border-color:var(--brand)}
.drp-ic{flex:none;color:var(--ink-3)}
.drp-pop{position:fixed;z-index:70;width:min(560px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-3);box-shadow:var(--shadow-3);animation:dd-in var(--dur-2) var(--ease-out) both}
.drp-pop.out{animation:fade-out var(--dur-exit) var(--ease-in) both}
.drp-pre{display:flex;flex-direction:column;gap:var(--sp-1);padding:var(--sp-3);border-bottom:1px solid var(--line)}
.drp-row{display:grid;grid-template-columns:repeat(8,1fr);gap:var(--sp-1)}
.drp-row:last-child{grid-template-columns:repeat(12,1fr)}
.drp-p{height:32px;padding:0 var(--sp-1);border:1px solid var(--line);border-radius:var(--r-1);background:var(--surface);font-size:var(--fs-13);color:var(--ink-2);white-space:nowrap;
  transition:background-color var(--dur-1) var(--ease-std),border-color var(--dur-1) var(--ease-std)}
.drp-p:hover{background:var(--surface-2)}
.drp-p[aria-pressed="true"]{border-color:var(--brand);color:var(--brand-ink);box-shadow:inset 0 -2px 0 var(--brand)}   /* 고른 빠른 선택 = 브랜드 테두리 + 밑줄 (굵게 안 씀) */
.drp-cal{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);padding:var(--sp-3) var(--sp-4)}
.drp-m{display:flex;flex-direction:column;gap:var(--sp-2);min-width:0}
.drp-mh{display:grid;grid-template-columns:28px 28px 1fr 28px 28px;align-items:center;text-align:center}
.drp-mh b{font-size:var(--fs-16);font-weight:var(--fw-semibold);font-variant-numeric:tabular-nums}
.drp-nav{height:28px;border:0;border-radius:var(--r-1);background:transparent;color:var(--ink-3);font-size:var(--fs-16)}
.drp-nav:hover{background:var(--surface-2);color:var(--ink)}
.drp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0}
.drp-w{font-size:var(--fs-12);font-weight:var(--fw-medium);color:var(--ink-3);text-align:center;padding-block:var(--sp-1)}
.drp-w.sun{color:var(--neg-ink)}
.drp-d{height:32px;border:0;background:transparent;font-size:var(--fs-13);font-variant-numeric:tabular-nums;color:var(--ink);border-radius:0}
.drp-d:hover{background:var(--surface-2)}
.drp-d.sun{color:var(--neg-ink)}
.drp-d.out{color:var(--ink-4)}
.drp-d.today{box-shadow:inset 0 0 0 1px var(--line-strong)}
.drp-d.in{background:var(--brand-soft)}
.drp-d.end{background:var(--brand);color:var(--on-brand);border-radius:var(--r-1)}
.drp-d:disabled{color:var(--ink-4);cursor:not-allowed;background:transparent}
.drp-f{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--line)}
.drp-n{margin-right:auto;font-size:var(--fs-13);color:var(--ink-3);font-variant-numeric:tabular-nums}
.drp-nav.nx{visibility:hidden}
@media (max-width:560px){ .drp-cal{grid-template-columns:1fr} .drp-cal .drp-m:last-child{display:none} .drp-nav.nx{visibility:visible}
  .drp-row{grid-template-columns:repeat(4,1fr)} .drp-row:last-child{grid-template-columns:repeat(6,1fr)} }

/* 탭 내용 전환 — 짧은 페이드+살짝 위로 */
.tab-panel{animation:panel-in var(--dur-2) var(--ease-out) both}
@keyframes panel-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 숫자가 바뀔 때 — 배경 한 번 번쩍 (값 변화 알림) */
.flash{animation:flash var(--dur-3) var(--ease-out)}
@keyframes flash{0%{background:var(--brand-soft)}100%{background:transparent}}

/* 접근성 — 모션 줄이기 요청 시 전부 끈다 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ── 앱 (토큰만 참조) ── */
:root{--a0:color-mix(in oklab,var(--brand) 16%,var(--surface));--a1:color-mix(in oklab,var(--brand) 32%,var(--surface));--a2:color-mix(in oklab,var(--brand) 48%,var(--surface));
  --a3:color-mix(in oklab,var(--brand) 64%,var(--surface));--a4:color-mix(in oklab,var(--brand) 82%,var(--surface));--a5:var(--brand);--a6:var(--g400);--s25:var(--g700);--s26:var(--brand-ink);--sd:var(--warn-ink)}
/* 시점 색 — 25말 회남 · 26.9말 파랑 · 증감 주황 (시트 [에이징 비교] 와 같은 규칙). 클래스 3번 겹쳐 표·툴팁 머리 색보다 앞서게 */
.p25.p25.p25{color:var(--s25)} .p26.p26.p26{color:var(--s26)} .pd.pd.pd{color:var(--sd)}
#sBase>button[aria-pressed="true"]{box-shadow:var(--shadow-1),inset 0 -2px 0 currentColor}
#sBase>button[data-v="25"][aria-pressed="true"]{color:var(--s25)} #sBase>button[data-v="26"][aria-pressed="true"]{color:var(--s26)} #sBase>button[data-v="d"][aria-pressed="true"]{color:var(--sd)}
body{min-height:100vh}
.ag-bar{flex-wrap:wrap;height:auto;min-height:56px;padding:var(--sp-2) var(--sp-5);gap:var(--sp-2) var(--sp-4)}

.toolbar{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-3);align-items:center}
.toolbar .seg[hidden]{display:none}
.seg>button[aria-disabled="true"]{color:var(--ink-4);cursor:not-allowed}
.ag-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-3);margin-bottom:var(--sp-4)}
.kpi .d{display:flex;gap:var(--sp-2);flex-wrap:wrap}

.ag-h{font-size:var(--fs-16);font-weight:var(--fw-semibold)}
.ag-sub{font-size:var(--fs-12);color:var(--ink-3);font-weight:var(--fw-regular)}
.legend{display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-3);font-size:var(--fs-12);color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:var(--r-1);margin-right:var(--sp-1);vertical-align:-1px}
.legend i.ln{height:2px;border-radius:1px;vertical-align:3px;width:16px}
.legend i.ln.dash{background:repeating-linear-gradient(90deg,var(--s25) 0 4px,transparent 4px 7px)!important}
/* 누적 막대 */
.stk{display:flex;flex-direction:column;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.stk-row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:var(--sp-2);align-items:center}
.stk-l{font-size:var(--fs-13);font-weight:var(--fw-medium);color:var(--ink-2)}
.stk-t{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.stk-b{display:flex;gap:2px;height:28px;min-width:0}
.stk-b>span{display:block;height:100%;min-width:2px;outline:none}
.stk-b>span:first-child{border-radius:var(--r-1) 0 0 var(--r-1)} .stk-b>span:last-child{border-radius:0 var(--r-1) var(--r-1) 0}
.stk-b>span:hover,.stk-b>span:focus-visible{filter:brightness(.92)}

/* 꺾은선 */
.ln-wrap{width:100%}

.ln-wrap .grid{stroke:var(--line);stroke-width:1}
.ln-wrap .hit{fill:transparent;cursor:pointer;outline:none}
/* 막대 목록 */
.bl{display:flex;flex-direction:column}
.bl-row{display:grid;grid-template-columns:112px minmax(0,1fr) 96px;gap:var(--sp-3);align-items:center;min-height:var(--row-comfy);padding:0 var(--sp-2);border-radius:var(--r-2);
  border:0;background:transparent;text-align:left;transition:background-color var(--dur-1) var(--ease-std)}
.bl-row:hover{background:var(--surface-2)}
.bl-row[aria-pressed="true"]{background:var(--brand-soft)}
.bl-n{font-size:var(--fs-13);font-weight:var(--fw-medium);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl-tr{position:relative;height:16px}
.bl-tr>span{position:absolute;top:0;height:100%;border-radius:var(--r-1)}
.bl-tr>.ax{width:1px;background:var(--line-strong);border-radius:0;top:-4px;height:24px}
.bl-tr>.gh{background:transparent;box-shadow:inset 0 0 0 1px var(--s25)}
.bl-v{font-size:var(--fs-13);font-weight:var(--fw-semibold);text-align:right;white-space:nowrap}
/* 히트맵 — 열 폭 고정(값이 세어 올라가는 동안 열이 출렁이지 않게) */
table.hm{table-layout:fixed;min-width:760px}

.hm td.cell>button{position:relative;display:flex;align-items:center;justify-content:flex-end;width:100%;height:var(--row-comfy);padding:0 var(--sp-2);border:0;font-size:var(--fs-12);
  font-weight:var(--fw-medium);font-variant-numeric:tabular-nums;white-space:nowrap;
  transition:background-color var(--dur-2) var(--ease-std),color var(--dur-2) var(--ease-std),box-shadow var(--dur-1) var(--ease-std)}
.hm td.cell>button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.hm td.cell>button.fl::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 2px var(--brand);animation:ag-ring var(--dur-3) var(--ease-out) both}
@keyframes ag-ring{from{opacity:1}to{opacity:0}}
.hm td.first{font-weight:var(--fw-medium)}
.hm tr.total td.first{font-weight:var(--fw-semibold)}
.ag-two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--sp-4);align-items:start}
.dt{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:0;font-size:var(--fs-13)}
.dt>div{padding:var(--sp-2) 0;border-bottom:1px solid var(--line);white-space:nowrap}
.dt>.h{font-size:var(--fs-12);color:var(--ink-3);font-weight:var(--fw-semibold)}
.dt>.num{padding-left:var(--sp-2)}
.dt>.on{font-weight:var(--fw-bold);color:var(--ink)}
.dt-big{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.dt-big .k{font-size:var(--fs-12);color:var(--ink-3)} .dt-big .v{font-size:var(--fs-22);font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;line-height:var(--lh-display)}
/* 폭포 */
.wf{display:flex;flex-direction:column;gap:var(--sp-1)}

<script>(function(){
  var bar=document.getElementById('demobar'), pill=document.getElementById('dbr-pill'), b=document.body;
  // 띠를 본문 여백 밖까지 펼친다 (데모마다 body 여백이 달라서 실제 값을 읽는다)
  // 앱 CSS 가 띠보다 늦게 오는 데모가 있어(body margin 8 → 0) 로드 때 다시 잰다
  function fit(){ var cs=getComputedStyle(b), pt=parseFloat(cs.paddingTop)+parseFloat(cs.marginTop), pl=parseFloat(cs.paddingLeft)+parseFloat(cs.marginLeft), pr=parseFloat(cs.paddingRight)+parseFloat(cs.marginRight);
    bar.style.margin=(-pt)+'px '+(-pr)+'px '+pt+'px '+(-pl)+'px'; }
  fit(); document.addEventListener('DOMContentLoaded',fit); window.addEventListener('load',fit);
  function tg(btn,box){ btn.addEventListener('click',function(){ box.hidden=!box.hidden; btn.setAttribute('aria-expanded',String(!box.hidden)); }); }
  tg(document.getElementById('dbr-q'),document.getElementById('dbr-info'));
  tg(document.getElementById('dbr-q2'),document.getElementById('dbr-pop'));
  document.addEventListener('keydown',function(e){ if(e.key!=='Escape')return; ['dbr-info','dbr-pop'].forEach(function(id,i){ var x=document.getElementById(id); if(!x.hidden){ x.hidden=true; document.getElementById(i?'dbr-q2':'dbr-q').setAttribute('aria-expanded','false'); } }); });
  // 앱바가 화면에 있으면 알약은 숨긴다 (숨은 알약은 Tab 으로도 안 잡히게 inert)
  function show(on){ if(on){ pill.removeAttribute('data-off'); pill.inert=false; } else { pill.setAttribute('data-off',''); pill.inert=true; document.getElementById('dbr-pop').hidden=true; document.getElementById('dbr-q2').setAttribute('aria-expanded','false'); } }
  show(false);
  if('IntersectionObserver' in window) new IntersectionObserver(function(en){ show(!en[0].isIntersecting); }).observe(bar);
})();</script>

<script>
/* ============================================================
   example-ui components.js — 드롭다운·대화상자 내재화 v1 (2026-09-28)
   붙이는 법: <script> 맨 위에 이 파일 내용을 붙이고
     · 드롭다운  ddEnhanceAll()                 페이지의 <select> 전부를 앱이 그리는 목록으로 바꾼다(나중에 생기는 것도)
     · 확인      await ask({title, body, ok:"삭제", danger:true})   → true / false      (confirm 대신)
     · 알림      await tell({title, body})                            → 닫으면 끝          (alert 대신)
     · 입력      await ask({title, body, ok:"저장", input:{value:""}}) → 문자열 / null    (prompt 대신)
     · 기간      drp(자리, {from, to, onChange})  또는  <input data-drp> + drpEnhanceAll()   (기간 조회는 전부 이것 — v1.1 2026-10-02)
   (같은 이름 함수가 앱에 이미 있으면 덮지 않는다 → ui.ask() · ui.tell() · ui.ddEnhanceAll() 로 부른다)
   CSS 는 tokens.css 의 .dd* · .dlg* 를 쓴다. 앱 팔레트가 따로면 같은 클래스 이름으로 앱 변수만 바꿔 그린다.

   ★ <select> 는 지우지 않고 숨긴다(겉만 바꾼다). 그래서 기존 코드가 그대로 돈다 —
     sel.value = x · sel.selectedIndex = n · sel.innerHTML = "<option…>" · sel.onchange · addEventListener("change")
     · sel.hidden · sel.disabled 전부 새 버튼에 자동 반영. 로직은 한 줄도 안 고친다.
   옵션 표기: <option value="2026-07" data-label="2026-07" data-note="미산출">2026-07 (미산출)</option>
     data-label = 보이는 이름, data-note = 오른쪽 흐린 보조 문구. 없으면 글자 그대로.
   내재화 제외: <select multiple> · <select data-native>
   ============================================================ */
(function(){
  const SEARCH_AT = 12;                 /* 옵션이 이보다 많으면 목록 맨 위에 검색칸 */
  let seq = 0, openDD = null;
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; };
  const svg = (cls, d, w) => `<svg class="${cls}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
  const CHEV = svg("dd-chev", "m6 9 6 6 6-6", 2), CHECK = svg("dd-check", "M20 6 9 17l-5-5", 2.2);
  const P = HTMLSelectElement.prototype;
  const dV = Object.getOwnPropertyDescriptor(P, "value"), dI = Object.getOwnPropertyDescriptor(P, "selectedIndex");

  function ddEnhance(sel){
    if(sel._dd || sel.multiple || sel.hasAttribute("data-native")) return sel._dd;
    if(!sel.isConnected || !sel.parentNode) return null;   /* 그리는 사이 떼어진 select — 꾸밀 자리가 없다 */
    const id = "dd" + (++seq);
    const wrap = mk("span", "dd"); wrap.style.cssText = sel.style.cssText;
    const btn = mk("button", "dd-btn"); btn.type = "button";
    if(sel.classList.contains("sm")) btn.classList.add("sm");
    btn.setAttribute("role", "combobox"); btn.setAttribute("aria-haspopup", "listbox");
    btn.setAttribute("aria-expanded", "false"); btn.setAttribute("aria-controls", id + "-l");
    const forLab = sel.id ? document.querySelector('label[for="' + sel.id + '"]') : null;
    const lab = (sel.getAttribute("aria-label") || (forLab && forLab.textContent) || sel.title || "").trim();
    if(lab) btn.setAttribute("aria-label", lab);
    const list = mk("div", "dd-list"); list.id = id + "-l"; list.setAttribute("role", "listbox"); list.hidden = true;
    let q = null, act = -1, shown = [], typed = "", typedAt = 0;
    sel.parentNode.insertBefore(wrap, sel); wrap.append(sel, btn);
    const isOpen = () => btn.getAttribute("aria-expanded") === "true";
    const optLabel = o => o.dataset.label || o.text;

    const paint = () => {
      const o = sel.options[dI.get.call(sel)];
      btn.replaceChildren(mk("span", "dd-v", o ? optLabel(o) : ""));
      if(o && o.dataset.note) btn.append(mk("span", "dd-note", o.dataset.note));
      btn.insertAdjacentHTML("beforeend", CHEV);
      btn.disabled = sel.disabled; wrap.hidden = sel.hidden;
    };
    const build = () => {
      const f = q && !q.hidden ? q.value.trim().toLowerCase() : "";
      list.querySelectorAll(".dd-opt,.dd-grp,.dd-none").forEach(e => e.remove());
      shown = [];
      const cur = dI.get.call(sel);
      [...sel.options].forEach((o, i) => {
        if(f && !(optLabel(o) + " " + (o.dataset.note || "")).toLowerCase().includes(f)) return;
        const g = o.parentElement && o.parentElement.tagName === "OPTGROUP" ? o.parentElement.label : "";
        if(g && (!shown.length || shown[shown.length - 1].g !== g)) list.append(mk("div", "dd-grp", g));

  const bars = rows.map(([b, o], i) => { const [a, s, x, l] = cFlow(o, m);
    return `<div class="stk-row" tabindex="0" data-tip="${esc(tipRow('25말 ' + b + ' · ' + gl, o))}"><span class="stk-l">${b}</span><div class="stk-t"><div class="stk-b gx" style="--i:${i}">${seg3(o, a, s, x, l)}</div><span class="stk-v">${a > 0 ? pct((s + x) / a) : '–'}</span></div></div>`; }).join('');
  const mxL = Math.max(...rows.map(([, o]) => Math.abs(o.bL26))) || 1;
  const left = rows.map(([b, o], i) => `<div class="bl-row" tabindex="0" data-tip="${esc(tipRow('25말 ' + b + ' → 26.9말 ' + cTo(b) + ' · ' + gl, o))}"><span class="bl-n"><span class="p26">→ ${cTo(b)}</span><span class="ag-sub">${pt('25')} ${b}</span></span>` +
    `<span class="bl-tr"><span class="gx" style="--i:${i};left:0;width:${Math.max(0, o.bL26) / mxL * 100}%;background:var(--s26)"></span></span><span class="bl-v" title="${won(o.bL26)}">${eok(o.bL26)}</span></div>`).join('');
  const td = (v, t, cls = '') => `<td class="num ${cls}" title="${t}">${v}</td>`;
  const tr = (lab, o, cls = '') => { const [a, s, x, l] = cFlow(o, m);
    return `<tr class="${cls}"><td class="first">${lab}</td>${[a, s, x, l].map(v => td(f(v), fW(v))).join('')}${td(pct(share(s + x, a)), '')}<td>${cls ? '' : cTo(lab)}</td>` +
      `${td(eok(o.bL26), won(o.bL26))}${td(eok(o.p25), won(o.p25))}${td(eok(o.pGone, true), '+' + won(o.pGone))}${td(eok(o.pLeft), won(o.pLeft))}</tr>`; };
  const U = C.untracked, un = U[0] && !g ? `<tr><td class="first">코드 바뀜·추적 불가 ${qty(U[0])}품번</td>${td(f(m === 'q' ? U[1] : U[2]), fW(m === 'q' ? U[1] : U[2]))}<td colspan="6"></td>${td(eok(U[3]), won(U[3]))}<td colspan="2"></td></tr>` : '';
  const HD = ['25말', '판매', '판매 외', '남음', '소진율'], HD2 = [['26.9말 연차', '', 'p26'], ['남은 장부', '남은 25말분의 26.9말 장부', 'p26'], ['25말 충당', '', 'p25'], ['소멸', '나간 25말분 충당 환입 ([요약] ① 소멸과 같은 식)', ''], ['남은 충당', '25말 충당 − 소멸', '']];
  $('#pd').innerHTML = `<div class="ag-kpis">${kp.map(([k, v, t, d]) => `<div class="kpi" title="${t}"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join('')}</div>
    <div class="ag-col"><div class="ag-grid">
      <div class="card"><div class="card-h"><span class="ag-h">${pt('25')} 연차별 소진 · ${gl}</span><span class="ag-sub">${MN[m]} · 소진율</span></div>
        <div class="card-b"><div class="stk coh">${bars}</div><div class="legend"><span><i style="background:var(--brand)"></i>판매</span><span><i style="background:var(--a2)"></i>판매 외 출고</span><span><i style="background:var(--a6)"></i>남음</span></div></div></div>
      <div class="card"><div class="card-h"><span class="ag-h">남은 재고 ${pt('26')} 장부</span><span class="ag-sub">${eok(T.bL26)}</span></div><div class="card-b"><div class="bl coh-l">${left}</div></div></div>
    </div>
    <div class="card"><div class="card-h"><span class="ag-h">${pt('25')} 연차별 흐름 · ${gl}</span><span class="ag-sub">${m === 'q' ? '개' : '억'}</span></div><div class="card-b"><div class="table-wrap"><table class="tbl">
      <thead><tr><th class="p25">25말 연차</th>${HD.map(h => `<th class="num ${h === '25말' ? 'p25' : ''}">${h}</th>`).join('')}${HD2.map(([h, t, c]) => `<th class="${h === '26.9말 연차' ? '' : 'num'} ${c}" ${t ? `title="${t}"` : ''}>${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(([b, o]) => tr(b, o)).join('')}${un}${tr('합계', T, 'total')}</tbody></table></div></div></div></div>`;
}
// ── 5장 해석 — 숫자는 전부 D 에서
function pageE(){
  const a = agg('25', () => true), b = agg('26', () => true), rate = o => o.pos ? -o.prov / o.pos : 0;
  const dBook = b.book - a.book, dProv = b.prov - a.prov, dRate = (rate(b) - rate(a)) * 100;
  const yng = p => { const t = agg(p, () => true).book; return agg(p, (g, c) => c === B[0] || c === B[1]).book / t; };
  let mix = 0, ev = 0;   // 설정률 차 = Σ(26 비중 − 25 비중)×25 설정률 [구성] + Σ 26 비중×(26 − 25 설정률) [평가]
  for (const bb of B) { const x = agg('25', (g, c) => c === bb), y = agg('26', (g, c) => c === bb);
    mix += (y.pos / b.pos - x.pos / a.pos) * rate(x); ev += y.pos / b.pos * (rate(y) - rate(x)); }
  const OLD = B.slice(2, 6), od = G.map(g => [g, OLD.reduce((s, c) => s + D.cells['26'][g][c][1] - D.cells['25'][g][c][1], 0)]).sort((x, y) => y[1] - x[1]);
  const up = od.filter(x => x[1] > 0.5), omx = Math.max(...od.map(x => Math.abs(x[1]))) || 1;
  const T = cAgg('', null), lOld = B.reduce((s, c) => s + OLD.reduce((t, k) => t + (C.trans[c][k] || 0), 0), 0);
  const nextY = agg('26', (g, c) => c === B[2] || c === B[3]).book, st = D.bridge.steps;
  const nb = (k, v, t, cls = '') => `<div class="ie-n" title="${t}"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`;
  const card = (h, body) => `<div class="card"><div class="card-h"><span class="ag-h">${h}</span></div><div class="card-b ie">${body}</div></div>`;
  const ln = s => `<p class="ie-l">${s}</p>`;
  const odRows = od.map(([g, v], i) => { const w = Math.abs(v) / omx * 50;
    return `<div class="bl-row"><span class="bl-n">${g}</span><span class="bl-tr"><span class="ax" style="left:50%"></span><span class="gx${v < 0 ? ' r' : ''}" style="--i:${i};left:${v < 0 ? 50 - w : 50}%;width:${w}%;background:${v < 0 ? 'var(--neg)' : 'var(--brand)'}"></span></span><span class="bl-v ${v < 0 ? 'dn' : ''}" title="${(v > 0 ? '+' : '') + won(v)}">${arrow(v)} ${eok(v, true)}</span></div>`; }).join('');
  $('#pe').innerHTML = `<div class="ag-col">` +
    card(`재고 ${dBook >= 0 ? '증가' : '감소'} · 충당 ${dProv >= 0 ? '감소' : '증가'}`,
      `<div class="ie-ns">${nb('장부 ' + pt('d'), eok(dBook, true), `25말 ${won(a.book)} → 26.9말 ${won(b.book)}`)}${nb('충당 ' + pt('d'), eok(dProv, true), `25말 ${won(a.prov)} → 26.9말 ${won(b.prov)}`)}${nb('설정률', `${pt('25', pct(rate(a)))} → ${pt('26', pct(rate(b)))}`, pp(dRate))}
        ${nb('0~1년차 장부 비중', `${pt('25', pct(yng('25')))} → ${pt('26', pct(yng('26')))}`, '25말 0~1년차 / 26.9말 0~1년차')}${nb('구성 효과', pp(mix * 100), '25말 연차별 설정률을 26.9말 연차 구성에 적용한 차이', mix < 0 ? 'dn' : '')}${nb('평가 효과', pp(ev * 100), '연차별 설정률 변화 (25년 3년 초과 100% + NRV → 26년 소진율·할인율 기반)', ev < 0 ? 'dn' : '')}</div>` +
      ln(`설정률 ${pt('d', pp(dRate))} 중 연차 구성 변화가 ${pp(mix * 100)}, 평가 방식 변경이 ${pp(ev * 100)}예요.`)) +
    card('고연차 적체',
      `<div class="ie-ns">${nb('남아서 넘어간 장부 ' + pt('26'), eok(T.bL26), '25말 재고 중 26.9말에 남은 분 · ' + won(T.bL26))}${nb('이 중 26말 2년차 이상', eok(lOld), won(lOld))}${nb('내년 3·4년차 진입', eok(nextY), '26.9말 2·3년차 장부 · ' + won(nextY))}</div>
       <div class="ie-sh">2년차 이상 장부 증감 · 그룹</div><div class="bl">${odRows}</div>` +
      ln('남은 재고가 한 해씩 밀려 3·4년차에 들어가면 설정률이 올라 충당이 늘어요.')) +
    card('충당 변동 분해',
      `<div class="ie-ns">${st.slice(1, 4).map(s => nb(s[0], eok(s[1], true), (s[1] > 0 ? '+' : '') + won(s[1]), s[1] < 0 ? 'dn' : '')).join('')}${nb('순 환입 ' + pt('d'), eok(st[4][1] - st[0][1], true), won(st[4][1] - st[0][1]))}</div>` +
      ln('나간 25말분 충당이 환입되고, 재평가·신규 설정이 그 일부를 다시 쌓았어요.')) +
    card('읽을 때 주의',
      `<ul class="ie-ul"><li>25말은 12월, 26.9말은 FW 입고 직후라 재고가 많은 시점이에요. 공정 비교는 25.9말이나 12월 결산과 해요.</li>
        <li>연차 칸끼리는 같은 재고가 아니에요. 한 칸씩 밀리고 입고·판매가 섞여서, 같은 재고는 <button class="btn ghost sm" data-go="d">코호트</button> 장에서 봐요.</li></ul>`) +
    card('관리 포인트',
      `<div class="ie-chips">${up.map(([g, v]) => `<span class="badge" title="${'+' + won(v)}">${g} ${eok(v, true)}</span>`).join('') || '<span class="badge">–</span>'}</div>` +
      ln('2년차 이상 장부가 늘어난 그룹이 이월 소진 행사 후보예요.') + ln('12월 결산 때 같은 화면으로 다시 비교해요.')) + `</div>`;
}
$('#pe').addEventListener('click', e => { const el = e.target.closest('[data-go]'); if (el) go(el.dataset.go); });
// ── 상태·토글
function seg(id, key){ const el = $(id); el.querySelectorAll('button').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.v === S[key]));
  b.onclick = () => { if (b.getAttribute('aria-disabled') === 'true') return; S[key] = b.dataset.v; if (key === 'ax') S.sel = {}; render(); }; }); }
const TS = ['a', 'b', 'c', 'd', 'e'];
const gs = $('#sGrp'); gs.innerHTML = ['', ...G].map(g => `<option value="${g}">${g || '전사'}</option>`).join(''); gs.onchange = () => { S.grp = gs.value; render(); };
function render(){ const t = S.t, c = t === 'c';
  if (t === 'd' && (S.met === 'prov' || S.met === 'rate')) S.met = 'book';
  $('#tb').hidden = t === 'e'; $('#sBase').hidden = t !== 'a'; $('#sMet').hidden = c || t === 'e'; $('#sAx').hidden = !(t === 'a' || c); gs.hidden = t !== 'd';
  $('#sAx [data-v="hm"]').setAttribute('aria-disabled', String(c));
  for (const v of ['prov', 'rate']) $(`#sMet [data-v="${v}"]`).setAttribute('aria-disabled', String(t === 'd'));
  seg('#sBase', 'base'); seg('#sMet', 'met'); seg('#sAx', c ? 'axc' : 'ax');
  for (const x of TS) $('#p' + x).hidden = t !== x;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === t)));
  ({a: pageA, b: pageB, c: pageC, d: pageD, e: pageE})[t]();
}
function go(t){ if (t === S.t) return; S.t = t; render(); const p = $('#p' + t); p.classList.remove('in'); void p.offsetWidth; p.classList.add('in'); }
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.t));
$('#tabs').addEventListener('keydown', e => { const i = TS.indexOf(S.t);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { go(TS[(i + (e.key === 'ArrowRight' ? 1 : TS.length - 1)) % TS.length]); $('#tabs [data-t="' + S.t + '"]').focus(); } });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => S.t === 'b' && drawLine(), 120); });
$('#ck').textContent = D.check;
ddEnhanceAll();
const h0 = location.hash.slice(1).split(','); if (TS.includes(h0[0])) S.t = h0[0];
if (['age', 'grp', 'hm'].includes(h0[1])) { if (S.t === 'c') { if (h0[1] !== 'hm') S.axc = h0[1]; } else S.ax = h0[1]; }
if (S.t === 'd' && ['q', 'book'].includes(h0[1])) S.met = h0[1];
if (['light', 'dark'].includes(h0[2])) document.documentElement.dataset.theme = h0[2];
render();
