      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre">' + L2.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('아카이빙 현황');
  }

  /** 글자를 오른쪽으로 밀어 칸을 맞춘다 — 한글은 두 칸으로 센다 */
  function pad_(v, n) {
    var t = String(v === null || v === undefined ? '' : v), w = 0;
    for (var i = 0; i < t.length; i++) w += (t.charCodeAt(i) > 127 ? 2 : 1);
    var sp = '';
    for (var j = w; j < n; j++) sp += ' ';
    return t + sp + ' ';
  }

  // ?fxauto=YYYY-MM — 기준금액이 미확정인 수입 묶음마다 «입고일의 과세환율» 을 넣는다.
  //   8월은 유니패스 수입신고실적에서 신고일 기준으로 가져왔다. 지난 달들은 그 자료가 없어
  //   입고일로 대신 조회한다 — 통관과 입고 사이에 주가 바뀌면 환율이 한 단계 다를 수 있다.
  //   그래서 출처에 «(입고일)» 을 남긴다. 나중에 유니패스를 받으면 그 자리만 덮어쓰면 된다.
  if (e && e.parameter && e.parameter.fxauto) {
    var outF = [];
    try {
      var ymF = String(e.parameter.fxauto);
      var CF = closeCompute_(ymF);
      if (!CF) throw new Error('ERP 입고현황을 먼저 올리세요');
      // 묶음마다 «USD 가 있는가» 를 같이 센다 —
      // USD 가 한 줄도 없는 묶음은 환율을 아무리 정확히 넣어도 0 이라 영영 미확정으로 남는다.
      // (2026-01 가상수입처 JP COLLECTION 9행이 그랬다 — ERP에 외화단가가 없다)
      // 그런 묶음은 사전원가를 기준으로 쓴다.
      var need = {}, usdBy = {};   // 안쪽 콜백에도 usd 가 있어 이름을 가른다
      CF.lines.forEach(function (l) {
        if (l.qty > 0 && l.work !== '반품') usdBy[l.grp] = (usdBy[l.grp] || 0) + Math.abs(l.amt_imp || 0);
        if (l.base_src === '미확정' || (!l.base && l.qty > 0 && l.work !== '반품')) need[l.grp] = l.ymd;
      });
      var gs = Object.keys(need).sort();
      if (!gs.length) outF.push('미확정 묶음이 없습니다');
      var memo = {};
      gs.forEach(function (g) {
        var day = String(need[g]).replace(/[^0-9]/g, '');
        try {
          if (!usdBy[g]) {
            apiFxSave(ymF, g, '사전원가', '', 'ERP에 외화단가 없음 — 사전원가 기준', '', '');
            outF.push(g + '  사전원가 기준  (USD 없음)');
            return;
          }
          if (!memo[day]) {
            var r = fxrateLookup_(day);
            var usd = (r.rows || []).filter(function (x) { return String(x.currSgn || '').toUpperCase() === 'USD'; })[0];
            memo[day] = usd ? num_(usd.fxrt) : 0;
          }
          var rate = memo[day];
          if (!rate) { outF.push(g + '  ✗ ' + day + ' 과세환율에 USD 가 없습니다'); return; }
          apiFxSave(ymF, g, '환율', rate, '과세환율(입고일 ' + day + ')', '', '');
          outF.push(g + '  @' + rate + '  (' + day + ')');
        } catch (eF) { outF.push(g + '  ✗ ' + eF); }
      });
      var after = closeCompute_(ymF);
      var left = 0;
      if (after) after.lines.forEach(function (l) { if (l.base_src === '미확정') left++; });
      outF.push('');
      outF.push('남은 미확정 ' + left + '행');
    } catch (errF) { outF.push('멈췄습니다 — ' + errF); }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + outF.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('환율');
  }

  // ?fxday=YYYY-MM[&apply=1] — 이미 서 있는 환율을 «ERP 입고일» 기준으로 다시 세운다.
  //   B/L 잇기가 예전엔 «신고 수리일» 로 잡았다. 과세환율은 주 단위 고시라 대개 같은 값이지만,
//   한 B/L 을 여러 묶음이 나눠 쓰면 남의 날짜가 복사됐다(2026-01 260113 ↔ 260123, 10일 차이).
  if (e && e.parameter && e.parameter.fxday) {
    var outD = [];
    try {
      var ymD = ymOf_(String(e.parameter.fxday));
      var CD = closeCompute_(ymD);
      if (!CD) throw new Error('ERP 입고현황을 먼저 올리세요');
      var GD2 = impGroups_(CD.lines);          // 묶음별 첫 입고일
      var FXD = fxOf_(ymD);
      var usdD = {};
      CD.lines.forEach(function (l) { if (l.qty) usdD[l.grp] = (usdD[l.grp] || 0) + (l.amt_imp || 0); });
      var memoD = {}, chg = [], same = 0;
      Object.keys(FXD).sort().forEach(function (g) {
        var cur = FXD[g];
        if (cur.mode !== '환율' || !cur.rate) return;
        var day = String((GD2[g] || {}).ymd || '').replace(/[^0-9]/g, '').slice(0, 8);
        if (day.length !== 8) { outD.push(g + '  입고일을 못 찾아 건너뜁니다'); return; }
        if (!(day in memoD)) {
          memoD[day] = null;
          try {
            var got = fxrateLookup_(day);
            (got.rows || []).forEach(function (r) {
              if (String(r.currSgn || '').toUpperCase() === 'USD' && num_(r.fxrt) > 0) memoD[day] = num_(r.fxrt);
            });
          } catch (e2) { outD.push(day + ' 과세환율 조회 실패 — ' + e2.message); }
        }
        var nr = memoD[day];
        if (!nr) { outD.push(g + '  ' + day + ' 고시에 USD 가 없어 그대로 둡니다'); return; }
        var src = '관세청 과세환율 ' + day + ' · 입고일';
        if (Math.abs(nr - cur.rate) < 0.0001) { same++;
          if (cur.src !== src) chg.push({ g: g, old: cur.rate, nw: nr, day: day, cur: cur, only: 1 });
          return; }
        chg.push({ g: g, old: cur.rate, nw: nr, day: day, cur: cur, only: 0 });
      });
      outD.push(ymD + ' — 환율 묶음 ' + (same + chg.filter(function (c) { return !c.only; }).length) + '개');
      outD.push('환율이 같은 것 ' + same + '개 · 값이 바뀌는 것 ' + chg.filter(function (c) { return !c.only; }).length + '개');
      outD.push('');
      var diff = 0;
      chg.forEach(function (c) {
        var u = usdD[c.g] || 0, d = Math.round(u * c.nw) - Math.round(u * c.old);
        diff += d;
        outD.push((c.only ? '=' : '≠') + ' ' + c.g
          + '   @' + c.old + ' → @' + c.nw + ' (' + c.day + ')'
          + '   USD ' + fmt_(Math.round(u)) + '   금액 ' + (d > 0 ? '+' : '') + fmt_(d));
      });
      outD.push('');
      outD.push('이 달 기준금액 변동 ' + (diff > 0 ? '+' : '') + fmt_(diff) + '원');
      if (e.parameter.apply) {
        var n = 0;
        chg.forEach(function (c) {
          apiFxSave(ymD, c.g, '환율', c.nw, '관세청 과세환율 ' + c.day + ' · 입고일',
                    c.cur.bl || '', c.cur.memo || '');
          n++;
        });
        bust_(ymD);
        outD.push('');
        outD.push('다시 세웠습니다 — ' + n + '묶음');
      } else {
        outD.push('※ 보기만 했습니다. 바꾸려면 &apply=1 을 붙이세요.');
      }
    } catch (eD) { outD.push('막혔습니다 — ' + (eD && eD.message || eD)); }
    return HtmlService.createHtmlOutput('<body style="background:#111;color:#ddd;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + outD.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('환율 재기준');
  }
  // ?cost=<파일이름>&ym=YYYY-MM — 내 드라이브의 JSON 배열을 부대비용으로 넣는다.
  //   한 건씩 apiCostSave 를 탄다 — 검증·확정잠금·브랜드 경계가 전부 그대로 걸린다.
  if (e && e.parameter && e.parameter.cost) {
    var outC = [];
    try {
      var nmC = String(e.parameter.cost);
      var itC = DriveApp.getFilesByName(nmC);
      if (!itC.hasNext()) throw new Error('내 드라이브에 «' + nmC + '» 이 없습니다');
      var ymC2 = String(e.parameter.ym || defaultYm_());
      var arr = JSON.parse(itC.next().getBlob().getDataAsString('UTF-8'));
      // 범위값이 «BL:BRI…» 이면 그 B/L 에 붙은 입고묶음으로 바꿔 넣는다.
      //   B/L ↔ 묶음 은 B/L 자동연결이 FX 시트에 적어 둔 것이라 여기서만 알 수 있다.
      var FXR = {};
      rows_(SH.FX).forEach(function (r) {
        if (String(r.ym) !== ymC2) return;
        var b = String(r['BL'] || '').trim().toUpperCase();
        if (b) (FXR[b] = FXR[b] || []).push(String(r['입고묶음'] || '').trim());
      });
      arr.forEach(function (row) {
        try {
          var sv = String(row['범위값'] || '');
          if (sv.indexOf('BL:') === 0) {
            var bls = sv.slice(3).split(';').map(function (x) { return x.trim().toUpperCase(); }).filter(String);
            var gsx = [];
            bls.forEach(function (b) { (FXR[b] || []).forEach(function (g) { if (gsx.indexOf(g) < 0) gsx.push(g); }); });
            if (!gsx.length) throw new Error('B/L ' + bls.join(',') + ' 에 붙은 입고묶음이 없습니다 — B/L 자동연결을 먼저 도세요');
            row = JSON.parse(JSON.stringify(row));
            row['배부범위'] = '입고묶음';
            row['범위값'] = gsx.join(';');
          }
          apiCostSave(ymC2, row, null);
          outC.push('✔ ' + row['비용유형'] + ' ' + fmt_(num_(row['금액'])) + '  ' + (row['배부범위'] || '') + ' ' + (row['범위값'] || ''));
        } catch (eC) { outC.push('✗ ' + row['비용유형'] + ' ' + row['금액'] + ' — ' + eC); }
      });
    } catch (errC) { outC.push('멈췄습니다 — ' + errC); }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + outC.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('부대비용');
  }

  // ?load=<파일이름>&ym=YYYY-MM&as=close|uni — 내 드라이브에 둔 엑셀을 그대로 올린다.
  // 파일 선택 창을 못 띄우는 자리(자동 점검·원격)에서 쓴다. 파서는 업로드와 똑같은 것을 탄다.
  if (e && e.parameter && e.parameter.load) {
    var out2;
    try {
      var nm = String(e.parameter.load);
      var it = DriveApp.getFilesByName(nm);
      if (!it.hasNext()) throw new Error('내 드라이브에 «' + nm + '» 이 없습니다');
      var fl = it.next(), bl = fl.getBlob();
      var ym2 = String(e.parameter.ym || defaultYm_());
      var b64 = Utilities.base64Encode(bl.getBytes());
      var kind2 = String(e.parameter.as || 'close');
      var r2 = (kind2 === 'uni') ? apiUnipassUpload(ym2, nm, b64, bl.getContentType())
                                 : apiCloseUpload(ym2, nm, b64, bl.getContentType());
      out2 = nm + ' → ' + ym2 + ' (' + kind2 + ')' + String.fromCharCode(10) + JSON.stringify(r2, null, 1);
    } catch (err3) { out2 = '올리다 멈췄습니다 — ' + err3; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + String(out2)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('올리기');
  }
  // ?seed=YYYY-MM&wrong=N — ERP 입고현황을 «검수 끝난 건» 으로 깐다 (뒤 단계 시험용)
  if (e && e.parameter && e.parameter.seed) {
    var out3;
    try { out3 = JSON.stringify(seedFromReceipt_(String(e.parameter.seed), Number(e.parameter.wrong || 0)), null, 1); }
    catch (err4) { out3 = '깔다 멈췄습니다 — ' + err4; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + String(out3)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('시드');
  }
  // ?bl=YYYY-MM — B/L 자동연결이 무엇을 내놓는지 (화면에서 조용히 죽을 때 쓴다)
  if (e && e.parameter && e.parameter.bl) {
    var out4, t4 = Date.now();
    try {
      var mt = apiBlMatch(String(e.parameter.bl));
      var pick = ((mt && mt.rows) || []).filter(function (x) { return x['묶음'] && x['묶음'].length; });
      if (e.parameter.apply && pick.length) {
        apiBlApply(String(e.parameter.bl), pick, true);
        out4 = '적용했습니다 — ' + pick.length + '묶음'
          + String.fromCharCode(10) + JSON.stringify(mt.sel, null, 1);
      } else {
        out4 = JSON.stringify(mt, null, 1);
      }
    }
    catch (err5) { out4 = '멈췄습니다 — ' + err5 + String.fromCharCode(10) + (err5 && err5.stack ? err5.stack : ''); }
    out4 = (Date.now() - t4) + 'ms' + String.fromCharCode(10) + out4;
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + String(out4)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('B/L');
  }
  // ?v=YYYY-MM[&confirm=1] — 검증 결과를 보고, confirm 이면 확정까지
  if (e && e.parameter && e.parameter.v) {
    var out5, ym5 = String(e.parameter.v);
    try {
      var d5 = apiClose(ym5), L5 = [];
      if (!d5 || !d5.summary) {
        // ERP 입고현황이 없으면 summary 가 아예 없다. 예전엔 여기서 TypeError 로 터졌다.
        L5.push(ym5 + ' — ERP 입고현황이 없습니다. 먼저 올려 주세요.');
        return HtmlService.createHtmlOutput('<meta charset="utf-8">'
          + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
          + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
          + '<pre style="white-space:pre-wrap;margin:0">' + L5.join('') + '</pre></body>').setTitle('검증');
      }
      L5.push('수량 ' + fmt_(d5.summary.qty) + ' · 기준 ' + fmt_(d5.summary.base)
        + ' · 부대비용 ' + fmt_(d5.summary.oh_inv) + ' · 취득원가 ' + fmt_(d5.summary.landed));
      L5.push('');
      (d5.checks || []).forEach(function (c) {
        L5.push((c.ok ? '✔ ' : '✘ ') + c.id + ' ' + c.name);
        if (c.detail) L5.push('    ' + c.detail);
      });
      var bad5 = (d5.checks || []).filter(function (c) { return !c.ok; });
      L5.push('');
      L5.push(bad5.length ? ('✘ 막히는 검증 ' + bad5.length + '개') : '✔ 검증 전부 통과');
      if (e.parameter.confirm) {
        if (bad5.length) L5.push('— 검증이 안 끝나 확정하지 않았습니다');
        else { var r5 = apiCloseConfirm(ym5, true, !!e.parameter.nopush); L5.push('확정했습니다 — ' + JSON.stringify(r5 && r5.state ? r5.state : r5)); }
      }
      out5 = L5.join(String.fromCharCode(10));
    } catch (err6) { out5 = '멈쾔습니다 — ' + err6; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + String(out5)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('검증');
  }
  // ?duty=YYYY-MM[&apply=1] — 유니패스 관세를 부대비용으로
  if (e && e.parameter && e.parameter.duty) {
    var LD = [], ymD = String(e.parameter.duty);
    try {
      var rD = apiDutyToCost(ymD, !!e.parameter.apply);
      LD.push(ymD + ' — 유니패스 신고 ' + rD.plan.length + '건');
      LD.push('');
      rD.plan.forEach(function (x) {
        LD.push((x.ok ? '\u2714 ' : '\u2718 ') + pad_(x.no, 20) + pad_(x.bl, 18)
          + pad_(fmt_(x.duty), 13) + '  ' + (x.grps.join(' · ') || '-')
          + (x.why ? ('   ' + x.why) : ''));
      });
      LD.push('');
      if (!e.parameter.apply) {
        var canD = rD.plan.filter(function (x) { return x.ok; });
        LD.push('넣을 수 있는 것 ' + canD.length + '건 · 합계 '
          + fmt_(canD.reduce(function (t, x) { return t + x.duty; }, 0)));
        LD.push('※ 보기만 했습니다. 넣으려면 &apply=1 을 붙이세요.');
      } else {
        LD.push('넣었습니다 ' + rD.done.length + '건 · 합계 '
          + fmt_(rD.done.reduce(function (t, x) { return t + x.duty; }, 0)));
        rD.fail.forEach(function (x) { LD.push('  \u2718 ' + x.p.no + ' — ' + x.msg); });
      }
    } catch (errD) { LD.push('멈췄습니다 — ' + errD); }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + LD.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('관세');
  }

  // ?dump=YYYY-MM · ?restore=<파일>&ym= · ?baks=[YYYY-MM] · ?wipe=YYYY-MM
  if (e && e.parameter && (e.parameter.dump || e.parameter.restore || e.parameter.baks || e.parameter.wipe)) {
    var LB = [];
    try {
      if (e.parameter.dump) {
        var rB = apiBackupDump(String(e.parameter.dump));
        LB.push('떠 두었습니다 — ' + rB.name);
        LB.push('  ' + rB.url);
        Object.keys(rB.counts).forEach(function (k) { LB.push('  ' + pad_(k, 14) + fmt_(rB.counts[k]) + '행'); });
        LB.push('  확정상태 ' + (rB.closed ? '있음(같이 떴습니다)' : '없음'));
      } else if (e.parameter.restore) {
        var rR = apiBackupRestore(String(e.parameter.restore), String(e.parameter.ym || ''));
        LB.push('되돌렸습니다 — ' + rR.from + ' → ' + rR.ym);
        Object.keys(rR.counts).forEach(function (k) { LB.push('  ' + pad_(k, 14) + fmt_(rR.counts[k]) + '행'); });
        LB.push('  확정상태 ' + (rR.closed ? '되살렸습니다' : '없음'));
      } else if (e.parameter.wipe) {
        // 비우기 — 떠 둔 백업이 있어야만 지운다. 되돌릴 길 없이 지우는 일은 없게.
        var ymW = String(e.parameter.wipe);
        var haveB = apiBackupList(ymW).rows;
        if (!haveB.length) {
          LB.push('✘ ' + ymW + ' 백업이 없습니다. 먼저 ?dump=' + ymW + ' 를 하세요.');
        } else {
          LB.push('가장 최근 백업: ' + haveB[0].name + ' (' + haveB[0].at + ')');
          var PW2 = PropertiesService.getScriptProperties();
          var kW = 'WIPE_TICKET_' + ymW;
          if (!e.parameter.yes) {
            // 한 번 쓰면 죽는 표를 준다. 주소를 새로고침해도 표가 없으면 안 지워진다 —
            // 탭에 남은 ?wipe=…&yes=1 이 다시 돌아 7월을 두 번 날린 적이 있다.
            var tW = Utilities.getUuid().slice(0, 8);
            PW2.setProperty(kW, JSON.stringify({ t: tW, at: Date.now() }));
            LB.push('');
            LB.push('※ 아직 안 지웠습니다. 이 주소로 한 번만 지울 수 있습니다:');
            LB.push('   ?wipe=' + ymW + '&yes=' + tW);
            LB.push('   (표는 10분 뒤 만료되고, 한 번 쓰면 사라집니다)');
            LB.push('   지우는 것: 입고현황 · 입고현황메타 · 비용 · 비용품번 · 환율 · 유니패스 (그 달만)');
          } else {
            var rawW = PW2.getProperty(kW);
            var tkW = rawW ? JSON.parse(rawW) : null;
            if (!tkW || tkW.t !== String(e.parameter.yes)) {
              LB.push('');
              LB.push('\u2718 표가 맞지 않습니다 — 이미 썼거나 만료됐습니다.');
              LB.push('   새로고침으로는 지워지지 않습니다. ?wipe=' + ymW + ' 부터 다시 하세요.');
            } else if (Date.now() - Number(tkW.at) > 600000) {
              PW2.deleteProperty(kW);
              LB.push('');
              LB.push('\u2718 표가 만료됐습니다(10분). ?wipe=' + ymW + ' 부터 다시 하세요.');
            } else {
              PW2.deleteProperty(kW);          // 먼저 없앤다 — 지우는 중에 새로고침해도 두 번 안 돌게
              var rW = apiCloseReset(ymW);
              LB.push('비웠습니다 — 입고현황 · 메타 · 비용 · 비용품번 · 환율 · 유니패스');
              LB.push('  (표를 썼으니 이 주소를 새로고침해도 다시 안 지워집니다)');
            }
          }
        }
      } else {
        var rL = apiBackupList(String(e.parameter.baks) === '1' ? '' : String(e.parameter.baks || ''));
        LB.push('떠 둔 백업 ' + rL.rows.length + '개');
        rL.rows.forEach(function (x) { LB.push('  ' + x.at + '  ' + pad_(String(x.size), 9) + '  ' + x.name); });
      }
    } catch (errB2) { LB.push('멈췄습니다 — ' + errB2); }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + LB.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('백업');
  }

  // ?ht=YYYY-MM — 홈택스 후보를 서버가 읽는지
  if (e && e.parameter && e.parameter.ht) {
    var ymH = String(e.parameter.ht), LH = [];
    try {
      LH.push('찾는 파일 이름: ' + HT_FILE + ymH + '.json');
      var itH = DriveApp.getFilesByName(HT_FILE + ymH + '.json');
      var nH = 0;
      while (itH.hasNext()) {
        var fH = itH.next(); nH++;
        LH.push('  찾음 — ' + fH.getName() + ' · ' + fH.getSize() + '바이트 · '
          + Utilities.formatDate(fH.getLastUpdated(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm')

      }
      if (!nH) LH.push('  드라이브에서 못 찾았습니다.');
      LH.push('');
      var dH = apiHometaxCand(ymH);
      LH.push('apiHometaxCand → 후보 ' + dH.rows.length + '건 · 제외 ' + dH.skipped.length + '건'
        + (dH.why ? ('  ✘ ' + dH.why) : ''));
      dH.rows.forEach(function (r) {
        LH.push('  ' + r.ymd + '  ' + pad_(r.type, 9) + pad_(fmt_(r.amt), 12) + '  ' + r.sup + '  [' + r.id + ']');
      });
      LH.push('');
      var uH = apiHometaxUsed(ymH);
      var ku = Object.keys(uH.used);
      LH.push('이미 넣은 증빙 ' + ku.length + '건' + (ku.length ? (' — ' + ku.join(', ')) : ''));
    } catch (errH) { LH.push('멈췄습니다 — ' + errH); }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + LH.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('홈택스 후보');
  }

  // ?perf=YYYY-MM — 어느 호출이 몇 ms 인가 (차가운 때 / 더운 때)
  if (e && e.parameter && e.parameter.perf) {
    var ymP = String(e.parameter.perf), LP = [], tP;
    function lap(name, fn) {
      var t = Date.now(), n2 = '', err = '';
      try { var r = fn(); n2 = (r && r.rows) ? (r.rows.length + '\ud589') : ((r && r.lines) ? r.lines.length : ''); }
      catch (ex) { err = ' \u2718 ' + ex; }
      LP.push(('        ' + (Date.now() - t)).slice(-7) + ' ms  ' + name + (n2 ? ('  ' + n2) : '') + err);
    }
    // _BUMP 를 안 비우면 옛 키를 그대로 써서 «차가운 때» 가 실은 더운 값이 된다.
    // 자기점검에서 같은 자리를 이미 당했다 — 캐시를 비우는 곳은 반드시 둘을 같이 비운다.
    cacheWipeAll_(); _BUMP = null; _MEMO = {}; _SS = null; _SHEET = {}; _WHO = null;
    LP.push('\u2014 \ucc28\uac00\uc6b4 \ub54c (\uce90\uc2dc \ube44\uc6c0) \u2014');
    lap('apiBoot(' + ymP + ')', function () { return apiBoot(ymP); });
    lap('apiClose(' + ymP + ')', function () { return apiClose(ymP); });
    lap('apiStock(' + ymP + ')', function () { return apiStock(ymP); });
    var id0 = (listRecv_(ymP)[0] || {}).id || '';
    if (id0) lap('apiDetail(' + id0 + ')', function () { return apiDetail(ymP, id0); });
    LP.push('');
    LP.push('\u2014 \ub354\uc6b4 \ub54c (\uce90\uc2dc \uc0b4\uc544\uc788\uc74c) \u2014');
    lap('apiBoot', function () { return apiBoot(ymP); });
    lap('apiClose', function () { return apiClose(ymP); });
    lap('apiStock', function () { return apiStock(ymP); });
    if (id0) lap('apiDetail', function () { return apiDetail(ymP, id0); });
    LP.push('');
    LP.push('\u2014 \uc18d\uc7ac\ub8cc \u2014');
    LP.push('— 시트 하나씩 차갑게 읽기 —');
    Object.keys(SH).forEach(function (k) { _MEMO = {}; _SHEET = {}; var nm = SH[k];
      lap('rows_(' + nm + ')', function () { return { rows: rows_(nm) }; }); });
    _MEMO = {}; _SHEET = {};
    lap('closeCompute_ 차가움', function () { return closeCompute_(ymP); });
    lap('closeCompute_ 더움(시트 메모 있음)', function () { return closeCompute_(ymP); });
    cacheWipeAll_(); _BUMP = null; _MEMO = {}; _SHEET = {};
    lap('apiLedger 차가움', function () { return apiLedger(ymP); });
    LP.push('');
    lap('rows_(\uc785\uace0\ud604\ud669)', function () { return { rows: rows_(SH.RCPT) }; });
    lap('rows_(\uc608\uc815)', function () { return { rows: rows_(SH.PLAN) }; });
    lap('listRecv_', function () { return { rows: listRecv_(ymP) }; });
    lap('closeCompute_', function () { return closeCompute_(ymP); });
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.7 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + LP.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('\uc18d\ub3c4');
  }
  // ?drop=<id>&ym=YYYY-MM — 건 하나를 지운다 (화면 [이 건 지우기] 와 같은 길)
  if (e && e.parameter && e.parameter.drop) {
    var out7;
    try {
      var ym7 = String(e.parameter.ym || defaultYm_());
      apiDelete(ym7, String(e.parameter.drop));
      out7 = '지웠습니다 — ' + ym7 + ' / ' + e.parameter.drop;
    } catch (err7) { out7 = '지우다 멈췄습니다 — ' + err7; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8"><pre style="font:14px Consolas">'
      + String(out7).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>');
  }
  // ?mk=<key>&ym=YYYY-MM — 예정 한 차수를 건으로 (화면이 조용히 죽을 때 이유를 본다)
  if (e && e.parameter && e.parameter.mk) {
    var out8;
    try {
      var ym8 = String(e.parameter.ym || defaultYm_());
      out8 = JSON.stringify(apiFromLs(ym8, String(e.parameter.mk), '', ''), null, 1);
    } catch (err8) { out8 = '멈췄습니다 — ' + err8; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8"><pre style="font:13px Consolas;white-space:pre-wrap">'
      + String(out8).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>');
  }
  // ?ls=YYYY-MM — 그 달 예정 차수와 key 를 그대로
  if (e && e.parameter && e.parameter.ls) {
    var out9;
    try {
      out9 = lsPending_(String(e.parameter.ls)).map(function (g) {
        return g.key + '   ← ' + g['출고처'] + ' ' + g.sku + 'SKU ' + g.qty + 'PC';
      }).join(String.fromCharCode(10));
    } catch (err9) { out9 = '멈췄습니다 — ' + err9; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8"><pre style="font:13px Consolas;white-space:pre-wrap">'
      + String(out9).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>');
  }
  // ?push=YYYY-MM — 확정된 달을 재고수불부로 (화면 [다시 보내기] 와 같은 길)
  if (e && e.parameter && e.parameter.push) {
    var outA;
    try { outA = JSON.stringify(apiCloseRepush(String(e.parameter.push)), null, 1); }
    catch (errA) { outA = '보내다 멈췄습니다 — ' + errA; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8"><pre style="font:13px Consolas;white-space:pre-wrap">'
      + String(outA).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>');
  }
  // ?fix=1 — 시트 칸·날짜·ym 복구
  if (e && e.parameter && e.parameter.fix) {
    var r;
    try { r = repairAll(); } catch (err2) { r = '복구가 터졌습니다 — ' + err2; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8"><pre>' + String(r) + '</pre>');
  }
  var t = HtmlService.createTemplateFromFile('App');
  t.ym = (e && e.parameter && e.parameter.ym) || defaultYm_();
  t.tab = (e && e.parameter && e.parameter.tab) || '';
  // 첫 데이터를 페이지에 심는다 — 화면이 뜨는 순간 이미 그릴 것이 있다.
  // 실패해도 화면은 돈다 (그때는 예전처럼 apiBoot 를 부른다).
  try { t.boot = JSON.stringify(apiBoot(t.ym)).replace(/<\//g, '<\\/'); } catch (err) { t.boot = 'null'; }
  // 월마감 장부도 캐시가 더우면 심는다 — 탭을 누르는 순간 왕복 없이 그린다. 차가우면 여기서 계산하지 않는다(첫 화면이 늦어진다).
  // 첫 화면이 «입고 건» 이면 심지 않는다 — 수백 KB 가 iframe 파싱을 늘린다. 화면이 다 그려진 뒤 조용히 받는다(App.html prefetch).
  // «더운가» 는 조각 수 키만 본다 — 예전엔 큰 값 두 개를 꺼내 JSON.parse 한 뒤 apiLedger 가 또 꺼냈다.
  t.ledger = 'null';
  try {
    if ((t.tab === 'close' || t.tab === '') && cacheHas_(['close:' + t.ym, 'stock:' + t.ym]))   // R007: 첫 탭 = 입고대장
      t.ledger = JSON.stringify(apiLedger(t.ym, 1)).replace(/<\//g, '<\\/');
  } catch (errL) { t.ledger = 'null'; }
  t.srv = Date.now() - tG;
  return t.evaluate()
    .setTitle('입고 마감')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}

function include(f) { return HtmlService.createHtmlOutputFromFile(f).getContent(); }

/** 처음 여는 달 = 마감할 달. 지난달이 아직 확정 전이면 지난달, 확정됐으면 이번 달.
 *  (10월에 열면 9월 — 이번 달로 열렸을 때 9월 파일을 8월·10월에 잘못 올리는 일이 났다) */
function defaultYm_() {
  var now = new Date();
  var cur = Utilities.formatDate(now, 'Asia/Seoul', 'yyyy-MM');
  var prev = Utilities.formatDate(new Date(now.getFullYear(), now.getMonth() - 1, 1), 'Asia/Seoul', 'yyyy-MM');
  try { return (closeState_(prev) || preClosed_(prev)) ? cur : prev; } catch (e) { return prev; }
}
function k_(item, cc, size) { return item + '|' + cc + '|' + size; }
/** 품번 앞 2자리 = 브랜드. 담당은 본부가 아니라 브랜드로 갈린다 */
function br_(item) { return String(item || '').trim().slice(0, 2).toUpperCase(); }
var BR_DEPT = { HR: 'A본부', OD: 'C본부', UV: 'C본부', OH: 'C본부', EL: 'C본부', OA: 'C본부',
                GL: 'B본부', SN: 'B본부', UO: '운영', PR: 'A본부' };
function deptOfBr_(b) { return BR_DEPT[b] || ''; }
/** 브랜드별 빈 칸 */
function brCell_() { return { sku: 0, plan: 0, act: 0, diff: 0, amt: 0, need: 0 }; }

/** 화면 진입 — 역할·월 목록·건 목록.
 *  느린 건 전부 시트 읽기다. 계산해 둔 것은 캐시에서 꺼내 쓴다. */
function apiBoot(ym) {
  var t0 = Date.now();
  ym = ym || defaultYm_();
  var w = who_();                                  // 권한 시트 1회
  var hit = cacheGetBig_('boot:' + ym);
  if (hit) {
    hit.me = w; hit.cached = true; hit.months = monthsNow_(ym);   // 달 목록은 전역 캐시에서 — 새 달이 다른 달 화면에도 바로
    Logger.log('apiBoot ' + ym + ' — 캐시 · ' + (Date.now() - t0) + 'ms · ' + (hit.rows || []).length + '건');
    hit.canProd = can_('생산'); hit.canLogi = can_('물류'); hit.canFin = can_('재무');
    hit.myBrands = myBrands_();
    hit.ms = Date.now() - t0;
    return hit;
  }
  ensureAuthBrand_();                              // 권한 시트에 「브랜드」 칸 (한 번만)
  var tA = Date.now();
  var recs = rows_(SH.REC);
  var tB = Date.now();
  // 달 목록은 «검수 건이 있는 달» 만이 아니다 — ERP만 올려 둔 달도 골라야 한다.
  // (1~7월은 검수 건이 없어서, ERP을 다 올려 두고도 목록에 안 떴다)
  var yms = {};
  recs.forEach(function (r) { yms[String(r.ym)] = 1; });
  rows_(SH.RMETA).forEach(function (r) { if (r.ym) yms[ymOf_(r.ym)] = 1; });
  yms[ym] = 1;
  var t1 = Date.now();
  var rows = listRecv_(ym).map(slimRow_);
  var t2 = Date.now();
  var out = {
    ym: ym, months: Object.keys(yms).sort(),
    rows: rows,
    pending: (typeof CASE_ON_ === 'undefined' || CASE_ON_) ? lsPending_(ym) : [],   // 라인시트에 있는데 아직 건이 안 된 것 — 입고 검수 탭(CASE_ON_)을 끈 동안은 안 보이므로 라인시트(콜드 7초)를 안 읽는다
    reasons: REASONS,
    ls: lsMeta_(),
    brDept: BR_DEPT,
    dbUrl: dbUrl_()
  };
  out = pure_(out);                                // Date 가 섞이면 화면에서 null 이 된다
  cachePutBig_('boot:' + ym, out);                    // 사람마다 다른 값은 빼고 담는다
  out.me = w;
  out.canProd = can_('생산'); out.canLogi = can_('물류'); out.canFin = can_('재무');
  out.myBrands = myBrands_();
  out.ms = Date.now() - t0;
  Logger.log('apiBoot ' + ym + ' — who+캐시확인 ' + (tA - t0) + 'ms · 건시트 ' + (tB - tA)
    + 'ms · 건목록 ' + (t2 - t1) + 'ms · 나머지 ' + (Date.now() - t2)
    + 'ms · 전체 ' + out.ms + 'ms · ' + rows.length + '건');
  return out;
}

/** 목록 줄에서 화면이 안 쓰는 것(검산 이력·전표 목록)을 뺀다 — 건마다 수만 자라 목록 캐시가 한도를 넘었다 */
function slimRow_(row) { var o = {}; Object.keys(row || {}).forEach(function (k) { if (k !== 'checks' && k !== 'slips') o[k] = row[k]; }); return o; }

/** 권한 시트에 「브랜드」 칸이 없으면 붙인다. 캐시 미스일 때만 확인하므로 평소엔 비용이 없다. */
function ensureAuthBrand_() {
  if (cacheGet_('authbr')) return;
  try {
    var sh = sheet_(SH.AUTH);
    var n = Math.max(1, sh.getLastColumn());
    var head = sh.getRange(1, 1, 1, n).getValues()[0].map(function (x) { return String(x || '').trim(); });
    if (head.indexOf('브랜드') < 0) {
      sh.getRange(1, n + 1).setValue('브랜드').setFontWeight('bold').setBackground('#f1f3f0');
      delete _MEMO[SH.AUTH];
    }
    cachePut_('authbr', 1);
  } catch (e) {}
}

/** 10분마다 돌면서 이번 달·지난 달 캐시를 채워 둔다.
 *  사람이 여는 순간엔 이미 «맞는» 상태라 시트를 안 읽는다.
 *  데운 큰 값은 숨은 «_스냅샷» 시트에도 적는다(Store.gs snapPut_) — 캐시가 용량 때문에 비워져도 시트에서 1초 안에 읽는다.
 *  결과는 스크립트 속성 WARM_AT 에 남는다(?warm=status 로 본다). */
/** 계측 표본에 붙는 빌드 태그 — 배포마다 바꾼다(?warm=status 가 «이 빌드만» 중앙·p90 을 따로 보인다) */
var APP_BUILD = 's2-1026';
var WARM_BUDGET = 240000;   // 예열 한 번에 새로 계산을 시작하는 한도(4분) — GAS 6분 제한 안에서 끝나게
function warmCache() {
  // 스크립트 잠금은 표시를 세우는 순간만 쥔다 — 예열 계산(기간 보기 콜드 2~9분) 내내 쥐면 대금 저장·검수가 20초 잠금 대기로 죽었다(10/21)
  var lock = LockService.getScriptLock(), P = PropertiesService.getScriptProperties();

  try {
    if (Date.now() - (Number(P.getProperty('WARM_RUN')) || 0) < 7 * 60000) { Logger.log('warm — 다른 예열이 도는 중, 건너뜀'); return; }   // 7분 = 6분 제한에 죽어 표시가 남아도 다음 번엔 돈다
    P.setProperty('WARM_RUN', String(Date.now()));
  } finally { lock.releaseLock(); }
  var T0 = Date.now(), L = [];
  try {
    var now = new Date();
    var cur = Utilities.formatDate(now, 'Asia/Seoul', 'yyyy-MM');
    var prev = Utilities.formatDate(new Date(now.getFullYear(), now.getMonth() - 1, 1), 'Asia/Seoul', 'yyyy-MM');
    // 값이 있으면(캐시 → 없으면 스냅샷) 그대로, 없으면 계산. 그다음 스냅샷이 옛 버전키면 갈아 적는다.
    var one = function (key, make) {

      var t = Date.now(), v = cacheGetBig_(key), did = '더움';
      if (!v) { try { v = make(); did = '계산'; } catch (e) { L.push(key + ' 실패: ' + e); return; } }
      if (v && !snapFresh_(key)) { snapPut_(key, v); did += '+시트'; }
      L.push(key + ' ' + did + ' ' + (Date.now() - t) + 'ms');
    };
    [cur, prev].forEach(function (ym) {
      try {
        one('boot:' + ym, function () {
          _MEMO = {}; _SHEET = {};
          var recs = rows_(SH.REC);
          var yms = {}; recs.forEach(function (r) { yms[String(r.ym)] = 1; });
          rows_(SH.RMETA).forEach(function (r) { if (r.ym) yms[ymOf_(r.ym)] = 1; });
          yms[ym] = 1;
          var o = pure_({
            ym: ym, months: Object.keys(yms).sort(), rows: listRecv_(ym).map(slimRow_),
            pending: (typeof CASE_ON_ === 'undefined' || CASE_ON_) ? lsPending_(ym) : [],
            reasons: REASONS, ls: lsMeta_(), brDept: BR_DEPT, dbUrl: dbUrl_()
          });
          cachePutBig_('boot:' + ym, o);
          return o;
        });
        if (typeof CASE_ON_ === 'undefined' || CASE_ON_) one('det:' + ym, function () { var o = detMonth_(ym); cachePutBig_('det:' + ym, o); return o; });
        // 월마감도 같이 데운다 — 이게 없으면 탭을 누를 때마다 기다린다(apiClose·apiStock 이 스스로 캐시에 넣는다)
        one('close:' + ym, function () { apiClose(ym); return cacheGetBig0_('close:' + ym); });
        one('stock:' + ym, function () { apiStock(ym); return cacheGetBig0_('stock:' + ym); });
      } catch (e) { L.push(ym + ' 실패: ' + e); }
    });
    // 대금은 기간 보기(콜드 수십 초)보다 먼저 — 예산에 걸려도 대금 탭은 덥게
    try { one(payKey_(), function () { return payGet_(); }); } catch (e) { L.push('대금 실패: ' + e); }   // 스냅샷까지 — 캐시가 비워져도 대금 탭 콜드 8초를 피한다
    // 기간 보기 — 첫 화면 기본 기간(기준월 한 달). 라인시트 예정(lsplan)도 이때 데워진다
    try {
      var dy = defaultYm_(), p = dy.split('-'), to = dy + '-' + ('0' + new Date(+p[0], +p[1], 0).getDate()).slice(-2);
      one(paKey_(dy + '-01', to), function () { apiPlanActual(dy + '-01', to); return cacheGetBig0_(paKey_(dy + '-01', to)); });
      one(lsplanKey_(), function () { return paPlan_(); });
      // 최근 3개월 한 달씩 — 달 조각(pam:)이 이미 데워져 있어 한 달에 1초 안팎. 사람이 7·8월을 고르는 순간 캐시에 있다
      [0, 1, 2].forEach(function (k) {

      });
    } catch (e) { L.push('기간 보기 실패: ' + e); }

        one('stock:' + ym, function () { apiStock(ym); return cacheGetBig0_('stock:' + ym); });

  }
}

/* ── 가벼운 계측 — 화면이 왕복 시간(run 의 lap)을 모아 첫 화면이 끝난 뒤 한 번에 보낸다.

    RV[String(r['키'])] = { act: r['실수량'] === '' ? null : int_(r['실수량']), reasons: String(r['사유'] || '').split(';').filter(String) };
  });
  var keys = {};
  Object.keys(P).forEach(function (k) { keys[k] = 1; });
  Object.keys(W).forEach(function (k) { keys[k] = 1; });
  var rows = Object.keys(keys).sort().map(function (k) {
    var p = P[k] || { k: k, item: k.split('|')[0], cc: k.split('|')[1], color: '', size: k.split('|')[2], plan: 0, sheet: 0, cost: 0, name: '', barcode: '' };
    var w = W[k], rv = RV[k] || {};
    var act = (rv.act !== undefined && rv.act !== null) ? rv.act : (w ? w.confirm : p.plan);
    var rs = rv.reasons || [];
    var ga = rs.some(function (x) { return REASONS.a.indexOf(x) >= 0; });
    var gb = rs.some(function (x) { return REASONS.b.indexOf(x) >= 0; });
    return {
      k: k, item: p.item, cc: p.cc, color: p.color, size: p.size, name: p.name, cost: p.cost, barcode: p.barcode,
      plan: p.plan, sheet: p.sheet, wms: w ? w.confirm : null, act: act, diff: act - p.plan, amt: (act - p.plan) * p.cost,
      reasons: rs, kind: (ga && gb) ? '둘 다' : (ga ? '오부착' : (gb ? '실수량부족' : '')),
      src: (rv.act !== undefined && rv.act !== null) ? '확정' : (w ? 'WMS' : '예정'),
      slips: w ? Object.keys(w.slips) : []
    };
  });
  var sizes = {};
  rows.forEach(function (r) { sizes[r.size] = 1; });
  var order = ['FREE', 'XS', 'S', 'M', 'L', 'XL', 'XXL'];
  var sz = Object.keys(sizes).sort(function (a, b) {
    var na = /^\d+$/.test(a), nb = /^\d+$/.test(b);
    if (na && nb) return Number(a) - Number(b);
    if (na) return -1;
    if (nb) return 1;
    return order.indexOf(a) - order.indexOf(b);

  return { meta: meta, rows: rows, sizes: sz, summary: sum_(ym, id, meta, rows), reasons: REASONS };
}

function sum_(ym, id, meta, rows) {
  var tp = 0, ta = 0, tv = 0, tva = 0, need = 0, reQ = 0, reA = 0, shQ = 0, shA = 0, styles = {}, slips = {};
  var hasPlan = false, hasWms = false, B = {};
  rows.forEach(function (r) {
    tp += r.plan; ta += r.act; tv += r.plan * r.cost; tva += r.act * r.cost;
    styles[r.item] = 1;
    var bk = br_(r.item), bc = B[bk] || (B[bk] = brCell_());
    bc.sku++; bc.plan += r.plan; bc.act += r.act; bc.diff += r.diff; bc.amt += r.act * r.cost;
    if (r.diff && !r.reasons.length) bc.need++;
    r.slips.forEach(function (s) { slips[s] = 1; });
    if (r.plan) hasPlan = true;
    if (r.wms !== null) hasWms = true;
    if (!r.diff) return;
    if (!r.reasons.length) { need++; return; }
    if (r.kind === '오부착') { reQ += r.diff; reA += r.amt; }
    else if (r.kind === '실수량부족') { shQ += r.diff; shA += r.amt; }
    else { reQ += r.diff / 2; reA += r.amt / 2; shQ += r.diff / 2; shA += r.amt / 2; }
  });
  var D = rows.filter(function (r) { return r.diff; });
  var state = (!hasWms && !D.length) ? '예정만' : (!D.length ? '전량 입고' : (need ? ('사유 ' + need + '건 미선택') : '검수 완료'));
  if (String(meta['상태']) === '확인 완료') state = '확인 완료';
  return {
    ym: ym, id: id, '출고일': dOf_(meta['출고일']), '출고처': meta['출고처'], '입고처': meta['입고처'],
    styles: Object.keys(styles).sort(), sku: rows.length, plan: tp, act: ta, plan_amt: tv, act_amt: tva,
    diff: ta - tp, amt: tva - tv, re_q: Math.round(reQ), re_a: Math.round(reA), sh_q: Math.round(shQ), sh_a: Math.round(shA),
    need: need, state: state, has_plan: hasPlan, has_wms: hasWms, slips: Object.keys(slips).sort(),
    checks: chk_(meta['검산']), src: meta['출처'] || '',
    asked: String(meta['의뢰'] || ''), sheet: rows.reduce(function (t, r) { return t + (r.sheet || 0); }, 0),
    B: B, brands: Object.keys(B).sort()
  };
}

/** 생산 — 입고명세서 수량으로 맞춘다 (라인시트 값은 원수량에 그대로 남는다) */

  var lock = LockService.getScriptLock();

/* 입고 건 상세 달 묶음 — 캐시 'det:ym'(세대 b: 건·예정·WMS·확정을 쓰는 곳은 모두 bust_(ym,'recv'|없음)) + 예열 + 스냅샷.
 * 줄은 칸 배열로 싸서 크기를 절반으로. 검산 기록(건마다 수만 자)은 화면이 안 쓰므로 뺀다(slimRow_ 와 같은 이유). */
var DET_F = ['k', 'item', 'cc', 'color', 'size', 'name', 'cost', 'barcode', 'plan', 'sheet', 'wms', 'act', 'diff', 'amt', 'reasons', 'kind', 'src', 'slips'];
function detMonth_(ym) {
  var by = detIdx_(ym), all = {};
  Object.keys(by).forEach(function (id) {
    if (!by[id].meta) return;
    try {
      var d = pure_(detail_(ym, id)), m = {}, sm = {};

      all[id] = { m: m, s: sm, z: d.sizes, r: d.rows.map(function (r) { return DET_F.map(function (f) { return r[f]; }); }) };
    } catch (e) {}

}
function detUnpack_(p) {
  var sm = p.s || {};
  return { meta: p.m, summary: sm, sizes: p.z, reasons: REASONS,
    rows: (p.r || []).map(function (a) { var o = {}; DET_F.forEach(function (f, i) { o[f] = a[i]; }); return o; }) };
}

/** 파일 업로드 — kind: plan | pack | wms */
function apiUpload(ym, id, kind, name, b64, mime) {
  if (kind === 'wms' ? !can_('물류') : !can_('생산')) throw new Error((kind === 'wms' ? '물류' : '생산') + ' 담당자만 올릴 수 있습니다. (현재: ' + who_().role + ')');
  var sheets = readWorkbook_(b64, name, mime);
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    if (kind === 'wms') {
      var wr = parseWms_(sheets);
      if (!wr.length) throw new Error('WMS 입고검수 양식이 아닙니다 (STYLE·확정량 열 없음).');
      if (!id) {
        var dt = wr.map(function (x) { return x.date; }).filter(String).sort();
        id = (dt.length ? dt[0].replace(/-/g, '') : Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyyMMdd')) + '_WMS';
        ensureRec_(ym, id, { '출고일': dt.length ? dt[0] : '', '출고처': '', '입고처': '', '출처': 'WMS' });
      }
      var slips = {}; wr.forEach(function (x) { if (x.slip) slips[x.slip] = 1; });
      // 같은 전표 재업로드는 교체
      var keep = rows_(SH.WMS).filter(function (r) { return String(r.ym) === String(ym) && String(r.id) === String(id) && !slips[r['전표번호']]; });
      wipe_(SH.WMS, ym, id);
      append_(SH.WMS, keep);
      append_(SH.WMS, wr.map(function (x) {
        return { ym: ym, id: id, '품번': x.item, '컬러코드': x.cc, '사이즈': x.size, '지시량': x.order, '확정량': x.confirm, '바코드': x.barcode, '전표번호': x.slip, '등록일자': x.date };
      }));
      addCheck_(ym, id, { lv: 'ok', msg: 'WMS ' + name + ' — 전표 ' + Object.keys(slips).join(', ') + ' · 확정 ' + fmt_(wr.reduce(function (t, x) { return t + x.confirm; }, 0)) });
      bust_(ym, 'recv');
      log_('WMS업로드', id, name);
      return { id: id, kind: kind, rows: wr.length, slips: Object.keys(slips) };
    }
    // plan / pack
    var cr = parseCartons_(sheets), mx = parseMatrix_(sheets);
    if (!cr.rows.length && !Object.keys(mx.plan).length) throw new Error('출고현황표/입고명세서 양식이 아닙니다.');
    if (!id) {
      var d0 = dOf_(mx.meta['출고일'] || new Date());
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d0)) d0 = Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd');
      id = d0.replace(/-/g, '') + '_' + String(mx.meta['출고처'] || '미지정').replace(/[^\w가-힣]/g, '').slice(0, 12);
      var base = id, kk = 2;
      while (hasRec_(ym, id)) { id = base + '_' + (kk++); }
      ensureRec_(ym, id, { '출고일': d0, '출고처': mx.meta['출고처'] || '', '입고처': mx.meta['입고처'] || '', '출처': kind === 'plan' ? '출고현황표' : '입고명세서' });
    }
    var planRows = buildPlan_(cr, mx);
    var exist = rows_(SH.PLAN).filter(function (r) { return String(r.ym) === String(ym) && String(r.id) === String(id); });
    var checks = cr.checks.slice();
    if (kind === 'pack' && exist.length) {
      var pt = exist.reduce(function (t, r) { return t + int_(r['수량']); }, 0);
      var nt = planRows.reduce(function (t, r) { return t + r.qty; }, 0);
      checks.push({ lv: pt === nt ? 'ok' : 'bad', msg: '입고명세서 합 ' + fmt_(nt) + ' vs 출고현황표 예정 ' + fmt_(pt) + (pt === nt ? ' ✔' : ' (' + (nt - pt > 0 ? '+' : '') + (nt - pt) + ')') });
      // 바코드만 보강
      var bc = {}; planRows.forEach(function (p) { if (p.barcode) bc[k_(p.item, p.cc, p.size)] = p.barcode; });
      wipe_(SH.PLAN, ym, id);
      append_(SH.PLAN, exist.map(function (r) {
        if (!r['바코드'] && bc[k_(r['품번'], r['컬러코드'], String(r['사이즈']))]) r['바코드'] = bc[k_(r['품번'], r['컬러코드'], String(r['사이즈']))];
        return r;
      }));
    } else {
      if (Object.keys(mx.plan).length && cr.rows.length) {
        var mt = 0; Object.keys(mx.plan).forEach(function (k) { mt += mx.plan[k]; });
        var ct = cr.rows.reduce(function (t, x) { return t + x.qty; }, 0);
        checks.push(mt === ct ? { lv: 'ok', msg: '매트릭스 합 = 카톤행 합 = ' + fmt_(ct) + ' ✔' } : { lv: 'bad', msg: '매트릭스 합 ' + fmt_(mt) + ' ≠ 카톤행 합 ' + fmt_(ct) });
      }
      wipe_(SH.PLAN, ym, id);
      append_(SH.PLAN, planRows.map(function (p) {
        return { ym: ym, id: id, '품번': p.item, '컬러코드': p.cc, '컬러': p.color, '사이즈': p.size, '수량': p.qty, '원가': p.cost, '품명': p.name, '바코드': p.barcode };
      }));
    }
    addCheck_(ym, id, checks, name);
    bust_(ym, 'recv');
    log_(kind === 'plan' ? '출고현황표업로드' : '입고명세서업로드', id, name);
    return { id: id, kind: kind, sku: planRows.length, plan: planRows.reduce(function (t, p) { return t + p.qty; }, 0), checks: checks };
  } finally { lock.releaseLock(); }
}

function buildPlan_(cr, mx) {
  var out = [];
  if (cr.rows.length) {
    var agg = {}, bcode = {}, colname = {};
    cr.rows.forEach(function (x) {
      var k = k_(x.item, x.cc, x.size);
      agg[k] = (agg[k] || 0) + x.qty;
      if (x.barcode && !bcode[k]) bcode[k] = x.barcode;
      if (x.color && !colname[x.item + '|' + x.cc]) colname[x.item + '|' + x.cc] = x.color;
    });
    // 매트릭스 컬러명 ↔ 카톤 컬러코드: 품번별 사이즈 벡터가 같은 것끼리
    var byCart = {}, byMat = {};
    Object.keys(agg).forEach(function (k) { var p = k.split('|'); (byCart[p[0]] = byCart[p[0]] || {})[p[1]] = (byCart[p[0]][p[1]] || {}); byCart[p[0]][p[1]][p[2]] = agg[k]; });
    Object.keys(mx.plan).forEach(function (k) { var p = k.split(''); (byMat[p[0]] = byMat[p[0]] || {})[p[1]] = (byMat[p[0]][p[1]] || {}); byMat[p[0]][p[1]][p[2]] = mx.plan[k]; });
    Object.keys(byMat).forEach(function (item) {
      Object.keys(byMat[item]).forEach(function (colr) {
        var vec = JSON.stringify(byMat[item][colr]);
        var hit = Object.keys(byCart[item] || {}).filter(function (cc) { return JSON.stringify(byCart[item][cc]) === vec; });
        var cc = hit.length === 1 ? hit[0] : colcode_(colr);
        colname[item + '|' + cc] = colr;
      });
    });
    Object.keys(agg).sort().forEach(function (k) {
      var p = k.split('|'), it = mx.items[p[0]] || {};
      out.push({ item: p[0], cc: p[1], color: colname[p[0] + '|' + p[1]] || '', size: p[2], qty: agg[k], cost: it.cost || 0, name: it.name || '', barcode: bcode[k] || '' });
    });
  } else {
    Object.keys(mx.plan).sort().forEach(function (k) {
      var p = k.split(''), it = mx.items[p[0]] || {};
      out.push({ item: p[0], cc: colcode_(p[1]), color: p[1], size: p[2], qty: mx.plan[k], cost: it.cost || 0, name: it.name || '', barcode: '' });
    });
  }
  return out;
}

function hasRec_(ym, id) {
  var f = false;
  rows_(SH.REC).forEach(function (r) { if (String(r.ym) === String(ym) && String(r.id) === String(id)) f = true; });

/** 45,000자에 닿으면 글자 중간에서 자르지 않는다 —
 *  잘린 JSON 은 다음에 읽을 때 통째로 버려져, 쌓아둔 검산 수백 건이 소리 없이 사라졌다.
 *  오래된 기록부터 통째로 덜어낸다. */
function trimChecks_(arr) {
  var a = (arr || []).slice(), s = JSON.stringify(a);
  while (s.length > 45000 && a.length > 1) { a.shift(); s = JSON.stringify(a); }
  return s.length > 45000 ? JSON.stringify(a.slice(-1)) : s;
}

function addCheck_(ym, id, checks, fileName) {

      var cur = [];
      try { cur = JSON.parse(vals[i][9] || '[]'); } catch (e) {}
      sh.getRange(i + 2, 10).setValue(trimChecks_(cur.concat(arr)));
      return;
    }
  }
}

/** 라인시트 원본 → 파싱 → DB «라인시트» 시트에 적재 (30초쯤). 버튼으로만 돈다. */
function lsRebuild_() {
  var t0 = new Date().getTime();
  var ss = SpreadsheetApp.openById(LS_SHEET_ID);
  var out = [];
  ss.getSheets().forEach(function (sh) {
    var tab = sh.getName();

    var n = sh.getLastRow(), c = sh.getLastColumn();
    if (!n || !c) return;
    out = out.concat(lsParseTab_(tab, sh.getRange(1, 1, n, c).getValues()));
  });
  replaceAll_(SH.LS, out);
  cacheDrop_([lsplanKey_() + '#n']);   // 기간 보기 예정(PlanActual.gs)도 새로 읽게 (새 LS_META.at 로 키도 바뀐다)
  var tabs = {};
  out.forEach(function (r) { tabs[r.tab] = (tabs[r.tab] || 0) + 1; });
  PropertiesService.getScriptProperties().setProperty(LS_META, JSON.stringify({
    n: out.length, at: Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm'),
    ms: new Date().getTime() - t0, tabs: tabs
  }));
  log_('라인시트적재', '', out.length + '행');

function lsParseTab_(tab, values) {

  var out = [];

      if (!ok) continue;
      if (minSizes) { var cnt = 0; R[i].forEach(function (c) { if (SIZE_RE.test(c || '-')) cnt++; }); if (cnt < minSizes) continue; }

    var cbc = col_(h, '바코드'), cdue = col_(h, ['협력사', '예정']), cse = col_(h, 'season', '시즌');

          release: (crel >= 0 ? r[crel] : '').replace(/\n/g, ' '), style: st, name: cnm >= 0 ? r[cnm] : '',
          color: colr.replace(/\n/g, ' '), cc: colcode_(colr), size: p[0], qty: p[1],
          barcode: bcs[idx] || '', cost: cost, due: cdue >= 0 ? excelDate_(r[cdue]) : '',
          season: cse >= 0 ? String(r[cse]).toUpperCase() : '', sheet_in: got[p[0]] || 0
        });

    var h2 = R[hiB], SR = hiB > 0 ? R[hiB - 1] : [];
    var cst2 = col_(h2, '품번'), cnm2 = col_(h2, '상품명'), ccol2 = col_(h2, '컬러명'), ccc = col_(h2, '컬러코드');
    var cf2 = col_(h2, '생산처'), crel2 = col_(h2, '발매일'), cpo2 = col_(h2, '차수'), cdue2 = col_(h2, '실납기', ['목표', '납기']);
    var ccost2 = col_(h2, ['확정원가', 'vat-'], ['확정원가', '미포함'], ['사입가', 'vat-'], ['원가', 'vat-']);
    var cbc2 = col_(h2, 'upc', '바코드');

    for (var k2 = hiB + 1; k2 < R.length; k2++) {

      var cc2 = (ccc >= 0 && r2[ccc]) ? String(r2[ccc]).toUpperCase() : colcode_(ccol2 >= 0 ? r2[ccol2] : '');
      var cost2 = ccost2 >= 0 ? int_(r2[ccost2]) : 0;
      sizes2.forEach(function (sz) {

          season: season_tab, sheet_in: 0

  } else if (hiC >= 0) {

    var cst3 = col_(h3, '스타일넘버'), cnm3 = col_(h3, '스타일명'), cf3 = col_(h3, '업체명'), ccol3 = -1;
    for (var i3 = 0; i3 < h3.length; i3++) { if (nz_(h3[i3]) === '컬러') { ccol3 = i3; break; } }
    var cpo3 = col_(h3, '차수'), cdue3 = col_(h3, ['기획', '납기']), crel3 = col_(h3, ['출고', '일자']), cse3 = col_(h3, '시즌');
    var runs3 = sizeRuns_(SR3, 0), sizes3 = runs3.length ? runs3[0] : [];
    for (var k3 = hiC + 2; k3 < R.length; k3++) {
      var r3 = R[k3], st3 = r3[cst3] || '';
      if (!ITEM_RE.test(st3)) continue;

          color: colr3, cc: colcode_(colr3), size: sz[1], qty: q, barcode: '', cost: 0,

        });

  } else if (hiD >= 0) {

    var cst4 = col_(h4, '샘플기업자체품번'), cnm4 = col_(h4, '상품명'), ccol4 = col_(h4, '컬러명'), ccc4 = col_(h4, '컬러코드1', '컬러코드');
    var cq4 = col_(h4, ['수량', 'ttl'], '수량'), cf4 = col_(h4, '생산처'), cdue4 = col_(h4, '납기'), cse4 = col_(h4, '시즌');
    var ccost4 = col_(h4, ['원가', '-']), ccost4b = col_(h4, ['사입가', '-']);
    for (var k4 = hiD + 1; k4 < R.length; k4++) {
      var r4 = R[k4], st4 = r4[cst4] || '';

      if (!q4) continue;

function excelDate_(v) {
  var t = s_(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  if (/^\d{5}(\.0+)?$/.test(t)) {
    var d = new Date(Date.UTC(1899, 11, 30) + parseInt(t, 10) * 86400000);
    return Utilities.formatDate(d, 'Asia/Seoul', 'yyyy-MM-dd');
  }
  return '';
}

function nvend_(t) { return s_(t).replace(/\(주\)|주식회사|㈜|\s+/g, '').toLowerCase(); }
/** key 에 들어가는 날짜는 반드시 yyyy-MM-dd 로 편다.
 *  Date 객체 · «Wed Sep 30 2026 …» · «2026-09-30T00:00:00.000Z» 가 모두 같은 글자가 되어야
 *  목록에서 만든 key 와 확정할 때 만든 key 가 맞아떨어진다. */
function keyDate_(v) {
  // dOf_ 하나만 쓴다 — 예전엔 여기만 «2026/9/30» 을 못 펴서,
  // 이미 건이 된 차수가 예정 목록에 다시 떠 입고가 두 번 잡혔다.
  var d = dOf_(v);
  return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d
       : String(v === null || v === undefined ? '' : v).trim();
}

function gkey_(r) { return [r.factory, r.brand, r.po, keyDate_(r.release)].join('|'); }

/** 이미 저장된 옛 key 도 같은 모양으로 편다 (건 시트의 «차수» 칸) */
function keyNorm_(k) {
  var p = String(k === null || k === undefined ? '' : k).split('|');
  if (p.length < 4) return String(k || '');
  p[3] = keyDate_(p.slice(3).join('|'));
  return p.slice(0, 4).join('|');
}

function relDate_(release, ym) {
  var t = s_(release);
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  var m = t.match(/(\d{1,2})\/(\d{1,2})/);
  if (m) return ym.slice(0, 4) + '-' + ('0' + m[1]).slice(-2) + '-' + ('0' + m[2]).slice(-2);
  return '';
}

/** 이 달 모든 건의 확정 실입고를 출고처별·SKU별로 한 번에 집계 (시트는 3번만 읽는다) */
var _RECVALL = {};

function receivedAll_(ym) {
  // 시트 네 개를 통째로 훑는다 — 한 실행에서 두 번 할 일이 아니다
  if (_RECVALL[ym]) return _RECVALL[ym];
  var hit = cacheGetBig_('recvall:' + ym);
  if (hit) return (_RECVALL[ym] = hit);
  var P = {}, W = {}, RV = {}, recOf = {}, out = {};
  rows_(SH.REC).forEach(function (r) { if (String(r.ym) === String(ym)) recOf[String(r.id)] = nvend_(r['출고처']); });
  rows_(SH.PLAN).forEach(function (r) {
    if (String(r.ym) !== String(ym) || !recOf.hasOwnProperty(String(r.id))) return;
    var k = String(r.id) + '\u0001' + k_(r['품번'], r['컬러코드'], String(r['사이즈']));
    P[k] = (P[k] || 0) + int_(r['수량']);
  });
  rows_(SH.WMS).forEach(function (r) {
    if (String(r.ym) !== String(ym) || !recOf.hasOwnProperty(String(r.id))) return;
    var k = String(r.id) + '\u0001' + k_(r['품번'], r['컬러코드'], String(r['사이즈']));
    W[k] = (W[k] || 0) + int_(r['확정량']);
  });
  rows_(SH.REV).forEach(function (r) {
    if (String(r.ym) !== String(ym) || !recOf.hasOwnProperty(String(r.id))) return;
    if (r['실수량'] === '' || r['실수량'] === null) return;
    RV[String(r.id) + '\u0001' + String(r['키'])] = int_(r['실수량']);
  });
  var keys = {};
  Object.keys(P).forEach(function (k) { keys[k] = 1; });
  Object.keys(W).forEach(function (k) { keys[k] = 1; });
  Object.keys(RV).forEach(function (k) { keys[k] = 1; });
  Object.keys(keys).forEach(function (k) {
    var p = k.split('\u0001'), id = p[0], sku = p[1], v = recOf[id];
    if (v === undefined) return;
    var act = RV.hasOwnProperty(k) ? RV[k] : (W.hasOwnProperty(k) ? W[k] : (P[k] || 0));
    var o = out[v] || (out[v] = {});
    o[sku] = (o[sku] || 0) + act;
  });
  cachePutBig_('recvall:' + ym, out);
  return (_RECVALL[ym] = out);
}

/** 그 달 입고예정인데 아직 건이 안 만들어진 차수 — 화면에 «예정» 으로 떠야 한다.
 *  사람이 버튼을 눌러 만드는 게 아니라, 라인시트에 있으면 이미 보이는 것이 맞다. */
function lsPending_(ym) {

function nvend2_(t) { return String(t === null || t === undefined ? '' : t).replace(/\(주\)|주식회사|㈜|\s+/g, '').toLowerCase(); }

  // 넘어오는 줄은 «신고» 단위다 — 묶음은 x['묶음'] 배열 안에 있고 꼭대기엔 .grp 가 없다.
  // 이걸 x.grp 로 읽어 전부 빈 글자가 되는 바람에 «» 오류로 죽었다.
  var gsB = [];
  (sel || []).forEach(function (x) {
    if (typeof x === 'string') { if (x) gsB.push(x); return; }
    if (x && x.grp) { gsB.push(String(x.grp)); return; }
    ((x && x['묶음']) || []).forEach(function (g) {
      var n = (typeof g === 'string') ? g : String((g && g.grp) || '');
      if (n) gsB.push(n);
    });
  });
  var badB = grpGuard_(ym, gsB);
  if (badB) throw new Error(badB);
  var r = blApply_(ym, sel, withFx !== false);
  bust_(ym, 'cost');            // 환율을 붙여 놓고 캐시된 옛 값을 돌려주던 자리
  r.close = (typeof withStock_ === 'function' ? withStock_(ym) : apiClose(ym));
  return r;
}

/** 이 달 마감 입력을 비운다 (검수 건은 건드리지 않는다) */
/* ───────────────────────────────── 월마감 확정
 * 확정 = «이 달 숫자는 이제 안 바뀐다». 그때 비로소 재고수불부로 내보낸다. */

function closeStateKey_(ym) { return 'CLOSE_' + ym; }

function closeState_(ym) {
  try {
    var v = PropertiesService.getScriptProperties().getProperty(closeStateKey_(ym));
    return v ? JSON.parse(v) : null;
  } catch (e) { return null; }
}

/** 10월~ 업로드 = 그 브랜드·그 달 마감 — «확정» 없이 올린 달이면 전송·전표를 연다.
 *  CLOSE_ 상태는 만들지 않는다(만들면 frozen_ 이 다시 올리기를 막는다). 수불부 전송 결과는 BRPUSH_ 에 따로 */
function preClosed_(ym) { ym = ymOf_(ym); return ym >= BASE_PRE_FROM && rparts_(ym).length > 0; }
function prePush_(ym) {
  try { var v = PropertiesService.getScriptProperties().getProperty('BRPUSH_' + ymOf_(ym)); return v ? JSON.parse(v) : null; }
  catch (e) { return null; }
}

/** 확정하기 전에 막는 것들 — 여기서 걸리면 숫자가 아직 덜 찼다는 뜻 */
function closeBlockers_(ym) {
  var C = closeCompute_(ym);
  if (!C) return ['이 달 ERP 입고현황이 아직 없습니다 — «ERP» 단계에서 ERP «입고현황» 엑셀을 먼저 올려 주세요'];
  var out = [];
  (C.checks || []).forEach(function (c) {
    if (!c.ok) out.push(c.id + ' ' + (c.name || '').split(':')[0] + ' — ' + (c.detail || ''));
  });
  return out;
}

/** 확정 / 해제. 확정하면 곧바로 Baserow 로 보낸다. */
function apiCloseConfirm(ym, on, skipPush) {
  if (!can_('재무')) throw new Error('«확정» 단계의 확정·확정 해제는 재무 담당자만 할 수 있습니다. ' + '재무 담당자에게 부탁하세요. (지금 내 권한: ' + who_().role + ')');
  var P = PropertiesService.getScriptProperties();
  if (!on) {
    P.deleteProperty(closeStateKey_(ym));
    bust_(ym, 'cost');   // 확정 상태만 바뀐다 — 검수·작은 시트 캐시는 그대로
    log_('마감해제', ym, '', ym);
    return pure_({ ok: true, state: null });
  }
  var block = closeBlockers_(ym);
  if (block.length)
    throw new Error('아직 확정할 수 없습니다. 아래를 먼저 고치고 «확정» 단계에서 다시 누르세요 —\n· '
      + block.join('\n· '));
  var st = { ym: ym, at: Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm'),
             by: who_().email, push: null };
  // 확정된 숫자만 내보낸다. skipPush 면 확정만 하고 전송은 나중에 [다시 보내기] 로.
  if (skipPush) {
    st.push = { ok: false, skipped: true, error: '확정만 하고 재고수불부 전송은 미뤘습니다 — «확정» 단계에서 «다시 보내기» 를 누르면 보냅니다' };
  } else {
    try { st.push = brPushMonth(ym); }
    catch (e) { st.push = { ok: false, error: String(e && e.message || e) }; }
  }
  P.setProperty(closeStateKey_(ym), JSON.stringify(st));
  bust_(ym, 'cost');   // 확정 상태만 바뀐다 — 검수·작은 시트 캐시는 그대로
  log_('마감확정', ym, (st.push && st.push.ok) ? (st.push.sent + '행 전송') : ('전송 실패: ' + (st.push && st.push.error)), ym);
  return pure_({ ok: true, state: st });
}

/** 확정된 달을 다시 보낸다 (전송만 실패했을 때) */
function apiCloseRepush(ym) {
  if (!can_('재무')) throw new Error('재고수불부로 보내는 것은 재무 담당자만 할 수 있습니다. ' + '재무 담당자에게 부탁하세요. (지금 내 권한: ' + who_().role + ')');
  var st = closeState_(ym);
  if (!st && preClosed_(ym)) {
    var ps = { ym: ymOf_(ym), at: Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm'), by: who_().email, push: brPushMonth(ym) };
    PropertiesService.getScriptProperties().setProperty('BRPUSH_' + ymOf_(ym), JSON.stringify(ps));
    log_('수불부전송', ym, ps.push.sent + '행', ym);
    bust_(ym, 'cost');
    return pure_({ ok: true, state: null, pushed: ps });
  }
  if (!st) throw new Error('아직 확정하지 않은 달이라 보낼 것이 없습니다 — «확정» 단계에서 «이 달 마감 확정» 을 먼저 누르세요. (확정된 숫자만 재고수불부로 나갑니다)');
  st.push = brPushMonth(ym);
  PropertiesService.getScriptProperties().setProperty(closeStateKey_(ym), JSON.stringify(st));
  log_('재전송', ym, st.push.sent + '행', ym);
  bust_(ym, 'cost');   // 전송 결과가 장부 캐시에 들어 있다
  return pure_({ ok: true, state: st });
}

function apiCloseReset(ym) {
  // 잠금 — 6시트를 읽고 쓰는 길에 잠금이 없어 다른 달 업로드가 끼면 옛 줄과 새 줄이 섞였다(QA D1)

}

/** 인증키 시험 — 관세청에 실제로 한 번씩 찔러본다. 키 값은 돌려주지 않는다 (글자 수만) */

/** 본부별 진행 — 누가 어디까지 올렸나. 브랜드(품번 앞 2자리)를 본부로 묶는다 */
function deptProgress_(ym, lines) {
  var MAP = deptMap_(), parts = rparts_(ym);
  var loaded = {};                       // 브랜드 → {n, qty, amt, imp}
  lines.forEach(function (l) {
    var b = brandOf_(l.item);
    var e = loaded[b] || (loaded[b] = { n: 0, qty: 0, amt: 0, imp: 0 });
    e.n++; e.qty += l.qty; e.amt += l.amt_ipgo;
    if (l.buy === '수입') e.imp++;
  });
  var meta = {};                         // 브랜드 → 올린 사람·시각·파일
  parts.forEach(function (p) {
    String(p.brand || '').split('+').filter(String).forEach(function (b) {
      meta[b] = { who: p.who, at: p.at, file: p.file, key: p.brand };
    });
  });
  // 매핑에 있는 브랜드 + 실제로 들어온 브랜드 전부
  var all = {};
  Object.keys(MAP).forEach(function (b) { all[b] = 1; });
  Object.keys(loaded).forEach(function (b) { all[b] = 1; });

  var byDept = {};
  Object.keys(all).sort().forEach(function (b) {
    var dept = (MAP[b] && MAP[b].dept) || '(미지정)';
    var d = byDept[dept] || (byDept[dept] = { dept: dept, brands: [], n: 0, qty: 0, amt: 0, imp: 0, done: 0, wait: 0 });
    var e = loaded[b] || { n: 0, qty: 0, amt: 0, imp: 0 };
    var on = !!meta[b];
    // 그 달에 입고가 한 줄도 없는 브랜드는 «대기» 가 아니다 — 올릴 줄이 없는데 기다리면
    // ③ 이 영영 안 끝난다. (7월엔 UV 입고가 없는데 UV 가 C본부에 등록돼 있어 그랬다)
    var none = !on && !e.n;
    d.brands.push({ brand: b, on: on, none: none, n: e.n, qty: e.qty, amt: e.amt, imp: e.imp,
                    who: on ? meta[b].who : '', at: on ? meta[b].at : '',
                    file: on ? meta[b].file : '', key: on ? meta[b].key : '' });
    d.n += e.n; d.qty += e.qty; d.amt += e.amt; d.imp += e.imp;
    if (none) d.none = (d.none || 0) + 1;
    else if (on) d.done++; else d.wait++;
  });
  return Object.keys(byDept).sort().map(function (k) { return byDept[k]; });
}

/** 5단계 상태 — 레일이 이걸 그대로 그린다 */
function stepState_(ym, base, C) {
  var dep = base.depts || [], on = 0, tot = 0;
  dep.forEach(function (d) { on += d.done; tot += d.done + d.wait; });
  var uni = (base.options && base.options.uni_n) || Object.keys(unipassOf_(ym)).length;
  var cards = base.cards || [];
  var bl = cards.filter(function (c) { return c.bl; }).length;
  var costs = base.costs || [];
  var s = base.summary;
  var v4 = null;
  (base.checks || []).forEach(function (c) { if (c.id === 'V4') v4 = c; });
  var left = (v4 && !v4.ok ? 1 : 0) + (base.state === '확정' ? 0 : 1);
  return [
    { no: 1, name: 'ERP 입고현황', ok: tot > 0 && on === tot, bad: on === 0,
      badge: tot ? (on + '/' + tot) : '', note: C ? (fmt_(C.lines.length) + '행 · ' + fmt_(s.amt_ipgo) + '원') : '아직 없음' },
    { no: 2, name: '유니패스 실적', ok: uni > 0, bad: uni === 0 && !!(C && s.unres_n),
      badge: uni ? String(uni) : '', note: uni ? (uni + '건') : '없음 — 수입 건 기준금액이 확정되지 않습니다' },
    { no: 3, name: 'B/L 연결', ok: cards.length > 0 && bl === cards.length, bad: !!(C && s.unres_n),
      badge: cards.length ? (bl + '/' + cards.length) : '', note: cards.length ? (bl + '/' + cards.length + ' 묶음') : '수입 묶음 없음' },
    { no: 4, name: '부대비용', ok: costs.length > 0, bad: false,
      badge: costs.length ? String(costs.length) : '', note: C ? (costs.length + '건 · 재고반영 ' + fmt_(s.oh_inv)) : '' },
    { no: 5, name: '확정', ok: left === 0, bad: left > 0,
      badge: left ? String(left) : '', note: C ? ('취득원가 ' + fmt_(s.landed)
        + (base.closed ? (' · ' + base.closed.at + ' 확정'
            + (base.closed.push && base.closed.push.ok ? (' · 수불부 ' + base.closed.push.sent + '행') : ' · 전송 실패')) : '')) : '' }
  ];
}

/** 변경 이력 — 그 작업이 숫자를 얼마나 바꿨는지 */
function history_(ym, n) {
  // 로그는 계속 쌓인다 — 끝 600줄만 읽는다(통째로 읽으면 로그가 늘수록 장부가 느려졌다)
  var head = HEAD[SH.LOG], out = [], recs;
  if (_MEMO[SH.LOG]) recs = _MEMO[SH.LOG];
  else {
    try {
      var sh = sheet_(SH.LOG), last = sh.getLastRow();
      if (last < 2) return out;
      var from = Math.max(2, last - 599);
      recs = sh.getRange(from, 1, last - from + 1, head.length).getValues().map(function (v) {
        var o = {}; head.forEach(function (h, k) { o[h] = v[k]; }); return o; });
    } catch (eL) { recs = rows_(SH.LOG); }
  }
  recs.forEach(function (r) {
    if (String(ymOf_(r.ym) || '') !== String(ym)) return;
    var t = r['시각'];
    out.push({
      at: (t instanceof Date) ? Utilities.formatDate(t, 'Asia/Seoul', 'MM-dd HH:mm') : String(t || ''),
      ts: (t instanceof Date) ? t.getTime() : 0,
      who: String(r['이메일'] || '').split('@')[0],
      act: String(r['동작'] || ''), target: String(r['대상'] || ''),
      note: String(r['비고'] || ''), delta: String(r['변화'] || '')
    });
  });
  out.sort(function (a, b) { return b.ts - a.ts; });
  return out.slice(0, n || 20);
}

/** 입고현황 점검 — 달별 본문 줄 수 ↔ 메타 행수, Date 로 굳은 ym, 중간 빈 줄, 흩어진 덩어리 수 (QA D1 F11) */
function rcptAudit_() {
  var sh = sheet_(SH.RCPT), n = sh.getLastRow();
  var cnt = {}, runs = {}, dates = 0, blanks = 0, last = null;
  if (n >= 2) sh.getRange(2, 1, n - 1, 1).getValues().forEach(function (r) {
    var v = r[0]; if (v instanceof Date) dates++;
    var y = ymOf_(v);
    if (!y) { blanks++; last = null; return; }
    cnt[y] = (cnt[y] || 0) + 1;
    if (y !== last) { runs[y] = (runs[y] || 0) + 1; last = y; }
  });
  var meta = {};
  rowsRead_(SH.RMETA).forEach(function (m) { var y = ymOf_(m.ym); meta[y] = (meta[y] || 0) + Number(m['행수'] || 0); });
  var seen = {}, mismatch = [];
  Object.keys(cnt).concat(Object.keys(meta)).forEach(function (y) {
    if (seen[y]) return; seen[y] = 1;
    if ((cnt[y] || 0) !== (meta[y] || 0)) mismatch.push({ ym: y, body: cnt[y] || 0, meta: meta[y] || 0 });
  });
  return { ok: !mismatch.length && !dates && !blanks, mismatch: mismatch, dates: dates, blanks: blanks, runs: runs };
}


// ───── StockApi.gs
/**
 * 재고수불부 「수」 — 입고란.
 *
 * 수불부에 우리가 채우는 칸은 «입고 수량·단가·금액» 셋뿐이다.
 * 기초는 전월 기말이 넘어오고, 출고는 WMS 가 채운다.
 *
 * 값은 brRowsOf_ 하나에서만 나온다 — Baserow 로 보내는 것과 같은 함수다.
 * 화면이 따로 계산하기 시작하면 장부와 조용히 갈라진다.
 */

/** 한 달치를 화면이 접기 좋은 모양으로 — 품번 집계 + 입고건.
 *  입고건은 «입고일 × 입고처 × 묶음» 으로 접는다. 컬러까지 펴면 한 달 900줄이라 화면이 못 버틴다. */
function stockOf_(ym) {
  var t0 = Date.now();
  var C = closeCompute_(ym);
  if (!C) throw new Error(ym + ' 의 ERP 입고현황이 아직 없습니다 — 수불부는 입고가 있어야 만들어집니다. '
    + '월마감 ③ ERP 입고현황 올리기 에서 ERP «입고현황» 엑셀을 먼저 올려 주세요.');
  var rs = brRowsOf_(ym, C);             // 같은 C 로 만든다 — 장부와 근거가 갈라지지 않게
  var it = {}, lot = {};
  rs.forEach(function (r) {
    var k = r['품번'];
    var e = it[k] || (it[k] = { nm: r['품명'], br: r['브랜드'], kd: kindOf_(k, r['품명']), m: {} });
    var a = e.m[ym] || (e.m[ym] = [0, 0, 0]);          // 수량 · 취득금액 · 부대비용
    a[0] += r['수량']; a[1] += r['취득금액']; a[2] += r['부대비용'];
    var lk = k + '' + r['입고일'] + '' + r['입고처'] + '' + r['묶음'];
    var b = lot[lk] || (lot[lk] = [k, r['입고일'], r['입고처'], 0, 0, 0, r['환율근거'], ym, r['묶음'], null, 0]);
    b[3] += r['수량']; b[4] += r['취득금액']; b[5] += r['부대비용'];
  });
  // 부대비용이 «어느 비용에서 얼마씩» 왔는가 — 줄 단위 배부를 품번·입고건으로 접는다
  var alloc = C.alloc || {}, pItem = {}, pLot = {}, qItem = {}, qLot = {};
  C.lines.forEach(function (l) {
    var a = alloc[l.id];
    if (!l.qty || !a) return;
    var ik = l.item, lk2 = l.item + '' + l.ymd + '' + l.vendor + '' + l.grp;
    // 배부에 실제로 쓰인 수량 — 반품 줄은 배부 대상이 아니라 수불부 수량과 다를 수 있다
    qItem[ik] = (qItem[ik] || 0) + l.qty;
    qLot[lk2] = (qLot[lk2] || 0) + l.qty;
    Object.keys(a).forEach(function (cid) {
      (pItem[ik] = pItem[ik] || {})[cid] = (pItem[ik][cid] || 0) + a[cid];
      (pLot[lk2] = pLot[lk2] || {})[cid] = (pLot[lk2][cid] || 0) + a[cid];
    });
  });
  // 품번마다 «무엇이 이 금액을 세웠나» — 화면이 환율 시트를 보고 짐작하면 안 된다.
  // 환율 시트에 «환율» 이 적혀 있어도 ERP에 입고단가가 있으면 입고단가가 이긴다(applyFx_ 는 미확정만 고친다).
  // 묶음도 여기서 준다 — 예전엔 «부대비용 범위값» 에서 거꾸로 캐서, 비용이 없는 달은 묶음이 통째로 안 보였다.
  var sItem = {}, gItem = {};
  C.lines.forEach(function (l) {
    if (!l.qty) return;
    var s = sItem[l.item] || (sItem[l.item] = {});
    s[l.base_src] = (s[l.base_src] || 0) + l.base;
    if (l.grp) (gItem[l.item] = gItem[l.item] || {})[l.grp] = 1;
  });
  Object.keys(it).forEach(function (k) {
    it[k].p = pItem[k] || null; it[k].q = qItem[k] || 0;
    it[k].s = sItem[k] || null;
    it[k].g = gItem[k] ? Object.keys(gItem[k]).sort() : [];
  });
  Object.keys(lot).forEach(function (k) { lot[k][9] = pLot[k] || null; lot[k][10] = qLot[k] || 0; });

  // 비용 한 건의 «규칙» — 금액·범위·기준·분모. 분모를 안 내려주면 화면이 추측하게 된다
  var costs = (C.costs || []).map(function (c) {
    var m = (C.cmeta || {})[c.id] || {};
    return { id: c.id, type: c.type, amount: c.amount, sup: c.supplier, doc: c.doc,
             scope: c.scope, val: c.scope_val, basis: c.basis, used: m.basis_used || '',
             wsum: (m.wsum === undefined || m.wsum === null) ? null : m.wsum,
             n: m.targets || 0, sum: m.allocated || 0, inv: !!c.inv,
             ok: m.ok !== false, issues: m.issues || [] };
  });

  // 기준금액이 어떻게 정해졌나 — 근거별 요약과, 환율이 걸린 묶음의 실제 곱셈.
  // 화면이 USD × 환율 을 스스로 계산하면 안 된다. 은행가 반올림이라 Math.round 로는 1원씩 벌어진다.
  var FXS = fxOf_(ym);
  var bs = {}, fxg = {};
  C.lines.forEach(function (l) {
    if (!l.qty) return;
    var b = bs[l.base_src] || (bs[l.base_src] = { n: 0, qty: 0, base: 0 });
    b.n++; b.qty += l.qty; b.base += l.base;
    if (l.base_src === '입고단가' || l.base_src === '사전원가') return;   // ERP 원화(입고단가·10월~ 사전원가) 줄은 환율과 무관하다
    var f = FXS[l.grp] || {};
    var g = fxg[l.grp] || (fxg[l.grp] = { grp: l.grp, ymd: l.ymd, ven: l.vendor,
      mode: String(f.mode || ''), rate: (f.rate || null), src: String(f.src || ''),
      bl: String(f.bl || ''), n: 0, qty: 0, usd: 0, pre: 0, base: 0, unres: 0 });
    if (l.ymd < g.ymd) g.ymd = l.ymd;
    g.n++; g.qty += l.qty; g.usd += l.amt_imp; g.pre += l.amt_pre; g.base += l.base;
    if (l.base_src === '미확정') g.unres++;
  });
  var fxl = [];
  Object.keys(fxg).forEach(function (k) { fxl.push(fxg[k]); });
  fxl.sort(function (a, b) { return b.base - a.base; });

  var grps = costGroups_(C);

  var lots = [];
  Object.keys(lot).forEach(function (k) { lots.push(lot[k]); });
  lots.sort(function (a, b) { return a[1] < b[1] ? -1 : (a[1] > b[1] ? 1 : b[4] - a[4]); });
  return { ym: ym, items: it, lots: lots, costs: costs, grps: grps,
           bsrc: bs, fx: fxl, ms: Date.now() - t0 };
}

/** 한 달. 두 번째부터는 캐시에서 — 조각 캐시라 100KB 한 칸 제한에 안 걸린다. */
function apiStock(ym) {
  var t0 = Date.now();
  ym = ymOf_(ym || defaultYm_());
  var hit = cacheGetBig_('stock:' + ym);
  if (hit && hit.costs && hit.grps && hit.fx) stockWho_(hit);
  // 옛 모양의 캐시는 쓰지 않는다 — 그대로 쓰면 화면에 근거가 통째로 안 뜬다.
  if (hit && hit.costs && hit.grps && hit.fx) { hit.cached = true; hit.ms = Date.now() - t0; return hit; }
  var out;
  try { out = stockOf_(ym); }
  catch (e) { return pure_({ ym: ym, items: {}, lots: [], empty: true, why: String(e.message || e) }); }
  out = pure_(out);
  cachePutBig_('stock:' + ym, out);
  stockWho_(out);
  Logger.log('apiStock ' + ym + ' — ' + Object.keys(out.items).length + '품번 · ' + out.ms + 'ms');
  return out;
}

/** 권한과 확정 여부는 사람마다·때마다 다르다 — 캐시에 담지 말고 늘 새로 얹는다.
 *  (캐시에 담으면 재무가 한 번 연 화면을 물류가 열었을 때 단추가 그대로 보인다) */
function stockWho_(out) {
  try { out.canCost = (can_('재무') || can_('생산')); } catch (e) { out.canCost = false; }
  try { out.closed = !!closeState_(out.ym); } catch (e) { out.closed = false; }
  return out;
}

/** 여러 달을 한 왕복에. 왕복 한 번이 몇 초라 달마다 부르면 화면이 멎는다.
 *  6달을 넘기면 자른다 — 8달 전부는 13초쯤 걸려서, 그건 화면이 «오래 걸린다» 고 먼저 말하고 불러야 한다. */
function apiStockMulti(yms) {
  var out = {}, n = 0;
  (yms || []).forEach(function (m) {
    if (n >= 6) return;
    out[m] = apiStock(m);
    n++;
  });
  return out;
}

/** 어느 달에 값이 있는지 — 화면이 기간을 고를 때 쓴다 */
function apiStockMonths() {
  var ms = closeMonths_();
  var have = {};
  rows_(SH.RMETA).forEach(function (r) { if (r.ym) have[ymOf_(r.ym)] = 1; });   // 올린 달은 메타에 한 줄씩 있다 — 입고현황 6천 줄을 안 읽는다
  return pure_({ months: ms.filter(function (m) { return have[m]; }), all: ms });
}

/**
 * 입고대장 한 번에 — 마감 상태와 품번별 결과를 같은 실행에서 같이 낸다.
 *
 * 화면이 «대장 한 장» 으로 합쳐지면서 apiClose 와 apiStock 을 둘 다 봐야 하는데,
 * 따로 부르면 왕복이 두 번이고 closeCompute_ 도 두 번 돈다.
 * 한 실행 안에서는 rows_ 의 _MEMO 가 살아 있어 시트를 두 번 읽지 않는다.
 */
function apiLedger(ym, memo) {
  var t0 = Date.now();
  ym = ymOf_(ym || defaultYm_());
  _CC_ON++;   // 마감·수불부가 같은 계산을 한 번만 하게
  try { var out = { ym: ym, close: apiClose(ym), stock: apiStock(ym) }; } finally { _CC_ON--; }
  // 화면이 장부를 받은 뒤 따로 부르던 apiMemoList(왕복 하나, 3초)를 같이 — 화면(closeBoot)·첫 화면 심기만 memo=1
  if (memo && typeof memoOut_ === 'function') { try { out.memo = memoOut_(ym); } catch (e) {} }
  out.ms = Date.now() - t0;
  return out;
}


// ───── Seed.gs
/** ────────────────────────────────────────────────────────────────
 *  ERP 입고현황을 그대로 «검수까지 끝난 건» 으로 만든다.
 *  9월부터 실제로 쓰기 전에, 8월 숫자로 뒤 단계(대사·배부·확정)를 돌려 보려는 자리다.
 *  ?seed=2026-08&wrong=3  — wrong 은 일부러 틀리게 둘 건의 수 (사유 미선택이 걸리는지 본다)
 *  ──────────────────────────────────────────────────────────────── */
function seedFromReceipt_(ym, wrongN) {
  wrongN = wrongN || 0;
  var R = rows_(SH.RCPT).filter(function (r) { return ymOf_(r.ym) === ymOf_(ym); });
  if (!R.length) throw new Error(ym + ' ERP 입고현황이 없습니다 — 먼저 올리세요.');

  // 입고일 × 입고처 = 건 하나
  var G = {}, order = [];
  R.forEach(function (r) {
    var d = dOf_(r.ymd), v = String(r.vendor || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !v) return;
    var id = d.replace(/-/g, '') + '_' + v.replace(/[^\w가-힣]/g, '').slice(0, 12);
    if (!G[id]) { G[id] = { id: id, ymd: d, vendor: v, logi: String(r.logi || ''), rows: [] }; order.push(id); }
    G[id].logi = G[id].logi || String(r.logi || '');
    G[id].rows.push(r);
  });

  // 이미 있는 8월 건·줄은 걷어낸다 (같은 자리를 두 번 만들지 않는다)
  [SH.PLAN, SH.WMS, SH.REV, SH.REC].forEach(function (n) { wipeYm_(n, ym); });

  var recs = [], plans = [], revs = [], who = who_().email, now = new Date();
  var wrongIds = order.slice(0, wrongN);           // 앞에서부터 몇 건만 어긋나게
  var wrongLog = [];

  order.forEach(function (id) {
    var g = G[id];
    recs.push({ ym: ym, id: id, '출고일': g.ymd, '출고처': g.vendor, '입고처': g.logi,
                '상태': '확인 완료', '출처': 'ERP 입고현황', '생성자': who, '생성시각': now,
                '검산': '[]', '의뢰': Utilities.formatDate(now, 'Asia/Seoul', 'yyyy-MM-dd HH:mm') + ' ' + who,
                '차수': '' });
    var bad = wrongIds.indexOf(id) >= 0, hit = 0;
    g.rows.forEach(function (r) {
      var sizes = [];
      try { sizes = JSON.parse(r.sizes || '[]'); } catch (e) { sizes = []; }
      var unit = num_(r.unit_ipgo);
      sizes.forEach(function (s) {
        var label = String(s[0]), q = int_(s[1]);
        if (!q) return;
        var k = k_(r.item, r.color, label);
        plans.push({ ym: ym, id: id, '품번': r.item, '컬러코드': r.color, '컬러': r.color, '사이즈': label,
                     '수량': q, '원수량': q, '원가': unit, '품명': r.name, '바코드': '' });
        var act = q;
        if (bad && hit < 2) {                      // 그 건의 앞 두 칸만 어긋나게
          act = Math.max(0, q - (hit === 0 ? 3 : 1));
          hit++;
          wrongLog.push(id + ' ' + r.item + '/' + r.color + '/' + label + ' 예정 ' + q + ' → 실수량 ' + act);
        }
        if (act !== q) revs.push({ ym: ym, id: id, '키': k, '실수량': act, '사유': '', '수정자': who, '수정시각': now });
      });
    });
  });

  append_(SH.REC, recs);
  append_(SH.PLAN, plans);
  if (revs.length) append_(SH.REV, revs);
  bust_(ym);
  cacheWipeAll_();
  log_('검수시드', ym, recs.length + '건 · ' + plans.length + '줄', ym);
  return { 건: recs.length, 줄: plans.length, 어긋난칸: revs.length, 어긋남: wrongLog };
}


// ───── Backup.gs
/**
 * 한 달치를 통째로 떠 두고, 그대로 되돌린다.
 *
 * «싹 비우고 처음부터» 를 하려면 되돌릴 길이 있어야 한다.
 * 8월은 유니패스 수입신고실적 파일이 없어서, 지금 시트에 든 관세·환율이 유일한 사본이다.
 * 그걸 잃으면 손으로 다시 만들 수밖에 없다.
 *
 *   ?dump=YYYY-MM              드라이브에 «마감백업_YYYY-MM_시각.json» 으로 떠 둔다
 *   ?restore=<파일명>&ym=YYYY-MM   그 파일로 되돌린다 (그 달을 먼저 비우고 넣는다)
 */

var BK_SHEETS = ['RCPT', 'RMETA', 'COST', 'CITEM', 'FX', 'UNI', 'HS'];

/** 그 달 시트 내용을 전부 모은다. HS 는 달 구분이 없어 통째로 담는다. */
function bkCollect_(ym) {
  var out = { ym: ym, at: Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm:ss'),
              by: who_().email, sheets: {} };
  BK_SHEETS.forEach(function (k) {
    var name = SH[k];
    var mine = (k === 'HS') ? rows_(name)
             : (k === 'RCPT' && typeof rowsYm_ === 'function') ? rowsYm_(name, ym)   // 6천 줄을 통째로 읽지 않는다
             : rows_(name).filter(function (r) { return String(r.ym) === String(ym); });
    out.sheets[k] = { name: name, rows: mine.map(function (r) { return pure_(r); }) };
  });
  var st = closeState_(ym);
  out.closed = st ? pure_(st) : null;
  return out;
}

function apiBackupDump(ym) {
  if (!can_('재무')) throw new Error('한 달치 백업을 뜨는 것은 재무 담당자만 할 수 있습니다. ' + '재무 담당자에게 부탁하세요. (지금 내 권한: ' + who_().role + ')');
  ym = ymOf_(ym || defaultYm_());
  var d = bkCollect_(ym);
  var stamp = Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyyMMdd_HHmm');
  var name = '마감백업_' + ym + '_' + stamp + '.json';
  var f = DriveApp.createFile(name, JSON.stringify(d), 'application/json');
  var n = {};
  BK_SHEETS.forEach(function (k) { n[SH[k]] = d.sheets[k].rows.length; });
  log_('백업', ym, name);
  return pure_({ ok: true, name: name, url: f.getUrl(), counts: n, closed: !!d.closed });
}

/** 되돌린다 — 그 달을 비우고 백업 내용을 넣는다. HS 는 건드리지 않는다(달 구분이 없어 통째로 덮으면 위험). */
function apiBackupRestore(fileName, ym) {
  if (!can_('재무')) throw new Error('백업으로 되돌리는 것은 재무 담당자만 할 수 있습니다. ' + '재무 담당자에게 부탁하세요. (지금 내 권한: ' + who_().role + ')');
  ym = ymOf_(ym || defaultYm_());
  var it = DriveApp.getFilesByName(String(fileName));
  if (!it.hasNext()) throw new Error('구글 드라이브에서 «' + fileName + '» 을 못 찾았습니다 — '
    + '이름이 바뀌었거나 지워진 백업입니다. 백업 목록에서 다른 백업을 고르세요.');
  var d = JSON.parse(it.next().getBlob().getDataAsString('UTF-8'));
  if (String(d.ym) !== ym) throw new Error('고른 백업은 ' + d.ym + ' 치인데 지금 화면의 달은 ' + ym + ' 입니다 — '
    + '엉뚱한 달을 덮어쓸 뻔했습니다. 화면 왼쪽 위 달을 ' + d.ym + ' 로 바꾸거나, ' + ym + ' 백업을 고르세요.');

  var done = {};
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    BK_SHEETS.forEach(function (k) {
      if (k === 'HS') return;                         // 달 구분이 없어 손대지 않는다
      var name = SH[k];
      var keep = rows_(name).filter(function (r) { return String(r.ym) !== ym; });
      var add = (d.sheets[k] && d.sheets[k].rows) || [];
      replaceAll_(name, keep.concat(add));
      done[name] = add.length;
    });
  } finally { lock.releaseLock(); }

  if (d.closed) PropertiesService.getScriptProperties().setProperty(closeStateKey_(ym), JSON.stringify(d.closed));
  else PropertiesService.getScriptProperties().deleteProperty(closeStateKey_(ym));

  bust_(ym);
  log_('백업복원', ym, fileName);
  return pure_({ ok: true, ym: ym, from: fileName, counts: done, closed: !!d.closed });
}

/** 떠 둔 백업 목록 */
function apiBackupList(ym) {
  var pre = '마감백업_' + (ym ? ymOf_(ym) : '');
  var it = DriveApp.getFiles(), out = [];
  while (it.hasNext()) {
    var f = it.next(), n = f.getName();
    if (n.indexOf('마감백업_') !== 0) continue;
    if (ym && n.indexOf(pre) !== 0) continue;
    out.push({ name: n, size: f.getSize(),
               at: Utilities.formatDate(f.getLastUpdated(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm') });
  }
  out.sort(function (a, b) { return a.at < b.at ? 1 : -1 });
  return pure_({ rows: out });
}

/**
 * 화면에서 한 달을 비운다 — 주소 대신 단추로.
 *
 * 주소(`?wipe=`)로만 지울 수 있게 해 뒀더니, 주소가 탭에 남아 다시 로드되며
 * 같은 달을 두 번 날린 적이 있다. 한 번만 쓸 수 있는 «확인번호» 로 막긴 했지만 애초에 주소로 할 일이 아니다.
 * 그래서 화면에 둔다 — 두 번 눌러야 하고, 첫 눌림이 백업을 먼저 뜬다.
 *
 *   apiMonthReset(ym)            → 백업을 뜨고 «확인번호» 를 준다 (아직 안 지움)
 *   apiMonthReset(ym, 확인번호)  → 그 번호로 한 번만 지운다
 */
function apiMonthReset(ym, token) {
  if (!can_('재무')) throw new Error('이 달을 통째로 비우는 것은 재무 담당자만 할 수 있습니다. ' + '재무 담당자에게 부탁하세요. (지금 내 권한: ' + who_().role + ')');
  ym = ymOf_(ym || defaultYm_());
  if (closeState_(ym)) throw new Error(ym + ' 은 이미 확정한 달이라 비울 수 없습니다 — '
    + '«확정» 단계에서 «확정 해제» 를 먼저 누르고 다시 시도하세요.');

  var P = PropertiesService.getScriptProperties();
  var key = 'WIPE_TICKET_' + ym;

  if (!token) {
    // 되살릴 수 없는 것이 있을 때만 백업을 뜬다.
    // 입고현황·유니패스는 올린 파일로 되살아나고, 환율·관세는 기계가 다시 세운다.
    // 오직 «운임·통관수수료를 어느 묶음에 붙였나» 하는 사람의 판단만 되살릴 수 없다.
    // 늘 뜬다 — 부대비용이 0건이어도 손으로 넣은 환율·B/L·사전원가 선택은 기계가 되살리지 못한다
    var bk = apiBackupDump(ym);
    var t = Utilities.getUuid().slice(0, 8);
    P.setProperty(key, JSON.stringify({ t: t, at: Date.now() }));
    var now = {};
    ['RCPT', 'COST', 'FX', 'UNI'].forEach(function (k) {
      now[SH[k]] = rows_(SH[k]).filter(function (r) { return ymOf_(r.ym) === ym; }).length;
    });
    return pure_({ stage: 'ready', ym: ym, token: t, backup: bk, now: now });
  }

  var raw = P.getProperty(key);
  var tk = raw ? JSON.parse(raw) : null;
  if (!tk || tk.t !== String(token))
    throw new Error('확인번호가 맞지 않습니다 — 이미 한 번 쓴 번호이거나 지워진 번호입니다. '
      + '아무것도 지우지 않았습니다. «이 달 처음부터 다시» 를 처음부터 다시 누르세요.');
  if (Date.now() - Number(tk.at) > 600000) {
    P.deleteProperty(key);
    throw new Error('확인번호를 받은 지 10분이 지나 쓸 수 없습니다 — 아무것도 지우지 않았습니다. '
      + '«이 달 처음부터 다시» 를 처음부터 다시 누르세요.');
  }
  P.deleteProperty(key);            // 지우기 전에 확인번호를 먼저 없앤다 — 도중에 새로고침해도 두 번 안 돌게
  apiCloseReset(ym);
  return pure_({ stage: 'done', ym: ym });
}


// ───── Baserow.gs
/**
 * 재고수불부용 — 월마감이 확정되면 그 달 품번별 입고를 Baserow 로 보낸다.
 *
 * 왜 확정 시점인가: 그때부터 숫자가 안 바뀐다. 그 전에 보내면 수불부가 흔들린다.
 * 다시 확정하면 그 달 행을 지우고 다시 넣는다 — 중복이 쌓이지 않게.
 *
 * 준비물 (스크립트 속성):
 *   BASEROW_URL    예: https://baserow.io           (자체 호스팅이면 그 주소)
 *   BASEROW_TOKEN  데이터베이스 토큰 (Baserow 설정 → 데이터베이스 토큰)
 *   BASEROW_TABLE  받을 테이블 id (숫자)
 */

/** 보낸 것이 마감 결과와 맞는지 — 숫자로 확인한다 */
function checkPush_2026_08() {
  var ym = '2026-08';

  });
  var C = closeCompute_(ym);

  Logger.log('  취득금액 ' + w(t.cost));

var BR_PROP = { url: 'BASEROW_URL', token: 'BASEROW_TOKEN', table: 'BASEROW_TABLE' };

function brCfg_() {
  var P = PropertiesService.getScriptProperties();

    url: String(P.getProperty(BR_PROP.url) || 'https://baserow.io').replace(/\/+$/, ''),

  };
}

/** 한 번만 — 값 세 개를 넣는다 */
function setupBaserow(url, token, table) {
  if (!token || !table) throw new Error('토큰과 테이블 id 를 둘 다 넣어야 합니다 — Baserow 설정 → 데이터베이스 토큰 에서 받은 값입니다.');

  });
