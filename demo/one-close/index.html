.dd-opt .dd-note{margin-left:auto;padding-left:var(--sp-4)}
.dd-none{padding:var(--sp-3);font-size:var(--fs-13);color:var(--ink-3)}
.brl .dd-opt:hover{background:var(--surface-2)}
.brw .dd-btn{width:auto;min-width:160px;max-width:260px}   /* 드롭다운처럼 제 폭만 — 한 줄을 다 먹지 않게 */
/* 목록은 scale 하지 않는다 — 줄었다 커지는 동안 버튼과 끝선이 어긋나 보인다 */
@keyframes dd-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes dd-in-up{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 대화상자 — 내재화 (components.js ask·tell). alert/confirm/prompt 대신 <dialog class="dlg"> + showModal()
   버튼은 왼쪽 "닫기"(ghost) · 오른쪽 행동 동사. 위험 동작은 기본 포커스가 "닫기" */
dialog.dlg{width:min(440px,calc(100vw - 32px));padding:0;border:0;border-radius:var(--r-4);background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-3);animation:dlg-in var(--dur-3) var(--ease-out) both}
dialog.dlg::backdrop{background:rgba(15,20,28,.45);animation:fade-in var(--dur-2) var(--ease-out) both}
dialog.dlg.out,dialog.dlg.out::backdrop{animation:fade-out var(--dur-exit) var(--ease-in) both}
.dlg-h{padding:var(--sp-5) var(--sp-6) 0}
.dlg-b{padding:var(--sp-3) var(--sp-6) var(--sp-5);color:var(--ink-2)}
.dlg-b .input{width:100%;margin-top:var(--sp-3)}
.dlg-f{display:flex;justify-content:flex-end;gap:var(--sp-2);padding:0 var(--sp-6) var(--sp-5)}
/* 여러 줄 입력(input.multiline) — 글이 줄바꿈되어 다 보이고 길이만큼 자란다. 화면 60% 넘으면 안쪽 스크롤 */
dialog.dlg.wide{width:min(560px,calc(100vw - 32px))}
.dlg-b textarea.input{display:block;box-sizing:border-box;font:inherit;font-size:var(--fs-14);line-height:var(--lh-body);padding:var(--sp-2) var(--sp-3);
  border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface);color:var(--ink);resize:none;max-height:60vh;overflow-y:auto;overflow-wrap:anywhere}
@keyframes dlg-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
/* ── 여기부터 앱 ── */
:root{
  /* 앱이 쓰던 이름을 공용 토큰에 잇는다 — 라이트·다크가 토큰을 따라 같이 바뀐다 */
  --paper:var(--bg); --surf:var(--surface); --surf-2:var(--g50); --surf-3:var(--surface-2);
  --line-2:var(--line-strong);
  --acc:var(--brand); --acc-soft:var(--brand-soft); --acc-ink:var(--brand-ink);
  --bad:var(--neg-ink); --bad-soft:var(--neg-soft);
  --ok:var(--pos-ink); --ok-soft:var(--pos-soft);
  /* 흐름도 계열색 4개 — 데이터 색이라 토큰 밖 (관세·운임·통관·기타) */
  --d1:var(--brand-ink); --d2:var(--warn-ink); --d3:var(--pos-ink); --d4:#6B3B6B;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --d4:#C39BC3; } }
:root[data-theme="dark"]{ color-scheme:dark; --d4:#C39BC3; }
*{box-sizing:border-box}
html{scrollbar-gutter:stable}   /* 스크롤바가 생기고 없어질 때 앱 틀이 좌우로 밀리지 않게(탭 전환 흔들림) */
body{margin:0;background:var(--paper);color:var(--ink);
  font:var(--fw-regular) var(--fs-14)/var(--lh-body) var(--font-sans);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;word-break:keep-all;overflow-wrap:break-word;
  padding:14px 16px 60px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.upp-r{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-4);padding:var(--sp-1) 0}
.upp-r b{font-weight:var(--fw-semibold);font-variant-numeric:tabular-nums;text-align:right}
.hint{font-size:12px;color:var(--ink-3)}
.mut{color:var(--ink-3)}
p{margin:0}

/* 앱 껍데기 */
.app{border:1px solid var(--line-2);background:var(--surf);display:flex;flex-direction:column}
#hold{position:fixed;inset:0;z-index:99;display:none;place-items:center;
  background:rgba(18,20,15,.55);backdrop-filter:blur(1px)}
#hold.on{display:grid}
#hold .card{background:var(--surf);border:1px solid var(--line);border-radius:8px;
  padding:22px 26px;min-width:280px;max-width:min(460px,88vw);text-align:center;
  box-shadow:0 18px 44px rgba(0,0,0,.28)}
#hold .sp{width:30px;height:30px;margin:0 auto 12px;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--acc);animation:hsp .8s linear infinite}
@keyframes hsp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#hold .sp{animation-duration:2.4s}}
#hold b{display:block;font-size:16px;margin-bottom:3px}
#hold .s{display:block;font-size:13px;color:var(--ink-3);line-height:1.6;word-break:break-all}
#hold .bar{position:relative;height:6px;margin-top:13px;border-radius:4px;
  background:var(--surf-3);border:1px solid var(--line);overflow:hidden}
#hold .bar i{position:absolute;top:0;bottom:0;left:0;width:100%;background:var(--acc);
  border-radius:4px;transform:scaleX(0);transform-origin:left;transition:transform var(--dur-2) var(--ease-std)}
/* 진행률을 모를 때 — 초를 세는 대신 띠가 흐른다. 멈춘 게 아니라는 증거는 이것이면 된다 */
#hold .bar.ind i{width:38%;transform:none;transition:none;animation:hflow 1.3s ease-in-out infinite}
@keyframes hflow{0%{left:-40%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){#hold .bar.ind i{animation-duration:3.2s}}
#hold .card.pct .sp{display:none}
#hold .el{display:block;margin-top:7px;font-family:inherit;font-size:12px;
  font-weight:700;color:var(--acc)}
#hold .wt{display:block;margin-top:7px;font-size:12px;color:var(--ink-3)}
#hold .wt:empty,#hold .el:empty{display:none}
#hold .dont{display:block;margin-top:11px;font-size:12px;color:var(--warn)}
.appbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 13px;border-bottom:1px solid var(--line);
  background:var(--surf-3);flex-wrap:nowrap}
.appbar .ttl{font-weight:700;font-size:16px;letter-spacing:-.01em}
/* 날짜 단추 자리 하나 — 세 탭(마감월·기간·지급월)이 같은 자리·같은 폭·같은 모양. 탭을 바꿔도 앱바가 안 움직인다 */
.dslot{display:inline-flex;align-items:center;gap:var(--sp-2);flex:none}
.dlab{width:3.5em;flex:none;white-space:nowrap;font-size:var(--fs-12);color:var(--ink-3)}
.dslot>.dd,.dslot>.kdr{width:272px}
.dslot .dd-btn{width:100%;min-width:0!important;height:var(--ctl);font-size:var(--fs-13);font-variant-numeric:tabular-nums}
.kdr{position:relative;display:inline-flex}
.tabs{display:flex;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.tab{flex:0 0 auto;background:var(--surf-2);border:0;padding:9px 18px;font-size:14px;font-weight:600;
  color:var(--ink-3);cursor:pointer;display:flex;align-items:center;gap:7px}
.tab[aria-selected=true]{background:var(--surf);color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
.tab .c{font-family:inherit;font-size:11px;font-weight:700;
  border:1px solid currentColor;padding:0 5px;border-radius:4px}
.tab .c.bad{color:var(--bad)}
.tab .c:empty{display:none}   /* R002: 빈 배지 테두리가 «—» 로 보였다 */
select,input[type=text],input[type=date]{font:inherit;font-size:13px;padding:4px 7px;
  border:1px solid var(--line-2);background:var(--surf);color:var(--ink);border-radius:4px}
button{font:inherit;cursor:pointer;border-radius:4px}
.btn{background:var(--surf);color:var(--ink);border:1px solid var(--line-2);padding:5px 11px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.go{background:var(--acc);border-color:var(--acc);color:var(--on-brand);font-weight:700}
.btn.go:hover{color:var(--on-brand);opacity:.92}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* 하는 중인 단추 — 초를 세지 않고 밑줄이 흐른다 */
.btn:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border:1px solid currentColor;
  border-radius:4px;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)}
.pill.acc{color:var(--acc)} .pill.mut{color:var(--ink-3)}
.dp{font-size:11px;font-weight:700;padding:0 5px;border:1px solid currentColor;border-radius:4px;white-space:nowrap}
/* 제작/사입 — 제작 실선 · 사입 점선+연파랑 (UO 품명 [JAPAN LINE]) */
.kd{display:inline-flex;align-items:center;height:20px;padding:0 var(--sp-2);border-radius:var(--r-1);font-size:var(--fs-12);font-weight:var(--fw-medium);white-space:nowrap;margin-right:var(--sp-2)}
.kd.mk{border:1px solid var(--ink-2);color:var(--ink-2)}
.kd.bu{border:1px dashed var(--brand-ink);color:var(--brand-ink);background:var(--brand-soft)}
tr.lgg td{background:var(--surface-2);cursor:pointer;height:36px}
tr.lgg td>*{vertical-align:middle}
tr.lgg .hint{margin-left:var(--sp-2)}
tr.lgg .gsum{float:right;font-weight:var(--fw-bold);font-variant-numeric:tabular-nums}
tr.lgg .chev{display:inline-block;width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin:0 var(--sp-3) 3px var(--sp-1);transition:transform var(--dur-1) var(--ease-std)}
tr.lgg.fold .chev{transform:rotate(-45deg)}
/* 메모 · 확인 요청함 (C안) */
td.bc,th.bc{width:34px;padding-left:var(--sp-2);padding-right:0}
.bub{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 6px;border:1px solid var(--line-strong);border-radius:var(--r-pill);background:var(--surface);color:var(--ink-3);font:inherit;font-size:var(--fs-12);cursor:pointer;vertical-align:middle;margin-right:var(--sp-2)}
.bub .ico{width:14px;height:14px}
.bub.on{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft)}
.bub:not(.on){opacity:.35} tr:hover .bub:not(.on),.bub:not(.on):focus-visible{opacity:1}
.mbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--sp-3);padding:var(--sp-3)}
.mgrp{display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-3);border-radius:var(--r-3);background:var(--surface-2)}
.mgh{display:flex;align-items:center;gap:var(--sp-2)}
.mwho{display:inline-flex;align-items:center;height:22px;padding:0 var(--sp-2);border-radius:var(--r-pill);background:var(--surface);font-size:var(--fs-12);font-weight:var(--fw-medium)}
.mc{padding:var(--sp-2) var(--sp-3) var(--sp-3);border:1px solid var(--line);border-radius:var(--r-2);background:var(--surface)}
.mc.st-안보냄{border-style:dashed} .mc.st-확인됨{opacity:.72}
.mh{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-13);min-height:28px}   /* 손잡이(지우기·확인됨)가 머리줄에 — 저장 전후 높이가 같다 */
.mh .ib{flex:none} .mh .ib:disabled{visibility:hidden}
.mh .tgt{margin-left:auto;border:0;background:transparent;font:inherit;font-size:var(--fs-12);color:var(--brand-ink);cursor:pointer;padding:0}
.mc p{margin:var(--sp-2) 0 0;font-size:var(--fs-14);line-height:var(--lh-body);white-space:pre-wrap}
.rp{margin-top:var(--sp-2);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-2);background:var(--surface-2);font-size:var(--fs-13)} .rp b{margin-right:var(--sp-2)}
.rp.in{display:flex;gap:var(--sp-2);background:transparent;padding:0}
.rp.in input{flex:1;height:32px;padding:0 var(--sp-3);border:1px solid var(--line-strong);border-radius:var(--r-2);background:var(--surface);font:inherit;font-size:var(--fs-13);color:var(--ink)}
.sd.sd-no{border:1.5px dashed var(--ink-4);background:transparent}
.dp.A본부{color:var(--d1)} .dp.C본부{color:var(--d2)} .dp.B본부{color:var(--d3)} .dp.운영{color:var(--d4)}
.role{font-size:11px;font-weight:700;padding:2px 8px;border:1px solid currentColor;border-radius:4px}
.role.생산{color:var(--brand)}.role.물류{color:var(--pos-ink)}.role.재무{color:var(--d4)}.role.관리{color:var(--acc)}.role.열람{color:var(--ink-3)}

.steps{display:inline-flex;gap:2px;vertical-align:middle}
.sd{width:14px;height:14px;border:1px solid var(--line-2);display:grid;place-items:center;border-radius:4px;
  font-size:11px;font-family:inherit;color:var(--ink-3);line-height:1}
.sd.on{background:var(--ok);border-color:var(--ok);color:var(--on-brand)}
.sd.now{background:var(--warn);border-color:var(--warn);color:var(--on-brand)}
.sd.blk{background:var(--bad);border-color:var(--bad);color:var(--on-brand)}

table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surf-2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
td.n,th.n{text-align:right;font-family:inherit;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.tot td{background:var(--surf-2);font-weight:700}
.tw{overflow-x:auto}

/* 알림 — 팝업 없음. 다만 «문서 최상단» 이 아니라 화면에 붙는다 —
   아래쪽에서 일하던 사람은 위에 뜬 결과를 본 적이 없다.
   상자 자체는 클릭을 통과시킨다(pointer-events:none) — 밑의 단계 카드를 막지 않는다. */
#notes{position:fixed;right:16px;bottom:16px;z-index:80;
  width:min(420px,calc(100vw - 32px));display:flex;flex-direction:column;gap:6px;
  pointer-events:none}
#notes:empty{display:none}
.note{pointer-events:auto;display:flex;align-items:flex-start;gap:9px;padding:8px 12px;
  border:1px solid var(--line);border-left-width:4px;background:var(--surf);font-size:13px;
  white-space:pre-wrap;box-shadow:0 6px 18px rgba(0,0,0,.16)}
.note .t{flex:1 1 auto;min-width:0}
.note .w{flex:0 0 auto;font-family:inherit;font-size:11px;color:var(--ink-3);
  padding-top:2px}
.note .x{margin-left:auto;border:0;background:transparent;color:var(--ink-3);font-size:16px;
  line-height:1;cursor:pointer;padding:0 2px}
.note.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.note.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.info{border-left-color:var(--acc);background:var(--acc-soft)}
/* 결과 — «무엇이 몇 건 적용됐다». 스스로 사라지지 않는다 */
.note.done{border-color:var(--ok);border-left-color:var(--ok);background:var(--ok-soft)}
.note.done .t::before{content:'\2713 ';font-weight:700;color:var(--ok)}
.work{font-size:12px;color:var(--acc);display:none;align-items:center;gap:6px}
.work.on{display:inline-flex}
.work i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.skel{padding:14px;color:var(--ink-3);font-size:13px}

/* 입고 건 탭 */
.secth{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);
  background:var(--surf-3);font-size:12px;font-weight:700;flex-wrap:wrap}
.sect{border-top:1px solid var(--line);background:var(--surf-2)}
.tlday{display:grid;grid-template-columns:78px 1fr;border-bottom:1px solid var(--line);background:var(--surf)}
.tlday:last-child{border-bottom:0}
.tlday .d{padding:7px 10px;border-right:1px solid var(--line);background:var(--surf-2);
  font-family:inherit;font-size:12px;font-weight:700;display:flex;flex-direction:column;gap:1px}
.tlday .d small{font-weight:400;color:var(--ink-3);font-size:11px;font-family:"Malgun Gothic",sans-serif}
.tlc{display:grid;grid-template-columns:1fr auto auto auto auto;gap:11px;padding:6px 12px;
  border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.tlc:last-child{border-bottom:0}
.tlc:hover{background:var(--surf-2)}
.tlc.on{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.btn.dgr{color:var(--bad);border-color:var(--bad)}
.btn.dgr:hover{background:var(--bad);color:var(--on-brand)}
.tlc.busy{cursor:progress}
.lap{font:11px Consolas,monospace;color:var(--ink-3);margin-left:8px;flex:0 1 auto;min-width:0;max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar .work{min-width:0;overflow:hidden;white-space:nowrap}
.appbar>.dslot,.appbar>.ttl,.appbar>.rlb{flex:none}
.lap.warn{color:var(--warn)}
.lap.bad{color:var(--bad);font-weight:700}
.tlc.pend{background:repeating-linear-gradient(135deg,transparent,transparent 7px,var(--warn-soft) 7px,var(--warn-soft) 14px)}
.tlc.pend:hover{background:var(--warn-soft)}
.tlc .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlc .mt{font-size:12px;color:var(--ink-3);font-family:inherit;}
.scroll{max-height:360px;overflow:auto}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line)}
.cal .wd{background:var(--surf-2);padding:4px 6px;font-size:11px;font-weight:700;color:var(--ink-3);text-align:center}
.cell{background:var(--surf);min-height:62px;padding:4px 6px;display:flex;flex-direction:column;gap:3px;
  min-width:0;border:0;text-align:left;font:inherit;cursor:default}
.cell.off{background:var(--surf-3)}
.cell .dn{font-family:inherit;font-size:11px;color:var(--ink-3);font-weight:700}
.cell .cnt{font-size:12px;font-weight:700}
.cell .dots{display:flex;gap:2px;flex-wrap:wrap}
.cd{width:7px;height:7px;background:var(--ok)}
.cd.w{background:var(--warn)} .cd.b{background:var(--bad)}
.cell.has{cursor:pointer} .cell.has:hover{background:var(--acc-soft)}
.cell.sel{background:var(--acc-soft);box-shadow:inset 0 0 0 2px var(--acc)}

/* 검수 패널 */
.insp{border-top:2px solid var(--acc);background:var(--surf)}
.insph{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--acc-soft);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.insph b{font-size:14px;color:var(--acc-ink)}
.inspsum{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.inspsum div{flex:1 1 104px;background:var(--surf);padding:7px 10px;min-width:0}
.inspsum .k{font-size:11px;color:var(--ink-3)}
.inspsum .v{font-family:inherit;font-size:14px;font-weight:700}
.inspsum .v.neg{color:var(--bad)} .inspsum .v.pos{color:var(--ok)}
.mine{border:1px solid var(--warn);background:var(--warn-soft);padding:8px 12px;font-size:13px;
  color:var(--warn);font-weight:600;margin:10px 12px}
tr.diff td{background:var(--warn-soft)}
tr.need td{background:var(--bad-soft)}
td input.q{width:62px;text-align:right;font-family:inherit;font-size:16px;padding:2px 5px}
.tw thead th{position:sticky;top:0;z-index:2;background:var(--surf-2)}
/* R005·R006·R009 머리줄 고정 — 안쪽 스크롤 상자를 두지 않는다(옆 여백에서 휠을 굴리면 페이지만 움직여 머리가 같이 사라졌다).
   페이지가 스크롤하고 머리는 앱바(--abh, JS 가 잼) 바로 밑에 붙는다. 테두리는 sticky 칸을 안 따라와 그림자로 밑줄 */
.hstk{overflow:visible}
.hstk thead th{position:sticky;top:var(--abh,0px);z-index:3;background:var(--surf-2);box-shadow:inset 0 -1px 0 var(--line)}
/* R008 입고대장 — 제작/사입 묶음을 접어도 열 폭이 그대로(고정 폭, 남는 폭은 품명) */
table.lgt{table-layout:fixed;width:100%}
table.lgt col.c-bc{width:34px} table.lgt col.c-k{width:140px} table.lgt col.c-q{width:88px}
table.lgt col.c-a{width:128px} table.lgt col.c-s{width:120px} table.lgt col.c-g{width:168px}
table.lgt>tbody>tr>td:not(.lgev){overflow:hidden;text-overflow:ellipsis}
.btn.dgr.go{background:var(--bad);border-color:var(--bad);color:var(--on-brand)}
td select.rs{font-size:12px;padding:1px 4px;max-width:160px}
.inspft{padding:10px 13px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}

/* 월마감 단계 */
.stg{border-bottom:1px solid var(--line)}
.stg:last-child{border-bottom:0}
.stg.lock .stgh{opacity:.55}
.stgh{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:10px 13px;align-items:center;
  background:var(--surf);cursor:pointer;border:0;width:100%;text-align:left;font:inherit}
.stgh:hover{background:var(--surf-2)}
.stgn{width:22px;height:22px;border:1px solid var(--line-2);display:grid;place-items:center;border-radius:4px;
  font-family:inherit;font-size:11px;font-weight:700;color:var(--ink-3)}
.stgn.on{background:var(--ok);border-color:var(--ok);color:var(--on-brand)}
.stgn.now{background:var(--warn);border-color:var(--warn);color:var(--on-brand)}
.stgt b{font-size:14px}
.stgt .s{font-size:12px;color:var(--ink-3)}
.stgb{background:var(--surf-2);border-top:1px solid var(--line)}
.gridc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line)}
.gc{background:var(--surf);padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.gc .k{font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.gc .v{font-family:inherit;font-size:12px;color:var(--ink-3)}
.gc.wait{background:var(--warn-soft)}
.bar{height:4px;background:var(--surf-3);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.bar i.part{background:var(--warn)}
/* 지금 할 일 — 순서를 설명하지 않고 걸음 하나만 지목한다 */
.gridc.two{grid-template-columns:1fr 1fr}
@media (max-width:700px){ .gridc.two{grid-template-columns:1fr} }
.gridc.two .drop{margin:0}
/* 근거 그림 — 두 장을 잇는다 */
.jn{margin:0 11px 9px;padding:11px;border:1px solid var(--acc);background:var(--surf)}
.jn.no{border-color:var(--warn)}
.jn.left{border-color:var(--warn)}
.jl.w{background:var(--warn)} .jl.w span{background:var(--warn)}
.jd.w i{border-top-color:var(--warn)}
.jg.w span{background:var(--warn)}
.jg.w span.s{background:none;color:var(--ink-3)}
.jk.done{color:var(--ink-3);background:var(--surf-3)}
.jk.done b{color:var(--ink-3)}
.jnr{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;gap:0}
@media (max-width:640px){ .jnr{grid-template-columns:1fr} }
.jc{border:1px solid var(--line);background:var(--surf-2);padding:8px 10px;border-radius:4px}
.jc.dim{opacity:.55}
.jh{font-size:11px;letter-spacing:.06em;color:var(--ink-3);margin-bottom:5px}
.jv{font-size:14px;font-weight:600;line-height:1.45}
.jv.s{font-size:12px;font-weight:400;color:var(--ink-3)}
.jk{margin-top:5px;font-size:13px;padding:3px 6px;border-radius:4px;color:var(--ink-2)}
.jk b{font-family:var(--mono);font-weight:700;color:var(--ink)}
.jk.on{background:var(--acc-soft);color:var(--acc-ink);box-shadow:inset 2px 0 0 var(--acc)}
.jk.on b{color:var(--acc-ink)}
.jk.off{color:var(--ink-3);text-decoration:line-through}
.jk.off b{color:var(--ink-3);font-weight:400}
.jl{position:relative;height:3px;background:var(--acc);display:grid;place-items:center}
.jl.x{background:var(--line-2)}
.jl span{position:absolute;top:-9px;white-space:nowrap;font-size:11px;padding:1px 6px;
  background:var(--acc);color:var(--on-brand);border-radius:8px}
.jl.x span{background:var(--line-2);color:var(--ink-2)}
@media (max-width:640px){ .jl{height:26px;width:3px;margin:0 auto} .jl span{top:auto} }
.jd{height:20px;display:grid;place-items:center}
.jd i{display:block;width:0;height:0;border:6px solid transparent;border-top-color:var(--acc);margin-top:6px}
.jd.x i{border-top-color:var(--line-2)}
.jg{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}
.jg span{font-family:var(--mono);font-size:14px;font-weight:700;padding:5px 11px;
  background:var(--acc);color:var(--on-brand);border-radius:4px}
.jg span.s{font-family:var(--body);font-size:12px;font-weight:400;background:none;color:var(--ink-3);padding:0}
.jg.x span{background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn)}
.jg.x span.s{background:none;border:0;color:var(--ink-3)}

.why{border:1px solid var(--acc);background:var(--surf);margin:0 11px 9px}
.why.no{border-color:var(--warn)}
.whyh{padding:6px 11px;background:var(--acc-soft);color:var(--acc-ink);
  font-size:13px;font-weight:700;border-bottom:1px solid var(--acc)}
.why.no .whyh{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.why .tw{margin:0;border:0}
.why table{font-size:13px}
.why td:first-child{white-space:nowrap;color:var(--ink-2)}
/* 누르는 것 셋 */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (max-width:820px){ .acts{grid-template-columns:1fr} }
.act{display:grid;grid-template-columns:30px 1fr auto 16px;gap:9px;align-items:center;
  background:var(--surf);border:0;padding:10px 12px;text-align:left;width:100%}
.act:hover{background:var(--surf-2)}
.act.open{background:var(--acc-soft)}
.act .an{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--ink-3)}
.act.done .an{color:var(--ok)} .act.now .an{color:var(--acc)}
.act .at b{font-size:14px}
.act .at .s{font-size:12px;color:var(--ink-3);line-height:1.5}
.act .av{text-align:right;font-family:var(--mono);font-size:13px;font-weight:700;white-space:nowrap}
.act .av .pill{font-family:var(--body);font-weight:400}
.act .ax{color:var(--ink-3);font-size:11px}
.actb{border-bottom:1px solid var(--line);background:var(--surf-2)}
/* 배부 흐름 */
.flowbox{padding:11px 13px;border-bottom:1px solid var(--line);background:var(--surf-2)}
.leg2{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-bottom:8px}
.leg2 i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;border-radius:4px}
.scrx{overflow-x:auto}
/* 대장 줄 펼침 */
td.lgev{background:var(--acc-soft);padding:11px 13px}
.lgw{display:grid;grid-template-columns:minmax(330px,1.15fr) 1.6fr;gap:16px}
@media (max-width:760px){ .lgw{grid-template-columns:1fr} }
.lgh{font-size:13px;margin-bottom:3px}
.lgw table{background:transparent;font-size:12px}
.lgw td{border-bottom:1px solid var(--line);padding:3px 7px}
/* 값이 «어느 자료» 에서 왔는지 — 왼칸이 출처, 가운뎃칸이 무엇, 오른칸이 값.
   값이 잘리면 표의 뜻이 없어진다 — 값 칸을 먼저 확보하고 설명 칸을 줄인다 */
.srcw{border:0}
.srcw table{table-layout:auto;width:100%}
.srcw td{vertical-align:top}
.srcw td.sw{font-weight:600;color:var(--ink-2)}
.srcw td.sw .hint{font-weight:400;font-size:11px;line-height:1.35;margin-top:1px}
.srcw td.n{white-space:nowrap;width:1%;padding-left:13px}
.srcw tr:last-child td{border-bottom:0;border-top:1px solid var(--line-2);padding-top:5px}
.srcw tr:last-child td.sw{color:var(--ink)}
.todo{display:flex;gap:11px;align-items:center;flex-wrap:wrap;padding:10px 14px;
  background:var(--acc-soft);color:var(--acc-ink);border-bottom:1px solid var(--line)}
.todo b{font-size:14px}
.todo.done{background:var(--ok-soft);color:var(--ok)}

/* 미리보기 → 적용 — 제안은 사라지는 알림이 아니라 읽고 판단하는 물건이다 */
.prev{border:1px solid var(--acc);background:var(--surf);margin:11px 0}
.prevh{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:8px 11px;
  background:var(--acc-soft);color:var(--acc-ink);border-bottom:1px solid var(--acc);font-size:14px}
.prevb{padding:2px 0}
.prevb .tw{margin:0;border:0;border-bottom:1px solid var(--line)}

/* 용어 물음표 — 모르면 판단 자체가 안 되는 다섯 개에만 */
i.q{display:inline-grid;place-items:center;width:14px;height:14px;margin-left:4px;
  border:1px solid var(--line-2);border-radius:50%;font-style:normal;font-size:11px;
  color:var(--ink-3);cursor:pointer;vertical-align:middle}
i.q:hover{border-color:var(--acc);color:var(--acc)}

.rst{padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;
  border-top:1px solid var(--line);background:var(--surf-2)}
.rst .hint{flex:1 1 220px}
.rst.on{display:block;border-left:3px solid var(--bad);background:var(--bad-soft)}
.rst.on .hint{display:block;margin-top:3px}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--on-brand)}
.drop{border:1px dashed var(--line-2);background:var(--surf);padding:12px;text-align:center;
  font-size:13px;color:var(--ink-3);margin:10px;transition:background .12s,border-color .12s}
.drop.over{border-color:var(--acc);border-style:solid;background:var(--acc-soft);color:var(--acc-ink)}
.drop.over b{color:var(--acc-ink)}
.drop b{color:var(--ink)}
.vrow{display:grid;grid-template-columns:24px 1fr auto;gap:9px;padding:7px 12px;
  border-bottom:1px solid var(--line);align-items:center;background:var(--surf)}
.vrow:last-child{border-bottom:0}
.vmk{width:18px;height:18px;display:grid;place-items:center;font-size:11px;border-radius:4px;
  border:1px solid var(--line-2);color:var(--ink-3)}
.vmk.ok{background:var(--ok);border-color:var(--ok);color:var(--on-brand)}
.vmk.no{background:var(--bad);border-color:var(--bad);color:var(--on-brand)}
.vmk.wait{background:var(--surf-3)}
.confirm{padding:12px 13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surf)}
.tiles{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.tiles>div{flex:1 1 140px;background:var(--surf);padding:8px 11px;min-width:0}
.tiles .k{font-size:11px;color:var(--ink-3)}
.tiles .v{font-family:inherit;font-size:16px;font-weight:700}
.tiles .s{font-size:11px;color:var(--ink-3)}
.tiles .neg .v{color:var(--bad)} .tiles .pos .v{color:var(--ok)} .tiles .cau .v{color:var(--warn)}
@media (max-width:720px){ .tlday{grid-template-columns:62px 1fr} }

/* ── 월마감 A 트랙 ───────────────────────────────── */
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#pClose .ico{width:20px;height:20px}
#pClose .grow{flex:1}
#pClose .trk-top{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3) var(--sp-4);padding:var(--sp-4)}
#pClose .eq{display:flex;align-items:stretch;gap:var(--sp-2);flex-wrap:wrap}
#pClose .eqb{display:flex;flex-direction:column;gap:2px;padding:var(--sp-2) var(--sp-4);border-radius:var(--r-2);background:var(--surface-2)}
#pClose .eqb .k{font-size:var(--fs-12);color:var(--ink-3);font-weight:var(--fw-medium)}
#pClose .eqb .v{font-size:var(--fs-18);font-weight:var(--fw-bold);font-variant-numeric:tabular-nums;white-space:nowrap}
#pClose .eqb.hole{background:transparent;border:1px dashed var(--warn-ink)}
#pClose .eqb.hole .v{color:var(--warn-ink)}
#pClose .eqop{align-self:center;color:var(--ink-4);font-size:var(--fs-18);font-weight:var(--fw-medium)}
#pClose .trk-sub{font-size:var(--fs-12);color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
#pClose .trk-sub.neg{color:var(--neg-ink)}
#pClose .vdots{display:flex;gap:var(--sp-1)}
#pClose .vd{width:28px;height:28px;border:0;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-12);font-weight:var(--fw-bold);
  transition:transform var(--dur-1) var(--ease-std)}
#pClose .vd:active{transform:scale(.94)}
#pClose .vd.ok{background:var(--pos-soft);color:var(--pos-ink)}
#pClose .vd.no{background:var(--neg-soft);color:var(--neg-ink)}
#pClose .trk-wrap{overflow-x:auto;padding:0 var(--sp-4)}
#pClose .trk{list-style:none;margin:0;padding:var(--sp-1) 0 0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(96px,1fr);min-width:320px}
#pClose .trk li{position:relative;display:flex;justify-content:center}
#pClose .trk li::before{content:"";position:absolute;top:26px;left:-50%;width:100%;height:2px;background:var(--line-strong)}
#pClose .trk li:first-child::before{display:none}
#pClose .trk li.lit::before{background:var(--pos)}
#pClose .node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-1);
  padding:var(--sp-1) var(--sp-3) var(--sp-2);border:0;border-radius:var(--r-2);background:transparent;cursor:pointer;
  transition:background-color var(--dur-1) var(--ease-std)}
#pClose .node:hover{background:var(--surface-2)}
#pClose .circ{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:2px solid var(--line-strong);color:var(--ink-3);transition:box-shadow var(--dur-1) var(--ease-std)}
#pClose .st-done .circ,#pClose .st-skip .circ{background:var(--pos-soft);border-color:var(--pos);color:var(--pos-ink)}
#pClose .st-skip .circ{background:var(--surface);border-style:dashed;border-color:var(--line-strong);color:var(--ink-4)}
#pClose .st-now .circ{border-color:var(--brand);color:var(--brand)}
#pClose .st-bad .circ{background:var(--neg-soft);border-color:var(--neg);color:var(--neg-ink)}
#pClose .st-lock .circ{color:var(--ink-4)}
#pClose .node[aria-selected="true"] .circ{box-shadow:var(--focus)}
#pClose .node[aria-selected="true"] .nl{color:var(--ink)}
#pClose .node.wk .circ::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;border-top-color:var(--brand);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#pClose .pip{position:absolute;top:-6px;right:-12px;min-width:20px;height:20px;padding:0 var(--sp-1);border-radius:var(--r-pill);
  background:var(--neg);color:var(--on-brand);font-size:var(--fs-11);font-weight:var(--fw-bold);display:grid;place-items:center;font-variant-numeric:tabular-nums}
#pClose .st-now .pip,#pClose .st-lock .pip{background:var(--warn)}
#pClose .nl{font-size:var(--fs-13);font-weight:var(--fw-semibold);color:var(--ink-2)}
#pClose .nm{font-size:var(--fs-12);color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
#pClose .chips{display:flex;flex-wrap:wrap;gap:var(--sp-2);padding:var(--sp-2) var(--sp-4) 0}
#pClose .chip{display:inline-flex;align-items:center;gap:var(--sp-1);height:28px;padding:0 var(--sp-3);border:0;border-radius:var(--r-pill);
  font-size:var(--fs-12);font-weight:var(--fw-medium);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
#pClose .chip .ico{width:16px;height:16px}
#pClose .chip.ok{background:var(--pos-soft);color:var(--pos-ink)}
#pClose .chip.warn{background:var(--warn-soft);color:var(--warn-ink);cursor:pointer}
#pClose .chip.ghost{background:transparent;color:var(--ink-3);cursor:pointer}
#pClose .trk-panel{margin:var(--sp-3) var(--sp-4) var(--sp-4);border:1px solid var(--line);border-radius:var(--r-3);background:var(--surface);overflow:hidden}
@keyframes trk-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#pClose .row-act{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--line)}
#pClose .big{font-size:var(--fs-22);font-weight:var(--fw-bold);font-variant-numeric:tabular-nums}
#pClose .big.neg{color:var(--neg-ink)}
#pClose .rc-x{font-size:var(--fs-12);color:var(--ink-3)}
#pClose .chip.bad{background:var(--neg-soft);color:var(--neg-ink)}
#pClose .chip.acc{background:var(--brand-soft);color:var(--brand-ink);font-weight:var(--fw-semibold)}
#pClose .trk-panel.lockw :is(.btn.go,[data-pdel],[data-drop]){opacity:.45;pointer-events:none}   /* 자동 정리·올리는 중 */

/* ── QA U3 — 시각 규칙 보강 ─────────────────────────── */
/* ── 모션 (2026-10-26, 모션 템플릿 «곡선·패턴» + ux-guide «길이») ─────────────
   등장은 JS(MO.*, Web Animations — transform·opacity 만). 같은 데이터로 다시 그릴 때는 다시 등장하지 않는다.
   .nt = 그 안의 전환을 끊는다(다시 그리기·정적 화면). 움직임 줄이기면 전부 끈다(로딩 표시만 느리게 남김) */
.nt,.nt *{transition:none!important;animation:none!important}
.mo-ring{position:absolute;z-index:40;pointer-events:none;border:2px solid var(--brand);border-radius:var(--r-2)}
#pClose .trk li::before{transform-origin:left}
#pStock .qb,#pStock .mixb{transform-origin:left}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;scroll-behavior:auto!important}
  :not(.sp):not(.kspin):not(i)::before,:not(.sp):not(.kspin):not(i){animation-duration:.01ms!important;animation-iteration-count:1!important}
}
[hidden]{display:none!important}   /* .tab{display:flex} 같은 규칙이 hidden 을 이겨 숨긴 게 보였다 */
/* 큰 탭 패널은 숨겨도 그린 상태를 남긴다(content-visibility) — display:none 이면 다시 열 때 표 전체 스타일·레이아웃을 새로 해 100~190ms 멈췄다 */
#pClose[hidden],#pStock[hidden],#pPay[hidden]{display:block!important;content-visibility:hidden;height:0;margin:0;padding:0;border:0}
:root{--body:var(--font-sans);--mono:var(--font-sans);--ctl:32px;
  --k-duty:var(--acc-ink);--k-freight:var(--warn-ink);--k-customs:var(--ok);--k-rfid:var(--d4);--k-sub:var(--d2);--k-insp:var(--d3)}
/* 대화상자 단추 — 클래스가 없어 «지우기» 와 «닫기» 가 똑같이 생겼다 */
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-brand);font-weight:var(--fw-semibold)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-brand);font-weight:var(--fw-semibold)}
.btn.primary:hover,.btn.danger:hover{color:var(--on-brand);opacity:.92}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surf-3);color:var(--ink)}
.btn.pri{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-ink);font-weight:var(--fw-semibold)}
.dlg-h h3{margin:0;font-size:var(--fs-18);font-weight:var(--fw-semibold);line-height:var(--lh-tight)}
.dlg-b p{margin:0}
/* 기간 보기 단추 — 브라우저 기본 버튼이라 다크에서 흰 테두리 회색 상자였다 */
:is(#pStock,.kdr) button.sm{font:inherit;font-size:var(--fs-13);font-weight:var(--fw-medium);height:var(--ctl);padding:0 var(--sp-3);display:inline-flex;align-items:center;gap:var(--sp-1);
  border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surf);color:var(--ink);cursor:pointer}
:is(#pStock,.kdr) button.sm:hover{border-color:var(--acc);color:var(--acc-ink)}
:is(#pStock,.kdr) button.sm.pri{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-ink);font-weight:var(--fw-semibold)}
#pStock td button.sm{height:24px;padding:0 var(--sp-2);font-size:var(--fs-12)}
/* 한 줄 = 높이 하나 */
:is(.secth,.ftool,.addf,.addft,.inspft,.confirm,.rst,.row-act,.rfoot) :is(.btn.sm,button.sm,input[type=text]){height:var(--ctl);font-size:var(--fs-13)}
#pStock .ftool input[type=text]{height:var(--ctl);padding-top:0;padding-bottom:0;font-size:var(--fs-13)}
td .dd-btn{height:28px;min-width:0;padding:0 var(--sp-1) 0 var(--sp-2);font-size:var(--fs-12)}
/* 표 머리 — 한글에 자간·대문자를 주면 벌어진다 */
th{font-size:var(--fs-12);letter-spacing:0;text-transform:none;font-weight:var(--fw-semibold)}
/* 라이트 대비 — 주황·파랑 글자를 진한 쪽으로 */
.mine,.why.no .whyh,.jg.x span,.pill.warn,.lap.warn,#hold .dont{color:var(--warn-ink)}
.pill.acc,.role.관리,#pStock th.ours,.kdr .cday.mid,.kdr .cdow.sat,.kdr .cday.sat{color:var(--acc-ink)}
#pClose .eqop{color:var(--ink-3)}
/* 폰 폭 — 앱바 브랜드 칸이 넘쳐 가로로 밀렸다 */
#brandsel{flex-wrap:wrap;min-width:0;max-width:100%;row-gap:var(--sp-2)}
@media (max-width:640px){ #brandsel{margin-left:0!important;width:100%} .tlc{grid-template-columns:1fr auto;row-gap:var(--sp-1)} .tlc .nm{grid-column:1/-1;white-space:normal} }
/* 키보드 */
tr[tabindex]:focus-visible,.tlc:focus-visible,.cday[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
/* 상태 모양 사전 (ux-guide §3-1) — 트랙·걸음·카드·목록이 같은 모양 */
.sd{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;flex:none;vertical-align:middle;box-sizing:border-box}
.sd .ico{width:12px;height:12px;stroke-width:3}
.sd-ok{background:var(--pos);color:var(--on-brand)}
.sd-no{border:2px dashed var(--line-strong)}
.sd-me{border:2px solid var(--brand);box-shadow:var(--focus)}
.sd-bad{background:var(--neg);color:var(--on-brand);font-size:var(--fs-11);font-weight:var(--fw-bold);width:auto;min-width:18px;padding:0 5px;border-radius:var(--r-pill)}
.sd-n{background:var(--warn);color:var(--on-brand);font-size:var(--fs-11);font-weight:var(--fw-bold);width:auto;min-width:18px;padding:0 5px;border-radius:var(--r-pill)}
.sd-n.mut{background:var(--ink-4)}
.gc.me{box-shadow:inset 0 0 0 1px var(--brand)}
.gc .k .grow{flex:1}
.gc .v b{color:var(--ink);font-weight:var(--fw-semibold)}
.qm{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-3);
  font-size:var(--fs-12);font-weight:var(--fw-bold);cursor:help}
.qm:focus-visible{outline:none;box-shadow:var(--focus)}
.gobtn{display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 var(--sp-2);border:1px solid var(--line-strong);border-radius:var(--r-pill);
  background:var(--surface);color:var(--ink-2);cursor:pointer;flex:none}
.gobtn:hover{border-color:var(--brand);color:var(--brand-ink)}
.gobtn .ico{width:14px;height:14px}
.ib{width:32px;height:32px;padding:0;display:inline-grid;place-items:center;border:1px solid var(--line-strong);border-radius:var(--r-2);
  background:var(--surface);color:var(--ink-2);cursor:pointer;flex:none}
.ib.s{width:28px;height:28px}
.ib .ico{width:16px;height:16px}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib.del:hover{color:var(--neg-ink);border-color:var(--neg)}
.ib:disabled{opacity:.4;cursor:default}
#pStock button.ib1{width:var(--ctl);padding:0;justify-content:center}
#pStock button.ib1 .ico{width:16px;height:16px}
#pStock button.ib1.del:hover{color:var(--neg-ink);border-color:var(--neg)}
.seg2{display:inline-flex;padding:2px;background:var(--surface-2);border-radius:var(--r-2);gap:2px}
.seg2>button{height:28px;padding:0 var(--sp-3);border:0;border-radius:6px;background:transparent;color:var(--ink-2);font:inherit;font-size:var(--fs-13);
  font-weight:var(--fw-medium);cursor:pointer;display:inline-flex;align-items:center}
.seg2>button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg2 .ico,.gi .q .ico{width:14px;height:14px;vertical-align:-2px}
.vline{display:flex;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3)}
#pClose .vline .vd{cursor:help}
#pClose .rc-x .ico{width:16px;height:16px;transition:transform var(--dur-2) var(--ease-std)}
#pClose .confirm .chip .ico{width:14px;height:14px}
.wprog{position:absolute;left:0;right:0;bottom:-1px;height:3px;overflow:hidden;opacity:0;pointer-events:none;transition:opacity var(--dur-2) var(--ease-std)}
.wprog.on{opacity:1}
.wprog i{position:absolute;top:0;bottom:0;left:0;width:100%;background:var(--brand);transform-origin:left;transition:transform var(--dur-2) var(--ease-std)}
.wprog:not(.det) i{width:30%;animation:wslide 1.2s var(--ease-std) infinite}
@keyframes wslide{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
@media (prefers-reduced-motion:reduce){.wprog:not(.det) i{animation:none;width:100%;opacity:.5}}

/* 회계시스템 전표 상자 (확정 단계) */
#pClose .amr{border-top:1px solid var(--line);padding:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2)}
#pClose .amrh{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
#pClose .amr .chip .ico{width:14px;height:14px}
#pClose .amrl summary{display:flex;align-items:center;gap:var(--sp-2);cursor:pointer;list-style:none}
#pClose .amrl summary::-webkit-details-marker{display:none}
#pClose .amrl[open] .rc-x .ico{transform:rotate(180deg)}

/* 누른 단추 — 크기 그대로, 글자 대신 도는 고리 */
button.busy,.pill.busy{position:relative;color:transparent!important;pointer-events:none}
button.busy::after,.pill.busy::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
  border:2px solid var(--line-2);border-top-color:var(--acc);animation:spin .8s linear infinite}
.btn.go.busy::after,.btn.primary.busy::after,.btn.danger.busy::after{border-color:rgba(255,255,255,.45);border-top-color:var(--on-brand)}
/* 설명 문장은 ? 안에 — 필요할 때만 편다 */
.tipd{margin:var(--sp-2) var(--sp-4)}
.tipd>summary{list-style:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;cursor:pointer;
  background:var(--surface-2);color:var(--ink-3);font-size:var(--fs-12);font-weight:var(--fw-bold)}
.tipd>summary::-webkit-details-marker{display:none}
.tipd[open]>summary{background:var(--brand-soft);color:var(--brand-ink)}
.tipd>div{margin-top:var(--sp-2);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-2);background:var(--surface-2);font-size:var(--fs-13);line-height:var(--lh-body)}
@media (max-width:640px){ #pClose .eqb .v{font-size:var(--fs-16)} #pClose .vdots{width:100%} }
/* 레드라인 (Redline.html) — 켜짐 = 단추 눌림 + 화면 테두리 빨강 2px. 층은 투명, 드래그만 가로챈다 */
.rlb{width:32px;height:32px;padding:0;display:inline-grid;place-items:center;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface);color:var(--ink-2)}
.rlb:hover{border-color:var(--neg);color:var(--neg-ink)}
.rlb[aria-pressed=true]{background:var(--neg-soft);border-color:var(--neg);color:var(--neg-ink)}
.rlb .ico,#rlMarks .ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#rlLayer{position:fixed;inset:0;z-index:60;cursor:crosshair;background:transparent;box-shadow:inset 0 0 0 2px var(--neg);touch-action:none}
#rlMarks{position:absolute;left:0;top:0;width:0;height:0;z-index:61;pointer-events:none}
#rlMarks .rl-box{position:absolute;border:2px solid var(--neg);border-radius:var(--r-1);pointer-events:none}
#rlMarks .rl-box.done{border-style:dashed;border-color:var(--pos)}
#rlMarks .rl-pin{position:absolute;width:24px;height:24px;padding:0;border:0;border-radius:var(--r-pill);background:var(--neg);color:var(--on-brand);
  font-size:var(--fs-12);font-weight:var(--fw-bold);display:grid;place-items:center;pointer-events:auto;cursor:pointer;box-shadow:var(--shadow-1)}
#rlMarks .rl-pin.done{background:var(--pos)}
#rlMarks .rl-pin.tmp{opacity:.6}
#rlMarks .rl-ed{position:absolute;width:280px;pointer-events:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-2);
  box-shadow:var(--shadow-3);padding:var(--sp-2);display:flex;flex-direction:column;gap:var(--sp-2);cursor:auto}
#rlMarks .rl-ed textarea{font:inherit;font-size:var(--fs-13);line-height:var(--lh-body);resize:vertical;min-height:64px;padding:var(--sp-2);
  border:1px solid var(--line-2);border-radius:var(--r-1);background:var(--surface);color:var(--ink)}
#rlMarks .rl-ed textarea:focus{outline:2px solid var(--neg);outline-offset:-1px}
#rlMarks .rl-f{display:flex;align-items:center;gap:var(--sp-1)}
#rlMarks .rl-m{flex:1;font-size:var(--fs-12);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rlMarks .rl-i{width:28px;height:28px;padding:0;border:0;border-radius:var(--r-1);background:transparent;color:var(--ink-3);display:inline-grid;place-items:center}
#rlMarks .rl-i:hover{background:var(--surface-2);color:var(--ink)}
#rlMarks .rl-i[aria-pressed=true]{color:var(--pos-ink)}
#rlMarks .rl-i.del:hover{color:var(--neg-ink)}
#rlMarks .rl-rp{font-size:var(--fs-12);color:var(--ink-2);background:var(--surface-2);border-radius:var(--r-1);padding:var(--sp-1) var(--sp-2)}
</style>
</head>

<script>
/* ux-guide components.js — 네이티브 <select> 목록 대신 앱이 그리는 드롭다운 · ask/tell 대화상자 */
/* ============================================================
   example-ui components.js — 드롭다운·대화상자 내재화 v1 (2026-09-28)
   붙이는 법: <script> 맨 위에 이 파일 내용을 붙이고
     · 드롭다운  ddEnhanceAll()                 페이지의 <select> 전부를 앱이 그리는 목록으로 바꾼다(나중에 생기는 것도)
     · 확인      await ask({title, body, ok:"삭제", danger:true})   → true / false      (confirm 대신)
     · 알림      await tell({title, body})                            → 닫으면 끝          (alert 대신)
     · 입력      await ask({title, body, ok:"저장", input:{value:""}}) → 문자열 / null    (prompt 대신)
   (같은 이름 함수가 앱에 이미 있으면 덮지 않는다 → ui.ask() · ui.tell() · ui.ddEnhanceAll() 로 부른다)
   CSS 는 tokens.css 의 .dd* · .dlg* 를 쓴다. 앱 팔레트가 따로면 같은 클래스 이름으로 앱 변수만 바꿔 그린다.

   ★ <select> 는 지우지 않고 숨긴다(겉만 바꾼다). 그래서 기존 코드가 그대로 돈다 —
     sel.value = x · sel.selectedIndex = n · sel.innerHTML = "<option…>" · sel.onchange · addEventListener("change")
     · sel.hidden · sel.disabled 전부 새 버튼에 자동 반영. 로직은 한 줄도 안 고친다.
   옵션 표기: <option value="2026-07" data-label="2026-07" data-note="미산출">2026-07 (미산출)</option>
     data-label = 보이는 이름, data-note = 오른쪽 흐린 보조 문구. 없으면 글자 그대로.
   내재화 제외: <select multiple> · <select data-native>
   ============================================================ */
(function(){
  const SEARCH_AT = 12;                 /* 옵션이 이보다 많으면 목록 맨 위에 검색칸 */
  let seq = 0, openDD = null;
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; };
  const svg = (cls, d, w) => `<svg class="${cls}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
  const CHEV = svg("dd-chev", "m6 9 6 6 6-6", 2), CHECK = svg("dd-check", "M20 6 9 17l-5-5", 2.2);
  const P = HTMLSelectElement.prototype;
  const dV = Object.getOwnPropertyDescriptor(P, "value"), dI = Object.getOwnPropertyDescriptor(P, "selectedIndex");

  const FITW = new Map();   /* 옵션 글자 → 잰 폭 */
  const FITQ = [];   /* 이번 프레임에 잴 select — 그리기 전(rAF) 한꺼번에: 쓰기 전부 → 읽기 전부 → 쓰기 전부 */
  function fitLater(p, r, d){
    FITQ.push([p, r, d]);
    if(FITQ.length === 1) requestAnimationFrame(() => {
      const q = FITQ.splice(0).filter(x => x[0]());
      q.forEach(x => x[1]()); q.forEach(x => x[2]());
    });
  }
  function ddEnhance(sel){
    if(sel._dd || sel.multiple || sel.hasAttribute("data-native")) return sel._dd;
    if(!sel.isConnected || !sel.parentNode) return null;   /* 그리는 사이 떼어진 select — 꾸밀 자리가 없다 */
    const id = "dd" + (++seq);
    const wrap = mk("span", "dd"); wrap.style.cssText = sel.style.cssText;
    const btn = mk("button", "dd-btn"); btn.type = "button";
    if(sel.classList.contains("sm")) btn.classList.add("sm");
    btn.setAttribute("role", "combobox"); btn.setAttribute("aria-haspopup", "listbox");
    btn.setAttribute("aria-expanded", "false"); btn.setAttribute("aria-controls", id + "-l");
    const forLab = sel.id ? document.querySelector('label[for="' + sel.id + '"]') : null;
    const lab = (sel.getAttribute("aria-label") || (forLab && forLab.textContent) || sel.title || "").trim();
    if(lab) btn.setAttribute("aria-label", lab);
    const list = mk("div", "dd-list"); list.id = id + "-l"; list.setAttribute("role", "listbox"); list.hidden = true;
    let q = null, act = -1, shown = [], typed = "", typedAt = 0;
    sel.parentNode.insertBefore(wrap, sel); wrap.append(sel, btn);
    const isOpen = () => btn.getAttribute("aria-expanded") === "true";
    const optLabel = o => o.dataset.label || o.text;

    const paint = () => {
      const o = sel.options[dI.get.call(sel)];
      btn.replaceChildren(mk("span", "dd-v", o ? optLabel(o) : ""));
      if(o && o.dataset.note) btn.append(mk("span", "dd-note", o.dataset.note));
      btn.insertAdjacentHTML("beforeend", CHEV);
      btn.disabled = sel.disabled; wrap.hidden = sel.hidden;
    };
    const build = () => {
      const f = q && !q.hidden ? q.value.trim().toLowerCase() : "";
      list.querySelectorAll(".dd-opt,.dd-grp,.dd-none").forEach(e => e.remove());
      shown = [];
      const cur = dI.get.call(sel);
      [...sel.options].forEach((o, i) => {
        if(f && !(optLabel(o) + " " + (o.dataset.note || "")).toLowerCase().includes(f)) return;
        const g = o.parentElement && o.parentElement.tagName === "OPTGROUP" ? o.parentElement.label : "";
        if(g && (!shown.length || shown[shown.length - 1].g !== g)) list.append(mk("div", "dd-grp", g));
        const d = mk("div", "dd-opt"); d.id = id + "-" + i; d.dataset.i = i;
        d.setAttribute("role", "option"); d.setAttribute("aria-selected", String(i === cur));
        if(o.disabled) d.setAttribute("aria-disabled", "true");
        d.insertAdjacentHTML("beforeend", CHECK);
        d.append(mk("span", "dd-t", optLabel(o)));
        if(o.dataset.note) d.append(mk("span", "dd-note", o.dataset.note));
        list.append(d); shown.push({i, g, el: d});
      });
      if(!shown.length) list.append(mk("div", "dd-none", "맞는 항목이 없어요"));
    };
    const mark = scroll => {
      shown.forEach(s => s.el.toggleAttribute("data-act", s.i === act));
      const cur = shown.find(s => s.i === act), host = q && !q.hidden ? q : btn;
      if(cur){ host.setAttribute("aria-activedescendant", cur.el.id); if(scroll) cur.el.scrollIntoView({block: "nearest"}); }
      else host.removeAttribute("aria-activedescendant");
    };
    /* 폭 — 버튼을 가장 긴 옵션에 미리 맞추고, 펼친 목록은 버튼과 **같은 폭**으로 연다.
       (목록이 버튼보다 넓으면 두 상자 끝선이 어긋나 보이고, 고른 값마다 버튼 폭이 흔들린다 — 2026-09-28 어진 "폭 안 맞춤") */
    /* 재기는 쓰기(prep) → 읽기(read) → 쓰기(done) 세 단계 — 표를 그린 직후 select 여럿을 한 번의 레이아웃으로 잰다(fitLater).
       예전엔 select 마다 getBoundingClientRect 로 문서 전체 레이아웃을 다시 해 대금 첫 화면에서 150ms 를 썼다(10/26) */
    let fq = null;
    const fitPrep = () => {
      fq = null;
      if(isOpen() || !sel.options.length) return false;
      const fk = [...sel.options].map(o => optLabel(o) + "\u0001" + (o.dataset.note || "")).join("\u0002") + (sel.classList.contains("sm") ? "|sm" : "");
      if(FITW.has(fk)){ btn.style.minWidth = FITW.get(fk); return false; }
      if(!list.isConnected) document.body.append(list);
      const qh = q ? q.hidden : null;
      build(); if(q) q.hidden = true;
      list.style.cssText = "visibility:hidden;left:-9999px;top:0;width:auto;min-width:0;max-height:none;animation:none";
      list.hidden = false;
      fq = {fk, qh, w: 0};
      return true;
    };
    const fitRead = () => { if(fq) fq.w = Math.ceil(list.getBoundingClientRect().width); };
    const fitDone = () => {
      if(!fq) return;
      const {fk, qh, w} = fq; fq = null;
      list.hidden = true; list.style.cssText = ""; if(q) q.hidden = qh;
      if(w) btn.style.minWidth = w + "px";
      if(w && (!document.fonts || document.fonts.status === "loaded")) FITW.set(fk, w + "px");   /* 웹폰트 전 폭은 안 남긴다 */
    };
    const fit = () => { if(fitPrep()){ fitRead(); fitDone(); } };
    const place = () => {
      const r = btn.getBoundingClientRect(), vh = innerHeight, gap = 4;
      list.style.width = list.style.minWidth = r.width + "px"; list.style.maxHeight = "320px"; list.style.top = r.bottom + gap + "px"; list.style.bottom = "";
      const below = vh - r.bottom - gap - 8, above = r.top - gap - 8;
      const up = list.offsetHeight > below && above > below;
      list.style.maxHeight = Math.min(320, up ? above : below) + "px";
      if(up){ list.style.top = ""; list.style.bottom = (vh - r.top + gap) + "px"; }
      list.style.left = Math.max(8, Math.min(r.left, innerWidth - list.offsetWidth - 8)) + "px";
      list.classList.toggle("up", up);
    };
    const move = d => {
      const en = shown.filter(s => !sel.options[s.i].disabled);
      if(!en.length) return;
      let k = en.findIndex(s => s.i === act);
      k = d === "home" ? 0 : d === "end" ? en.length - 1 : k < 0 ? (d > 0 ? 0 : en.length - 1) : Math.max(0, Math.min(en.length - 1, k + d));
      act = en[k].i; mark(true);
    };
    const open = () => {
      if(sel.disabled || isOpen()) return;
      if(openDD) openDD.close(false);
      (sel.closest("dialog") || document.body).append(list);   /* 모달 안이면 모달 위(top layer)에 그려야 보인다 */
      const many = sel.options.length > SEARCH_AT;
      if(many && !q){
        q = mk("input", "dd-q"); q.type = "search"; q.placeholder = "검색";
        q.setAttribute("aria-label", (lab || "항목") + " 검색"); q.setAttribute("aria-controls", list.id);
        q.oninput = () => { build(); const f = shown.find(s => !sel.options[s.i].disabled); act = f ? f.i : -1; mark(true); };
        q.onkeydown = key; list.prepend(q);
      }
      if(q){ q.hidden = !many; q.value = ""; }
      build(); act = dI.get.call(sel);
      list.classList.remove("out"); list.hidden = false; place(); mark(true);
      btn.setAttribute("aria-expanded", "true"); openDD = api;
      if(q && !q.hidden) q.focus();
    };
    const close = focus => {
      if(!isOpen()) return;
      btn.setAttribute("aria-expanded", "false"); btn.removeAttribute("aria-activedescendant"); openDD = null;
      list.classList.add("out");
      setTimeout(() => { if(!isOpen()){ list.hidden = true; list.classList.remove("out"); } }, 150);
      if(focus) btn.focus();
    };
    const pick = i => {
      const o = sel.options[i]; if(!o || o.disabled) return;
      const changed = dI.get.call(sel) !== i;
      dI.set.call(sel, i); paint(); close(true);
      if(changed){ sel.dispatchEvent(new Event("input", {bubbles: true})); sel.dispatchEvent(new Event("change", {bubbles: true})); }
    };
    function key(e){
      const k = e.key;
      if(!isOpen()){
        if(e.target === btn && ["ArrowDown", "ArrowUp", "Enter", " "].includes(k)){ e.preventDefault(); e.stopPropagation(); open(); }
        return;
      }
      const stop = () => { e.preventDefault(); e.stopPropagation(); };
      if(k === "Escape"){ stop(); close(true); return; }
      if(k === "Tab"){ close(false); return; }
      if(k === "ArrowDown" || k === "ArrowUp"){ stop(); move(k === "ArrowDown" ? 1 : -1); return; }
      if(k === "PageDown" || k === "PageUp"){ stop(); move(k === "PageDown" ? 8 : -8); return; }
      if((k === "Home" || k === "End") && !(q && !q.hidden)){ stop(); move(k === "Home" ? "home" : "end"); return; }
      if(k === "Enter" || (k === " " && !(q && !q.hidden))){ stop(); if(act >= 0) pick(act); return; }
      if(q && !q.hidden){ e.stopPropagation(); return; }            /* 검색칸 타이핑이 화면 단축키로 새지 않게 */
      if(k.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey){  /* 첫 글자로 건너뛰기 */
        stop();
        const now = Date.now(); typed = (now - typedAt < 700 ? typed : "") + k.toLowerCase(); typedAt = now;
        const hit = shown.find(s => !sel.options[s.i].disabled && optLabel(sel.options[s.i]).toLowerCase().startsWith(typed));
        if(hit){ act = hit.i; mark(true); }
      }
    }
    btn.addEventListener("keydown", key);
    btn.addEventListener("keyup", e => { if(e.key === " ") e.preventDefault(); });   /* 스페이스 keyup 의 클릭이 다시 열지 않게 */
    btn.addEventListener("click", () => isOpen() ? close(true) : open());
    list.addEventListener("pointerdown", e => { if(e.target !== q) e.preventDefault(); });   /* 포커스는 버튼(검색칸)에 둔다 */
    list.addEventListener("click", e => { const o = e.target.closest(".dd-opt"); if(o) pick(+o.dataset.i); });
    list.addEventListener("pointermove", e => { const o = e.target.closest(".dd-opt"); if(o && +o.dataset.i !== act && !o.hasAttribute("aria-disabled")){ act = +o.dataset.i; mark(false); } });
    if(forLab) forLab.addEventListener("click", e => { e.preventDefault(); btn.focus(); });

    /* 기존 코드가 값을 직접 바꿔도 버튼이 따라오게 */
    Object.defineProperty(sel, "value", {configurable: true, get(){ return dV.get.call(this); }, set(v){ dV.set.call(this, v); paint(); }});
    Object.defineProperty(sel, "selectedIndex", {configurable: true, get(){ return dI.get.call(this); }, set(v){ dI.set.call(this, v); paint(); }});
    sel.focus = () => btn.focus();
    new MutationObserver(ms => {
      paint();
      if(isOpen()){ build(); mark(false); }
      else if(ms.some(m => m.type !== "attributes" || /^(label|data-)/.test(m.attributeName))) fit();   /* 옵션이 바뀌면 폭 다시 */
    }).observe(sel, {childList: true, subtree: true, characterData: true, attributes: true,
                     attributeFilter: ["hidden", "disabled", "label", "data-label", "data-note"]});
    const api = {open, close, paint, fit, btn, list, sel};
    sel._dd = api; paint(); fitLater(fitPrep, fitRead, fitDone);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);   /* 웹폰트가 늦게 오면 폭이 달라진다 */
    return api;
  }

  /* 바깥 클릭·스크롤·창 크기 변경 → 닫기 (열린 건 언제나 하나) */
  document.addEventListener("pointerdown", e => {
    if(openDD && !openDD.btn.contains(e.target) && !openDD.list.contains(e.target)) openDD.close(false);
  }, true);
  document.addEventListener("scroll", e => { if(openDD && !openDD.list.contains(e.target)) openDD.close(false); }, true);
  addEventListener("resize", () => { if(openDD) openDD.close(false); });

  function ddEnhanceAll(root){
    (root || document).querySelectorAll("select").forEach(ddEnhance);
    if(ddEnhanceAll._mo) return;
    ddEnhanceAll._mo = new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
      if(n.nodeType !== 1) return;
      if(n.tagName === "SELECT") ddEnhance(n); else n.querySelectorAll && n.querySelectorAll("select").forEach(ddEnhance);
    })));
    ddEnhanceAll._mo.observe(document.body, {childList: true, subtree: true});
  }

  /* ── 대화상자 — alert / confirm / prompt 대신 ──
     브라우저 창은 "127.0.0.1:8765 내용:" 같은 주소를 달고, 버튼 글자("확인/취소")·서체·다크모드를 못 바꾸고,
     크롬이 "이 페이지가 추가 대화상자를 만들지 않도록" 체크로 통째로 꺼 버릴 수 있다. */
  function dialog(o){
    return new Promise(res => {
      const d = mk("dialog", "dlg"); if(o.cls) d.classList.add(o.cls);   /* 넓은 표 대화상자 등 */
      const h = mk("div", "dlg-h"); h.append(mk("h3", null, o.title || "")); d.append(h);
      const b = mk("div", "dlg-b");
      if(o.body instanceof Node) b.append(o.body); else if(o.body) b.append(mk("p", null, o.body));
      let inp = null;
      const ml = !!(o.input && o.input.multiline);   /* 메모처럼 긴 글 — textarea, Enter 줄바꿈 · Ctrl/⌘+Enter 저장 */
      if(o.input){ inp = mk(ml ? "textarea" : "input", "input"); if(ml){ inp.rows = 3; d.classList.add("wide"); } else inp.type = "text"; inp.value = o.input.value || ""; inp.placeholder = o.input.placeholder || ""; b.append(inp); }
      const grow = () => { inp.style.height = "auto"; inp.style.height = (inp.scrollHeight + 2) + "px"; };
      d.append(b);
      const f = mk("div", "dlg-f");
      const bc = o.tell ? null : mk("button", "btn ghost", o.cancel || "닫기");
      const bo = mk("button", "btn " + (o.tell ? "secondary" : o.danger ? "danger" : "primary"), o.tell ? (o.ok || "닫기") : (o.ok || "계속"));
      bc && f.append(bc); f.append(bo); d.append(f);
      let done = false;
      const end = v => {
        if(done) return; done = true;
        d.classList.add("out");
        setTimeout(() => { d.close(); d.remove(); res(v); }, 150);
      };
      const no = () => end(o.input ? null : false), yes = () => end(o.input ? inp.value : true);
      d.addEventListener("cancel", e => { e.preventDefault(); o.tell ? end(true) : no(); });
      bc && (bc.onclick = no);
      bo.onclick = () => o.tell ? end(true) : yes();
      if(inp) inp.addEventListener("keydown", e => {
        if(e.key !== "Enter" || e.isComposing || e.keyCode === 229) return;
        if(ml && !(e.ctrlKey || e.metaKey)) return;
        e.preventDefault(); yes();
      });
      if(ml) inp.addEventListener("input", grow);
      document.body.append(d); d.showModal();
      if(window.MO) MO.build(MO.items(b));   /* 팝업 본문 — 위에서 아래로 */
      (inp || (o.danger ? bc : bo)).focus();     /* 위험한 건 기본 포커스를 "닫기" 에 — Enter 한 번에 지워지지 않게 */
      if(ml){ grow(); const n = inp.value.length; inp.setSelectionRange(n, n); inp.scrollTop = inp.scrollHeight; }
    });
  }
  const ask = o => dialog(Object.assign({}, o));
  const tell = o => dialog(Object.assign({}, o, {tell: true}));

  /* 앱에 같은 이름(ask 등)이 이미 있으면 덮지 않는다 — 그때는 ui.ask() 로 부른다 */
  const pub = {ddEnhance, ddEnhanceAll, ask, tell};
  window.ui = Object.assign(window.ui || {}, pub);
  Object.keys(pub).forEach(k => { if(!(k in window)) window[k] = pub[k]; });
})();

</script>
<script>
var PRELOAD = null;
var PRELEDGER = null;
var SRV_MS = Number('0')||0;   // doGet 서버 시간(ms) — 계측용
// R007: 입고 검수(옛 «입고 건») 탭 — 아직 안 써서 «준비 중». true 면 원래 화면·배지·첫 접속 상세 미리 받기(apiDetails)가 돌아온다
var CASE_ON = false;   // CloseApi.gs CASE_ON_ 과 같이 바꾼다
// 부대비용 단계 — 어진 10/26 «관세·운임·통관은 ERP에 넣어 올린다». false 면 트랙·식·대장에서 부대비용이 빠진다
var COST_ON = false;   // CloseApi.gs COST_ON_ 과 같이 바꾼다
var TIDY = true;   // 10/27 정리: 매뉴얼 흐름 밖 표시를 숨긴다 — false 면 전부 원래대로
if(TIDY && !CASE_ON){ var tcase=document.querySelector('.tab[data-t="case"]'); if(tcase) tcase.hidden=true; }   // 10/27 정리: 숨김 — 꺼진 «입고 검수» 탭(준비 중)
var PRE_FROM = '2026-10';   // CloseEngine.gs BASE_PRE_FROM 과 같이 바꾼다 — 이 달부터 기준금액 = ERP 사전원가 · 업로드 = 마감
var S = { boot:null, ym:null, br:'', id:null, det:null, cache:{}, onlyLeft:false, day:null,
          pend:{}, saveT:null, inflight:0, el:{}, kind:null, close:null, closeYm:null, openStg:0, rst:null };

function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
var NF0=new Intl.NumberFormat('ko-KR'), NF2=new Intl.NumberFormat('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2});   // toLocaleString 은 부를 때마다 형식기를 새로 만든다 — 표 한 장에 수천 번
function fmt(n){ n=Math.round(n||0); return (n<0?'(':'')+NF0.format(Math.abs(n))+(n<0?')':''); }
function sgn(n){ return n>0?('+'+fmt(n)):fmt(n); }
function fmtu(n){ n=Number(n||0); var t=NF2.format(Math.abs(n)); return n<0?('('+t+')'):t; }
function curYm(){ var e=$('ym'); return (e&&e.value)||S.ym||null; }

var BR_DEPT = {HR:'A본부',OD:'C본부',UV:'C본부',OH:'C본부',EL:'C본부',OA:'C본부',EK:'C본부',
               GL:'B본부',SN:'B본부',UO:'운영', PR:'A본부'};

/** 관리자 전용 «담당자로 보기» — 본부 묶음, 그다음 브랜드 하나씩 */
function actAsOpts(cur){
  var by={}, order=[];
  Object.keys(BR_DEPT).forEach(function(b){ var d=BR_DEPT[b]; if(!by[d]){ by[d]=[]; order.push(d); } by[d].push(b); });
  var h='<option value="">관리자로 보기</option><optgroup label="본부 담당">';
  order.forEach(function(d){ var v=by[d].join(','); h+='<option value="'+v+'"'+(cur===v?' selected':'')+'>'+d+' 담당 ('+by[d].join('·')+')</option>'; });
  h+='</optgroup><optgroup label="브랜드 담당">';
  Object.keys(BR_DEPT).sort().forEach(function(b){ h+='<option value="'+b+'"'+(cur===b?' selected':'')+'>'+b+' 담당</option>'; });
  return h+'</optgroup>';
}

/* ── 알림은 화면 안에 ─────────────────────────── */
/** note(msg, lv, keep) — 인자 순서·의미는 그대로다(늘리기만 했다).
    lv : info(기본) 6초 · ok 3초 뒤 스스로 사라진다.
         warn 6초. bad 는 남는다. «done» 을 새로 뒀다 — 남는다.
    keep : 참이면 등급과 무관하게 남는다(기존 그대로).
    결과 알림(«무엇이 몇 건 적용됐다»)은 done 으로 띄운다 —
    3초 만에 사라지면 아래쪽에서 일하던 사람은 결과를 본 적이 없게 된다. */
function note(msg, lv, keep){
  lv = lv || 'info';
  var stay = !!keep || lv==='bad' || lv==='done';
  var d=document.createElement('div');
  d.className='note '+lv;
  d.innerHTML='<span class="t">'+esc(msg)+'</span>'
    +(stay?('<span class="w">'+hm_()+'</span>'):'')
    +'<button class="x" title="닫기">✕</button>';
  d.querySelector('.x').onclick=function(){ d.remove(); fitNotes_(); };
  $('notes').appendChild(d);
  trimNotes_();
  // 남기는 알림도 스스로 사라진다 — 하나씩 닫아야 하는 것이 쌓이면 그게 일거리가 된다.
  // 실패(bad)만 사람이 닫을 때까지 남는다.
  if(lv!=='bad'){
    var ms = (lv==='ok' && !keep) ? 3000 : (lv==='info' && !keep ? 6000 : 12000);
    setTimeout(function(){ d.remove(); fitNotes_(); }, ms);
  }
  return d;
}
function hm_(){ var t=new Date();
  return ('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2); }
/* 남는 알림이 쌓여 화면을 덮지 않게 — 여섯 개를 넘으면 오래된 것부터 접는다 */
function trimNotes_(){
  var b=$('notes'); while(b.children.length>6) b.removeChild(b.firstChild);
  fitNotes_();
}
/* 맨 아래까지 내렸을 때 알림이 밑의 글을 덮지 않게 그만큼 자리를 비워 둔다 —
   결과를 보라고 띄운 것이 정작 그 사람이 읽던 줄을 가리면 앞뒤가 안 맞는다 */
function fitNotes_(){
  var b=$('notes'); if(!b) return;

function brBtnLabel(){

/* 목록 항목 — 맨 위 둘은 한 번에 정하는 것(내 담당·전체), 아래는 하나씩 켜고 끄는 브랜드 */
function brOpts(){
  var m=brandsOfMonth(), keys=Object.keys(m).sort(function(a,b){ return m[b].sku-m[a].sku; });
  var mine=brMine(), s=brSet()||[], out=[];
  var row=function(b,g){ return {v:b, label:b, note:BR_DEPT[b]||'', grp:g, sel:s.indexOf(b)>=0}; };
  if(mine){

    out.push({v:'ALL', label:'전체 브랜드', note:'', sel:S.br==='ALL'});
    keys.filter(function(b){ return mine.indexOf(b)>=0; }).forEach(function(b){ out.push(row(b,'내 담당')); });
    keys.filter(function(b){ return mine.indexOf(b)<0; }).forEach(function(b){ out.push(row(b,'다른 브랜드')); });
  }else{
    out.push({v:'', label:'전체 브랜드', note:(S.boot.rows||[]).length+'건', sel:!S.br});

function brOpen(){

/** 라인시트에 있는데 아직 건이 안 된 차수 — 사람이 만들지 않는다, 이미 떠 있다 */
function visPending(){

    var bs=(p.styles||[]).map(function(x){ return String(x).slice(0,2).toUpperCase(); });

  }).map(function(p){ var o={}; for(var k in p) o[k]=p[k]; o.pending=true; return o; });
}
function pendTags(p){
  var seen={}, out=[];
  (p.styles||[]).forEach(function(x){
    var b=String(x).slice(0,2).toUpperCase();
    if(!seen[b]){ seen[b]=1; out.push('<span class="dp '+(BR_DEPT[b]||'')+'">'+esc(b)+'</span>'); }
  });

function visRows(){
  return (S.boot.rows||[]).filter(function(r){

    return (r.brands||[]).some(brShow);
  });
}
/* 고른 브랜드들의 칸을 더한다 */
function cB(r){ var s=brSet(); if(!s) return null; return s.map(function(b){ return r.B&&r.B[b]; }).filter(Boolean); }
function cv(r,k){
  var cs=cB(r); if(!cs) return r[k];
  var v=0; cs.forEach(function(c){ v+=(c[k]||0); }); return v;

function cbr(r){ var s=brSet(); return s ? s.filter(function(b){ return r.B&&r.B[b]; }) : (r.brands||[]); }
function cstate(r){

  if(!cs.length) return '–';
  if(r.state==='확인 완료') return '확인 완료';
  var need=0; cs.forEach(function(c){ need+=(c.need||0); });
  if(need) return '사유 '+need+'건 미선택';
  if(!cs.some(function(c){ return c.diff; })) return r.has_wms?'전량 입고':'예정만';
  return '검수 완료';

function stCls(st){
