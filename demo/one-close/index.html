/* ── 검수 패널 ────────────────────────────────── */
function detRows(){
  var R=(S.det&&S.det.rows)||[];
  var s=brSet(); if(!s) return R;   // 검수 패널은 브랜드를 고른 때만 좁힌다 — 건 하나 안에서 줄이 숨으면 검수가 빠진다
  return R.filter(function(r){ return s.indexOf(String(r.item||'').slice(0,2).toUpperCase())>=0; });
}
function inA(x){ return !!(S.det && S.det.reasons.a.indexOf(x)>=0); }
function inB(x){ return !!(S.det && S.det.reasons.b.indexOf(x)>=0); }

/** 목록을 보는 동안 상세를 미리 받아 둔다 — 누르는 순간 기다릴 일이 없게.
 *  서버는 한 건에 몇 ms 라 40건을 한 번에 받아도 싸다. 비싼 건 왕복이다. */
function prefetch(){
  if(S.pf) return;
  var want=visRows().filter(function(r){ return !S.cache[r.id]; })
                    .sort(function(a,b){ return (isLeft(b)?1:0)-(isLeft(a)?1:0); })
                    .slice(0,40).map(function(r){ return r.id; });
  // 월마감 장부는 보이지 않는 탭이다 — 상세 미리 받기가 끝난 뒤 유휴 시간에 받는다(탭을 누르면 그때 바로 받는다).
  // 예전엔 첫 화면에서 apiLedger·apiMemoList 가 apiDetails 와 같은 시트를 동시에 읽어 서로 늦췄다(콜드 32초).
  if(!want.length){ prefetchIdle(); return; }
  S.pf=1;
  var ym0=S.ym;
  run('apiDetails',[S.ym,want],function(m){
    S.pf=0;
    if(S.ym!==ym0) return;   // 받는 사이 달을 바꿨다 — 옛 달 상세를 새 달 캐시에 넣지 않는다
    Object.keys(m||{}).forEach(function(k){ if(!S.cache[k]) S.cache[k]=m[k]; });
    prefetchIdle();
  },function(){ S.pf=0; prefetchIdle(); });
}
function prefetchIdle(){
  var go=function(){ if(!S.close && typeof closeBoot==='function') closeBoot(S.ym, true); perfSend(); };
  if(window.requestIdleCallback) requestIdleCallback(go,{timeout:3000}); else setTimeout(go,1200);
}

function openDetail(id){
  flush(true);
  S.id=id;
  $('tl').querySelectorAll('.tlc').forEach(function(el){
    el.className='tlc'+(el.getAttribute('data-id')===id?' on':''); });
  if(S.cache[id]){ S.det=S.cache[id]; renderInsp(); toInsp(); return; }
  $('insp').innerHTML='<div class="insp"><div class="skel">여는 중…</div></div>';
  var ym1=S.ym;
  run('apiDetail',[S.ym,id],function(d){
    if(S.ym===ym1) S.cache[id]=d;
    if(S.id!==id || S.ym!==ym1) return;   // 그사이 다른 건을 눌렀다
    S.det=d;
    try{ renderInsp(); toInsp(); }
    catch(err){ $('insp').innerHTML=''; note('화면을 그리다 멈췄습니다 — '+((err&&err.message)||err),'bad',true); }
  },function(m){ $('insp').innerHTML=''; note('건을 열지 못했습니다 — '+m,'bad',true); });
}

/** 검수 화면으로 데려간다. 노트북처럼 세로가 짧으면 목록에 가려 안 보인다. */
function toInsp(){
  var el=$('insp'); if(!el || !el.firstChild) return;
  setTimeout(function(){
    try{ el.scrollIntoView({behavior:'smooth', block:'start'}); }
    catch(e){ el.scrollIntoView(true); }
  }, 40);
}

function inspSum(){
  var R=detRows(), sheet=0, plan=0, act=0, need=0, amt=0, D=0, gap=0;
  R.forEach(function(r){
    r.diff=r.act-r.plan; r.amt=r.diff*r.cost;
    var ga=r.reasons.some(inA), gb=r.reasons.some(inB);
    r.kind=(ga&&gb)?'둘 다':(ga?'오부착':(gb?'실수량부족':''));
    sheet+=(r.sheet||r.plan); plan+=r.plan; act+=r.act; amt+=r.amt;
    if((r.sheet||r.plan)!==r.plan) gap++;
    if(r.diff){ D++; if(!r.reasons.length) need++; }
  });
  return { sheet:sheet, plan:plan, act:act, diff:act-plan, gap:gap, need:need, D:D, amt:amt, sku:R.length,
           state: !D ? (R.some(function(r){return r.wms!=null;})?'전량 입고':'예정만')
                     : (need?('사유 '+need+'건 미선택'):'검수 완료') };
}

/** 누구의 차례인가 — 생산이 명세서로 맞추고 의뢰해야 물류가 검수한다 */
function inspRole(){
  var d=S.det, asked=!!(d&&d.summary&&d.summary.asked);
  var canP=S.boot.canProd, canL=S.boot.canLogi;
  if(canP && !asked) return 'prod';        // 아직 의뢰 전 — 생산 차례
  if(canL) return 'logi';
  if(canP) return 'prod';
  return 'view';
}

function renderInsp(){
  if(!S.det){ $('insp').innerHTML=''; return; }
  var d=S.det, meta=d.meta||{}, R=detRows(), T=inspSum();
  var mode=inspRole(), prod=(mode==='prod'), logi=(mode==='logi');
  var asked=String((d.summary&&d.summary.asked)||'');
  var locked=(d.summary&&d.summary.state==='확인 완료')&&!S.boot.canFin;
  var edit=!locked && (prod?S.boot.canProd:(logi&&S.boot.canLogi));

  var sizes={}; R.forEach(function(r){ sizes[r.size]=1; });
  var SZ=(d.sizes||[]).filter(function(x){ return sizes[x]; });
  if(!SZ.length) SZ=Object.keys(sizes);

  var by={}, order=[];
  R.forEach(function(r){ var k=r.item+'|'+r.cc;
    if(!by[k]){ by[k]={item:r.item,cc:r.cc,color:r.color,name:r.name,cost:r.cost,c:{}}; order.push(k); }
    by[k].c[r.size]=r; });

  var h='<div class="insp">'
    +'<div class="insph"><b>'+esc(meta['출고일']||'')+' · '+esc(meta['출고처']||'')+'</b>'
    +(meta['입고처']?'<span class="mut" style="font-size:12px">→ '+esc(meta['입고처'])+'</span>':'')
    +'<span class="pill '+(prod?(T.gap?'warn':'ok'):stCls(T.state))+'">'
      +(prod?(T.gap?('라인시트 차이 '+T.gap+'칸'):'라인시트 일치'):esc(T.state))+'</span>'
    +(asked?'<span class="pill acc" title="'+esc(asked)+'">검수 의뢰됨</span>':'')
    +(brSet()?'<span class="pill mut">'+esc(brSet().join('·'))+'만</span>':'')
    +'<span style="margin-left:auto">'
      +(prod&&edit?'<button class="btn sm" id="iPack">입고명세서 업로드</button> ':'')
      +(logi&&edit?'<button class="btn sm" id="iWms">WMS 전표 업로드</button> ':'')
      +(canDrop()?'<button class="btn sm dgr" id="iDrop">건 삭제</button> ':'')
      +'<button class="btn sm" id="iClose">닫기</button></span></div>'
    +'<div class="mine">'+(prod
        ? '① 예정 확정 — 라인시트에서 끌어온 수량입니다. <b>입고명세서 보고 맞춘 뒤 [검수 의뢰]</b> 를 누르면 물류로 넘어갑니다.'
        : (logi ? '② 검수 — 실수량은 WMS 값이 기본입니다. 세어 보니 다른 칸만 고치고 사유를 고르세요.'
                : '읽기 전용'))+'</div>'
    +'<div class="inspsum">'
      +'<div><div class="k">SKU</div><div class="v">'+fmt(T.sku)+'</div></div>'
      +'<div><div class="k">라인시트 <span class="hint">발주</span></div><div class="v">'+fmt(T.sheet)+'</div></div>'
      +'<div><div class="k">명세서 <span class="hint">거래처</span></div><div class="v" data-s="plan">'+fmt(T.plan)+'</div></div>'
      +'<div><div class="k">실입고 <span class="hint">검수</span></div><div class="v" data-s="act">'+(prod?'—':fmt(T.act))+'</div></div>'
      +(prod
        ? '<div><div class="k">발주 대비</div><div class="v '+(T.plan-T.sheet<0?'neg':(T.plan-T.sheet>0?'pos':''))+'" data-s="vs">'
            +((T.plan-T.sheet)?sgn(T.plan-T.sheet):'0')+'</div></div>'
          +'<div><div class="k">다른 칸</div><div class="v '+(T.gap?'neg':'')+'" data-s="gap">'+T.gap+'</div></div>'
        : '<div><div class="k">과부족</div><div class="v '+(T.diff<0?'neg':(T.diff>0?'pos':''))+'" data-s="diff">'+(T.diff?sgn(T.diff):'0')+'</div></div>'
          +'<div><div class="k">사유 필요</div><div class="v '+(T.need?'neg':'')+'" data-s="need">'+T.need+'</div></div>')
    +'</div>'
    +'<div class="tw" style="max-height:340px;overflow:auto"><table><thead><tr>'
    +'<th>품번</th><th>컬러</th><th class="n">단가</th>'
    + SZ.map(function(z){ return '<th class="n">'+esc(z)+'</th>'; }).join('')
    + (prod ? '<th class="n">라인시트</th><th class="n">명세서</th><th class="n">차이</th><th>비고</th>'
            : '<th class="n">명세서</th><th class="n">실입고</th><th class="n">과부족</th><th>사유</th>')
    +'</tr></thead><tbody>';

  order.forEach(function(k){
    var g=by[k], gs=0, gp=0, ga=0, gd=0, gneed=0, ggap=0;
    SZ.forEach(function(z){ var r=g.c[z]; if(!r) return;
      gs+=(r.sheet||r.plan); gp+=r.plan; ga+=r.act; gd+=r.diff;
      if((r.sheet||r.plan)!==r.plan) ggap++;
      if(r.diff&&!r.reasons.length) gneed++; });
    h+='<tr data-g="'+esc(k)+'" class="'+(prod?(ggap?'diff':''):(gneed?'need':(gd?'diff':'')))+'">'
      +'<td class="mono">'+esc(g.item)+'<br><span class="hint">'+esc(g.name||'')+'</span></td>'
      +'<td class="mono">'+esc(g.cc)+'</td><td class="n">'+fmt(g.cost)+'</td>';
    SZ.forEach(function(z){
      var r=g.c[z];
      if(!r){ h+='<td class="n mut">–</td>'; return; }
      if(prod){
        h+='<td class="n"><span class="hint">'+fmt(r.sheet||r.plan)+'</span><br>'
          +(edit?'<input class="q" type="text" inputmode="numeric" value="'+r.plan+'" data-p="'+esc(r.k)+'">':'<b>'+fmt(r.plan)+'</b>')+'</td>';
      }else{
        h+='<td class="n"><span class="hint">'+fmt(r.plan)+'</span><br>'
          +(edit?'<input class="q" type="text" inputmode="numeric" value="'+r.act+'" data-k="'+esc(r.k)+'">':'<b>'+fmt(r.act)+'</b>')+'</td>';
      }
    });
    if(prod){
      var g2=gp-gs;
      h+='<td class="n hint">'+fmt(gs)+'</td><td class="n" data-c="p"><b>'+fmt(gp)+'</b></td>'
        +'<td class="n" data-c="d" style="color:'+(g2?'var(--bad)':'var(--ink-3)')+'">'+(g2?sgn(g2):'–')+'</td>'
        +'<td class="hint" data-c="m">'+(g2?(g2<0?'미납 — 다음 차수 이월':'초과 납품'):'')+'</td></tr>';
    }else{
      h+='<td class="n">'+fmt(gp)+'</td><td class="n" data-c="a"><b>'+fmt(ga)+'</b></td>'
        +'<td class="n" data-c="d" style="color:'+(gd?'var(--bad)':'var(--ink-3)')+'">'+(gd?sgn(gd):'–')+'</td>'
        +'<td data-c="r">'+rsCell(g,SZ,edit)+'</td></tr>';
    }
  });
  h+='</tbody></table></div><div class="inspft">';
  if(prod){
    h+=(edit?'<button class="btn go" id="iAsk">검수 의뢰</button>':'')
      +'<span class="hint">이 수량이 물류에게 넘어갑니다. 라인시트와 달라도 <b>명세서가 기준</b>입니다.</span>';
  }else if(logi){
    h+=(edit?('<button class="btn go" id="iDone"'+(T.need?' disabled':'')+'>확인 완료</button>'):'')
      +'<span class="hint">'+(T.need?('어긋난 칸 '+T.need+'개에 사유를 골라야 누를 수 있습니다.')
        :'이 건이 닫히고 월마감 대사로 넘어갑니다.')+'</span>';
  }else{
    h+='<span class="hint">상태: '+esc(T.state)+'</span>';
  }
  h+='<span class="hint" id="iSaved" style="margin-left:auto"></span></div></div>';

  $('insp').innerHTML=h;
  $('iClose').onclick=function(){ S.id=null; S.det=null; $('insp').innerHTML=''; renderTl(); };
  if($('iDrop')) $('iDrop').onclick=dropRec;
  if($('iWms')) $('iWms').onclick=function(){ pick('wms', S.id); };
  if($('iPack')) $('iPack').onclick=function(){ pick('pack', S.id); };
  if($('iDone')) $('iDone').onclick=onDone;
  if($('iAsk')) $('iAsk').onclick=onAsk;
  bindCells();
}

/** 생산 — 검수 의뢰 */
function onAsk(){
  flush(); work(true,'검수 의뢰 중…');
  run('apiAskReview',[S.ym,S.id,true],function(res){
    work(false);
    if(res&&res.summary){
      S.det.summary=res.summary;
      if(S.cache[S.id]) S.cache[S.id].summary=res.summary;
      var rows=S.boot.rows||[];
      for(var i=0;i<rows.length;i++) if(rows[i].id===S.id){ rows[i]=res.summary; break; }
    }
    renderInsp(); renderAll();
    note('검수를 의뢰했습니다 — 물류에서 실수량을 확인합니다','done');
  });
}

/** 사유 칸 — 그 품번·컬러에서 어긋난 줄이 있을 때만 */
function rsCell(g, SZ, editable){
  var rs=[], any=null;
  SZ.forEach(function(z){ var r=g.c[z]; if(r&&r.diff){ any=r; r.reasons.forEach(function(x){ if(rs.indexOf(x)<0) rs.push(x); }); } });
  if(!any) return '<span class="mut">–</span>';
  if(!editable) return '<span class="hint">'+esc(rs.join(', ')||'미선택')+'</span>';
  var A=(S.det.reasons.a||[]), B=(S.det.reasons.b||[]);
  return '<select class="rs" data-rk="'+esc(g.item+'|'+g.cc)+'">'
    +'<option value="">— 사유 —</option>'
    +'<optgroup label="오부착 (차월 입고)">'+A.map(function(x){
        return '<option'+(rs.indexOf(x)>=0?' selected':'')+'>'+esc(x)+'</option>'; }).join('')+'</optgroup>'
    +'<optgroup label="부족">'+B.map(function(x){
        return '<option'+(rs.indexOf(x)>=0?' selected':'')+'>'+esc(x)+'</option>'; }).join('')+'</optgroup>'
    +'</select>';
}

/** 예정을 잘못 눌러 생긴 건은 되돌릴 수 있어야 한다.
 *  라인시트에서 온 건이고, 아직 아무도 검수·확정하지 않았을 때만. */
function canDrop(){
  var d=S.det, m=d&&d.meta, sm=d&&d.summary;
  if(!S.boot.canProd || !m) return false;
  if(String(m['출처']||'')!=='라인시트') return false;
  // act 는 WMS·검수가 없으면 «예정 수량» 이 그대로 들어온다 — 손댔는지의 잣대가 못 된다.
  // 아직 «예정만» 인 건, 즉 아무도 검수를 시작하지 않은 건만 되돌린다.
  if(sm && (sm.has_wms || sm.re_q || String(sm.state||'')!=='예정만')) return false;
  if(String(m['상태']||'')==='확정') return false;
  return true;
}
function dropRec(){
  var m=S.det&&S.det.meta; if(!m) return;
  var b=$('iDrop');
  if(b && b.getAttribute('data-ask')!=='1'){          // 팝업 대신 버튼이 직접 묻는다
    b.setAttribute('data-ask','1');
    b.textContent='재클릭 시 삭제';
    b.classList.add('go');
    setTimeout(function(){
      if(b && b.getAttribute('data-ask')==='1'){
        b.removeAttribute('data-ask'); b.textContent='건 삭제'; b.classList.remove('go');
      }
    }, 5000);
    return;
  }
  work(true,'삭제 중…');
  run('apiDelete',[S.ym,S.id],function(){
    S.cache={}; S.id=null; S.det=null; $('insp').innerHTML='';
    run('apiBoot',[S.ym],function(b){
      work(false); S.boot=b; renderBrands(); renderAll();
      note('지웠습니다 — 예정 목록에 다시 떴습니다','done');
    });
  },function(msg){ work(false); note(msg,'bad',true); });
}

function rowOf(k){ var R=(S.det&&S.det.rows)||[]; for(var i=0;i<R.length;i++) if(R[i].k===k) return R[i]; return null; }

/** 한 줄과 위쪽 요약만 고쳐 쓴다 — 표를 다시 그리면 포커스와 스크롤이 날아간다 */
function patchRow(k){
  var d=S.det; if(!d) return;
  var mode=inspRole(), prod=(mode==='prod');
  var row=rowOf(k); if(!row) return;
  var gk=row.item+'|'+row.cc;
  var tr=$('insp').querySelector('tr[data-g="'+cssq(gk)+'"]');
  if(tr){
    var gs=0,gp=0,ga=0,gd=0,gneed=0,ggap=0;
    (d.rows||[]).forEach(function(r){
      if(r.item+'|'+r.cc!==gk) return;
      gs+=(r.sheet||r.plan); gp+=r.plan; ga+=r.act; gd+=(r.act-r.plan);
      if((r.sheet||r.plan)!==r.plan) ggap++;
      if((r.act-r.plan)&&!r.reasons.length) gneed++;
    });
    var c;
    if(prod){
      if((c=tr.querySelector('[data-c="p"]'))) c.innerHTML='<b>'+fmt(gp)+'</b>';
      var g2=gp-gs;
      if((c=tr.querySelector('[data-c="d"]'))){ c.textContent=g2?sgn(g2):'–';
        c.style.color=g2?'var(--bad)':'var(--ink-3)'; }
      if((c=tr.querySelector('[data-c="m"]'))) c.textContent=g2?(g2<0?'미납 — 다음 차수 이월':'초과 납품'):'';
      tr.className=ggap?'diff':'';
    }else{
      if((c=tr.querySelector('[data-c="a"]'))) c.innerHTML='<b>'+fmt(ga)+'</b>';
      if((c=tr.querySelector('[data-c="d"]'))){ c.textContent=gd?sgn(gd):'–';
        c.style.color=gd?'var(--bad)':'var(--ink-3)'; }
      tr.className=gneed?'need':(gd?'diff':'');
    }
  }
  patchSum();
}

/** 위쪽 숫자 타일과 아래쪽 버튼 상태만 */
function patchSum(){
  var T=inspSum(), mode=inspRole(), prod=(mode==='prod');
  function set(name,txt,cls){
    var el=$('insp').querySelector('[data-s="'+name+'"]'); if(!el) return;
    el.textContent=txt;
    el.className='v'+(cls?(' '+cls):'');
  }
  set('plan',fmt(T.plan));
  if(!prod) set('act',fmt(T.act));
  if(prod){
    var v=T.plan-T.sheet;
    set('vs',v?sgn(v):'0', v<0?'neg':(v>0?'pos':''));
    set('gap',String(T.gap), T.gap?'neg':'');
  }else{
    set('diff',T.diff?sgn(T.diff):'0', T.diff<0?'neg':(T.diff>0?'pos':''));
    set('need',String(T.need), T.need?'neg':'');
  }
  var done=$('iDone');
  if(done){
    done.disabled=!!T.need;
    var hint=done.nextElementSibling;
    if(hint&&hint.className==='hint')
      hint.textContent=T.need?('어긋난 칸 '+T.need+'개에 사유를 골라야 누를 수 있습니다.')
                             :'이 건이 닫히고 월마감 대사로 넘어갑니다.';
  }
  var pill=$('insp').querySelector('.insph .pill');
  if(pill&&prod){
    pill.textContent=T.gap?('라인시트 차이 '+T.gap+'칸'):'라인시트 일치';
    pill.className='pill '+(T.gap?'warn':'ok');
  }
}

/** 속성 선택자에 넣을 수 있게 따옴표를 막는다 */
function cssq(v){ return String(v).replace(/"/g,'\\"'); }

function bindCells(){
  S.el={};
  $('insp').querySelectorAll('input.q[data-k]').forEach(function(inp){
    var k=inp.getAttribute('data-k'); S.el[k]=inp;
    inp.onchange=function(){
      var r=rowOf(k); if(!r) return;
      r.act=Math.max(0, parseInt(String(inp.value).replace(/[^\d]/g,''))||0);
      inp.value=r.act;
      queue(k,{act:r.act}); patchRow(k);
    };
  });
  // 생산 — 명세서 수량
  $('insp').querySelectorAll('input.q[data-p]').forEach(function(inp){
    var k=inp.getAttribute('data-p');
    inp.onchange=function(){
      var r=rowOf(k); if(!r) return;
      var v=Math.max(0, parseInt(String(inp.value).replace(/[^\d]/g,''))||0);
      r.plan=v; if(r.wms===null) r.act=v;
      inp.value=v;
      var one={}; one[k]=v;
      mark('저장 중…');
      run('apiPlanEdit',[S.ym,S.id,one],function(res){
        mark('저장됨 ✓','on');
        if(res&&res.summary){ S.det.summary=res.summary;
          if(S.cache[S.id]) S.cache[S.id].summary=res.summary; }
        renderTl(); renderCal(); syncTabs();
      },function(m){ mark('저장 실패','err'); note(m,'bad',true); });
      patchRow(k);
    };
  });
  $('insp').querySelectorAll('select.rs').forEach(function(sel){
    sel.onchange=function(){
      var key=sel.getAttribute('data-rk'), v=sel.value;
      (S.det.rows||[]).forEach(function(r){
        if(r.item+'|'+r.cc!==key || !r.diff) return;
        r.reasons = v?[v]:[];
        queue(r.k,{reasons:r.reasons});
      });
      patchRow(key.split('|')[0]+'|'+key.split('|')[1]+'|'+(S.det.sizes||[''])[0]);
      patchSum();
    };
  });
}
function queue(k,patch){
  S.pend[k]=Object.assign(S.pend[k]||{},patch);
  mark('저장 중…');
  clearTimeout(S.saveT); S.saveT=setTimeout(flush,700);
}
function mark(t,cls){ var e=$('iSaved'); if(e){ e.textContent=t; e.style.color=cls==='err'?'var(--bad)':(cls==='on'?'var(--ok)':'var(--ink-3)'); } }
function flush(sync){
  clearTimeout(S.saveT);
  var keys=Object.keys(S.pend); if(!keys.length) return;
  var body=S.pend, ym=S.ym, id=S.id; S.pend={}; S.inflight++;
  run('apiReview',[ym,id,body],function(res){
    S.inflight--; S.saveTry=0;
    if(res&&res.summary&&S.cache[id]) S.cache[id].summary=res.summary;
    if(S.id===id&&!S.inflight&&!Object.keys(S.pend).length) mark('저장됨 ✓','on');
    var rows=S.boot.rows||[];
    for(var i=0;i<rows.length;i++) if(rows[i].id===id && res&&res.summary){ rows[i]=res.summary; break; }
    renderTl(); renderCal(); syncTabs();
  },function(m){ S.inflight--;
    // 친 값을 버리지 않는다 — 새로 친 값이 이긴다
    if(S.id===id && S.ym===ym){ Object.keys(body).forEach(function(k){ S.pend[k]=Object.assign({}, body[k], S.pend[k]||{}); }); }
    S.saveTry=(S.saveTry||0)+1;
    if(S.saveTry<=3 && S.id===id){ mark('저장 재시도 중…','err'); clearTimeout(S.saveT); S.saveT=setTimeout(flush, 3000); return; }
    S.saveTry=0; mark('저장 실패','err'); note('저장하지 못했습니다 — '+m,'bad',true); });
}
function onDone(){
  var on=true;
  flush(); work(true,'확인 처리 중…');
  run('apiConfirm',[S.ym,S.id,on],function(res){
    work(false);
    if(res&&res.summary){
      S.det.summary=res.summary;
      if(S.cache[S.id]) S.cache[S.id].summary=res.summary;
      var rows=S.boot.rows||[];
      for(var i=0;i<rows.length;i++) if(rows[i].id===S.id){ rows[i]=res.summary; break; }
    }
    renderInsp(); renderAll();
    note('확인 완료 — 월마감 대사로 넘어갑니다','done');
  });
}

/** 예정 줄을 누르면 그 자리에서 건이 되고 조정 화면이 열린다.
 *  «건 만들기» 라는 행위를 사람에게 시키지 않는다. */
function makeFromPending(key, el){
  if(!S.boot.canProd){ note('생산 담당자만 확정할 수 있습니다','warn'); return; }
  var p=(S.boot.pending||[]).filter(function(x){ return x.key===key; })[0];
  if(!p) return;
  // 누르는 즉시 그 줄을 «만드는 중» 으로 바꾼다 — 서버는 몇 초 걸리고, 그동안 멍하니 두지 않는다
  if(el){ el.style.opacity='.45'; el.classList.add('busy'); el.style.pointerEvents='none';
    var pill=el.querySelector('.pill'); if(pill){ pill.className='pill busy'; pill.title='건 생성 중'; } }   // 글자를 바꾸면 폭이 변한다
  work(true,(p['출고처']||'')+' 예정을 건으로 만드는 중…');
  run('apiFromLs',[S.ym,key,p['입고처']||'',p['출고일']||''],function(res){
    work(false); S.cache={};
    // 목록을 통째로 다시 받지 않는다 — 새 줄을 끼우고 그 예정만 뺀다
    if(res&&res.row){
      S.boot.rows=(S.boot.rows||[]).filter(function(x){ return x.id!==res.row.id; }).concat([res.row]);
      S.boot.pending=(S.boot.pending||[]).filter(function(x){ return x.key!==key; });
      renderBrands(); renderAll();
    }
    if(res&&res.id) openDetail(res.id);
    note((p['출고처']||'')+' 건이 열렸습니다 — 입고명세서 수량으로 맞춰 주세요','done');
  },function(m){ work(false);
    if(el){ el.style.opacity=''; el.classList.remove('busy'); el.style.pointerEvents=''; }
    note(m,'bad',true); });
}

/* ── 파일 올리기 ──────────────────────────────── */
/** 파일 하나를 서버로 보낸다. 고르기와 끌어놓기가 같은 길을 쓴다. */
/** at(frac, label) 을 주면 이 파일 안의 진행(0~1)을 그쪽에 넘긴다 —
    여러 개를 올릴 때 바깥이 «몇 번째 중 어디» 로 바꿔 막대를 채운다.
    안 주면 스스로 hold.step(label) 만 한다. */
function sendFile(kind, file, then, at){
  if(!file) return;
  var say=function(f,label){ if(at) at(f,label); else work(true,label||'업로드 중…'); };
  var fr=new FileReader();
  var ym=curYm()||S.ym;                         // «보낸 당시» 의 달을 붙잡아 둔다
  say(0, file.name+' 판독 중…');
  fr.onload=function(){
    var ab=fr.result;
    var go=function(pre){
      var b64 = pre ? '' : ab2b64_(ab);
      var api = (kind==='close')?'apiCloseUpload' : (kind==='uni'?'apiUnipassUpload':'apiUpload');
      var args = (kind==='close'||kind==='uni')
        ? [ym,file.name,b64,file.type,pre||'', (at&&at.last===false)?false:true]
        : [ym,(kind==='wms'?(S.upId||S.id):(kind==='pack'?(S.upId||null):null)),kind,file.name,b64,file.type];
      say(.5, file.name+' 전송 중…');
      run(api,args,onOk,onFail);
    };
    // ERP·유니패스는 브라우저가 읽는다. 검수 파일(예정·패킹·WMS)은 서버 판독 규칙이 달라 예전 길 그대로.
    if(kind==='close'||kind==='uni'){
      xlsxLib(function(X){
        var pre='';
        if(X){ try{ pre=JSON.stringify(xlsxSheets_(X,new Uint8Array(ab))); }catch(e){ pre=''; } }
        go(pre);
      });
    } else go('');
  };
  var onOk=function(r){
      say(1, file.name+' 완료');
      if(then){ then(null, r); return; }
      work(false);
      note(upWhat_(kind, file, r), 'done');
      // 올리는 사이에 달을 바꿨으면 화면 갱신은 버린다 —
      // 9월을 보고 있는데 8월 숫자로 덮어쓰는 일이 여기서 났다(closeBoot 에는 있던 방어다)
      if(String(ym)!==String(curYm()||S.ym)){
        note('올리는 사이 달을 바꿔 화면은 그대로 뒀습니다 — '+ym+' 에는 올라갔습니다','warn',true);
        return;
      }
      if(kind==='close'||kind==='uni'){ if(!useLedger(r&&r.ledger)){ S.close=null; closeBoot(ym,true); } }
      else { S.cache={}; boot(ym,true); if(S.id) openDetail(S.id); }
  };
  var onFail=function(m){
      // 실패해도 다음 파일로 넘어간다 — 여기서 멈추면 3개 중 2번째가 깨졌을 때
      // 3번째는 영영 안 올라가고 화면은 아무 말도 안 했다
      if(then){ then(String(m)); return; }
      work(false);
      note(file.name+' — '+m,'bad',true);
  };
  fr.onerror=fr.onabort=function(){ onFail('파일을 읽지 못했어요 — 다시 골라 주세요'); };
  fr.readAsArrayBuffer(file);
}

/** 업로드 끝 — «{달} 입고 마감됨». 숫자만. «대금 확인하기» → 대금 탭 입고월·그 달·그 본부, 올린 건 강조 */
function upPop_(ym, R){
  if(typeof PY!=='undefined') PY.d=null;   // 대금 탭은 다음에 열 때 그 달 목록을 다시 받는다(새 업로드 반영)
  if(!R.length || !ui || !ui.ask) return;
  var br={}, n=0, pre=0, P={};
  R.forEach(function(r){ (r.brands||[]).forEach(function(b){ br[b]=1; }); n+=r.rows||0; pre+=r.pre||0;
    ((r.pay||{}).rows||[]).forEach(function(x){ P[x.k]=x; }); });   // 같은 건은 마지막 계산
  var ks=Object.keys(P), T=0, bad=[], ds={};
  ks.forEach(function(k){ var x=P[k]; ds[x.d]=1; if(x.T===null && x.usd) bad.push(k); else T+=x.T||0; });
  var row=function(k,v,t){ return '<div class="upp-r"'+(t?' title="'+esc(t)+'"':'')+'><span class="hint">'+k+'</span><b>'+v+'</b></div>'; };
  var box=document.createElement('div'); box.className='upp';
  box.innerHTML=row('브랜드',esc(Object.keys(br).sort().join('·')))+row('행',fmt(n))+row('사전원가',fmt(pre))
    +row('대금 건',fmt(ks.length))
    +row('자동 대금',fmt(T)+(bad.length?' <span class="sd sd-bad" title="환율 없는 수입 '+bad.length+'건">'+bad.length+'</span>':''),'국내 사전원가×1.1 + 수입 USD×환율');
  ui.ask({title:ym+' 입고 마감됨', body:box, ok:'대금 확인', cancel:'닫기'}).then(function(y){ if(y) payGoUp(ym, Object.keys(ds), ks, bad);
    else if(window.MO) Object.keys(br).forEach(function(b){ MO.ring(document.querySelector('#pClose .chip[data-br="'+b+'"]')); }); });
}

/** 10월~ 업로드 = 마감 — V1~V4 실패는 막지 않고 빨간 ! 로만 알린다 */
function vWarn_(L){
  var c=L&&L.close; if(!c||!c.pre||!c.checks) return;
  var bad=c.checks.filter(function(x){ return !x.ok; });
  if(bad.length) note('! 검증 '+bad.map(function(x){ return x.id; }).join('·')+' 실패 — 마감은 됐습니다. «마감» 칸에서 확인','bad',true);
}

/** 무엇이 몇 건 올라갔는지. 서버는 이미 알려 주는데 화면이 버리고 있었다 —
    «올린 게 맞나» 를 모르겠다는 말이 여기서 나왔다. */
function upWhat_(kind, file, r){
  if(!r) return file.name+' 판독 완료';
  if(kind==='uni'){
    var bl=(r.bl||[]).join(', ');
    return '유니패스 '+fmt(r.rows||0)+'건 접수'+(bl?(' — '+bl):'');
  }
  if(kind==='close'){
    return file.name+' — '+fmt(r.rows||0)+'행 · '+fmt(r.qty||0)+'PC'
      +((r.brands&&r.brands.length)?(' · '+[].concat(r.brands).join('·')):'')
      +((r.skipped&&r.skipped.length)?(' · 내 담당 아님 건너뜀 '+r.skipped.map(function(x){ return x.brand; }).join('·')):'');
  }
  return (r.id?(r.id+' — '):'')+file.name+' 판독 완료';
}

/** 여러 개를 끌어다 놓으면 한 개씩 차례로 — 동시에 보내면 서버에서 서로 덮어쓴다 */
function sendFiles(kind, files){
  var list=[].slice.call(files||[]).filter(function(f){ return /\.(xlsx|xls)$/i.test(f.name); });
  var bad=(files?files.length:0)-list.length;
  if(bad) note('엑셀(.xlsx)만 받습니다 — '+bad+'개는 넘겼습니다','warn');
  if(!list.length) return;
  var fails=[], oks=[], ups=[], N=list.length, ym0=curYm()||S.ym;
  // 여러 개면 «몇 번째 중 어디» 가 막대로 찬다. 하나면 진행률을 알 길이 없으니
  // 불확정 띠 + 단계 문구로 간다 — 0% 에 붙어 있는 막대가 더 불안하다.
  if(S.upBusy){ note('앞의 파일을 올리는 중이에요 — 끝나면 다시 놓아 주세요','warn'); return; }
  S.upBusy=true;
  var lastL=null;
  var lab=function(i,t){ return (N>1?('올리는 중 '+(i+1)+'/'+N+' · '):'')+(t||list[i].name); };
  work(true, lab(0));
  (function next(i){
    if(i>=N){
      S.upBusy=false; work(false);
      oks.forEach(function(m){ note(m,'done'); });
      if(kind==='close') vWarn_(lastL);
      if(fails.length && N===1) note(fails[0].replace(/^[^:]*: /,''), 'bad', true);
      else if(fails.length) note((N-fails.length)+'개 올림 · '+fails.length+'개 실패 — '
        +fails.join(' / '), 'bad', true);
      if(String(ym0)!==String(curYm()||S.ym)){
        note('올리는 사이 달을 바꿔 화면은 그대로 뒀습니다 — '+ym0+' 에는 올라갔습니다','warn',true);
        return;
      }
      if(kind==='close'||kind==='uni'){
        // 서버가 올리기 끝에 장부를 같이 보낸다 — 다시 묻지 않고 바로 그린다.
        // 자동 정리(B/L·환율·관세)는 «재료가 다 있을 때만», 화면을 막지 않고 뒤에서 돈다.
        S.openStg=(kind==='close')?3:0;
        if(!oks.length) return;   // 하나도 안 올라갔으면 자동 정리(쓰기)를 돌리지 않는다
        var after=function(d){
          var ready = d && d.summary && d.options && d.options.uni_n;
          if(ready && typeof autoRun==='function') autoRun(ym0, true);
        };
        if(useLedger(lastL)) after(S.close);
        else { S.close=null; closeBoot(ym0, true, after); }
        if(kind==='close') upPop_(ym0, ups);
        return;
      }
      else { S.cache={}; boot(ym0,true); if(S.id) openDetail(S.id); }
      return;
    }
    work(true, lab(i));
    var atFn=function(f, label){ work(true, lab(i, label)); }; atFn.last=(i===N-1);
    sendFile(kind, list[i], function(err, r){
      if(err) fails.push(list[i].name+': '+err);
      else { oks.push(upWhat_(kind, list[i], r)); if(kind==='close' && r) ups.push(r); if(r && r.ledger && r.ledger.close) lastL=r.ledger; }
      next(i+1);
    }, atFn);
  })(0);
}

function pick(kind, forId){
  S.kind=kind; S.upId=forId||null;
  var f=$('ff'); f.value=''; f.multiple=(kind==='close');
  f.onchange=function(){ sendFiles(kind, f.files); };
  f.click();
}

/** data-drop="close|uni" 가 붙은 상자에 끌어다 놓기를 단다.
    dragover 에서 preventDefault 를 안 하면 브라우저가 파일을 그냥 열어 버린다. */
function bindDrops(root){
  (root||document).querySelectorAll('[data-drop]').forEach(function(z){
    if(z.__dnd) return; z.__dnd=1;
    var kind=z.getAttribute('data-drop'), deep=0;
    function off(){ deep=0; z.classList.remove('over'); }
    z.addEventListener('dragenter', function(e){ e.preventDefault(); deep++; z.classList.add('over'); });
    z.addEventListener('dragover',  function(e){ e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
    z.addEventListener('dragleave', function(){ if(--deep<=0) off(); });
    z.addEventListener('drop', function(e){
      e.preventDefault(); off();
      sendFiles(kind, e.dataTransfer && e.dataTransfer.files);
    });
  });
}

/* 상자 밖에 떨어뜨리면 브라우저가 파일을 열어 버려 작업이 날아간다 — 창 전체에서 막는다 */
['dragover','drop'].forEach(function(t){
  window.addEventListener(t, function(e){
    if(e.target.closest && e.target.closest('[data-drop]')) return;
    e.preventDefault();
  });
});

/* 표 머리줄이 붙을 자리 = 앱바 높이(줄바꿈하면 바뀐다) */
(function(){ var a=document.querySelector('.appbar'); if(!a) return;
  var f=function(){ document.documentElement.style.setProperty('--abh', a.offsetHeight+'px'); };
  f(); if(window.ResizeObserver) new ResizeObserver(f).observe(a); })();

/* ── 모션 MO ─────────────────────────────────────
   build  : 위에서 아래로 opacity(dur-2)+translateY 8px(dur-3), 30ms 간격, 8개까지(나머지는 한 덩어리)
   first  : 패널이 «새 데이터» 를 처음 그릴 때만 build + 막대 scaleX. 같은 데이터 다시 그리기는 아무것도 안 한다
   fade   : 탭 들어올 때 패널 opacity(dur-2)   drop: 펼친 칸 opacity+translateY(높이 애니메이션 없음)
   ring   : 링 펄스 1회(600ms, 겹친 층의 transform·opacity) — 저장된 칸·이동한 줄·새 메모·올린 브랜드
   움직임 줄이기·숨은 창이면 전부 건너뛴다 */
var MO=(function(){
  var RM=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null, cs=getComputedStyle(document.documentElement);
  var EZ=cs.getPropertyValue('--ez').trim()||'ease-out', D1=parseFloat(cs.getPropertyValue('--dur-1'))||120,
      D2=parseFloat(cs.getPropertyValue('--dur-2'))||200, D3=parseFloat(cs.getPropertyValue('--dur-3'))||320, GAP=30, MAX=8;
  function off(){ return !!(RM&&RM.matches) || document.hidden || !Element.prototype.animate; }
  function an(el,kf,o){ try{ return el.animate(kf,o); }catch(e){ return null; } }
  /** 등장시킬 덩어리 — 자식 하나뿐인 감싸개는 한 겹 들어간다(표는 표 통째로 — 줄마다 움직이지 않는다) */
  function items(el){
    var c=el?[].slice.call(el.children):[];
    while(c.length===1 && c[0].tagName!=='TABLE' && c[0].children.length>1) c=[].slice.call(c[0].children);
    return c.filter(function(e){ return !e.hidden && e.tagName!=='SCRIPT' && e.tagName!=='STYLE'; });
  }
  function build(els){
    if(off()) return;
    [].forEach.call(els||[],function(e,i){
      var d=Math.min(i,MAX)*GAP;
      an(e,{opacity:[0,1]},{duration:D2,easing:EZ,delay:d,fill:'backwards'});
      an(e,{transform:['translateY(8px)','none']},{duration:D3,easing:EZ,delay:d,fill:'backwards'});
    });
  }
  function bars(root){
    if(off()||!root) return;
    root.querySelectorAll('.trk li.lit').forEach(function(li,i){ an(li,{transform:['scaleX(0)','none']},{duration:D3,easing:EZ,delay:i*GAP,fill:'backwards',pseudoElement:'::before'}); });
    root.querySelectorAll('.qb,.mixb').forEach(function(b){ an(b,{transform:['scaleX(0)','none']},{duration:D3,easing:EZ,fill:'backwards'}); });
  }
  function first(panel,key){
    if(!panel || panel.__mo===key) return;
    panel.__mo=key;
    if(panel.hidden) return;     // 숨은 채 그린 것 — 열 때 fade 만
    build(items(panel)); bars(panel);
  }
  function fade(el){ if(!off()&&el) an(el,{opacity:[0,1]},{duration:D2,easing:EZ}); }
  function drop(el){ if(off()||!el) return; an(el,{opacity:[0,1]},{duration:D2,easing:EZ}); an(el,{transform:['translateY(-8px)','none']},{duration:D3,easing:EZ}); }
  function ring(el,delay){
    if(off()||!el) return;
    requestAnimationFrame(function(){ ring0(el,delay); });   // 다시 그린 직후의 폭 맞춤(fitLater)이 끝난 자리로
  }
  function ring0(el,delay,n){
    if(!el.isConnected) return;
    if(document.querySelector('dialog.dlg.out') && (n||0)<3){ setTimeout(function(){ ring0(el,delay,(n||0)+1); },170); return; }   // 팝업이 닫히는 중 — 닫힌 뒤 자리로
    var r=el.getBoundingClientRect(); if(!r.width) return;
    // 부드러운 스크롤(scrollIntoView)이 끝날 때까지 — 자리가 두 프레임 같아지면 링을 놓는다(최대 1초)
    var p=el.__moR; el.__moR=[r.left+scrollX,r.top+scrollY,r.width];
    if((n||0)<60 && (!p || p[0]!==el.__moR[0] || p[1]!==el.__moR[1] || p[2]!==el.__moR[2])){ requestAnimationFrame(function(){ ring0(el,delay,(n||0)+1); }); return; }
    el.__moR=null;
    var o=document.createElement('div'); o.className='mo-ring';
    o.style.cssText='left:'+(r.left+scrollX-2)+'px;top:'+(r.top+scrollY-2)+'px;width:'+(r.width+4)+'px;height:'+(r.height+4)+'px';
    document.body.appendChild(o);
    var a=an(o,{opacity:[1,0],transform:['scale(1)','scale(1.04)']},{duration:D3*2-40,easing:EZ,delay:delay||0,fill:'both'});   // 600ms
    if(a) a.onfinish=function(){ o.remove(); }; else o.remove();
  }
  /* 토글 색 전환 — 세그먼트·상태 원은 누르면 표를 다시 그려 새 노드가 된다(CSS transition 이 안 걸림).
     누르기 전 색을 잡아 두고, 다시 그린 뒤 같은 자리 노드를 옛 색 → 새 색으로 dur-1 */
  function selOf(el){
    var b=el.closest('[data-pyst]'); if(b) return '[data-pyst="'+b.getAttribute('data-pyst')+'"] .sd';
    for(var i=0;i<el.attributes.length;i++){ var a=el.attributes[i]; if(/^data-/.test(a.name)) return el.tagName.toLowerCase()+'['+a.name+'="'+a.value.replace(/"/g,'\\"')+'"]'; }
    return '';
  }
  function col(el){ var s=getComputedStyle(el); return {backgroundColor:s.backgroundColor,color:s.color}; }
  document.addEventListener('click',function(e){
    if(off()||!e.target.closest) return;
    var b=e.target.closest('.seg2>button,[data-pyst]'); if(!b) return;
    var grp=b.matches('.seg2>button')?[].slice.call(b.parentNode.children):[b.querySelector('.sd')||b];
    var was=grp.map(function(x){ return {s:selOf(x),c:col(x)}; }).filter(function(x){ return x.s; });
    requestAnimationFrame(function(){ was.forEach(function(x){
      var n=document.querySelector(x.s); if(!n) return; var c=col(n);
      if(c.backgroundColor!==x.c.backgroundColor||c.color!==x.c.color) an(n,[x.c,c],{duration:D1,easing:EZ});
    }); });
  },true);
  return {off:off,items:items,build:build,bars:bars,first:first,fade:fade,drop:drop,ring:ring};
})();

/* ── 월마감 — ③④⑤⑥⑦ 이 위에서 아래로 한 단계씩 열린다 ─────────────
 *
 * 한 걸음은 제자리에서 끝난다. 단계를 열면 그 단계에 필요한 전부가 그 안에 있다 —
 * 다른 탭도, 주소창도 부르지 않는다. 예전엔 관세가 «?duty=» 에만, 환율 자동이 «?fxauto=» 에만,
 * 부대비용 입력가 수불부 탭에만 있어서, 단계를 따라가다 매번 화면을 떠나야 했다.
 *
 * 진행 표시 규칙은 셋뿐이다.
 *   1. 단계의 진행은 «카드 머리» 와 맨 위 «지금 할 일» 띠에만. 판정은 언제나 데이터(okBy)에서.
 *   2. 오래 걸리는 일은 «그 일을 시킨 단추» 가 말한다(btnGo). 숫자가 전부 바뀌는 일만 화면을 막는다(hold).
 *   3. 제안은 알림에 넣지 않는다 — 알림은 사라지는 물건이고 제안은 읽고 판단하는 물건이다.
 *      «미리보기 → 적용» 패널로 그 카드 안에 편다.
 */

function closeBoot(ym, quiet, then){
  ym = ym || curYm();
  if(S.close && S.closeYm===ym && quiet!==false && !S.closeDirty){ closeRender(true); if(then) then(S.close); return; }
  // 1) 페이지에 심어 온 장부(서버 캐시가 더울 때만 심긴다) — 왕복 없이 바로 그린다
  if(typeof PRELEDGER!=='undefined' && PRELEDGER && !(PRELEDGER.close && String(PRELEDGER.close.ym)===String(ym))) PRELEDGER=null;
  if(typeof PRELEDGER!=='undefined' && PRELEDGER && PRELEDGER.close && String(PRELEDGER.close.ym)===String(ym) && !S.closeDirty){
    var P0=PRELEDGER; PRELEDGER=null;
    useLedger(P0);
    if(then) then(S.close);
    return;
  }
  // 2) 이 브라우저가 마지막으로 본 장부 — 먼저 그려 두고, 서버 답이 오면 조용히 바꾼다
  // 이 페이지에서 그 달을 처음 볼 때만 — 저장·삭제 뒤에 옛 숫자가 번쩍이면 안 된다
  var old=((!S.close||S.closeYm!==ym) && !(S.seen&&S.seen[ym])) ? ledgerGet_(ym) : null;
  if(old){ S.close=old.close; S.closeYm=old.close.ym; S.stock=old.stock||null; S.closeStale=true; closeRender(); }
  else if(!quiet) $('pClose').innerHTML='<div class="skel">불러오는 중…</div>';
  if(old) work(true,'갱신 중');
  run('apiLedger',[ym,1],function(r){   // 1 = 메모를 같이(apiMemoList 왕복 없앰)
    if(old) work(false);
    var d=r&&r.close;
    if(!d || String(d.ym)!==String(curYm())) { if(then) then(null); return; }
    useLedger(r);
    if(then) then(d);
  },function(m){ if(old){ work(false); note(m,'bad',true); } else $('pClose').innerHTML='<div class="skel">'+esc(m)+'</div>'; if(then) then(null); });
}

/** 상태 모양 — 글자 뱃지 대신 (ux-guide §3-1). 트랙·걸음·카드·목록이 같은 모양을 쓴다.

function sdot(st, tip, n){

}

/* 홈택스 후보가 이미 비용으로 들어갔나 — 서버 htUsedId_ 와 같은 규칙(승인번호 · 공급자+금액 · 같은 날 같은 공급자 합계) */
function htKey(sup, amt){ var t=String(sup||'').replace(/\(주\)|주식회사|㈜|\s+/g,'').toLowerCase(), a=Math.round(Number(amt)||0); return (t&&a)?('~'+t+'|'+a):''; }
function htUsed(r, used, rows){
  used=used||{}; if(used[r.id]) return used[r.id];
  var k=htKey(r.sup, r.amt); if(k && used[k]) return used[k];
  var sum=0; (rows||[]).forEach(function(x){ if(x.sup===r.sup && x.ymd===r.ymd) sum+=Math.round(Number(x.amt)||0); });
  var ks=htKey(r.sup, sum); return (sum!==Math.round(Number(r.amt)||0) && ks && used[ks]) ? used[ks] : '';
}

        +'<b>② 유니패스 수입신고 실적</b><br>여기로 끌어다 놓거나<br>'
        +'<button class="btn" id="bUpUni0" style="margin-top:7px">선택</button>'
        +'<div class="hint" style="margin-top:9px">수입 건이 있는 달만 · 유니패스 → 수입신고 실적</div></div>'):'')
        +'</div>'):'');
    if($('bUpClose')) $('bUpClose').onclick=function(){ pick('close'); };
    if($('bUpUni0')) $('bUpUni0').onclick=function(){ pick('uni'); };
    bindDrops($('pClose'));   // 빈 달 화면도 끌어다 놓기를 받아야 한다
    return;
  }
  var s=d.summary;
  // 달을 바꿨는데 지난 달 «적용 결과» 가 남아 있으면 거짓말이 된다
  if(S.pvres && S.pvres.ym!==d.ym) S.pvres=null;
  // 이 달은 건별 검수를 하지 않았는가 (입고내역만으로 마감하는 달)
  var noRecon=!(d.recon&&d.recon.n);

  /* 단계가 끝났는가 — 데이터로 직접 본다 */
  // done 은 «접수한 브랜드 수» 다. 한 본부에 브랜드가 여럿이면
  // 하나만 올려도 done=1 이라 «전부 접수» 로 보였다 — 남은 것(wait)을 봐야 한다.
  var deptLeft=(d.depts||[]).filter(function(x){
    return (x.wait!==undefined && x.wait!==null) ? x.wait>0 : !x.done; }).length;
  var nImp=(d.cards||[]).length;
  var PRE=!!d.pre;   // 10월~ 업로드 = 그 브랜드 마감 · 기준금액 = ERP 사전원가 — 기준금액·확정 단계 없음
  var okBy={
    3: (d.parts||[]).length>0 && !deptLeft,
    // 검수 건이 아예 없는 달은 대조할 것이 없다 — 막지 않고 지나가되 그 사실을 남긴다.
    4: (d.recon&&d.recon.n) ? (!d.recon.miss && !d.recon.bad) : true,
    // ⑤ 는 «물건값이 얼마인가», ⑥ 은 «그 위에 뭘 얹는가». 회계적으로 자명한 금이고,
    // 이 금이 생기는 순간 갈 곳 없던 환율자동·관세에 자리가 난다.
    5: !s.unres_n,
    // 수입 묶음이 없는 달(국내 매입만)은 부대비용 0건이 정상 — 예전엔 V 가 다 통과해도 확정이 영영 막혔다
    6: !COST_ON || ((d.costs.length>0 || !nImp) && d.costs.every(function(c){ return c.ok; })),   // 부대비용 단계를 끈 동안은 막지 않는다
    7: PRE ? (d.parts||[]).length>0 : (d.checks.every(function(c){ return c.ok; }) && !!d.closed)
  };
  function sgs(no){
    if(no===4 && noRecon) return 'skip';
    if(no===5 && !nImp) return 'skip';        // 수입 묶음이 없는 달은 세울 기준금액이 없다
    if(okBy[no]) return 'done';
    for(var i=3;i<no;i++) if(i!==4 && !okBy[i] && !(i===5&&!nImp)) return 'lock';   // 검수 대사(④)는 트랙 밖 — 앞 단계를 막지 않는다
    return 'now';
  }
  // 담당자: 내 담당 브랜드를 이 달에 아직 안 올렸으면 — 남이 먼저 올려 «ERP 끝남» 으로 보여도 내 할 일은 올리기다
  var upB={}; (d.parts||[]).forEach(function(p){ String(p.brand||'').split('+').forEach(function(b){ if(b) upB[b.toUpperCase()]=1; }); });
  var myB=(S.boot&&S.boot.myBrands)||null;
  // 내 담당 브랜드가 «하나도» 안 올라왔을 때만 — C본부처럼 브랜드가 여럿이면 그달 입고 없는 브랜드(EL·OA·EK)는
  // 파일에 아예 없어서, 브랜드별로 보면 영영 «대기» 로 남는다
  var myLeft=(myB && !myB.some(function(b){ return upB[b]; })) ? myB.slice() : [];
  var openNo=S.openStg;
  if(openNo===4 || openNo===5 || (openNo===6 && !COST_ON)) openNo=0;   // 기준금액 단계는 뺐다(10/27 어진) — 수입은 대금 탭에서
  if(!openNo && myLeft.length) openNo=3;
  var STG=COST_ON?[3,6,7]:[3,7];
  if(!openNo){ STG.forEach(function(n){ if(!openNo && sgs(n)==='now') openNo=n; }); }
  if(!openNo) openNo = d.canFin ? 7 : 3;

  /* 지금 할 일 — 순서를 설명하지 않고 걸음 하나만 지목한다 */
  var NOW={
    3:['③ ERP 입고현황 업로드','드롭존에 엑셀을 끌어다 놓습니다'],
    4:['④ 검수·ERP 대사','차이 나는 줄이 있으면 ERP 원본을 고칩니다'],
    5:['⑤ 기준금액 산정', s.unres_n?('미확정 '+fmt(s.unres_n)+'행이 남았습니다'):'수입 묶음의 환율을 확정합니다'],
    6:['⑥ 부대비용 배부','관세 → 운임·통관수수료 순으로 넣습니다'],
    7:['⑦ 검증·확정','V1~V'+d.checks.length+' 가 전부 통과해야 눌립니다']
  };
  var nowNo=0; STG.forEach(function(n){ if(!nowNo && sgs(n)==='now') nowNo=n; });

  /* 방금 적용한 것이 «카드 머리» 에도 남는다 — 패널을 닫아도 무엇이 바뀌었는지가 보인다.
     예전엔 적용하면 패널이 닫히고 알림 한 줄이 3초 떴다가 사라졌다. */
  function justDone(no){
    var R=S.pvres;
    return (R && R.step===no && R.short) ? (' · <b style="color:var(--ok)">방금 '+esc(R.short)+'</b>') : '';
  }

  /* ── A 트랙 ─────────────────────────────────────────
     맨 위 한 줄 = 이 달의 결론(기준금액 + 부대비용 = 취득원가)과 검증 점 다섯 개.
     그 밑 = 단계 트랙. 끝난 곳·막힌 곳·지금 할 곳이 모양과 색으로만 보인다.
     누른 단계 하나만 아래에 편다 — 설명 문장은 ? 안에 접혀 있다. */
  var nPass=d.checks.filter(function(c){ return c.ok; }).length, nChk=d.checks.length;
  var costBad=d.costs.filter(function(c){ return !c.ok; }).length;
  var busyAuto=!!S.autoBusy;
  var busyAt = !busyAuto ? 0 : ((!COST_ON || (nImp && sgs(5)!=='done')) ? 5 : 6);   // 자동 정리가 지금 붙들고 있는 단계 하나
  var ST=[
    {no:3, t:PRE?'ERP 업로드':'ERP', ic:'file', m:myLeft.length?'내 담당 대기':((d.parts||[]).length?(fmt(s.lines)+'행'):'없음'),
     pip:deptLeft, mine:myLeft.length>0, tip:(d.parts||[]).map(function(p){ return p.file; }).join(' · ')},
    {no:5, t:'기준금액', ic:'fx', m:nImp?('수입 '+nImp+'묶음'):'수입 없음',
     pip:s.unres_n, tip:s.unres_n?('미확정 '+fmt(s.unres_n)+'행'):'', busy:busyAt===5},
    {no:6, t:'부대비용', ic:'coins', m:d.costs.length?(krs(s.oh_inv)+' · '+d.costs.length+'건'):'0건',
     pip:costBad, tip:costBad?('붙을 곳이 어긋난 비용 '+costBad+'건'):'', bad:costBad>0, busy:busyAt===6},
    PRE ? {no:7, t:'마감', ic:'check', m:(d.parts||[]).length?'마감됨':'미마감', pip:0, tip:brCnt(d)}
    : {no:7, t:'확정', ic:d.closed?'lock':'scan', m:d.closed?'확정됨':('V '+nPass+'/'+nChk),
     pip:d.closed?0:(nChk-nPass), tip:d.closed?(d.closed.at+' 확정'):''}
  ].filter(function(x){ return (COST_ON || x.no!==6) && x.no!==5; });
  var V2NODE={V1:3, V2:6, V3:5, V4:6};   // 검증이 막히면 그 원인 단계를 빨강으로 — V1 이 실패해도 ERP이 초록이었다
  function nodeSt(x){
    if(x.mine) return 'now';   // 내 담당을 안 올렸다 — 남이 올려 끝난 것처럼 보여도 내 차례
    if(!PRE && d.checks.some(function(c){ return !c.ok && V2NODE[String(c.id).toUpperCase()]===x.no; })) return 'bad';   // 10월~ 검증은 알림만
    if(!PRE && x.no===7 && !d.closed && nPass<nChk) return 'bad';
    var g=sgs(x.no);
    if(x.bad && g!=='done') return 'bad';
    return g;   // done · now · lock · skip
  }

  var EQ={base:s.base, oh:s.oh_inv, landed:s.landed}, eqLab='';
  if(brLabel() && S.stock && S.stock.items){
    EQ={base:0, oh:0, landed:0}; eqLab=brLabel();
    Object.keys(S.stock.items).forEach(function(k){
      if(!brShow(k)) return;
      var mm=(S.stock.items[k].m||{})[d.ym]; if(!mm) return;
      EQ.landed+=mm[1]; EQ.oh+=mm[2]; EQ.base+=mm[1]-mm[2];
    });
  }
  var h='<div class="trk-top">'
    +(eqLab?('<span class="chip acc" title="맨 위 브랜드 선택을 따릅니다">'+esc(eqLab)+'</span>'):'')
    +'<div class="eq" role="group" aria-label="취득원가 식">'
    +(COST_ON || EQ.oh ? (   // 부대비용을 끈 뒤에도 옛 달(비용 시트에 남은 달)은 식 그대로
       '<div class="eqb"><span class="k">기준금액</span><span class="v">'+fmt(EQ.base)+'</span></div>'
    +  '<span class="eqop">+</span>'
    +  '<div class="eqb'+(costBad||!d.costs.length?' hole':'')+'" data-tip="부대비용">'
    +    '<span class="k">부대비용</span><span class="v">'+fmt(EQ.oh)+'</span></div>'
    +  '<span class="eqop">=</span>') : '')
    +  '<div class="eqb"><span class="k">취득원가</span><span class="v">'+fmt(EQ.landed)+'</span></div>'
    +'</div>'
    +(eqLab||PRE?'':('<span class="trk-sub'+(s.diff_pre?' neg':'')+'" title="사전원가 '+fmt(s.amt_pre)+'">사전원가 대비 '+fmt(s.diff_pre)+'</span>'))   // 브랜드로 좁혔으면 달 전체 값이라 숨긴다
    +'<span class="grow"></span>'
    +(!d.canFin && !TIDY ? ('<span class="chip" title="확정은 재무가 합니다">검증 '+nPass+'/'+nChk+'</span>') : '')   // 10/27 정리: 숨김 — 확정 칸 «V n/m» 와 중복
    +'<span class="vdots"'+(!d.canFin?' hidden':'')+' aria-label="검증 '+nChk+'개 중 '+nPass+'개 통과">'+d.checks.map(function(c){
        return '<button class="vd '+(c.ok?'ok':'no')+'" data-goto="7" title="'+esc(c.id+' '+c.name+(c.ok?'':' — '+String(c.detail||'').replace(/<[^>]+>/g,'').slice(0,140)))+'">'
          +esc(String(c.id).replace(/^V/,''))+'</button>'; }).join('')+'</span>'
    +'</div>';

  h+='<div class="trk-wrap"><ol class="trk" role="tablist" aria-label="마감 단계">'+ST.map(function(x,i){
      var st=nodeSt(x), prev=i?nodeSt(ST[i-1]):'';
      var lit=i && (prev==='done'||prev==='skip') && (st==='done'||st==='skip');
      return '<li class="'+(lit?'lit':'')+'"><button class="node st-'+st+(x.busy?' wk':'')+'" role="tab" data-act="'+x.no+'" aria-selected="'+(openNo===x.no)+'"'
        +(x.tip?(' title="'+esc(x.tip)+'"'):'')+'>'
        +'<span class="circ">'+ico(st==='done'?'check':(st==='skip'?'minus':x.ic))
        +(x.pip?('<span class="pip">'+(x.pip>999?'999+':fmt(x.pip))+'</span>'):'')+'</span>'
        +'<span class="nl">'+esc(x.t)+'</span><span class="nm">'+esc(x.m)+'</span></button></li>';
    }).join('')+'</ol></div>'+(PRE?brStrip(d):'');

  // 기계가 방금 한 것 · 사람에게 남긴 것 — 문장 대신 칩
  var A=(S.auto && S.auto.ym===S.ym)?S.auto:null;
  if((!TIDY || COST_ON) && A && ((A.did||[]).length || (A.left||[]).some(function(x){ return x.n; }))){   // 10/27 정리: 숨김 — 부대비용을 끈 동안 B/L·환율·관세·운임 칩
    var LB={bl:'B/L 확인',fx:'환율 미정',duty:'관세 미입력',cost:'운임·통관 후보'};
    h+='<div class="chips">'
      +(A.did||[]).map(function(m){ return '<span class="chip ok">'+ico('check')+esc(String(m).split(' · ')[0])+'</span>'; }).join('')
      +(A.left||[]).filter(function(x){ return x.n; }).map(function(x){
          var go={bl:5,fx:5,duty:6,cost:6}[x.what]||6;
          return '<button class="chip warn" data-goto="'+go+'" title="'+esc(x.msg)+'">'+esc(LB[x.what]||x.what)+' <b>'+fmt(x.n)+'</b></button>'; }).join('')
      +'<button class="chip ghost" id="autoX" aria-label="닫기">'+ico('x')+'</button></div>';
  }

  /* 펼친 단계 — 손잡이 id 가 그대로라 기존 동작(올리기·비용·B/L·확정)이 다 살아 있다 */
  var body='';
  if(openNo===3) body=stg3(d);
  if(openNo===5) body=stg5(d,s);
  if(openNo===6) body=stg6(d,s,okBy,nImp)+allocFlow(d,s);
  if(openNo===7) body=stg7(d, okBy, noRecon, nImp)+(COST_ON?'':pvTbl(d))+stgReset(d);   // 입고처별 표(지결 대조 복사)는 ⑥ 이 없으면 확정 칸으로
  body=body.split('</div></details><details class="tipd"><summary aria-label="설명">?</summary><div class="hint">').join('</div><div class="hint" style="margin-top:8px">');
  var lockW=!!(S.autoBusy||S.upBusy);
  h+='<div class="trk-panel'+(lockW?' lockw':'')+'" data-stgb="'+openNo+'">'+body+'</div>';

  h+='<div id="memoBoxW">'+memoBox(d)+'</div>'+ledger(d,s);

  /* R010: 입고대장 아래 «검수 대사» 접기 칸은 뺐다(검수 미사용). V5 는 서버 apiLedger 가 그대로 낸다. stg4 는 다시 켤 때 쓰려고 남김 */

  var PC=$('pClose');
  // 탭 재진입: 같은 화면이면 갈아끼우지 않는다 — 탭을 다시 열 때마다 표 전체를 새로 그려 100ms+ 멈췄다(10/26). 손이 닿은 DOM(첫 자식이 바뀜)이면 다시 그린다
  if(reuse && PC.__h===h && PC.firstElementChild && PC.firstElementChild===PC.__f) return;
  PC.innerHTML=h; PC.__h=h; PC.__f=PC.firstElementChild;
  if(window.MO) MO.first(PC, d.ym);
  $('pClose').querySelectorAll('[data-act]').forEach(function(b){
    b.onclick=function(){
      var no=+b.getAttribute('data-act');
      S.openStg=(S.openStg===no)?0:no; closeRender();
      if(window.MO && S.openStg) MO.drop(document.querySelector('#pClose .trk-panel'));
    };
  });
  var fb=$('bFlow');
  if(fb) fb.onclick=function(){ S.flowOpen=!S.flowOpen; closeRender(); };
  $('pClose').querySelectorAll('[data-lg]').forEach(function(tr){
    tr.onclick=function(){
      var k=tr.getAttribute('data-lg');
      S.lgOpen=(S.lgOpen===k)?'':k; closeRender();
    };
  });
  $('pClose').querySelectorAll('[data-lgg]').forEach(function(tr){
    tr.onclick=function(){ var k=tr.getAttribute('data-lgg'); S.lgFold=S.lgFold||{}; S.lgFold[k]=!S.lgFold[k]; closeRender(); };
  });
  bindMemo(); bindReport();
  bindStg();
  if(typeof bindAmr==='function') bindAmr();
  bindGoto($('pClose'));
  bindDrops($('pClose'));
  if($('autoX')) $('autoX').onclick=function(){ S.auto=null; closeRender(); };
  if($('bGoCase2')) $('bGoCase2').onclick=function(){ var t=document.querySelector('.tab[data-t="case"]'); if(t) t.click(); };
}

/** 대장을 엑셀로 — 화면에 보이는 것 그대로 */
function lgCsv(){
  var K=S.stock, d=S.close; if(!K||!K.items) return;
  var ym=d.ym, byCost={}, byFx={};
  (K.costs||[]).forEach(function(c){ byCost[c.id]=c; });
  (K.fx||[]).forEach(function(x){ byFx[x.grp]=x; });
  var noOh=lgNoOh(K,ym);
  var out=[noOh?['품번','구분','품명','수량','취득원가','단가 기준','입고묶음']:['품번','구분','품명','수량','기준금액','단가 기준','부대비용','입고묶음','취득원가']];
  Object.keys(K.items).forEach(function(k){
    var it=K.items[k], m=(it.m&&it.m[ym])||[0,0,0];
    if(!m[0] && !m[1] && !m[2]) return;
    if(typeof brShow==='function' && !brShow(k)) return;   // 화면처럼 고른 브랜드만
    var gs={};
    if(it.p) Object.keys(it.p).forEach(function(cid){
      var c=byCost[cid]; if(!c) return;
      String(c.val||'').split(';').forEach(function(g){ g=g.trim(); if(g) gs[g]=1; });
    });
    var gl=Object.keys(gs), fx=gl.length?byFx[gl[0]]:null;
    // m = [수량, 취득금액, 부대비용] — 기준금액은 취득금액에서 부대비용을 뺀 것이다
    out.push(noOh ? [k, it.kd||'제작', it.nm||'', m[0], m[1], (fx&&fx.mode)||'입고단가', gl.join(' ')]
                  : [k, it.kd||'제작', it.nm||'', m[0], m[1]-m[2], (fx&&fx.mode)||'입고단가', m[2], gl.join(' '), m[1]]);
  });
  var LA=noOh?4:8;
  out.sort(function(a,b){ return (typeof a[LA]==='number'&&typeof b[LA]==='number') ? b[LA]-a[LA] : 0; });
  var csv='\uFEFF'+out.map(function(r){
    return r.map(function(x){ var t=String(x==null?'':x);
      return /[",\n]/.test(t) ? ('"'+t.split('"').join('""')+'"') : t; }).join(',');
  }).join('\r\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='입고대장_'+d.ym+'.csv'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  note('입고대장을 내려받았습니다','ok');
}

/** 부대비용을 끈 동안 이 달 대장에 얹힌 부대비용이 하나도 없나 — 대장 표·엑셀이 한 금액 열로 */
function lgNoOh(K,ym){
  if(COST_ON) return false;
  return !Object.keys(K.items).some(function(k){ var m=(K.items[k].m||{})[ym]; return m && m[2] && (typeof brShow!=='function'||brShow(k)); });
}

/** 누르는 것 한 장 */
function actCard(no, num, title, st, big, sub){
  var cls = st==='done' ? 'done' : (st==='skip' ? 'skip' : 'now');
  var lab = st==='done' ? '완료' : (st==='skip' ? '해당 없음' : '현재');
  var open = S.openStg===no;
  return '<button class="act '+cls+(open?' open':'')+'" data-act="'+no+'">'
    +'<span class="an">'+num+'</span>'
    +'<span class="at"><b>'+esc(title)+'</b><br><span class="s">'+sub+'</span></span>'
    +'<span class="av">'+esc(big)+'<br><span class="pill '+(st==='done'?'ok':(st==='skip'?'':'a'))+'">'+lab+'</span></span>'
    +'<span class="ax">'+(open?'▾':'▸')+'</span></button>';
}

/** 부대비용이 어느 서류에서 나와 어디로 갔나 — 비용 쪽에서 본 그림. */
function allocFlow(d,s){
  var K=S.stock;
  if(!K || !(K.costs||[]).length) return '';
  var open=S.flowOpen!==false;
  var h='<div class="secth" style="border-top:1px solid var(--line-2)"><b>부대비용이 어디서 와서 어디로 갔나</b>'
    +'<span class="hint">'+fmt(s.oh_inv)+'원 · 비용 '+K.costs.length+'건</span>'
    +'<span style="margin-left:auto"><button class="btn sm" id="bFlow">'+(open?'접기':'펴기')+'</button></span></div>';
  if(!open) return h;

  /* 날짜·공급자는 마감 쪽 비용에 있다 */
  var meta={}; (d.costs||[]).forEach(function(c){ meta[c.id]=c; });
  var CS=K.costs.filter(function(c){ return c.inv && c.sum; }).map(function(c){
    var m=meta[c.id]||{};
    return { id:c.id, t:c.type, a:c.sum, wsum:c.wsum||0, g:String(c.val||'').split(';')[0].trim(),
             sup:c.sup||m.supplier||'', doc:c.doc||m.doc||'', ymd:m.date||'',
             uni:String(c.type)==='관세' };
  });
  if(!CS.length) return h+'<div class="skel">배부 부대비용 없음</div>';

  /* 품번별 몫 */
  var rows=[];
  Object.keys(K.items).forEach(function(k){
    var it=K.items[k]; if(!it.p) return;
    var t=0, gs={};
    Object.keys(it.p).forEach(function(cid){ t+=it.p[cid];
      var c=CS.filter(function(x){ return x.id===cid; })[0]; if(c) gs[c.g]=1; });
    if(!t) return;
    rows.push({ k:k, nm:it.nm||'', v:t, g:Object.keys(gs)[0]||'', p:it.p });
  });
  if(!rows.length) return h+'<div class="skel">아직 품번으로 갈라지지 않았습니다.</div>';

  var LOT={}; CS.forEach(function(c){ LOT[c.g]=(LOT[c.g]||0)+c.a; });
  var lots=Object.keys(LOT).sort(function(a,b){ return LOT[b]-LOT[a]; });
  rows.sort(function(a,b){
    if(a.g!==b.g) return lots.indexOf(a.g)-lots.indexOf(b.g);
    return b.v-a.v; });
  /* 너무 많으면 큰 것만 — 나머지는 한 줄로 */
  var CAP=14, rest=null;
  if(rows.length>CAP){
    var tail=rows.slice(CAP);
    var byG={}; tail.forEach(function(r){ byG[r.g]=(byG[r.g]||0)+r.v; });
    rest=Object.keys(byG).map(function(g){
      return { k:'기타 '+tail.filter(function(r){ return r.g===g; }).length+'품번',
               nm:'', v:byG[g], g:g, p:null }; });
    rows=rows.slice(0,CAP).concat(rest);
  }

  var SUM=0; CS.forEach(function(c){ SUM+=c.a; });
  var big=function(a,b){ return b.a-a.a; };   // 얇은 줄을 아래로 — 위쪽은 띠가 엇갈려 글자가 얹힌다
  var uni=CS.filter(function(c){ return c.uni; }).sort(big),
      htx=CS.filter(function(c){ return !c.uni; }).sort(big);
  var uSum=0; uni.forEach(function(c){ uSum+=c.a; });
  var hSum=0; htx.forEach(function(c){ hSum+=c.a; });

  var W=980, SX=8, SW=126, CX=212, CW=98, MX=398, MW=112, RX=596;
  var GAP=7, scale=360/SUM;
  var L={}, y=26;
  uni.forEach(function(c){ var hh=Math.max(c.a*scale,9); L[c.id]={y:y,h:hh}; y+=hh+GAP; });
  var uEnd=y; y+=uni.length?42:0;
  var hStart=y;
  htx.forEach(function(c){ var hh=Math.max(c.a*scale,9); L[c.id]={y:y,h:hh}; y+=hh+GAP; });
  var M={}, y2=26;
  lots.forEach(function(g){ M[g]={y:y2,h:LOT[g]*scale}; y2+=M[g].h+24; });
  var R={}, y3=26;
  rows.forEach(function(r){ var hh=Math.max(r.v*scale,11); R[r.k]={y:y3,h:hh}; y3+=hh+6; });
  var HH=Math.max(y,y2,y3)+14;

  var g2='';
  if(uni.length) g2+='<rect x="'+SX+'" y="8" width="'+(CX+CW-SX)+'" height="'+(uEnd-2)+'" '
    +'fill="var(--acc)" opacity=".07" rx="3"/>'
    +'<text x="'+(SX+6)+'" y="21" font-size="11" fill="var(--acc)" font-weight="700">'
    +'유니패스 수입신고 — 관세 '+fmt(uSum)+'</text>';
  if(htx.length) g2+='<rect x="'+SX+'" y="'+(hStart-18)+'" width="'+(CX+CW-SX)+'" height="'+(y-hStart+20)+'" '
    +'fill="var(--warn)" opacity=".07" rx="3"/>'
    +'<text x="'+(SX+6)+'" y="'+(hStart-5)+'" font-size="11" fill="var(--warn)" font-weight="700">'
    +'홈택스 매입계산서 — 운임·통관 '+fmt(hSum)+'</text>';

  CS.forEach(function(c){
    var col=c.uni?'var(--acc)':'var(--warn)', Lx=L[c.id];
    var tip=c.t+' '+fmt(c.a)+'원 · '+(c.sup||'')+' · '+(c.ymd||'')+' · '+(c.doc||'')
      +' → '+c.g+' ÷ '+fmt(c.wsum)+'개 = 개당 '+fmt(c.wsum?c.a/c.wsum:0)+'원';
    g2+=svgPill(SX, Lx.y, SW, Lx.h, col, (c.sup||''), c.a, tip, 'left');
    g2+=svgBand(SX+SW, Lx.y, Lx.h, CX, Lx.y, Lx.h, col, .3, tip);
    g2+=svgPill(CX, Lx.y, CW, Lx.h, costColor(c.t), c.t, c.a, tip);
  });
  var mf={}; lots.forEach(function(x){ mf[x]=M[x].y; });
  CS.forEach(function(c){
    var hh=c.a*scale, Lx=L[c.id];
    g2+=svgBand(CX+CW, Lx.y, Lx.h, MX, mf[c.g], hh, costColor(c.t), .42, c.t+' '+fmt(c.a)+' → '+c.g);
    mf[c.g]+=hh;
  });
  lots.forEach(function(x){
    g2+=svgPill(MX, M[x].y, MW, M[x].h, 'var(--ink-3)', x.slice(0,6), LOT[x], x+' — '+fmt(LOT[x])+'원');
  });
  var mf2={}; lots.forEach(function(x){ mf2[x]=M[x].y; });
  rows.forEach(function(r){
    var hh=r.v*scale;
    g2+=svgBand(MX+MW, mf2[r.g], hh, RX, R[r.k].y, R[r.k].h, 'var(--acc)', .28,
      r.k+' '+fmt(r.v)+'원'+(r.nm?(' · '+r.nm):''));
    mf2[r.g]+=hh;
    g2+='<rect x="'+RX+'" y="'+R[r.k].y+'" width="13" height="'+R[r.k].h+'" fill="var(--acc)" rx="1"/>'
      +'<text x="'+(RX+20)+'" y="'+(R[r.k].y+R[r.k].h/2+4)+'" font-size="11" fill="var(--ink)" '
      +'font-family="var(--mono)">'+esc(r.k)+'  '+fmt(r.v)+'</text>';
  });

  return h+'<div class="flowbox"><div class="leg2">'
    +'<span><i style="background:var(--acc)"></i>관세 — 유니패스 신고</span>'
    +'<span><i style="background:var(--warn)"></i>운임 — 홈택스 계산서</span>'
    +'<span><i style="background:var(--ok)"></i>통관수수료 — 홈택스 계산서</span></div>'
    +'<div class="scrx"><svg viewBox="0 0 '+W+' '+HH+'" width="100%" '
    +'style="min-width:840px;height:auto;font-family:var(--body)">'+g2+'</svg></div>'
    +'<div class="hint">위쪽은 유니패스에서만, 아래쪽은 홈택스에서만 옵니다 — '
    +'<b>관세가 아래쪽에 서면 잘못 넣은 것</b>입니다. 도형에 대면 증빙번호와 개당 금액이 나옵니다.</div></div>';
}
function costColor(t){
  return t==='관세' ? 'var(--k-duty)' : (t==='운임' ? 'var(--k-freight)' : (t==='통관수수료' ? 'var(--k-customs)' : 'var(--line-2)'));
}
/** 굵기가 금액인 띠 */
function svgBand(x1,y1,h1,x2,y2,h2,fill,op,tip){
  var c1=x1+(x2-x1)*0.45, c2=x2-(x2-x1)*0.45;
  return '<path d="M'+x1+','+y1+' C'+c1+','+y1+' '+c2+','+y2+' '+x2+','+y2
    +' L'+x2+','+(y2+h2)+' C'+c2+','+(y2+h2)+' '+c1+','+(y1+h1)+' '+x1+','+(y1+h1)+' Z"'
    +' fill="'+fill+'" opacity="'+op+'">'+(tip?('<title>월 매입 마감 앱 (데모) — 이어진 포트폴리오</title>'):'')+'</path>';
}
/** 글자 폭 어림 — 한글은 글자당 약 1.0em, 숫자·기호는 약 0.6em */
function svgW(t, px){
  var n=0;
  String(t).split('').forEach(function(ch){ n += (ch.charCodeAt(0)>0x2000) ? 1 : 0.58; });
  return n*px;
}
/** 폭에 맞게 이름을 줄인다 — 잘려 나가느니 «…» 로 끝내는 게 낫다 */
function svgCut(t, px, max){
  var out=String(t);
  if(svgW(out,px)<=max) return out;
  while(out.length>1 && svgW(out+'…',px)>max) out=out.slice(0,-1);
  return out+'…';
}
/** 기둥 — 얇으면 글자를 밖으로 빼고 «바탕을 깔아» 겹쳐도 읽히게 한다.
    배부에는 0.66% 짜리 줄도 있어서(36,330 / 5,513,891) 비율만으로는 글자가 못 들어간다. */
function svgPill(x,y,w,h,fill,name,amt,tip,side){
  var s='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" rx="2">'
    +(tip?('<title>'+esc(tip)+'</title>'):'')+'</rect>';
  var num=fmt(amt);
  if(h>=30){
    s+='<text x="'+(x+7)+'" y="'+(y+15)+'" font-size="12" fill="var(--on-brand)">'
      +esc(svgCut(name,11.5,w-14))+'</text>'
      +'<text x="'+(x+w-7)+'" y="'+(y+h-7)+'" font-size="11" fill="var(--on-brand)" text-anchor="end" '
      +'font-family="var(--mono)">'+num+'</text>';
  }else if(h>=17){
    var room=w-16-svgW(num,10.5);
    s+='<text x="'+(x+7)+'" y="'+(y+h/2+4)+'" font-size="11" fill="var(--on-brand)">'
      +esc(svgCut(name,10.5,room))
      +' <tspan font-family="var(--mono)">'+num+'</tspan></text>';
  }else{
    /* 밖으로 — 흐름 위에 얹히므로 바탕을 깔지 않으면 안 읽힌다 */
    var lab=svgCut(name,10.5,120)+' '+num;
    var lw=svgW(lab,10.5)+10;
    var tx=(side==='left')?(x-7):(x+w+7);
    var bx=(side==='left')?(tx-lw):(tx-5);
    s+='<rect x="'+bx+'" y="'+(y+h/2-8)+'" width="'+lw+'" height="16" rx="2" '
      +'fill="var(--surf)"/>'
      +'<text x="'+tx+'" y="'+(y+h/2+4)+'" font-size="10.5" fill="var(--ink-2)"'
      +((side==='left')?' text-anchor="end"':'')+'>'+esc(svgCut(name,10.5,120))
      +' <tspan font-family="var(--mono)" fill="var(--ink-3)">'+num+'</tspan></text>';
  }
  return s;
}

/* ── 메모 · 확인 요청함 (C안) ─────────────────────────────────────────
   줄(품번·입고묶음) 앞 말풍선으로 달고, 입고대장 위 «확인 요청함» 에 담당자별로 모인다.
   재무: 안 보낸 것을 한꺼번에 보낸다. 담당자: «내가 확인할 메모» 에 답하면 확인됨. */
function memoLoad(ym){
  if(S.memoReq===ym) return;
  S.memoReq=ym;
  run('apiMemoList',[ym],function(r){ memoSet(r); S.memoReq=null; if(S.close&&S.close.ym===ym) memoPaint(); },
      function(){ S.memoReq=null; });
}
function memoRows(){ return (S.memo&&S.close&&S.memo.ym===S.close.ym)?(S.memo.rows||[]):[]; }
/** 서버가 준 목록으로 바꾸되, 아직 저장 중인 줄(tmp)은 남긴다 — 목록 조회가 늦게 와서 방금 단 메모를 지우던 버그 */
function memoSet(r, dropId){
  var keep=((S.memo&&S.memo.rows)||[]).filter(function(m){ return m.tmp && !m.cancel && m.id!==dropId; });
  keep.forEach(function(m){ if(!m.to.length && r.owners){ var seen={}; memoBrands(m.at,m.key).forEach(function(b){ (r.owners[b]||[]).forEach(function(o){ if(seen[o.e]) return; seen[o.e]=1; m.to.push(o.e); m.toNames.push(o.n||o.e); }); }); } });
  r.rows=(r.rows||[]).concat(keep); S.memo=r;
}
/** 요청함 상자와 말풍선만 다시 그린다 — 탭 전체를 다시 그리지 않는다(그 시간이 «딜레이» 로 보였다) */
function memoPaint(){
  var w=$('memoBoxW');
  if(!w || !S.close){ closeRender(); return; }
  w.innerHTML=memoBox(S.close);
  $('pClose').querySelectorAll('[data-memo]').forEach(function(b){
    var v=b.getAttribute('data-memo').split('|'), at=v[0], key=v.slice(1).join('|');
    var n=memoRows().filter(function(m){ return m.at===at && m.key===key; }).length;
    b.className='bub'+(n?' on':''); b.title=n?('메모 '+n):'메모 작성';
    b.innerHTML=ico('msg')+(n?('<b>'+n+'</b>'):'');
  });
  bindMemo(); memoTab();
}
/** 말풍선 단추 — 그 줄에 달린 메모 수. 색만이 아니라 숫자가 같이 간다 */
function memoBub(at,key){
  var n=memoRows().filter(function(m){ return m.at===at && m.key===key; }).length;
  return '<button type="button" class="bub'+(n?' on':'')+'" data-memo="'+esc(at)+'|'+esc(key)+'" '
    +'title="'+(n?('메모 '+n):'메모 작성')+'" aria-label="'+esc(key)+' 메모'+(n?(' '+n+'건'):' 달기')+'">'+ico('msg')+(n?('<b>'+n+'</b>'):'')+'</button>';
}
function memoSt(m){
  if(m.st==='확인됨') return sdot('ok','확인됨'+(m.replyAt?(' · '+m.replyAt):''));
  if(m.st==='요청함') return sdot('me','확인 요청함');
  return '<span class="sd sd-no" title="미전송"></span>';
}
function memoCard(m, mode){
  var h='<div class="mc st-'+esc(m.st)+'" data-mid="'+esc(m.id)+'"><div class="mh">'+memoSt(m)
    +'<b>'+esc(m.by)+'</b><span class="hint">'+esc(m.when)+'</span>'
    +'<button type="button" class="tgt" data-mgo="'+esc(m.at)+'|'+esc(m.key)+'" title="해당 행 이동">'+esc(m.at==='이달'?'당월':m.key)+'</button>';
  // 손잡이는 머리줄 오른쪽 — 아직 저장 안 된 줄(tmp)도 같은 자리를 차지해 높이가 안 흔들린다
  if(mode==='fin'){
    var dis=m.tmp?' disabled':'';
    if(m.st==='요청함') h+=ibtn('check','확인됨으로 (답 없이 닫기)','data-mok="'+esc(m.id)+'"'+dis,'s');
    if(m.st==='확인됨') h+=ibtn('refresh','재개','data-mre="'+esc(m.id)+'"'+dis,'s');
    if(m.st==='안보냄' || S.memo.canWrite) h+=ibtn('trash','삭제','data-mdel="'+esc(m.id)+'"','s del');
  }
  h+='</div><p>'+esc(m.text)+'</p>';
  if(m.reply) h+='<div class="rp"><b>'+esc(m.replyBy)+'</b>'+esc(m.reply)+'</div>';
  if(mode==='reply' && m.st==='요청함')
    h+='<div class="rp in"><input type="text" data-mrep="'+esc(m.id)+'" aria-label="답변"><button type="button" class="btn sm pri" data-mrepb="'+esc(m.id)+'">답변</button></div>';
  return h+'</div>';
}
function memoBox(d){
  // 월마감 탭이 숨어 있으면(첫 화면 유휴 예열) 받지 않는다 — 탭을 열면 closeRender 가 다시 불러 그때 받는다
  if(!S.memo || S.memo.ym!==d.ym){ if(!$('pClose').hidden) memoLoad(d.ym); return ''; }
  var M=S.memo, rows=memoRows().filter(function(m){
    var bs=String(m.br||'').split(',').filter(String);
    return !bs.length || bs.some(brShow);
  });
  var h='';
  if(M.canWrite){
    var byTo={}, order=[];
    rows.forEach(function(m){ var k=m.toNames.join('·')||'(확인자 없음 — 기록)'; if(!byTo[k]){ byTo[k]=[]; order.push(k); } byTo[k].push(m); });
    var nUnsent=rows.filter(function(m){ return m.st==='안보냄' && m.to.length; }).length;
    var nOpen=rows.filter(function(m){ return m.st==='요청함'; }).length;
    h+='<div class="secth" style="border-top:1px solid var(--line-2)"><b>확인 요청함</b>'
      +(brLabel()?('<span class="pill acc">'+esc(brLabel())+'</span>'):'')
      +(nUnsent?sdot('n','아직 안 보낸 메모 '+nUnsent+'건',nUnsent):'')
      +(nOpen?('<span class="hint">답변 대기 '+fmt(nOpen)+'</span>'):'')
      +'<span class="grow"></span>'
      +ibtn('msg','당월 기록','id="memoMonth"')
      +(nUnsent?('<button type="button" class="btn sm pri" id="memoSendAll" title="미전송 메모 '+nUnsent+'건 전송" aria-label="미전송 메모 '+nUnsent+'건 전송">'+ico('send')+' '+nUnsent+'</button>'):'')
      +'</div>';
    if(!rows.length) h+='<div class="skel">메모 없음</div>';
    else{
      h+='<div class="mbox">';
      order.forEach(function(k){
        var ms=byTo[k], un=ms.filter(function(m){ return m.st==='안보냄' && m.to.length; });
        h+='<div class="mgrp"><div class="mgh"><span class="mwho">'+esc(k)+'</span><span class="hint">'+ms.length+'건</span><span class="grow"></span>'
          +(un.length?('<button type="button" class="btn sm" data-msend="'+esc(un.map(function(m){ return m.id; }).join(','))+'" title="'+un.length+'건 전송" aria-label="'+esc(k)+' 에게 '+un.length+'건 전송">'+ico('send')+' '+un.length+'</button>'):'')+'</div>'
          +ms.map(function(m){ return memoCard(m,'fin'); }).join('')+'</div>';
      });
      h+='</div>';
    }
  }else{
    var mine=rows.filter(function(m){ return m.mine; });
    if(!mine.length) return '';
    var open=mine.filter(function(m){ return m.st==='요청함'; }).length;
    h+='<div class="secth" style="border-top:1px solid var(--line-2)"><b>확인 대상 메모</b>'
      +(open?sdot('n','답변 대기 메모 '+open+'건',open):sdot('ok','답변 완료'))
      +'</div>'
      +'<div class="mbox"><div class="ib">'+mine.map(function(m){ return memoCard(m,'reply'); }).join('')+'</div></div>';
  }
  return h;
}
/** 탭 머리 숫자 — 담당자에게 온 메모 */
function memoTab(){
  var e=$('tcClose'); if(!e || !S.memo) return;
  if(S.memo.mineOpen){ e.textContent='메모 '+S.memo.mineOpen; e.className='c bad'; }
}
/** 대상의 브랜드 — 품번은 앞 두 자리, 입고묶음은 그 묶음 품번들 */
function memoBrands(at,key){
  if(at==='품번') return [String(key).slice(0,2).toUpperCase()];
  if(at==='입고묶음'){ var g=((S.close&&S.close.cards)||[]).filter(function(c){ return c.grp===key; })[0]; var bs={}; ((g&&g.items)||[]).forEach(function(it){ bs[String(it).slice(0,2).toUpperCase()]=1; }); return Object.keys(bs).sort(); }
  return [];
}
function memoNow(){ var d=new Date(), p=function(n){ return (n<10?'0':'')+n; }; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
/** 서버 답을 기다리지 않는다 — 누르는 순간 자리에 보이고, 뒤에서 저장한다. 실패하면 빼고 알린다 */
function memoAdd(at,key){
  var ex=memoRows().filter(function(m){ return m.at===at && m.key===key; });
  var body=ex.length ? ex.map(function(m){ return '· '+m.by+' '+m.when+' — '+m.text+(m.reply?(' ↳ '+m.replyBy+': '+m.reply):''); }).join('\n') : '';
  ui.ask({title:'메모 — '+(at==='이달'?'당월':key), body:body, ok:'등록', input:{value:'',multiline:true}}).then(function(t){
    if(t===null || !String(t).trim()) return;
    var text=String(t).trim(), M=S.memo||{rows:[],owners:{}}, bs=memoBrands(at,key), seen={}, to=[], toN=[];
    bs.forEach(function(b){ ((M.owners||{})[b]||[]).forEach(function(o){ if(seen[o.e]) return; seen[o.e]=1; to.push(o.e); toN.push(o.n||o.e); }); });
    var tmp={ id:'tmp'+Date.now(), at:at, key:key, br:bs.join(','), text:text, by:(M.meName||'나'), when:memoNow(), to:to, toNames:toN, st:'안보냄', reply:'', mine:false, own:true, tmp:true };
    if(!S.memo) S.memo={ym:S.ym, rows:[], owners:{}, canWrite:true};
    S.memo.rows.push(tmp); memoPaint();
    if(window.MO) MO.ring(document.querySelector('[data-mid="'+tmp.id+'"]'));   // 새 메모
    note('메모를 달았습니다'+(toN.length?(' — 확인자: '+toN.join('·')):''),'ok');
    run('apiMemoSave',[S.ym,{at:at,key:key,text:text}],function(r){
          if(tmp.cancel && r.newId){   // 저장되기 전에 지웠다 — 서버에 생긴 줄도 지운다
            r.rows=(r.rows||[]).filter(function(x){ return x.id!==r.newId; });
            run('apiMemoDelete',[S.ym,r.newId],function(){},function(){});
          }
          memoSet(r, tmp.id); memoPaint(); },
        function(m){ S.memo.rows=S.memo.rows.filter(function(x){ return x.id!==tmp.id; }); memoPaint(); note('메모가 저장되지 않았습니다 — '+String(m),'bad',true); });
  });
}
/** 상태 바꾸기도 먼저 화면에, 저장은 뒤에서. 실패하면 서버 것으로 되돌린다 */
function memoFlip(ids, st, patchFn){
  (S.memo.rows||[]).forEach(function(m){ if(ids.indexOf(m.id)>=0){ m.st=st; if(patchFn) patchFn(m); } });
  memoPaint();
}
function memoRevert(msg){ note(String(msg),'bad',true); S.memoReq=null; memoLoad(S.ym); }
function bindMemo(){
  var P=$('pClose');
  P.querySelectorAll('[data-memo]').forEach(function(b){
    b.onclick=function(e){ e.stopPropagation(); var v=b.getAttribute('data-memo').split('|'); memoAdd(v[0], v.slice(1).join('|')); };
  });
  var mm=$('memoMonth'); if(mm) mm.onclick=function(){ memoAdd('이달', S.ym); };
  var sa=$('memoSendAll'); if(sa) sa.onclick=function(){
    var n=memoRows().filter(function(m){ return m.st==='안보냄'&&m.to.length; }).length;
    ui.ask({title:'확인 요청 전송', body:'미전송 메모 '+n+'건이 담당자 화면 «확인 대상 메모» 에 뜹니다.', ok:n+'건 전송'}).then(function(y){
      if(!y) return;
      var ids=memoRows().filter(function(m){ return m.st==='안보냄'&&m.to.length&&!m.tmp; }).map(function(m){ return m.id; });
      memoFlip(ids,'요청함'); note(n+'건을 보냈습니다','ok');
      run('apiMemoSend',[S.ym,[]],function(r){ memoSet(r); memoPaint(); },memoRevert);
    });
  };
  P.querySelectorAll('[data-msend]').forEach(function(b){ b.onclick=function(){
    var ids=b.getAttribute('data-msend').split(',').filter(function(i){ return i.indexOf('tmp')!==0; });
    memoFlip(ids,'요청함'); note(ids.length+'건을 보냈습니다','ok');
    run('apiMemoSend',[S.ym,ids],function(r){ memoSet(r); memoPaint(); },memoRevert);
  }; });
  P.querySelectorAll('[data-mrepb]').forEach(function(b){ b.onclick=function(){
    var id=b.getAttribute('data-mrepb'), inp=P.querySelector('[data-mrep="'+id+'"]'), t=inp?inp.value.trim():'';
    if(!t){ inp&&inp.focus(); return; }
    memoFlip([id],'확인됨',function(m){ m.reply=t; m.replyBy=(S.memo.meName||'나'); m.replyAt=memoNow(); }); memoTab(); note('답변을 남겼습니다','ok');
    run('apiMemoReply',[S.ym,id,t],function(r){ memoSet(r); memoPaint(); },memoRevert);
  }; });
  P.querySelectorAll('[data-mok]').forEach(function(b){ b.onclick=function(){
    var id=b.getAttribute('data-mok'); memoFlip([id],'확인됨');
    run('apiMemoReply',[S.ym,id,''],function(r){ memoSet(r); memoPaint(); },memoRevert);
  }; });
  P.querySelectorAll('[data-mre]').forEach(function(b){ b.onclick=function(){
    var id=b.getAttribute('data-mre'); memoFlip([id],'요청함');
    run('apiMemoReopen',[S.ym,id],function(r){ memoSet(r); memoPaint(); },memoRevert);
  }; });
  P.querySelectorAll('[data-mdel]').forEach(function(b){ b.onclick=function(){
    var id=b.getAttribute('data-mdel');
    ui.ask({title:'메모 삭제', body:id+' 를 지웁니다.', ok:'삭제', danger:true}).then(function(y){
      if(!y) return;
      var tm=S.memo.rows.filter(function(x){ return x.id===id; })[0];
      S.memo.rows=S.memo.rows.filter(function(x){ return x.id!==id; }); memoPaint();
      if(tm && tm.tmp){ tm.cancel=true; return; }   // 아직 서버에 없다 — 저장 답이 오면 그때 지운다
      run('apiMemoDelete',[S.ym,id],function(r){ memoSet(r); memoPaint(); },memoRevert);
    });
  }; });
  P.querySelectorAll('[data-mgo]').forEach(function(b){ b.onclick=function(){
    var v=b.getAttribute('data-mgo').split('|'), at=v[0], key=v.slice(1).join('|');
    if(at==='품번'){ S.lgQ=key; S.lgOpen=key; closeRender(); var tr=P.querySelector('[data-lg="'+key+'"]'); if(tr) tr.scrollIntoView({block:'center'}); }
    else if(at==='입고묶음'){ S.openStg=5; closeRender(); }

}

/* 지결 대조 리포트 — 담당자가 지출결의서 댓글에 붙이는 글. 숫자는 화면의 입고처별 표와 같다 */
function pvReportText(){
  var d=S.close; if(!d||!d.summary) return '';
  var PVR=[], tot={lines:0,qty:0,base:0,oh:0,landed:0};
  (d.pivot||[]).forEach(function(p){
    var r=p;
    if(p.by){ r={vendor:p.vendor,lines:0,qty:0,base:0,oh:0,landed:0,kd:{}};
      Object.keys(p.by).forEach(function(b){ if(!brShow(b)) return; var q=p.by[b]; r.lines+=q.lines; r.qty+=q.qty; r.base+=q.base; r.oh+=q.oh; r.landed+=q.landed; Object.keys(q.kd||{}).forEach(function(k){ r.kd[k]=(r.kd[k]||0)+q.kd[k]; }); });
      if(!r.lines) return; }
    PVR.push(r); tot.lines+=r.lines; tot.qty+=r.qty; tot.base+=r.base; tot.oh+=r.oh; tot.landed+=r.landed;
  });
  var lab=brLabel()||'전체', L=[];
  L.push('[입고마감 '+d.ym+' · '+lab+'] 거래처별 입고금액 (ERP 입고현황 기준, 공급가)');
  PVR.forEach(function(p){ L.push('- '+p.vendor+' : '+fmt(p.base)+'원 · '+fmt(p.qty)+'개 · '+fmt(p.lines)+'줄'+(p.kd&&p.kd['사입']?' (사입 '+fmt(p.kd['사입'])+'원 포함)':'')); });
  L.push('합계 '+fmt(tot.base)+'원 · '+fmt(tot.qty)+'개');
  var ms=memoRows().filter(function(m){ var bs=String(m.br||'').split(',').filter(String); return !bs.length || bs.some(brShow); });
  if(ms.length){ L.push(''); L.push('특이사항(메모)'); ms.forEach(function(m){ L.push('- '+(m.at==='이달'?'당월':m.key)+' : '+m.text+(m.reply?(' → '+m.replyBy+': '+m.reply):'')); }); }
  L.push(''); L.push('지출결의서 금액과 대조: ☐ 일치  ☐ 차이 (내용:        )');
  L.push('확인: '+((S.boot&&S.boot.me&&(S.boot.me.name||'').split(' · ')[0])||'')+' · '+memoNow());
  return L.join('\n');
}
function bindReport(){
  var b=$('pvReport'); if(!b) return;
  b.onclick=function(){
    var t=pvReportText(); if(!t) return;
    var ok=function(){ note('리포트를 복사했습니다 — 지출결의서 댓글에 붙여 넣으세요','ok'); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, function(){ ui.tell({title:'리포트', body:t}); });
    else ui.tell({title:'리포트', body:t});
  };
}

/** 입고대장 — 마감의 결과물. 줄을 누르면 그 값이 어디서 왔는지 그 자리에서 펼쳐진다. */
function ledger(d,s){
  var K=S.stock;
  if(!K || !K.items) return '<div class="secth"><b>입고대장</b></div>'
    +'<div class="skel">아직 없습니다 — ERP 단계에서 입고현황을 올리면 여기에 품번별로 섭니다.</div>';
  var ym=d.ym;
  var byCost={}; (K.costs||[]).forEach(function(c){ byCost[c.id]=c; });
  var byFx={};   (K.fx||[]).forEach(function(x){ byFx[x.grp]=x; });
  var rows=[];
  Object.keys(K.items).forEach(function(k){
    var it=K.items[k], m=(it.m&&it.m[ym])||[0,0,0];
    if(!m[0] && !m[1] && !m[2]) return;
    // m = [수량, «취득금액», 부대비용]. m[1] 은 이미 부대비용을 품고 있다 —
    // 그대로 기준금액으로 쓰면 열이 부풀고 취득원가는 부대비용을 두 번 더한다.
    if(!brShow(k)) return;   // 담당자는 기본 내 담당 — 맨 위 브랜드 선택을 따른다
    rows.push({ k:k, nm:it.nm||'', kd:it.kd||'제작', q:m[0], base:m[1]-m[2], oh:m[2], p:it.p||null, aq:it.q||0,
                s:it.s||null, g:it.g||[] });
  });
  rows.sort(function(a,b){ return (b.base+b.oh)-(a.base+a.oh); });
  var q=String(S.lgQ||'').trim().toUpperCase();
  var L=rows.filter(function(r){
    if(!q) return true;
    return r.k.toUpperCase().indexOf(q)>=0 || String(r.nm).toUpperCase().indexOf(q)>=0;
  });
  var cap=S.lgAll?L.length:Math.min(L.length,30);

  var h='<div class="secth" style="border-top:1px solid var(--line-2)"><b>입고대장</b>'
    +(brLabel()?('<span class="pill acc">'+esc(brLabel())+'</span>'):'')
    +(TIDY?('<span class="hint" title="행을 누르면 값의 근거가 펼쳐집니다">'+fmt(rows.length)+'품번</span>')   // 10/27 정리: 숨김 — 설명 문장은 title 로
      :('<span class="hint">'+fmt(rows.length)+'품번 · 줄을 누르면 이 값이 어디서 왔는지 펼쳐집니다</span>'))
    +'<span style="margin-left:auto;display:flex;gap:6px;align-items:center">'
    +'<input type="text" id="lgQ" value="'+esc(S.lgQ||'')+'" placeholder="품번·품명 검색" '
    +'style="font:inherit;font-size:13px;padding:3px 7px;border:1px solid var(--line-2);'
    +'background:var(--surf);color:var(--ink);width:170px">'
    +ibtn('dl','엑셀 다운로드','id="lgCsv"')+'</span></div>';

  // 부대비용을 끈 동안 이 달에 얹힌 게 없으면 기준금액 = 취득원가 — 한 열로(열 폭 고정은 그대로)
  var noOh=!COST_ON && !rows.some(function(r){ return r.oh; }), NC=noOh?7:9;
  h+='<div class="hstk"><table class="lgt"><colgroup><col class="c-bc"><col class="c-k"><col><col class="c-q"><col class="c-a">'
    +(noOh?'<col class="c-s"><col class="c-g">':'<col class="c-s"><col class="c-a"><col class="c-g"><col class="c-a">')
    +'</colgroup><thead><tr><th class="bc"></th><th>품번</th><th>품명</th><th class="n">수량</th>'
    +(noOh?'<th class="n">취득원가</th><th>단가 기준</th><th>입고묶음</th>'
      :('<th class="n">기준금액</th><th>단가 기준</th><th class="n">부대비용</th><th>입고묶음</th>'
    +'<th class="n">취득원가</th>'))+'</tr></thead><tbody>';
  /* 사입이 섞인 브랜드(UO)는 «제작» «사입» 두 묶음으로 쌓는다 — 머리 줄이 곧 소계. 머리를 누르면 접힌다 (E안 · 2026-10-07) */
  var hasBuy = L.some(function(r){ return r.kd==='사입'; });
  var LL = L.slice(0,cap);
  (hasBuy ? ['제작','사입'] : ['']).forEach(function(kd){
  var G = kd ? LL.filter(function(r){ return r.kd===kd; }) : LL;
  if(kd){
    var all=L.filter(function(r){ return r.kd===kd; }), sq=0, sb=0;
    all.forEach(function(r){ sq+=r.q; sb+=r.base+r.oh; });
    var fold=!!(S.lgFold&&S.lgFold[kd]);
    h+='<tr class="lgg'+(fold?' fold':'')+'" data-lgg="'+kd+'"><td colspan="'+NC+'"><span class="chev"></span>'+kdChip(kd)
      +'<b>'+fmt(all.length)+'품번</b><span class="hint">'+fmt(sq)+'개</span><span class="gsum">'+fmt(sb)+'</span></td></tr>';
    if(fold) return;
  }
  G.forEach(function(r){
    var gs={}, cl=[];
    if(r.p) Object.keys(r.p).forEach(function(cid){
      var c=byCost[cid]; if(!c) return;
      cl.push({ c:c, amt:r.p[cid] });
      String(c.val||'').split(';').forEach(function(g){ g=g.trim(); if(g) gs[g]=1; });
    });
    /* 묶음은 서버가 준 것을 먼저 쓴다 — 부대비용에서 거꾸로 캐면 비용 없는 달에 안 보인다 */
    var gl = (r.g && r.g.length) ? r.g : Object.keys(gs);
    var bs = bsTop(r.s);
    var fx = gl.length ? byFx[gl[0]] : null;
    var src = '<span class="pill'+(bs.k==='환율적용'?' a':'')+'">'+esc(bs.lbl)+'</span>';
    var open=S.lgOpen===r.k;
    h+='<tr data-lg="'+esc(r.k)+'"'+(open?' class="on"':'')+' style="cursor:pointer">'
      +'<td class="bc">'+memoBub('품번', r.k)+'</td>'
      +'<td class="k"><b>'+esc(r.k)+'</b></td><td class="hint">'+esc(r.nm)+'</td>'
      +'<td class="n">'+fmt(r.q)+'</td><td class="n">'+(noOh?('<b>'+fmt(r.base)+'</b>'):fmt(r.base))+'</td>'
      +'<td>'+src+'</td>'
      +(noOh?'':('<td class="n">'+(r.oh?fmt(r.oh):'–')+'</td>'))
      +'<td class="k hint">'+esc(gl.join(', ')||'–')+'</td>'
      +(noOh?'':('<td class="n"><b>'+fmt(r.base+r.oh)+'</b></td>'))+'</tr>';
    if(open) h+='<tr><td colspan="'+NC+'" class="lgev">'+lgWhy(r,cl,fx,gl)+'</td></tr>';
  });
  });
  h+='</tbody></table></div>';
  if(L.length>cap) h+='<div style="padding:7px"><button class="btn sm" id="lgMore">'
    +'잔여 '+fmt(L.length-cap)+'품번 더 보기</button></div>';
  return h;
}

/** 제작/사입 칩 — 색만이 아니라 테두리 모양으로도 갈린다 (제작 실선 · 사입 점선) */
function kdChip(kd){ return '<span class="kd '+(kd==='사입'?'bu':'mk')+'">'+esc(kd)+'</span>'; }

/** 20260729 → 2026-07-29 */
function ymd8(v){
  var t=String(v||'').replace(/[^0-9]/g,'');
  return (t.length===8) ? (t.slice(0,4)+'-'+t.slice(4,6)+'-'+t.slice(6,8)) : String(v||'');
}

/** 환율 시트의 «출처» 는 기계가 적은 문자열이다 — 어느 자료인지 사람 말로 푼다.
    · API012 20260729 과세환율        ← B/L 잇기가 적음. 날짜는 유니패스 «수리일»
    · 관세청 과세환율 20260729 · 수리일 ← 위와 같음 (새로 적는 꼴)
    · 과세환율(입고일 20260729)        ← 과세환율 자동이 적음. 날짜는 ERP «입고일»
    · ERP에 외화단가 없음 — …          ← 수입이 아님 */
function fxSrcOf(fx){
  var raw=String((fx&&fx.src)||'');
  var m=raw.match(/^API012\s+(\d{8})\s*과세환율$/)
       || raw.match(/^관세청 과세환율\s+(\d{8})\s*·\s*수리일$/);
  if(m) return { 자료:'관세청 유니패스 · 과세환율(수입)', 날:ymd8(m[1]), 잡은법:'유니패스 수리일', raw:raw };
  m=raw.match(/^과세환율\(입고일\s*(\d{8})\)$/)
   || raw.match(/^관세청 과세환율\s+(\d{8})\s*·\s*입고일$/);
  if(m) return { 자료:'관세청 유니패스 · 과세환율(수입)', 날:ymd8(m[1]), 잡은법:'ERP 입고일', raw:raw };
  return { 자료:raw, 날:'', 잡은법:'', raw:raw };
}

/** 근거 한 줄 — «어디서» 와 «값» 을 한 줄에, 설명은 그 밑에.
    세 칸으로 벌리면 좁은 칸에서 값이 잘려 나간다 — 값이 안 보이면 표의 뜻이 없다. */
function srcRow(where, what, val, mono){
  return '<tr><td class="sw">'+esc(where)
    +(what?('<div class="hint">'+esc(what)+'</div>'):'')+'</td>'
    +'<td class="n'+(mono?' mono':'')+'"><b>'+(mono?esc(val):val)+'</b></td></tr>';
}

/** 이 품번의 기준금액을 «실제로» 세운 것 — 금액이 가장 큰 근거.
    환율 시트에 환율이 적혀 있어도 ERP에 입고단가가 있으면 입고단가가 이긴다. */
function bsTop(s){
  var K=s?Object.keys(s):[];
  if(!K.length) return { k:'입고단가', lbl:'입고단가', mix:0 };
  K.sort(function(a,b){ return Math.abs(s[b])-Math.abs(s[a]); });
  var lbl={'사전원가':'사전원가','입고단가':'입고단가','환율적용':'환율','사전원가예외':'사전원가','임가공':'임가공 · 사전원가','사후원가':'사후원가','미확정':'아직 미정'}[K[0]]||K[0];
  return { k:K[0], lbl:lbl+(K.length>1?' 외':''), mix:K.length-1 };
}

      + cl.map(function(x){

  }
  h+='</div></div>';
