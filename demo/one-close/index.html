/** 건의 ym 과 출고일의 달이 다르면 출고일 쪽으로 옮긴다 (딸린 줄도 같이).
 *  «9월 마감에 8월 건» 같은 어긋남을 없앤다. */
function repairRecYm() {
  var sh = sheet_(SH.REC), head = HEAD[SH.REC];
  var all = sh.getDataRange().getValues();
  if (all.length < 2) { Logger.log('건이 없습니다'); return; }
  var iYm = head.indexOf('ym'), iId = head.indexOf('id'), iDt = head.indexOf('출고일');
  var moved = [], rows = [];
  for (var r = 1; r < all.length; r++) {
    var row = all[r].slice(0, head.length);
    if (!String(row[iId] || '').length) continue;
    var d = dOf_(row[iDt]), was = ymOf_(row[iYm]);
    if (/^\d{4}-\d{2}-\d{2}$/.test(d)) {
      var should = d.slice(0, 7);
      if (should !== was) { moved.push({ id: String(row[iId]), from: was, to: should }); row[iYm] = should; }
      else row[iYm] = was;
      row[iDt] = d;
    }
    rows.push(row);
  }
  if (rows.length) {
    sh.getRange(2, 1, all.length - 1, head.length).clearContent();
    sh.getRange(2, 1, rows.length, head.length).setValues(rows);
  }
  // 딸린 시트의 ym 도 같이
  var touched = 0;
  [SH.PLAN, SH.WMS, SH.REV].forEach(function (name) {
    var s2 = sheet_(name), h2 = HEAD[name], a2 = s2.getDataRange().getValues();
    if (a2.length < 2) return;
    var j = h2.indexOf('id'), jy = h2.indexOf('ym');
    if (j < 0 || jy < 0) return;
    var hit = false;
    for (var i = 1; i < a2.length; i++) {
      var id = String(a2[i][j] || '');
      for (var k = 0; k < moved.length; k++) {
        if (moved[k].id === id) { a2[i][jy] = moved[k].to; hit = true; touched++; break; }
      }
    }
    if (hit) s2.getRange(2, 1, a2.length - 1, h2.length)
      .setValues(a2.slice(1).map(function (x) { return x.slice(0, h2.length); }));
  });
  _MEMO = {}; _SHEET = {}; cacheWipeAll_();   // 시트를 직접 고쳤다 — 요청 사이 캐시도 버린다
  cacheWipeAll_(); _BUMP = null;
  Logger.log('옮긴 건 ' + moved.length + '개 · 딸린 줄 ' + touched + '개'
    + (moved.length ? (' — ' + moved.map(function (m) { return m.id + ' ' + m.from + '→' + m.to; }).join(', ')) : ''));
}

/** ym 정규화 — 시트가 '2026-09' 를 날짜로 바꿔 저장해도 항상 'YYYY-MM' 으로 되돌린다 */
/** 귀속월. 날짜를 먼저 dOf_ 로 편 뒤 앞 7자를 쓴다 —
 *  예전엔 ISO 를 그대로 읽어 8/1 이 2026-07 이 됐다. */
function ymOf_(v) {
  if (v instanceof Date) return isNaN(v.getTime()) ? '' : Utilities.formatDate(v, 'Asia/Seoul', 'yyyy-MM');
  var t = String(v === null || v === undefined ? '' : v).trim();
  if (!t) return '';
  var d = dOf_(t);                                   // 같은 규칙을 지나게 한다
  var md = String(d).match(/^(\d{4})-(\d{2})-\d{2}$/);
  if (md) return md[1] + '-' + md[2];
  var m = t.match(/^(\d{4})[-\/.]?(\d{2})$/);          // 2026-09 · 202609 · 2026/09
  return m ? (m[1] + '-' + m[2]) : t;
}

  }
  var ss = SpreadsheetApp.create('입고 검수 DB (ipgo-web)');
  Object.keys(SH).forEach(function (k) {
    var name = SH[k];

function parseCartons_(sheets) {

      + 'ERP에서 그 달 입고현황을 «합계 포함» 으로 다시 내려받아, «ERP» 단계에서 그 파일을 올려 주세요.');

    if (got !== EXPECT_HDR[i]) bad.push((c + 1) + "열 '" + got + "' 기대 '" + EXPECT_HDR[i] + "'");

var POSTCOST_FROM = '2026-09';
/** 이 달부터 기준금액 = ERP 사전원가금액, 국내·수입 구분 없이 (어진 결정 2026-10-26).
 *  9월까지는 아래 규칙 그대로 — 9월은 지결·홈택스와 원 단위 대사가 끝난 달. App.html PRE_FROM 과 같이 바꾼다 */
var BASE_PRE_FROM = '2026-10';
function baseOf_(l, ym) {
  if (String(ymOf_(ym)) >= BASE_PRE_FROM) { l.base = l.amt_pre; l.base_src = '사전원가'; return; }
  if (l.unit_ipgo === 0 && l.qty !== 0 && !l.amt_ipgo && !l.unit_imp && l.amt_pre && l.buy === '임가공') {
    l.base = l.amt_pre; l.base_src = '임가공'; return;
  }
  if (String(ymOf_(ym)) >= POSTCOST_FROM && l.unit_ipgo === 0 && l.qty !== 0 && l.amt_pre
      && (l.unit_imp !== 0 || l.buy === '수입')) {
    l.base = l.amt_pre; l.base_src = '사후원가'; return;
  }
  if (l.unit_ipgo === 0 && l.qty !== 0 && (l.unit_imp > 0 || l.unit_pre !== 0)) { l.base = 0; l.base_src = '미확정'; }
  else { l.base = l.amt_ipgo; l.base_src = '입고단가'; }
}

function fxOf_(ym) {
  var out = {};
  rows_(SH.FX).forEach(function (r) {
    if (String(r.ym) !== String(ym)) return;
    var g = String(r['입고묶음'] || '').trim();
    if (!g) return;
    var mode = String(r['기준'] || '환율').trim(), rate = num_(r['환율']);
    out[g] = { mode: mode, rate: rate > 0 ? rate : null, src: String(r['출처'] || '').trim(),
               bl: String(r['BL'] || '').trim().toUpperCase(), memo: String(r['메모'] || '').trim() };
  });
  return out;
}

function applyFx_(lines, fx) {
  lines.forEach(function (l) {
    if (l.base_src !== '미확정') return;
    var s = fx[l.grp];
    if (!s) return;
    if (s.mode === '사전원가') { l.base = l.amt_pre; l.base_src = '사전원가예외'; }
    // 반품(음수 USD)도 원래 입고의 역분개이므로 같은 환율을 쓴다.
    // 원본 파이썬은 > 0 이라 반품 행이 영원히 '미확정' 으로 남았다 (8월 VENDOR-X 에서 드러남).
    else if (s.rate && l.amt_imp !== 0) { l.base = bround_(l.amt_imp * s.rate); l.base_src = '환율적용'; }
  });
}

/* ──────────────────────────────────────────── 입력 2: 부대비용 */

/** «귀속» 은 재고원가 아니면 기간비용 둘 뿐이다.
 *  오타가 나면 지금까지는 조용히 «배부 안 함» 이 되어 부대비용이 통째로 사라졌고,
 *  V2 는 양변이 같이 줄어 통과했다. 이제는 멈춘다. */
var INV_OK = ['재고원가', '기간비용'];
// 1월 이전 시트는 «비용» 으로 적혀 있다 — 오타가 아니라 그때 쓰던 표현이다.
// 읽을 때는 기간비용으로 받아 준다. 새로 넣을 때는 위 두 가지만 쓴다.
var INV_ALIAS = { '비용': '기간비용' };

function invOf_(v, id, must) {
  var t = String(v === null || v === undefined ? '' : v).trim();
  // 읽을 때는 빈 값을 재고원가로 본다(옛 데이터). 새로 넣을 때는 반드시 적어야 한다.
  if (!t) {
    if (must) throw new Error('부대비용 ' + (id || '') + ' 의 «귀속» 을 안 골랐습니다 — '
      + '«부대비용» 단계의 «귀속» 칸에서 ' + INV_OK.join(' 또는 ') + ' 중 하나를 고르세요. '
      + '(재고원가 = 물건값에 얹는다 · 기간비용 = 그 달 비용으로 털어낸다)');
    return true;
  }
  if (INV_ALIAS[t] && !must) t = INV_ALIAS[t];      // 옛 표현은 읽을 때만 받아 준다
  if (INV_OK.indexOf(t) < 0)
    throw new Error('부대비용 ' + (id || '') + ' 의 «귀속» 에 «' + t + '» 이라고 적혀 있습니다 — 쓸 수 없는 값입니다. '
      + '«부대비용» 단계에서 그 비용을 열어 «귀속» 을 ' + INV_OK.join(' 또는 ') + ' 중 하나로 고쳐 주세요.');
  return t === '재고원가';
}

function costsOf_(ym) {
  var costs = rows_(SH.COST).filter(function (r) { return String(r.ym) === String(ym) && String(r.id || '').trim(); })
    .map(function (r) {
      return {
        id: String(r.id).trim(), ym: String(r.ym), type: String(r['비용유형'] || '').trim(),
        amount: ai_(r['금액']), supplier: String(r['공급자'] || '').trim(),
        inv: invOf_(r['귀속'], r.id),
        scope: String(r['배부범위'] || '').trim(), scope_val: String(r['범위값'] || '').trim(),
        exclude: String(r['제외품번'] || '').split(';').map(function (x) { return x.trim(); }).filter(String),
        include: String(r['포함품번'] || '').split(';').map(function (x) { return x.trim(); }).filter(String),
        basis: String(r['배부기준'] || '').trim(), doc: String(r['증빙번호'] || '').trim(),
        date: ymd_(r['발생일']), memo: String(r['메모'] || '').trim()
      };
    });
  var direct = {};
  rows_(SH.CITEM).forEach(function (r) {
    if (String(r.ym) !== String(ym)) return;
    var cid = String(r['비용id'] || '').trim();
    if (!cid) return;
    (direct[cid] = direct[cid] || {})[String(r['품번']).trim()] = ai_(r['금액']);
  });
  return { costs: costs, direct: direct };
}

function hsOf_() {
  var out = {};
  rows_(SH.HS).forEach(function (r) {
    var it = String(r['품번'] || '').trim();
    if (!it) return;
    var raw = r['세율'];
    var rate = (raw === '' || raw === null || raw === undefined) ? null : num_(raw);
    out[it] = { hs: String(r['HS부호'] || '').trim(), tpcd: String(r['관세구분'] || '').trim(),
                rate: rate, src: String(r['근거'] || '').trim(), dt: ymd_(r['확인일']) };
  });
  return out;
}

/* ──────────────────────────────────────────── 배부 엔진 */

/** 정수 배부 — 끝수는 소수부 큰 행부터 흡수 (파이썬 split_int 와 동일) */
function splitInt_(amount, weights) {
  var tot = 0;
  weights.forEach(function (w) { tot += w[1]; });
  if (tot <= 0 || !weights.length) return null;
  var raw = weights.map(function (w) { return [w[0], amount * w[1] / tot]; });
  var fl = raw.map(function (x) { return [x[0], Math.floor(x[1])]; });
  var used = 0;
  fl.forEach(function (x) { used += x[1]; });
  var rem = amount - used;
  var order = raw.map(function (x, i) { return i; })
    .sort(function (a, b) { return (raw[b][1] - fl[b][1]) - (raw[a][1] - fl[a][1]); });
  var step = rem > 0 ? 1 : -1;
  for (var i = 0; i < Math.abs(rem); i++) fl[order[i]][1] += step;
  var out = {};
  fl.forEach(function (x) { out[x[0]] = x[1]; });
  return out;
}

function resolveScope_(cost, lines) {
  var vals = {};
  cost.scope_val.split(';').forEach(function (v) { v = v.trim(); if (v) vals[v] = 1; });
  var pos = lines.filter(function (l) { return l.qty > 0 && l.work !== '반품'; });
  var t;
  if (cost.scope === '전체') t = pos;
  else if (cost.scope === '입고처') t = pos.filter(function (l) { return vals[l.vendor]; });
  else if (cost.scope === '입고묶음') t = pos.filter(function (l) { return vals[l.grp]; });
  else if (cost.scope === '로트') t = pos.filter(function (l) { return vals[l.lot]; });
  else if (cost.scope === '품번') t = (cost.basis === '직접입력') ? pos : pos.filter(function (l) { return vals[l.item]; });
  else if (cost.scope === '수입건만') t = pos.filter(function (l) { return l.buy === '수입'; });
  else t = [];
  if (cost.exclude.length) {
    var ex = {};
    cost.exclude.forEach(function (x) { ex[x] = 1; });
    t = t.filter(function (l) { return !ex[l.item]; });
  }
  return t;
}

function allocate_(lines, costs, direct, HS) {
  var alloc = {}, meta = {};
  costs.forEach(function (c) {
    var m = { targets: 0, allocated: 0, ok: true, basis_used: '', issues: [] };
    meta[c.id] = m;
    if (!c.inv) { m.basis_used = '배부 안 함(비용)'; return; }
    var targets = resolveScope_(c, lines);
    m.targets = targets.length;
    if (!targets.length) { m.ok = false; m.issues.push('배부 대상 행 0건 (범위값을 확인)'); return; }

    function put(lid, v) { var a = alloc[lid] || (alloc[lid] = {}); a[c.id] = (a[c.id] || 0) + v; m.allocated += v; }

    if (c.basis === '직접입력') {
      var table = direct[c.id] || {}, keys = Object.keys(table);
      if (!keys.length) { m.ok = false; m.issues.push('품번별 금액표 없음'); return; }
      var sum = 0;
      keys.forEach(function (k) { sum += table[k]; });
      if (sum !== c.amount) { m.ok = false; m.issues.push('품번별 금액표 합 ' + fmt_(sum) + ' ≠ 입력액 ' + fmt_(c.amount)); }
      var byItem = {};
      targets.forEach(function (l) { (byItem[l.item] = byItem[l.item] || []).push(l); });
      keys.forEach(function (item) {
        var ls = byItem[item];
        if (!ls) { m.ok = false; m.issues.push('품번 ' + item + ' 입고 없음(' + fmt_(table[item]) + '원 미배부)'); return; }
        var part = splitInt_(table[item], ls.map(function (l) { return [l.id, l.qty]; }));
        Object.keys(part).forEach(function (lid) { put(lid, part[lid]); });
      });
      m.wsum = sum;
      m.basis_used = '직접입력(품번) → 색상은 수량비례';
    } else {
      // 모르는 이름이면 멈춘다. 예전엔 마지막 else 로 떨어져 «USD 가 있으면 금액비례» 를 골랐고,
      // 시트에 «수량» 이라고 적힌 8월 네 건이 전부 금액비례로 배부됐다 — 아무도 몰랐다.
      if (BASES.indexOf(String(c.basis)) < 0) {
        m.ok = false;
        m.issues.push('배부기준 «' + c.basis + '» 은 쓸 수 없는 이름입니다. '
                    + BASES.join(' / ') + ' 중에서 고르세요.');
        return;
      }
      var w;
      if (c.basis === '세율가중') {
        var missMap = {};
        targets.forEach(function (l) { if (!HS[l.item] || HS[l.item].rate === null || HS[l.item].rate === undefined) missMap[l.item] = 1; });
        var miss = Object.keys(missMap).sort();
        if (miss.length) { m.ok = false; m.issues.push('세율 미등록 품번 ' + miss.length + '개 (' + miss.slice(0, 6).join(', ') + ')'); return; }
        w = targets.map(function (l) { return [l.id, l.amt_imp * HS[l.item].rate]; });
        var tw = 0;
        w.forEach(function (x) { tw += x[1]; });
        if (tw <= 0) w = targets.map(function (l) { return [l.id, l.base * HS[l.item].rate]; });
        m.basis_used = '세율가중(품번별 관세율)';
      } else if (c.basis === '수량비례') {
        w = targets.map(function (l) { return [l.id, l.qty]; });
        m.basis_used = '수량비례';
      } else if (targets.every(function (l) { return l.amt_imp > 0; })) {
        w = targets.map(function (l) { return [l.id, l.amt_imp]; });
        m.basis_used = '금액비례(수입금액 USD)';
      } else {
        w = targets.map(function (l) { return [l.id, l.base]; });
        m.basis_used = '금액비례(기준금액)';
      }
      var wsum2 = 0;
      w.forEach(function (x) { wsum2 += x[1]; });
      m.wsum = wsum2;
      var p2 = splitInt_(c.amount, w);
      if (p2 === null) { m.ok = false; m.issues.push('가중치 합 0'); return; }
      Object.keys(p2).forEach(function (lid) { put(lid, p2[lid]); });
    }
    if (m.allocated !== c.amount) { m.ok = false; m.issues.push('Σ배부 ' + fmt_(m.allocated) + ' ≠ 입력액 ' + fmt_(c.amount)); }
  });
  return { alloc: alloc, meta: meta };
}

/* ──────────────────────────────────────────── 검증 V1~V5 */

function runChecks_(lines, foot, size_labels, costs, meta, ym, HS) {
  var checks = [];
  var s_qty = 0, s_pre = 0, s_ipgo = 0, size_sum = [];
  for (var i = 0; i < size_labels.length; i++) size_sum.push(0);
  lines.forEach(function (l) {
    s_qty += l.qty; s_pre += l.amt_pre; s_ipgo += l.amt_ipgo;
    l.sizes.forEach(function (s) { size_sum[s[0]] += s[1]; });
  });
  var szOk = foot && size_sum.join(',') === foot.sizes.join(',');
  var ok1 = !!foot && s_qty === foot.qty && s_pre === foot.amt_pre && s_ipgo === foot.amt_ipgo && szOk;
  var d1 = [], gap_ = function (a, b, unit) {
    return (a > b) ? (fmt_(a - b) + unit + ' 더 많습니다') : (fmt_(b - a) + unit + ' 모자랍니다');
  };
  if (!foot) d1.push('파일 맨 아래 «합계» 줄을 못 읽었습니다 — ERP에서 «합계 포함» 으로 다시 내려받아 «ERP» 단계에서 올리세요');
  else {
    if (s_qty !== foot.qty) d1.push('올린 수량이 파일 합계보다 ' + gap_(s_qty, foot.qty, '개')
      + ' (올린 것 ' + fmt_(s_qty) + ' ↔ 파일 합계 ' + fmt_(foot.qty) + ') — «ERP» 단계에서 파일을 다시 올리세요');
    if (s_pre !== foot.amt_pre) d1.push('올린 사전원가금액이 파일 합계보다 ' + gap_(s_pre, foot.amt_pre, '원')
      + ' — «ERP» 단계에서 파일을 다시 올리세요');
    if (s_ipgo !== foot.amt_ipgo) d1.push('올린 입고금액이 파일 합계보다 ' + gap_(s_ipgo, foot.amt_ipgo, '원')
      + ' — «ERP» 단계에서 파일을 다시 올리세요');
    if (!szOk) d1.push('사이즈별 수량이 파일 합계와 다릅니다 — «ERP» 단계에서 파일을 다시 올리세요');
  }
  checks.push({ id: 'V1', name: '완결성: Σ적재 = 파일 합계행', ok: ok1,
    detail: ok1 ? ('올린 ' + fmt_(s_qty) + '개 · 입고금액 ' + fmt_(s_ipgo) + '원이 파일 합계와 하나도 안 틀립니다')
                : d1.join(' · ') });

  var inv = costs.filter(function (c) { return c.inv; });
  var tot_in = 0, tot_alloc = 0, badIds = [];
  inv.forEach(function (c) { tot_in += c.amount; tot_alloc += meta[c.id].allocated; if (!meta[c.id].ok) badIds.push(c.id); });
  var d2 = [];
  if (tot_alloc !== tot_in) d2.push('넣은 부대비용 ' + fmt_(tot_in) + '원 중 ' + fmt_(tot_in - tot_alloc) + '원이 어느 품번에도 안 붙었습니다 — «부대비용» 단계에서 그 비용의 «붙일 자리» 를 다시 고르세요');
  if (badIds.length) d2.push('붙는 자리가 잘못된 부대비용 ' + badIds.join(', ') + ' — «부대비용» 단계에서 그 비용을 열어 «붙일 자리» 와 «나누는 기준» 을 고치세요');
  checks.push({ id: 'V2', name: '배부 완결: Σ배부 = Σ부대비용(재고원가)', ok: tot_alloc === tot_in && !badIds.length,
    detail: (tot_alloc === tot_in && !badIds.length)
      ? (costs.length ? ('부대비용 ' + fmt_(tot_in) + '원이 한 푼도 남김없이 품번에 붙었습니다')
                      : '아직 넣은 부대비용이 없습니다 — 있으면 «부대비용» 단계에서 넣으세요')
      : d2.join(' · ') });

  var s_base = 0, s_subst = 0, s_fx = 0, fxl = [], subst = [], unres = [], s_im = 0, iml = [], s_po = 0, pol = [], prl = 0;
  lines.forEach(function (l) {
    s_base += l.base;
    if (l.base_src === '사전원가예외') { subst.push(l); s_subst += l.amt_pre; }
    else if (l.base_src === '임가공') { iml.push(l); s_im += l.base; }
    else if (l.base_src === '사후원가') { pol.push(l); s_po += l.base; }
    else if (l.base_src === '환율적용') { fxl.push(l); s_fx += l.base; }
    else if (l.base_src === '미확정') unres.push(l);
    else if (l.base_src === '사전원가') prl++;
  });
  var landed = s_base + tot_alloc;
  var ug0 = {};
  unres.forEach(function (l) { ug0[l.grp] = 1; });
  checks.push({ id: 'V3', name: '취득원가 = 기준금액(입고금액) + 재고반영 부대비용', ok: !unres.length,
    detail: unres.length
      ? ('물건값(기준금액)이 아직 안 정해진 줄이 ' + unres.length + '줄 있습니다 (' + Object.keys(ug0).sort().join(', ') + ') — '
         + '«기준금액» 단계에서 이 묶음에 «과세환율 자동» 을 누르거나 환율을 손으로 넣어 주세요')
      : ('취득원가 ' + fmt_(landed) + '원 = 물건값 ' + fmt_(s_base) + '원 + 부대비용 ' + fmt_(tot_alloc) + '원'
         + (fxl.length ? (' · 그중 환율로 세운 것 ' + fmt_(s_fx) + '원(' + fxl.length + '줄)') : '')
         + (subst.length ? (' · 사전원가로 대신한 것 ' + fmt_(s_subst) + '원(' + subst.length + '줄)') : '')
         + (iml.length ? (' · 임가공을 사전원가로 잡은 것 ' + fmt_(s_im) + '원(' + iml.length + '줄)') : '')
         + (pol.length ? (' · 수입을 ERP 사후원가로 잡은 것 ' + fmt_(s_po) + '원(' + pol.length + '줄 · 관세·운임 포함)') : '')
         + (prl ? (' · ERP 사전원가 기준 ' + prl + '줄') : '')) });

  var keys = {}, dups = 0;
  lines.forEach(function (l) {
    var k = JSON.stringify([l.ymd, l.vendor, l.ipgo_no, l.item, l.color, l.work]);
    keys[k] = (keys[k] || 0) + 1;
  });
  Object.keys(keys).forEach(function (k) { if (keys[k] > 1) dups++; });
  var out_month = lines.filter(function (l) { return l.ymd.slice(0, 7) !== ym; }).length;
  var no_target = inv.filter(function (c) { return meta[c.id].targets === 0; }).map(function (c) { return c.id; });
  var bad_ym = costs.filter(function (c) { return c.ym && c.ym !== ym; }).map(function (c) { return c.id; });
  // 관세 배부에는 품번마다 근거가 있어야 한다 (세율가중 → 세율 등록 / 그 밖 → 포함·제외 중 하나)
  var unreviewed = [];
  costs.forEach(function (c) {
    if (c.type !== '관세' || !c.inv || c.scope !== '입고묶음') return;
    var gs = {};
    c.scope_val.split(';').forEach(function (v) { v = v.trim(); if (v) gs[v] = 1; });
    var im = {};
    lines.forEach(function (l) { if (gs[l.grp] && l.qty > 0 && l.work !== '반품') im[l.item] = 1; });
    var items = Object.keys(im).sort(), miss;
    if (c.basis === '세율가중') miss = items.filter(function (it) { return !HS[it] || HS[it].rate === null || HS[it].rate === undefined; });
    else miss = items.filter(function (it) { return c.exclude.indexOf(it) < 0 && c.include.indexOf(it) < 0; });
    if (miss.length) unreviewed.push([c.id, miss]);
  });
  var n_unrev = 0;
  unreviewed.forEach(function (u) { n_unrev += u[1].length; });
  var ug = {};
  unres.forEach(function (l) { ug[l.grp] = 1; });
  // 부대비용은 B/L 통배부(수량 균등)로 정했으므로 품번별 관세 근거는 보지 않는다.
  // 세율가중을 다시 쓰게 되면 그때 n_unrev 를 조건에 넣으면 된다.
  var d4 = [];
  if (dups) d4.push('똑같은 입고가 ' + dups + '가지 두 번씩 들어 있습니다 — «ERP» 단계의 «올린 파일» 에서 겹친 조각을 지우고 파일을 한 번만 올리세요');
  if (out_month) d4.push(ym + ' 밖 입고일이 ' + out_month + '줄 있습니다 — «ERP» 단계에서 그 달 파일로 다시 올리세요');
  if (no_target.length) d4.push('붙을 입고가 한 줄도 없는 부대비용 ' + no_target.join(', ') + ' — «부대비용» 단계에서 그 비용의 «붙일 자리» 를 목록에 있는 묶음으로 고치세요');
  if (bad_ym.length) d4.push('다른 달 부대비용이 섞여 있습니다 ' + bad_ym.join(', ') + ' — «부대비용» 단계에서 그 비용을 지우고 해당 달에서 넣으세요');
  if (unres.length) d4.push('물건값이 아직 안 정해진 줄 ' + unres.length + '줄 (' + Object.keys(ug).sort().join(', ') + ') — «기준금액» 단계에서 이 묶음의 환율을 세우세요');
  checks.push({ id: 'V4', name: '정합: 중복 0 · 월 밖 0 · 대상 없는 비용 0 · 귀속월 불일치 0 · 기준금액 미확정 0',
    ok: dups === 0 && out_month === 0 && !no_target.length && !bad_ym.length && !unres.length,
    detail: d4.length ? d4.join(' · ')
      : '겹친 입고도, 달 밖 입고도, 갈 곳 없는 부대비용도 없고, 물건값도 다 정해졌습니다' });

  var fx_pre = 0, fx_usd = 0, unres_qty = 0, unres_pre = 0;
  fxl.forEach(function (l) { fx_pre += l.amt_pre; fx_usd += l.amt_imp; });
  unres.forEach(function (l) { unres_qty += l.qty; unres_pre += l.amt_pre; });
  var lots = {}, items2 = {}, vendors = {};
  lines.forEach(function (l) { lots[l.lot] = 1; items2[l.item] = 1; vendors[l.vendor] = 1; });
  var oh_exp = 0;
  costs.forEach(function (c) { if (!c.inv) oh_exp += c.amount; });
  return {
    checks: checks,
    summary: {
      qty: s_qty, amt_pre: s_pre, amt_ipgo: s_ipgo, base: s_base, subst_amt: s_subst, subst_n: subst.length,
      fx_amt: s_fx, fx_n: fxl.length, fx_pre: fx_pre, fx_usd: bround_(fx_usd * 100) / 100,
      unres_n: unres.length, unres_qty: unres_qty, unres_pre: unres_pre, unres_groups: Object.keys(ug).sort(),
      post_n: pol.length, post_amt: s_po,
      oh_inv: tot_alloc, oh_exp: oh_exp, landed: landed, diff_pre: landed - s_pre,
      lines: lines.length, lots: Object.keys(lots).length, items: Object.keys(items2).length, vendors: Object.keys(vendors).length
    }
  };
}

/* ──────────────────────────────────────────── 한 달 통째 계산 */

/** 시트에 적재해 둔 입고현황을 lines 로 복원 */
function recvLines_(ym) {
  var out = [];
  (typeof rowsYm_ === 'function' ? rowsYm_(SH.RCPT, ym) : rows_(SH.RCPT)).forEach(function (r) {   // 그 달 줄만 읽는다
    if (String(r.ym) !== String(ym)) return;
    var d = ymd_(r.ymd), vendor = String(r.vendor || ''), ipgo_no = String(r.ipgo_no || '');
    var grp = d.slice(2, 4) + d.slice(5, 7) + d.slice(8, 10) + '_' + vendor;
    var sizes = [];
    try { sizes = JSON.parse(r.sizes || '[]'); } catch (e) {}
    var l = {
      id: ai_(r.id), ymd: d, vendor: vendor, ipgo_no: ipgo_no, grp: grp, lot: grp + '_' + ipgo_no,
      item: String(r.item || ''), name: String(r.name || ''), color: String(r.color || ''),
      buy: String(r.buy || ''), work: String(r.work || ''), note: String(r.note || ''),
      logi: String(r.logi || ''), first_ymd: ymd_(r.first_ymd), qty: ai_(r.qty),
      unit_ipgo: ai_(r.unit_ipgo), unit_pre: ai_(r.unit_pre), unit_imp: num_(r.unit_imp),
      amt_ipgo: ai_(r.amt_ipgo), amt_pre: ai_(r.amt_pre), amt_imp: num_(r.amt_imp), sizes: sizes
    };
    baseOf_(l, ym);
    out.push(l);
  });
  // 부분 적재로 저장 순서가 섞이므로 id 는 읽을 때 매긴다 (한 번의 계산 안에서만 유일하면 된다)
  out.sort(function (a, b) {
    var ka = [a.ymd, a.vendor, a.ipgo_no, a.item, a.color, a.work].join('\u0001');
    var kb = [b.ymd, b.vendor, b.ipgo_no, b.item, b.color, b.work].join('\u0001');
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });
  out.forEach(function (l, i) { l.id = i + 1; });
  return out;
}

/** 조각(브랜드별 적재) 목록 */
function rparts_(ym) {
  return rows_(SH.RMETA).filter(function (r) { return String(r.ym) === String(ym); }).map(function (r) {
    var ft = null;
    try { ft = JSON.parse(r['합계행'] || 'null'); } catch (e) {}
    return { brand: String(r['브랜드'] || '').toUpperCase(), n: ai_(r['행수']), qty: ai_(r['수량']),
             amt: ai_(r['입고금액']), pre: ai_(r['사전원가']), foot: ft,
             file: String(r['파일'] || ''), at: String(r['적재시각'] || ''), who: String(r['적재자'] || ''),
             sizes: String(r['사이즈열'] || '') };
  });
}

/** 조각들을 한 달치로 합친다 — 합계행은 조각 합계행의 합 */
function rmeta_(ym) {
  var ps = rparts_(ym);
  if (!ps.length) return null;
  var sl = [];
  for (var i = 0; i < ps.length; i++) {
    if (ps[i].sizes) { try { sl = JSON.parse(ps[i].sizes); break; } catch (e) {} }
  }
  var foot = { qty: 0, amt_pre: 0, amt_ipgo: 0, amt_imp: 0, sizes: [] };
  var any = false;
  ps.forEach(function (p) {
    if (!p.foot) return;
    any = true;
    foot.qty += ai_(p.foot.qty); foot.amt_pre += ai_(p.foot.amt_pre);
    foot.amt_ipgo += ai_(p.foot.amt_ipgo); foot.amt_imp += num_(p.foot.amt_imp);
    (p.foot.sizes || []).forEach(function (v, k) { foot.sizes[k] = (foot.sizes[k] || 0) + ai_(v); });
  });
  foot.amt_imp = bround_(foot.amt_imp * 100) / 100;
  for (var k = 0; k < sl.length; k++) if (foot.sizes[k] === undefined) foot.sizes[k] = 0;
  var last = ps.slice().sort(function (a, b) { return String(a.at).localeCompare(String(b.at)); }).pop();
  return { size_labels: sl, foot: any ? foot : null, parts: ps,
           file: last ? last.file : '', at: last ? last.at : '' };
}

/** 이 달 전체 — 적재·배부·검증을 한 번에 */
/* 자동 정리 한 번에 closeCompute_ 가 네 번 돌았다(B/L·환율·관세·화면). 사이에 쓴 게 없으면 앞의 값을 쓴다. */
var _CC = {}, _CC_ON = 0;   // 메모는 apiLedger·apiAutoRun 안에서만 켠다 — 그 밖에서는 늘 새로 계산한다
function closeCompute_(ym) {
  if (!_CC_ON || typeof _WV === 'undefined') return closeCompute0_(ym);
  var ck = ym + '@' + _WV;
  if (_CC.hasOwnProperty(ck)) return _CC[ck];
  _CC = {};
  return (_CC[ck] = closeCompute0_(ym));
}
function closeCompute0_(ym) {
  var meta = rmeta_(ym);
  if (!meta) return null;
  var lines = recvLines_(ym);
  applyFx_(lines, fxOf_(ym));
  var CD = costsOf_(ym), HS = hsOf_();
  var A = allocate_(lines, CD.costs, CD.direct, HS);
  var R = runChecks_(lines, meta.foot, meta.size_labels, CD.costs, A.meta, ym, HS);
  return { ym: ym, lines: lines, meta: meta, costs: CD.costs, direct: CD.direct, HS: HS,
           alloc: A.alloc, cmeta: A.meta, checks: R.checks, summary: R.summary };
}

/** 비용을 붙일 자리 — 입고묶음마다 «배부 대상 수량».
 *  resolveScope_ 와 같은 조건(양수·반품 제외)으로 센다. 수불부 수량으로 세면
 *  반품이 상계돼 분모가 작아지고, 화면이 «개당» 을 틀리게 미리 보여준다. */
function costGroups_(C) {
  var gm = {};
  C.lines.forEach(function (l) {
    if (!(l.qty > 0) || l.work === '반품') return;
    var g = gm[l.grp] || (gm[l.grp] = { grp: l.grp, ymd: l.ymd, ven: l.vendor, n: 0, qty: 0, imp: 0, brands: {} });
    g.brands[brandOf_(l.item)] = 1;   // 담당자에겐 내 브랜드가 든 묶음만 보이게
    if (l.ymd < g.ymd) g.ymd = l.ymd;
    g.n++; g.qty += l.qty;
    if (l.buy === '수입') g.imp += l.qty;
  });
  var out = [];
  Object.keys(gm).forEach(function (k) { out.push(gm[k]); });
  out.sort(function (a, b) { return a.ymd < b.ymd ? -1 : (a.ymd > b.ymd ? 1 : b.qty - a.qty); });
  return out;
}

/** 행별 배부 합계 */
function allocByLine_(alloc) {
  var out = {};
  Object.keys(alloc).forEach(function (lid) {
    var t = 0, a = alloc[lid];
    Object.keys(a).forEach(function (cid) { t += a[cid]; });
    out[lid] = t;
  });
  return out;
}


// ───── Duty.gs
/**
 * 관세·환율 — 유니패스 오픈API + 수입신고 실적 + B/L ↔ 입고묶음 자동연결.
 * 인증키는 API마다 다르다. 스크립트 속성 `UNIPASS_API030` / `UNIPASS_API012` 에 넣는다
 * (한 줄에 하나씩 넣던 로컬 data/unipass_key.txt 를 대신하는 자리).
 */
var UNIPASS_FIELDS = ['신고번호', 'MBL', 'HBL', '인도조건', '결제금액', '단위', '총세액합계',
  '관세', '부가세', '총과세가격', '신고일자', '수리일자', '세관', '과'];
var XL_MAP = { '신고번호': '신고번호', 'M-BL번호': 'MBL', 'H-BL번호': 'HBL', '인도조건': '인도조건',
  '결제금액': '결제금액', '단위': '단위', '총세액합계(원)': '총세액합계', '관세(원)': '관세',
  '부가세(원)': '부가세', '총과세가격(원)': '총과세가격', '신고일자': '신고일자',
  '수리일자': '수리일자', '세관': '세관', '과': '과' };

var BL_LAG = [-1, 25];      // 입고일 − 수리일 (일). 통관 전 입고는 없다
var BL_ERRMAX = 0.15;       // 결제금액(USD) 대비 허용 오차
var BL_SKIP = 0.30;         // 어느 묶음도 안 붙이는 선택의 비용
var BL_SURE = [0.015, 0.05];// 오차 1.5% 안 = 확실 · 5% 안 = 유력

/* ──────────────────────────────────────────── 오픈API */

function unipassKey_(api) {
  var P = PropertiesService.getScriptProperties();
  return String(P.getProperty('UNIPASS_' + (api || 'API030')) || P.getProperty('UNIPASS_KEY') || '').trim();
}

/** 유니패스 REST/XML → 반복 노드를 객체 배열로 */
function unipassGet_(path, params, api) {
  var key = unipassKey_(api);
  if (!key) throw new Error('관세청(유니패스) 인증키가 등록돼 있지 않아 '
    + ((api === 'API012') ? '과세환율' : '관세율') + ' 을 못 불러옵니다. '
    + '재무 담당자에게 «유니패스 인증키(' + (api || 'API030') + ') 등록» 을 요청하세요. '
    + '그때까지는 «기준금액» 단계에서 환율을 손으로 넣으면 됩니다.');
  var q = [];
  Object.keys(params).forEach(function (k) { q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k])); });
  q.push('crkyCn=' + encodeURIComponent(key));
  var url = 'https://unipass.customs.go.kr:38010/ext/rest/' + path + '?' + q.join('&');
  var res = UrlFetchApp.fetch(url, { muteHttpExceptions: true, followRedirects: true });
  if (res.getResponseCode() !== 200)
    throw new Error('관세청(유니패스)이 응답하지 않습니다 (응답코드 ' + res.getResponseCode() + '). '
      + '잠시 뒤 다시 눌러 보고, 계속 같으면 «기준금액» 단계에서 환율을 손으로 넣어 주세요.');
  var root = XmlService.parse(res.getContentText()).getRootElement();
  var note = '';
  var rows = [];
  root.getChildren().forEach(function (el) {
    var kids = el.getChildren();
    if (!kids.length) {
      if (el.getName() === 'ntceInfo') note = el.getText();
      return;
    }
    var o = {};
    kids.forEach(function (c) { o[c.getName()] = String(c.getText() || '').trim(); });
    rows.push(o);
  });
  return { rows: rows, note: note };
}

/** API030 관세율 조회. HS 10자리 */
function trrtLookup_(hs) {
  var h = String(hs || '').replace(/[^0-9]/g, '');
  if (h.length !== 10) throw new Error('HS부호는 숫자 10자리여야 하는데 «' + hs + '» 이 들어왔습니다 — '
    + 'HS부호 칸에 6104630000 처럼 숫자 10자리를 넣어 주세요.');
  return unipassGet_('trrtQry/retrieveTrrt', { hsSgn: h }, 'API030');
}

/** API012 관세환율. ymd=YYYYMMDD, 수입(2) */
function fxrateLookup_(ymd) {
  var d = String(ymd || '').replace(/[^0-9]/g, '');
  if (d.length !== 8) throw new Error('과세환율은 날짜 8자리(20260703 처럼)로만 찾을 수 있는데 «' + ymd + '» 이 들어왔습니다 — '
    + '입고일이 비어 있는 묶음이 있는지 «기준금액» 단계에서 확인해 주세요.');
  return unipassGet_('trifFxrtInfoQry/retrieveTrifFxrtInfo', { qryYymmDd: d, imexTp: '2' }, 'API012');
}

/** 품번 한 건 등록·수정. HS만 주면 세율은 API030에서 (실제 적용 = min(기본 A, 한중FTA FCN1)). 세율 비우면 삭제 */
function hsSet_(row) {
  var it = String(row['품번'] || '').trim();
  if (!it) throw new Error('품번이 비어 있어 어느 품목의 세율인지 알 수 없습니다 — 세율 등록 칸에 품번을 먼저 넣어 주세요.');
  var rt = String(row['세율'] === null || row['세율'] === undefined ? '' : row['세율']).trim();
  var hs = String(row['HS부호'] || '').trim();
  var tp = String(row['관세구분'] || '').trim();
  var src = String(row['근거'] || '').trim();
  if (rt === '' && hs) {
    var got = trrtLookup_(hs), cand = {};
    got.rows.forEach(function (r) {
      var c = String(r.trrtTpcd || '').trim();
      if ((c === 'A' || c === 'FCN1') && String(r.trrt || '') !== '') cand[c] = num_(r.trrt);
    });
    var ks = Object.keys(cand);
    if (!ks.length) throw new Error('관세청에서 HS ' + hs + ' 의 기본세율·한중FTA 세율을 못 찾았습니다 — '
      + 'HS부호가 맞는지 다시 보고, 맞다면 «세율» 칸에 세율을 직접 넣어 주세요.');
    tp = ks.sort(function (a, b) { return cand[a] - cand[b]; })[0];
    rt = String(cand[tp]);
    src = src || ('API030 ' + hs + ' (' + tp + ')');
  }
  var cur = rows_(SH.HS).filter(function (r) { return String(r['품번'] || '').trim() !== it; });
  if (rt !== '') {
    if (num_(rt) < 0 || num_(rt) > 100) throw new Error('세율 «' + rt + '» 은 0~100 밖의 값입니다 — '
      + '13% 면 13 처럼 퍼센트 숫자만 넣어 주세요.');
    cur.push({ '품번': it, 'HS부호': hs, '관세구분': tp, '세율': num_(rt), '근거': src,
               '확인일': String(row['확인일'] || Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd')) });
  }
  replaceAll_(SH.HS, cur);
  log_('세율등록', it, hs + ' ' + rt);
  return { ok: true, '품번': it, '건수': cur.length };
}

/* ──────────────────────────────────────────── 수입신고 실적 */

/** 유니패스 «수입신고 실적» 다운로드 엑셀을 그대로 받는다 */
function unipassSave_(ym, sheets) {
  if (!sheets.length || !sheets[0].rows.length)
    throw new Error('올린 파일에 내용이 한 줄도 없습니다 — 유니패스에서 «수입신고 실적» 을 그 달로 조회해 다시 내려받아, '
      + '«부대비용» 단계에서 올려 주세요.');
  var rows = sheets[0].rows;
  var hdr = rows[0].map(function (h) { return String(h === null || h === undefined ? '' : h).trim(); });
  if (hdr.indexOf('H-BL번호') < 0 || hdr.indexOf('관세(원)') < 0)
    throw new Error('이 파일은 유니패스 «수입신고 실적» 이 아닙니다 (H-BL번호·관세(원) 열이 없습니다). '
      + '유니패스 → 수입신고 실적 에서 그 달을 조회해 엑셀로 내려받은 뒤, «부대비용» 단계에서 그 파일을 올려 주세요.');
  var out = [];
  for (var i = 1; i < rows.length; i++) {
    var d = {};
    hdr.forEach(function (h, c) { d[h] = rows[i][c]; });
    if (!String(d['신고번호'] || '').trim()) continue;
    var o = { ym: ym };
    Object.keys(XL_MAP).forEach(function (k) {
      var x = d[k];
      if (x instanceof Date) x = Utilities.formatDate(x, 'Asia/Seoul', 'yyyy-MM-dd');
      else if (typeof x === 'number' && x === Math.floor(x)) x = String(x);
      o[XL_MAP[k]] = (x === null || x === undefined) ? '' : String(x).trim();
    });
    out.push(o);
  }
  if (!out.length) throw new Error('신고번호가 적힌 줄이 한 줄도 없습니다 — 유니패스에서 조회 기간을 그 달로 맞춰 다시 내려받아, '
    + '«부대비용» 단계에서 올려 주세요.');
  wipeYm_(SH.UNI, ym);
  append_(SH.UNI, out);
  log_('유니패스적재', ym, out.length + '행');
  return { ok: true, rows: out.length, bl: out.map(function (r) { return r.HBL; }) };
}

/** 한 B/L 에 신고가 여러 건이면 «합친다».
 *  예) BRI88005621476 = 본건(관세 3,911,570) + 머플러 별도신고(관세 0).
 *  덮어쓰면 나중 신고만 남아 관세가 통째로 사라진다. */
var UNIPASS_SUM = { '결제금액': 1, '총세액합계': 1, '관세': 1, '부가세': 1, '총과세가격': 1 };

function unipassOf_(ym) {
  var out = {};
  rows_(SH.UNI).forEach(function (r) {
    if (String(r.ym) !== String(ym)) return;
    var bl = String(r.HBL || '').trim().toUpperCase();
    if (!bl) return;
    var o = {};
    UNIPASS_FIELDS.forEach(function (k) {
      var v = r[k];
      // 날짜 칸은 시트가 Date 로 돌려준다 — 그대로 글자로 만들면 «Tue Aug 11 2026 …» 이 되어
      // 뒤의 날짜 계산이 전부 깨진다 (B/L 이 하나도 안 이어졌다)
      if (k === '신고일자' || k === '수리일자') { o[k] = dOf_(v); return; }
      o[k] = String(v === null || v === undefined ? '' : v).trim();
    });
    var cur = out[bl];
    if (!cur) { o.n = 1; out[bl] = o; return; }
    cur.n = (cur.n || 1) + 1;
    Object.keys(UNIPASS_SUM).forEach(function (k) {
      cur[k] = String(num_(cur[k]) + num_(o[k]));
    });
    if (String(o['신고번호']) && cur['신고번호'].indexOf(o['신고번호']) < 0)
      cur['신고번호'] += ', ' + o['신고번호'];
    // 날짜는 가장 이른 신고일 · 가장 늦은 수리일 (그 B/L 이 통관을 마친 날)
    if (o['신고일자'] && (!cur['신고일자'] || o['신고일자'] < cur['신고일자'])) cur['신고일자'] = o['신고일자'];
    if (o['수리일자'] && o['수리일자'] > cur['수리일자']) cur['수리일자'] = o['수리일자'];
  });
  return out;
}


/* ──────────────────────────────────────────── B/L ↔ 입고묶음 */

function dnum_(s) {
  s = String(s || '').trim();
  var m = s.match(/^(\d{4})[-/.]?(\d{2})[-/.]?(\d{2})/);
  if (!m) return null;
  return Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])) / 86400000;   // 일 단위 정수
}

/** 이 달 «수입» 묶음별 USD·수량·첫 입고일·입고처·품번 */
function impGroups_(lines) {
  var G = {};
  lines.forEach(function (l) {
    if (l.buy !== '수입') return;
    var g = G[l.grp] || (G[l.grp] = { grp: l.grp, usd: 0, qty: 0, ymd: l.ymd, vendors: {}, items: {} });
    g.usd += l.amt_imp;
    g.qty += l.qty;
    if (l.ymd < g.ymd) g.ymd = l.ymd;
    g.vendors[l.vendor] = 1;
    g.items[l.item] = 1;
  });
  Object.keys(G).forEach(function (k) { G[k].usd = Math.round(G[k].usd * 100) / 100; });
  return G;
}

/** 신고건 dec 에 묶음 조합 sub 를 붙이는 비용. 제약을 어기면 null */
function blCost_(dec, sub, G) {
  var pay = num_(dec['결제금액']), dt = dnum_(dec['수리일자'] || dec['신고일자']);
  if (pay <= 0 || dt === null) return null;
  var usd = 0, lags = [], ven = {};
  for (var i = 0; i < sub.length; i++) {
    var g = G[sub[i]], gd = dnum_(g.ymd);
    if (gd === null) return null;
    var lag = gd - dt;
    if (lag < BL_LAG[0] || lag > BL_LAG[1]) return null;
    usd += g.usd;
    lags.push(lag);
    Object.keys(g.vendors).forEach(function (v) { ven[v] = 1; });
  }
  var err = Math.abs(usd - pay) / pay;
  if (err > BL_ERRMAX) return null;
  var ls = 0;
  lags.forEach(function (x) { ls += x; });
  var mx = Math.max.apply(null, lags);
  // 입고 지연은 순위 가르기용 아주 작은 벌점 (분할 입고는 정상)
  var cost = err + 0.002 * (sub.length - 1) + 0.05 * (Object.keys(ven).length - 1) + (ls / lags.length) / 20000;
  return { groups: sub.slice(), usd: Math.round(usd * 100) / 100, err: err, lag: mx, cost: cost };
}

function combos_(arr, r, cb) {
  var idx = [];
  (function rec(start) {
    if (idx.length === r) { cb(idx.map(function (i) { return arr[i]; })); return; }
    for (var i = start; i < arr.length; i++) { idx.push(i); rec(i + 1); idx.pop(); }
  })(0);
}

/** 유니패스 신고 ↔ 입고묶음 전체 최적 배정. 저장은 하지 않는다 (제안만) */
function blMatch_(ym, lines) {
  var U = unipassOf_(ym);
  var blk = Object.keys(U);
  if (!blk.length) throw new Error('이 달에 올린 유니패스 수입신고 실적이 없어 붙일 B/L 이 없습니다 — '
    + '«부대비용» 단계에서 유니패스 «수입신고 실적» 엑셀을 먼저 올린 뒤, «기준금액» 단계에서 «B/L 자동연결» 을 누르세요.');
  var G = impGroups_(lines);
  var keys = Object.keys(G).filter(function (k) { return G[k].usd > 0; }).sort();
  var decs = blk.map(function (b) { return U[b]; }).sort(function (a, b) {
    return String((a['수리일자'] || '') + (a['신고번호'] || '')).localeCompare(String((b['수리일자'] || '') + (b['신고번호'] || '')));
  });

  var opts = decs.map(function (dec) {
    var cs = [];
    for (var r = 1; r <= 3 && r <= keys.length; r++) {
      combos_(keys, r, function (sub) { var c = blCost_(dec, sub, G); if (c) cs.push(c); });
    }
    cs.sort(function (a, b) { return a.cost - b.cost; });
    return cs.slice(0, 40);
  });

  var best = { total: null, pick: null }, budget = 300000;
  (function dfs(i, used, acc, pick) {
    if (budget <= 0) return;
    budget--;
    if (best.total !== null && acc >= best.total) return;
    if (i === decs.length) { best.total = acc; best.pick = pick.slice(); return; }
    opts[i].forEach(function (c) {
      for (var j = 0; j < c.groups.length; j++) if (used[c.groups[j]]) return;
      var u2 = {};
      Object.keys(used).forEach(function (k) { u2[k] = 1; });
      c.groups.forEach(function (k) { u2[k] = 1; });
      dfs(i + 1, u2, acc + c.cost, pick.concat([c]));
    });
    dfs(i + 1, used, acc + BL_SKIP, pick.concat([null]));
  })(0, {}, 0, []);

  var pick = best.pick || decs.map(function () { return null; });
  var FX = fxOf_(ym), rows = [], taken = {};
  decs.forEach(function (dec, i) {
    var c = pick[i], alts = opts[i];
    var dt = dec['수리일자'] || dec['신고일자'];
    var row = { BL: dec.HBL || '', MBL: dec.MBL || '', '신고번호': dec['신고번호'] || '',
      '신고일자': dec['신고일자'] || '', '수리일자': dec['수리일자'] || '',
      '결제금액': num_(dec['결제금액']), '관세': ai_(dec['관세']),
      '묶음': [], usd: null, '오차': null, '확신': '못 찾음', '다음후보': '', '경고': '' };
    if (c) {
      c.groups.forEach(function (k) {
        taken[k] = 1;
        var g = G[k], cur = FX[k] || {};
        row['묶음'].push({ grp: k, usd: g.usd, qty: g.qty, ymd: g.ymd,
          '입고처': Object.keys(g.vendors).sort().join(' / '), '품번': Object.keys(g.items).sort(),
          lag: dnum_(g.ymd) - dnum_(dt), '기존BL': cur.bl || '', '기준': cur.mode || '', '환율': cur.rate || null });
      });
      row.usd = c.usd;
      row['오차'] = Math.round(c.err * 100000) / 1000;
      row['확신'] = c.err <= BL_SURE[0] ? '확실' : (c.err <= BL_SURE[1] ? '유력' : '확인 필요');
      var chosen = JSON.stringify(c.groups);
      var nxt = alts.filter(function (a) { return JSON.stringify(a.groups) !== chosen; })[0];
      if (nxt) {
        row['다음후보'] = nxt.groups.join(' + ') + ' — 오차 ' + (nxt.err * 100).toFixed(2) + '%';
        var overlap = nxt.groups.some(function (k) { return c.groups.indexOf(k) >= 0; });
        if (nxt.cost - c.cost < 0.01 && !overlap) row['경고'] = '다음 후보와 점수가 거의 같아 잘못 붙었을 수 있습니다 — 확정하기 전에 결제금액·입고처·날짜를 눈으로 맞춰 보세요.';
      }
      var oldm = {};
      row['묶음'].forEach(function (m) { if (m['기존BL'] && m['기존BL'] !== row.BL) oldm[m['기존BL']] = 1; });
      var old = Object.keys(oldm).sort();
      if (old.length) row['경고'] = (row['경고'] + ' 이 묶음에는 이미 다른 B/L(' + old.join(', ') + ')이 적혀 있습니다 — 확정하면 지금 것으로 덮어씁니다.').trim();
    } else {
      row['경고'] = '결제금액에 맞고 수리일 뒤에 들어온 입고묶음이 없습니다 (다음 달 입고일 수 있습니다) — '
        + '다음 달에 다시 맞추거나, «기준금액» 단계에서 이 신고건의 묶음을 손으로 고르세요.';
    }
    rows.push(row);
  });

  var left = [];
  Object.keys(G).sort().forEach(function (k) {
    if (taken[k]) return;
    var g = G[k], cur = FX[k] || {};
    left.push({ grp: k, usd: g.usd, qty: g.qty, ymd: g.ymd, '입고처': Object.keys(g.vendors).sort().join(' / '),
      '기존BL': cur.bl || '', '기준': cur.mode || '',
      '사유': g.usd <= 0 ? 'ERP에 외화단가가 없어(USD 0) 금액으로 신고건을 맞출 수 없습니다 — «기준금액» 단계에서 이 묶음은 «사전원가» 를 고르세요'
                         : '이 달 신고건 중 금액이 맞는 것이 없습니다 (지난달 신고분일 수 있습니다) — «기준금액» 단계에서 이 묶음의 B/L·환율을 손으로 넣어 주세요' });
  });
  return { ok: true, ym: ym, '신고': decs.length, '묶음': Object.keys(G).length, '붙은묶음': Object.keys(taken).length,
           rows: rows, '남은묶음': left };
}

/** 제안을 확정 — 묶음별 B/L 을 환율 시트에 쓴다. 기준이 비어 있으면 «입고일» 과세환율도 채운다.

    날짜는 ERP 입고일로 잡는다 — ⑤ 의 과세환율 자동과 같은 기준이어야 장부가 한 규칙으로 선다.

    예전엔 신고 수리일이었다. 한 B/L 을 여러 묶음이 나눠 쓰면 남의 날짜 환율이 복사됐다 —

    2026-01 은 260113 과 260123 이 10일 차이인데 같은 @1446.46 을 썼다. */

function blApply_(ym, sel, withFx) {

  var FX = fxOf_(ym), hit = 0, fxHit = 0, notes = [];

  var cacheFx = {};

  var applied = [], fxMissing = [];        // 무엇이 붙었는지 · 환율이 왜 안 채워졌는지

  // 묶음의 첫 입고일은 서버에서 다시 구한다 — 화면이 보낸 값에 기대지 않는다

  var GD = {};

  try {

    var CC = closeCompute_(ym);

    if (CC) {

      var GG = impGroups_(CC.lines);

      Object.keys(GG).forEach(function (k) {

        GD[k] = String(GG[k].ymd || '').replace(/[^0-9]/g, '').slice(0, 8);

      });

    }

  } catch (e) { notes.push('입고일을 못 읽어 신고 수리일로 환율을 잡습니다 (' + e.message + ')'); }

  (sel || []).forEach(function (s) {

    var bl = String(s.BL || '').trim().toUpperCase();

    var dec = String(s['수리일자'] || s['신고일자'] || '').replace(/[^0-9]/g, '').slice(0, 8);

    (s['묶음'] || []).forEach(function (g0) {

      // blMatch_ 는 {grp, usd, …} 객체를 준다. 예전엔 문자열이었다 — 둘 다 받는다.

      var grp = (typeof g0 === 'string') ? g0 : String((g0 && g0.grp) || '');

      if (!grp) return;

      // 입고일이 원칙. 묶음을 못 찾았을 때만 수리일로 물러선다.

      var dt = (GD[grp] && GD[grp].length === 8) ? GD[grp] : dec;

      var byIpgo = (dt === GD[grp]);

      var cur = FX[grp] || { mode: '', rate: null, src: '', bl: '', memo: '' };
      cur.bl = bl;
      if (withFx && !cur.mode && dt.length === 8) {
        if (!(dt in cacheFx)) {
          cacheFx[dt] = null;
          try {
            var got = fxrateLookup_(dt);
            got.rows.forEach(function (r) {
              if (String(r.currSgn || '').toUpperCase() === 'USD' && num_(r.fxrt) > 0) cacheFx[dt] = num_(r.fxrt);
            });
          } catch (e) { notes.push(dt + ' 과세환율을 못 불러와 이 날짜 묶음은 환율을 못 세웠습니다 ('
            + e.message + ') — «기준금액» 단계에서 환율을 손으로 넣어 주세요.'); }
        }
        if (cacheFx[dt]) { cur.mode = '환율'; cur.rate = cacheFx[dt];

          cur.src = '관세청 과세환율 ' + dt + ' · ' + (byIpgo ? '입고일' : '수리일'); fxHit++; }
        else fxMissing.push({ grp: grp, bl: bl, ymd: dt,
          why: dt + ' 관세청 과세환율에 USD 고시가 없습니다 — «기준금액» 단계에서 이 묶음의 환율을 손으로 넣거나 «사전원가» 를 고르세요' });
      } else if (withFx && cur.mode) {
        fxMissing.push({ grp: grp, bl: bl, ymd: dt,
          why: '이미 «' + cur.mode + '» 으로 정해 둔 묶음이라 환율은 건드리지 않았습니다 — 바꾸려면 «기준금액» 단계에서 직접 고치세요' });
      }
      FX[grp] = cur;
      applied.push({ grp: grp, bl: bl, mode: cur.mode || '', rate: cur.rate || null, src: cur.src || '' });
      hit++;
    });
  });
  var out = Object.keys(FX).sort().map(function (g) {
    return { ym: ym, '입고묶음': g, '기준': FX[g].mode || '', '환율': FX[g].rate || '', '출처': FX[g].src || '',
             'BL': FX[g].bl || '', '메모': FX[g].memo || '' };
  });
  wipeYm_(SH.FX, ym);
  append_(SH.FX, out);
  log_('BL확정', ym, hit + '묶음 · 환율 ' + fxHit);
  var message = hit
    ? ('입고묶음 ' + hit + '개에 B/L 을 붙였습니다'
       + (fxHit ? (' · 그중 ' + fxHit + '개는 신고일 과세환율까지 세웠습니다') : '')
       + (fxMissing.length ? (' · ' + fxMissing.length + '개는 환율을 못 세웠습니다') : ''))
    : '붙인 묶음이 없습니다 — «기준금액» 단계의 «B/L 자동연결» 에서 붙일 신고건을 먼저 고르세요';
  var next = '';
  if (fxMissing.length) next = '환율이 안 세워진 묶음 ' + fxMissing.slice(0, 5).map(function (x) { return x.grp; }).join(', ')
    + (fxMissing.length > 5 ? ' 외' : '') + ' — «기준금액» 단계에서 «과세환율 자동» 을 누르거나 환율을 손으로 넣으세요.';
  else if (hit) next = '«부대비용» 단계에서 «관세 넣기» 를 누르면 이 B/L 의 관세가 원가에 얹힙니다.';
  return { ok: true, '붙인묶음': hit, '환율채움': fxHit, notes: notes,
    grpCount: hit, fxCount: fxHit, grps: applied, fxMissing: fxMissing,
    message: message, next: next };
}


/**
 * 인증키 확인 — 스크립트 편집기에서 이 함수를 골라 ▷ 실행하면 실행 로그에 결과가 뜬다.
 * 키 값은 찍지 않는다 (길이와 동작 여부만).
 */
function checkUnipassKeys() {
  var out = [];
  [['API030', '관세율 조회'], ['API012', '관세환율']].forEach(function (x) {
    var api = x[0], k = unipassKey_(api);
    if (!k) { out.push('✗ ' + api + ' (' + x[1] + ') — 스크립트 속성 UNIPASS_' + api + ' 가 비어 있습니다'); return; }
    var line = '· ' + api + ' (' + x[1] + ') — 키 ' + k.length + '자';
    try {
      var r = (api === 'API030') ? trrtLookup_('6104630000') : fxrateLookup_('20260812');
      if (r.rows.length) line = '✔ ' + line.slice(2) + ' · 응답 ' + r.rows.length + '행 — 잘 됩니다';
      else line = '✗ ' + line.slice(2) + ' · 응답 0행' + (r.note ? (' — ' + r.note) : '');
    } catch (e) {
      line = '✗ ' + line.slice(2) + ' — ' + e.message;
    }
    out.push(line);
  });
  var msg = out.join('\n');
  Logger.log(msg);
  return msg;
}


// ───── DutyCost.gs
/**
 * 유니패스 수입신고 실적의 «관세» 를 부대비용으로 넣는다.
 *
 * 관세는 계산서로도 오지만(인천세관), 거기엔 관세+부가세가 뭉쳐 있어 B/L 별로 못 쪼갠다.
 * 유니패스는 신고 건마다 관세를 따로 주므로, B/L 에 붙은 입고묶음에 그대로 얹을 수 있다.
 * 그래서 관세의 출처는 유니패스 하나다 — 화면 안내문도 그렇게 적어 뒀다.
 *
 * B/L ↔ 입고묶음은 「B/L 자동연결」 이 환율 시트에 적어 둔 것을 쓴다.
 * 연결이 안 된 신고는 건너뛴다 — 어디에 붙일지 모르는 돈을 원가에 얹으면 안 된다.
 */

function dutyPlan_(ym) {
  ym = ymOf_(ym);
  // B/L → 그 B/L 에 붙은 입고묶음들
  var byBl = {};
  rows_(SH.FX).forEach(function (r) {
    if (ymOf_(r.ym) !== ym) return;
    var b = String(r['BL'] || '').trim().toUpperCase();
    var g = String(r['입고묶음'] || '').trim();
    if (b && g) (byBl[b] = byBl[b] || []).push(g);
  });

  // 이미 넣은 관세 — 같은 관세를 두 번 넣으면 원가가 두 배가 된다.
  // 손으로 넣은 관세는 증빙번호에 «신고번호» 가 아니라 «B/L 번호» 가 적혀 있는 경우가 있다
  // (2026-01 이 그랬다 — 10,445,030원이 두 번 얹힐 뻔했다). 그래서 신고번호·B/L 둘 다로 찾는다.
  // «관세» 행만 본다 — 운임·통관수수료도 증빙번호에 같은 B/L 을 달고 있어서,
  // 전부 세면 관세가 없는 B/L 도 «이미 넣음» 이 되어 관세가 통째로 빠진다(2026-08 이 그랬다).
  var used = {};
  rows_(SH.COST).forEach(function (r) {
    if (ymOf_(r.ym) !== ym) return;
    if (String(r['비용유형'] || '').trim() !== '관세') return;
    var id = String(r.id || '');
    var d = String(r['증빙번호'] || '').trim().toUpperCase();
    if (d && !used[d]) used[d] = id;
    // 메모에 적힌 B/L 도 «이미 넣음» 의 표시로 본다
    String(r['메모'] || '').toUpperCase().split(/[^A-Z0-9-]+/).forEach(function (t) {
      if (t.length >= 8 && !used[t]) used[t] = id;
    });
  });

  var out = [];
  rows_(SH.UNI).forEach(function (r) {
    if (ymOf_(r.ym) !== ym) return;
    var no = String(r['신고번호'] || '').trim();
    var duty = ai_(r['관세']);
    var bl = String(r['HBL'] || '').trim().toUpperCase();
    var grps = byBl[bl] || [];
    var why = '';
    if (ym >= POSTCOST_FROM) why = '이 달부터 ERP 사후원가에 관세가 이미 들어 있습니다 — 유니패스 관세는 따로 넣지 않습니다 (넣으면 두 번 잡힘)';
    else if (!no) why = '신고번호가 비어 있어 어느 신고건인지 알 수 없습니다 — 유니패스에서 «수입신고 실적» 을 다시 내려받아 «부대비용» 단계에서 올려 주세요';
    else if (!duty) why = '관세가 0원이라 넣을 것이 없습니다 (면세 신고건) — 그냥 두면 됩니다';
    else if (!bl) why = '유니패스 파일에 H-BL 번호가 비어 있어 어느 입고에 붙일지 알 수 없습니다 — 유니패스에서 다시 내려받아 올리거나, «부대비용» 단계에서 이 관세만 손으로 넣으세요';
    else if (!grps.length) why = 'B/L ' + bl + ' 에 붙은 입고묶음이 없습니다 — «기준금액» 단계의 «B/L 자동연결» 에서 이 B/L 을 입고묶음에 먼저 붙이세요';
    else if (used[no.toUpperCase()] || used[bl]) why = '이미 부대비용 ' + (used[no.toUpperCase()] || used[bl]) + ' 로 넣었습니다 — 또 넣으면 원가가 두 배가 됩니다. 금액을 고치려면 «부대비용» 단계에서 ' + (used[no.toUpperCase()] || used[bl]) + ' 번 비용을 여세요';
    out.push({ no: no, bl: bl, duty: duty, grps: grps, ok: !why, why: why,
               ymd: String(r['수리일자'] || r['신고일자'] || '') });
  });
  return out;
}

/** 넣을 수 있는 것을 실제로 넣는다. apiCostSave 를 타므로 검증·확정잠금·권한이 그대로 걸린다. */
function apiDutyToCost(ym, apply) {
  if (!can_('재무') && !can_('생산'))
    throw new Error('«부대비용» 단계의 «관세 넣기» 는 재무·생산 담당자만 할 수 있습니다. ' + '재무·생산 담당자에게 부탁하거나, 재무팀에 권한 등록을 요청하세요. (지금 내 권한: ' + who_().role + ')');
  ym = ymOf_(ym || defaultYm_());
  if (apply && typeof COST_ON_ !== 'undefined' && !COST_ON_) throw new Error('관세 넣기는 꺼져 있습니다 — 관세는 ERP(사전원가)에 넣어 올립니다.');
  var plan = dutyPlan_(ym);
  var done = [], fail = [];
  var okList = plan.filter(function (p) { return p.ok; });
  var skipped = plan.filter(function (p) { return !p.ok; }).map(function (p) {
    return { no: p.no, bl: p.bl, duty: p.duty, ymd: p.ymd, why: p.why };
  });
  // ⑤ 가 안 끝났는데 ⑥ 의 «관세 넣기» 를 누른 경우 — 넣을 수 있는 게 하나도 없으면 여기서 분명히 말해 준다
  var needBl = 0, needBlAmt = 0;
  skipped.forEach(function (s) { if (s.why.indexOf('B/L 자동연결') >= 0) { needBl++; needBlAmt += s.duty; } });
  if (apply && !okList.length && needBl)
    throw new Error('아직 관세를 넣을 수 없습니다 — 유니패스 신고 ' + needBl + '건('+ fmt_(needBlAmt) +'원)이 '
      + '어느 입고에 붙는지 정해지지 않았습니다. «기준금액» 단계의 «B/L 자동연결» 을 먼저 끝내고, '
      + '«부대비용» 단계에서 «관세 넣기» 를 다시 누르세요.');
  if (apply) {
    plan.forEach(function (p) {
      if (!p.ok) return;
      try {
        apiCostSave(ym, {
          '비용유형': '관세', '금액': p.duty, '귀속': '재고원가', '배부기준': '수량비례',
          '배부범위': '입고묶음', '범위값': p.grps.join(';'),
          '공급자': '인천세관', '증빙번호': p.no,
          '발생일': p.ymd,
          // «유니패스 수입신고실적» 로 시작하면 ?redo= 가 자동 적재분으로 알아보고 지운다
          '메모': '유니패스 수입신고실적 ' + p.bl
        }, [], { quiet: true });
        done.push(p);
      } catch (e) { fail.push({ p: p, msg: String(e && e.message || e) }); }
    });
    if (done.length) bust_(ym, 'cost');   // 넣은 게 없으면 캐시를 버리지 않는다 · 관세는 검수 대사와 무관
  }
  var amountOk = 0, amountDone = 0;
  okList.forEach(function (p) { amountOk += p.duty; });
  done.forEach(function (p) { amountDone += p.duty; });
  // 못 넣은 것을 까닭끼리 묶는다 — 화면이 «무엇이 왜 안 됐는지» 를 한 줄씩 보여줄 수 있게
  var rmap = {}, reasons = [];
  skipped.forEach(function (s) {
    var e = rmap[s.why] || (rmap[s.why] = { why: s.why, n: 0, amount: 0, nos: [] });
    e.n++; e.amount += s.duty; if (e.nos.length < 5) e.nos.push(s.no);
  });
  Object.keys(rmap).forEach(function (k) { reasons.push(rmap[k]); });
  reasons.sort(function (a, b) { return b.n - a.n; });
  var message = apply
    ? (done.length
        ? ('관세 ' + done.length + '건 ' + fmt_(amountDone) + '원을 부대비용으로 넣었습니다'
           + (skipped.length ? (' · ' + skipped.length + '건은 넣지 않았습니다') : '')
           + (fail.length ? (' · ' + fail.length + '건은 넣다가 막혔습니다') : ''))
        : '넣은 관세가 한 건도 없습니다')
    : (okList.length
        ? ('지금 넣을 수 있는 관세 ' + okList.length + '건 ' + fmt_(amountOk) + '원'
           + (skipped.length ? (' · 못 넣는 것 ' + skipped.length + '건') : ''))
        : (plan.length ? '지금 넣을 수 있는 관세가 없습니다' : '이 달에 올린 유니패스 수입신고 실적이 없습니다'));
  var next = '';
  if (!plan.length) next = '«부대비용» 단계에서 유니패스 «수입신고 실적» 엑셀을 먼저 올려 주세요.';
  else if (needBl) next = '«기준금액» 단계의 «B/L 자동연결» 을 먼저 끝내세요 — 그래야 관세가 붙을 입고가 정해집니다 (' + needBl + '건 · ' + fmt_(needBlAmt) + '원 대기).';
  else if (fail.length) next = '넣다가 막힌 ' + fail.length + '건은 아래 까닭대로 고친 뒤 «부대비용» 단계에서 다시 누르세요.';
  else if (apply && done.length) next = '«확정» 단계에서 V1~V5 가 다 «통과» 인지 보세요.';
  else if (okList.length) next = '«부대비용» 단계에서 «관세 넣기» 를 누르면 ' + okList.length + '건이 들어갑니다.';
  else if (plan.length) next = '유니패스 신고 ' + plan.length + '건이 모두 이미 들어가 있거나 넣을 것이 없습니다 — «확정» 단계 으로 넘어가세요.';
  return pure_({ ym: ym, plan: plan, done: done, fail: fail, applied: !!apply,
    total: plan.length, okCount: okList.length, doneCount: done.length, failCount: fail.length,
    skipCount: skipped.length, amountOk: amountOk, amountDone: amountDone,
    skipped: skipped, reasons: reasons, needBl: needBl, needBlAmount: needBlAmt,
    message: message, next: next });
}

/**
 * 기준금액이 미확정인 수입 묶음에 «입고일의 과세환율» 을 세운다.
 *
 * 화면에 이 길이 없어서 사람이 묶음마다 환율을 손으로 쳤다 —
 * 어디서 구하는 숫자인지 화면이 말해 주지 않으니 임의 환율이 들어갈 자리였다.
 * apply 없이 부르면 «무엇을 어떻게 세울지» 만 돌려준다(아무것도 안 바꾼다).
 *
 * USD 가 한 줄도 없는 묶음은 환율을 아무리 정확히 넣어도 0 이라 영영 미확정으로 남는다.
 * (2026-01 가상수입처 JP COLLECTION 9행이 그랬다) — 그런 묶음은 사전원가를 기준으로 쓴다.
 */
function fxAutoPlan_(ym) {
  var C = closeCompute_(ym);
  if (!C) throw new Error('이 달 ERP 입고현황이 아직 없어 환율을 세울 묶음이 없습니다 — '
    + '«ERP» 단계에서 ERP «입고현황» 엑셀을 먼저 올려 주세요.');
  var need = {}, usdBy = {}, FX0 = fxOf_(ym);
  C.lines.forEach(function (l) {
    if (l.qty > 0 && l.work !== '반품') usdBy[l.grp] = (usdBy[l.grp] || 0) + Math.abs(l.amt_imp || 0);
    // 입고금액 0원(무상) 묶음은 기준금액이 늘 0 이라 «미정» 처럼 보인다 — 이미 기준을 정해 둔 묶음은 다시 세우지 않는다.
    // (자동 정리를 돌릴 때마다 이 3묶음을 다시 저장하느라 12초가 들었다)
    var decided = FX0[l.grp] && FX0[l.grp].mode;
    if (l.base_src === '미확정' || (!decided && !l.base && l.qty > 0 && l.work !== '반품')) need[l.grp] = l.ymd;
  });
  var memo = {}, out = [];
  Object.keys(need).sort().forEach(function (g) {
    var day = String(need[g]).replace(/[^0-9]/g, '');
    if (!usdBy[g]) {
      out.push({ grp: g, ymd: day, mode: '사전원가', rate: null, ok: true,
                 src: 'ERP에 외화단가 없음 — 사전원가 기준', why: '' });
      return;
    }
    try {
      if (!memo[day]) {
        var r = fxrateLookup_(day);
        var u = (r.rows || []).filter(function (x) { return String(x.currSgn || '').toUpperCase() === 'USD'; })[0];
        memo[day] = u ? num_(u.fxrt) : 0;
      }
      var rate = memo[day];
      if (!rate) { out.push({ grp: g, ymd: day, mode: '', rate: null, ok: false,
                              src: '', why: day + ' 관세청 과세환율에 USD 가 없습니다 (주말·공휴일이면 고시가 없습니다) — '
                                   + '«기준금액» 단계에서 이 묶음의 환율을 손으로 넣거나 «사전원가» 를 고르세요' }); return; }
      out.push({ grp: g, ymd: day, mode: '환율', rate: rate, ok: true,
                 src: '관세청 과세환율 ' + day + ' · 입고일', why: '' });
    } catch (e) {
      out.push({ grp: g, ymd: day, mode: '', rate: null, ok: false, src: '',
                 why: '관세청 과세환율을 못 불러왔습니다 (' + String(e && e.message || e) + ') — 잠시 뒤 다시 누르거나, '
                      + '«기준금액» 단계에서 이 묶음의 환율을 손으로 넣어 주세요' });
    }
  });
  return out;
}

function apiFxAuto(ym, apply) {
  if (!can_('재무') && !can_('생산'))
    throw new Error('«기준금액» 단계의 «과세환율 자동» 은 재무·생산 담당자만 할 수 있습니다. ' + '재무·생산 담당자에게 부탁하거나, 재무팀에 권한 등록을 요청하세요. (지금 내 권한: ' + who_().role + ')');
  ym = ymOf_(ym || defaultYm_());
  var plan = fxAutoPlan_(ym), done = [], fail = [];
  if (apply) {
    // 묶음마다 apiFxSave 를 부르면 그때마다 환율 시트를 지우고 다시 쓰고 장부를 통째로 다시 계산했다(묶음당 4초).
    // 브랜드 경계만 묶음마다 보고, 쓰기는 한 번에 한다.
    var FXa = fxOf_(ym), changed = [];
    plan.forEach(function (p) {
      if (!p.ok) return;
      var badG = grpGuard_(ym, [String(p.grp || '')]);
      if (badG) { fail.push({ p: p, msg: badG }); return; }
      // 이미 붙어 있는 B/L·메모는 그대로 둔다(환율 조회가 실패해 bl 만 적힌 묶음이 실제로 있다)
      var old = FXa[p.grp] || {};
      FXa[p.grp] = { mode: p.mode || '', rate: num_(p.rate) || null, src: p.src || '', bl: String(old.bl || '').toUpperCase(), memo: old.memo || '' };
      changed.push(p.grp); done.push(p);
    });
    if (changed.length) {
      frozen_(ym);
      wipeYm_(SH.FX, ym);
      append_(SH.FX, Object.keys(FXa).sort().map(function (g) {
        return { ym: ym, '입고묶음': g, '기준': FXa[g].mode, '환율': FXa[g].rate || '', '출처': FXa[g].src, 'BL': FXa[g].bl, '메모': FXa[g].memo };
      }));
      log_('환율자동', changed.join(','), changed.length + '묶음');
      bust_(ym, 'cost');       // 바꾼 게 있을 때만 — 아무것도 안 했는데 캐시를 버려 장부를 다시 계산했다
    }
  }
  var left = 0;
  var A = closeCompute_(ym);
  var lg = {};
  if (A) A.lines.forEach(function (l) { if (l.base_src === '미확정') { left++; lg[l.grp] = 1; } });
  var leftGroups = Object.keys(lg).sort();
  var okList = plan.filter(function (p) { return p.ok; });
  var skipped = plan.filter(function (p) { return !p.ok; }).map(function (p) {
    return { grp: p.grp, ymd: p.ymd, why: p.why };
  });
  var rmap = {}, reasons = [];
  skipped.forEach(function (s) {
    var e = rmap[s.why] || (rmap[s.why] = { why: s.why, n: 0, grps: [] });
    e.n++; if (e.grps.length < 5) e.grps.push(s.grp);
  });
  Object.keys(rmap).forEach(function (k) { reasons.push(rmap[k]); });
  reasons.sort(function (a, b) { return b.n - a.n; });
  var byMode = { '환율': 0, '사전원가': 0 };
  done.forEach(function (p) { byMode[p.mode] = (byMode[p.mode] || 0) + 1; });
  var message = apply
    ? (done.length
        ? ('묶음 ' + done.length + '개의 물건값 기준을 세웠습니다'
           + (byMode['환율'] ? (' · 과세환율 ' + byMode['환율'] + '개') : '')
           + (byMode['사전원가'] ? (' · 사전원가 ' + byMode['사전원가'] + '개') : '')
           + (fail.length ? (' · ' + fail.length + '개는 막혔습니다') : '')
           + ' · 아직 물건값이 안 정해진 줄 ' + left + '줄')
        : '기준을 세운 묶음이 없습니다 · 아직 물건값이 안 정해진 줄 ' + left + '줄')
    : (okList.length ? ('기준을 세울 수 있는 묶음 ' + okList.length + '개'
                        + (skipped.length ? (' · 못 세우는 것 ' + skipped.length + '개') : ''))
                     : (plan.length ? '지금 자동으로 세울 수 있는 묶음이 없습니다'
                                    : '물건값이 안 정해진 묶음이 없습니다 — 더 할 일이 없습니다'));
  var next = '';
  if (!apply && okList.length) next = '«기준금액» 단계에서 «과세환율 자동» 을 누르면 묶음 ' + okList.length + '개의 물건값이 정해집니다.';
  else if (left && leftGroups.length) next = '아직 물건값이 안 정해진 묶음 ' + leftGroups.slice(0, 5).join(', ')
    + (leftGroups.length > 5 ? ' 외' : '') + ' — «기준금액» 단계에서 환율을 손으로 넣거나 «사전원가» 를 고르세요.';
  else if (apply && done.length) next = '물건값이 다 정해졌습니다 — «부대비용» 단계 로 넘어가 관세·운임 같은 부대비용을 얹으세요.';
  return pure_({ ym: ym, plan: plan, done: done, fail: fail, applied: !!apply, left: left,
    total: plan.length, okCount: okList.length, doneCount: done.length, failCount: fail.length,
    skipCount: skipped.length, skipped: skipped, reasons: reasons, leftGroups: leftGroups,
    message: message, next: next });
}

/**
 * 사람이 판단할 것이 아닌 것은 전부 기계가 한다.
 *
 * ERP·유니패스 두 파일만 올리면, 그 뒤로 «누를 이유가 없는» 일이 세 가지 데모 사용자다 —
 * B/L 을 묶음에 잇고, 남은 묶음에 과세환율을 세우고, 신고의 관세를 얹는 것.
 * 셋 다 답이 하나뿐이라 사람이 고를 여지가 없는데, 단추를 세 개 만들어 두었었다.
 *
 * 사람 몫으로 남는 것은 둘뿐이다.
 *   · 운임·통관수수료를 «어느 묶음에» 붙일지 — 계산서에 B/L 이 안 적혀 와 날짜로는 틀린다
 *   · 확신이 «확인 필요» 인 B/L — 기계가 못 고른다
 *   · 그리고 마지막 확정(밖으로 나간다)
 */
function apiAutoRun(ym) {
  if (!can_('재무') && !can_('생산'))
    throw new Error('⑤⑥ 자동 처리는 재무·생산 담당자만 할 수 있습니다. (지금 내 권한: ' + who_().role + ')');
  ym = ymOf_(ym || defaultYm_());
  frozen_(ym);

  _CC_ON++;   // B/L·환율·관세·화면이 같은 계산을 쓰게 — 사이에 쓴 게 있으면 _WV 가 올라 다시 계산한다
  try { return apiAutoRun0_(ym); } finally { _CC_ON--; }
}
function apiAutoRun0_(ym) {
  var out = { ym: ym, bl: null, fx: null, duty: null, left: [], did: [] };
  var T0 = Date.now(), TK = []; var tk = function (n) { TK.push(n + ' ' + (Date.now() - T0)); };

  /* ① B/L 잇기 — 확실·유력만. «확인 필요» 는 사람에게 남긴다. */
  try {
    var C = closeCompute_(ym);
    if (C) {
      var M = blMatch_(ym, C.lines);
      var sure = [], unsure = [];
      (M.rows || []).forEach(function (x) {
        if (!(x['묶음'] && x['묶음'].length)) return;
        if (/확실|유력/.test(String(x['확신'] || ''))) sure.push(x); else unsure.push(x);
      });
      // 이미 그 B/L 로 데모 사용자 묶음만 있는 줄은 다시 잇지 않는다 — 돌릴 때마다 «B/L 2묶음을 이었습니다» 가 나왔다
      var FXb = fxOf_(ym);
      sure = sure.filter(function (x) {
        return (x['묶음'] || []).some(function (g) { var k = g.grp || g;
          return String((FXb[k] || {}).bl || '').toUpperCase() !== String(x.BL || '').toUpperCase() || !(FXb[k] || {}).mode; });
      });
      if (sure.length) {
        var rb = blApply_(ym, sure, true);
        bust_(ym, 'cost');
        out.bl = rb;
        out.did.push('B/L ' + (rb['붙인묶음'] || sure.length) + '묶음을 이었습니다'
          + (rb['환율채움'] ? (' · 환율 ' + rb['환율채움'] + '개를 같이 채웠습니다') : ''));
      }
      if (unsure.length)
        out.left.push({ what: 'bl', n: unsure.length,
          msg: 'B/L ' + unsure.length + '건은 금액이 많이 어긋나 기계가 못 고릅니다 — ⑤ 에서 눈으로 보고 고르세요.',
          rows: unsure.map(function (x) {
            return { bl: x.BL, no: x['신고번호'], err: x['오차'], cf: x['확신'],
                     grps: (x['묶음'] || []).map(function (g) { return g.grp || g; }) }; }) });
    }
  } catch (e) { out.left.push({ what: 'bl', n: 0, msg: 'B/L 잇기에서 멈췄습니다 — ' + (e && e.message || e) }); }

  tk('B/L');
  /* ② 남은 미확정에 과세환율 — 답이 하나뿐이다(입고일 고시 환율) */
  try {
    var rf = apiFxAuto(ym, true);
    out.fx = rf;
    if ((rf.done || []).length) out.did.push('환율 ' + rf.done.length + '묶음을 세웠습니다');
    if (rf.left) out.left.push({ what: 'fx', n: rf.left,
      msg: '기준금액 미확정 ' + rf.left + '행이 남았습니다 — ⑤ 수입 묶음 표에서 직접 정해야 합니다.',
      rows: (rf.leftGroups || []).map(function (g) { return { grp: g }; }) });
  } catch (e) { out.left.push({ what: 'fx', n: 0, msg: '환율 세우기에서 멈췄습니다 — ' + (e && e.message || e) }); }

  tk('환율');
  /* ③ 관세 — 유니패스 신고에서 B/L 묶음으로. 사람이 고를 것이 없다. 부대비용을 끈 동안(COST_ON_)은 ③④ 건너뜀 */
  var costOn = typeof COST_ON_ === 'undefined' || COST_ON_;
  if (costOn) try {
    var rd = apiDutyToCost(ym, true);
    out.duty = rd;
    if ((rd.done || []).length) out.did.push('관세 ' + rd.done.length + '건을 넣었습니다');
    var stuck = (rd.plan || []).filter(function (p) { return !p.ok && !/이미 넣었/.test(String(p.why || '')); });
    if (stuck.length) out.left.push({ what: 'duty', n: stuck.length,
      msg: '관세 ' + stuck.length + '건은 아직 못 넣었습니다.',
      rows: stuck.map(function (p) { return { no: p.no, bl: p.bl, duty: p.duty, why: p.why }; }) });
  } catch (e) { out.left.push({ what: 'duty', n: 0, msg: '관세 넣기에서 멈췄습니다 — ' + (e && e.message || e) }); }

  tk('관세');
  /* ④ 사람 몫 — 운임·통관수수료는 어느 묶음인지 기계가 모른다 */
  if (costOn) try {
    var cand = apiHometaxCand(ym), used = apiHometaxUsed(ym).used || {};
    var rest = (cand.rows || []).filter(function (r) { return !htUsedId_(r, used, cand.rows); });
    if (rest.length) out.left.push({ what: 'cost', n: rest.length,
      msg: '운임·통관수수료 ' + rest.length + '건이 후보로 와 있습니다 — 계산서에 B/L 이 안 적혀 와 '
        + '어느 입고묶음에 붙일지는 사람이 골라야 합니다. «부대비용» 단계에서 하나씩 넣으세요.',
      rows: rest.map(function (r) { return { ymd: r.ymd, type: r.type, sup: r.sup, amt: r.amt }; }) });
  } catch (e) {}

  tk('후보');
  var L = apiLedger(ym);
  out.close = L.close; out.stock = L.stock;
  tk('장부'); out.t = TK;
  return pure_(out);
}

function doGet(e) {

  var P = (e && e.parameter) || {};
  var danger = ['seed', 'fix', 'load', 'drop', 'push', 'bl', 'mk', 'confirm', 'check', 'perf', 'ls', 'v',
                'fxauto', 'cost', 'sum', 'redo', 'rows', 'stock', 'why', 'fixbasis', 'unfix', 'ht',
                'dump', 'restore', 'baks', 'wipe', 'duty', 'fxday', 'sbsheet', 'sbraw', 'sbamr', 'rcptwipe', 'warm', 'uptest', 'amr', 'v5ok', 'paymig'];

  if (P.sbraw) {

  // ?amr=ping — 회계시스템 연결 확인(키 글자 수 + 사업장 조회 한 번)
  // ?amr=test&ym=2026-08&vendor=송림통상&date=2026-08-31 — 시험 전표 한 장([연동시험] 표시, ACB6010 에 대기로만)
  if (e && e.parameter && e.parameter.amr) {

      + String(outA).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('회계시스템');
  }
  // ?v5ok=YYYY-MM[&off=1] — 그 달 V5(검수 ↔ ERP)를 «검수 다 된 것으로 본다» 로 둔다 / 되돌린다
  if (e && e.parameter && e.parameter.v5ok) {
    var ymV5 = ymOf_(String(e.parameter.v5ok)), PV5 = PropertiesService.getScriptProperties(), msgV5;
    if (e.parameter.off) { PV5.deleteProperty('V5OK_' + ymV5); msgV5 = ymV5 + ' V5 를 원래대로 검사합니다'; }
    else {
      PV5.setProperty('V5OK_' + ymV5, JSON.stringify({ by: String(who_().name || who_().email || ''),
        at: Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm') }));
      msgV5 = ymV5 + ' 검수는 다 된 것으로 봅니다 — V5 가 통과로 바뀝니다. 되돌리려면 &off=1';
    }
    bust_(ymV5); log_('V5검수완료', ymV5, e.parameter.off ? '해제' : '설정');
    return HtmlService.createHtmlOutput('<meta charset="utf-8"><body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:14px/1.7 'Malgun Gothic',sans-serif;padding:24px\">" + msgV5 + '</body>').setTitle('V5');
  }
  // ?check=1 — 편집기를 열지 않고 자기점검 결과를 본다
  if (e && e.parameter && e.parameter.check) {
    var out;
    try { out = selfCheck(); } catch (err) { out = '점검 자체가 터졌습니다 — ' + err; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"

        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>')
      .setTitle('자기점검');
  }
  // ?redo=YYYY-MM — 유니패스를 받아 «다시 깔기» 전에, 임시로 넣어 둔 것을 비운다.
  //   환율: 입고일로 넣은 것. blApply_ 는 기준이 이미 있으면 건드리지 않으므로 비워야 수리일 환율이 들어간다.
  //   부대비용: «수입건만» 범위로 월 단위 배부한 것. B/L 단위로 다시 깔 것이라 지운다.
  //   ERP 입고현황과 검수 기록은 건드리지 않는다.
  if (e && e.parameter && e.parameter.redo) {
    var outR = [];
    try {
      var ymR = String(e.parameter.redo);
      frozen_(ymR);
      if (!can_('재무')) throw new Error('재무 담당자만 쓸 수 있습니다.');
      var nFx = rows_(SH.FX).filter(function (r) { return String(r.ym) === ymR; }).length;
      wipeYm_(SH.FX, ymR);
      var gone = 0;
      // «자동으로 넣은 것» 만 지운다 — 사람이 손으로 넣은 비용은 남긴다.
      //   ?cost= 는 저장하면서 배부범위를 «입고묶음» 으로 바꿔 버리므로,
      //   범위만 보고 지우면 두 번째 적재가 앞엣것 위에 쌓인다 (4월이 실제로 두 배가 됐다).
      //   메모의 출처 글귀가 이 줄들의 유일한 표식이다.
      function auto_(r) {
        var m = String(r['메모'] || '');
        return m.indexOf('유니패스 수입신고실적') === 0 || m.indexOf('회계시스템 원장') === 0
            || String(r['배부범위'] || '') === '수입건만';
      }
      var keepC = rows_(SH.COST).filter(function (r) {
        if (String(r.ym) !== ymR) return true;
        if (!auto_(r)) return true;
        gone++; return false;
      });
      var ids = {};
      rows_(SH.COST).forEach(function (r) {
        if (String(r.ym) === ymR && auto_(r)) ids[String(r.id)] = 1; });
      replaceAll_(SH.COST, keepC);
      replaceAll_(SH.CITEM, rows_(SH.CITEM).filter(function (r) {
        return !(String(r.ym) === ymR && ids[String(r['비용id'])]); }));
      log_('다시깔기준비', ymR, '환율 ' + nFx + ' · 부대비용 ' + gone);
      bust_(ymR);
      outR.push(ymR + ' — 환율 ' + nFx + '묶음 · 자동 적재 부대비용 ' + gone + '건 비웠습니다');
      var CR = closeCompute_(ymR);
      if (CR) outR.push('지금 미확정 ' + CR.summary.unres_n + '행 · 기준금액 ' + fmt_(CR.summary.base));
    } catch (errR) { outR.push('멈췄습니다 — ' + errR); }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + outR.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('다시 깔기');
  }

  // ?unfix=YYYY-MM — 확정을 푼다. Baserow 로 보낸 줄은 그대로 남는다 — 다시 확정해 보내야 갈린다.
  if (e && e.parameter && e.parameter.unfix) {
    var outU;
    try {
      var ymU = String(e.parameter.unfix);
      var st0 = closeState_(ymU);
      if (!st0) outU = ymU + ' 은 확정된 달이 아닙니다.';
      else {
        apiCloseConfirm(ymU, false);
        outU = ymU + ' 확정을 풀었습니다.' + String.fromCharCode(10)
             + '  풀기 전: ' + JSON.stringify(st0) + String.fromCharCode(10)
             + '  ※ Baserow 수불부에는 확정 때 보낸 줄이 그대로 남아 있습니다 — 다시 확정해 보내야 바뀝니다.';
      }
    } catch (errU) { outU = '멈췄습니다 — ' + errU; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + String(outU)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('확정 해제');
  }

  // ?fixbasis=YYYY-MM[&apply=1] — 배부기준 칸에 쓸 수 없는 이름이 적힌 줄을 «수량비례» 로.
  //   apply 없이 부르면 무엇을 고칠지 보여만 준다.
  if (e && e.parameter && e.parameter.fixbasis) {
    var outB = [];
    try {
      var ymB = String(e.parameter.fixbasis);
      if (!can_('재무')) throw new Error('재무 담당자만 쓸 수 있습니다.');
      var rowsB = rows_(SH.COST).filter(function (r) { return String(r.ym) === ymB; });
      var badB = rowsB.filter(function (r) { return BASES.indexOf(String(r['배부기준'] || '')) < 0; });
      outB.push(ymB + ' — 부대비용 ' + rowsB.length + '건 중 고칠 것 ' + badB.length + '건');
      badB.forEach(function (r) {
        outB.push('  ' + r.id + '  ' + r['비용유형'] + '  ' + fmt_(ai_(r['금액']))
                + '  «' + r['배부기준'] + '» → «수량비례»');
      });
      if (!e.parameter.apply) { outB.push(''); outB.push('※ 보기만 했습니다. 고치려면 &apply=1 을 붙이세요.'); }
      else if (badB.length) {
        frozen_(ymB);            // 확정된 달은 못 고친다 — 해제부터
        var keepB = rows_(SH.COST).map(function (r) {
          if (String(r.ym) === ymB && BASES.indexOf(String(r['배부기준'] || '')) < 0) {
            var c2 = {};
            Object.keys(r).forEach(function (k) { c2[k] = r[k]; });
            c2['배부기준'] = '수량비례';
            return c2;
          }
          return r;
        });
        replaceAll_(SH.COST, keepB);
        log_('배부기준고침', ymB, badB.length + '건 → 수량비례', ymB);
        bust_(ymB);
        outB.push('');
        outB.push('고쳤습니다. 다시 계산한 결과:');
        var C2 = closeCompute_(ymB);
        if (C2) {
          outB.push('  기준금액 ' + fmt_(C2.summary.base) + ' · 부대비용 ' + fmt_(C2.summary.oh_inv)
                  + ' · 취득원가 ' + fmt_(C2.summary.landed));
          (C2.checks || []).forEach(function (ck) {
            outB.push('  ' + (ck.ok ? '✔' : '✘') + ' ' + ck.id + ' ' + ck.detail);
          });
        }
      }
    } catch (errB) { outB.push('멈췄습니다 — ' + errB); }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + outB.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('배부기준');
  }

  // ?why=YYYY-MM — 취득원가의 «근거» 를 줄마다. 화면이 계산식을 그대로 보이려면 이 값들이 필요하다.
  if (e && e.parameter && e.parameter.why) {
    var outY;
    try {
      var ymY = String(e.parameter.why);
      var CY = closeCompute_(ymY);
      if (!CY) throw new Error(ymY + ' ERP 입고현황이 없습니다');
      var FXY = fxOf_(ymY);
      var byLineY = allocByLine_(CY.alloc || {});

      // 비용마다 «닿은 줄» 과 «가중치 합» — 계산식의 분모
      var costY = (CY.costs || []).map(function (c) {
        var m = (CY.cmeta || {})[c.id] || {};
        var tg = [], wsum = 0;
        try { tg = resolveScope_(c, CY.lines); } catch (e1) { tg = []; }
        tg.forEach(function (l) {
          if (c.basis === '수량비례') wsum += l.qty;
          else if (c.basis === '금액비례') wsum += (l.amt_imp > 0 ? l.amt_imp : l.base);
          else wsum += l.qty;
        });
        return { id: c.id, type: c.type, amount: c.amount, scope: c.scope, scope_val: c.scope_val,
                 basis: c.basis, basis_used: m.basis_used || '', doc: c.doc, sup: c.supplier,
                 inv: c.inv, n: tg.length, wsum: Math.round(wsum * 100) / 100,
                 ok: m.ok !== false, issues: m.issues || [] };
      });

      var lineY = [];
      CY.lines.forEach(function (l) {
        if (!l.qty) return;
        var f = FXY[l.grp] || {};
        lineY.push({ id: l.id, ymd: l.ymd, ven: l.vendor, item: l.item, nm: l.name, cc: l.color,
                     grp: l.grp, buy: l.buy, qty: l.qty,
                     usd: l.amt_imp || 0, pre: l.amt_pre || 0,
                     base: Math.round(l.base || 0), src: l.base_src || '',
                     rate: f.rate || null, fxsrc: f.src || '', bl: f.bl || '',
                     oh: Math.round(byLineY[l.id] || 0),
                     parts: (CY.alloc || {})[l.id] || {} });
      });
      outY = JSON.stringify({ ym: ymY, fx: FXY, costs: costY, lines: lineY });
      if (e.parameter.save) {
        var fnY = 'why_' + ymY + '.json';
        var exY = DriveApp.getFilesByName(fnY);
        while (exY.hasNext()) { try { exY.next().setTrashed(true); } catch (e3) {} }
        DriveApp.createFile(fnY, outY, 'application/json');

    } catch (errY) { outY = JSON.stringify({ error: String(errY) }); }
    return ContentService.createTextOutput(outY).setMimeType(ContentService.MimeType.JSON);
  }

  // ?stock=1 — 수불부 «입고» 를 품번 단위로 접어 전 기간 한 번에.

      var it = {}, lot = {}, mon = [], ms = {};
      closeMonths_().forEach(function (m) {
        var rs, t1 = Date.now();

          var a = e2.m[m] || (e2.m[m] = [0, 0, 0]);   // 수량 · 취득금액 · 부대비용
          a[0] += r['수량']; a[1] += r['취득금액']; a[2] += r['부대비용'];
          // 입고 건 — 같은 날 같은 곳 같은 묶음은 한 건으로 본다
          var lk = k + '\u0001' + r['입고일'] + '\u0001' + r['입고처'] + '\u0001' + r['묶음'];
          var b = lot[lk] || (lot[lk] = [k, r['입고일'], r['입고처'], 0, 0, 0, r['환율근거'], m]);
          b[3] += r['수량']; b[4] += r['취득금액']; b[5] += r['부대비용'];
        });

      // 화면으로 빼기엔 커서, 부르면 내 드라이브에 파일로 떨군다
      if (e.parameter.save) {
        var fn = 'stock_in_1_8.json';
        var ex = DriveApp.getFilesByName(fn);
        while (ex.hasNext()) { try { ex.next().setTrashed(true); } catch (e3) {} }
        DriveApp.createFile(fn, outK, 'application/json');
        outK = JSON.stringify({ ok: true, file: fn, bytes: outK.length, ms: ms,
                                months: mon.length, items: Object.keys(it).length, lots: lots.length });
      }
    } catch (errK) { outK = JSON.stringify({ error: String(errK) }); }
    return ContentService.createTextOutput(outK).setMimeType(ContentService.MimeType.JSON);
  }

  // ?rows=YYYY-MM — 그 달 수불부 «입고» 줄을 JSON 으로. 보내는 것과 같은 함수를 쓴다.
  //   화면·분석을 이것 위에서 짜야 장부와 갈라지지 않는다.
  if (e && e.parameter && e.parameter.rows) {

    try {

    } catch (errW) { outW = JSON.stringify({ error: String(errW) }); }

  // ?sum=1 — 달마다 한 줄. 아카이빙이 어디까지 됐는지 한 화면에서 본다.
  //   달마다 화면을 열어 눈으로 옮겨 적으면 그 옮겨 적는 데서 틀린다.
  if (e && e.parameter && e.parameter.sum) {
    var L2 = [];
    try {
      var mons = closeMonths_();
      L2.push(pad_('월', 9) + pad_('행', 7) + pad_('수량', 11) + pad_('기준금액', 18)
            + pad_('부대비용', 14) + pad_('취득원가', 18) + pad_('미확정', 8) + '검증');
      L2.push(new Array(94).join('-'));
      mons.forEach(function (m) {

        if (!C2) { L2.push(pad_(m, 9) + 'ERP 입고현황 없음'); return; }
