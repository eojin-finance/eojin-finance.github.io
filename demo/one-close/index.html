        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('다시 깔기');
  }

  // ?unfix=YYYY-MM — 확정을 푼다. Baserow 로 보낸 줄은 그대로 남는다 — 다시 확정해 보내야 갈린다.
  if (e && e.parameter && e.parameter.unfix) {
    var outU;
    try {
      var ymU = String(e.parameter.unfix);
      var st0 = closeState_(ymU);
      if (!st0) outU = ymU + ' 은 확정된 달이 아닙니다.';
      else {
        apiCloseConfirm(ymU, false);
        outU = ymU + ' 확정을 풀었습니다.' + String.fromCharCode(10)
             + '  풀기 전: ' + JSON.stringify(st0) + String.fromCharCode(10)
             + '  ※ Baserow 수불부에는 확정 때 보낸 줄이 그대로 남아 있습니다 — 다시 확정해 보내야 바뀝니다.';
      }
    } catch (errU) { outU = '멈췄습니다 — ' + errU; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + String(outU)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('확정 해제');
  }

  // ?fixbasis=YYYY-MM[&apply=1] — 배부기준 칸에 쓸 수 없는 이름이 적힌 줄을 «수량비례» 로.
  //   apply 없이 부르면 무엇을 고칠지 보여만 준다.
  if (e && e.parameter && e.parameter.fixbasis) {
    var outB = [];
    try {
      var ymB = String(e.parameter.fixbasis);
      if (!can_('재무')) throw new Error('재무 담당자만 쓸 수 있습니다.');
      var rowsB = rows_(SH.COST).filter(function (r) { return String(r.ym) === ymB; });
      var badB = rowsB.filter(function (r) { return BASES.indexOf(String(r['배부기준'] || '')) < 0; });
      outB.push(ymB + ' — 부대비용 ' + rowsB.length + '건 중 고칠 것 ' + badB.length + '건');
      badB.forEach(function (r) {
        outB.push('  ' + r.id + '  ' + r['비용유형'] + '  ' + fmt_(ai_(r['금액']))
                + '  «' + r['배부기준'] + '» → «수량비례»');
      });
      if (!e.parameter.apply) { outB.push(''); outB.push('※ 보기만 했습니다. 고치려면 &apply=1 을 붙이세요.'); }
      else if (badB.length) {
        frozen_(ymB);            // 확정된 달은 못 고친다 — 해제부터
        var keepB = rows_(SH.COST).map(function (r) {
          if (String(r.ym) === ymB && BASES.indexOf(String(r['배부기준'] || '')) < 0) {
            var c2 = {};
            Object.keys(r).forEach(function (k) { c2[k] = r[k]; });
            c2['배부기준'] = '수량비례';
            return c2;
          }
          return r;
        });
        replaceAll_(SH.COST, keepB);
        log_('배부기준고침', ymB, badB.length + '건 → 수량비례', ymB);
        bust_(ymB);
        outB.push('');
        outB.push('고쳤습니다. 다시 계산한 결과:');
        var C2 = closeCompute_(ymB);
        if (C2) {
          outB.push('  기준금액 ' + fmt_(C2.summary.base) + ' · 부대비용 ' + fmt_(C2.summary.oh_inv)
                  + ' · 취득원가 ' + fmt_(C2.summary.landed));
          (C2.checks || []).forEach(function (ck) {
            outB.push('  ' + (ck.ok ? '✔' : '✘') + ' ' + ck.id + ' ' + ck.detail);
          });
        }
      }
    } catch (errB) { outB.push('멈췄습니다 — ' + errB); }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + outB.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('배부기준');
  }

  // ?why=YYYY-MM — 취득원가의 «근거» 를 줄마다. 화면이 계산식을 그대로 보이려면 이 값들이 필요하다.
  if (e && e.parameter && e.parameter.why) {
    var outY;
    try {
      var ymY = String(e.parameter.why);
      var CY = closeCompute_(ymY);
      if (!CY) throw new Error(ymY + ' ERP 입고현황이 없습니다');
      var FXY = fxOf_(ymY);
      var byLineY = allocByLine_(CY.alloc || {});

      // 비용마다 «닿은 줄» 과 «가중치 합» — 계산식의 분모
      var costY = (CY.costs || []).map(function (c) {
        var m = (CY.cmeta || {})[c.id] || {};
        var tg = [], wsum = 0;
        try { tg = resolveScope_(c, CY.lines); } catch (e1) { tg = []; }
        tg.forEach(function (l) {
          if (c.basis === '수량비례') wsum += l.qty;
          else if (c.basis === '금액비례') wsum += (l.amt_imp > 0 ? l.amt_imp : l.base);
          else wsum += l.qty;
        });
        return { id: c.id, type: c.type, amount: c.amount, scope: c.scope, scope_val: c.scope_val,
                 basis: c.basis, basis_used: m.basis_used || '', doc: c.doc, sup: c.supplier,
                 inv: c.inv, n: tg.length, wsum: Math.round(wsum * 100) / 100,
                 ok: m.ok !== false, issues: m.issues || [] };
      });

      var lineY = [];
      CY.lines.forEach(function (l) {
        if (!l.qty) return;
        var f = FXY[l.grp] || {};
        lineY.push({ id: l.id, ymd: l.ymd, ven: l.vendor, item: l.item, nm: l.name, cc: l.color,
                     grp: l.grp, buy: l.buy, qty: l.qty,
                     usd: l.amt_imp || 0, pre: l.amt_pre || 0,
                     base: Math.round(l.base || 0), src: l.base_src || '',
                     rate: f.rate || null, fxsrc: f.src || '', bl: f.bl || '',
                     oh: Math.round(byLineY[l.id] || 0),
                     parts: (CY.alloc || {})[l.id] || {} });
      });
      outY = JSON.stringify({ ym: ymY, fx: FXY, costs: costY, lines: lineY });
      if (e.parameter.save) {
        var fnY = 'why_' + ymY + '.json';
        var exY = DriveApp.getFilesByName(fnY);
        while (exY.hasNext()) { try { exY.next().setTrashed(true); } catch (e3) {} }
        DriveApp.createFile(fnY, outY, 'application/json');
        outY = JSON.stringify({ ok: true, file: fnY, bytes: outY.length,
                                lines: lineY.length, costs: costY.length });
      }
    } catch (errY) { outY = JSON.stringify({ error: String(errY) }); }
    return ContentService.createTextOutput(outY).setMimeType(ContentService.MimeType.JSON);
  }

  // ?stock=1 — 수불부 «입고» 를 품번 단위로 접어 전 기간 한 번에.
  if (e && e.parameter && e.parameter.stock) {
    var outK;
    try {
      var it = {}, lot = {}, mon = [], ms = {};
      closeMonths_().forEach(function (m) {
        var rs, t1 = Date.now();
        try { rs = brRowsOf_(m); } catch (e1) { return; }
        ms[m] = Date.now() - t1;
        if (!rs.length) return;
        mon.push(m);
        rs.forEach(function (r) {
          var k = r['품번'];
          var e2 = it[k] || (it[k] = { nm: r['품명'], br: r['브랜드'], m: {} });
          var a = e2.m[m] || (e2.m[m] = [0, 0, 0]);   // 수량 · 취득금액 · 부대비용
          a[0] += r['수량']; a[1] += r['취득금액']; a[2] += r['부대비용'];
          // 입고 건 — 같은 날 같은 곳 같은 묶음은 한 건으로 본다
          var lk = k + '\u0001' + r['입고일'] + '\u0001' + r['입고처'] + '\u0001' + r['묶음'];
          var b = lot[lk] || (lot[lk] = [k, r['입고일'], r['입고처'], 0, 0, 0, r['환율근거'], m]);
          b[3] += r['수량']; b[4] += r['취득금액']; b[5] += r['부대비용'];
        });
      });
      var lots = [];
      Object.keys(lot).forEach(function (k) { lots.push(lot[k]); });
      outK = JSON.stringify({ months: mon, items: it, lots: lots, ms: ms });
      // 화면으로 빼기엔 커서, 부르면 내 드라이브에 파일로 떨군다
      if (e.parameter.save) {
        var fn = 'stock_in_1_8.json';
        var ex = DriveApp.getFilesByName(fn);
        while (ex.hasNext()) { try { ex.next().setTrashed(true); } catch (e3) {} }
        DriveApp.createFile(fn, outK, 'application/json');
        outK = JSON.stringify({ ok: true, file: fn, bytes: outK.length, ms: ms,
                                months: mon.length, items: Object.keys(it).length, lots: lots.length });
      }
    } catch (errK) { outK = JSON.stringify({ error: String(errK) }); }
    return ContentService.createTextOutput(outK).setMimeType(ContentService.MimeType.JSON);
  }

  // ?rows=YYYY-MM — 그 달 수불부 «입고» 줄을 JSON 으로. 보내는 것과 같은 함수를 쓴다.
  //   화면·분석을 이것 위에서 짜야 장부와 갈라지지 않는다.
  if (e && e.parameter && e.parameter.rows) {
    var outW;
    try {
      var ymW2 = String(e.parameter.rows);
      outW = JSON.stringify(brRowsOf_(ymW2));
    } catch (errW) { outW = JSON.stringify({ error: String(errW) }); }
    return ContentService.createTextOutput(outW).setMimeType(ContentService.MimeType.JSON);
  }

  // ?sum=1 — 달마다 한 줄. 아카이빙이 어디까지 됐는지 한 화면에서 본다.
  //   달마다 화면을 열어 눈으로 옮겨 적으면 그 옮겨 적는 데서 틀린다.
  if (e && e.parameter && e.parameter.sum) {
    var L2 = [];
    try {
      var mons = closeMonths_();
      L2.push(pad_('월', 9) + pad_('행', 7) + pad_('수량', 11) + pad_('기준금액', 18)
            + pad_('부대비용', 14) + pad_('취득원가', 18) + pad_('미확정', 8) + '검증');
      L2.push(new Array(94).join('-'));
      mons.forEach(function (m) {
        var C2 = null;
        try { C2 = closeCompute_(m); } catch (e9) { L2.push(pad_(m, 9) + '계산 중 멈춤 — ' + e9); return; }
        if (!C2) { L2.push(pad_(m, 9) + 'ERP 입고현황 없음'); return; }
        var su = C2.summary, bad2 = (C2.checks || []).filter(function (c) { return !c.ok; });
        L2.push(pad_(m, 9) + pad_(String(su.lines || 0), 7) + pad_(fmt_(su.qty), 11)
              + pad_(fmt_(su.base), 18) + pad_(fmt_(su.oh_inv), 14) + pad_(fmt_(su.landed), 18)
              + pad_(String(su.unres_n || 0) + '행', 8)
              + (bad2.length ? ('✗ ' + bad2.map(function (c) { return c.id; }).join(',')) : '✔ V1~V5')
              + (closeState_(m) ? '   [확정]' : ''));
      });
    } catch (err9) { L2.push('멈췄습니다 — ' + err9); }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre">' + L2.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('아카이빙 현황');
  }

  /** 글자를 오른쪽으로 밀어 칸을 맞춘다 — 한글은 두 칸으로 센다 */
  function pad_(v, n) {
    var t = String(v === null || v === undefined ? '' : v), w = 0;
    for (var i = 0; i < t.length; i++) w += (t.charCodeAt(i) > 127 ? 2 : 1);
    var sp = '';
    for (var j = w; j < n; j++) sp += ' ';
    return t + sp + ' ';
  }

  // ?fxauto=YYYY-MM — 기준금액이 미확정인 수입 묶음마다 «입고일의 과세환율» 을 넣는다.
  //   8월은 유니패스 수입신고실적에서 신고일 기준으로 가져왔다. 지난 달들은 그 자료가 없어
  //   입고일로 대신 조회한다 — 통관과 입고 사이에 주가 바뀌면 환율이 한 단계 다를 수 있다.
  //   그래서 출처에 «(입고일)» 을 남긴다. 나중에 유니패스를 받으면 그 자리만 덮어쓰면 된다.
  if (e && e.parameter && e.parameter.fxauto) {
    var outF = [];
    try {
      var ymF = String(e.parameter.fxauto);
      var CF = closeCompute_(ymF);
      if (!CF) throw new Error('ERP 입고현황을 먼저 올리세요');
      // 묶음마다 «USD 가 있는가» 를 같이 센다 —
      // USD 가 한 줄도 없는 묶음은 환율을 아무리 정확히 넣어도 0 이라 영영 미확정으로 남는다.
      // (2026-01 가상수입처 JP COLLECTION 9행이 그랬다 — ERP에 외화단가가 없다)
      // 그런 묶음은 사전원가를 기준으로 쓴다.
      var need = {}, usdBy = {};   // 안쪽 콜백에도 usd 가 있어 이름을 가른다
      CF.lines.forEach(function (l) {
        if (l.qty > 0 && l.work !== '반품') usdBy[l.grp] = (usdBy[l.grp] || 0) + Math.abs(l.amt_imp || 0);
        if (l.base_src === '미확정' || (!l.base && l.qty > 0 && l.work !== '반품')) need[l.grp] = l.ymd;
      });
      var gs = Object.keys(need).sort();
      if (!gs.length) outF.push('미확정 묶음이 없습니다');
      var memo = {};
      gs.forEach(function (g) {
        var day = String(need[g]).replace(/[^0-9]/g, '');
        try {
          if (!usdBy[g]) {
            apiFxSave(ymF, g, '사전원가', '', 'ERP에 외화단가 없음 — 사전원가 기준', '', '');
            outF.push(g + '  사전원가 기준  (USD 없음)');
            return;
          }
          if (!memo[day]) {
            var r = fxrateLookup_(day);
            var usd = (r.rows || []).filter(function (x) { return String(x.currSgn || '').toUpperCase() === 'USD'; })[0];
            memo[day] = usd ? num_(usd.fxrt) : 0;
          }
          var rate = memo[day];
          if (!rate) { outF.push(g + '  ✗ ' + day + ' 과세환율에 USD 가 없습니다'); return; }
          apiFxSave(ymF, g, '환율', rate, '과세환율(입고일 ' + day + ')', '', '');
          outF.push(g + '  @' + rate + '  (' + day + ')');
        } catch (eF) { outF.push(g + '  ✗ ' + eF); }
      });
      var after = closeCompute_(ymF);
      var left = 0;
      if (after) after.lines.forEach(function (l) { if (l.base_src === '미확정') left++; });
      outF.push('');
      outF.push('남은 미확정 ' + left + '행');
    } catch (errF) { outF.push('멈췄습니다 — ' + errF); }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + outF.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('환율');
  }

  // ?fxday=YYYY-MM[&apply=1] — 이미 서 있는 환율을 «ERP 입고일» 기준으로 다시 세운다.
  //   B/L 잇기가 예전엔 «신고 수리일» 로 잡았다. 과세환율은 주 단위 고시라 대개 같은 값이지만,
//   한 B/L 을 여러 묶음이 나눠 쓰면 남의 날짜가 복사됐다(2026-01 260113 ↔ 260123, 10일 차이).
  if (e && e.parameter && e.parameter.fxday) {
    var outD = [];
    try {
      var ymD = ymOf_(String(e.parameter.fxday));
      var CD = closeCompute_(ymD);
      if (!CD) throw new Error('ERP 입고현황을 먼저 올리세요');
      var GD2 = impGroups_(CD.lines);          // 묶음별 첫 입고일
      var FXD = fxOf_(ymD);
      var usdD = {};
      CD.lines.forEach(function (l) { if (l.qty) usdD[l.grp] = (usdD[l.grp] || 0) + (l.amt_imp || 0); });
      var memoD = {}, chg = [], same = 0;
      Object.keys(FXD).sort().forEach(function (g) {
        var cur = FXD[g];
        if (cur.mode !== '환율' || !cur.rate) return;
        var day = String((GD2[g] || {}).ymd || '').replace(/[^0-9]/g, '').slice(0, 8);
        if (day.length !== 8) { outD.push(g + '  입고일을 못 찾아 건너뜁니다'); return; }
        if (!(day in memoD)) {
          memoD[day] = null;
          try {
            var got = fxrateLookup_(day);
            (got.rows || []).forEach(function (r) {
              if (String(r.currSgn || '').toUpperCase() === 'USD' && num_(r.fxrt) > 0) memoD[day] = num_(r.fxrt);
            });
          } catch (e2) { outD.push(day + ' 과세환율 조회 실패 — ' + e2.message); }
        }
        var nr = memoD[day];
        if (!nr) { outD.push(g + '  ' + day + ' 고시에 USD 가 없어 그대로 둡니다'); return; }
        var src = '관세청 과세환율 ' + day + ' · 입고일';
        if (Math.abs(nr - cur.rate) < 0.0001) { same++;
          if (cur.src !== src) chg.push({ g: g, old: cur.rate, nw: nr, day: day, cur: cur, only: 1 });
          return; }
        chg.push({ g: g, old: cur.rate, nw: nr, day: day, cur: cur, only: 0 });
      });
      outD.push(ymD + ' — 환율 묶음 ' + (same + chg.filter(function (c) { return !c.only; }).length) + '개');
      outD.push('환율이 같은 것 ' + same + '개 · 값이 바뀌는 것 ' + chg.filter(function (c) { return !c.only; }).length + '개');
      outD.push('');
      var diff = 0;
      chg.forEach(function (c) {
        var u = usdD[c.g] || 0, d = Math.round(u * c.nw) - Math.round(u * c.old);
        diff += d;
        outD.push((c.only ? '=' : '≠') + ' ' + c.g
          + '   @' + c.old + ' → @' + c.nw + ' (' + c.day + ')'
          + '   USD ' + fmt_(Math.round(u)) + '   금액 ' + (d > 0 ? '+' : '') + fmt_(d));
      });
      outD.push('');
      outD.push('이 달 기준금액 변동 ' + (diff > 0 ? '+' : '') + fmt_(diff) + '원');
      if (e.parameter.apply) {
        var n = 0;
        chg.forEach(function (c) {
          apiFxSave(ymD, c.g, '환율', c.nw, '관세청 과세환율 ' + c.day + ' · 입고일',
                    c.cur.bl || '', c.cur.memo || '');
          n++;
        });
        bust_(ymD);
        outD.push('');
        outD.push('다시 세웠습니다 — ' + n + '묶음');
      } else {
        outD.push('※ 보기만 했습니다. 바꾸려면 &apply=1 을 붙이세요.');
      }
    } catch (eD) { outD.push('막혔습니다 — ' + (eD && eD.message || eD)); }
    return HtmlService.createHtmlOutput('<body style="background:#111;color:#ddd;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + outD.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('환율 재기준');
  }
  // ?cost=<파일이름>&ym=YYYY-MM — 내 드라이브의 JSON 배열을 부대비용으로 넣는다.
  //   한 건씩 apiCostSave 를 탄다 — 검증·확정잠금·브랜드 경계가 전부 그대로 걸린다.
  if (e && e.parameter && e.parameter.cost) {
    var outC = [];
    try {
      var nmC = String(e.parameter.cost);
      var itC = DriveApp.getFilesByName(nmC);
      if (!itC.hasNext()) throw new Error('내 드라이브에 «' + nmC + '» 이 없습니다');
      var ymC2 = String(e.parameter.ym || defaultYm_());
      var arr = JSON.parse(itC.next().getBlob().getDataAsString('UTF-8'));
      // 범위값이 «BL:BRI…» 이면 그 B/L 에 붙은 입고묶음으로 바꿔 넣는다.
      //   B/L ↔ 묶음 은 B/L 자동연결이 FX 시트에 적어 둔 것이라 여기서만 알 수 있다.
      var FXR = {};
      rows_(SH.FX).forEach(function (r) {
        if (String(r.ym) !== ymC2) return;
        var b = String(r['BL'] || '').trim().toUpperCase();
        if (b) (FXR[b] = FXR[b] || []).push(String(r['입고묶음'] || '').trim());
      });
      arr.forEach(function (row) {
        try {
          var sv = String(row['범위값'] || '');
          if (sv.indexOf('BL:') === 0) {
            var bls = sv.slice(3).split(';').map(function (x) { return x.trim().toUpperCase(); }).filter(String);
            var gsx = [];
            bls.forEach(function (b) { (FXR[b] || []).forEach(function (g) { if (gsx.indexOf(g) < 0) gsx.push(g); }); });
            if (!gsx.length) throw new Error('B/L ' + bls.join(',') + ' 에 붙은 입고묶음이 없습니다 — B/L 자동연결을 먼저 도세요');
            row = JSON.parse(JSON.stringify(row));
            row['배부범위'] = '입고묶음';
            row['범위값'] = gsx.join(';');
          }
          apiCostSave(ymC2, row, null);
          outC.push('✔ ' + row['비용유형'] + ' ' + fmt_(num_(row['금액'])) + '  ' + (row['배부범위'] || '') + ' ' + (row['범위값'] || ''));
        } catch (eC) { outC.push('✗ ' + row['비용유형'] + ' ' + row['금액'] + ' — ' + eC); }
      });
    } catch (errC) { outC.push('멈췄습니다 — ' + errC); }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + outC.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('부대비용');
  }

  // ?load=<파일이름>&ym=YYYY-MM&as=close|uni — 내 드라이브에 둔 엑셀을 그대로 올린다.
  // 파일 선택 창을 못 띄우는 자리(자동 점검·원격)에서 쓴다. 파서는 업로드와 똑같은 것을 탄다.
  if (e && e.parameter && e.parameter.load) {
    var out2;
    try {
      var nm = String(e.parameter.load);
      var it = DriveApp.getFilesByName(nm);
      if (!it.hasNext()) throw new Error('내 드라이브에 «' + nm + '» 이 없습니다');
      var fl = it.next(), bl = fl.getBlob();
      var ym2 = String(e.parameter.ym || defaultYm_());
      var b64 = Utilities.base64Encode(bl.getBytes());
      var kind2 = String(e.parameter.as || 'close');
      var r2 = (kind2 === 'uni') ? apiUnipassUpload(ym2, nm, b64, bl.getContentType())
                                 : apiCloseUpload(ym2, nm, b64, bl.getContentType());
      out2 = nm + ' → ' + ym2 + ' (' + kind2 + ')' + String.fromCharCode(10) + JSON.stringify(r2, null, 1);
    } catch (err3) { out2 = '올리다 멈췄습니다 — ' + err3; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + String(out2)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('올리기');
  }
  // ?seed=YYYY-MM&wrong=N — ERP 입고현황을 «검수 끝난 건» 으로 깐다 (뒤 단계 시험용)
  if (e && e.parameter && e.parameter.seed) {
    var out3;
    try { out3 = JSON.stringify(seedFromReceipt_(String(e.parameter.seed), Number(e.parameter.wrong || 0)), null, 1); }
    catch (err4) { out3 = '깔다 멈췄습니다 — ' + err4; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + String(out3)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('시드');
  }
  // ?bl=YYYY-MM — B/L 자동연결이 무엇을 내놓는지 (화면에서 조용히 죽을 때 쓴다)
  if (e && e.parameter && e.parameter.bl) {
    var out4, t4 = Date.now();
    try {
      var mt = apiBlMatch(String(e.parameter.bl));
      var pick = ((mt && mt.rows) || []).filter(function (x) { return x['묶음'] && x['묶음'].length; });
      if (e.parameter.apply && pick.length) {
        apiBlApply(String(e.parameter.bl), pick, true);
        out4 = '적용했습니다 — ' + pick.length + '묶음'
          + String.fromCharCode(10) + JSON.stringify(mt.sel, null, 1);

      }
    }
    catch (err5) { out4 = '멈췄습니다 — ' + err5 + String.fromCharCode(10) + (err5 && err5.stack ? err5.stack : ''); }
    out4 = (Date.now() - t4) + 'ms' + String.fromCharCode(10) + out4;
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + String(out4)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('B/L');
  }
  // ?v=YYYY-MM[&confirm=1] — 검증 결과를 보고, confirm 이면 확정까지
  if (e && e.parameter && e.parameter.v) {
    var out5, ym5 = String(e.parameter.v);
    try {
      var d5 = apiClose(ym5), L5 = [];
      if (!d5 || !d5.summary) {
        // ERP 입고현황이 없으면 summary 가 아예 없다. 예전엔 여기서 TypeError 로 터졌다.
        L5.push(ym5 + ' — ERP 입고현황이 없습니다. 먼저 올려 주세요.');
        return HtmlService.createHtmlOutput('<meta charset="utf-8">'
          + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
          + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
          + '<pre style="white-space:pre-wrap;margin:0">' + L5.join('') + '</pre></body>').setTitle('검증');
      }
      L5.push('수량 ' + fmt_(d5.summary.qty) + ' · 기준 ' + fmt_(d5.summary.base)
        + ' · 부대비용 ' + fmt_(d5.summary.oh_inv) + ' · 취득원가 ' + fmt_(d5.summary.landed));
      L5.push('');
      (d5.checks || []).forEach(function (c) {
        L5.push((c.ok ? '✔ ' : '✘ ') + c.id + ' ' + c.name);
        if (c.detail) L5.push('    ' + c.detail);
      });
      var bad5 = (d5.checks || []).filter(function (c) { return !c.ok; });
      L5.push('');
      L5.push(bad5.length ? ('✘ 막히는 검증 ' + bad5.length + '개') : '✔ 검증 전부 통과');
      if (e.parameter.confirm) {
        if (bad5.length) L5.push('— 검증이 안 끝나 확정하지 않았습니다');
        else { var r5 = apiCloseConfirm(ym5, true, !!e.parameter.nopush); L5.push('확정했습니다 — ' + JSON.stringify(r5 && r5.state ? r5.state : r5)); }
      }
      out5 = L5.join(String.fromCharCode(10));
    } catch (err6) { out5 = '멈쾔습니다 — ' + err6; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + String(out5)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('검증');
  }
  // ?duty=YYYY-MM[&apply=1] — 유니패스 관세를 부대비용으로
  if (e && e.parameter && e.parameter.duty) {
    var LD = [], ymD = String(e.parameter.duty);
    try {
      var rD = apiDutyToCost(ymD, !!e.parameter.apply);
      LD.push(ymD + ' — 유니패스 신고 ' + rD.plan.length + '건');
      LD.push('');
      rD.plan.forEach(function (x) {
        LD.push((x.ok ? '\u2714 ' : '\u2718 ') + pad_(x.no, 20) + pad_(x.bl, 18)

          + (x.why ? ('   ' + x.why) : ''));
      });
      LD.push('');
      if (!e.parameter.apply) {
        var canD = rD.plan.filter(function (x) { return x.ok; });
        LD.push('넣을 수 있는 것 ' + canD.length + '건 · 합계 '
          + fmt_(canD.reduce(function (t, x) { return t + x.duty; }, 0)));

      } else {
        LD.push('넣었습니다 ' + rD.done.length + '건 · 합계 '
          + fmt_(rD.done.reduce(function (t, x) { return t + x.duty; }, 0)));
        rD.fail.forEach(function (x) { LD.push('  \u2718 ' + x.p.no + ' — ' + x.msg); });
      }
    } catch (errD) { LD.push('멈췄습니다 — ' + errD); }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + LD.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('관세');
  }

  // ?dump=YYYY-MM · ?restore=<파일>&ym= · ?baks=[YYYY-MM] · ?wipe=YYYY-MM
  if (e && e.parameter && (e.parameter.dump || e.parameter.restore || e.parameter.baks || e.parameter.wipe)) {
    var LB = [];
    try {
      if (e.parameter.dump) {
        var rB = apiBackupDump(String(e.parameter.dump));
        LB.push('떠 두었습니다 — ' + rB.name);
        LB.push('  ' + rB.url);
        Object.keys(rB.counts).forEach(function (k) { LB.push('  ' + pad_(k, 14) + fmt_(rB.counts[k]) + '행'); });
        LB.push('  확정상태 ' + (rB.closed ? '있음(같이 떴습니다)' : '없음'));
      } else if (e.parameter.restore) {
        var rR = apiBackupRestore(String(e.parameter.restore), String(e.parameter.ym || ''));
        LB.push('되돌렸습니다 — ' + rR.from + ' → ' + rR.ym);
        Object.keys(rR.counts).forEach(function (k) { LB.push('  ' + pad_(k, 14) + fmt_(rR.counts[k]) + '행'); });
        LB.push('  확정상태 ' + (rR.closed ? '되살렸습니다' : '없음'));
      } else if (e.parameter.wipe) {
        // 비우기 — 떠 둔 백업이 있어야만 지운다. 되돌릴 길 없이 지우는 일은 없게.
        var ymW = String(e.parameter.wipe);
        var haveB = apiBackupList(ymW).rows;
        if (!haveB.length) {
          LB.push('✘ ' + ymW + ' 백업이 없습니다. 먼저 ?dump=' + ymW + ' 를 하세요.');
        } else {
          LB.push('가장 최근 백업: ' + haveB[0].name + ' (' + haveB[0].at + ')');
          var PW2 = PropertiesService.getScriptProperties();
          var kW = 'WIPE_TICKET_' + ymW;
          if (!e.parameter.yes) {
            // 한 번 쓰면 죽는 표를 준다. 주소를 새로고침해도 표가 없으면 안 지워진다 —
            // 탭에 남은 ?wipe=…&yes=1 이 다시 돌아 7월을 두 번 날린 적이 있다.
            var tW = Utilities.getUuid().slice(0, 8);
            PW2.setProperty(kW, JSON.stringify({ t: tW, at: Date.now() }));
            LB.push('');
            LB.push('※ 아직 안 지웠습니다. 이 주소로 한 번만 지울 수 있습니다:');
            LB.push('   ?wipe=' + ymW + '&yes=' + tW);
            LB.push('   (표는 10분 뒤 만료되고, 한 번 쓰면 사라집니다)');
            LB.push('   지우는 것: 입고현황 · 입고현황메타 · 비용 · 비용품번 · 환율 · 유니패스 (그 달만)');
          } else {
            var rawW = PW2.getProperty(kW);
            var tkW = rawW ? JSON.parse(rawW) : null;
            if (!tkW || tkW.t !== String(e.parameter.yes)) {
              LB.push('');
              LB.push('\u2718 표가 맞지 않습니다 — 이미 썼거나 만료됐습니다.');
              LB.push('   새로고침으로는 지워지지 않습니다. ?wipe=' + ymW + ' 부터 다시 하세요.');
            } else if (Date.now() - Number(tkW.at) > 600000) {
              PW2.deleteProperty(kW);
              LB.push('');
              LB.push('\u2718 표가 만료됐습니다(10분). ?wipe=' + ymW + ' 부터 다시 하세요.');
            } else {
              PW2.deleteProperty(kW);          // 먼저 없앤다 — 지우는 중에 새로고침해도 두 번 안 돌게
              var rW = apiCloseReset(ymW);
              LB.push('비웠습니다 — 입고현황 · 메타 · 비용 · 비용품번 · 환율 · 유니패스');
              LB.push('  (표를 썼으니 이 주소를 새로고침해도 다시 안 지워집니다)');

        var rL = apiBackupList(String(e.parameter.baks) === '1' ? '' : String(e.parameter.baks || ''));
        LB.push('떠 둔 백업 ' + rL.rows.length + '개');
        rL.rows.forEach(function (x) { LB.push('  ' + x.at + '  ' + pad_(String(x.size), 9) + '  ' + x.name); });
      }
    } catch (errB2) { LB.push('멈췄습니다 — ' + errB2); }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + LB.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('백업');

  // ?ht=YYYY-MM — 홈택스 후보를 서버가 읽는지
  if (e && e.parameter && e.parameter.ht) {
    var ymH = String(e.parameter.ht), LH = [];
    try {
      LH.push('찾는 파일 이름: ' + HT_FILE + ymH + '.json');

      var nH = 0;
      while (itH.hasNext()) {
        var fH = itH.next(); nH++;
        LH.push('  찾음 — ' + fH.getName() + ' · ' + fH.getSize() + '바이트 · '

      if (!nH) LH.push('  드라이브에서 못 찾았습니다.');
      LH.push('');
      var dH = apiHometaxCand(ymH);
      LH.push('apiHometaxCand → 후보 ' + dH.rows.length + '건 · 제외 ' + dH.skipped.length + '건'
        + (dH.why ? ('  ✘ ' + dH.why) : ''));
      dH.rows.forEach(function (r) {
        LH.push('  ' + r.ymd + '  ' + pad_(r.type, 9) + pad_(fmt_(r.amt), 12) + '  ' + r.sup + '  [' + r.id + ']');
      });
      LH.push('');
      var uH = apiHometaxUsed(ymH);
      var ku = Object.keys(uH.used);
      LH.push('이미 넣은 증빙 ' + ku.length + '건' + (ku.length ? (' — ' + ku.join(', ')) : ''));
    } catch (errH) { LH.push('멈췄습니다 — ' + errH); }
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.65 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + LH.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('홈택스 후보');
  }

  // ?perf=YYYY-MM — 어느 호출이 몇 ms 인가 (차가운 때 / 더운 때)
  if (e && e.parameter && e.parameter.perf) {
    var ymP = String(e.parameter.perf), LP = [], tP;
    function lap(name, fn) {
      var t = Date.now(), n2 = '', err = '';
      try { var r = fn(); n2 = (r && r.rows) ? (r.rows.length + '\ud589') : ((r && r.lines) ? r.lines.length : ''); }
      catch (ex) { err = ' \u2718 ' + ex; }
      LP.push(('        ' + (Date.now() - t)).slice(-7) + ' ms  ' + name + (n2 ? ('  ' + n2) : '') + err);
    }
    // _BUMP 를 안 비우면 옛 키를 그대로 써서 «차가운 때» 가 실은 더운 값이 된다.
    // 자기점검에서 같은 자리를 이미 당했다 — 캐시를 비우는 곳은 반드시 둘을 같이 비운다.
    cacheWipeAll_(); _BUMP = null; _MEMO = {}; _SS = null; _SHEET = {}; _WHO = null;
    LP.push('\u2014 \ucc28\uac00\uc6b4 \ub54c (\uce90\uc2dc \ube44\uc6c0) \u2014');
    lap('apiBoot(' + ymP + ')', function () { return apiBoot(ymP); });
    lap('apiClose(' + ymP + ')', function () { return apiClose(ymP); });
    lap('apiStock(' + ymP + ')', function () { return apiStock(ymP); });
    var id0 = (listRecv_(ymP)[0] || {}).id || '';
    if (id0) lap('apiDetail(' + id0 + ')', function () { return apiDetail(ymP, id0); });
    LP.push('');
    LP.push('\u2014 \ub354\uc6b4 \ub54c (\uce90\uc2dc \uc0b4\uc544\uc788\uc74c) \u2014');
    lap('apiBoot', function () { return apiBoot(ymP); });
    lap('apiClose', function () { return apiClose(ymP); });
    lap('apiStock', function () { return apiStock(ymP); });
    if (id0) lap('apiDetail', function () { return apiDetail(ymP, id0); });
    LP.push('');
    LP.push('\u2014 \uc18d\uc7ac\ub8cc \u2014');
    lap('rows_(\uc785\uace0\ud604\ud669)', function () { return { rows: rows_(SH.RCPT) }; });
    lap('rows_(\uc608\uc815)', function () { return { rows: rows_(SH.PLAN) }; });
    lap('listRecv_', function () { return { rows: listRecv_(ymP) }; });
    lap('closeCompute_', function () { return closeCompute_(ymP); });
    return HtmlService.createHtmlOutput('<meta charset="utf-8">'
      + '<body style="margin:0;background:#12140f;color:#e6e8e0;'
      + "font:13px/1.7 Consolas,'D2Coding',monospace;padding:20px 24px\">"
      + '<pre style="white-space:pre-wrap;margin:0">' + LP.join(String.fromCharCode(10))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>').setTitle('\uc18d\ub3c4');
  }
  // ?drop=<id>&ym=YYYY-MM — 건 하나를 지운다 (화면 [이 건 지우기] 와 같은 길)
  if (e && e.parameter && e.parameter.drop) {
    var out7;
    try {
      var ym7 = String(e.parameter.ym || defaultYm_());
      apiDelete(ym7, String(e.parameter.drop));
      out7 = '지웠습니다 — ' + ym7 + ' / ' + e.parameter.drop;
    } catch (err7) { out7 = '지우다 멈췄습니다 — ' + err7; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8"><pre style="font:14px Consolas">'
      + String(out7).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>');
  }
  // ?mk=<key>&ym=YYYY-MM — 예정 한 차수를 건으로 (화면이 조용히 죽을 때 이유를 본다)
  if (e && e.parameter && e.parameter.mk) {
    var out8;
    try {
      var ym8 = String(e.parameter.ym || defaultYm_());
      out8 = JSON.stringify(apiFromLs(ym8, String(e.parameter.mk), '', ''), null, 1);
    } catch (err8) { out8 = '멈췄습니다 — ' + err8; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8"><pre style="font:13px Consolas;white-space:pre-wrap">'
      + String(out8).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>');
  }
  // ?ls=YYYY-MM — 그 달 예정 차수와 key 를 그대로
  if (e && e.parameter && e.parameter.ls) {
    var out9;
    try {
      out9 = lsPending_(String(e.parameter.ls)).map(function (g) {
        return g.key + '   ← ' + g['출고처'] + ' ' + g.sku + 'SKU ' + g.qty + 'PC';
      }).join(String.fromCharCode(10));
    } catch (err9) { out9 = '멈췄습니다 — ' + err9; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8"><pre style="font:13px Consolas;white-space:pre-wrap">'
      + String(out9).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>');
  }
  // ?push=YYYY-MM — 확정된 달을 재고수불부로 (화면 [다시 보내기] 와 같은 길)
  if (e && e.parameter && e.parameter.push) {
    var outA;
    try { outA = JSON.stringify(apiCloseRepush(String(e.parameter.push)), null, 1); }
    catch (errA) { outA = '보내다 멈췄습니다 — ' + errA; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8"><pre style="font:13px Consolas;white-space:pre-wrap">'
      + String(outA).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre></body>');
  }
  // ?fix=1 — 시트 칸·날짜·ym 복구
  if (e && e.parameter && e.parameter.fix) {
    var r;
    try { r = repairAll(); } catch (err2) { r = '복구가 터졌습니다 — ' + err2; }
    return HtmlService.createHtmlOutput('<meta charset="utf-8"><pre>' + String(r) + '</pre>');
  }
  var t = HtmlService.createTemplateFromFile('App');
  t.ym = (e && e.parameter && e.parameter.ym) || defaultYm_();
  t.tab = (e && e.parameter && e.parameter.tab) || '';
  // 첫 데이터를 페이지에 심는다 — 화면이 뜨는 순간 이미 그릴 것이 있다.
  // 실패해도 화면은 돈다 (그때는 예전처럼 apiBoot 를 부른다).
  try { t.boot = JSON.stringify(apiBoot(t.ym)); } catch (err) { t.boot = 'null'; }
  return t.evaluate()
    .setTitle('입고 검수')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}

function include(f) { return HtmlService.createHtmlOutputFromFile(f).getContent(); }

function defaultYm_() { return Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM'); }
function k_(item, cc, size) { return item + '|' + cc + '|' + size; }
/** 품번 앞 2자리 = 브랜드. 담당은 본부가 아니라 브랜드로 갈린다 */
function br_(item) { return String(item || '').trim().slice(0, 2).toUpperCase(); }
var BR_DEPT = { HR: 'A본부', OD: 'C본부', UV: 'C본부', OH: 'C본부', EL: 'C본부', OA: 'C본부',
                GL: 'B본부', SN: 'B본부', UO: '운영', PR: 'A본부' };
function deptOfBr_(b) { return BR_DEPT[b] || ''; }
/** 브랜드별 빈 칸 */
function brCell_() { return { sku: 0, plan: 0, act: 0, diff: 0, amt: 0, need: 0 }; }

/** 화면 진입 — 역할·월 목록·건 목록.
 *  느린 건 전부 시트 읽기다. 계산해 둔 것은 캐시에서 꺼내 쓴다. */
function apiBoot(ym) {
  var t0 = Date.now();
  ym = ym || defaultYm_();
  var w = who_();                                  // 권한 시트 1회
  var hit = cacheGet_('boot:' + ym);
  if (hit) {
    hit.me = w; hit.cached = true;
    Logger.log('apiBoot ' + ym + ' — 캐시 · ' + (Date.now() - t0) + 'ms · ' + (hit.rows || []).length + '건');
    hit.canProd = can_('생산'); hit.canLogi = can_('물류'); hit.canFin = can_('재무');
    hit.myBrands = myBrands_();
    hit.ms = Date.now() - t0;
    return hit;
  }
  ensureAuthBrand_();                              // 권한 시트에 「브랜드」 칸 (한 번만)
  var tA = Date.now();
  var recs = rows_(SH.REC);
  var tB = Date.now();
  // 달 목록은 «검수 건이 있는 달» 만이 아니다 — ERP만 올려 둔 달도 골라야 한다.
  // (1~7월은 검수 건이 없어서, ERP을 다 올려 두고도 목록에 안 떴다)
  var yms = {};
  recs.forEach(function (r) { yms[String(r.ym)] = 1; });
  rows_(SH.RMETA).forEach(function (r) { if (r.ym) yms[ymOf_(r.ym)] = 1; });
  yms[ym] = 1;
  var t1 = Date.now();
  var rows = listRecv_(ym);
  var t2 = Date.now();
  var out = {
    ym: ym, months: Object.keys(yms).sort(),
    rows: rows,
    pending: lsPending_(ym),          // 라인시트에 있는데 아직 건이 안 된 것
    reasons: REASONS,
    ls: lsMeta_(),
    brDept: BR_DEPT,
    dbUrl: dbUrl_()
  };
  out = pure_(out);                                // Date 가 섞이면 화면에서 null 이 된다
  cachePut_('boot:' + ym, out);                    // 사람마다 다른 값은 빼고 담는다
  out.me = w;
  out.canProd = can_('생산'); out.canLogi = can_('물류'); out.canFin = can_('재무');
  out.myBrands = myBrands_();
  out.ms = Date.now() - t0;
  Logger.log('apiBoot ' + ym + ' — who+캐시확인 ' + (tA - t0) + 'ms · 건시트 ' + (tB - tA)
    + 'ms · 건목록 ' + (t2 - t1) + 'ms · 나머지 ' + (Date.now() - t2)
    + 'ms · 전체 ' + out.ms + 'ms · ' + rows.length + '건');
  return out;
}

/** 권한 시트에 「브랜드」 칸이 없으면 붙인다. 캐시 미스일 때만 확인하므로 평소엔 비용이 없다. */
function ensureAuthBrand_() {
  if (cacheGet_('authbr')) return;
  try {
    var sh = sheet_(SH.AUTH);
    var n = Math.max(1, sh.getLastColumn());
    var head = sh.getRange(1, 1, 1, n).getValues()[0].map(function (x) { return String(x || '').trim(); });
    if (head.indexOf('브랜드') < 0) {
      sh.getRange(1, n + 1).setValue('브랜드').setFontWeight('bold').setBackground('#f1f3f0');
      delete _MEMO[SH.AUTH];
    }
    cachePut_('authbr', 1);
  } catch (e) {}
}

/** 10분마다 돌면서 이번 달·지난 달 캐시를 채워 둔다.
 *  사람이 여는 순간엔 이미 «맞는» 상태라 시트를 안 읽는다. */
function warmCache() {
  var now = new Date();
  var cur = Utilities.formatDate(now, 'Asia/Seoul', 'yyyy-MM');
  var prev = Utilities.formatDate(new Date(now.getFullYear(), now.getMonth() - 1, 1), 'Asia/Seoul', 'yyyy-MM');
  [cur, prev].forEach(function (ym) {
    try {
      // 이미 더우면 아무것도 하지 않는다.
      // 무조건 다시 계산하느라 10분마다 몇 분씩 시트를 물고 있었다.
      var needBoot = !cacheGet_('boot:' + ym);
      var needClose = !cacheGetBig_('close:' + ym);
      if (!needBoot && !needClose) { Logger.log('warm ' + ym + ' — 아직 더움, 건너뜀'); return; }
      _MEMO = {}; _SS = null; _SHEET = {};
      var t = Date.now();
      if (!needBoot) { Logger.log('warm ' + ym + ' — 목록은 더움'); }
      var recs = rows_(SH.REC);
      var yms = {}; recs.forEach(function (r) { yms[String(r.ym)] = 1; });
      rows_(SH.RMETA).forEach(function (r) { if (r.ym) yms[ymOf_(r.ym)] = 1; });
      yms[ym] = 1;
      cachePut_('boot:' + ym, pure_({
        ym: ym, months: Object.keys(yms).sort(), rows: listRecv_(ym),
        pending: lsPending_(ym),
        reasons: REASONS, ls: lsMeta_(), brDept: BR_DEPT, dbUrl: dbUrl_()
      }));
      var tB = Date.now() - t;
      // 월마감도 같이 데운다 — 이게 없으면 탭을 누를 때마다 1초씩 기다린다
      var tC = Date.now();
      if (needClose) { try { apiClose(ym); } catch (e2) { Logger.log('warm close ' + ym + ' 실패: ' + e2); } }
      Logger.log('warm ' + ym + ' — 목록 ' + tB + 'ms · 월마감 ' + (Date.now() - tC)
        + 'ms · 합 ' + (Date.now() - t + tB - tB) + 'ms');
    } catch (e) { Logger.log('warm ' + ym + ' 실패: ' + e); }
  });
}

/** 한 번만 실행 — 10분마다 캐시를 데우는 트리거를 건다 */
function setupWarmTrigger() {
  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (t.getHandlerFunction() === 'warmCache') ScriptApp.deleteTrigger(t);
  });
  ScriptApp.newTrigger('warmCache').timeBased().everyMinutes(10).create();
  warmCache();
  Logger.log('10분마다 캐시를 데웁니다.');
}

/** DB 주소는 바뀌지 않는다 — 매번 열지 않는다 */
function dbUrl_() {
  var v = cacheGet_('dbUrl');
  if (v) return v;
  try { v = ss_().getUrl(); cachePut_('dbUrl', v); return v; } catch (e) { return ''; }
}

function chk_(s) { try { return JSON.parse(s || '[]'); } catch (e) { return []; } }

/** 내가 볼 수 있는 브랜드 — 권한 시트 「브랜드」 칸이 비었으면 전부.
 *  'OD,UV' 처럼 쉼표로 여럿 적을 수 있다. */
function myBrands_() {
  try { return who_().brands || null; } catch (e) { return null; }   // null = 전부
}

/** 월 전체를 1패스로 — 시트는 REC/PLAN/WMS/REV 각 1번만 읽는다 */
function listRecv_(ym) {
  var metas = {}, order = [];
  rows_(SH.REC).forEach(function (r) {
    if (String(r.ym) !== String(ym)) return;
    metas[String(r.id)] = r; order.push(String(r.id));
  });
  if (!order.length) return [];
  var acc = {};
  order.forEach(function (id) { acc[id] = { P: {}, W: {}, RV: {}, cost: {}, style: {}, slip: {} }; });
  rows_(SH.PLAN).forEach(function (r) {
    var a = (String(r.ym) === String(ym)) && acc[String(r.id)];
    if (!a) return;
    var k = k_(r['품번'], r['컬러코드'], String(r['사이즈']));
    a.P[k] = (a.P[k] || 0) + int_(r['수량']);
    if (int_(r['원가'])) a.cost[k] = int_(r['원가']);
    a.style[r['품번']] = 1;
  });
  rows_(SH.WMS).forEach(function (r) {
    var a = (String(r.ym) === String(ym)) && acc[String(r.id)];
    if (!a) return;
    var k = k_(r['품번'], r['컬러코드'], String(r['사이즈']));
    a.W[k] = (a.W[k] || 0) + int_(r['확정량']);
    a.style[r['품번']] = 1;
    if (r['전표번호']) a.slip[r['전표번호']] = 1;
  });
  rows_(SH.REV).forEach(function (r) {
    var a = (String(r.ym) === String(ym)) && acc[String(r.id)];
    if (!a) return;
    a.RV[String(r['키'])] = { act: (r['실수량'] === '' || r['실수량'] === null) ? null : int_(r['실수량']), rs: String(r['사유'] || '').split(';').filter(String) };
  });
  return order.map(function (id) {
    var a = acc[id], meta = metas[id], keys = {};
    Object.keys(a.P).forEach(function (k) { keys[k] = 1; });
    Object.keys(a.W).forEach(function (k) { keys[k] = 1; });
    var tp = 0, ta = 0, tv = 0, tva = 0, need = 0, reQ = 0, reA = 0, shQ = 0, shA = 0, nd = 0, hasW = false;
    var B = {};
    Object.keys(keys).forEach(function (k) {
      var plan = a.P[k] || 0, w = a.W.hasOwnProperty(k) ? a.W[k] : null, rv = a.RV[k] || {};
      if (w !== null) hasW = true;
      var act = (rv.act !== undefined && rv.act !== null) ? rv.act : (w !== null ? w : plan);
      var cost = a.cost[k] || 0, diff = act - plan, amt = diff * cost;
      tp += plan; ta += act; tv += plan * cost; tva += act * cost;
      var bk = br_(k.split('|')[0]), bc = B[bk] || (B[bk] = brCell_());
      bc.sku++; bc.plan += plan; bc.act += act; bc.diff += diff; bc.amt += act * cost;
      if (diff && !(rv.rs || []).length) bc.need++;
      if (!diff) return;
      nd++;
      var rs = rv.rs || [];
      if (!rs.length) { need++; return; }
      var ga = rs.some(function (x) { return REASONS.a.indexOf(x) >= 0; });
      var gb = rs.some(function (x) { return REASONS.b.indexOf(x) >= 0; });
      if (ga && gb) { reQ += diff / 2; reA += amt / 2; shQ += diff / 2; shA += amt / 2; }
      else if (ga) { reQ += diff; reA += amt; }
      else { shQ += diff; shA += amt; }
    });
    var state = (!hasW && !nd) ? '예정만' : (!nd ? '전량 입고' : (need ? ('사유 ' + need + '건 미선택') : '검수 완료'));
    if (String(meta['상태']) === '확인 완료') state = '확인 완료';
    return {
      ym: ym, id: id, '출고일': dOf_(meta['출고일']), '출고처': meta['출고처'], '입고처': meta['입고처'],
      styles: Object.keys(a.style).sort(), sku: Object.keys(keys).length, plan: tp, act: ta,
      plan_amt: tv, act_amt: tva, diff: ta - tp, amt: tva - tv,
      re_q: Math.round(reQ), re_a: Math.round(reA), sh_q: Math.round(shQ), sh_a: Math.round(shA),
      need: need, state: state, has_plan: !!Object.keys(a.P).length, has_wms: hasW,
      slips: Object.keys(a.slip).sort(), checks: chk_(meta['검산']), src: meta['출처'] || '',
      asked: String(meta['의뢰'] || ''),
      B: B, brands: Object.keys(B).sort()
    };
  }).sort(function (a, b) { return String(a['출고일'] + a.id).localeCompare(String(b['출고일'] + b.id)); });
}

function detail_(ym, id) {
  var meta = null;
  rows_(SH.REC).forEach(function (r) { if (String(r.ym) === String(ym) && String(r.id) === String(id)) meta = r; });
  if (!meta) throw new Error('건이 없습니다: ' + id);
  var P = {}, W = {}, RV = {};
  rows_(SH.PLAN).forEach(function (r) {
    if (String(r.ym) !== String(ym) || String(r.id) !== String(id)) return;
    var k = k_(r['품번'], r['컬러코드'], r['사이즈']);
    var e = P[k] || (P[k] = { k: k, item: r['품번'], cc: r['컬러코드'], color: r['컬러'], size: String(r['사이즈']), plan: 0, sheet: 0, cost: int_(r['원가']), name: r['품명'], barcode: r['바코드'] });
    e.plan += int_(r['수량']);
    e.sheet += int_(r['원수량'] === '' || r['원수량'] === null || r['원수량'] === undefined ? r['수량'] : r['원수량']);
    if (!e.cost && int_(r['원가'])) e.cost = int_(r['원가']);
  });
  rows_(SH.WMS).forEach(function (r) {
    if (String(r.ym) !== String(ym) || String(r.id) !== String(id)) return;
    var k = k_(r['품번'], r['컬러코드'], String(r['사이즈']));
    var e = W[k] || (W[k] = { confirm: 0, slips: {} });
    e.confirm += int_(r['확정량']);
    if (r['전표번호']) e.slips[r['전표번호']] = 1;
  });
  rows_(SH.REV).forEach(function (r) {
    if (String(r.ym) !== String(ym) || String(r.id) !== String(id)) return;
    RV[String(r['키'])] = { act: r['실수량'] === '' ? null : int_(r['실수량']), reasons: String(r['사유'] || '').split(';').filter(String) };
  });
  var keys = {};
  Object.keys(P).forEach(function (k) { keys[k] = 1; });
  Object.keys(W).forEach(function (k) { keys[k] = 1; });
  var rows = Object.keys(keys).sort().map(function (k) {
    var p = P[k] || { k: k, item: k.split('|')[0], cc: k.split('|')[1], color: '', size: k.split('|')[2], plan: 0, sheet: 0, cost: 0, name: '', barcode: '' };
    var w = W[k], rv = RV[k] || {};
    var act = (rv.act !== undefined && rv.act !== null) ? rv.act : (w ? w.confirm : p.plan);
    var rs = rv.reasons || [];
    var ga = rs.some(function (x) { return REASONS.a.indexOf(x) >= 0; });
    var gb = rs.some(function (x) { return REASONS.b.indexOf(x) >= 0; });
    return {
      k: k, item: p.item, cc: p.cc, color: p.color, size: p.size, name: p.name, cost: p.cost, barcode: p.barcode,
      plan: p.plan, sheet: p.sheet, wms: w ? w.confirm : null, act: act, diff: act - p.plan, amt: (act - p.plan) * p.cost,
      reasons: rs, kind: (ga && gb) ? '둘 다' : (ga ? '오부착' : (gb ? '실수량부족' : '')),
      src: (rv.act !== undefined && rv.act !== null) ? '확정' : (w ? 'WMS' : '예정'),
      slips: w ? Object.keys(w.slips) : []
    };
  });
  var sizes = {};
  rows.forEach(function (r) { sizes[r.size] = 1; });
  var order = ['FREE', 'XS', 'S', 'M', 'L', 'XL', 'XXL'];
  var sz = Object.keys(sizes).sort(function (a, b) {
    var na = /^\d+$/.test(a), nb = /^\d+$/.test(b);
    if (na && nb) return Number(a) - Number(b);
    if (na) return -1;
    if (nb) return 1;
    return order.indexOf(a) - order.indexOf(b);
  });
  return { meta: meta, rows: rows, sizes: sz, summary: sum_(ym, id, meta, rows), reasons: REASONS };
}

function sum_(ym, id, meta, rows) {
  var tp = 0, ta = 0, tv = 0, tva = 0, need = 0, reQ = 0, reA = 0, shQ = 0, shA = 0, styles = {}, slips = {};
  var hasPlan = false, hasWms = false, B = {};
  rows.forEach(function (r) {
    tp += r.plan; ta += r.act; tv += r.plan * r.cost; tva += r.act * r.cost;
    styles[r.item] = 1;
    var bk = br_(r.item), bc = B[bk] || (B[bk] = brCell_());
    bc.sku++; bc.plan += r.plan; bc.act += r.act; bc.diff += r.diff; bc.amt += r.act * r.cost;
    if (r.diff && !r.reasons.length) bc.need++;
    r.slips.forEach(function (s) { slips[s] = 1; });
    if (r.plan) hasPlan = true;
    if (r.wms !== null) hasWms = true;
    if (!r.diff) return;
    if (!r.reasons.length) { need++; return; }
    if (r.kind === '오부착') { reQ += r.diff; reA += r.amt; }
    else if (r.kind === '실수량부족') { shQ += r.diff; shA += r.amt; }
    else { reQ += r.diff / 2; reA += r.amt / 2; shQ += r.diff / 2; shA += r.amt / 2; }
  });
  var D = rows.filter(function (r) { return r.diff; });
  var state = (!hasWms && !D.length) ? '예정만' : (!D.length ? '전량 입고' : (need ? ('사유 ' + need + '건 미선택') : '검수 완료'));
  if (String(meta['상태']) === '확인 완료') state = '확인 완료';
  return {
    ym: ym, id: id, '출고일': dOf_(meta['출고일']), '출고처': meta['출고처'], '입고처': meta['입고처'],
    styles: Object.keys(styles).sort(), sku: rows.length, plan: tp, act: ta, plan_amt: tv, act_amt: tva,
    diff: ta - tp, amt: tva - tv, re_q: Math.round(reQ), re_a: Math.round(reA), sh_q: Math.round(shQ), sh_a: Math.round(shA),
    need: need, state: state, has_plan: hasPlan, has_wms: hasWms, slips: Object.keys(slips).sort(),
    checks: chk_(meta['검산']), src: meta['출처'] || '',
    asked: String(meta['의뢰'] || ''), sheet: rows.reduce(function (t, r) { return t + (r.sheet || 0); }, 0),
    B: B, brands: Object.keys(B).sort()
  };
}

function summary_(ym, id) { return detail_(ym, id).summary; }

/** 생산 — 입고명세서 수량으로 맞춘다 (라인시트 값은 원수량에 그대로 남는다) */
function apiPlanEdit(ym, id, patch) {
  if (!can_('생산')) throw new Error('생산 담당자만 수량을 맞출 수 있습니다. (현재: ' + who_().role + ')');
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var sh = sheet_(SH.PLAN), head = HEAD[SH.PLAN];
    var all = sh.getDataRange().getValues();
    var iYm = head.indexOf('ym'), iId = head.indexOf('id'), iQ = head.indexOf('수량'),
        iIt = head.indexOf('품번'), iCc = head.indexOf('컬러코드'), iSz = head.indexOf('사이즈');
    var hit = 0;
    for (var r = 1; r < all.length; r++) {
      if (String(all[r][iYm]) !== String(ym) || String(all[r][iId]) !== String(id)) continue;
      var k = k_(all[r][iIt], all[r][iCc], String(all[r][iSz]));
      if (!patch.hasOwnProperty(k)) continue;
      all[r][iQ] = Math.max(0, int_(patch[k]));
      hit++;
    }
    if (hit) sh.getRange(2, 1, all.length - 1, head.length)
      .setValues(all.slice(1).map(function (x) { return x.slice(0, head.length); }));
  } finally { lock.releaseLock(); }
  bust_(ym);
  log_('명세서수량', id, Object.keys(patch || {}).length + '칸', ym);
  return pure_({ ok: true, summary: summary_(ym, id) });
}

/** 생산 — 검수 의뢰 (여기서부터 물류 차례) */
function apiAskReview(ym, id, on) {
  if (!can_('생산')) throw new Error('생산 담당자만 의뢰할 수 있습니다. (현재: ' + who_().role + ')');
  var sh = sheet_(SH.REC), head = HEAD[SH.REC];
  var all = sh.getDataRange().getValues();
  var iYm = head.indexOf('ym'), iId = head.indexOf('id'), iAsk = head.indexOf('의뢰');
  if (iAsk < 0) throw new Error('권한 시트에 「의뢰」 칸이 없습니다 — repairHeads 를 돌리세요.');
  for (var r = 1; r < all.length; r++) {
    if (String(all[r][iYm]) !== String(ym) || String(all[r][iId]) !== String(id)) continue;
    all[r][iAsk] = on ? (Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm') + ' ' + who_().email) : '';
    sh.getRange(r + 1, iAsk + 1).setValue(all[r][iAsk]);
    break;
  }
  bust_(ym);
  log_(on ? '검수의뢰' : '의뢰취소', id, '', ym);
  return pure_({ ok: true, summary: summary_(ym, id) });
}

/** 여러 건을 한 번에 — 왕복 한 번이 몇 초라, 87번 부르면 앱을 못 쓴다 */
function apiDetails(ym, ids) {
  var t = Date.now(), out = {}, n = 0;
  (ids || []).forEach(function (id) {
    if (n >= 40) return;                      // 한 번에 너무 많이 담으면 응답이 무거워진다
    try { out[id] = detail_(ym, id); n++; } catch (e) {}
  });
  Logger.log('apiDetails ' + ym + ' — ' + n + '건 · ' + (Date.now() - t) + 'ms');
  return pure_(out);
}

function apiDetail(ym, id) {
  var t = Date.now();
  try {
    var d = pure_(detail_(ym, id));
    Logger.log('apiDetail ' + ym + '/' + id + ' — ' + (Date.now() - t) + 'ms · ' + d.rows.length + '줄');
    return d;
  } catch (e) {
    Logger.log('apiDetail 실패 ' + ym + '/' + id + ' — ' + e);
    throw e;
  }
}

/** 물류 — 실수량·사유 저장 */
function apiReview(ym, id, patch) {
  // (요약을 돌려주므로 아래 return 도 pure_ 를 거친다)
  if (!can_('물류')) throw new Error('물류 담당자만 수정할 수 있습니다. (현재 권한: ' + who_().role + ')');
  // 락을 «읽기 앞» 에서 잡는다. 뒤에서 잡으면 두 저장이 겹칠 때
  // 나중 호출이 낡은 스냅샷으로 통째로 덮어써 앞사람이 센 숫자가 사라진다.
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  _MEMO = {};
  var cur = {};
  rows_(SH.REV).forEach(function (r) {
    if (String(r.ym) === String(ym) && String(r.id) === String(id)) cur[String(r['키'])] = { act: r['실수량'], reasons: String(r['사유'] || '') };
  });
  Object.keys(patch || {}).forEach(function (k) {
    var v = patch[k], e = cur[k] || { act: '', reasons: '' };
    if (v.hasOwnProperty('act')) e.act = (v.act === null || v.act === '') ? '' : Math.max(0, int_(v.act));
    if (v.hasOwnProperty('reasons')) e.reasons = (v.reasons || []).filter(function (x) { return REASONS.a.concat(REASONS.b).indexOf(x) >= 0; }).join(';');
    if (e.act === '' && !e.reasons) delete cur[k]; else cur[k] = e;
  });
  try {
    wipe_(SH.REV, ym, id);
    var who = who_().email, now = new Date();
    append_(SH.REV, Object.keys(cur).map(function (k) {
      return { ym: ym, id: id, '키': k, '실수량': cur[k].act, '사유': cur[k].reasons, '수정자': who, '수정시각': now };
    }));
  } finally { lock.releaseLock(); }
  bust_(ym);
  log_('검수저장', id, Object.keys(patch || {}).join(','));
  return pure_({ ok: true, summary: summary_(ym, id) });
}

/** 파일 업로드 — kind: plan | pack | wms */
function apiUpload(ym, id, kind, name, b64, mime) {
  if (kind === 'wms' ? !can_('물류') : !can_('생산')) throw new Error((kind === 'wms' ? '물류' : '생산') + ' 담당자만 올릴 수 있습니다. (현재: ' + who_().role + ')');
  var sheets = readWorkbook_(b64, name, mime);
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    if (kind === 'wms') {
      var wr = parseWms_(sheets);
      if (!wr.length) throw new Error('WMS 입고검수 양식이 아닙니다 (STYLE·확정량 열 없음).');
      if (!id) {
        var dt = wr.map(function (x) { return x.date; }).filter(String).sort();
        id = (dt.length ? dt[0].replace(/-/g, '') : Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyyMMdd')) + '_WMS';
        ensureRec_(ym, id, { '출고일': dt.length ? dt[0] : '', '출고처': '', '입고처': '', '출처': 'WMS' });
      }
      var slips = {}; wr.forEach(function (x) { if (x.slip) slips[x.slip] = 1; });
      // 같은 전표 재업로드는 교체
      var keep = rows_(SH.WMS).filter(function (r) { return String(r.ym) === String(ym) && String(r.id) === String(id) && !slips[r['전표번호']]; });
      wipe_(SH.WMS, ym, id);
      append_(SH.WMS, keep);
      append_(SH.WMS, wr.map(function (x) {
        return { ym: ym, id: id, '품번': x.item, '컬러코드': x.cc, '사이즈': x.size, '지시량': x.order, '확정량': x.confirm, '바코드': x.barcode, '전표번호': x.slip, '등록일자': x.date };
      }));
      addCheck_(ym, id, { lv: 'ok', msg: 'WMS ' + name + ' — 전표 ' + Object.keys(slips).join(', ') + ' · 확정 ' + fmt_(wr.reduce(function (t, x) { return t + x.confirm; }, 0)) });
      bust_(ym);
      log_('WMS업로드', id, name);
      return { id: id, kind: kind, rows: wr.length, slips: Object.keys(slips) };
    }
    // plan / pack
    var cr = parseCartons_(sheets), mx = parseMatrix_(sheets);
    if (!cr.rows.length && !Object.keys(mx.plan).length) throw new Error('출고현황표/입고명세서 양식이 아닙니다.');
    if (!id) {
      var d0 = dOf_(mx.meta['출고일'] || new Date());
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d0)) d0 = Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd');
      id = d0.replace(/-/g, '') + '_' + String(mx.meta['출고처'] || '미지정').replace(/[^\w가-힣]/g, '').slice(0, 12);
      var base = id, kk = 2;
      while (hasRec_(ym, id)) { id = base + '_' + (kk++); }
      ensureRec_(ym, id, { '출고일': d0, '출고처': mx.meta['출고처'] || '', '입고처': mx.meta['입고처'] || '', '출처': kind === 'plan' ? '출고현황표' : '입고명세서' });
    }
    var planRows = buildPlan_(cr, mx);
    var exist = rows_(SH.PLAN).filter(function (r) { return String(r.ym) === String(ym) && String(r.id) === String(id); });
    var checks = cr.checks.slice();
    if (kind === 'pack' && exist.length) {
      var pt = exist.reduce(function (t, r) { return t + int_(r['수량']); }, 0);
      var nt = planRows.reduce(function (t, r) { return t + r.qty; }, 0);
      checks.push({ lv: pt === nt ? 'ok' : 'bad', msg: '입고명세서 합 ' + fmt_(nt) + ' vs 출고현황표 예정 ' + fmt_(pt) + (pt === nt ? ' ✔' : ' (' + (nt - pt > 0 ? '+' : '') + (nt - pt) + ')') });
      // 바코드만 보강
      var bc = {}; planRows.forEach(function (p) { if (p.barcode) bc[k_(p.item, p.cc, p.size)] = p.barcode; });
      wipe_(SH.PLAN, ym, id);
      append_(SH.PLAN, exist.map(function (r) {
        if (!r['바코드'] && bc[k_(r['품번'], r['컬러코드'], String(r['사이즈']))]) r['바코드'] = bc[k_(r['품번'], r['컬러코드'], String(r['사이즈']))];
        return r;
      }));
    } else {
      if (Object.keys(mx.plan).length && cr.rows.length) {
        var mt = 0; Object.keys(mx.plan).forEach(function (k) { mt += mx.plan[k]; });
        var ct = cr.rows.reduce(function (t, x) { return t + x.qty; }, 0);
        checks.push(mt === ct ? { lv: 'ok', msg: '매트릭스 합 = 카톤행 합 = ' + fmt_(ct) + ' ✔' } : { lv: 'bad', msg: '매트릭스 합 ' + fmt_(mt) + ' ≠ 카톤행 합 ' + fmt_(ct) });
      }
      wipe_(SH.PLAN, ym, id);
      append_(SH.PLAN, planRows.map(function (p) {
        return { ym: ym, id: id, '품번': p.item, '컬러코드': p.cc, '컬러': p.color, '사이즈': p.size, '수량': p.qty, '원가': p.cost, '품명': p.name, '바코드': p.barcode };
      }));
    }
    addCheck_(ym, id, checks, name);
    bust_(ym);
    log_(kind === 'plan' ? '출고현황표업로드' : '입고명세서업로드', id, name);
    return { id: id, kind: kind, sku: planRows.length, plan: planRows.reduce(function (t, p) { return t + p.qty; }, 0), checks: checks };
  } finally { lock.releaseLock(); }
}

function buildPlan_(cr, mx) {
  var out = [];
  if (cr.rows.length) {
    var agg = {}, bcode = {}, colname = {};
    cr.rows.forEach(function (x) {
      var k = k_(x.item, x.cc, x.size);
      agg[k] = (agg[k] || 0) + x.qty;
      if (x.barcode && !bcode[k]) bcode[k] = x.barcode;
      if (x.color && !colname[x.item + '|' + x.cc]) colname[x.item + '|' + x.cc] = x.color;
    });
    // 매트릭스 컬러명 ↔ 카톤 컬러코드: 품번별 사이즈 벡터가 같은 것끼리
    var byCart = {}, byMat = {};
    Object.keys(agg).forEach(function (k) { var p = k.split('|'); (byCart[p[0]] = byCart[p[0]] || {})[p[1]] = (byCart[p[0]][p[1]] || {}); byCart[p[0]][p[1]][p[2]] = agg[k]; });
    Object.keys(mx.plan).forEach(function (k) { var p = k.split(''); (byMat[p[0]] = byMat[p[0]] || {})[p[1]] = (byMat[p[0]][p[1]] || {}); byMat[p[0]][p[1]][p[2]] = mx.plan[k]; });
    Object.keys(byMat).forEach(function (item) {
      Object.keys(byMat[item]).forEach(function (colr) {
        var vec = JSON.stringify(byMat[item][colr]);
        var hit = Object.keys(byCart[item] || {}).filter(function (cc) { return JSON.stringify(byCart[item][cc]) === vec; });
        var cc = hit.length === 1 ? hit[0] : colcode_(colr);
        colname[item + '|' + cc] = colr;
      });
    });
    Object.keys(agg).sort().forEach(function (k) {
      var p = k.split('|'), it = mx.items[p[0]] || {};
      out.push({ item: p[0], cc: p[1], color: colname[p[0] + '|' + p[1]] || '', size: p[2], qty: agg[k], cost: it.cost || 0, name: it.name || '', barcode: bcode[k] || '' });
    });
  } else {
    Object.keys(mx.plan).sort().forEach(function (k) {
      var p = k.split(''), it = mx.items[p[0]] || {};
      out.push({ item: p[0], cc: colcode_(p[1]), color: p[1], size: p[2], qty: mx.plan[k], cost: it.cost || 0, name: it.name || '', barcode: '' });
    });
  }
  return out;
}

function hasRec_(ym, id) {
  var f = false;
  rows_(SH.REC).forEach(function (r) { if (String(r.ym) === String(ym) && String(r.id) === String(id)) f = true; });

}

function ensureRec_(ym, id, meta) {

    '상태': '', '출처': meta['출처'] || '', '생성자': who_().email, '생성시각': new Date(), '검산': '[]'
  }]);
}

/** 45,000자에 닿으면 글자 중간에서 자르지 않는다 —
 *  잘린 JSON 은 다음에 읽을 때 통째로 버려져, 쌓아둔 검산 수백 건이 소리 없이 사라졌다.
 *  오래된 기록부터 통째로 덜어낸다. */
function trimChecks_(arr) {
  var a = (arr || []).slice(), s = JSON.stringify(a);
  while (s.length > 45000 && a.length > 1) { a.shift(); s = JSON.stringify(a); }
  return s.length > 45000 ? JSON.stringify(a.slice(-1)) : s;
}

function addCheck_(ym, id, checks, fileName) {
  var arr = (checks instanceof Array) ? checks : [checks];
  if (fileName) arr = arr.map(function (c) { return { lv: c.lv, msg: fileName + ' — ' + c.msg }; });
  var sh = sheet_(SH.REC), n = sh.getLastRow();
  var vals = sh.getRange(2, 1, n - 1, HEAD[SH.REC].length).getValues();
  for (var i = 0; i < vals.length; i++) {
    if (String(vals[i][0]) === String(ym) && String(vals[i][1]) === String(id)) {
      var cur = [];
      try { cur = JSON.parse(vals[i][9] || '[]'); } catch (e) {}
      sh.getRange(i + 2, 10).setValue(trimChecks_(cur.concat(arr)));
      return;
    }
  }
}

// ───── Linesheet.gs
/**
 * 라인시트 통합 시트 직접 읽기 (같은 계정이라 웹앱 호출 없이 openById).
 * 로컬 server.py 의 레이아웃 4종 판독을 옮긴 것 — A 오더리스트 / B 품번형 / C OH / D COSTCO.
 * 캐시: 스크립트 캐시 6시간 + 스크립트 속성(요약). 차수 그룹은 «출고처 × 브랜드 × 차수».
 */
var LS_META = 'LS_META';

/** 저장된 파싱 결과를 읽는다. 없거나 force 면 시트에서 다시 파싱해 적재. */
var _LSROWS = null;

function lsRows_(force) {
  if (!force && _LSROWS) return _LSROWS;      // 한 실행에서 4,826행을 두 번 만들지 않는다
  if (!force) {
    var saved = rows_(SH.LS);
    if (saved.length) {
      return (_LSROWS = saved.map(function (r) {
        return {
          tab: r.tab, brand: r.brand, factory: r.factory, po: String(r.po), release: String(r.release),
          style: r.style, name: r.name, color: r.color, cc: r.cc, size: String(r.size),
          qty: int_(r.qty), barcode: String(r.barcode || ''), cost: int_(r.cost),
          due: String(r.due || ''), season: String(r.season || ''), sheet_in: int_(r.sheet_in)
        };
      }));
    }
  }
  return (_LSROWS = lsRebuild_());
}

/** 라인시트 원본 → 파싱 → DB «라인시트» 시트에 적재 (30초쯤). 버튼으로만 돈다. */
function lsRebuild_() {
  var t0 = new Date().getTime();
  var ss = SpreadsheetApp.openById(LS_SHEET_ID);
  var out = [];
  ss.getSheets().forEach(function (sh) {
    var tab = sh.getName();
    if (tab.indexOf('5.원본_') !== 0) return;
    var n = sh.getLastRow(), c = sh.getLastColumn();
    if (!n || !c) return;
    out = out.concat(lsParseTab_(tab, sh.getRange(1, 1, n, c).getValues()));
  });
  replaceAll_(SH.LS, out);
  var tabs = {};
  out.forEach(function (r) { tabs[r.tab] = (tabs[r.tab] || 0) + 1; });
  PropertiesService.getScriptProperties().setProperty(LS_META, JSON.stringify({
    n: out.length, at: Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm'),
    ms: new Date().getTime() - t0, tabs: tabs
  }));
  log_('라인시트적재', '', out.length + '행');
  return out;
}

function lsMeta_() {
  try { return JSON.parse(PropertiesService.getScriptProperties().getProperty(LS_META) || '{}'); } catch (e) { return {}; }
}

function lsParseTab_(tab, values) {
  var R = values.map(function (r) { return r.map(s_); });
  var brand = tab.split('_').slice(1).join('_');
  var season_tab = (tab.split('_').length >= 3) ? tab.split('_').slice(2).join('_') : '';
  var out = [];
  function hdr(needles, limit, minSizes) {
    for (var i = 0; i < Math.min(R.length, limit || 40); i++) {
      var cells = R[i].map(nz_);
      var ok = needles.every(function (nd) { return cells.some(function (c) { return c.indexOf(nz_(nd)) >= 0; }); });
      if (!ok) continue;
      if (minSizes) { var cnt = 0; R[i].forEach(function (c) { if (SIZE_RE.test(c || '-')) cnt++; }); if (cnt < minSizes) continue; }
      return i;
    }
    return -1;
  }
  var hiD = hdr(['샘플기업자체품번', '컬러명', '생산처']);
  var hiA = hiD < 0 ? hdr(['styleno', 'color'], 40, 3) : -1;
  var hiB = (hiD < 0 && hiA < 0) ? hdr(['품번', '컬러코드', '생산처']) : -1;
  var hiC = (hiD < 0 && hiA < 0 && hiB < 0) ? hdr(['스타일넘버', '컬러', '업체명']) : -1;

  if (hiA >= 0) {
    var h = R[hiA];
    var cf = col_(h, 'factory', '발주처'), cpo = col_(h, ['po', '차순']), crel = col_(h, ['차수', '출시']);
    var cst = col_(h, 'styleno'), cnm = col_(h, 'description', '품명'), ccol = -1;
    for (var i = 0; i < h.length; i++) { var t = nz_(h[i]); if (t === 'color' || t === '색상' || t === '컬러') { ccol = i; break; } }
    var cbc = col_(h, '바코드'), cdue = col_(h, ['협력사', '예정']), cse = col_(h, 'season', '시즌');
    var ccost = -1;
    for (var x = 0; x < h.length; x++) { if (h[x].indexOf('최종원가') >= 0 && h[x].indexOf('미포함') >= 0) { ccost = x; break; } }
    var runs = sizeRuns_(h, cst >= 0 ? cst : 0);
    var sizes = runs.length ? runs[0] : [], inSizes = runs.length > 1 ? runs[1] : [];
    for (var k = hiA + 1; k < R.length; k++) {
      var r = R[k], st = r[cst] || '';
      if (!ITEM_RE.test(st)) continue;
      var colr = ccol >= 0 ? (r[ccol] || '') : '';
      var nz = [];
      sizes.forEach(function (sz) { var q = int_(r[sz[0]]); if (q) nz.push([sz[1], q]); });
      var bcs = String(cbc >= 0 ? r[cbc] : '').split(/[\r\n,;/ ]+/).filter(String);
      var cost = ccost >= 0 ? int_(r[ccost]) : 0;
      var got = {};
      inSizes.forEach(function (sz) { var v = int_(r[sz[0]]); if (v) got[sz[1]] = v; });
      nz.forEach(function (p, idx) {
        out.push({
          tab: tab, brand: brand, factory: cf >= 0 ? r[cf] : '', po: cpo >= 0 ? r[cpo] : '',
          release: (crel >= 0 ? r[crel] : '').replace(/\n/g, ' '), style: st, name: cnm >= 0 ? r[cnm] : '',
          color: colr.replace(/\n/g, ' '), cc: colcode_(colr), size: p[0], qty: p[1],
          barcode: bcs[idx] || '', cost: cost, due: cdue >= 0 ? excelDate_(r[cdue]) : '',
          season: cse >= 0 ? String(r[cse]).toUpperCase() : '', sheet_in: got[p[0]] || 0
        });
      });
    }
  } else if (hiB >= 0) {
    var h2 = R[hiB], SR = hiB > 0 ? R[hiB - 1] : [];
    var cst2 = col_(h2, '품번'), cnm2 = col_(h2, '상품명'), ccol2 = col_(h2, '컬러명'), ccc = col_(h2, '컬러코드');
    var cf2 = col_(h2, '생산처'), crel2 = col_(h2, '발매일'), cpo2 = col_(h2, '차수'), cdue2 = col_(h2, '실납기', ['목표', '납기']);
    var ccost2 = col_(h2, ['확정원가', 'vat-'], ['확정원가', '미포함'], ['사입가', 'vat-'], ['원가', 'vat-']);
    var cbc2 = col_(h2, 'upc', '바코드');
    var runs2 = sizeRuns_(SR, 0), sizes2 = runs2.length ? runs2[0] : [];

function nvend_(t) { return s_(t).replace(/\(주\)|주식회사|㈜|\s+/g, '').toLowerCase(); }

/** 이미 저장된 옛 key 도 같은 모양으로 편다 (건 시트의 «차수» 칸) */

function apiFromLs(ym, key, wh, date) {

    var row = { id: kid.length === 1 ? kid[0] : (kid.length + '건'), ids: kid, '출고일': '',
      '출고처': e.vendor, item: e.item, act: e.act, sewon: sq, diff: sq - e.act, found: found, sizes: e.sizes };
    if (row.diff !== 0 || !found) ok = false;
    out.push(row);
  });

  // ERP에만 있고 검수에 없는 품번 — 빠뜨린 검수를 드러낸다
  Object.keys(sewon).forEach(function (k) {
    if (mine[k]) return;
    var p2 = k.split('\t');
    ok = false;
    out.push({ id: '검수 없음', ids: [], '출고일': '', '출고처': p2[0], item: p2[1],
               act: 0, sewon: sewon[k], diff: sewon[k], found: true, sizes: [] });
  });
  var miss = out.filter(function (r) { return !r.found; });
  var bad = out.filter(function (r) { return r.found && r.diff; });
  var d5 = [];
  if (miss.length) d5.push('검수는 끝냈는데 ERP에 등록이 안 된 품번이 ' + miss.length + '개 있습니다 ('
    + miss.slice(0, 5).map(function (r) { return r.item; }).join(', ') + (miss.length > 5 ? ' 외' : '')
    + ') — ERP에 입고 등록을 요청하고, 등록되면 ③ ERP 입고현황 올리기 에서 파일을 다시 올리세요');
  if (bad.length) d5.push('검수 수량과 ERP 수량이 다른 품번이 ' + bad.length + '개 있습니다 ('
    + bad.slice(0, 5).map(function (r) { return r.item + ' ' + (r.diff > 0 ? 'ERP이 +' : 'ERP이 ') + r.diff; }).join(', ')
    + (bad.length > 5 ? ' 외' : '') + ') — ④ 검수↔ERP 대사 에서 그 품번을 열어, 검수를 빠뜨린 건이 있는지·실입고 수량이 맞는지 보세요');
  var detail = d5.length ? d5.join(' · ')
    : ('검수 «확인 완료» ' + Object.keys(ids).length + '건이 ERP 등록과 수량까지 다 맞습니다 (출고처×품번 ' + out.length + '개)');
  return { ok: ok, rows: out, detail: detail, n: out.length, miss: miss.length, bad: bad.length };
}

/* ──────────────────────────────────────────── 화면이 부르는 API */

function closeMonths_() {
  var y = {};
  rows_(SH.RMETA).forEach(function (r) { if (r.ym) y[String(r.ym)] = 1; });
  rows_(SH.REC).forEach(function (r) { if (r.ym) y[String(r.ym)] = 1; });
  return Object.keys(y).sort();
}

/** 마감 화면 진입 — 1,002행을 다 보내지 않고 요약·검증·비용·피벗만 */
function apiClose(ym) {
  var t0 = Date.now();
  ym = ym || defaultYm_();
  var w = who_();
  // 무거운 건 다 같은 값이다 — 사람마다 다른 건 me·canFin 뿐이라 캐시 뒤에 덧입힌다
  var hit = cacheGetBig_('close:' + ym);
  if (hit) {
    hit.me = w; hit.canFin = can_('재무'); hit.cached = true; hit.ms = Date.now() - t0;
    hit.canUp = can_('재무') || can_('생산'); hit.canCost = hit.canUp;
    Logger.log('apiClose ' + ym + ' — 캐시 · ' + hit.ms + 'ms');
    return hit;
  }
  // canFin = 확정·전송처럼 되돌리기 어려운 것. canCost = 부대비용·환율처럼 브랜드 안에서 끝나는 것.
  var base = { me: w, ym: ym, months: closeMonths_(), canFin: can_('재무'),
               canUp: can_('재무') || can_('생산'), canCost: can_('재무') || can_('생산'),
               types: COST_TYPES, scopes: SCOPES, bases: BASES, has_receipt: false };
  var C = closeCompute_(ym);
  if (!C) {
    base.parts = [];
    base.depts = deptProgress_(ym, []);
    base.steps = stepState_(ym, base, null);
    base.history = history_(ym, 20);
    base.options = { groups: [], vendors: [], items: [], hs: hsOf_(),
                     uni_n: Object.keys(unipassOf_(ym)).length,
                     key030: !!unipassKey_('API030'), key012: !!unipassKey_('API012') };
    base = pure_(base);
    cachePutBig_('close:' + ym, base);
    base.me = w; base.ms = Date.now() - t0;
    return base;
  }
  var byLine = allocByLine_(C.alloc);
  // 부대비용을 넣는 폼이 ⑥ 으로 옮겨 왔다 — 붙일 묶음 목록을 여기서 같이 내린다.
  // 수불부(apiStock)와 같은 함수라 분모가 갈라지지 않는다.
  base.grps = costGroups_(C);
  // 계산서엔 B/L 이 안 적혀 오지만 «작성일 ↔ 신고일·수리일» 은 맞는다.
  // 그 대응을 화면이 쓸 수 있게 같이 내린다.
  base.uni = rows_(SH.UNI).filter(function (r) { return ymOf_(r.ym) === ym; }).map(function (r) {
    var bl = String(r['HBL'] || '').trim().toUpperCase();
    var gs = [];
    rows_(SH.FX).forEach(function (f) {
      if (ymOf_(f.ym) !== ym) return;
      if (String(f['BL'] || '').trim().toUpperCase() !== bl) return;
      var g = String(f['입고묶음'] || '').trim();
      if (g) gs.push(g);
    });
    return { no: String(r['신고번호'] || ''), bl: bl, grps: gs,
             decl: dOf_(r['신고일자']), done: dOf_(r['수리일자']) };
  });

  // 피벗: 입고처 × (수량·기준금액·부대비용·취득원가)
  var PV = {};
  C.lines.forEach(function (l) {
    var p = PV[l.vendor] || (PV[l.vendor] = { qty: 0, base: 0, oh: 0, amt_pre: 0, lines: 0, items: {}, unres: 0 });
    p.qty += l.qty; p.base += l.base; p.oh += (byLine[l.id] || 0); p.amt_pre += l.amt_pre; p.lines++;
    p.items[l.item] = 1;
    if (l.base_src === '미확정') p.unres++;
  });
  var pivot = Object.keys(PV).sort().map(function (v) {
    var p = PV[v];
    return { vendor: v, qty: p.qty, base: p.base, oh: p.oh, landed: p.base + p.oh, amt_pre: p.amt_pre,
             lines: p.lines, items: Object.keys(p.items).length, unres: p.unres };
  });

  // 수입 묶음 카드 (환율·B/L 입력 자리)
  var G = impGroups_(C.lines), FX = fxOf_(ym);
  var cards = Object.keys(G).sort().map(function (k) {
    var g = G[k], f = FX[k] || {};
    var un = 0;
    C.lines.forEach(function (l) { if (l.grp === k && l.base_src === '미확정') un++; });
    return { grp: k, ymd: g.ymd, usd: g.usd, qty: g.qty, vendors: Object.keys(g.vendors).sort(),
             items: Object.keys(g.items).sort(), mode: f.mode || '', rate: f.rate || null,
             src: f.src || '', bl: f.bl || '', memo: f.memo || '', unres: un };
  });

  var checks = C.checks.slice();
  var RC = null;
  if (listRecv_(ym).length) {
    RC = recvReconcile_(ym, C.lines);
    if (RC.n) checks.push({ id: 'V5', name: '입고 검수 ↔ ERP: 확인 완료 건의 실입고 = ERP 등록', ok: RC.ok, detail: RC.detail });
  }

  base.has_receipt = true;
  base.meta = { file: C.meta.file, at: C.meta.at, sizes: C.meta.size_labels.length };
  base.summary = C.summary;
  base.checks = checks;
  base.costs = C.costs.map(function (c) {
    var m = C.cmeta[c.id];
    return { id: c.id, type: c.type, amount: c.amount, supplier: c.supplier, inv: c.inv, scope: c.scope,
             scope_val: c.scope_val, exclude: c.exclude, include: c.include, basis: c.basis, doc: c.doc,
             date: c.date, memo: c.memo, targets: m.targets, allocated: m.allocated, ok: m.ok,
             basis_used: m.basis_used, issues: m.issues, direct: C.direct[c.id] || {} };
  });
  base.pivot = pivot;
  base.cards = cards;
  base.recon = RC;
  base.parts = C.meta.parts || [];
  base.depts = deptProgress_(ym, C.lines);
  var cst = closeState_(ym);
  base.state = cst ? '확정' : '';
  base.closed = cst;                       // 언제·누가·몇 행 보냈는지
  base.steps = stepState_(ym, base, C);
  base.history = history_(ym, 20);
  var gs = {}, vs = {}, its = {};
  C.lines.forEach(function (l) { gs[l.grp] = 1; vs[l.vendor] = 1; its[l.item] = 1; });
  base.options = { groups: Object.keys(gs).sort(), vendors: Object.keys(vs).sort(), items: Object.keys(its).sort(),
                   hs: hsOf_(), uni_n: Object.keys(unipassOf_(ym)).length,
                   key030: !!unipassKey_('API030'), key012: !!unipassKey_('API012') };
  base = pure_(base);
  cachePutBig_('close:' + ym, base);
  base.me = w; base.ms = Date.now() - t0;
  Logger.log('apiClose ' + ym + ' — 새로 계산 · ' + base.ms + 'ms');
  return base;
}

/** 드릴다운 — 한 입고처(또는 묶음/품번)의 행만 */
function apiCloseLines(ym, by, val) {

/** ERP 입고현황 업로드 — 본부(브랜드) 단위로 자기 몫만 갈아끼운다 */
/** 확정한 달은 못 고친다 — 고치면 Baserow 로 보낸 숫자와 조용히 갈라진다 */
function frozen_(ym) {
  if (closeState_(ym))
    throw new Error(ym + ' 은 이미 확정한 달이라 숫자를 고칠 수 없습니다. '
      + '고치려면 ⑦ 검증 후 확정 에서 «확정 해제» 를 먼저 누르고, 고친 뒤 다시 확정하세요. (확정 해제는 재무 담당자만 할 수 있습니다)');
}

function apiCloseUpload(ym, name, b64, mime) {
  frozen_(ym);
  if (!can_('재무') && !can_('생산'))
    throw new Error('③ ERP 입고현황 올리기 는 재무·생산 담당자만 할 수 있습니다. ' + '재무·생산 담당자에게 부탁하거나, 재무팀에 권한 등록을 요청하세요. (지금 내 권한: ' + who_().role + ')');
  var sheets = readWorkbook_(b64, name, mime);
  var P = parseReceipt_(sheets, ym);           // 월·헤더·합계행 검증은 여기서 끝난다

  // 이 파일이 담고 있는 브랜드
  var inFile = {}, order = [];
  P.lines.forEach(function (l) {
    var b = brandOf_(l.item);
    if (!inFile[b]) { inFile[b] = { n: 0, qty: 0, amt: 0, pre: 0, imp: 0, sizes: [] }; order.push(b); }
    var e = inFile[b];
    e.n++; e.qty += l.qty; e.amt += l.amt_ipgo; e.pre += l.amt_pre; e.imp += l.amt_imp;
    l.sizes.forEach(function (s) { e.sizes[s[0]] = (e.sizes[s[0]] || 0) + s[1]; });
  });
  order.sort();

  // 겹치는 조각이 이 파일 밖의 브랜드도 담고 있으면 거부 — 지우면 남의 것이 날아간다
  var parts = rparts_(ym), clash = [];
  parts.forEach(function (p2) {
    var bs = String(p2.brand || '').split('+').filter(String);
    var hit = bs.filter(function (b) { return inFile[b]; });
    if (!hit.length) return;
    var extra = bs.filter(function (b) { return !inFile[b]; });
    if (extra.length) clash.push({ file: p2.file, at: p2.at, who: p2.who, hit: hit, extra: extra });
  });
  if (clash.length) {
    var c = clash[0];
    throw new Error(c.hit.join('·') + ' 는 ' + c.at + ' 에 ' + (c.who || '누군가') + ' 가 올린 «' + c.file
      + '» 안에 ' + c.extra.join('·') + ' 와 한 파일로 들어 있습니다 — 지금 파일만 올리면 ' + c.extra.join('·') + ' 가 같이 날아갑니다. '
      + '③ ERP 입고현황 올리기 의 «올린 조각» 에서 «' + c.file + '» 조각을 지우고 다시 올리거나, '
      + c.hit.join('·') + '·' + c.extra.join('·') + ' 가 다 든 파일을 통째로 올려 주세요.');
  }

  var lock = LockService.getScriptLock();
  lock.waitLock(60000);
  var before = 0, keepN = 0;
  try {
    // 이 파일이 담은 브랜드의 기존 행만 걷어낸다
    var keep = rows_(SH.RCPT).filter(function (r) {
      if (ymOf_(r.ym) !== ymOf_(ym)) return true;
      var b = brandOf_(r.item);
      if (inFile[b]) { before += ai_(r.amt_ipgo); return false; }
      keepN++;
      return true;
    });
    var add = P.lines.map(function (l) {
      return { ym: ym, id: '', ymd: l.ymd, vendor: l.vendor, ipgo_no: l.ipgo_no, item: l.item, name: l.name,
               color: l.color, buy: l.buy, work: l.work, note: l.note, logi: l.logi, first_ymd: l.first_ymd,
               qty: l.qty, unit_ipgo: l.unit_ipgo, unit_pre: l.unit_pre, unit_imp: l.unit_imp,
               amt_ipgo: l.amt_ipgo, amt_pre: l.amt_pre, amt_imp: l.amt_imp, sizes: JSON.stringify(l.sizes) };
    });
    replaceAll_(SH.RCPT, keep.concat(add));

    // 조각 메타 — 이 파일이 담은 브랜드의 옛 조각을 버리고 새로 하나
    var km = rows_(SH.RMETA).filter(function (r) {
      if (ymOf_(r.ym) !== ymOf_(ym)) return true;
      return !String(r['브랜드'] || '').split('+').some(function (b) { return inFile[b]; });
    });
    var foot = { qty: 0, amt_pre: 0, amt_ipgo: 0, amt_imp: 0, sizes: [] };
    order.forEach(function (b) {
      var e = inFile[b];
      foot.qty += e.qty; foot.amt_pre += e.pre; foot.amt_ipgo += e.amt; foot.amt_imp += e.imp;
      e.sizes.forEach(function (v, k) { foot.sizes[k] = (foot.sizes[k] || 0) + (v || 0); });
    });
    for (var k = 0; k < P.size_labels.length; k++) if (foot.sizes[k] === undefined) foot.sizes[k] = 0;
    foot.amt_imp = bround_(foot.amt_imp * 100) / 100;
    km.push({ ym: ym, '브랜드': order.join('+'), '행수': P.lines.length, '수량': foot.qty,
              '입고금액': foot.amt_ipgo, '사전원가': foot.amt_pre,
              '사이즈열': JSON.stringify(P.size_labels), '합계행': JSON.stringify(P.foot),
              '파일': name, '적재시각': Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm'),
              '적재자': who_().name || who_().email });
    replaceAll_(SH.RMETA, km);
  } finally { lock.releaseLock(); }

  var d = foot.amt_ipgo - before;
  log_('ERP적재', order.join('+'), name + ' ' + P.lines.length + '행', ym,
       '입고금액 ' + (d >= 0 ? '+' : '') + fmt_(d));
  bust_(ym);   // 이걸 빠뜨려서, 올리고도 25분 동안 «입고현황이 없습니다» 가 떴다
  return { ok: true, rows: P.lines.length, qty: foot.qty, amt: foot.amt_ipgo,
           brands: order, replaced: before ? true : false, kept: keepN };
}

/** 조각 하나를 지운다 (잘못 올린 것 되돌리기) */
function apiClosePartDelete(ym, brandKey) {

  var bs = String(brandKey || '').split('+').filter(String);
  if (!bs.length) throw new Error('지울 조각을 아직 안 골랐습니다 — ③ ERP 입고현황 올리기 의 «올린 조각» 목록에서 지울 조각을 먼저 고르세요.');
  var hit = {};

  }));

}

/** 유니패스 수입신고 실적 업로드 */
function apiUnipassUpload(ym, name, b64, mime) {
