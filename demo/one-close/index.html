/** 계산서 작성일로 어느 입고묶음인지 짚어 본다.
    계산서엔 B/L 이 안 적혀 오지만(비고는 «수입»·«국제특송화물 운송요금» 뿐),
    작성일이 유니패스 신고일·수리일과 맞는 일이 많다. 맞으면 그 신고의 B/L 에 붙은 묶음이다.
    안 맞으면 아무것도 고르지 않는다 — 날짜로 찍으면 틀리는 건이 실제로 있다. */
/** 같은 공급자가 이 달에 이미 붙인 묶음 */
function cfUsedBy(sup){
  var out={};
  ((S.close&&S.close.costs)||[]).forEach(function(c){
    if(String(c.supplier||'')!==String(sup||'')) return;
    String(c.scope_val||'').split(';').forEach(function(g){ g=g.trim(); if(g) out[g]=c.id; });
  });
  return out;
}
/** 이 달 수입 묶음 */
function cfImpGrps(){
  return cfGrps().filter(function(g){ return g.imp>0; }).map(function(g){ return g.grp; });
}
/** 날짜로 못 짚었을 때 — 같은 공급자가 안 쓴 수입 묶음이 «하나만» 남으면 그것이다. */
function cfGuessLeft(sup){
  if(!sup) return null;
  var used=cfUsedBy(sup), usedN=Object.keys(used).length;
  if(!usedN) return null;                       // 이 달에 붙인 적이 없으면 짚지 않는다
  var imp=cfImpGrps();
  var left=imp.filter(function(g){ return !used[g]; });
  if(left.length!==1) return null;              // 둘 이상 남으면 고르는 것은 사람 몫
  return { grps:left, sup:sup, used:Object.keys(used), impN:imp.length, kind:'left' };
}

function cfGuess(ymd){
  var U=(S.close&&S.close.uni)||[];
  if(!ymd || !U.length) return null;
  var best=null;
  U.forEach(function(u){
    if(!(u.grps||[]).length) return;
    [['수리일',u.done],['신고일',u.decl]].forEach(function(x){
      if(!x[1]) return;
      var gap=Math.round(Math.abs(new Date(ymd)-new Date(x[1]))/86400000);
      if(isNaN(gap)) return;
      if(!best || gap<best.gap) best={ gap:gap, kind:x[0], day:x[1], u:u };
    });
  });
  // 하루를 넘으면 짚지 않는다. 사흘까지 봤더니 7/31 월말 청구분 셋을 전부 260729 로 잘못 집었다 —
  // 그중 448,708 의 정답은 260703 이고, 부르고·씨앤케이는 국내 운송료라 붙을 자리가 없다.
  if(!best || best.gap>1) return null;
  return { grps:best.u.grps, bl:best.u.bl, gap:best.gap, no:best.u.no,
    kind:best.kind, day:best.day, ymd:ymd };
}
function cfPick(){
  var A=cfState(), q=String(A.gq||"").trim().toUpperCase();
  return cfGrps().filter(function(g){
    if(A.sel[g.grp]) return true;            // 고른 것은 늘 보인다 — 안 보이면 못 푼다
    if(A.imp && !g.imp) return false;
    if(!q) return true;
    return String(g.grp).toUpperCase().indexOf(q)>=0 || String(g.ven||"").toUpperCase().indexOf(q)>=0;
  });
}
function cfList(){
  var A=cfState(), gs=cfGrps(), L=cfPick();
  if(!gs.length) return '<span class="hint">이 달엔 붙일 입고 묶음이 <b>하나도 없습니다</b> — '
    + '③ 에서 ERP 입고현황을 먼저 올려야 이 목록이 생깁니다.</span>';
  if(!L.length)  return '<span class="hint">찾는 묶음이 없습니다 — 「수입만」 을 꺼 보세요.</span>';
  return L.map(function(g){
    return '<button class="gi'+(A.sel[g.grp]?" on":"")+'" data-cag="'+esc(g.grp)+'">'
      + '<span>'+esc(g.grp)+'</span>'
      + '<span class="q">'+fmt(g.qty)+'개 · '+fmt(g.n)+'줄'+(g.imp?" · 수입":"")+'</span></button>';
  }).join("");
}
function cfPrev(){
  var A=cfState(), q=0, n=0;
  cfGrps().forEach(function(g){ if(A.sel[g.grp]){ q+=g.qty; n++; } });
  if(!n) return '<span class="hint">아직 고른 묶음이 없습니다 — 위 목록에서 <b>이 돈이 붙을 입고 묶음</b> 을 누르세요. '
    + '고르면 여기에 «개당 얼마» 가 나옵니다.</span>';
  if(!A.amt) return '<span class="hint">묶음 '+fmt(n)+'개 · 수량 '+fmt(q)+'개 — 금액을 넣으면 개당이 보입니다</span>';
  return '<span>묶음 <b>'+fmt(n)+'</b>개</span><span>수량 <b>'+fmt(q)+'</b>개</span>'
    + '<span>→ 개당 <b style="color:var(--acc)">'+fmt(A.amt/q)+'</b>원</span>'
    + '<span class="hint">'+fmt(A.amt)+' ÷ '+fmt(q)+'</span>';
}
/** 입력 중에 화면을 다시 그리면 한글이 깨진다 — 미리보기 칸만 갈아 끼운다 */
function cfTouch(){
  var e=$("caPrev"); if(e) e.innerHTML=cfPrev();
  var n=$("caGn"); if(n){ var L=cfPick().length, T=cfGrps().length;
    n.textContent = (L===T)? (T+"개") : (L+" / "+T+"개"); }
}
function cfRelist(){
  var e=$("caGl"); if(!e) return;
  e.innerHTML=cfList();
  e.querySelectorAll("[data-cag]").forEach(function(b){
    b.onclick=function(){
      var g=b.getAttribute("data-cag"), A=cfState();
      A.sel[g]=!A.sel[g];
      b.className="gi"+(A.sel[g]?" on":"");
      cfTouch();
    };
  });
  cfTouch();
}

/** 홈택스 후보 — 누르면 유형·금액·공급자·증빙이 채워진다 */
function cfHtLoad(){
  if(S.htBusy) return;
  if(S.ht && S.ht.ym===S.ym) return;
  S.htBusy=true;
  run("apiHometaxCand",[S.ym],function(d){
    run("apiHometaxUsed",[S.ym],function(u){
      d.used=(u&&u.used)||{}; S.ht=d; S.htBusy=false; paintCost();
    },function(){ d.used={}; S.ht=d; S.htBusy=false; paintCost(); });
  },function(msg){
    S.ht={ ym:S.ym, rows:[], skipped:[], used:{}, why:String(msg) };
    S.htBusy=false; paintCost();
  });
}
function cfHtBox(){
  var d=S.ht;
  if(S.htBusy) return '<div class="htbox"><div class="hth"><b>홈택스 후보</b> <span class="hint">불러오는 중…</span></div></div>';
  if(!d || d.ym!==S.ym) return "";
  var h='<div class="htbox"><div class="hth"><b>홈택스에서 받아 온 것</b>';
  if(d.why) return h+'<span class="hint">'+esc(d.why)+'</span></div></div>';
  h+='<span class="hint">'+fmt(d.rows.length)+'건'
    + (d.at? " · "+esc(String(d.at).slice(0,10)):"")
    + (d.total? " · 이 달 매입계산서 "+fmt(d.total)+"건 중":"")+'</span>'
    + '<span class="hint" style="margin-left:auto">누르면 아래 칸이 채워집니다 — 묶음만 고르세요</span></div>';
  if(!d.rows.length) return h+'<div class="htl"><span class="hint">이 달엔 운임·통관수수료로 잡힌 계산서가 '
    + '<b>한 건도 없습니다</b>. 홈택스 수집기가 매일 새벽 받아 오므로, 계산서가 어제 발행됐다면 내일 아침에 뜹니다. '
    + '급하면 아래 칸에 유형·금액·공급자·증빙을 직접 쳐 넣어도 됩니다.</span></div></div>';
  h+='<div class="htl">';
  d.rows.forEach(function(r,i){
    var done=!!d.used[r.id];
    h+='<button class="hti'+(done?" done":"")+'" data-cht="'+i+'"'+(done?" disabled":"")+'>'
      + '<span class="d">'+esc(r.ymd)+'</span><span class="t">'+esc(r.type)+'</span>'
      + '<span class="s">'+esc(r.sup)+(r.item?(" · "+esc(r.item)):"")+'</span>'
      + '<span class="v">'+fmt(r.amt)+'</span>'
      + (done?'<span class="chk">넣었음 '+esc(d.used[r.id])+'</span>':"")+'</button>';
  });
  h+="</div>";
  if(d.skipped && d.skipped.length)
    h+='<div class="hth" style="border-top:1px solid var(--line);border-bottom:0">'
      + '<span class="hint">일부러 뺀 것 '+d.skipped.length+'건 — '+esc(d.skipped[0].why||"")+'</span></div>';
  return h+"</div>";
}

function paintCost(){
  var wrap=$("costWrap"); if(!wrap) return;
  if(!S.costOpen){ wrap.innerHTML=""; return; }
  var A=cfState(), d=S.close;
  cfHtLoad();
  var h=cfHtBox()
    + '<div class="addbox"><div class="addh">부대비용 넣기'
    + '<span class="hint" style="font-weight:400">수량비례 · 재고원가로 들어갑니다</span>'
    + '<button class="btn sm" id="caX" style="margin-left:auto">닫기</button></div>';
  if(d.closed) h+='<div class="addmsg bad" style="padding:9px 11px">'+esc(d.ym)
    + ' 은 확정된 달입니다 — ⑦ 에서 «확정 해제» 를 먼저 눌러야 넣을 수 있습니다.</div>';
  h+='<div class="addf">'
    + '<label>유형<select id="caType">'+(d.types||[]).map(function(t){
        return '<option'+(t===A.type?" selected":"")+'>'+esc(t)+'</option>'; }).join("")+'</select></label>'
    + '<label>금액<input type="text" id="caAmt" class="amt" inputmode="numeric" value="'+esc(A.amtTxt||"")+'" placeholder="0"></label>'
    + '<label>공급자<input type="text" id="caSup" value="'+esc(A.sup||"")+'" placeholder="바롬로지스틱스"></label>'
    + '<label>증빙<input type="text" id="caDoc" value="'+esc(A.doc||"")+'" placeholder="세금계산서 번호 · B/L"></label>'
    + '</div>';
  h+='<div class="gsel"><div class="hint" style="display:flex;gap:7px;align-items:center;margin:0 0 5px;flex-wrap:wrap">'
    + '<span>어느 입고 묶음에 붙일까 <span class="hint">— 수량은 배부 대상(반품 제외)입니다</span></span>'
    + '<input type="text" id="caGq" value="'+esc(A.gq||"")+'" placeholder="입고처로 찾기" '
    + 'style="font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line-2);background:var(--surf);color:var(--ink);width:150px">'
    + '<button class="btn sm'+(A.imp?" go":"")+'" id="caImp">수입만</button>'
    + '<span id="caGn" class="hint"></span></div>'
    + '<div class="gl" id="caGl">'+cfList()+'</div></div>';
  h+='<div class="vrow" style="background:var(--warn-soft);color:var(--warn)"><span class="vmk no">!</span>'
    + '<span><b>묶음은 날짜로 고르면 틀립니다.</b> 7월 바롬 계산서는 7/28자가 260729 묶음에, 7/31자가 260703 묶음에 붙었습니다.'
    + '<br>근거로 쓸 것 — ⑤ 에서 확정된 B/L↔묶음 대응, 통관수수료의 품목명, 수리일자.</span><span></span></div>';
  h+=cfWhyBox();
  h+='<div class="addprev" id="caPrev">'+cfPrev()+'</div>';
  h+='<div class="addft"><button class="btn go" id="caSave">넣기</button>'
    + '<span class="addmsg'+(A.msgKind?(" "+A.msgKind):"")+'" id="caMsg">'+esc(A.msg||"")+'</span></div></div>';
  wrap.innerHTML=h;

  $("caX").onclick=function(){ S.costOpen=false; paintCost(); };
  wrap.querySelectorAll("[data-cht]").forEach(function(b){
    b.onclick=function(){
      var r=(S.ht&&S.ht.rows||[])[+b.getAttribute("data-cht")]; if(!r) return;
      var A2=cfState();
      A2.type=r.type; A2.amt=Number(r.amt)||0; A2.amtTxt=fmt(A2.amt);
      A2.sup=r.sup||""; A2.doc=r.id||"";
      var g=cfGuess(r.ymd) || cfGuessLeft(r.sup);
      A2.sel={}; A2.why=g||null; A2.whyRow=r;
      if(g){ g.grps.forEach(function(n){ A2.sel[n]=true; }); A2.msg=''; A2.msgKind=''; }
      else { A2.msg=''; A2.msgKind=''; }
      paintCost();
    };
  });
  $("caImp").onclick=function(){ cfState().imp=!cfState().imp; cfRelist();
    $("caImp").className="btn sm"+(cfState().imp?" go":""); };
  $("caType").onchange=function(){ cfState().type=this.value; };
  $("caSup").oninput=function(){ cfState().sup=this.value; };
  $("caDoc").oninput=function(){ cfState().doc=this.value; };
  $("caGq").oninput=function(){ cfState().gq=this.value; cfRelist(); };
  $("caAmt").oninput=function(){
    var A3=cfState();
    A3.amtTxt=this.value;
    A3.amt=Number(String(this.value).replace(/[^0-9.-]/g,""))||0;
    cfTouch();
  };
  cfRelist();
  $("caSave").onclick=cfSave;
}

function cfSave(){
  var A=cfState();
  var sel=Object.keys(A.sel).filter(function(g){ return A.sel[g]; });
  var say=function(m,k){ var e=$("caMsg"); if(e){ e.textContent=m; e.className="addmsg"+(k?(" "+k):""); }
                         A.msg=m; A.msgKind=k||""; };
  if(!A.amt){ say("금액을 넣어 주세요 — 계산서의 공급가액을 숫자로.","bad"); return; }
  if(!sel.length){ say("붙일 입고 묶음을 고르세요.","bad"); return; }
  var done=btnGo($("caSave"),"넣는 중…");
  run("apiCostSave",[S.ym,{
      "비용유형":A.type, "금액":A.amt, "귀속":"재고원가", "배부기준":"수량비례",
      "배부범위":"입고묶음", "범위값":sel.join(";"),
      "공급자":A.sup||"", "증빙번호":A.doc||"" },[]],
    function(r){
      done();
      // 같은 계산서에서 잇달아 넣는 일이 많다 — 유형·공급자·증빙은 남기고 금액·묶음만 비운다
      S.cost={ ym:A.ym, type:A.type, sup:A.sup, doc:A.doc, amt:0, amtTxt:"",
               sel:{}, gq:A.gq, imp:A.imp, msg:"넣었습니다", msgKind:"ok" };
      // 지금 넣은 증빙을 «넣었음» 으로 바로 표시한다 — 후보를 통째로 다시 받지 않는다
      if(S.ht && S.ht.used && A.doc && r && r.costs){
        r.costs.forEach(function(c){ if(c.doc===A.doc) S.ht.used[A.doc]=c.id; });
      }
      useClose(r);
    },
    function(m){ done(); say(String(m),"bad"); });
}
</script>

#pStock .drw{border:1px solid var(--line);margin:11px 0 0}
#pStock .drwh{display:block;width:100%;text-align:left;font:inherit;font-size:13px;padding:8px 11px;
  background:var(--surf-2);border:0;color:var(--ink);cursor:pointer;border-radius:0}
#pStock .drwh:hover{background:var(--surf-3)}
#pStock .drwb{padding:11px;border-top:1px solid var(--line)}
#pStock tr.dsep td{background:var(--surf-3);font-weight:700;font-size:12px;padding:3px 8px;color:var(--ink-3)}
#pStock tr.sel td{background:var(--acc-soft)!important;box-shadow:inset 2px 0 0 var(--acc)}
#pStock .hmc{text-align:right;font-family:Consolas,monospace;font-size:12px;font-variant-numeric:tabular-nums}
#pStock .lockbar{display:flex;gap:8px;align-items:center;background:var(--acc-soft);
  border:1px solid var(--acc);padding:5px 10px;margin-bottom:9px;font-size:12.5px;color:var(--acc)}
#pStock .lockbar button{margin-left:auto}

/* 이 화면이 무엇을 보는 곳인지 — 맨 위 한 줄 */
#pStock .kwhat{font-size:12.5px;color:var(--ink-2);line-height:1.7;margin:0 0 10px;
  padding:9px 12px;background:var(--surf-2);border-left:3px solid var(--acc)}
#pStock .kwhat b{color:var(--ink)}

/* 근거 카드 — 읽는 순서를 깔아 주는 말 */
#pStock .whysub{padding:7px 11px 0;font-size:12px;color:var(--ink-3);line-height:1.6}
#pStock .eqsay{padding:10px 11px 0;font-size:12.5px;color:var(--ink-2)}
#pStock .eqsay b{color:var(--ink)}
#pStock .whycap{margin:14px 0 5px;font-size:12.5px;font-weight:700}
#pStock .whycap .hint{font-weight:400}

/* 오래 걸리는 일 — 그 자리에서 돈다. 경과 초는 세지 않는다. */
#pStock{position:relative}
#pStock .kover{position:absolute;left:0;top:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:center;align-items:flex-start;padding-top:52px}
#pStock .kover:before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;
  background:var(--surf);opacity:.9}
#pStock .kbusy{position:relative;border:1px solid var(--acc);background:var(--surf);
  padding:14px 16px;max-width:520px;margin:16px;box-shadow:0 8px 26px rgba(0,0,0,.13)}
#pStock .kover .kbusy{margin:0}
#pStock .kbh{display:flex;gap:9px;align-items:center;font-size:14px;margin-bottom:10px}
#pStock .kspin{width:15px;height:15px;flex:none;border:2px solid var(--line-2);
  border-top-color:var(--acc);border-radius:50%;animation:kspin .8s linear infinite}
@keyframes kspin{to{transform:rotate(360deg)}}
#pStock .kbar{height:5px;background:var(--surf-3);overflow:hidden;margin-bottom:9px}
#pStock .kbar i{display:block;height:100%;width:34%;background:var(--acc);
  animation:kbar 1.3s ease-in-out infinite}
@keyframes kbar{0%{margin-left:-34%}100%{margin-left:100%}}
#pStock .kbm{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
#pStock .kbm span{font-family:var(--mono);font-size:12px;border:1px solid var(--line);
  background:var(--surf-2);padding:2px 7px;border-radius:2px;color:var(--ink-2)}
#pStock .kbn{font-size:12px;color:var(--ink-3);line-height:1.65}
</style>
<script>
/* ═══════════════════════════════════════ 수불부 「수」
   수불부에 우리가 채우는 칸은 «입고 수량·단가·금액» 셋뿐이다.
   기초는 전월 기말, 출고는 WMS 가 채운다 — 그래서 그 칸들은 회색으로 자리만 둔다.

   서버는 달 단위로만 부른다. 한 번 받은 달은 K.mon 에 쌓아 두고
   기간 좁히기·찾기·서랜 여닫기는 전부 화면에서 한다 — 왕복 한 번이 몇 초라서다. */
var K = { mon:{}, rng:null, q:'', lock:'', bu:'cost', src:'',
          drw:{C:false,B:false,D:false,E:false}, open:false, tmp:null, left:'', pick:0, busy:false, months:null };

function kf(v){ return (v===null||v===undefined||isNaN(v))?'–':Math.round(v).toLocaleString('ko-KR'); }
function kesc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function kYmd(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function kPd(s){ var p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function kAddM(m,n){ var p=m.split('-'), d=new Date(+p[0],+p[1]-1+n,1);
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
function kEom(y,m){ return new Date(y,m,0).getDate(); }
function kDays(a,b){ return Math.round((kPd(b)-kPd(a))/86400000)+1; }
function kMn(m){ return String(+m.slice(5,7))+'월'; }

/** 기간이 걸치는 달 */
function kMonths(){
  var out=[], a=K.rng.from.slice(0,7), b=K.rng.to.slice(0,7), m=a;
  for(var i=0;i<36 && m<=b;i++){ out.push(m); m=kAddM(m,1); }
  return out;
}
/** 아직 안 받은 달 */
function kMissing(){ return kMonths().filter(function(m){ return !K.mon[m]; }); }

/* ── 받아 오기 ─────────────────────────────── */
function kYm(v){ return /^\d{4}-\d{2}$/.test(String(v||'')) ? String(v) : ''; }
function stockBoot(ym){
  ym = kYm(ym) || kYm(curYm()) || kYm(S.ym);
  if(!ym){
    // 달 목록이 아직 안 왔다. 여기서 밀고 나가면 기간이 «-01 ~ -aN» 이 된다.
    $('pStock').innerHTML='<div class="kbusy"><div class="kbh"><span class="kspin"></span>'
      + '<b>어느 달을 볼지 정하는 중…</b></div><div class="kbar"><i></i></div></div>';
    setTimeout(function(){ if(!$('pStock').hidden && !K.rng) stockBoot(''); }, 400);
    return;
  }
  if(!K.rng){
    var p=ym.split('-');
    K.rng={ from:ym+'-01', to:ym+'-'+('0'+kEom(+p[0],+p[1])).slice(-2) };
    K.left=ym;
  }
  stockFetch();
}
/** 위에서 달을 바꾸면 기간을 그 달로 다시 잡는다 */
function stockMonth(ym){
  ym = kYm(ym); if(!ym) return;
  var p=ym.split('-');
  K.rng={ from:ym+'-01', to:ym+'-'+('0'+kEom(+p[0],+p[1])).slice(-2) };
  K.left=ym; K.lock=''; K.open=false; K.tmp=null; K.pick=0;
  if(!$('pStock').hidden) stockFetch();
}
/** 받아 둔 달에 나오는 브랜드 — 위 브랜드 목록이 이것도 담게 한다 */
function kBrands(){
  var b={};
  Object.keys(K.mon).forEach(function(m){
    var d=K.mon[m]; if(!d||!d.items) return;
    Object.keys(d.items).forEach(function(it){ b[d.items[it].br]=1; });
  });
  return Object.keys(b);
}
/* ── 기다리는 동안 ─────────────────────────
   apiStockMulti 는 한 달에 6~8초, 여러 달이면 10초를 넘긴다.
   회색 글자 한 줄이면 «멈췄나» 싶어 새로고침을 눌러 버리고, 그러면 처음부터 다시다.
   그래서 «지금 돌고 있다» 를 눈에 보이게 하고, 무엇을 받는 중인지 달 이름을 적는다.
   경과 초는 세지 않는다 — 세어 보여 주면 기다림이 더 길게 느껴진다. */
function kBusyCard(want){
  var have=Object.keys(K.mon).length;
  return '<div class="kbusy"><div class="kbh"><span class="kspin"></span>'
    + '<b>'+kf(want.length)+'개월치를 서버에서 받아오는 중입니다</b></div>'
    + '<div class="kbar"><i></i></div>'
    + '<div class="kbm">'+want.map(function(m){ return '<span>'+kesc(m)+'</span>'; }).join('')+'</div>'
    + '<div class="kbn">한 달에 6~8초, 여러 달이면 10초가 넘기도 합니다 — 멈춘 것이 아닙니다.<br>'
    + '한 번 받은 달은 다시 받지 않습니다'
    + (have? ' (지금까지 받아 둔 달 '+kf(have)+'개)' : '')
    + ' — 기간을 좁히거나 서랍을 여닫는 것은 기다리지 않아도 됩니다.</div></div>';
}
/** 처음 열 때는 패널이 비어 있으니 통째로. 이미 그려져 있으면 그 자리에 덮는다 —
    보던 것을 지워 버리면 «무엇이 바뀌는 중인지» 를 알 수 없다. */
function kBusy(want){
  var box=$('pStock'); if(!box) return;
  if(!box.querySelector('.ftool')){ box.innerHTML=kBusyCard(want); return; }
  var o=box.querySelector('.kover');
  if(!o){ o=document.createElement('div'); o.className='kover'; box.appendChild(o); }
  o.innerHTML=kBusyCard(want);
}

function stockFetch(then){
  var want=kMissing();
  if(!want.length){ stockRender(); if(then) then(); return; }
  if(K.busy) return;
  K.busy=true;
  kBusy(want.slice(0,6));
  run('apiStockMulti',[want.slice(0,6)],function(res){
    K.busy=false;
    Object.keys(res||{}).forEach(function(m){ K.mon[m]=res[m]; });
    want.slice(0,6).forEach(function(m){ if(!K.mon[m]) K.mon[m]={ items:{}, lots:[], empty:true }; });
    stockRender(); if(then) then();
  },function(msg){
    K.busy=false;
    $('pStock').innerHTML='<div class="note bad">수불부를 못 불러왔습니다 — '+kesc(msg)+'</div>';
  });
}

/* ── 기간 안의 값 ──────────────────────────── */
function kLots(){
  var out=[];
  kMonths().forEach(function(m){
    var d=K.mon[m]; if(!d) return;
    (d.lots||[]).forEach(function(x){
      if(x[1]>=K.rng.from && x[1]<=K.rng.to) out.push(x);
    });
  });
  return out;
}
function kName(it){
  var ms=kMonths();
  for(var i=0;i<ms.length;i++){
    var d=K.mon[ms[i]]; if(d && d.items && d.items[it]) return d.items[it];
  }
  return { nm:'', br:it.slice(0,2) };
}
/** 품번별 집계 — 입고건에서 다시 만든다. 기간이 달 중간에서 끊겨도 맞는다. */
function kItems(){
  var M={};
  kLots().forEach(function(x){
    var e=M[x[0]] || (M[x[0]]={ qty:0,cost:0,oh:0,lots:[],first:'',last:'',units:{} });
    e.qty+=x[3]; e.cost+=x[4]; e.oh+=x[5]; e.lots.push(x);
    if(!e.first||x[1]<e.first) e.first=x[1];
    if(!e.last ||x[1]>e.last ) e.last =x[1];
    if(x[3]) e.units[Math.round(x[4]/x[3])]=1;
  });
  Object.keys(M).forEach(function(k){
    var e=M[k]; e.unit=e.qty?e.cost/e.qty:0; e.uniq=Object.keys(e.units).length;
    e.lots.sort(function(p,q){ return p[1]<q[1]?-1:1; });
  });
  return M;
}
function kHit(it){
  var e=kName(it);
  if(S.br && e.br!==S.br) return false;      // 브랜드는 맨 위 하나를 따른다
  if(K.lock && it!==K.lock) return false;
  var q=K.q.trim().toUpperCase();
  if(!q) return true;
  return it.indexOf(q)>=0 || String(e.nm).toUpperCase().indexOf(q)>=0;
}

/* ── 기간 달력 ─────────────────────────────── */
var KPRE=[
 [['당월','m0'],['이전달','m1'],['전전달','m2'],['올해','y'],['최근 7일','d7'],['최근 30일','d30']],
 [['1분기','q1'],['2분기','q2'],['3분기','q3'],['4분기','q4'],['상반기','h1'],['하반기','h2']],
 [['1월','M1'],['2월','M2'],['3월','M3'],['4월','M4'],['5월','M5'],['6월','M6'],
  ['7월','M7'],['8월','M8'],['9월','M9'],['10월','M10'],['11월','M11'],['12월','M12']]];
function kPreset(k){
  var base=curYm()+'-01', Y=+curYm().slice(0,4);
  if(k==='y') return [Y+'-01-01', Y+'-12-31'];
  if(k[0]==='m'){ var m=kAddM(curYm(),-(+k.slice(1))), p=m.split('-');
    return [m+'-01', m+'-'+('0'+kEom(+p[0],+p[1])).slice(-2)]; }
  if(k[0]==='d'){ var n=+k.slice(1), e=kPd(K.rng.to), s=new Date(e); s.setDate(s.getDate()-n+1);
    return [kYmd(s), K.rng.to]; }
  if(k[0]==='q'){ var q=+k.slice(1), a=(q-1)*3+1;
    return [Y+'-'+('0'+a).slice(-2)+'-01', Y+'-'+('0'+(a+2)).slice(-2)+'-'+kEom(Y,a+2)]; }
  if(k==='h1') return [Y+'-01-01', Y+'-06-30'];
  if(k==='h2') return [Y+'-07-01', Y+'-12-31'];
  if(k[0]==='M'){ var mm=+k.slice(1);
    return [Y+'-'+('0'+mm).slice(-2)+'-01', Y+'-'+('0'+mm).slice(-2)+'-'+kEom(Y,mm)]; }
  return [K.rng.from, K.rng.to];
}
function kCal(m){
  var p=m.split('-'), y=+p[0], mo=+p[1];
  var start=new Date(y,mo-1,1).getDay(), last=kEom(y,mo);
  var a=K.tmp?K.tmp.from:K.rng.from, b=(K.tmp&&K.tmp.to)?K.tmp.to:K.rng.to;
  var have={}; (K.months||[]).forEach(function(x){ have[x]=1; });
  var today=kYmd(new Date());
  var h='<div class="calm"><div class="calg">'
    + ['일','월','화','수','목','금','토'].map(function(d,i){
        return '<div class="cdow'+(i===0?' sun':(i===6?' sat':''))+'">'+d+'</div>'; }).join('');
  for(var i=0;i<start;i++) h+='<div class="cday out">·</div>';
  for(var d=1;d<=last;d++){
    var ds=y+'-'+('0'+mo).slice(-2)+'-'+('0'+d).slice(-2), dow=(start+d-1)%7, cls='cday';
    if(dow===0) cls+=' sun'; else if(dow===6) cls+=' sat';
    if(ds===a||ds===b){ cls+=' pick'; if(ds===a) cls+=' s'; if(ds===b) cls+=' e'; }
    else if(a&&b&&ds>a&&ds<b) cls+=' mid';
    if(K.months && !have[m]) cls+=' nodata';
    if(ds===today) cls+=' today';
    h+='<div class="'+cls+'" data-kd="'+ds+'">'+d+'</div>';
  }
  var tail=(start+last)%7;
  if(tail) for(var t=1;t<=7-tail;t++) h+='<div class="cday out">·</div>';
  return h+'</div></div>';
}
function kRangeBar(){
  var h='<span class="rwrap"><button class="rbtn" data-kopen="1">'
    + '<span class="mono">'+K.rng.from+'</span> ~ <span class="mono">'+K.rng.to+'</span>'
    + '<span class="cd">▾</span></button>';
  if(K.open){
    var a=K.tmp?K.tmp.from:K.rng.from, b=(K.tmp&&K.tmp.to)?K.tmp.to:K.rng.to;
    var r=K.left, r2=kAddM(K.left,1);
    h+='<div class="rpop">'
      + KPRE.map(function(row,i){ return '<div class="prow'+(i===2?' mon':'')+'">'+row.map(function(x){
          return '<button class="pbtn" data-kp="'+x[1]+'">'+x[0]+'</button>'; }).join('')+'</div>'; }).join('')
      + '<div class="calhd">'
        + '<button class="cnav" data-km="-12" title="한 해 앞으로">«</button>'
        + '<button class="cnav" data-km="-1" title="한 달 앞으로">‹</button>'
        + '<div class="calttl"><b>'+r.replace('-','.')+'</b><b>'+r2.replace('-','.')+'</b></div>'
        + '<button class="cnav" data-km="1" title="한 달 뒤로">›</button>'
        + '<button class="cnav" data-km="12" title="한 해 뒤로">»</button></div>'
      + '<div class="cals">'+kCal(r)+kCal(r2)+'</div>'
      + '<div class="rfoot"><span class="hint">'
        + (K.pick===1?'끝나는 날을 고르세요':(a+' ~ '+b+' · '+kDays(a,b)+'일'))+'</span>'
        + '<button class="sm" data-kcancel="1">취소</button>'
        + '<button class="sm pri" data-kok="1">확인</button></div></div>';
  }
  h+='</span>';
  return h;
}

/* ── A · 수불부 양식 ───────────────────────── */
function kTblA(list, M){
  var sq=0, sc=0;
  list.forEach(function(it){ sq+=M[it].qty; sc+=M[it].cost; });
  var h='<div class="scroll" style="max-height:420px"><table><thead>'
    + '<tr><th class="blank"></th><th class="blank"></th><th class="blank"></th>'
      + '<th colspan="2" class="gh">기초</th>'
      + '<th colspan="3" class="gh ours">입고</th>'
      + '<th colspan="2" class="gh">출고</th><th colspan="2" class="gh">기말</th></tr>'
    + '<tr><th>품번</th><th>품명</th><th class="n">입고일</th>'
      + '<th class="n gy">수량</th><th class="n gy">금액</th>'
      + '<th class="n ours">수량</th><th class="n ours">단가</th><th class="n ours">금액</th>'
      + '<th class="n gy">수량</th><th class="n gy">금액</th><th class="n gy">수량</th><th class="n gy">금액</th></tr>'
    + '</thead><tbody>';
  list.slice(0,250).forEach(function(it){
    var e=M[it], nm=kName(it).nm;
    var dc=(e.first===e.last)? e.first : (e.first+' <span class="hint">외 '+(e.lots.length-1)+'건</span>');
    h+='<tr data-ki="'+it+'" style="cursor:pointer"'+(it===K.lock?' class="sel"':'')+'>'
      + '<td class="mono"><b>'+it+'</b></td>'
      + '<td class="hint" style="max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+kesc(nm)+'</td>'
      + '<td class="n mono hint">'+dc+'</td>'
      + '<td class="gy">·</td><td class="gy">·</td>'
      + '<td class="n ours">'+kf(e.qty)+'</td>'
      + '<td class="n ours">'+kf(e.unit)+(e.uniq>1?' <span class="pill bad">'+e.uniq+'값</span>':'')+'</td>'
      + '<td class="n ours"><b>'+kf(e.cost)+'</b></td>'
      + '<td class="gy">·</td><td class="gy">·</td><td class="gy">·</td><td class="gy">·</td></tr>';
  });
  h+='</tbody><tfoot><tr><td colspan="3">'+K.rng.from+' ~ '+K.rng.to+' 합계 ('+kf(list.length)+'품번)</td>'
    + '<td class="gy">·</td><td class="gy">·</td>'
    + '<td class="n ours">'+kf(sq)+'</td><td class="n ours">'+kf(sq?sc/sq:0)+'</td>'
    + '<td class="n ours">'+kf(sc)+'</td>'
    + '<td class="gy">·</td><td class="gy">·</td><td class="gy">·</td><td class="gy">·</td></tr></tfoot></table></div>';
  if(list.length>250) h+='<div class="hint" style="margin-top:6px">위 250품번만 — 찾기나 브랜드로 좁히세요.</div>';
  return h;
}

/* ── C · 입고일 원장 ───────────────────────── */
function kTblC(){
  var q=K.q.trim().toUpperCase();
  var all=kLots().filter(function(x){
    if(S.br && kName(x[0]).br!==S.br) return false;
    if(K.lock && x[0]!==K.lock) return false;
    if(!q) return true;
    return x[0].indexOf(q)>=0 || String(x[2]).toUpperCase().indexOf(q)>=0
        || String(kName(x[0]).nm).toUpperCase().indexOf(q)>=0;
  });
  var srcs={}; all.forEach(function(x){ srcs[x[6]]=(srcs[x[6]]||0)+1; });
  var L=K.src? all.filter(function(x){ return x[6]===K.src; }) : all;
  L.sort(function(a,b){ return a[1]<b[1]?1:(a[1]>b[1]?-1:b[4]-a[4]); });
  var sq=0,sc=0,so=0,ds={};
  L.forEach(function(x){ sq+=x[3]; sc+=x[4]; so+=x[5]; ds[x[1]]=1; });
  var h='<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px">'
    + '<button class="sm'+(K.src===''?' pri':'')+'" data-ksrc="">근거 전부</button>'
    + Object.keys(srcs).sort().map(function(s){

/* ── 부대비용 근거 ─────────────────────────── */
/** 비용 한 건의 규칙 — 금액·기준·분모. 서버가 내려준 것만 쓴다 (화면이 분모를 추측하면 거짓말이 된다) */
function kCost(ym,cid){
  var d=K.mon[ym]; if(!d||!d.costs) return null;
  for(var i=0;i<d.costs.length;i++) if(d.costs[i].id===cid) return d.costs[i];
  return null;
}
var KHUE={ 관세:"var(--acc)", 운임:"#C75B12", 통관수수료:"#068C7D", RFID:"#7A5AA6", 부자재:"#8A5A00", 검사비:"#2C5A28" };
function kHue(t){ return KHUE[t] || "var(--ink-3)"; }
/** 분모가 무엇을 센 것인가 — 단위를 틀리면 «145개 × 128원» 같은 거짓 문장이 나온다 */
function kUnit(c){
  var u=String((c&&(c.used||c.basis))||'');
  if(u.indexOf('수량')>=0) return { u:'개', qty:true };
  if(u.indexOf('USD')>=0)  return { u:'USD', qty:false };
  if(u.indexOf('금액')>=0) return { u:'원', qty:false };
  if(u.indexOf('세율')>=0) return { u:'가중치', qty:false };
  if(u.indexOf('직접')>=0) return { u:'원', qty:false };
  return { u:'', qty:false };
}

/** 지금 보고 있는 것에 붙은 부대비용을 «입고 묶음» 단위로 모은다 */
function kWhyGroups(only){
  var G={};
  kLots().forEach(function(x){
    if(only){ if(x[0]!==only) return; }
    else if(!kHit(x[0])) return;
    var g=G[x[7]+"\u0001"+(x[8]||"")]
      || (G[x[7]+"\u0001"+(x[8]||"")]={ ym:x[7], grp:x[8]||"", qty:0, wq:0, won:0, costs:{}, items:{} });
    g.qty+=x[3]; g.wq+=(x[10]||0);
    var e=g.items[x[0]] || (g.items[x[0]]={ qty:0, wq:0, won:0 });
    e.qty+=x[3]; e.wq+=(x[10]||0);
    var pt=x[9];
    if(pt) Object.keys(pt).forEach(function(cid){
      g.won+=pt[cid]; g.costs[cid]=(g.costs[cid]||0)+pt[cid]; e.won+=pt[cid];
    });
  });
  var out=[];
  Object.keys(G).forEach(function(k){ if(G[k].won) out.push(G[k]); });
  out.sort(function(a,b){ return b.won-a.won; });
  return out;
}

/** 이 기간이 걸친 달 중, 실제로 값을 받아 둔 달 */
function kHaveMonths(){ return kMonths().filter(function(m){ return K.mon[m] && !K.mon[m].empty; }); }

/** 넣을 수 있는가 — 서버가 얹어 준 권한을 본다 */
function kCanCost(){
  var ms=kHaveMonths();
  for(var i=0;i<ms.length;i++) if(K.mon[ms[i]].canCost) return true;
  return false;
}

/* ── 기준금액 근거 ─────────────────────────── */
var KBS = ['입고단가','환율적용','사전원가예외','미확정'];
var KBSW = {
  '입고단가':'ERP이 원화로 준 그대로',
  '환율적용':'수입금액 USD × 묶음 환율',
  '사전원가예외':'USD 가 없어 사전원가로',
  '미확정':'아직 안 정해짐 — 환율을 넣어야 합니다'
};
/** 이 기간이 걸친 달들의 근거를 합친다 */
function kf2(v){
  if(v===null||v===undefined||isNaN(v)) return '–';
  return Number(v).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function kBsrc(){
  var out={};
  kHaveMonths().forEach(function(m){
    var b=(K.mon[m]||{}).bsrc||{};
    Object.keys(b).forEach(function(k){
      var e=out[k]||(out[k]={n:0,qty:0,base:0});
      e.n+=b[k].n; e.qty+=b[k].qty; e.base+=b[k].base;
    });
  });
  return out;
}
function kFxList(){
  var out=[];
  kHaveMonths().forEach(function(m){
    ((K.mon[m]||{}).fx||[]).forEach(function(g){ out.push({ ym:m, g:g }); });
  });
  out.sort(function(a,b){ return b.g.base-a.g.base; });
  return out;
}
/** 기준금액이 어떻게 정해졌나 */

  L.forEach(function(x){
    var g=x.g;
    var lab = g.unres? '미확정' : (g.mode==='사전원가'?'사전원가예외':(g.rate?'환율적용':'미확정'));
    h+='<div class="why"><div class="whyh"><span class="g">'+kesc(g.grp)+'</span>'

      + '<span class="am">'+kf(g.base)+'</span></div>';
    if(g.mode==='사전원가'){
      h+='<div class="eqn"><div class="bx"><div class="lb">이 묶음의 사전원가금액</div>'
        + '<div class="bg">'+kf(g.pre)+'<span class="un">원</span></div>'
        + '<div class="sm">USD 가 없어 사전원가를 그대로 씁니다</div></div>'
        + '<div class="op">→</div>'
        + '<div class="bx res"><div class="lb">기준금액</div><div class="bg">'+kf(g.base)+'<span class="un">원</span></div>'
        + '<div class="sm">근거 · 사전원가예외</div></div></div>';
    } else if(g.rate){
      h+='<div class="eqn">'
        + '<div class="bx"><div class="lb">이 묶음의 수입금액</div>'
          + '<div class="bg">'+kf2(g.usd)+'<span class="un">USD</span></div>'
          + '<div class="sm">반품(음수)도 같은 환율로 되돌립니다</div></div>'
        + '<div class="op">×</div>'
        + '<div class="bx"><div class="lb">과세환율</div><div class="bg">'+kf2(g.rate)+'</div>'
          + '<div class="sm">'+(g.src?kesc(g.src):'<span style="color:var(--bad)">출처 없음 — 손으로 넣은 값</span>')+'</div></div>'
        + '<div class="op">=</div>'
        + '<div class="bx res"><div class="lb">기준금액</div><div class="bg">'+kf(g.base)+'<span class="un">원</span></div>'
          + '<div class="sm">줄마다 은행가 반올림</div></div></div>';
      h+='<div class="mine">'+(g.bl? ('B/L <b class="mono">'+kesc(g.bl)+'</b><br>') : '')
        + '<span class="hint">0.5 는 짝수 쪽으로 굽니다 — 그래야 회계시스템와 1원도 안 벌어집니다. '
        + '그래서 '+kf2(g.usd)+' × '+kf2(g.rate)+' 을 그냥 곱한 값과 몇 원 다를 수 있습니다.</span></div>';
    } else {
      h+='<div class="whybad" style="margin-top:9px">이 묶음엔 기준이 없습니다 — '
        + kf(g.unres||g.n)+'줄이 미확정입니다. 월마감 ⑤단계에서 환율 또는 사전원가를 정하세요.</div>';
    }
    h+='</div>';
  });
  return h;
}

/** 근거 전체 — 품번을 잠갔으면 그 품번만 */
function kWhy(only){
  // 넣는 자리는 월마감 ⑥ 하나다 — 여기는 «어떻게 붙었나» 만 본다.
  // 예전엔 여기에 폼이 있어서, 단계를 따라가다 탭을 갈아타야 했다.
  // 설명은 권한이 없는 사람에게도 보여야 한다(«왜 못 넣지» 를 없앤다). 단추만 권한을 본다.
  var head = '<div class="vrow" style="margin-bottom:9px"><span class="vmk">?</span>'
    + '<span class="hint">부대비용이란 물건값 말고 <b>물건을 들여오느라 더 든 돈</b>(운임 · 관세 · 통관수수료 …)입니다.'
    + ' 넣는 곳은 <b>월마감 탭 → ⑥ 부대비용 얹기</b> 한 군데뿐이고, 여기는 그 돈이 품번마다 얼마씩 얹혔는지 확인하는 자리입니다.</span>'
    + '<span>'+(kCanCost()?'<button class="btn sm" data-kgo6="1">⑥ 으로</button>':'')+'</span></div>';
  var gs=kWhyGroups(only||"");
  if(!gs.length) return head
    + '<div class="hint" style="padding:8px 2px">'
    + (only? '품번 <b>'+kesc(only)+'</b> 에는 얹힌 부대비용이 없습니다 — 다른 품번에는 붙어 있을 수 있습니다(위 «전체로» 를 누르세요).'
           : '이 기간엔 아직 얹힌 부대비용이 없습니다 — 월마감 탭 ⑥ 에서 넣으면 여기에 나타납니다.')
    + '</div>';
  var t=0; gs.forEach(function(g){ t+=g.won; });
  return head
    + '<div class="hint" style="margin-bottom:7px">묶음 '+kf(gs.length)+'개 · 부대비용 '+kf(t)+'원'
    + (only? ' <b style="color:var(--acc)">· 품번 '+kesc(only)+' 만</b>':'')+'</div>'
    + gs.map(function(g){ return kWhyCard(g, only||""); }).join("");
}

/* ── 그리기 ────────────────────────────────── */
function stockRender(){
  if(!K.rng) return;
  var M=kItems();
  var list=Object.keys(M).filter(kHit).sort(function(a,b){ return M[b].cost-M[a].cost; });
  // 요약은 «지금 걸러 보고 있는 것» 을 세야 한다.
  // 전체를 세면, 품번 하나를 잠가 놓고도 «1품번 · 273입고건 · 수량 178,153» 이 뜬다 — 거짓 숫자다.
  var nL=0, tq=0, tc=0, to=0;
  list.forEach(function(it){ nL+=M[it].lots.length; tq+=M[it].qty; tc+=M[it].cost; to+=M[it].oh; });

  var miss=kMissing();
  var h='<div class="secth"><b>재고수불부 「수」</b> '
    + '<span class="hint">들어온 물건에 값이 어떻게 매겨졌는지 보는 화면입니다</span></div>'
    + '<div class="kwhat">품번마다 <b>몇 개</b> 들어와 <b>하나에 얼마</b>로 잡혔고 <b>모두 얼마</b>인지 — 이 셋만 봅니다.'
    + ' 월초에 남아 있던 것(기초) · 팔려 나간 것(출고) · 월말에 남은 것(기말)은 창고(WMS)가 채우므로 여기엔 없습니다.'
    + '<br><b>넣고 고치는 일은 월마감 탭에서 합니다 — 여기는 그 결과와 근거만 봅니다.</b></div>'
    + '<div class="ftool">'
      + kRangeBar()
      + '<span class="hint">'+kDays(K.rng.from,K.rng.to)+'일</span>'
      + (miss.length?'<span class="pill warn">'+miss.length+'개월 더 받아야 합니다</span>':'')
      + '<input type="text" id="kq" value="'+kesc(K.q)+'" placeholder="품번 · 품명 · 입고처로 찾기">'
      + '<button class="sm" id="kxl">엑셀로 내려받기</button>'
    + '</div>';
  if(K.lock) h+='<div class="lockbar">품번 <b class="mono">'+K.lock+'</b> 만 보는 중 '
    + '<span class="hint">'+kesc(kName(K.lock).nm)+'</span>'
    + '<button class="sm" data-kunlock="1">전체로</button></div>';
  h+='<div class="hint" style="margin-bottom:7px">이 기간 '+kf(list.length)+'품번 · '+kf(nL)+'입고건'
    + ' · 수량 '+kf(tq)+' · 취득금액 '+kf(tc)+' <span class="hint">(그중 부대비용 '+kf(to)+')</span>'
    + (S.br? ' <b style="color:var(--acc)">· 브랜드 '+kesc(S.br)+' 만</b>':'')+'</div>';

  h+=kTblA(list, M);

  h+='<div class="drw"><button class="drwh" data-kdrw="C">'+(K.drw.C?'▾':'▸')
    + ' <b>언제 · 어디서 · 몇 개 들어왔나</b> <span class="hint">입고일 원장 — 입고 한 건씩 날짜순으로 · '+kf(nL)+'건</span></button>'
    + (K.drw.C?'<div class="drwb">'+kTblC()+'</div>':'')+'</div>';
  var bsr=kBsrc(), unres=(bsr['미확정']||{}).n||0;
  h+='<div class="drw"><button class="drwh" data-kdrw="E">'+(K.drw.E?'▾':'▸')
    + ' <b>물건값을 어떻게 원화로 잡았나</b> <span class="hint">기준금액 근거 — ERP이 준 입고단가 그대로인지, USD × 환율인지, 사전원가인지</span>'
    + (unres?'<span class="pill bad" style="margin-left:6px">미확정 '+kf(unres)+'줄</span>':'')+'</button>'
    + (K.drw.E?'<div class="drwb">'+kWhyFx()+'</div>':'')+'</div>';
  h+='<div class="drw"><button class="drwh" data-kdrw="D">'+(K.drw.D?'▾':'▸')
    + ' <b>운임 · 관세 같은 돈이 물건값에 얼마나 얹혔나</b> <span class="hint">부대비용 근거 — 어떤 기준으로 얼마씩 나뉘었는지 · 취득금액 중 '+kf(to)+'원</span></button>'
    + (K.drw.D?'<div class="drwb">'+kWhy(K.lock)+'</div>':'')+'</div>';
  h+='<div class="drw"><button class="drwh" data-kdrw="B">'+(K.drw.B?'▾':'▸')
    + ' <b>달마다 얼마씩 들어왔나</b> <span class="hint">월 매트릭스 — 품번 × 달 표 · '+kMonths().length+'개월</span></button>'
    + (K.drw.B?'<div class="drwb">'+kTblB(list, M)+'</div>':'')+'</div>';

  $('pStock').innerHTML=h;
  kTop();
  kBind();
}

/** 상단 «기간» 을 화면이 실제로 보고 있는 값으로 맞춘다 — 둘이 어긋나면 그게 곧 결함이다 */
function kTop(){
  var e=document.getElementById('ymStock');
  if(!e||!K.rng) return;
  var n=kMonths().length;
  e.innerHTML='<b>'+K.rng.from+'</b> ~ <b>'+K.rng.to+'</b>'
    + ' <span class="hint">'+(n>1?(n+'개월'):kDays(K.rng.from,K.rng.to)+'일')+'</span>';
}

/* ── 엑셀 (화면에 보이는 그대로) ───────────── */
function kCsv(){
  var M=kItems();
  var list=Object.keys(M).filter(kHit).sort(function(a,b){ return M[b].cost-M[a].cost; });
  var L=['품번,품명,입고일,입고건,입고수량,취득단가,취득금액,부대비용'];
  list.forEach(function(it){
    var e=M[it];
    L.push([it, '"'+String(kName(it).nm).replace(/"/g,'""')+'"',
            e.first===e.last?e.first:(e.first+'~'+e.last), e.lots.length,
            e.qty, Math.round(e.unit), Math.round(e.cost), Math.round(e.oh)].join(','));
  });
  var blob='﻿'+L.join('\r\n');
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(blob);
  a.download='수불부_입고_'+K.rng.from+'_'+K.rng.to+'.csv';
  a.click();
  note('엑셀 '+(L.length-1)+'줄을 내려받았습니다','ok');
}

/* ── 조작 — 그려 놓고 직접 묶는다 (이 앱의 방식) ───── */
function kOn(sel, fn){
  $('pStock').querySelectorAll(sel).forEach(function(b){
    b.onclick = function(){ fn(b); };
  });
}
/** 지우기 — 배부는 서버가 다시 계산한다. 화면이 스스로 고쳐 쓰면 장부와 갈라지므로,
    그 달을 통째로 버리고 다시 받는다.
    («넣었음» 표시를 푸는 일은 후보 목록을 가진 쪽 — Steps.html 의 ⑥ — 이 한다.) */
function kCostDel(ym,cid){
  if(!window.confirm(cid+' 을 지울까요? 배부가 다시 계산됩니다.')) return;
  run('apiCostDelete',[ym,cid], function(){
    delete K.mon[ym]; stockFetch();
  }, function(msg){ note(String(msg),'bad',true); });
}

function kBind(){
  kOn('[data-kgo6]', function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.setAttribute('aria-selected',String(x.dataset.t==='close')); });
    $('pClose').hidden=false; $('pStock').hidden=true; $('pCase').hidden=true;
    S.openStg=6; S.costOpen=true;
    closeBoot(S.ym,false);
  });
  kOn('[data-kdel]', function(b){
    var v=String(b.getAttribute('data-kdel')).split('|');
    kCostDel(v[0], v[1]);
  });
  kOn('[data-kopen]', function(){
    K.open=!K.open; K.tmp=null; K.pick=0; K.left=K.rng.from.slice(0,7);
    if(!K.months) run('apiStockMonths',[],function(r){ K.months=(r&&r.months)||null; stockRender(); },function(){});
    stockRender();
  });
  kOn('[data-kp]', function(b){
    var p=kPreset(b.getAttribute('data-kp'));
    K.tmp={from:p[0],to:p[1]}; K.pick=0; K.left=p[0].slice(0,7); stockRender();
  });
  kOn('[data-km]', function(b){ K.left=kAddM(K.left,+b.getAttribute('data-km')); stockRender(); });
  kOn('[data-kd]', function(b){
    var ds=b.getAttribute('data-kd');
    if(K.pick===0||!K.tmp){ K.tmp={from:ds,to:ds}; K.pick=1; }
    else { if(ds<K.tmp.from) K.tmp={from:ds,to:K.tmp.from}; else K.tmp.to=ds; K.pick=0; }
    stockRender();
  });
  kOn('[data-kcancel]', function(){ K.open=false; K.tmp=null; K.pick=0; stockRender(); });
  kOn('[data-kok]', function(){
    if(K.tmp&&K.tmp.from&&K.tmp.to) K.rng={from:K.tmp.from,to:K.tmp.to};
    K.open=false; K.tmp=null; K.pick=0;
    if(kMissing().length>6) note(kMonths().length+'개월은 한 번에 6개월씩 받습니다 — 확인을 한 번 더 누르세요','warn');
    stockFetch();
  });
  kOn('[data-kdrw]', function(b){ var k=b.getAttribute('data-kdrw'); K.drw[k]=!K.drw[k]; stockRender(); });
  kOn('[data-ksrc]', function(b){ K.src=b.getAttribute('data-ksrc'); stockRender(); });
  kOn('[data-kbu]',  function(b){ K.bu=b.getAttribute('data-kbu'); stockRender(); });
  kOn('[data-kunlock]', function(){ K.lock=''; stockRender(); });
  kOn('[data-ki]', function(b){ var it=b.getAttribute('data-ki'); K.lock=(K.lock===it)?'':it; if(K.lock) K.drw.D=true; stockRender(); });
  if($('kxl')) $('kxl').onclick=kCsv;

  kSearch();
}
/** 찾기 — 입력칸은 다시 만들지 않는다. 다시 만들면 한글 자모가 깨진다. */
function kSearch(){
  var el=$('kq'); if(!el) return;
  var comp=false;
  el.oncompositionstart=function(){ comp=true; };
  el.oncompositionend=function(){ comp=false; K.q=el.value; kRedraw(); };
  el.oninput=function(){ K.q=el.value; if(!comp) kRedraw(); };
}
/** 표만 갈아끼운다 — 입력칸과 커서를 그대로 둔다 */
function kRedraw(){
  var box=$('pStock'), el=$('kq');
  if(!box||!el) return;
  var pos=el.selectionStart;
  var M=kItems();
  var list=Object.keys(M).filter(kHit).sort(function(a,b){ return M[b].cost-M[a].cost; });
  var tmp=document.createElement('div'); tmp.innerHTML=kTblA(list,M);
  var oldT=box.querySelector('.scroll'), newT=tmp.querySelector('.scroll');
  if(oldT&&newT){ oldT.replaceWith(newT); kOn('[data-ki]', function(b){
    var it=b.getAttribute('data-ki'); K.lock=(K.lock===it)?'':it; if(K.lock) K.drw.D=true; stockRender(); }); }
  el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){}
}
</script>

<script>
if(!bootInline()) boot(S.ym);
if(S.wantTab==='close'||S.wantTab==='stock') setTimeout(function(){ openTab(S.wantTab); }, 60);
</script>
</body>
