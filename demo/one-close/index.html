/** 부대비용·환율을 손댈 수 있는가.
 *  재무는 전부. 생산은 «자기 브랜드에만 닿는» 것만 —
 *  배부는 한 줄이 여러 품번에 퍼지므로, 고른 범위가 실제로 닿는 줄을 꺼내 브랜드를 본다.
 *  막을 이유가 있으면 그 이유를, 없으면 빈 글자를 돌려준다. */
function costGuard_(ym, cost) {
  if (!can_('재무') && !can_('생산'))
    return '⑥ 부대비용 얹기 는 재무·생산 담당자만 할 수 있습니다. ' + '재무·생산 담당자에게 부탁하거나, 재무팀에 권한 등록을 요청하세요. (지금 내 권한: ' + who_().role + ')';

  // 여기는 «브랜드 경계» 만 본다. 범위가 실제로 닿는지는 scopeReach_ 가 본다 —
  // 그 검사를 여기 넣었더니 환율 저장·B/L 적용까지 그 달을 통째로 다시 계산해 느려졌고,
  // 게다가 B/L 적용은 범위값이 원래 비어 있어 애먼 오류로 죽었다.
  if (can_('재무')) return '';
  var my = who_().brands;
  if (!my || !my.length)
    return '내 담당 브랜드가 등록돼 있지 않아 어느 원가를 만져도 되는지 알 수 없습니다 — 재무팀에 «담당 브랜드 등록» 을 요청하세요.';
  var mine = {};
  my.forEach(function (b) { mine[String(b).toUpperCase()] = 1; });
  if (String(cost.scope || '') === '전체')
    return '«전체» 로 붙이면 다른 브랜드 원가에도 얹힙니다 — ⑥ 부대비용 얹기 에서 «붙일 자리» 를 내 브랜드의 입고묶음으로 좁히거나, 전체로 붙여야 하는 비용이면 재무 담당자에게 넘기세요.';
  var C0 = closeCompute_(ym);
  if (!C0) return '이 달 ERP 입고현황이 아직 없습니다 — ③ ERP 입고현황 올리기 에서 ERP «입고현황» 엑셀을 먼저 올려 주세요.';
  var hit = resolveScope_(cost, C0.lines);
  if (!hit.length) return scopeMiss_(cost);
  var bad = {};
  hit.forEach(function (l) { var b = brandOf_(l.item); if (!mine[b]) bad[b] = 1; });
  var bs = Object.keys(bad);
  if (bs.length)
    return '고른 자리에 ' + bs.join('·') + ' 입고가 섞여 있어, 이 비용이 그 브랜드 원가에도 얹힙니다. '
      + '⑥ 부대비용 얹기 에서 «붙일 자리» 를 내 담당 브랜드(' + my.join('·') + ') 입고묶음만 남게 고르세요.';
  return '';
}

/** 저장된 부대비용 한 건을 문지기가 볼 수 있는 모양으로 */
function costRowOf_(ym, id) {
  var r = rows_(SH.COST).filter(function (x) {
    return String(x.ym) === String(ym) && String(x.id) === String(id); })[0];
  if (!r) return null;
  return { scope: String(r['배부범위'] || '').trim(), scope_val: String(r['범위값'] || '').trim(),
           basis: String(r['배부기준'] || '').trim(),
           exclude: String(r['제외품번'] || '').split(';').map(function (x) { return x.trim(); }).filter(String) };
}

/** 붙일 자리가 아무 줄에도 안 닿을 때의 말 */
function scopeMiss_(cost) {
  var v = String((cost && cost.scope_val) || '').trim();
  return (v ? ('«' + v + '» 에 걸리는 입고가 한 줄도 없어') : '붙일 자리를 안 골라서')
    + ', 이 비용을 붙일 곳이 없습니다. '
    + '⑥ 부대비용 얹기 의 «붙일 자리» 에서 목록에 나오는 입고묶음(260703_VENDOR-X 처럼 날짜_입고처)을 골라 주세요 — '
    + 'B/L 번호나 신고번호를 적으면 안 됩니다.';
}

/** 입고묶음 하나가 내 브랜드인가 (환율·B/L 용) */
function grpGuard_(ym, grps) {
  return costGuard_(ym, { scope: '입고묶음', scope_val: (grps || []).join(';'), basis: '수량비례', exclude: [] });
}

/** 부대비용 저장 (id 가 있으면 수정) */
function apiCostSave(ym, row, items) {
  frozen_(ym);
  if (!can_('재무') && !can_('생산'))
    throw new Error('⑥ 부대비용 얹기 는 재무·생산 담당자만 할 수 있습니다. ' + '재무·생산 담당자에게 부탁하거나, 재무팀에 권한 등록을 요청하세요. (지금 내 권한: ' + who_().role + ')');
  var id = String(row.id || '').trim();
  if (!id) {
    var k = 1, used = {};
    rows_(SH.COST).forEach(function (r) { if (String(r.ym) === String(ym)) used[String(r.id)] = 1; });
    while (used['C' + (k < 10 ? '0' : '') + k]) k++;
    id = 'C' + (k < 10 ? '0' : '') + k;
  }
  if (!ai_(row['금액']))
    throw new Error('금액이 비었거나 0원입니다 — ⑥ 부대비용 얹기 의 «금액» 칸에 계산서·영수증에 적힌 금액(원)을 넣어 주세요.');
  if (COST_TYPES.indexOf(String(row['비용유형'])) < 0)
    throw new Error('«' + row['비용유형'] + '» 은 고를 수 없는 비용유형입니다 — ⑥ 부대비용 얹기 의 «비용유형» 에서 '
      + COST_TYPES.join(' · ') + ' 중 하나를 고르세요.');
  if (SCOPES.indexOf(String(row['배부범위'])) < 0)
    throw new Error('«' + row['배부범위'] + '» 은 고를 수 없는 붙일 자리입니다 — ⑥ 부대비용 얹기 의 «붙일 자리» 에서 '
      + SCOPES.join(' · ') + ' 중 하나를 고르세요.');
  if (BASES.indexOf(String(row['배부기준'])) < 0)
    throw new Error('«' + row['배부기준'] + '» 은 고를 수 없는 나누는 기준입니다 — ⑥ 부대비용 얹기 의 «나누는 기준» 에서 '
      + BASES.join(' · ') + ' 중 하나를 고르세요.');
  invOf_(row['귀속'], id, true);    // 넣을 때 잡는다 — 마감할 때 알면 원인 칸을 찾아 되돌아가야 한다
  var want = {
    scope: String(row['배부범위'] || '').trim(), scope_val: String(row['범위값'] || '').trim(),
    basis: String(row['배부기준'] || '').trim(),
    exclude: String(row['제외품번'] || '').split(';').map(function (x) { return x.trim(); }).filter(String) };
  var bad = costGuard_(ym, want);
  if (bad) throw new Error(bad);
  // 붙을 자리가 한 줄도 없는 비용은 여기서 잡는다 — 넘기면 확정 직전 V2·V4 에서야 터진다.
  var Cw = closeCompute_(ym);
  if (!Cw) throw new Error('이 달 ERP 입고현황이 아직 없습니다 — ③ ERP 입고현황 올리기 에서 먼저 올려 주세요.');
  if (!resolveScope_(want, Cw.lines).length) throw new Error(scopeMiss_(want));
  var keep = rows_(SH.COST).filter(function (r) { return !(String(r.ym) === String(ym) && String(r.id) === id); });
  var rec = { ym: ym, id: id, '비용유형': row['비용유형'], '금액': ai_(row['금액']), '공급자': row['공급자'] || '',
    '귀속': row['귀속'] || '재고원가', '배부범위': row['배부범위'], '범위값': row['범위값'] || '',
    '제외품번': (row['제외품번'] || ''), '포함품번': (row['포함품번'] || ''), '배부기준': row['배부기준'],
    '증빙번호': row['증빙번호'] || '', '발생일': row['발생일'] || '', '메모': row['메모'] || '' };
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    replaceAll_(SH.COST, keep.concat([rec]));
    var ki = rows_(SH.CITEM).filter(function (r) { return !(String(r.ym) === String(ym) && String(r['비용id']) === id); });
    if (items && items.length) {
      ki = ki.concat(items.map(function (x) { return { ym: ym, '비용id': id, '품번': String(x['품번']).trim(), '금액': ai_(x['금액']) }; }));
    }
    replaceAll_(SH.CITEM, ki);
  } finally { lock.releaseLock(); }
  log_('부대비용저장', id, rec['비용유형'] + ' ' + fmt_(rec['금액']));
  bust_(ym, 'cost'); return apiClose(ym);
}

function apiBlApply(ym, sel, withFx) {

  // 넘어오는 줄은 «신고» 단위다 — 묶음은 x['묶음'] 배열 안에 있고 꼭대기엔 .grp 가 없다.
  // 이걸 x.grp 로 읽어 전부 빈 글자가 되는 바람에 «» 오류로 죽었다.
  var gsB = [];
  (sel || []).forEach(function (x) {

/** 이 달 마감 입력을 비운다 (검수 건은 건드리지 않는다) */
/* ───────────────────────────────── 월마감 확정
 * 확정 = «이 달 숫자는 이제 안 바뀐다». 그때 비로소 재고수불부로 내보낸다. */

function closeStateKey_(ym) { return 'CLOSE_' + ym; }

function closeState_(ym) {
  try {
    var v = PropertiesService.getScriptProperties().getProperty(closeStateKey_(ym));
    return v ? JSON.parse(v) : null;
  } catch (e) { return null; }
}

/** 확정하기 전에 막는 것들 — 여기서 걸리면 숫자가 아직 덜 찼다는 뜻 */
function closeBlockers_(ym) {
  var C = closeCompute_(ym);
  if (!C) return ['이 달 ERP 입고현황이 아직 없습니다 — ③ ERP 입고현황 올리기 에서 ERP «입고현황» 엑셀을 먼저 올려 주세요'];
  var out = [];
  (C.checks || []).forEach(function (c) {
    if (!c.ok) out.push(c.id + ' ' + (c.name || '').split(':')[0] + ' — ' + (c.detail || ''));
  });
  return out;
}

/** 확정 / 해제. 확정하면 곧바로 Baserow 로 보낸다. */
function apiCloseConfirm(ym, on, skipPush) {
  if (!can_('재무')) throw new Error('⑦ 검증 후 확정 의 확정·확정 해제는 재무 담당자만 할 수 있습니다. ' + '재무 담당자에게 부탁하세요. (지금 내 권한: ' + who_().role + ')');
  var P = PropertiesService.getScriptProperties();
  if (!on) {
    P.deleteProperty(closeStateKey_(ym));
    bust_(ym);
    log_('마감해제', ym, '', ym);
    return pure_({ ok: true, state: null });
  }
  var block = closeBlockers_(ym);
  if (block.length)
    throw new Error('아직 확정할 수 없습니다. 아래를 먼저 고치고 ⑦ 검증 후 확정 에서 다시 누르세요 —\n· '
      + block.join('\n· '));
  var st = { ym: ym, at: Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm'),
             by: who_().email, push: null };
  // 확정된 숫자만 내보낸다. skipPush 면 확정만 하고 전송은 나중에 [다시 보내기] 로.
  if (skipPush) {
    st.push = { ok: false, skipped: true, error: '확정만 하고 재고수불부 전송은 미뤘습니다 — ⑦ 검증 후 확정 에서 «다시 보내기» 를 누르면 보냅니다' };
  } else {
    try { st.push = brPushMonth(ym); }
    catch (e) { st.push = { ok: false, error: String(e && e.message || e) }; }
  }
  P.setProperty(closeStateKey_(ym), JSON.stringify(st));
  bust_(ym);
  log_('마감확정', ym, (st.push && st.push.ok) ? (st.push.sent + '행 전송') : ('전송 실패: ' + (st.push && st.push.error)), ym);
  return pure_({ ok: true, state: st });
}

/** 본부별 진행 — 누가 어디까지 올렸나. 브랜드(품번 앞 2자리)를 본부로 묶는다 */
function deptProgress_(ym, lines) {
  var MAP = deptMap_(), parts = rparts_(ym);
  var loaded = {};                       // 브랜드 → {n, qty, amt, imp}
  lines.forEach(function (l) {
    var b = brandOf_(l.item);
    var e = loaded[b] || (loaded[b] = { n: 0, qty: 0, amt: 0, imp: 0 });
    e.n++; e.qty += l.qty; e.amt += l.amt_ipgo;
    if (l.buy === '수입') e.imp++;
  });
  var meta = {};                         // 브랜드 → 올린 사람·시각·파일
  parts.forEach(function (p) {
    String(p.brand || '').split('+').filter(String).forEach(function (b) {
      meta[b] = { who: p.who, at: p.at, file: p.file, key: p.brand };
    });
  });
  // 매핑에 있는 브랜드 + 실제로 들어온 브랜드 전부
  var all = {};
  Object.keys(MAP).forEach(function (b) { all[b] = 1; });
  Object.keys(loaded).forEach(function (b) { all[b] = 1; });

  var byDept = {};
  Object.keys(all).sort().forEach(function (b) {
    var dept = (MAP[b] && MAP[b].dept) || '(미지정)';
    var d = byDept[dept] || (byDept[dept] = { dept: dept, brands: [], n: 0, qty: 0, amt: 0, imp: 0, done: 0, wait: 0 });
    var e = loaded[b] || { n: 0, qty: 0, amt: 0, imp: 0 };
    var on = !!meta[b];
    // 그 달에 입고가 한 줄도 없는 브랜드는 «대기» 가 아니다 — 올릴 줄이 없는데 기다리면
    // ③ 이 영영 안 끝난다. (7월엔 UV 입고가 없는데 UV 가 C본부에 등록돼 있어 그랬다)
    var none = !on && !e.n;
    d.brands.push({ brand: b, on: on, none: none, n: e.n, qty: e.qty, amt: e.amt, imp: e.imp,
                    who: on ? meta[b].who : '', at: on ? meta[b].at : '',
                    file: on ? meta[b].file : '', key: on ? meta[b].key : '' });
    d.n += e.n; d.qty += e.qty; d.amt += e.amt; d.imp += e.imp;
    if (none) d.none = (d.none || 0) + 1;
    else if (on) d.done++; else d.wait++;
  });
  return Object.keys(byDept).sort().map(function (k) { return byDept[k]; });
}

/** 5단계 상태 — 레일이 이걸 그대로 그린다 */
function stepState_(ym, base, C) {
  var dep = base.depts || [], on = 0, tot = 0;
  dep.forEach(function (d) { on += d.done; tot += d.done + d.wait; });
  var uni = (base.options && base.options.uni_n) || Object.keys(unipassOf_(ym)).length;
  var cards = base.cards || [];
  var bl = cards.filter(function (c) { return c.bl; }).length;
  var costs = base.costs || [];
  var s = base.summary;
  var v4 = null;
  (base.checks || []).forEach(function (c) { if (c.id === 'V4') v4 = c; });
  var left = (v4 && !v4.ok ? 1 : 0) + (base.state === '확정' ? 0 : 1);
  return [
    { no: 1, name: 'ERP 입고현황', ok: tot > 0 && on === tot, bad: on === 0,
      badge: tot ? (on + '/' + tot) : '', note: C ? (fmt_(C.lines.length) + '행 · ' + fmt_(s.amt_ipgo) + '원') : '아직 없음' },
    { no: 2, name: '유니패스 실적', ok: uni > 0, bad: uni === 0 && !!(C && s.unres_n),
      badge: uni ? String(uni) : '', note: uni ? (uni + '건') : '없음 — 수입 건 기준금액이 확정되지 않습니다' },
    { no: 3, name: 'B/L 연결', ok: cards.length > 0 && bl === cards.length, bad: !!(C && s.unres_n),
      badge: cards.length ? (bl + '/' + cards.length) : '', note: cards.length ? (bl + '/' + cards.length + ' 묶음') : '수입 묶음 없음' },
    { no: 4, name: '부대비용', ok: costs.length > 0, bad: false,
      badge: costs.length ? String(costs.length) : '', note: C ? (costs.length + '건 · 재고반영 ' + fmt_(s.oh_inv)) : '' },
    { no: 5, name: '확정', ok: left === 0, bad: left > 0,
      badge: left ? String(left) : '', note: C ? ('취득원가 ' + fmt_(s.landed)
        + (base.closed ? (' · ' + base.closed.at + ' 확정'
            + (base.closed.push && base.closed.push.ok ? (' · 수불부 ' + base.closed.push.sent + '행') : ' · 전송 실패')) : '')) : '' }
  ];
}

/** 변경 이력 — 그 작업이 숫자를 얼마나 바꿨는지 */
function history_(ym, n) {
  var out = [];
  rows_(SH.LOG).forEach(function (r) {
    if (String(r.ym || '') !== String(ym)) return;
    var t = r['시각'];
    out.push({
      at: (t instanceof Date) ? Utilities.formatDate(t, 'Asia/Seoul', 'MM-dd HH:mm') : String(t || ''),
      ts: (t instanceof Date) ? t.getTime() : 0,
      who: String(r['이메일'] || '').split('@')[0],
      act: String(r['동작'] || ''), target: String(r['대상'] || ''),
      note: String(r['비고'] || ''), delta: String(r['변화'] || '')
    });
  });
  out.sort(function (a, b) { return b.ts - a.ts; });
  return out.slice(0, n || 20);
}

/** 한 본부(또는 브랜드)의 행만 */
function apiCloseByBrand(ym, brand) {
  var C = closeCompute_(ym);
  if (!C) return { rows: [] };
  var byLine = allocByLine_(C.alloc);
  var sel = C.lines.filter(function (l) { return brandOf_(l.item) === String(brand).toUpperCase(); });
  return { brand: brand, rows: sel.map(function (l) {
    return { ymd: l.ymd, vendor: l.vendor, lot: l.lot, item: l.item, name: l.name, color: l.color,
             buy: l.buy, work: l.work, qty: l.qty, amt_ipgo: l.amt_ipgo, base: l.base,
             base_src: l.base_src, oh: byLine[l.id] || 0, landed: l.base + (byLine[l.id] || 0) };
  }) };
}

/** 본부 매핑 고치기 */
function apiDeptSave(rows) {

function apiDeptList() { deptMap_(); return rows_(SH.DEPT); }


// ───── StockApi.gs
/**
 * 재고수불부 「수」 — 입고란.
 *
 * 수불부에 우리가 채우는 칸은 «입고 수량·단가·금액» 셋뿐이다.
 * 기초는 전월 기말이 넘어오고, 출고는 WMS 가 채운다.
 *
 * 값은 brRowsOf_ 하나에서만 나온다 — Baserow 로 보내는 것과 같은 함수다.
 * 화면이 따로 계산하기 시작하면 장부와 조용히 갈라진다.
 */

/** 한 달치를 화면이 접기 좋은 모양으로 — 품번 집계 + 입고건.
 *  입고건은 «입고일 × 입고처 × 묶음» 으로 접는다. 컬러까지 펴면 한 달 900줄이라 화면이 못 버틴다. */
function stockOf_(ym) {
  var t0 = Date.now();
  var C = closeCompute_(ym);
  if (!C) throw new Error(ym + ' 의 ERP 입고현황이 아직 없습니다 — 수불부는 입고가 있어야 만들어집니다. '
    + '월마감 ③ ERP 입고현황 올리기 에서 ERP «입고현황» 엑셀을 먼저 올려 주세요.');
  var rs = brRowsOf_(ym, C);             // 같은 C 로 만든다 — 장부와 근거가 갈라지지 않게
  var it = {}, lot = {};
  rs.forEach(function (r) {
    var k = r['품번'];
    var e = it[k] || (it[k] = { nm: r['품명'], br: r['브랜드'], m: {} });
    var a = e.m[ym] || (e.m[ym] = [0, 0, 0]);          // 수량 · 취득금액 · 부대비용
    a[0] += r['수량']; a[1] += r['취득금액']; a[2] += r['부대비용'];
    var lk = k + '' + r['입고일'] + '' + r['입고처'] + '' + r['묶음'];
    var b = lot[lk] || (lot[lk] = [k, r['입고일'], r['입고처'], 0, 0, 0, r['환율근거'], ym, r['묶음'], null, 0]);
    b[3] += r['수량']; b[4] += r['취득금액']; b[5] += r['부대비용'];
  });
  // 부대비용이 «어느 비용에서 얼마씩» 왔는가 — 줄 단위 배부를 품번·입고건으로 접는다
  var alloc = C.alloc || {}, pItem = {}, pLot = {}, qItem = {}, qLot = {};
  C.lines.forEach(function (l) {
    var a = alloc[l.id];
    if (!l.qty || !a) return;
    var ik = l.item, lk2 = l.item + '' + l.ymd + '' + l.vendor + '' + l.grp;
    // 배부에 실제로 쓰인 수량 — 반품 줄은 배부 대상이 아니라 수불부 수량과 다를 수 있다
    qItem[ik] = (qItem[ik] || 0) + l.qty;
    qLot[lk2] = (qLot[lk2] || 0) + l.qty;
    Object.keys(a).forEach(function (cid) {
      (pItem[ik] = pItem[ik] || {})[cid] = (pItem[ik][cid] || 0) + a[cid];
      (pLot[lk2] = pLot[lk2] || {})[cid] = (pLot[lk2][cid] || 0) + a[cid];
    });
  });
  // 품번마다 «무엇이 이 금액을 세웠나» — 화면이 환율 시트를 보고 짐작하면 안 된다.
  // 환율 시트에 «환율» 이 적혀 있어도 ERP에 입고단가가 있으면 입고단가가 이긴다(applyFx_ 는 미확정만 고친다).
  // 묶음도 여기서 준다 — 예전엔 «부대비용 범위값» 에서 거꾸로 캐서, 비용이 없는 달은 묶음이 통째로 안 보였다.
  var sItem = {}, gItem = {};
  C.lines.forEach(function (l) {
    if (!l.qty) return;
    var s = sItem[l.item] || (sItem[l.item] = {});
    s[l.base_src] = (s[l.base_src] || 0) + l.base;
    if (l.grp) (gItem[l.item] = gItem[l.item] || {})[l.grp] = 1;
  });
  Object.keys(it).forEach(function (k) {
    it[k].p = pItem[k] || null; it[k].q = qItem[k] || 0;
    it[k].s = sItem[k] || null;
    it[k].g = gItem[k] ? Object.keys(gItem[k]).sort() : [];
  });
  Object.keys(lot).forEach(function (k) { lot[k][9] = pLot[k] || null; lot[k][10] = qLot[k] || 0; });

  // 비용 한 건의 «규칙» — 금액·범위·기준·분모. 분모를 안 내려주면 화면이 추측하게 된다
  var costs = (C.costs || []).map(function (c) {
    var m = (C.cmeta || {})[c.id] || {};
    return { id: c.id, type: c.type, amount: c.amount, sup: c.supplier, doc: c.doc,
             scope: c.scope, val: c.scope_val, basis: c.basis, used: m.basis_used || '',
             wsum: (m.wsum === undefined || m.wsum === null) ? null : m.wsum,
             n: m.targets || 0, sum: m.allocated || 0, inv: !!c.inv,
             ok: m.ok !== false, issues: m.issues || [] };
  });

  // 기준금액이 어떻게 정해졌나 — 근거별 요약과, 환율이 걸린 묶음의 실제 곱셈.
  // 화면이 USD × 환율 을 스스로 계산하면 안 된다. 은행가 반올림이라 Math.round 로는 1원씩 벌어진다.
  var FXS = fxOf_(ym);
  var bs = {}, fxg = {};
  C.lines.forEach(function (l) {
    if (!l.qty) return;
    var b = bs[l.base_src] || (bs[l.base_src] = { n: 0, qty: 0, base: 0 });
    b.n++; b.qty += l.qty; b.base += l.base;
    if (l.base_src === '입고단가') return;              // ERP이 원화로 준 줄은 환율과 무관하다
    var f = FXS[l.grp] || {};
    var g = fxg[l.grp] || (fxg[l.grp] = { grp: l.grp, ymd: l.ymd, ven: l.vendor,
      mode: String(f.mode || ''), rate: (f.rate || null), src: String(f.src || ''),
      bl: String(f.bl || ''), n: 0, qty: 0, usd: 0, pre: 0, base: 0, unres: 0 });
    if (l.ymd < g.ymd) g.ymd = l.ymd;
    g.n++; g.qty += l.qty; g.usd += l.amt_imp; g.pre += l.amt_pre; g.base += l.base;
    if (l.base_src === '미확정') g.unres++;
  });
  var fxl = [];
  Object.keys(fxg).forEach(function (k) { fxl.push(fxg[k]); });
  fxl.sort(function (a, b) { return b.base - a.base; });

  var grps = costGroups_(C);

  var lots = [];
  Object.keys(lot).forEach(function (k) { lots.push(lot[k]); });
  lots.sort(function (a, b) { return a[1] < b[1] ? -1 : (a[1] > b[1] ? 1 : b[4] - a[4]); });
  return { ym: ym, items: it, lots: lots, costs: costs, grps: grps,
           bsrc: bs, fx: fxl, ms: Date.now() - t0 };
}

/** 한 달. 두 번째부터는 캐시에서 — 조각 캐시라 100KB 한 칸 제한에 안 걸린다. */
function apiStock(ym) {
  var t0 = Date.now();
  ym = ymOf_(ym || defaultYm_());
  var hit = cacheGetBig_('stock:' + ym);
  if (hit && hit.costs && hit.grps && hit.fx) stockWho_(hit);
  // 옛 모양의 캐시는 쓰지 않는다 — 그대로 쓰면 화면에 근거가 통째로 안 뜬다.
  if (hit && hit.costs && hit.grps && hit.fx) { hit.cached = true; hit.ms = Date.now() - t0; return hit; }
  var out;
  try { out = stockOf_(ym); }
  catch (e) { return pure_({ ym: ym, items: {}, lots: [], empty: true, why: String(e.message || e) }); }
  out = pure_(out);
  cachePutBig_('stock:' + ym, out);
  stockWho_(out);
  Logger.log('apiStock ' + ym + ' — ' + Object.keys(out.items).length + '품번 · ' + out.ms + 'ms');
  return out;
}

/** 권한과 확정 여부는 사람마다·때마다 다르다 — 캐시에 담지 말고 늘 새로 얹는다.
 *  (캐시에 담으면 재무가 한 번 연 화면을 물류가 열었을 때 단추가 그대로 보인다) */
function stockWho_(out) {
  try { out.canCost = (can_('재무') || can_('생산')); } catch (e) { out.canCost = false; }
  try { out.closed = !!closeState_(out.ym); } catch (e) { out.closed = false; }
  return out;
}

/** 여러 달을 한 왕복에. 왕복 한 번이 몇 초라 달마다 부르면 화면이 멎는다.
 *  6달을 넘기면 자른다 — 8달 전부는 13초쯤 걸려서, 그건 화면이 «오래 걸린다» 고 먼저 말하고 불러야 한다. */
function apiStockMulti(yms) {
  var out = {}, n = 0;
  (yms || []).forEach(function (m) {
    if (n >= 6) return;
    out[m] = apiStock(m);
    n++;
  });
  return out;
}

/** 어느 달에 값이 있는지 — 화면이 기간을 고를 때 쓴다 */
function apiStockMonths() {
  var ms = closeMonths_();
  var have = {};
  rows_(SH.RCPT).forEach(function (r) { have[ymOf_(r.ym)] = 1; });
  return pure_({ months: ms.filter(function (m) { return have[m]; }), all: ms });
}

/**
 * 입고대장 한 번에 — 마감 상태와 품번별 결과를 같은 실행에서 같이 낸다.
 *
 * 화면이 «대장 한 장» 으로 합쳐지면서 apiClose 와 apiStock 을 둘 다 봐야 하는데,
 * 따로 부르면 왕복이 두 번이고 closeCompute_ 도 두 번 돈다.
 * 한 실행 안에서는 rows_ 의 _MEMO 가 살아 있어 시트를 두 번 읽지 않는다.
 */
function apiLedger(ym) {
  var t0 = Date.now();
  ym = ymOf_(ym || defaultYm_());
  var out = { ym: ym, close: apiClose(ym), stock: apiStock(ym) };
  out.ms = Date.now() - t0;
  return out;
}


// ───── Seed.gs
/** ────────────────────────────────────────────────────────────────
 *  ERP 입고현황을 그대로 «검수까지 끝난 건» 으로 만든다.
 *  9월부터 실제로 쓰기 전에, 8월 숫자로 뒤 단계(대사·배부·확정)를 돌려 보려는 자리다.
 *  ?seed=2026-08&wrong=3  — wrong 은 일부러 틀리게 둘 건의 수 (사유 미선택이 걸리는지 본다)
 *  ──────────────────────────────────────────────────────────────── */
function seedFromReceipt_(ym, wrongN) {
  wrongN = wrongN || 0;
  var R = rows_(SH.RCPT).filter(function (r) { return ymOf_(r.ym) === ymOf_(ym); });
  if (!R.length) throw new Error(ym + ' ERP 입고현황이 없습니다 — 먼저 올리세요.');

  // 입고일 × 입고처 = 건 하나
  var G = {}, order = [];
  R.forEach(function (r) {
    var d = dOf_(r.ymd), v = String(r.vendor || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !v) return;
    var id = d.replace(/-/g, '') + '_' + v.replace(/[^\w가-힣]/g, '').slice(0, 12);
    if (!G[id]) { G[id] = { id: id, ymd: d, vendor: v, logi: String(r.logi || ''), rows: [] }; order.push(id); }
    G[id].logi = G[id].logi || String(r.logi || '');
    G[id].rows.push(r);
  });

  // 이미 있는 8월 건·줄은 걷어낸다 (같은 자리를 두 번 만들지 않는다)
  [SH.PLAN, SH.WMS, SH.REV, SH.REC].forEach(function (n) { wipeYm_(n, ym); });

  var recs = [], plans = [], revs = [], who = who_().email, now = new Date();
  var wrongIds = order.slice(0, wrongN);           // 앞에서부터 몇 건만 어긋나게
  var wrongLog = [];

  order.forEach(function (id) {
    var g = G[id];
    recs.push({ ym: ym, id: id, '출고일': g.ymd, '출고처': g.vendor, '입고처': g.logi,
                '상태': '확인 완료', '출처': 'ERP 입고현황', '생성자': who, '생성시각': now,
                '검산': '[]', '의뢰': Utilities.formatDate(now, 'Asia/Seoul', 'yyyy-MM-dd HH:mm') + ' ' + who,
                '차수': '' });
    var bad = wrongIds.indexOf(id) >= 0, hit = 0;
    g.rows.forEach(function (r) {
      var sizes = [];
      try { sizes = JSON.parse(r.sizes || '[]'); } catch (e) { sizes = []; }
      var unit = num_(r.unit_ipgo);
      sizes.forEach(function (s) {
        var label = String(s[0]), q = int_(s[1]);
        if (!q) return;
        var k = k_(r.item, r.color, label);
        plans.push({ ym: ym, id: id, '품번': r.item, '컬러코드': r.color, '컬러': r.color, '사이즈': label,
                     '수량': q, '원수량': q, '원가': unit, '품명': r.name, '바코드': '' });
        var act = q;
        if (bad && hit < 2) {                      // 그 건의 앞 두 칸만 어긋나게
          act = Math.max(0, q - (hit === 0 ? 3 : 1));
          hit++;
          wrongLog.push(id + ' ' + r.item + '/' + r.color + '/' + label + ' 예정 ' + q + ' → 실수량 ' + act);
        }
        if (act !== q) revs.push({ ym: ym, id: id, '키': k, '실수량': act, '사유': '', '수정자': who, '수정시각': now });
      });
    });
  });

  append_(SH.REC, recs);
  append_(SH.PLAN, plans);
  if (revs.length) append_(SH.REV, revs);
  bust_(ym);
  cacheWipeAll_();
  log_('검수시드', ym, recs.length + '건 · ' + plans.length + '줄', ym);
  return { 건: recs.length, 줄: plans.length, 어긋난칸: revs.length, 어긋남: wrongLog };
}


// ───── Backup.gs
/**
 * 한 달치를 통째로 떠 두고, 그대로 되돌린다.
 *
 * «싹 비우고 처음부터» 를 하려면 되돌릴 길이 있어야 한다.
 * 8월은 유니패스 수입신고실적 파일이 없어서, 지금 시트에 든 관세·환율이 유일한 사본이다.
 * 그걸 잃으면 손으로 다시 만들 수밖에 없다.
 *
 *   ?dump=YYYY-MM              드라이브에 «마감백업_YYYY-MM_시각.json» 으로 떠 둔다
 *   ?restore=<파일명>&ym=YYYY-MM   그 파일로 되돌린다 (그 달을 먼저 비우고 넣는다)
 */

var BK_SHEETS = ['RCPT', 'RMETA', 'COST', 'CITEM', 'FX', 'UNI', 'HS'];

/** 그 달 시트 내용을 전부 모은다. HS 는 달 구분이 없어 통째로 담는다. */
function bkCollect_(ym) {
  var out = { ym: ym, at: Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm:ss'),
              by: who_().email, sheets: {} };
  BK_SHEETS.forEach(function (k) {
    var name = SH[k];
    var all = rows_(name);
    var mine = (k === 'HS') ? all : all.filter(function (r) { return String(r.ym) === String(ym); });
    out.sheets[k] = { name: name, rows: mine.map(function (r) { return pure_(r); }) };
  });
  var st = closeState_(ym);
  out.closed = st ? pure_(st) : null;
  return out;
}

function apiBackupDump(ym) {
  if (!can_('재무')) throw new Error('한 달치 백업을 뜨는 것은 재무 담당자만 할 수 있습니다. ' + '재무 담당자에게 부탁하세요. (지금 내 권한: ' + who_().role + ')');
  ym = ymOf_(ym || defaultYm_());
  var d = bkCollect_(ym);
  var stamp = Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyyMMdd_HHmm');
  var name = '마감백업_' + ym + '_' + stamp + '.json';
  var f = DriveApp.createFile(name, JSON.stringify(d), 'application/json');
  var n = {};
  BK_SHEETS.forEach(function (k) { n[SH[k]] = d.sheets[k].rows.length; });
  log_('백업', ym, name);
  return pure_({ ok: true, name: name, url: f.getUrl(), counts: n, closed: !!d.closed });
}

/** 되돌린다 — 그 달을 비우고 백업 내용을 넣는다. HS 는 건드리지 않는다(달 구분이 없어 통째로 덮으면 위험). */
function apiBackupRestore(fileName, ym) {
  if (!can_('재무')) throw new Error('백업으로 되돌리는 것은 재무 담당자만 할 수 있습니다. ' + '재무 담당자에게 부탁하세요. (지금 내 권한: ' + who_().role + ')');
  ym = ymOf_(ym || defaultYm_());
  var it = DriveApp.getFilesByName(String(fileName));
  if (!it.hasNext()) throw new Error('구글 드라이브에서 «' + fileName + '» 을 못 찾았습니다 — '
    + '이름이 바뀌었거나 지워진 백업입니다. 백업 목록에서 다른 백업을 고르세요.');
  var d = JSON.parse(it.next().getBlob().getDataAsString('UTF-8'));
  if (String(d.ym) !== ym) throw new Error('고른 백업은 ' + d.ym + ' 치인데 지금 화면의 달은 ' + ym + ' 입니다 — '
    + '엉뚱한 달을 덮어쓸 뻔했습니다. 화면 왼쪽 위 달을 ' + d.ym + ' 로 바꾸거나, ' + ym + ' 백업을 고르세요.');

  var done = {};
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    BK_SHEETS.forEach(function (k) {
      if (k === 'HS') return;                         // 달 구분이 없어 손대지 않는다
      var name = SH[k];
      var keep = rows_(name).filter(function (r) { return String(r.ym) !== ym; });
      var add = (d.sheets[k] && d.sheets[k].rows) || [];
      replaceAll_(name, keep.concat(add));
      done[name] = add.length;
    });
  } finally { lock.releaseLock(); }

  if (d.closed) PropertiesService.getScriptProperties().setProperty(closeStateKey_(ym), JSON.stringify(d.closed));
  else PropertiesService.getScriptProperties().deleteProperty(closeStateKey_(ym));

  bust_(ym);
  log_('백업복원', ym, fileName);
  return pure_({ ok: true, ym: ym, from: fileName, counts: done, closed: !!d.closed });
}

/** 떠 둔 백업 목록 */
function apiBackupList(ym) {
  var pre = '마감백업_' + (ym ? ymOf_(ym) : '');
  var it = DriveApp.getFiles(), out = [];
  while (it.hasNext()) {
    var f = it.next(), n = f.getName();
    if (n.indexOf('마감백업_') !== 0) continue;
    if (ym && n.indexOf(pre) !== 0) continue;
    out.push({ name: n, size: f.getSize(),
               at: Utilities.formatDate(f.getLastUpdated(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm') });
  }
  out.sort(function (a, b) { return a.at < b.at ? 1 : -1 });
  return pure_({ rows: out });
}

/**
 * 화면에서 한 달을 비운다 — 주소 대신 단추로.
 *
 * 주소(`?wipe=`)로만 지울 수 있게 해 뒀더니, 주소가 탭에 남아 다시 로드되며
 * 같은 달을 두 번 날린 적이 있다. 한 번만 쓸 수 있는 «확인번호» 로 막긴 했지만 애초에 주소로 할 일이 아니다.
 * 그래서 화면에 둔다 — 두 번 눌러야 하고, 첫 눌림이 백업을 먼저 뜬다.
 *
 *   apiMonthReset(ym)            → 백업을 뜨고 «확인번호» 를 준다 (아직 안 지움)
 *   apiMonthReset(ym, 확인번호)  → 그 번호로 한 번만 지운다
 */
function apiMonthReset(ym, token) {
  if (!can_('재무')) throw new Error('이 달을 통째로 비우는 것은 재무 담당자만 할 수 있습니다. ' + '재무 담당자에게 부탁하세요. (지금 내 권한: ' + who_().role + ')');
  ym = ymOf_(ym || defaultYm_());
  if (closeState_(ym)) throw new Error(ym + ' 은 이미 확정한 달이라 비울 수 없습니다 — '
    + '⑦ 검증 후 확정 에서 «확정 해제» 를 먼저 누르고 다시 시도하세요.');

  var P = PropertiesService.getScriptProperties();
  var key = 'WIPE_TICKET_' + ym;

  if (!token) {
    // 되살릴 수 없는 것이 있을 때만 백업을 뜬다.
    // 입고현황·유니패스는 올린 파일로 되살아나고, 환율·관세는 기계가 다시 세운다.
    // 오직 «운임·통관수수료를 어느 묶음에 붙였나» 하는 사람의 판단만 되살릴 수 없다.
    var nCost = rows_(SH.COST).filter(function (r) { return ymOf_(r.ym) === ym; }).length;
    var bk = nCost ? apiBackupDump(ym)
                   : { ok: true, skipped: true, name: '', counts: {},
                       why: '넣어 둔 부대비용이 없어 백업을 뜨지 않았습니다 — '
                          + '입고현황·유니패스는 올린 파일로, 환율·관세는 기계가 다시 세웁니다.' };
    var t = Utilities.getUuid().slice(0, 8);
    P.setProperty(key, JSON.stringify({ t: t, at: Date.now() }));
    var now = {};
    ['RCPT', 'COST', 'FX', 'UNI'].forEach(function (k) {
      now[SH[k]] = rows_(SH[k]).filter(function (r) { return ymOf_(r.ym) === ym; }).length;
    });
    return pure_({ stage: 'ready', ym: ym, token: t, backup: bk, now: now });
  }

  var raw = P.getProperty(key);
  var tk = raw ? JSON.parse(raw) : null;
  if (!tk || tk.t !== String(token))
    throw new Error('확인번호가 맞지 않습니다 — 이미 한 번 쓴 번호이거나 지워진 번호입니다. '
      + '아무것도 지우지 않았습니다. «이 달 비우기» 를 처음부터 다시 누르세요.');
  if (Date.now() - Number(tk.at) > 600000) {
    P.deleteProperty(key);
    throw new Error('확인번호를 받은 지 10분이 지나 쓸 수 없습니다 — 아무것도 지우지 않았습니다. '
      + '«이 달 비우기» 를 처음부터 다시 누르세요.');
  }
  P.deleteProperty(key);            // 지우기 전에 확인번호를 먼저 없앤다 — 도중에 새로고침해도 두 번 안 돌게
  apiCloseReset(ym);
  return pure_({ stage: 'done', ym: ym });
}


// ───── Baserow.gs
/**
 * 재고수불부용 — 월마감이 확정되면 그 달 품번별 입고를 Baserow 로 보낸다.
 *
 * 왜 확정 시점인가: 그때부터 숫자가 안 바뀐다. 그 전에 보내면 수불부가 흔들린다.
 * 다시 확정하면 그 달 행을 지우고 다시 넣는다 — 중복이 쌓이지 않게.
 *
 * 준비물 (스크립트 속성):
 *   BASEROW_URL    예: https://baserow.io           (자체 호스팅이면 그 주소)
 *   BASEROW_TOKEN  데이터베이스 토큰 (Baserow 설정 → 데이터베이스 토큰)
 *   BASEROW_TABLE  받을 테이블 id (숫자)
 */

/** 보낸 것이 마감 결과와 맞는지 — 숫자로 확인한다 */
function checkPush_2026_08() {
  var ym = '2026-08';
  var rows = brRowsOf_(ym);
  var t = { n: 0, qty: 0, base: 0, oh: 0, cost: 0 };
  rows.forEach(function (r) {
    t.n++; t.qty += r['수량']; t.base += r['기준금액']; t.oh += r['부대비용']; t.cost += r['취득금액'];
  });
  var C = closeCompute_(ym);
  var S = C.summary || {};
  function w(n) { return Number(n).toLocaleString('ko-KR'); }
  Logger.log('보낸 줄 ' + w(t.n) + ' · 수량 ' + w(t.qty));
  Logger.log('  기준금액 ' + w(t.base));
  Logger.log('  부대비용 ' + w(t.oh));
  Logger.log('  취득금액 ' + w(t.cost));
  Logger.log('마감 요약 — ' + JSON.stringify(S));
  return t;
}

var BR_PROP = { url: 'BASEROW_URL', token: 'BASEROW_TOKEN', table: 'BASEROW_TABLE' };

function brCfg_() {
  var P = PropertiesService.getScriptProperties();
  return {
    url: String(P.getProperty(BR_PROP.url) || 'https://baserow.io').replace(/\/+$/, ''),
    token: P.getProperty(BR_PROP.token) || '',
    table: P.getProperty(BR_PROP.table) || ''
  };
}

/** 한 번만 — 값 세 개를 넣는다 */
function setupBaserow(url, token, table) {
  if (!token || !table) throw new Error('토큰과 테이블 id 를 둘 다 넣어야 합니다 — Baserow 설정 → 데이터베이스 토큰 에서 받은 값입니다.');
  PropertiesService.getScriptProperties().setProperties({
    BASEROW_URL: url || 'https://baserow.io',
    BASEROW_TOKEN: String(token),
    BASEROW_TABLE: String(table)
  });
  Logger.log('Baserow 설정 완료 — 테이블 ' + table);
}

/** 재고수불부(Baserow)가 낸 응답을 사람 말로 바꾼다 — 원문 JSON 을 그대로 보여 주면 읽을 수가 없다 */
function brWhy_(code) {
  var head = '재고수불부(Baserow)로 보내지 못했습니다';
  var again = ' 그 뒤 ⑦ 검증 후 확정 에서 «다시 보내기» 를 누르세요.';
  if (code === 401 || code === 403)
    return head + ' — 연결 토큰이 만료됐거나 권한이 없습니다(' + code + '). 재무 담당자에게 «Baserow 토큰 재발급» 을 요청하세요.' + again;
  if (code === 404)
    return head + ' — 보낼 표를 못 찾았습니다(404). 재무 담당자에게 «Baserow 테이블 번호 확인» 을 요청하세요.' + again;
  if (code === 400)
    return head + ' — Baserow 가 보낸 값을 받지 않았습니다(400). 표의 칸 이름이 바뀌었을 수 있습니다. 재무 담당자에게 알려 주세요.' + again;
  if (code === 429)
    return head + ' — 너무 자주 보냈습니다(429). 1~2분 기다렸다가 ⑦ 검증 후 확정 에서 «다시 보내기» 를 누르세요.';
  if (code >= 500)
    return head + ' — Baserow 쪽이 응답하지 않습니다(' + code + '). 마감 확정은 그대로 남아 있으니, 잠시 뒤 ⑦ 검증 후 확정 에서 «다시 보내기» 를 누르세요.';
  return head + ' (응답코드 ' + code + '). 잠시 뒤 ⑦ 검증 후 확정 에서 «다시 보내기» 를 누르고, 계속 같으면 재무 담당자에게 알려 주세요.';
}

function brFetch_(path, method, body) {
  var c = brCfg_();
  if (!c.token || !c.table)
    throw new Error('재고수불부(Baserow) 연결이 아직 등록되지 않았습니다 — 재무 담당자에게 «재고수불부 연결 등록(주소·토큰·표 번호)» 을 요청하세요. '
      + '마감 확정은 그대로 남고, 등록된 뒤 ⑦ 검증 후 확정 에서 «다시 보내기» 를 누르면 보냅니다.');
  var res = UrlFetchApp.fetch(c.url + path, {
    method: method || 'get',
    contentType: 'application/json',
    headers: { Authorization: 'Token ' + c.token },
    payload: body ? JSON.stringify(body) : undefined,
    muteHttpExceptions: true
  });
  var code = res.getResponseCode(), txt = res.getContentText();
  if (code >= 300) {
    Logger.log('Baserow ' + code + ' — ' + txt.slice(0, 300));   // 원문은 실행 로그에만 (화면에는 사람 말로)
    throw new Error(brWhy_(code));
  }
  return txt ? JSON.parse(txt) : null;
}

/** 그 달 행을 찾아 지운다 (다시 보낼 때 중복 방지) */
function brWipeMonth_(ym) {
  var c = brCfg_(), gone = 0;
  for (var guard = 0; guard < 60; guard++) {
    var r = brFetch_('/api/database/rows/table/' + c.table +
      '/?user_field_names=true&size=200&search=' + encodeURIComponent(ym), 'get');
    var ids = (r.results || []).filter(function (x) { return String(x['연월']) === String(ym); })
      .map(function (x) { return x.id; });
    if (!ids.length) break;
    brFetch_('/api/database/rows/table/' + c.table + '/batch-delete/?user_field_names=true',
      'post', { items: ids });
    gone += ids.length;
    if (!r.next) break;
  }
  return gone;
}

/** 그 달 품번별 입고를 만든다 — 취득단가는 부대비용까지 얹은 값.
 *  수불부의 «입고» 가 이것이므로, ERP 입고금액이 아니라 취득원가라야 한다. */
function brRowsOf_(ym, C) {
  C = C || closeCompute_(ym);   // 수불부가 이미 계산해 뒀으면 두 번 돌리지 않는다
  if (!C) throw new Error(ym + ' 의 ERP 입고현황이 아직 없어 재고수불부로 보낼 입고가 없습니다 — '
    + '③ ERP 입고현황 올리기 에서 ERP «입고현황» 엑셀을 먼저 올려 주세요.');
  var byLine = allocByLine_(C.alloc || {});     // 줄마다 배부된 부대비용
  var now = Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm');
  var out = [];
  C.lines.forEach(function (l) {
    if (!l.qty) return;
    var oh = Math.round(byLine[l.id] || 0);
    var base = Math.round(l.base || 0);
    var cost = base + oh;
    out.push({
      '연월': ym,
      '입고일': l.ymd || '',
      '브랜드': brandOf_(l.item),
      '입고처': l.vendor || '',
      '품번': l.item,
      '품명': l.name || '',
      '컬러': l.color || '',
      '수량': l.qty,
      '취득단가': l.qty ? Math.round(cost / l.qty) : 0,
      '취득금액': cost,
      '기준금액': base,
      '부대비용': oh,
      '환율근거': l.base_src || '',
      '묶음': l.grp || '',
      '입고번호': String(l.ipgo_no || ''),
      '보낸시각': now
    });
  });
  return out;
}

/** 월마감 확정 뒤에 부른다. 200행씩 끊어 보낸다. */
function brPushMonth(ym) {
  var t0 = Date.now();
  var rows = brRowsOf_(ym);
  if (!rows.length) throw new Error(ym + ' 에 수량이 있는 입고가 한 줄도 없어 보낼 것이 없습니다 — '
    + '③ ERP 입고현황 올리기 에서 이 달 파일을 올렸는지 확인해 주세요.');
  var c = brCfg_();
  var gone = brWipeMonth_(ym);
  var sent = 0;
  for (var i = 0; i < rows.length; i += 200) {
    brFetch_('/api/database/rows/table/' + c.table + '/batch/?user_field_names=true',
      'post', { items: rows.slice(i, i + 200) });
    sent += Math.min(200, rows.length - i);
  }
  var msg = ym + ' — ' + sent + '행 보냄' + (gone ? (' (먼저 ' + gone + '행 지움)') : '');
  log_('베이스로우전송', ym, msg, ym, sent);
  Logger.log('brPushMonth ' + msg + ' · ' + (Date.now() - t0) + 'ms');

/**
 * 홈택스에서 받아 온 부대비용 후보를 읽는다.
 *
 * 수집기(내 PC, 공동인증서로 홈택스에 직접 붙는다)가 구글 드라이브에
 *   부대비용후보_YYYY-MM.json
 * 을 떨어뜨린다. 여기서는 그 파일만 읽는다 — 웹훅도 공유키도 없고,
 * 회계 자료가 바깥 네트워크를 타지도 않는다.
 *
 * 붙일 «입고 묶음» 은 여기서 정하지 않는다. 계산서에는 B/L 이 안 실려 오고,
 * 날짜로 이으면 틀린다 — 8/31 작성 운임이 8/12 입고묶음에 붙는 일이 실제로 있었다.
 * 그래서 후보만 화면에 올리고, 어디에 붙일지는 사람이 고른다.
 */

var HT_FILE = '부대비용후보_';      // + YYYY-MM + .json

/** 그 달 후보를 돌려준다. 없으면 왜 없는지 말해 준다. */
function apiHometaxCand(ym) {
  ym = ymOf_(ym || defaultYm_());
  var name = HT_FILE + ym + '.json';
  var out = { ym: ym, name: name, rows: [], skipped: [], at: '', why: '' };
  try {
    var it = DriveApp.getFilesByName(name);
    if (!it.hasNext()) {
      out.why = '드라이브에 «' + name + '» 이 없습니다 — 수집기가 아직 이 달을 받지 않았습니다.';
      return pure_(out);
    }
    var f = it.next();
    var d = JSON.parse(f.getBlob().getDataAsString('UTF-8'));
    out.at = String(d['받은시각'] || '');
    out.total = Number(d['전체건수'] || 0);
    (d['후보'] || []).forEach(function (r) {
      out.rows.push({
        id: String(r['승인번호'] || ''),
        ymd: String(r['작성일'] || ''),
        sup: String(r['거래처'] || ''),
        item: String(r['품목'] || ''),
        amt: ai_(r['공급가액']),
        tax: ai_(r['세액']),
        type: String(r['비용유형'] || '')
      });
    });
    (d['제외'] || []).forEach(function (r) {
      out.skipped.push({ ymd: String(r['작성일'] || ''), sup: String(r['거래처'] || ''),
                         amt: ai_(r['공급가액']), why: String(r['제외사유'] || '') });
    });
  } catch (e) {
    out.why = '후보를 못 읽었습니다 — ' + (e && e.message || e);
  }
  return pure_(out);
}

/** 이미 넣은 것과 겹치는지 — 증빙번호(승인번호)로 본다.
 *  같은 계산서를 두 번 넣으면 원가가 두 배가 된다. 4월에 실제로 그런 일이 있었다. */
function apiHometaxUsed(ym) {
  ym = ymOf_(ym || defaultYm_());
  var used = {};
  rows_(SH.COST).forEach(function (r) {
    if (String(r.ym) !== ym) return;
    var d = String(r['증빙번호'] || '').trim();
    if (d) used[d] = String(r.id || '');
  });
  return pure_({ ym: ym, used: used });
}

.sd.on{background:var(--ok);border-color:var(--ok);color:#fff}
.sd.now{background:var(--warn);border-color:var(--warn);color:#fff}
.sd.blk{background:var(--bad);border-color:var(--bad);color:#fff}

table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surf-2);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
td.n,th.n{text-align:right;font-family:Consolas,monospace;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.tot td{background:var(--surf-2);font-weight:700}
.tw{overflow-x:auto}

/* 알림 — 팝업 없음. 다만 «문서 최상단» 이 아니라 화면에 붙는다 —
   아래쪽에서 일하던 사람은 위에 뜬 결과를 본 적이 없다.
   상자 자체는 클릭을 통과시킨다(pointer-events:none) — 밑의 단계 카드를 막지 않는다. */
#notes{position:fixed;right:16px;bottom:16px;z-index:80;
  width:min(420px,calc(100vw - 32px));display:flex;flex-direction:column;gap:6px;
  pointer-events:none}
#notes:empty{display:none}
.note{pointer-events:auto;display:flex;align-items:flex-start;gap:9px;padding:8px 12px;
  border:1px solid var(--line);border-left-width:4px;background:var(--surf);font-size:13px;
  white-space:pre-wrap;box-shadow:0 6px 18px rgba(0,0,0,.16)}
.note .t{flex:1 1 auto;min-width:0}
.note .w{flex:0 0 auto;font-family:Consolas,monospace;font-size:10.5px;color:var(--ink-3);
  padding-top:2px}
.note .x{margin-left:auto;border:0;background:transparent;color:var(--ink-3);font-size:15px;
  line-height:1;cursor:pointer;padding:0 2px}
.note.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.note.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.info{border-left-color:var(--acc);background:var(--acc-soft)}
/* 결과 — «무엇이 몇 건 적용됐다». 스스로 사라지지 않는다 */
.note.done{border-color:var(--ok);border-left-color:var(--ok);background:var(--ok-soft)}
.note.done .t::before{content:'\2713 ';font-weight:700;color:var(--ok)}
.work{font-size:12px;color:var(--acc);display:none;align-items:center;gap:6px}
.work.on{display:inline-flex}
.work i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.skel{padding:14px;color:var(--ink-3);font-size:13px}

/* 입고 건 탭 */
.secth{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);
  background:var(--surf-3);font-size:12px;font-weight:700;flex-wrap:wrap}
.sect{border-top:1px solid var(--line);background:var(--surf-2)}
.tlday{display:grid;grid-template-columns:78px 1fr;border-bottom:1px solid var(--line);background:var(--surf)}
.tlday:last-child{border-bottom:0}
.tlday .d{padding:7px 10px;border-right:1px solid var(--line);background:var(--surf-2);
  font-family:Consolas,monospace;font-size:12px;font-weight:700;display:flex;flex-direction:column;gap:1px}
.tlday .d small{font-weight:400;color:var(--ink-3);font-size:10.5px;font-family:"Malgun Gothic",sans-serif}
.tlc{display:grid;grid-template-columns:1fr auto auto auto auto;gap:11px;padding:6px 12px;
  border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.tlc:last-child{border-bottom:0}
.tlc:hover{background:var(--surf-2)}
.tlc.on{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.btn.dgr{color:var(--bad);border-color:var(--bad)}
.btn.dgr:hover{background:var(--bad);color:#fff}
.tlc.busy{cursor:progress}
.lap{font:11px Consolas,monospace;color:var(--ink-3);margin-left:8px}
.lap.warn{color:var(--warn)}
.lap.bad{color:var(--bad);font-weight:700}
.tlc.pend{background:repeating-linear-gradient(135deg,transparent,transparent 7px,var(--warn-soft) 7px,var(--warn-soft) 14px)}
.tlc.pend:hover{background:var(--warn-soft)}
.tlc .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlc .mt{font-size:11.5px;color:var(--ink-3);font-family:Consolas,monospace}
.scroll{max-height:360px;overflow:auto}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line)}
.cal .wd{background:var(--surf-2);padding:4px 6px;font-size:10.5px;font-weight:700;color:var(--ink-3);text-align:center}
.cell{background:var(--surf);min-height:62px;padding:4px 6px;display:flex;flex-direction:column;gap:3px;
  min-width:0;border:0;text-align:left;font:inherit;cursor:default}
.cell.off{background:var(--surf-3)}
.cell .dn{font-family:Consolas,monospace;font-size:11px;color:var(--ink-3);font-weight:700}
.cell .cnt{font-size:11.5px;font-weight:700}
.cell .dots{display:flex;gap:2px;flex-wrap:wrap}
.cd{width:7px;height:7px;background:var(--ok)}
.cd.w{background:var(--warn)} .cd.b{background:var(--bad)}
.cell.has{cursor:pointer} .cell.has:hover{background:var(--acc-soft)}
.cell.sel{background:var(--acc-soft);box-shadow:inset 0 0 0 2px var(--acc)}

/* 검수 패널 */
.insp{border-top:2px solid var(--acc);background:var(--surf)}
.insph{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--acc-soft);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.insph b{font-size:13.5px;color:var(--acc-ink)}
.inspsum{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.inspsum div{flex:1 1 104px;background:var(--surf);padding:7px 10px;min-width:0}
.inspsum .k{font-size:10.5px;color:var(--ink-3)}
.inspsum .v{font-family:Consolas,monospace;font-size:14px;font-weight:700}
.inspsum .v.neg{color:var(--bad)} .inspsum .v.pos{color:var(--ok)}
.mine{border:1px solid var(--warn);background:var(--warn-soft);padding:8px 12px;font-size:12.5px;
  color:var(--warn);font-weight:600;margin:10px 12px}
tr.diff td{background:var(--warn-soft)}
tr.need td{background:var(--bad-soft)}
td input.q{width:62px;text-align:right;font-family:Consolas,monospace;font-size:16px;padding:2px 5px}
.tw thead th{position:sticky;top:0;z-index:2;background:var(--surf-2)}
.btn.dgr.go{background:var(--bad);border-color:var(--bad);color:#fff}
td select.rs{font-size:11.5px;padding:1px 4px;max-width:160px}
.inspft{padding:10px 13px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line)}

/* 월마감 단계 */
.stg{border-bottom:1px solid var(--line)}
.stg:last-child{border-bottom:0}
.stg.lock .stgh{opacity:.55}
.stgh{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:10px 13px;align-items:center;
  background:var(--surf);cursor:pointer;border:0;width:100%;text-align:left;font:inherit}
.stgh:hover{background:var(--surf-2)}
.stgn{width:22px;height:22px;border:1px solid var(--line-2);display:grid;place-items:center;border-radius:2px;
  font-family:Consolas,monospace;font-size:11px;font-weight:700;color:var(--ink-3)}
.stgn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.stgn.now{background:var(--warn);border-color:var(--warn);color:#fff}
.stgt b{font-size:13.5px}
.stgt .s{font-size:11.5px;color:var(--ink-3)}
.stgb{background:var(--surf-2);border-top:1px solid var(--line)}
.gridc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line)}
.gc{background:var(--surf);padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.gc .k{font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.gc .v{font-family:Consolas,monospace;font-size:12px;color:var(--ink-3)}
.gc.wait{background:var(--warn-soft)}
.bar{height:4px;background:var(--surf-3);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.bar i.part{background:var(--warn)}
/* 지금 할 일 — 순서를 설명하지 않고 걸음 하나만 지목한다 */
.gridc.two{grid-template-columns:1fr 1fr}
@media (max-width:700px){ .gridc.two{grid-template-columns:1fr} }
.gridc.two .drop{margin:0}
/* 근거 그림 — 두 장을 잇는다 */
.jn{margin:0 11px 9px;padding:11px;border:1px solid var(--acc);background:var(--surf)}
.jn.no{border-color:var(--warn)}
.jn.left{border-color:var(--warn)}
.jl.w{background:var(--warn)} .jl.w span{background:var(--warn)}
.jd.w i{border-top-color:var(--warn)}
.jg.w span{background:var(--warn)}
.jg.w span.s{background:none;color:var(--ink-3)}
.jk.done{color:var(--ink-3);background:var(--surf-3)}
.jk.done b{color:var(--ink-3)}
.jnr{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;gap:0}
@media (max-width:640px){ .jnr{grid-template-columns:1fr} }
.jc{border:1px solid var(--line);background:var(--surf-2);padding:8px 10px;border-radius:3px}
.jc.dim{opacity:.55}
.jh{font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);margin-bottom:5px}
.jv{font-size:13.5px;font-weight:600;line-height:1.45}
.jv.s{font-size:12px;font-weight:400;color:var(--ink-3)}
.jk{margin-top:5px;font-size:12.5px;padding:3px 6px;border-radius:2px;color:var(--ink-2)}
.jk b{font-family:var(--mono);font-weight:700;color:var(--ink)}
.jk.on{background:var(--acc-soft);color:var(--acc-ink);box-shadow:inset 2px 0 0 var(--acc)}
.jk.on b{color:var(--acc-ink)}
.jk.off{color:var(--ink-3);text-decoration:line-through}
.jk.off b{color:var(--ink-3);font-weight:400}
.jl{position:relative;height:3px;background:var(--acc);display:grid;place-items:center}
.jl.x{background:var(--line-2)}
.jl span{position:absolute;top:-9px;white-space:nowrap;font-size:11px;padding:1px 6px;
  background:var(--acc);color:#fff;border-radius:9px}
.jl.x span{background:var(--line-2);color:var(--ink-2)}
@media (max-width:640px){ .jl{height:26px;width:3px;margin:0 auto} .jl span{top:auto} }
.jd{height:20px;display:grid;place-items:center}
.jd i{display:block;width:0;height:0;border:6px solid transparent;border-top-color:var(--acc);margin-top:6px}
.jd.x i{border-top-color:var(--line-2)}
.jg{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}
.jg span{font-family:var(--mono);font-size:13.5px;font-weight:700;padding:5px 11px;
  background:var(--acc);color:#fff;border-radius:3px}
.jg span.s{font-family:var(--body);font-size:12px;font-weight:400;background:none;color:var(--ink-3);padding:0}
.jg.x span{background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn)}
.jg.x span.s{background:none;border:0;color:var(--ink-3)}

.why{border:1px solid var(--acc);background:var(--surf);margin:0 11px 9px}
.why.no{border-color:var(--warn)}
.whyh{padding:6px 11px;background:var(--acc-soft);color:var(--acc-ink);
  font-size:12.5px;font-weight:700;border-bottom:1px solid var(--acc)}
.why.no .whyh{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.why .tw{margin:0;border:0}
.why table{font-size:12.5px}
.why td:first-child{white-space:nowrap;color:var(--ink-2)}
/* 누르는 것 셋 */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (max-width:820px){ .acts{grid-template-columns:1fr} }
.act{display:grid;grid-template-columns:30px 1fr auto 16px;gap:9px;align-items:center;
  background:var(--surf);border:0;padding:10px 12px;text-align:left;width:100%}
.act:hover{background:var(--surf-2)}
.act.open{background:var(--acc-soft)}
.act .an{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--ink-3)}
.act.done .an{color:var(--ok)} .act.now .an{color:var(--acc)}
.act .at b{font-size:13.5px}
.act .at .s{font-size:11.5px;color:var(--ink-3);line-height:1.5}
.act .av{text-align:right;font-family:var(--mono);font-size:13px;font-weight:700;white-space:nowrap}
.act .av .pill{font-family:var(--body);font-weight:400}
.act .ax{color:var(--ink-3);font-size:11px}
.actb{border-bottom:1px solid var(--line);background:var(--surf-2)}
/* 배부 흐름 */
.flowbox{padding:11px 13px;border-bottom:1px solid var(--line);background:var(--surf-2)}
.leg2{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;margin-bottom:8px}
.leg2 i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;border-radius:2px}
.scrx{overflow-x:auto}
/* 대장 줄 펼침 */
td.lgev{background:var(--acc-soft);padding:11px 13px}
.lgw{display:grid;grid-template-columns:minmax(330px,1.15fr) 1.6fr;gap:16px}
@media (max-width:760px){ .lgw{grid-template-columns:1fr} }
.lgh{font-size:13px;margin-bottom:3px}
.lgw table{background:transparent;font-size:12px}
.lgw td{border-bottom:1px solid var(--line);padding:3px 7px}
/* 값이 «어느 자료» 에서 왔는지 — 왼칸이 출처, 가운뎃칸이 무엇, 오른칸이 값.
   값이 잘리면 표의 뜻이 없어진다 — 값 칸을 먼저 확보하고 설명 칸을 줄인다 */
.srcw{border:0}
.srcw table{table-layout:auto;width:100%}
.srcw td{vertical-align:top}
.srcw td.sw{font-weight:600;color:var(--ink-2)}
.srcw td.sw .hint{font-weight:400;font-size:11px;line-height:1.35;margin-top:1px}
.srcw td.n{white-space:nowrap;width:1%;padding-left:13px}
.srcw tr:last-child td{border-bottom:0;border-top:1px solid var(--line-2);padding-top:5px}
.srcw tr:last-child td.sw{color:var(--ink)}
.todo{display:flex;gap:11px;align-items:center;flex-wrap:wrap;padding:10px 14px;
  background:var(--acc-soft);color:var(--acc-ink);border-bottom:1px solid var(--line)}
.todo b{font-size:14px}
.todo.done{background:var(--ok-soft);color:var(--ok)}

/* 미리보기 → 적용 — 제안은 사라지는 알림이 아니라 읽고 판단하는 물건이다 */
.prev{border:1px solid var(--acc);background:var(--surf);margin:11px 0}
.prevh{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:8px 11px;
  background:var(--acc-soft);color:var(--acc-ink);border-bottom:1px solid var(--acc);font-size:13.5px}
.prevb{padding:2px 0}
.prevb .tw{margin:0;border:0;border-bottom:1px solid var(--line)}

/* 용어 물음표 — 모르면 판단 자체가 안 되는 다섯 개에만 */
i.q{display:inline-grid;place-items:center;width:14px;height:14px;margin-left:4px;
  border:1px solid var(--line-2);border-radius:50%;font-style:normal;font-size:10px;
  color:var(--ink-3);cursor:pointer;vertical-align:middle}
i.q:hover{border-color:var(--acc);color:var(--acc)}

.rst{padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;
  border-top:1px solid var(--line);background:var(--surf-2)}
.rst .hint{flex:1 1 220px}
.rst.on{display:block;border-left:3px solid var(--bad);background:var(--bad-soft)}
.rst.on .hint{display:block;margin-top:3px}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.drop{border:1px dashed var(--line-2);background:var(--surf);padding:12px;text-align:center;
  font-size:12.5px;color:var(--ink-3);margin:10px;transition:background .12s,border-color .12s}
.drop.over{border-color:var(--acc);border-style:solid;background:var(--acc-soft);color:var(--acc-ink)}
.drop.over b{color:var(--acc-ink)}
.drop b{color:var(--ink)}
.vrow{display:grid;grid-template-columns:24px 1fr auto;gap:9px;padding:7px 12px;
  border-bottom:1px solid var(--line);align-items:center;background:var(--surf)}
.vrow:last-child{border-bottom:0}
.vmk{width:18px;height:18px;display:grid;place-items:center;font-size:11px;border-radius:2px;
  border:1px solid var(--line-2);color:var(--ink-3)}
.vmk.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.vmk.no{background:var(--bad);border-color:var(--bad);color:#fff}
.vmk.wait{background:var(--surf-3)}
.confirm{padding:12px 13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surf)}
.tiles{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.tiles>div{flex:1 1 140px;background:var(--surf);padding:8px 11px;min-width:0}
.tiles .k{font-size:10.5px;color:var(--ink-3)}
.tiles .v{font-family:Consolas,monospace;font-size:16px;font-weight:700}
.tiles .s{font-size:10.5px;color:var(--ink-3)}
.tiles .neg .v{color:var(--bad)} .tiles .pos .v{color:var(--ok)} .tiles .cau .v{color:var(--warn)}
@media (max-width:720px){ .tlday{grid-template-columns:62px 1fr} }
</style>
</head>
<body>
<div id="demobar">
  <b>데모</b>
  <span>실운영 중인 월 매입 마감 앱의 화면·서버 판정 로직 그대로. 저장소는 이 페이지 안 메모리, 데이터는 가상 품번·가상 거래처 연습파일입니다. 눌러보는 건 다 되고, 새로고침하면 초기화됩니다.</span>
  <a href="../../">← 포트폴리오</a>
</div>
<style>
#demobar{position:sticky;top:0;z-index:9999;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:#fff8e1;border-bottom:1px solid #f0dfa8;padding:9px 16px;font-size:12.5px;color:#6b5b21;
  font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}
#demobar b{background:#6b5b21;color:#fff8e1;padding:2px 8px;border-radius:10px;font-size:11.5px}
#demobar a{margin-left:auto;color:#6b5b21;font-weight:700;text-decoration:none}
</style>

<div id="hold"><div class="card"><div class="sp"></div>
  <b id="holdT">불러오는 중…</b>
  <div class="bar ind" id="holdB" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div>
  <span class="el" id="holdE"></span>
</div></div>

<div class="wrap">
  <div id="notes"></div>

  <div class="app">
    <div class="appbar">
      <span class="ttl">입고 마감</span>
      <select id="ym"></select>
      <span id="ymStock" hidden class="ymstock"></span>
      <span class="work" id="work"><i></i><b id="workmsg"></b></span>
      <span class="lap" id="lap" title="마지막 서버 왕복"></span>
      <span id="brandsel" style="margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3)"></span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-t="case">입고 건 <span class="c" id="tcCase"></span></button>
      <button class="tab" role="tab" aria-selected="false" data-t="close">입고대장 <span class="c" id="tcClose"></span></button>
      <button class="tab" role="tab" aria-selected="false" data-t="stock" hidden>기간 보기 <span class="c" id="tcStock"></span></button>
    </div>

    <!-- 입고 건 -->
    <div id="pCase">
      <div class="secth"><span id="barTools"></span>
        <span style="margin-left:auto" class="hint" id="lsInfo"></span></div>
      <div class="secth"><b>이 달 입고 건</b> <span class="pill acc" id="tlCnt"></span>
        <span class="hint">건을 누르면 검수 화면이 열립니다</span>
        <span style="margin-left:auto"><button class="btn sm" id="bOnlyLeft" aria-pressed="false">안 끝난 것만</button></span></div>
      <div class="scroll" id="tl"><div class="skel">불러오는 중…</div></div>
      <div id="insp"></div>
      <div class="sect">
        <div class="secth"><b id="calTtl">달력</b> <span class="hint">이 달 어디가 비었나</span>
          <span style="margin-left:auto" class="hint">
            <span class="cd" style="display:inline-block;vertical-align:middle"></span> 끝남
            <span class="cd w" style="display:inline-block;vertical-align:middle;margin-left:7px"></span> 진행
            <span class="cd b" style="display:inline-block;vertical-align:middle;margin-left:7px"></span> 사유 미선택</span></div>
        <div class="cal" id="cal"></div>
      </div>
    </div>

    <!-- 월마감 -->
    <div id="pClose" hidden><div class="skel">불러오는 중…</div></div>

    <!-- 수불부 「수」 -->
    <div id="pStock" hidden><div class="skel">불러오는 중…</div></div>
  </div>
</div>
<input type="file" id="ff" hidden>

<script>
var PRELOAD = null;
var S = { boot:null, ym:null, br:'', id:null, det:null, cache:{}, onlyLeft:false, day:null,
          pend:{}, saveT:null, inflight:0, el:{}, kind:null, close:null, closeYm:null, openStg:0, rst:null };

function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmt(n){ n=Math.round(n||0); return (n<0?'(':'')+Math.abs(n).toLocaleString('ko-KR')+(n<0?')':''); }
function sgn(n){ return n>0?('+'+fmt(n)):fmt(n); }
function fmtu(n){ return Number(n||0).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function curYm(){ var e=$('ym'); return (e&&e.value)||S.ym||null; }

var BR_DEPT = {HR:'A본부',OD:'C본부',UV:'C본부',OH:'C본부',EL:'C본부',OA:'C본부',
               GL:'B본부',SN:'B본부',UO:'운영', PR:'A본부'};

/* ── 알림은 화면 안에 ─────────────────────────── */
/** note(msg, lv, keep) — 인자 순서·의미는 그대로다(늘리기만 했다).
    lv : info(기본) 6초 · ok 3초 뒤 스스로 사라진다.
         warn 6초. bad 는 남는다. «done» 을 새로 뒀다 — 남는다.
    keep : 참이면 등급과 무관하게 남는다(기존 그대로).
    결과 알림(«무엇이 몇 건 적용됐다»)은 done 으로 띄운다 —
    3초 만에 사라지면 아래쪽에서 일하던 사람은 결과를 본 적이 없게 된다. */
function note(msg, lv, keep){
  lv = lv || 'info';
  var stay = !!keep || lv==='bad' || lv==='done';
  var d=document.createElement('div');
  d.className='note '+lv;
  d.innerHTML='<span class="t">'+esc(msg)+'</span>'
    +(stay?('<span class="w">'+hm_()+'</span>'):'')
    +'<button class="x" title="닫기">✕</button>';
  d.querySelector('.x').onclick=function(){ d.remove(); fitNotes_(); };
  $('notes').appendChild(d);
  trimNotes_();
  // 남기는 알림도 스스로 사라진다 — 하나씩 닫아야 하는 것이 쌓이면 그게 일거리가 된다.
  // 실패(bad)만 사람이 닫을 때까지 남는다.
  if(lv!=='bad'){
    var ms = (lv==='ok' && !keep) ? 3000 : (lv==='info' && !keep ? 6000 : 12000);
    setTimeout(function(){ d.remove(); fitNotes_(); }, ms);
  }
  return d;
}
function hm_(){ var t=new Date();
  return ('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2); }
/* 남는 알림이 쌓여 화면을 덮지 않게 — 여섯 개를 넘으면 오래된 것부터 접는다 */
function trimNotes_(){
  var b=$('notes'); while(b.children.length>6) b.removeChild(b.firstChild);
  fitNotes_();
}
/* 맨 아래까지 내렸을 때 알림이 밑의 글을 덮지 않게 그만큼 자리를 비워 둔다 —
   결과를 보라고 띄운 것이 정작 그 사람이 읽던 줄을 가리면 앞뒤가 안 맞는다 */
function fitNotes_(){
  var b=$('notes'); if(!b) return;
  requestAnimationFrame(function(){
    var h = b.children.length ? Math.round(b.getBoundingClientRect().height)+18 : 0;
    document.body.style.paddingBottom = h ? (60+h)+'px' : '';
  });
}
function work(on,msg){ $('work').className='work'+(on?' on':''); $('workmsg').textContent=msg||''; }

/** 화면을 막는다 — 숫자가 «전부» 바뀌는 일에만. 400ms 늦게 뜬다
    (짧은 일에 깜박이면 그게 더 거슬린다).

      hold(on, title, sub, pct)
        on    참이면 띄우고 거짓이면 내린다
        title 굵은 줄 — 무엇을 하는 중인지
        sub   작은 줄 — 지금 어느 대목인지(파일 이름·단계 문구)
        pct   0~1 진행률. 주면 막대가 그만큼 차고 «43%» 가 뜬다.
              «안 주면» — 새로 띄울 때는 불확정(좌우로 흐르는 띠),
              이미 떠 있으면 지금 막대를 그대로 둔다(글자만 갈린다).
      hold.step(sub, pct)  떠 있는 동안 아랫줄·막대만 갈아끼운다. 둘 다 없어도 된다.

    경과 초는 세지 않는다 — 몇 초인지는 정보가 아니라 불안이다.
    진행률을 모르는 부름에서 «멈춘 것 같다» 를 막는 것은 두 가지다:
    ① 흐르는 띠(멈추면 띠도 멈춘다) ② 부르는 쪽이 갈아끼우는 단계 문구.
    그래도 답이 없으면 5초·20초에 «안내 한 줄» 을 한 번씩만 적는다(숫자는 없다). */
var _H={t:null,w1:null,w2:null};
function holdBar_(pct){
  var b=$('holdB'); if(!b) return;
  var card=b.parentNode, i=b.firstChild;
  var n=(pct==null||isNaN(Number(pct)))?null:Math.max(0,Math.min(1,Number(pct)));
  if(n===null){
    b.className='bar ind'; i.style.width=''; card.className='card';
    b.removeAttribute('aria-valuenow'); $('holdE').textContent='';
  }else{
    b.className='bar'; i.style.width=(n*100).toFixed(1)+'%'; card.className='card pct';
    b.setAttribute('aria-valuenow', String(Math.round(n*100)));
    $('holdE').textContent=Math.round(n*100)+'%';
  }
}
function hold(on, title, sub, pct){
  var box=$('hold');
  if(!on){
    clearTimeout(_H.t); clearTimeout(_H.w1); clearTimeout(_H.w2);
    _H.t=_H.w1=_H.w2=null;
    box.className=''; $('holdE').textContent='';
    return;
  }
  // sub 은 받기만 하고 안 그린다 — 막아 놓고 무슨 일인지 설명할 이유가 없다.
  // 도는 고리와 차오르는 막대로만 알린다.
  if(_H.t || box.className==='on'){          // 이미 떠 있다 — 준 것만 갈아끼운다
    if(title!=null) $('holdT').textContent=title;
    if(pct!=null) holdBar_(pct);
    return;
  }
  $('holdT').textContent=title||'불러오는 중…';
  holdBar_(pct);
  _H.t=setTimeout(function(){ box.className='on'; },400);
}
hold.step=function(sub, pct){
  if(pct!=null) holdBar_(pct);
};
/** 화면은 그대로 두고 «그 단추» 가 말한다. 두 번 눌리는 길을 물리적으로 막는다.
    초는 세지 않는다 — 단추 밑에 작은 불확정 막대가 흐른다.
    돌려주는 done() 을 부르면 원래대로. done.step('…') 으로 글자만 갈 수도 있다. */
function btnGo(el, msg){
  if(!el) return function(){};
  var old=el.textContent, was=!!el.disabled;
  el.disabled=true; el.textContent=msg||'하는 중…';
  el.className=el.className.replace(/\s*\bbusy\b/g,'')+' busy';
  var done=function(){
    el.className=el.className.replace(/\s*\bbusy\b/g,'');
    el.disabled=was; el.textContent=old;
  };
  done.step=function(t){ el.textContent=t||msg||'하는 중…'; };
  return done;
}
/** 왕복 시간을 찍는다. 서버가 5ms 라도 오고 가는 데 몇 초면 그게 느린 것이다. */
function lap(fn,ms){
  var el=$('lap'); if(!el) return;
  el.textContent=fn+' '+ms+'ms';
  el.className='lap'+(ms>2500?' bad':(ms>1200?' warn':''));
}
/* 같은 부름이 아직 서버에 있으면 또 보내지 않는다 — 대신 «그 답» 을 같이 받는다.
   되돌려 보내지 않고 답을 나눠 주는 이유: 연타로 두 번째가 그냥 죽으면
   그것을 기다리던 자리(파일 줄줄이 올리기 등)가 영영 안 데모 사용자다.
   열쇠는 함수 이름 + 인자 — 파일 본문 같은 긴 문자열은 길이+앞머리로 줄인다. */
var _RUN={};
function runKey_(fn,args){
  var p=(args||[]).map(function(a){
    if(a==null) return '~';
    var t=typeof a;
    if(t==='string') return a.length>48 ? ('§'+a.length+':'+a.slice(0,24)) : a;
    if(t==='object'){ var j; try{ j=JSON.stringify(a); }catch(e){ return '?'; }
      return j.length>96 ? ('§'+j.length+':'+j.slice(0,48)) : j; }
    return String(a);
  });
  return fn+'('+p.join('\u0001')+')';
}
function run(fn,args,ok,fail){
  var key=runKey_(fn,args), w=_RUN[key];
  if(w){ w.ok.push(ok); w.fail.push(fail); return; }   // 연타 — 서버로 또 보내지 않는다
  w=_RUN[key]={ok:[ok],fail:[fail]};
  var t0=Date.now();
  google.script.run
    .withSuccessHandler(function(r){
      delete _RUN[key]; lap(fn,Date.now()-t0);
      w.ok.forEach(function(f){ f&&f(r); });
    })
    .withFailureHandler(function(e){
      delete _RUN[key]; lap(fn,Date.now()-t0);
      var m=(e&&e.message)||String(e), said=false;
      w.fail.forEach(function(f){
        if(f) f(m);
        else if(!said){ said=true; work(false); note(m,'bad',true); }
      });
    })
    [fn].apply(null,args||[]);
}

/* ── 부팅 ─────────────────────────────────────── */
function boot(ym, quiet){
  if(!quiet) $('tl').innerHTML='<div class="skel">불러오는 중…</div>';
  var want=ym;
  run('apiBoot',[ym],function(b){
    if(want && String(b.ym)!==String(want)) return;
    S.boot=b; S.ym=b.ym;
    syncMonths(); renderBrands(); renderTools(); renderAll();
  });
}
function bootInline(){
  if(!PRELOAD || !PRELOAD.rows) return false;
  S.boot=PRELOAD; S.ym=PRELOAD.ym;
  syncMonths(); renderBrands(); renderTools(); renderAll();
  return true;
}
function syncMonths(){
  var b=S.boot, cur=curYm()||S.ym;
  var list=(b&&b.months&&b.months.length)?b.months.slice():[S.ym];
  if(cur && list.indexOf(cur)<0) list.push(cur);
  list.sort();
  $('ym').innerHTML=list.map(function(m){ return '<option'+(m===cur?' selected':'')+'>'+m+'</option>'; }).join('');
}
$('ym').onchange=function(){
  var v=$('ym').value;
  S.ym=v; S.id=null; S.det=null; S.cache={}; S.day=null; S.close=null; S.closeYm=null; S.pf=0;
  $('insp').innerHTML='';
  boot(v);
  if(!$('pClose').hidden) closeBoot(v);
  // 수불부도 그 달로 다시 잡는다 — 안 그러면 위는 9월인데 아래는 8월을 보여 준다
  if(typeof stockMonth==='function') stockMonth(v);
};

/* ── 브랜드 ───────────────────────────────────── */
function brandsOfMonth(){
  var m={}, mine=(S.boot&&S.boot.myBrands)||null;
  (S.boot.rows||[]).forEach(function(r){
    (r.brands||[]).forEach(function(b){
      if(mine && mine.indexOf(b)<0) return;
      var c=m[b]||(m[b]={n:0,sku:0});
      c.n++; c.sku += (r.B&&r.B[b]?r.B[b].sku:0);
    });
  });
  if(typeof kBrands==='function') kBrands().forEach(function(b){
    if(mine && mine.indexOf(b)<0) return;
    if(!m[b]) m[b]={n:0,sku:0};        // ERP에는 있는데 검수 건이 없는 브랜드
  });
  return m;
}
function renderBrands(){
  var m=brandsOfMonth(), keys=Object.keys(m).sort(function(a,b){ return m[b].sku-m[a].sku; });
  var mine=(S.boot&&S.boot.myBrands)||null;
  if(mine && mine.length===1) S.br=mine[0];
  var h='<span>브랜드</span>';
  if(mine && mine.length===1){
    h+='<b style="color:var(--acc)">'+esc(S.br)+' · '+(BR_DEPT[S.br]||'')+'</b>';
  }else{
    h+='<select id="brsel"><option value="">전체'+(mine?(' (담당 '+mine.join('·')+')'):(' · '+(S.boot.rows||[]).length+'건'))+'</option>'
      +keys.map(function(b){
        return '<option value="'+b+'"'+(S.br===b?' selected':'')+'>'+b+' · '+BR_DEPT[b]+' — '+m[b].n+'건</option>';
      }).join('')+'</select>';
  }
  var me=(S.boot&&S.boot.me)||{};
  h+='<span class="role '+esc(me.role||'열람')+'">'+esc(me.role||'열람')+'</span>';
  if(S.boot.dbUrl) h+=' <a href="'+esc(S.boot.dbUrl)+'" target="_blank" class="hint">DB</a>';
  $('brandsel').innerHTML=h;
  var sel=$('brsel');
  if(sel) sel.onchange=function(){
    S.br=sel.value; S.day=null;
    renderBrands(); renderAll();
    if(S.det){ if(!detRows().length){ S.id=null; S.det=null; $('insp').innerHTML=''; } else renderInsp(); }
    if(!$('pClose').hidden) closeRender();
    if(!$('pStock').hidden && typeof stockRender==='function') stockRender();
  };
}

/* ── 상단 도구 ────────────────────────────────── */
function renderTools(){
  var b=S.boot, h='';
  if(b.canProd) h+='<button class="btn sm" id="bLs">라인시트에서 직접 고르기</button>'
    +'<button class="btn sm" id="bPlan">출고현황표</button><button class="btn sm" id="bPack">입고명세서</button>';
  if(b.canLogi) h+='<button class="btn sm" id="bWms">WMS 전표</button>';
  if(!b.canProd&&!b.canLogi) h+='<span class="hint">열람 권한입니다.</span>';
  $('barTools').innerHTML=h;
  var ls=b.ls||{};
  $('lsInfo').textContent = ls.n ? ('라인시트 '+Number(ls.n).toLocaleString('ko-KR')+'행'+(ls.at?(' · '+ls.at+' 읽음'):'')) : '라인시트 미적재';
  if($('bLs')) $('bLs').onclick=lsModal;
  if($('bPlan')) $('bPlan').onclick=function(){ pick('plan'); };
  if($('bPack')) $('bPack').onclick=function(){ pick('pack'); };
  if($('bWms')) $('bWms').onclick=function(){ pick('wms'); };
  $('bOnlyLeft').onclick=function(){
    S.onlyLeft=!S.onlyLeft;
    this.setAttribute('aria-pressed',String(S.onlyLeft));
    this.textContent=S.onlyLeft?'전체 보기':'안 끝난 것만';
    renderTl();
  };
}

/* ── 건 목록 ──────────────────────────────────── */
/** 라인시트에 있는데 아직 건이 안 된 차수 — 사람이 만들지 않는다, 이미 떠 있다 */
function visPending(){
  var mine=(S.boot&&S.boot.myBrands)||null;
  return (S.boot.pending||[]).filter(function(p){
    var bs=(p.styles||[]).map(function(x){ return String(x).slice(0,2).toUpperCase(); });
    if(S.br) return bs.indexOf(S.br)>=0;
    if(mine) return bs.some(function(b){ return mine.indexOf(b)>=0; });
    return true;
  }).map(function(p){ var o={}; for(var k in p) o[k]=p[k]; o.pending=true; return o; });
}
function pendTags(p){
  var seen={}, out=[];
  (p.styles||[]).forEach(function(x){
    var b=String(x).slice(0,2).toUpperCase();
    if(!seen[b]){ seen[b]=1; out.push('<span class="dp '+(BR_DEPT[b]||'')+'">'+esc(b)+'</span>'); }
  });
  return out.join('');
}
function visRows(){
  var mine=(S.boot&&S.boot.myBrands)||null;
  return (S.boot.rows||[]).filter(function(r){
    if(S.br) return r.B && r.B[S.br];
    if(mine) return (r.brands||[]).some(function(b){ return mine.indexOf(b)>=0; });
    return true;
  });
}
function cv(r,k){
  if(!S.br) return r[k];
  var c=r.B&&r.B[S.br]; if(!c) return 0;
  return c[k]||0;
}
function cbr(r){ return S.br?[S.br]:(r.brands||[]); }
function cstate(r){
  if(!S.br) return r.state;
  var c=r.B&&r.B[S.br]; if(!c) return '–';
  if(r.state==='확인 완료') return '확인 완료';
  if(c.need) return '사유 '+c.need+'건 미선택';
  if(!c.diff) return r.has_wms?'전량 입고':'예정만';
  return '검수 완료';
}
function stCls(st){
  return (st==='확인 완료'||st==='검수 완료'||st==='전량 입고')?'ok'
    :(st.indexOf('미선택')>=0?'bad':(st==='예정만'?'mut':'warn'));
}
function brTags(r){
  return cbr(r).map(function(b){
    return '<span class="dp '+(BR_DEPT[b]||'')+'" title="'+(BR_DEPT[b]||'')+'">'+esc(b)+'</span>';
  }).join('');
}
function isLeft(r){ var st=cstate(r); return !(st==='확인 완료'||st==='검수 완료'||st==='전량 입고'); }
function stepDots(r){
  var st=cstate(r), need=st.indexOf('미선택')>=0;
  var s1=r.asked?'on':(r.has_plan?'now':'');      // ① 예정 확정 = 검수 의뢰까지
  var s2=(st==='확인 완료'||st==='검수 완료'||st==='전량 입고')?'on':(need?'blk':(r.has_plan?'now':''));
  return '<span class="steps"><span class="sd '+s1+'" title="① 예정 확정 — 생산">1</span>'
    +'<span class="sd '+s2+'" title="② 검수 — 물류">2</span></span>';
}
function renderAll(){ renderTl(); renderCal(); syncTabs();
  setTimeout(prefetch, 300);        // 화면부터 그리고, 그 다음 조용히 미리 받는다
}
function syncTabs(){
  var rows=visRows(), left=rows.filter(isLeft);
  $('tcCase').textContent=(rows.length-left.length)+'/'+rows.length;
  $('tcCase').className='c'+(left.length?' bad':'');
  $('tcClose').textContent=left.length?'대기':'열림';
  $('tcClose').className='c'+(left.length?' bad':'');
}
function renderTl(){
  var rows=visRows(), left=rows.filter(isLeft), pend=visPending();
  $('tlCnt').textContent=(S.br?S.br+' ':'')+rows.length+'건'
    +(pend.length?(' · 예정 '+pend.length):'')
    +(left.length?(' · 안 끝난 것 '+left.length):(rows.length?' · 전부 끝남':''));
  var use=(S.onlyLeft?left:rows).concat(pend);
  if(!use.length){
    $('tl').innerHTML='<div class="skel">이 달 입고 예정이 없습니다.'

        var offYm = /^\d{4}-\d{2}/.test(String(r['출고일']||'')) && String(r['출고일']).slice(0,7)!==String(S.ym);
        return '<div class="tlc'+(S.id===r.id?' on':'')+'" data-id="'+esc(r.id)+'">'
          +'<span class="nm">'+esc(r['출고처']||'–')+' '+brTags(r)
          +(offYm?' <span class="pill bad" title="이 달 건이 아닙니다">'+esc(String(r['출고일']).slice(0,7))+'</span>':'')
            +(r['입고처']?' <span class="mut" style="font-size:11.5px">→ '+esc(r['입고처'])+'</span>':'')+'</span>'
          +'<span class="mt">'+(cv(r,'sku')||r.sku||0)+'행 · '+fmt(cv(r,'act'))+'PC'
            +(cv(r,'diff')?(' <b style="color:var(--bad)">'+sgn(cv(r,'diff'))+'</b>'):'')+'</span>'
          +'<span class="mt">'+(cv(r,'amt')?fmt(cv(r,'amt')):'–')+'</span>'
          +stepDots(r)
          +'<span class="pill '+stCls(st)+'">'+esc(st)+'</span></div>';

  }).join('');
  $('tl').querySelectorAll('.tlc[data-id]').forEach(function(el){

  });
}
function renderCal(){

  $('calTtl').textContent = ym ? (ym.slice(0,4)+'년 '+Number(ym.slice(5,7))+'월') : '달력';
  if(!m){ $('cal').innerHTML=''; return; }

      for(var i=0;i<days.length;i++){

/* ── 검수 패널 ────────────────────────────────── */
function detRows(){
  var R=(S.det&&S.det.rows)||[];
  if(!S.br) return R;
  return R.filter(function(r){ return String(r.item||'').slice(0,2).toUpperCase()===S.br; });
}
function inA(x){ return !!(S.det && S.det.reasons.a.indexOf(x)>=0); }
function inB(x){ return !!(S.det && S.det.reasons.b.indexOf(x)>=0); }

/** 목록을 보는 동안 상세를 미리 받아 둔다 — 누르는 순간 기다릴 일이 없게.
 *  서버는 한 건에 몇 ms 라 40건을 한 번에 받아도 싸다. 비싼 건 왕복이다. */
function prefetch(){
  if(S.pf) return;
  var want=visRows().filter(function(r){ return !S.cache[r.id]; })
                    .sort(function(a,b){ return (isLeft(b)?1:0)-(isLeft(a)?1:0); })
                    .slice(0,40).map(function(r){ return r.id; });
  if(!want.length) return;
  S.pf=1;
  run('apiDetails',[S.ym,want],function(m){
    S.pf=0;
    Object.keys(m||{}).forEach(function(k){ if(!S.cache[k]) S.cache[k]=m[k]; });
    // 월마감도 미리 받아 둔다 — 탭을 누르는 순간 기다릴 일이 없게
    if(!S.close && typeof closeBoot==='function') closeBoot(S.ym, true);
  },function(){ S.pf=0; });
}

function openDetail(id){
  flush(true);
  S.id=id;
  $('tl').querySelectorAll('.tlc').forEach(function(el){
    el.className='tlc'+(el.getAttribute('data-id')===id?' on':''); });
  if(S.cache[id]){ S.det=S.cache[id]; renderInsp(); toInsp(); return; }
  $('insp').innerHTML='<div class="insp"><div class="skel">여는 중…</div></div>';
  run('apiDetail',[S.ym,id],function(d){
    S.cache[id]=d; S.id=id; S.det=d;
    try{ renderInsp(); toInsp(); }
    catch(err){ $('insp').innerHTML=''; note('화면을 그리다 멈췄습니다 — '+((err&&err.message)||err),'bad',true); }
  },function(m){ $('insp').innerHTML=''; note('건을 열지 못했습니다 — '+m,'bad',true); });
}

/** 검수 화면으로 데려간다. 노트북처럼 세로가 짧으면 목록에 가려 안 보인다. */
function toInsp(){
  var el=$('insp'); if(!el || !el.firstChild) return;
  setTimeout(function(){
    try{ el.scrollIntoView({behavior:'smooth', block:'start'}); }
    catch(e){ el.scrollIntoView(true); }
  }, 40);
}

function inspSum(){
  var R=detRows(), sheet=0, plan=0, act=0, need=0, amt=0, D=0, gap=0;
  R.forEach(function(r){
    r.diff=r.act-r.plan; r.amt=r.diff*r.cost;
    var ga=r.reasons.some(inA), gb=r.reasons.some(inB);
    r.kind=(ga&&gb)?'둘 다':(ga?'오부착':(gb?'실수량부족':''));
    sheet+=(r.sheet||r.plan); plan+=r.plan; act+=r.act; amt+=r.amt;
    if((r.sheet||r.plan)!==r.plan) gap++;
    if(r.diff){ D++; if(!r.reasons.length) need++; }
  });
  return { sheet:sheet, plan:plan, act:act, diff:act-plan, gap:gap, need:need, D:D, amt:amt, sku:R.length,
           state: !D ? (R.some(function(r){return r.wms!=null;})?'전량 입고':'예정만')
                     : (need?('사유 '+need+'건 미선택'):'검수 완료') };
}

/** 누구의 차례인가 — 생산이 명세서로 맞추고 의뢰해야 물류가 검수한다 */
function inspRole(){
  var d=S.det, asked=!!(d&&d.summary&&d.summary.asked);
  var canP=S.boot.canProd, canL=S.boot.canLogi;
  if(canP && !asked) return 'prod';        // 아직 의뢰 전 — 생산 차례
  if(canL) return 'logi';
  if(canP) return 'prod';
  return 'view';
}

    +(asked?'<span class="pill acc" title="'+esc(asked)+'">검수 의뢰됨</span>':'')
    +(S.br?'<span class="pill mut">'+esc(S.br)+'만</span>':'')
    +'<span style="margin-left:auto">'
      +(prod&&edit?'<button class="btn sm" id="iPack">입고명세서 파일 올리기</button> ':'')
      +(logi&&edit?'<button class="btn sm" id="iWms">WMS 전표 올리기</button> ':'')
      +(canDrop()?'<button class="btn sm dgr" id="iDrop">이 건 지우기</button> ':'')
      +'<button class="btn sm" id="iClose">닫기</button></span></div>'
    +'<div class="mine">'+(prod
        ? '① 예정 확정 — 라인시트에서 끌어온 수량입니다. <b>입고명세서 보고 맞춘 뒤 [검수 의뢰]</b> 를 누르면 물류로 넘어갑니다.'
        : (logi ? '② 검수 — 실수량은 WMS 값이 기본입니다. 세어 보니 다른 칸만 고치고 사유를 고르세요.'
                : '읽기만 됩니다.'))+'</div>'
    +'<div class="inspsum">'
      +'<div><div class="k">SKU</div><div class="v">'+fmt(T.sku)+'</div></div>'
      +'<div><div class="k">라인시트 <span class="hint">발주</span></div><div class="v">'+fmt(T.sheet)+'</div></div>'
      +'<div><div class="k">명세서 <span class="hint">거래처</span></div><div class="v" data-s="plan">'+fmt(T.plan)+'</div></div>'
      +'<div><div class="k">실입고 <span class="hint">검수</span></div><div class="v" data-s="act">'+(prod?'—':fmt(T.act))+'</div></div>'
      +(prod
        ? '<div><div class="k">발주 대비</div><div class="v '+(T.plan-T.sheet<0?'neg':(T.plan-T.sheet>0?'pos':''))+'" data-s="vs">'
            +((T.plan-T.sheet)?sgn(T.plan-T.sheet):'0')+'</div></div>'
          +'<div><div class="k">다른 칸</div><div class="v '+(T.gap?'neg':'')+'" data-s="gap">'+T.gap+'</div></div>'
        : '<div><div class="k">과부족</div><div class="v '+(T.diff<0?'neg':(T.diff>0?'pos':''))+'" data-s="diff">'+(T.diff?sgn(T.diff):'0')+'</div></div>'
          +'<div><div class="k">사유 필요</div><div class="v '+(T.need?'neg':'')+'" data-s="need">'+T.need+'</div></div>')
    +'</div>'
    +'<div class="tw" style="max-height:340px;overflow:auto"><table><thead><tr>'
    +'<th>품번</th><th>컬러</th><th class="n">단가</th>'
    + SZ.map(function(z){ return '<th class="n">'+esc(z)+'</th>'; }).join('')
    + (prod ? '<th class="n">라인시트</th><th class="n">명세서</th><th class="n">차이</th><th>비고</th>'
            : '<th class="n">명세서</th><th class="n">실입고</th><th class="n">과부족</th><th>사유</th>')

  order.forEach(function(k){

          +(edit?'<input class="q" type="text" inputmode="numeric" value="'+r.act+'" data-k="'+esc(r.k)+'">':'<b>'+fmt(r.act)+'</b>')+'</td>';
      }
    });
    if(prod){
      var g2=gp-gs;
      h+='<td class="n hint">'+fmt(gs)+'</td><td class="n" data-c="p"><b>'+fmt(gp)+'</b></td>'
        +'<td class="n" data-c="d" style="color:'+(g2?'var(--bad)':'var(--ink-3)')+'">'+(g2?sgn(g2):'–')+'</td>'
        +'<td class="hint" data-c="m">'+(g2?(g2<0?'미납 — 다음 차수로':'초과 납품'):'')+'</td></tr>';
    }else{
      h+='<td class="n">'+fmt(gp)+'</td><td class="n" data-c="a"><b>'+fmt(ga)+'</b></td>'
