      +'<span>'+(V2GO[key]?gobtn(V2GO[key], WHAT[key]):qm(WHAT[key]))+'</span></div>';
  });
  // 검증만 보면 검수 대사를 한 번도 안 돌린 달도 확정이 눌린다 — 앞 단계까지 본다.
  // 확정은 재고수불부 전송까지 가므로 되돌리기가 비싸다.
  var vOk=d.checks.every(function(c){ return c.ok; });
  var stepLeft=[];
  if(okBy){
    if(!okBy[3]) stepLeft.push(3);
    if(!okBy[5] && nImp) stepLeft.push(5);
    if(!okBy[6]) stepLeft.push(6);
  }
  var allOk=vOk && !stepLeft.length;
  var cl=d.closed;
  h+='<div class="confirm">';
  if(cl){
    h+='<span class="chip ok" title="'+esc(cl.at+' 확정'+(cl.by?(' · '+cl.by):''))+'">'+ico('lock')+esc(String(cl.at||'').slice(5,10)||cl.at)+'</span>'
      +(cl.push&&cl.push.ok
        ? '<span class="chip ok" title="재고수불부로 '+fmt(cl.push.sent)+'행 보냄">'+ico('send')+fmt(cl.push.sent)+'</span>'
        : '<span class="chip bad" title="재고수불부로 못 보냄 — 숫자는 확정돼 있습니다">'+ico('unlink')+ico('send')+'</span>'
          +ibtn('refresh','재고수불부 재전송','id="bRepush"'))
      +(d.canFin?'<button class="btn sm" id="bUnfix" style="margin-left:auto">확정 해제</button>':'');
  }else{
    h+='<button class="btn go" id="bFix"'+(allOk&&d.canFin?'':' disabled')+'>당월 마감 확정</button>'
      +(!d.canFin ? '<span class="hint">확정은 재무가 합니다</span>' : allOk
        ? qm((noRecon?'이 달은 건별 검수 없이 입고내역으로 마감합니다. ':'')
           +'확정하면 이 달 숫자가 잠깁니다. 품번별 입고가 재고수불부(Baserow)로 넘어갑니다. '
           +'확정을 해제해도 이미 보낸 줄은 안 돌아옵니다 — 고친 뒤 다시 확정해서 다시 보내야 바뀝니다.')
        : (stepLeft.length
            ? stepLeft.map(function(no){ return gobtn(no, '먼저 끝내야 합니다 — «'+GONM[no]+'» 단계'); }).join('')
            : qm('검증 V1~V'+d.checks.length+' 가 전부 통과해야 누를 수 있습니다.')));
  }
  h+='<span class="hint" id="fixMsg"></span></div>';
  h+=amrBox(d);
  return h;
}

/* 회계시스템 전표 — 입고일 × 거래처 한 장을 자동전표처리(ACB6010)로. 재무만 · 확정한 달만 보낸다 */
function amrBox(d){
  if(!d.canFin) return '';
  var A=(S.amr && S.amr.ym===d.ym) ? S.amr : null;
  var h='<div class="amr"><div class="amrh"><b>회계시스템 전표</b>'
    +qm('입고일 × 거래처 한 장 — 차 상품(품번·수량·단가) / 대 외상매입금, 공급가. 국내 입고만. 보낸 것은 ACB6010 에 대기로 쌓이고, 거기서 [전표발행] 을 눌러야 전표가 됩니다.')
    +'<span class="grow"></span>';
  if(!A || A.err){
    h+='<button class="btn sm" id="bAmrPlan">미리보기</button></div>';
    if(A && A.err) h+='<div class="vrow"><span class="vmk no">!</span><span>'+esc(A.err)+'</span><span></span></div>';
    return h+'</div>';
  }
  var V=A.vouchers||[];
  var bad=V.filter(function(v){ return v.block.length; }), sent=V.filter(function(v){ return v.sent; });
  var left=V.filter(function(v){ return !v.sent && !v.block.length; });
  var why = A.early ? ('이 달은 이미 월말 전표로 장부에 있습니다 — 보내기는 '+A.from+' 부터')
          : !A.closed ? '확정한 달만 보냅니다 — 위 «이 달 마감 확정» 먼저'
          : bad.length ? '막힌 전표를 먼저 풀어 주세요'
          : !left.length ? '전송 완료' : '';
  h+='<span class="chip" title="전송 대상 전표 '+V.length+'장">'+ico('file')+fmt(V.length)+'</span>'
    +'<span class="chip" title="공급가 합계">'+ico('coins')+fmt(A.total)+'</span>'
    +(sent.length?sdot('ok','전송 '+sent.length+'장'):'')
    +(bad.length?sdot('bad','차단 '+bad.length+'장',bad.length):'')
    +ibtn('refresh','재조회','id="bAmrPlan"')
    +'<button class="btn sm go" id="bAmrSend"'+(why?(' disabled title="'+esc(why)+'"'):'')+'>전송</button></div>';
  bad.forEach(function(v){
    h+='<div class="vrow"><span class="vmk no">!</span><span><b>'+esc(v.vendor)+'</b> '+esc(v.ymd.slice(5))+' · '+fmt(v.amt)+'</span>'
      +'<span class="hint">'+esc(v.block[0])+'</span></div>';
  });
  h+='<details class="amrl"'+(S.amrOpen?' open':'')+' id="amrL"><summary><span class="hint">'+fmt(V.length)+'장 · 제외 수입 '+fmt((A.skip||{}).imp||0)+'줄</span>'
    +'<span class="grow"></span><span class="rc-x" aria-hidden="true">'+ico('chev')+'</span></summary>'
    +(S.amrOpen ? ('<div class="tw" style="max-height:320px;overflow:auto"><table><thead><tr><th></th><th>입고일</th><th>입고처</th><th>거래처</th><th class="n">품번</th><th class="n">공급가</th></tr></thead><tbody>'
      +V.map(function(v){
        return '<tr><td>'+(v.sent?sdot('ok','전송 '+v.sent):(v.block.length?sdot('bad',v.block[0]):sdot('no','미전송')))+'</td>'
          +'<td class="mono">'+esc(v.ymd.slice(5))+'</td><td>'+esc(v.vendor)+'</td>'
          +'<td class="hint"'+(v.note?(' title="'+esc(v.note)+'"'):'')+'>'+esc(v.trCd?(v.trCd+' '+v.trNm):'–')+'</td>'
          +'<td class="n">'+fmt(v.n)+'</td><td class="n">'+fmt(v.amt)+'</td></tr>'; }).join('')
      +'</tbody></table></div>') : '')
    +'</details>';
  return h+'</div>';
}
function bindAmr(){

    var done=btnGo(p);

      function(m){ done(); S.amr={ym:S.ym, err:m}; closeRender(); });
  };
  var l=$('amrL');

  var s=$('bAmrSend');

    var A=S.amr, left=(A.vouchers||[]).filter(function(v){ return !v.sent && !v.block.length; });

    ui.ask({title:'회계시스템 '+left.length+'장 전송', body:'공급가 합계 '+fmt(amt)+'원 — 자동전표처리(ACB6010)에 대기로 쌓입니다. [전표발행] 은 거기서 누릅니다.', ok:'전송'}).then(function(yes){
      if(!yes) return;
      var done=btnGo(s);

        run('apiAmrPlan',[S.ym],function(p2){ S.amr=p2; closeRender(); });

}

        function(m){ fin(); note(m,'bad',true); });

/** 쓰기 응답에 딸려 온 장부를 그대로 그린다 — 다시 묻지 않는다.
    모양이 아니면(요약이 없으면) 예전처럼 다시 묻는다. */
function useLedger(L){
  // 빈 달(요약 없음)도 받아야 한다 — 요약이 있는 것만 받았더니 달을 비워도 이 브라우저에 남은 옛 장부가 계속 보였다
  if(!(L && L.close && L.close.ym)) return false;
  if(String(L.close.ym)!==String(curYm()||S.ym)){ ledgerPut_(L.close.ym, L.close, L.stock||null); return true; }   // 그사이 달을 바꿨다
  S.close=L.close; S.closeYm=L.close.ym; if(L.stock) S.stock=L.stock; S.closeStale=false; S.closeDirty=0;
  if(L.memo && L.memo.ym===L.close.ym && typeof memoSet==='function'){ memoSet(L.memo); S.memoReq=null; }   // 장부에 같이 온 메모 — memoBox 가 apiMemoList 를 따로 안 부른다
  if(typeof K!=='undefined' && K.mon){ if(L.stock) K.mon[L.close.ym]=L.stock; else delete K.mon[L.close.ym]; }   // 기간 보기도 새 값
  (S.seen=S.seen||{})[L.close.ym]=1;
  ledgerPut_(L.close.ym, L.close, S.stock);
  if(typeof renderBrands==='function' && S.boot) renderBrands();   // ERP에만 있는 브랜드가 선택 목록에 들어온다
  closeRender();
  return true;
}
function useClose(r){
  if(r && r.ym && String(r.ym)!==String(curYm()||S.ym)) return true;   // 그사이 달을 바꿨다 — 옛 달 장부로 덮지 않는다
  if(r && r.stock){ S.stock=r.stock; delete r.stock; }   // 서버가 수불부를 같이 보냈다 — 흐름도·대장 표도 새 값으로
  else if(r && r.ym) S.stock=null;                        // 안 보냈으면 옛 수불부를 버린다(옛 그림보다 빈 칸이 낫다)
  if(r && r.summary && r.ym){ S.close=r; S.closeYm=r.ym; ledgerPut_(r.ym, r, S.stock); closeRender(); return true; }
  S.close=null; closeBoot(S.ym,true); return false;
}

/** 사람이 고를 것이 없는 일을 이어서 돌린다 — B/L 잇기 → 과세환율 → 관세.
    auto 가 참이면 «올리자마자» 부른 것이라 조용히 돈다. */
function autoRun(ym, auto){
  S.autoBusy=true; if($('pClose').hidden) work(true,'정리 중');
  if(typeof closeRender==='function' && S.close) closeRender();
  run('apiAutoRun',[ym||S.ym],function(r){
    S.autoBusy=false; work(false);
    S.auto=r;
    // «자동으로 한 것» 칸이 같은 내용을 표로 남긴다 — 알림으로 또 띄우지 않는다
    if(!(r.did||[]).length && !(r.left||[]).length && !auto) note('정리 대상 없음','ok');
    if(!useLedger({close:r.close, stock:r.stock})) useClose(r.close);
  },function(m){ S.autoBusy=false; work(false); note(m,'bad',true); S.close=null; closeBoot(ym||S.ym,true); });
}

/* ── 미리보기 패널의 «적용» ─────────────────── */
function pvApply(){
  var p=S.prev; if(!p) return;
  var done=btnGo($("pvGo"), p.kind==="bl" ? "체크한 것 저장 중…"

    var sel=[];

      if(pvChecked(i) && x["묶음"] && x["묶음"].length) sel.push(x);
    });
    if(!sel.length){ done(); note("체크한 줄이 하나도 없습니다 — 왼쪽 네모를 하나 이상 켜고 다시 누르세요","warn",true); return; }

    var withFx=pvFx(), left0=(p.data["남은묶음"]||[]).slice();

      withFx ? "환율 시트에 B/L 번호를 적고, 기준이 빈 묶음엔 신고일 과세환율을 채웁니다"
             : "환율 시트에 B/L 번호를 적습니다");
    run("apiBlApply",[S.ym,sel,withFx],function(r){
      hold(false); done(); S.prev=null;
      var okRows=[];

        (x["묶음"]||[]).forEach(function(g0){
          var g=(typeof g0==="string")?g0:String((g0&&g0.grp)||"");
          okRows.push([g, "B/L "+(x.BL||"")+" 로 이었습니다"]);

      var noRows=left0.map(function(x){ return [x.grp, x["사유"]||"이번엔 안 붙었습니다"]; });
      ((r&&r.notes)||[]).forEach(function(m){ noRows.push(["과세환율", String(m)]); });
      var after=(r&&r.close&&r.close.summary)||null;
      S.pvres={
        ym:S.ym, step:5, bad:!!noRows.length,
        title:"B/L 을 이어 붙였습니다 — 결과",
        head:fmt((r&&r["붙인묶음"])||nG)+"묶음에 B/L 번호를 적었습니다"
             +((r&&r["환율채움"])?(" · 그중 "+fmt(r["환율채움"])+"묶음은 과세환율까지 채웠습니다"):" · 채운 환율은 없습니다"),
        sub:"<b>환율 시트("+esc(S.ym)+")에 저장이 끝났습니다.</b> 아래 <b>수입 묶음</b> 표의 「B/L · 기준 · 환율」 칸에서 바로 확인하세요.",
        short:"B/L "+fmt((r&&r["붙인묶음"])||nG)+"묶음 이음",
        ok:okRows, no:noRows,
        next: !after ? '아래 <b>수입 묶음</b> 표에서 B/L 칸이 찼는지 눈으로 확인하세요.'
             : (after.unres_n
                ? ('아직 <b>미확정 '+fmt(after.unres_n)+'행</b>이 남았습니다 — 바로 위 「환율 자동 입력」 를 이어서 누르세요.')
                : '미확정이 <b>0 행</b>이 됐습니다 — «'+GONM[NX5()]+'» 단계로 넘어가세요.'),
        nextBtn: (after && !after.unres_n) ? gobtn(NX5()) : ''
      };
      useClose(r&&r.close);
    }, function(m){ hold(false); done(); note(m,"bad",true); });
    return;
  }

  if(p.kind==="fx"){
    var plOk=(p.data.plan||[]).filter(function(x){ return x.ok; });
    hold(true, "과세환율 넣는 중… "+plOk.length+"묶음",
      "묶음마다 입고일의 관세청 과세환율을 조회해 환율 시트에 적습니다");
    run("apiFxAuto",[S.ym,true],function(r){
      hold(false); done(); S.prev=null;
      var okRows=(r.done||[]).map(function(x){
        return [x.grp, (x.mode==="환율" ? ("환율 "+fmtu(x.rate)) : String(x.mode||""))
          +(x.src?(" — "+x.src):"")]; });
      var noRows=(r.fail||[]).map(function(f){ return [(f.p&&f.p.grp)||"", String(f.msg||"")]; })
        .concat((r.plan||[]).filter(function(x){ return !x.ok; })
          .map(function(x){ return [x.grp, String(x.why||"")]; }));
      S.pvres={
        ym:S.ym, step:5, bad:!!(r.left||noRows.length),
        title:"과세환율을 세웠습니다 — 결과",
        head:fmt(okRows.length)+"묶음의 기준금액을 세웠습니다 · "
             +(r.left?("아직 미확정 "+fmt(r.left)+"행"):"미확정 0 행"),
        sub:"<b>환율 시트("+esc(S.ym)+")에 저장이 끝났습니다.</b> 아래 <b>수입 묶음</b> 표의 「기준 · 환율」 칸에서 확인하세요.",
        short:"환율 "+fmt(okRows.length)+"묶음 세움",
        ok:okRows, no:noRows,
        next: r.left
          ? ('아직 <b>미확정 '+fmt(r.left)+'행</b>이 남았습니다 — 아래 표에서 그 묶음의 「기준」 과 「환율」 을 직접 쳐 넣고 「저장」 을 누르세요.')
          : '미확정이 <b>0 행</b>이 됐습니다 — «'+GONM[NX5()]+'» 단계로 넘어가세요.',
        nextBtn: r.left ? '' : '<button class="btn sm go" data-goto="'+NX5()+'">'+GONM[NX5()]+'으로 가기</button>'
      };
      closeRender(); S.close=null; closeBoot(S.ym,true);
    }, function(m){ hold(false); done(); note(m,"bad",true); });
    return;
  }

  if(p.kind==="duty"){
    var pl2Ok=(p.data.plan||[]).filter(function(x){ return x.ok; });
    hold(true, "관세 넣는 중… "+pl2Ok.length+"건",
      "유니패스 신고의 관세를 B/L 에 붙은 입고묶음에 얹습니다");
    run("apiDutyToCost",[S.ym,true],function(r){
      hold(false); done(); S.prev=null;
      var sumD=0; (r.done||[]).forEach(function(x){ sumD+=x.duty||0; });
      var okRows=(r.done||[]).map(function(x){
        return [String(x.no||"")+"  "+fmt(x.duty)+"원", ((x.grps||[]).join(", ")||"?")+" 에 얹었습니다"]; });
      var noRows=(r.fail||[]).map(function(f){ return [(f.p&&f.p.no)||"", String(f.msg||"")]; })
        .concat((r.plan||[]).filter(function(x){ return !x.ok; })
          .map(function(x){ return [String(x.no||x.bl||""), String(x.why||"")]; }));
      var needBl=noRows.filter(function(x){ return String(x[1]).indexOf("B/L 자동연결")>=0; }).length;
      S.pvres={
        ym:S.ym, step:6, bad:!!noRows.length,
        title:"관세를 넣었습니다 — 결과",
        head:fmt((r.done||[]).length)+"건 · 합계 "+fmt(sumD)+"원을 부대비용으로 넣었습니다",
        sub:"<b>비용 시트에 저장이 끝났습니다.</b> 아래 <b>부대비용 내역</b> 표에 「관세」 줄로 들어가 있습니다 — 같은 신고번호는 두 번 안 들어갑니다.",
        short:"관세 "+fmt((r.done||[]).length)+"건 넣음",
        ok:okRows, no:noRows,
        next: (!(r.done||[]).length && needBl)
          ? '<b>한 건도 못 넣었습니다.</b> B/L 에 붙은 입고묶음이 없어서입니다 — 기준금액 단계의 「B/L 자동 연결」 를 먼저 하세요.'
          : '다음은 <b>운임 · 통관수수료</b> 입니다 — 위 「부대비용 입력」 를 누르고 홈택스 후보를 고르세요.',
        nextBtn: (!(r.done||[]).length && needBl)
          ? '<button class="btn sm go" data-goto="5">기준금액으로 가기</button>' : ''
      };
      closeRender(); S.close=null; closeBoot(S.ym,true);
    }, function(m){ hold(false); done(); note(m,"bad",true); });
  }
}

/** 계산서 작성일로 어느 입고묶음인지 짚어 본다.
    계산서엔 B/L 이 안 적혀 오지만(비고는 «수입»·«국제특송화물 운송요금» 뿐),
    작성일이 유니패스 신고일·수리일과 맞는 일이 많다. 맞으면 그 신고의 B/L 에 붙은 묶음이다.
    안 맞으면 아무것도 고르지 않는다 — 날짜로 찍으면 틀리는 건이 실제로 있다. */
/** 같은 공급자가 이 달에 이미 붙인 묶음 */
function cfUsedBy(sup){
  var out={};
  ((S.close&&S.close.costs)||[]).forEach(function(c){
    if(String(c.supplier||'')!==String(sup||'')) return;
    String(c.scope_val||'').split(';').forEach(function(g){ g=g.trim(); if(g) out[g]=c.id; });
  });
  return out;
}
/** 이 달 수입 묶음 */
function cfImpGrps(){
  return cfGrps().filter(function(g){ return g.imp>0; }).map(function(g){ return g.grp; });
}
/** 날짜로 못 짚었을 때 — 같은 공급자가 안 쓴 수입 묶음이 «하나만» 남으면 그것이다. */
function cfGuessLeft(sup){
  if(!sup) return null;
  var used=cfUsedBy(sup), usedN=Object.keys(used).length;
  if(!usedN) return null;                       // 이 달에 붙인 적이 없으면 짚지 않는다
  var imp=cfImpGrps();
  var left=imp.filter(function(g){ return !used[g]; });
  if(left.length!==1) return null;              // 둘 이상 남으면 고르는 것은 사람 몫
  return { grps:left, sup:sup, used:Object.keys(used), impN:imp.length, kind:'left' };
}

function cfGuess(ymd){
  var U=(S.close&&S.close.uni)||[];
  if(!ymd || !U.length) return null;
  var best=null;
  U.forEach(function(u){
    if(!(u.grps||[]).length) return;
    [['수리일',u.done],['신고일',u.decl]].forEach(function(x){
      if(!x[1]) return;
      var gap=Math.round(Math.abs(new Date(ymd)-new Date(x[1]))/86400000);
      if(isNaN(gap)) return;
      if(!best || gap<best.gap) best={ gap:gap, kind:x[0], day:x[1], u:u };
    });
  });
  // 하루를 넘으면 짚지 않는다. 사흘까지 봤더니 7/31 월말 청구분 셋을 전부 260729 로 잘못 집었다 —
  // 그중 448,708 의 정답은 260703 이고, 부르고·씨앤케이는 국내 운송료라 붙을 자리가 없다.
  if(!best || best.gap>1) return null;
  return { grps:best.u.grps, bl:best.u.bl, gap:best.gap, no:best.u.no,
    kind:best.kind, day:best.day, ymd:ymd };
}
function cfPick(){
  var A=cfState(), q=String(A.gq||"").trim().toUpperCase();
  var myG=(S.close&&!S.close.canFin&&S.boot&&S.boot.myBrands)||null;
  return cfGrps().filter(function(g){
    if(A.sel[g.grp]) return true;            // 고른 것은 늘 보인다 — 안 보이면 못 푼다
    // 담당자는 내 브랜드가 든 묶음만 — 남의 묶음은 고르면 저장할 때에야 거부됐다
    if(myG && g.brands && !Object.keys(g.brands).some(function(b){ return myG.indexOf(b)>=0; })) return false;
    if(A.imp && !g.imp) return false;
    if(!q) return true;
    return String(g.grp).toUpperCase().indexOf(q)>=0 || String(g.ven||"").toUpperCase().indexOf(q)>=0;
  });
}
function cfList(){
  var A=cfState(), gs=cfGrps(), L=cfPick();
  if(!gs.length) return '<span class="hint">이 달엔 붙일 입고 묶음이 <b>하나도 없습니다</b> — '
    + 'ERP 단계에서 ERP 입고현황을 먼저 올려야 이 목록이 생깁니다.</span>';
  if(!L.length)  return '<span class="hint">찾는 묶음이 없습니다 — «전체» 를 눌러 보세요.</span>';
  return L.map(function(g){
    return '<button class="gi'+(A.sel[g.grp]?" on":"")+'" data-cag="'+esc(g.grp)+'">'
      + '<span>'+esc(g.grp)+'</span>'
      + '<span class="q">'+fmt(g.qty)+'개 · '+fmt(g.n)+'줄'+(g.imp?('<span title="수입 묶음">'+ico('ship')+'</span>'):"")+'</span></button>';
  }).join("");
}
function cfPrev(){
  var A=cfState(), q=0, n=0;
  cfGrps().forEach(function(g){ if(A.sel[g.grp]){ q+=g.qty; n++; } });
  if(!n) return '<span class="hint">아직 고른 묶음이 없습니다 — 위 목록에서 <b>이 돈이 붙을 입고 묶음</b> 을 누르세요. '
    + '고르면 여기에 «개당 얼마» 가 나옵니다.</span>';
  if(!A.amt) return '<span class="hint">묶음 '+fmt(n)+'개 · 수량 '+fmt(q)+'개 — 금액을 넣으면 개당이 보입니다</span>';
  return '<span>묶음 <b>'+fmt(n)+'</b>개</span><span>수량 <b>'+fmt(q)+'</b>개</span>'
    + '<span>→ 개당 <b style="color:var(--acc)">'+fmt(A.amt/q)+'</b>원</span>'
    + '<span class="hint">'+fmt(A.amt)+' ÷ '+fmt(q)+'</span>';
}
/** 입력 중에 화면을 다시 그리면 한글이 깨진다 — 미리보기 칸만 갈아 끼운다 */
function cfTouch(){
  var e=$("caPrev"); if(e) e.innerHTML=cfPrev();
  var n=$("caGn"); if(n){ var L=cfPick().length, T=cfGrps().length;
    n.textContent = (L===T)? (T+"개") : (L+" / "+T+"개"); }
}
function cfRelist(){
  var e=$("caGl"); if(!e) return;
  e.innerHTML=cfList();
  e.querySelectorAll("[data-cag]").forEach(function(b){
    b.onclick=function(){
      var g=b.getAttribute("data-cag"), A=cfState();
      A.sel[g]=!A.sel[g];
      b.className="gi"+(A.sel[g]?" on":"");
      cfTouch();
    };
  });
  cfTouch();
}

/** 홈택스 후보 — 누르면 유형·금액·공급자·증빙이 채워진다 */
function cfHtLoad(){
  if(S.htBusy) return;
  if(S.ht && S.ht.ym===S.ym) return;
  S.htBusy=true;
  run("apiHometaxCand",[S.ym],function(d){
    run("apiHometaxUsed",[S.ym],function(u){
      d.used=(u&&u.used)||{}; S.ht=d; S.htBusy=false; paintCost();
    },function(){ d.used={}; S.ht=d; S.htBusy=false; paintCost(); });
  },function(msg){
    S.ht={ ym:S.ym, rows:[], skipped:[], used:{}, why:String(msg) };
    S.htBusy=false; paintCost();
  });
}
function cfHtBox(){
  var d=S.ht;
  if(S.htBusy) return '<div class="htbox"><div class="hth"><b>홈택스 후보</b> <span class="hint">불러오는 중…</span></div></div>';
  if(!d || d.ym!==S.ym) return "";
  var h='<div class="htbox"><div class="hth"><b>홈택스에서 받아 온 것</b>';
  if(d.why) return h+'<span class="hint">'+esc(d.why)+'</span></div></div>';
  h+='<span class="hint">'+fmt(d.rows.length)+'건'
    + (d.at? " · "+esc(String(d.at).slice(0,10)):"")
    + (d.total? " · 이 달 매입계산서 "+fmt(d.total)+"건 중":"")+'</span>'
    + '<span class="hint" style="margin-left:auto">누르면 아래 칸이 채워집니다 — 묶음만 고르세요</span></div>';
  if(!d.rows.length) return h+'<div class="htl"><span class="hint">이 달엔 운임·통관수수료로 잡힌 계산서가 '
    + '<b>한 건도 없습니다</b>. 홈택스 수집기가 매일 새벽 받아 오므로, 계산서가 어제 발행됐다면 내일 아침에 뜹니다. '
    + '급하면 아래 칸에 유형·금액·공급자·증빙을 직접 쳐 넣어도 됩니다.</span></div></div>';
  h+='<div class="htl">';
  d.rows.forEach(function(r,i){
    var uid=htUsed(r, d.used, d.rows), done=!!uid;
    h+='<button class="hti'+(done?" done":"")+'" data-cht="'+i+'"'+(done?(' disabled title="'+esc(uid)+' 로 넣음"'):' title="누르면 아래 칸이 채워집니다"')+'>'
      + '<span class="d">'+esc(r.ymd)+'</span><span class="t">'+esc(r.type)+'</span>'
      + '<span class="s">'+esc(r.sup)+(r.item?(" · "+esc(r.item)):"")+'</span>'
      + '<span class="v">'+fmt(r.amt)+'</span>'
      + '<span class="chk">'+(done?sdot('ok',uid+' 로 넣음'):sdot('no','미입력'))+'</span></button>';
  });
  h+="</div>";
  if(d.skipped && d.skipped.length)
    h+='<div class="hth" style="border-top:1px solid var(--line);border-bottom:0">'
      + '<span class="hint">일부러 뺀 것 '+d.skipped.length+'건 — '+esc(d.skipped[0].why||"")+'</span></div>';
  return h+"</div>";
}

function paintCost(){
  var wrap=$("costWrap"); if(!wrap) return;
  if(!S.costOpen){ wrap.innerHTML=""; return; }
  var A=cfState(), d=S.close;
  cfHtLoad();
  var h=cfHtBox()
    + '<div class="addbox"><div class="addh">부대비용 입력'
    + '<span class="hint" style="font-weight:400">수량비례 · 재고원가로 들어갑니다</span>'
    + '<button class="btn sm" id="caX" style="margin-left:auto">닫기</button></div>';
  if(d.closed) h+='<div class="addmsg bad" style="padding:9px 11px">'+esc(d.ym)
    + ' 은 확정된 달입니다 — ⑦ 에서 «확정 해제» 를 먼저 눌러야 넣을 수 있습니다.</div>';
  h+='<div class="addf">'
    + '<label>유형<select id="caType">'+(d.types||[]).map(function(t){
        return '<option'+(t===A.type?" selected":"")+'>'+esc(t)+'</option>'; }).join("")+'</select></label>'
    + '<label>금액<input type="text" id="caAmt" class="amt" inputmode="numeric" value="'+esc(A.amtTxt||"")+'" placeholder="0"></label>'
    + '<label>공급자<input type="text" id="caSup" value="'+esc(A.sup||"")+'" placeholder="바롬로지스틱스"></label>'
    + '<label>증빙<input type="text" id="caDoc" value="'+esc(A.doc||"")+'" placeholder="세금계산서 번호 · B/L"></label>'
    + '</div>';
  h+='<div class="gsel"><div class="hint" style="display:flex;gap:7px;align-items:center;margin:0 0 5px;flex-wrap:wrap">'
    + '<span>배부 대상 입고묶음 <span class="hint">— 수량은 배부 대상(반품 제외)입니다</span></span>'
    + '<input type="text" id="caGq" value="'+esc(A.gq||"")+'" placeholder="입고처 검색" '
    + 'style="font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line-2);background:var(--surf);color:var(--ink);width:150px">'
    + '<span class="seg2" id="caImp" role="group" aria-label="묶음 거르기">'
    + '<button type="button" data-imp="0" aria-pressed="'+(!A.imp)+'">전체</button>'
    + '<button type="button" data-imp="1" aria-pressed="'+(!!A.imp)+'" title="수입 묶음만" aria-label="수입 묶음만">'+ico('ship')+'</button></span>'
    + '<span id="caGn" class="hint"></span></div>'
    + '<div class="gl" id="caGl">'+cfList()+'</div></div>';
  h+='<div class="vrow" style="background:var(--warn-soft);color:var(--warn)"><span class="vmk no">!</span>'
    + '<span><b>묶음은 날짜로 고르면 틀립니다.</b> 7월 바롬 계산서는 7/28자가 260729 묶음에, 7/31자가 260703 묶음에 붙었습니다.'
    + '<br>근거로 쓸 것 — ⑤ 에서 확정된 B/L↔묶음 대응, 통관수수료의 품목명, 수리일자.</span><span></span></div>';
  h+=cfWhyBox();
  h+='<div class="addprev" id="caPrev">'+cfPrev()+'</div>';
  h+='<div class="addft"><button class="btn go" id="caSave">입력</button>'
    + '<span class="addmsg'+(A.msgKind?(" "+A.msgKind):"")+'" id="caMsg">'+esc(A.msg||"")+'</span></div></div>';
  wrap.innerHTML=h;

  $("caX").onclick=function(){ S.costOpen=false; paintCost(); };
  wrap.querySelectorAll("[data-cht]").forEach(function(b){
    b.onclick=function(){
      var r=(S.ht&&S.ht.rows||[])[+b.getAttribute("data-cht")]; if(!r) return;
      var A2=cfState();
      A2.type=r.type; A2.amt=Number(r.amt)||0; A2.amtTxt=fmt(A2.amt);
      A2.sup=r.sup||""; A2.doc=r.id||"";
      var g=cfGuess(r.ymd) || cfGuessLeft(r.sup);
      A2.sel={}; A2.why=g||null; A2.whyRow=r;
      if(g){ g.grps.forEach(function(n){ A2.sel[n]=true; }); A2.msg=''; A2.msgKind=''; }
      else { A2.msg=''; A2.msgKind=''; }
      paintCost();
    };
  });
  $("caImp").querySelectorAll("[data-imp]").forEach(function(b){
    b.onclick=function(){ cfState().imp=(b.getAttribute("data-imp")==="1");
      $("caImp").querySelectorAll("[data-imp]").forEach(function(x){ x.setAttribute("aria-pressed", String(x===b)); });
      cfRelist(); };
  });
  $("caType").onchange=function(){ cfState().type=this.value; };
  $("caSup").oninput=function(){ cfState().sup=this.value; };
  $("caDoc").oninput=function(){ cfState().doc=this.value; };
  $("caGq").oninput=function(){ cfState().gq=this.value; cfRelist(); };
  $("caAmt").oninput=function(){
    var A3=cfState();
    A3.amtTxt=this.value;
    A3.amt=Number(String(this.value).replace(/[^0-9.-]/g,""))||0;
    cfTouch();
  };
  cfRelist();
  $("caSave").onclick=function(){ cfSave(false); };   // 클릭 이벤트가 force 로 들어가면 중복 검사를 건너뛴다
}

function cfSave(force){
  var A=cfState();
  var sel=Object.keys(A.sel).filter(function(g){ return A.sel[g]; });
  var say=function(m,k){ var e=$("caMsg"); if(e){ e.textContent=m; e.className="addmsg"+(k?(" "+k):""); }
                         A.msg=m; A.msgKind=k||""; };
  if(!A.amt){ say("금액을 넣어 주세요 — 계산서의 공급가액을 숫자로.","bad"); return; }
  if(!sel.length){ say("붙일 입고 묶음을 고르세요.","bad"); return; }
  var done=btnGo($("caSave"),"넣는 중…");
  run("apiCostSave",[S.ym,{
      "비용유형":A.type, "금액":A.amt, "귀속":"재고원가", "배부기준":"수량비례",
      "배부범위":"입고묶음", "범위값":sel.join(";"),
      "공급자":A.sup||"", "증빙번호":A.doc||"", "중복확인":force?1:0 },[]],
    function(r){
      done();
      // 같은 계산서에서 잇달아 넣는 일이 많다 — 유형·공급자·증빙은 남기고 금액·묶음만 비운다
      S.cost={ ym:A.ym, type:A.type, sup:A.sup, doc:A.doc, amt:0, amtTxt:"",
               sel:{}, gq:A.gq, imp:A.imp, msg:"넣었습니다", msgKind:"ok" };
      // 지금 넣은 증빙을 «넣었음» 으로 바로 표시한다 — 후보를 통째로 다시 받지 않는다
      if(S.ht && S.ht.used && r && r.costs){
        r.costs.forEach(function(c){ if(A.doc && c.doc===A.doc) S.ht.used[A.doc]=c.id;
          var k=htKey(c.supplier, c.amount); if(k && !S.ht.used[k]) S.ht.used[k]=c.id; });
      }
      useClose(r);
    },
    function(m){ done(); m=String(m);
      var i=m.indexOf('DUP|');
      if(i>=0){ var p=m.slice(i).split('|');
        ui.ask({title:'이미 들어간 비용일 수 있어요', body:p.slice(2).join('|'), ok:'그대로 입력', danger:true})
          .then(function(y){ if(y) cfSave(true); else say('넣지 않았어요 — '+p[1]+' 를 확인하세요','warn'); });
        return; }
      say(m,"bad"); });
}
</script>

</style>
<script>
/* ═══════════════════════════════════════ 수불부 「수」
   수불부에 우리가 채우는 칸은 «입고 수량·단가·금액» 셋뿐이다.
   기초는 전월 기말, 출고는 WMS 가 채운다 — 그래서 그 칸들은 회색으로 자리만 둔다.

   서버는 달 단위로만 부른다. 한 번 받은 달은 K.mon 에 쌓아 두고
   기간 좁히기·찾기·서랜 여닫기는 전부 화면에서 한다 — 왕복 한 번이 몇 초라서다. */
var K = { mon:{}, rng:null, q:'', lock:'', bu:'cost', src:'',
          drw:{C:false,B:false,D:false,E:false}, open:false, tmp:null, left:'', pick:0, busy:false, months:null,
          seg:'pa', paCls:'', paOpen:{}, pa:null,   // seg: pa 예정대비실적 · sub 품번 수불(안 씀)
          whyM:{}, whyFresh:{}, whyOpen:'', whySeq:0 };   // 차이 사유 — 기준월별 목록 · 이번에 연 뒤 받은 달 · 펼친 품번

function kf(v){ if(v===null||v===undefined||isNaN(v)) return '–'; var n=Math.round(v); return n<0?('('+KNF.format(Math.abs(n))+')'):KNF.format(n); }
var KNF=new Intl.NumberFormat('ko-KR');   // 형식기 하나를 계속 쓴다(toLocaleString 은 매번 새로)
function kesc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function kYmd(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function kPd(s){ var p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function kAddM(m,n){ var p=m.split('-'), d=new Date(+p[0],+p[1]-1+n,1);
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
function kEom(y,m){ return new Date(y,m,0).getDate(); }
function kDays(a,b){ return Math.round((kPd(b)-kPd(a))/86400000)+1; }
function kMn(m){ return String(+m.slice(5,7))+'월'; }

/** 기간이 걸치는 달 */
function kMonths(){
  var out=[], a=K.rng.from.slice(0,7), b=K.rng.to.slice(0,7), m=a;
  for(var i=0;i<36 && m<=b;i++){ out.push(m); m=kAddM(m,1); }
  return out;
}
/** 아직 안 받은 달 */
function kMissing(){ return kMonths().filter(function(m){ return !K.mon[m]; }); }

/* ── 받아 오기 ─────────────────────────────── */
function kYm(v){ return /^\d{4}-\d{2}$/.test(String(v||'')) ? String(v) : ''; }
function stockBoot(ym){
  K.whyFresh={};   // 차이 사유는 리포트를 열 때마다 한 번 새로 받는다
  ym = kYm(ym) || kYm(curYm()) || kYm(S.ym);
  if(!ym){
    // 달 목록이 아직 안 왔다. 여기서 밀고 나가면 기간이 «-01 ~ -aN» 이 된다.
    $('pStock').innerHTML=kBusyCard();
    setTimeout(function(){ if(!$('pStock').hidden && !K.rng) stockBoot(''); }, 400);
    return;
  }
  if(!K.rng){
    var p=ym.split('-');
    K.rng={ from:ym+'-01', to:ym+'-'+('0'+kEom(+p[0],+p[1])).slice(-2) };
    K.left=ym;
  }
  kTop();   // 앱바 기간 단추는 데이터 오기 전에 먼저
  // 월마감이 이미 받은 그 달 수불부가 있으면 그걸 쓴다 — 같은 걸 6~8초 다시 받았다
  if(S.stock && String(S.stock.ym)===String(ym) && !S.closeStale && !K.mon[ym]) K.mon[ym]=S.stock;
  stockFetch();
}
/** 위에서 달을 바꾸면 기간을 그 달로 다시 잡는다 */
function stockMonth(ym){
  ym = kYm(ym); if(!ym) return;
  var p=ym.split('-');
  K.rng={ from:ym+'-01', to:ym+'-'+('0'+kEom(+p[0],+p[1])).slice(-2) };
  K.left=ym; K.lock=''; K.open=false; K.tmp=null; K.pick=0;
  if(!$('pStock').hidden) stockFetch();
}
/** 받아 둔 달에 나오는 브랜드 — 위 브랜드 목록이 이것도 담게 한다 */
function kBrands(){
  var b={};
  Object.keys(K.mon).forEach(function(m){
    var d=K.mon[m]; if(!d||!d.items) return;
    Object.keys(d.items).forEach(function(it){ b[d.items[it].br]=1; });
  });
  if(K.pa) K.pa.plan.concat(K.pa.act).forEach(function(x){   // 예정 줄 [0]·실적 줄 [2] 이 품번
    var k=String(x.length===11?x[0]:x[2]).slice(0,2); if(/^[A-Z]{2}$/.test(k)) b[k]=1; });
  return Object.keys(b);
}
/* ── 기다리는 동안 ─────────────────────────
   apiStockMulti 는 한 달에 6~8초, 여러 달이면 10초를 넘긴다.
   회색 글자 한 줄이면 «멈췄나» 싶어 새로고침을 눌러 버리고, 그러면 처음부터 다시다.
   그래서 «지금 돌고 있다» 를 눈에 보이게 하고, 무엇을 받는 중인지 달 이름을 적는다.
   경과 초는 세지 않는다 — 세어 보여 주면 기다림이 더 길게 느껴진다. */
function kBusyCard(){   // 어진 10/20: 설명 문구 없이 스피너만
  return '<div class="kbusy" role="status" aria-label="불러오는 중" title="불러오는 중"><span class="kspin"></span></div>';
}
/** 처음 열 때는 패널이 비어 있으니 통째로. 이미 그려져 있으면 그 자리에 덮는다 —
    보던 것을 지워 버리면 «무엇이 바뀌는 중인지» 를 알 수 없다. */
function kBusy(want){
  var box=$('pStock'); if(!box) return;
  if(!box.querySelector('.ftool')){ box.innerHTML=kBusyCard(); return; }
  var o=box.querySelector('.kover');
  if(!o){ o=document.createElement('div'); o.className='kover'; box.appendChild(o); }
  o.innerHTML=kBusyCard();
}

/** 품번 수불은 apiStockMulti(무겁다), 예정 대비 실적은 apiPlanActual — 고른 화면 것만 받는다 */
function stockFetch(then){ if(K.seg==='sub') kSubFetch(then); else paFetch(then); }
function kSubFetch(then){
  var want=kMissing();
  if(!want.length){ stockRender(); if(then) then(); return; }
  if(K.busy) return;
  K.busy=true;
  kBusy(want.slice(0,6));
  run('apiStockMulti',[want.slice(0,6)],function(res){
    K.busy=false;
    Object.keys(res||{}).forEach(function(m){ K.mon[m]=res[m]; });
    want.slice(0,6).forEach(function(m){ if(!K.mon[m]) K.mon[m]={ items:{}, lots:[], empty:true }; });
    stockRender(); if(then) then();
  },function(msg){
    K.busy=false;
    $('pStock').innerHTML='<div class="note bad">수불부를 못 불러왔습니다 — '+kesc(msg)+'</div>';
  });
}

/* ── 기간 안의 값 ──────────────────────────── */
function kLots(){
  var out=[];
  kMonths().forEach(function(m){
    var d=K.mon[m]; if(!d) return;
    (d.lots||[]).forEach(function(x){
      if(x[1]>=K.rng.from && x[1]<=K.rng.to) out.push(x);
    });
  });
  return out;
}
function kName(it){
  var ms=kMonths();
  for(var i=0;i<ms.length;i++){
    var d=K.mon[ms[i]]; if(d && d.items && d.items[it]) return d.items[it];
  }
  return { nm:'', br:it.slice(0,2) };
}
/** 품번별 집계 — 입고건에서 다시 만든다. 기간이 달 중간에서 끊겨도 맞는다. */
function kItems(){
  var M={};
  kLots().forEach(function(x){
    var e=M[x[0]] || (M[x[0]]={ qty:0,cost:0,oh:0,lots:[],first:'',last:'',units:{} });
    e.qty+=x[3]; e.cost+=x[4]; e.oh+=x[5]; e.lots.push(x);
    if(!e.first||x[1]<e.first) e.first=x[1];
    if(!e.last ||x[1]>e.last ) e.last =x[1];
    if(x[3]) e.units[Math.round(x[4]/x[3])]=1;
  });
  Object.keys(M).forEach(function(k){
    var e=M[k]; e.unit=e.qty?e.cost/e.qty:0; e.uniq=Object.keys(e.units).length;
    e.lots.sort(function(p,q){ return p[1]<q[1]?-1:1; });
  });
  return M;
}
function kHit(it){
  var e=kName(it);
  if(!brShow(e.br)) return false;      // 브랜드는 맨 위 하나를 따른다(담당자는 기본 내 담당)
  if(K.lock && it!==K.lock) return false;
  var q=K.q.trim().toUpperCase();
  if(!q) return true;
  return it.indexOf(q)>=0 || String(e.nm).toUpperCase().indexOf(q)>=0;
}

/* ── 기간 달력 ─────────────────────────────── */
var KPRE=[
 [['당월','m0'],['이전달','m1'],['전전달','m2'],['올해','y'],['최근 7일','d7'],['최근 30일','d30']],
 [['1분기','q1'],['2분기','q2'],['3분기','q3'],['4분기','q4'],['상반기','h1'],['하반기','h2']],
 [['1월','M1'],['2월','M2'],['3월','M3'],['4월','M4'],['5월','M5'],['6월','M6'],
  ['7월','M7'],['8월','M8'],['9월','M9'],['10월','M10'],['11월','M11'],['12월','M12']]];
function kPreset(k){
  var base=curYm()+'-01', Y=+curYm().slice(0,4);
  if(k==='y') return [Y+'-01-01', Y+'-12-31'];
  if(k[0]==='m'){ var m=kAddM(curYm(),-(+k.slice(1))), p=m.split('-');
    return [m+'-01', m+'-'+('0'+kEom(+p[0],+p[1])).slice(-2)]; }
  if(k[0]==='d'){ var n=+k.slice(1), e=kPd(K.rng.to), s=new Date(e); s.setDate(s.getDate()-n+1);
    return [kYmd(s), K.rng.to]; }
  if(k[0]==='q'){ var q=+k.slice(1), a=(q-1)*3+1;
    return [Y+'-'+('0'+a).slice(-2)+'-01', Y+'-'+('0'+(a+2)).slice(-2)+'-'+kEom(Y,a+2)]; }
  if(k==='h1') return [Y+'-01-01', Y+'-06-30'];
  if(k==='h2') return [Y+'-07-01', Y+'-12-31'];
  if(k[0]==='M'){ var mm=+k.slice(1);
    return [Y+'-'+('0'+mm).slice(-2)+'-01', Y+'-'+('0'+mm).slice(-2)+'-'+kEom(Y,mm)]; }
  return [K.rng.from, K.rng.to];
}
function kCal(m){
  var p=m.split('-'), y=+p[0], mo=+p[1];
  var start=new Date(y,mo-1,1).getDay(), last=kEom(y,mo);
  var a=K.tmp?K.tmp.from:K.rng.from, b=(K.tmp&&K.tmp.to)?K.tmp.to:K.rng.to;
  var have={}; (K.months||[]).forEach(function(x){ have[x]=1; });
  var today=kYmd(new Date());
  var h='<div class="calm"><div class="calg">'
    + ['일','월','화','수','목','금','토'].map(function(d,i){
        return '<div class="cdow'+(i===0?' sun':(i===6?' sat':''))+'">'+d+'</div>'; }).join('');
  for(var i=0;i<start;i++) h+='<div class="cday out">·</div>';
  for(var d=1;d<=last;d++){
    var ds=y+'-'+('0'+mo).slice(-2)+'-'+('0'+d).slice(-2), dow=(start+d-1)%7, cls='cday';
    if(dow===0) cls+=' sun'; else if(dow===6) cls+=' sat';
    if(ds===a||ds===b){ cls+=' pick'; if(ds===a) cls+=' s'; if(ds===b) cls+=' e'; }
    else if(a&&b&&ds>a&&ds<b) cls+=' mid';
    if(K.months && !have[m]) cls+=' nodata';
    if(ds===today) cls+=' today';
    h+='<div class="'+cls+'" data-kd="'+ds+'">'+d+'</div>';
  }
  var tail=(start+last)%7;
  if(tail) for(var t=1;t<=7-tail;t++) h+='<div class="cday out">·</div>';
  return h+'</div></div>';
}

/* ── 부대비용 근거 ─────────────────────────── */
/** 비용 한 건의 규칙 — 금액·기준·분모. 서버가 내려준 것만 쓴다 (화면이 분모를 추측하면 거짓말이 된다) */
function kCost(ym,cid){
  var d=K.mon[ym]; if(!d||!d.costs) return null;
  for(var i=0;i<d.costs.length;i++) if(d.costs[i].id===cid) return d.costs[i];
  return null;
}
var KHUE={ 관세:"var(--k-duty)", 운임:"var(--k-freight)", 통관수수료:"var(--k-customs)", RFID:"var(--k-rfid)", 부자재:"var(--k-sub)", 검사비:"var(--k-insp)" };   // 월마감 흐름도와 같은 색
function kHue(t){ return KHUE[t] || "var(--ink-3)"; }
/** 분모가 무엇을 센 것인가 — 단위를 틀리면 «145개 × 128원» 같은 거짓 문장이 나온다 */
function kUnit(c){
  var u=String((c&&(c.used||c.basis))||'');
  if(u.indexOf('수량')>=0) return { u:'개', qty:true };
  if(u.indexOf('USD')>=0)  return { u:'USD', qty:false };
  if(u.indexOf('금액')>=0) return { u:'원', qty:false };
  if(u.indexOf('세율')>=0) return { u:'가중치', qty:false };
  if(u.indexOf('직접')>=0) return { u:'원', qty:false };
  return { u:'', qty:false };
}

/** 지금 보고 있는 것에 붙은 부대비용을 «입고 묶음» 단위로 모은다 */
function kWhyGroups(only){
  var G={};
  kLots().forEach(function(x){
    if(only){ if(x[0]!==only) return; }
    else if(!kHit(x[0])) return;
    var g=G[x[7]+"\u0001"+(x[8]||"")]
      || (G[x[7]+"\u0001"+(x[8]||"")]={ ym:x[7], grp:x[8]||"", qty:0, wq:0, won:0, costs:{}, items:{} });
    g.qty+=x[3]; g.wq+=(x[10]||0);
    var e=g.items[x[0]] || (g.items[x[0]]={ qty:0, wq:0, won:0 });
    e.qty+=x[3]; e.wq+=(x[10]||0);
    var pt=x[9];
    if(pt) Object.keys(pt).forEach(function(cid){
      g.won+=pt[cid]; g.costs[cid]=(g.costs[cid]||0)+pt[cid]; e.won+=pt[cid];
    });
  });
  var out=[];
  Object.keys(G).forEach(function(k){ if(G[k].won) out.push(G[k]); });
  out.sort(function(a,b){ return b.won-a.won; });
  return out;
}

    h+='<div class="whycap">품번마다 얼마씩 나눠 졌나'
      + (gap? ' <span class="hint">— 「배부 수량」 은 비용을 나눌 때 쓴 수량이고, 괄호 안은 수불부에 올라가는 수량입니다.'
            + ' 같은 달에 반품이 들어와 수량만 상계된 품번은 이 둘이 다릅니다.</span>'
            : ' <span class="hint">— 「배부 수량」 이 비용을 나눌 때 쓴 수량입니다.</span>')
      + '</div>';
    h+='<table><thead><tr><th>품번</th><th>품명</th><th class="n">배부 수량</th>'
      + '<th style="width:24%">몫</th><th class="n">배부액</th></tr></thead><tbody>';
    its.slice(0,40).forEach(function(it){
      var e=g.items[it];
      h+='<tr><td class="mono">'+it+'</td>'
        + '<td class="hint" style="max-width:15ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+kesc(kName(it).nm)+'</td>'
        + '<td class="n">'+kf(e.wq)+(e.wq!==e.qty?' <span class="hint">('+kf(e.qty)+')</span>':'')+'</td>'
        + '<td><span class="qbw"><i class="qb" style="width:'+Math.max(2,e.won/mx*100).toFixed(1)+'%"></i></span></td>'
        + '<td class="n"><b>'+kf(e.won)+'</b></td></tr>';
    });
    h+='</tbody></table>';
    if(its.length>40) h+='<div class="hint" style="margin-top:5px">상위 40품번만.</div>';
  }
  h+='</div></div>';
  return h;
}

/** 이 기간이 걸친 달 중, 실제로 값을 받아 둔 달 */
function kHaveMonths(){ return kMonths().filter(function(m){ return K.mon[m] && !K.mon[m].empty; }); }

/** 넣을 수 있는가 — 서버가 얹어 준 권한을 본다 */
function kCanCost(){
  var ms=kHaveMonths();
  for(var i=0;i<ms.length;i++) if(K.mon[ms[i]].canCost) return true;
  return false;
}

/* ── 기준금액 근거 ─────────────────────────── */
var KBS = ['사전원가','입고단가','환율적용','사전원가예외','임가공','사후원가','미확정'];
var KBSW = {
  '사전원가':'ERP 사전원가 그대로(2026-10~)',
  '입고단가':'ERP 원화 단가 그대로',
  '환율적용':'수입금액 USD × 묶음 환율',
  '사전원가예외':'USD 없음 — 사전원가 적용',
  '임가공':'임가공인데 입고금액이 없어 사전원가로',
  '사후원가':'수입 — ERP 사후원가(관세·운임 포함) 그대로',
  '미확정':'아직 안 정해짐 — 환율을 넣어야 합니다'
};
/** 이 기간이 걸친 달들의 근거를 합친다 */
function kf2(v){
  if(v===null||v===undefined||isNaN(v)) return '–';
  return Number(v).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function kBsrc(){
  var out={};
  kHaveMonths().forEach(function(m){
    var b=(K.mon[m]||{}).bsrc||{};
    Object.keys(b).forEach(function(k){
      var e=out[k]||(out[k]={n:0,qty:0,base:0});
      e.n+=b[k].n; e.qty+=b[k].qty; e.base+=b[k].base;
    });
  });
  return out;
}
function kFxList(){
  var out=[];
  kHaveMonths().forEach(function(m){
    ((K.mon[m]||{}).fx||[]).forEach(function(g){ out.push({ ym:m, g:g }); });
  });
  out.sort(function(a,b){ return b.g.base-a.g.base; });
  return out;
}
/** 기준금액이 어떻게 정해졌나 */
function kWhyFx(){
  var B=kBsrc(), L=kFxList();
  var tot=0; Object.keys(B).forEach(function(k){ tot+=B[k].base; });
  var h='<div class="bsr">';
  KBS.forEach(function(k){
    var e=B[k]; if(!e||!e.n) return;
    h+='<div'+(k==='미확정'?' class="warn"':'')+'><div class="k">'+k+'</div>'
      + '<div class="v">'+kf(e.base)+'</div>'
      + '<div class="s">'+kf(e.n)+'줄 · '+kf(e.qty)+'개 · '+KBSW[k]+'</div></div>';
  });
  h+='</div>';
  if(B['미확정'] && B['미확정'].n)
    h+='<div class="note bad" style="margin:0 0 11px">기준금액이 안 정해진 줄이 '+kf(B['미확정'].n)+'개 있습니다 — '
      + '아래 묶음에 환율을 넣어야 취득원가가 섭니다. 이대로는 마감 확정도 막힙니다(V3).</div>';
  if(!L.length) return h+'<div class="hint" style="padding:6px 2px">환율이 걸린 묶음이 없습니다 — 이 기간은 전부 ERP 입고단가로 섰습니다.</div>';

  h+='<div class="hint" style="margin-bottom:7px">환율이 걸리는 묶음 '+kf(L.length)+'개 '
    + '<span class="hint">— 환율은 줄이 아니라 묶음 단위로 붙습니다</span></div>';
  L.forEach(function(x){
    var g=x.g;
    var lab = g.unres? '미확정' : (g.mode==='사전원가'?'사전원가예외':(g.rate?'환율적용':'미확정'));
    h+='<div class="why"><div class="whyh"><span class="g">'+kesc(g.grp)+'</span>'
      + '<span class="hint">'+x.ym+' · '+kf(g.n)+'줄 · '+kf(g.qty)+'개</span>'
      + '<span class="am">'+kf(g.base)+'</span></div>';
    if(g.mode==='사전원가'){
      h+='<div class="eqn"><div class="bx"><div class="lb">묶음 사전원가금액</div>'
        + '<div class="bg">'+kf(g.pre)+'<span class="un">원</span></div>'
        + '<div class="sm">USD 가 없어 사전원가를 그대로 씁니다</div></div>'
        + '<div class="op">→</div>'
        + '<div class="bx res"><div class="lb">기준금액</div><div class="bg">'+kf(g.base)+'<span class="un">원</span></div>'
        + '<div class="sm">근거 · 사전원가예외</div></div></div>';
    } else if(g.rate){
      h+='<div class="eqn">'
        + '<div class="bx"><div class="lb">묶음 수입금액</div>'
          + '<div class="bg">'+kf2(g.usd)+'<span class="un">USD</span></div>'
          + '<div class="sm">반품(음수)도 같은 환율로 되돌립니다</div></div>'
        + '<div class="op">×</div>'
        + '<div class="bx"><div class="lb">과세환율</div><div class="bg">'+kf2(g.rate)+'</div>'
          + '<div class="sm">'+(g.src?kesc(g.src):'<span style="color:var(--bad)">출처 없음 — 손으로 넣은 값</span>')+'</div></div>'
        + '<div class="op">=</div>'
        + '<div class="bx res"><div class="lb">기준금액</div><div class="bg">'+kf(g.base)+'<span class="un">원</span></div>'
          + '<div class="sm">행별 은행가 반올림</div></div></div>';
      h+='<div class="mine">'+(g.bl? ('B/L <b class="mono">'+kesc(g.bl)+'</b><br>') : '')
        + '<span class="hint">0.5 는 짝수 쪽으로 굽니다 — 그래야 회계시스템와 1원도 안 벌어집니다. '
        + '그래서 '+kf2(g.usd)+' × '+kf2(g.rate)+' 을 그냥 곱한 값과 몇 원 다를 수 있습니다.</span></div>';
    } else {
      h+='<div class="whybad" style="margin-top:9px">이 묶음엔 기준이 없습니다 — '
        + kf(g.unres||g.n)+'줄이 미확정입니다. 월마감 ⑤단계에서 환율 또는 사전원가를 정하세요.</div>';
    }
    h+='</div>';
  });
  return h;
}

/** 근거 전체 — 품번을 잠갔으면 그 품번만 */
function kWhy(only){
  // 넣는 자리는 월마감 ⑥ 하나다 — 여기는 «어떻게 붙었나» 만 본다.
  // 예전엔 여기에 폼이 있어서, 단계를 따라가다 탭을 갈아타야 했다.
  // 설명은 권한이 없는 사람에게도 보여야 한다(«왜 못 넣지» 를 없앤다). 단추만 권한을 본다.
  var head = '<div class="vrow" style="margin-bottom:9px"><span class="vmk">?</span>'
    + '<span class="hint">부대비용이란 물건값 말고 <b>물건을 들여오느라 더 든 돈</b>(운임 · 관세 · 통관수수료 …)입니다.'
    + ' 넣는 곳은 <b>월마감 탭 → «부대비용» 단계</b> 한 군데뿐이고, 여기는 그 돈이 품번마다 얼마씩 얹혔는지 확인하는 자리입니다.</span>'
    + '<span>'+(COST_ON&&kCanCost()?'<button class="btn sm" data-kgo6="1">⑥ 이동</button>':'')+'</span></div>';
  var gs=kWhyGroups(only||"");
  if(!gs.length) return head
    + '<div class="hint" style="padding:8px 2px">'
    + (only? '품번 <b>'+kesc(only)+'</b> 에는 얹힌 부대비용이 없습니다 — 다른 품번에는 붙어 있을 수 있습니다(위 «전체로» 를 누르세요).'
           : '이 기간엔 아직 얹힌 부대비용이 없습니다 — 월마감 탭 ⑥ 에서 넣으면 여기에 나타납니다.')
    + '</div>';
  var t=0; gs.forEach(function(g){ t+=g.won; });
  return head
    + '<div class="hint" style="margin-bottom:7px">묶음 '+kf(gs.length)+'개 · 부대비용 '+kf(t)+'원'
    + (only? ' <b style="color:var(--acc)">· 품번 '+kesc(only)+' 만</b>':'')+'</div>'
    + gs.map(function(g){ return kWhyCard(g, only||""); }).join("");
}

/* ── 그리기 ────────────────────────────────── */
function stockRender(){
  if(!K.rng) return;
  K.drawn=null;   // paRender 가 다 그린 뒤 다시 적는다
  if(K.seg!=='sub') return paRender();
  kRenderSub();
}
/** 품번 수불 — 예전 기간 보기 그대로(기초/입고/출고/기말) */
function kRenderSub(){
  var M=kItems();
  var list=Object.keys(M).filter(kHit).sort(function(a,b){ return M[b].cost-M[a].cost; });
  // 요약은 «지금 걸러 보고 있는 것» 을 세야 한다.
  // 전체를 세면, 품번 하나를 잠가 놓고도 «1품번 · 273입고건 · 수량 178,153» 이 뜬다 — 거짓 숫자다.
  var nL=0, tq=0, tc=0, to=0;

  var h='<div class="secth"><b>재고수불부 「수」</b> '

    + '<div class="kwhat">품번마다 <b>몇 개</b> 들어와 <b>하나에 얼마</b>로 잡혔고 <b>모두 얼마</b>인지 — 이 셋만 봅니다.'
    + ' 월초에 남아 있던 것(기초) · 팔려 나간 것(출고) · 월말에 남은 것(기말)은 창고(WMS)가 채우므로 여기엔 없습니다.'
    + '<br><b>넣고 고치는 일은 월마감 탭에서 합니다 — 여기는 그 결과와 근거만 봅니다.</b></div>'
    + '<div class="ftool">'
      + (miss.length?'<span class="pill warn">'+miss.length+'개월 더 받아야 합니다</span>':'')
      + '<input type="text" id="kq" value="'+kesc(K.q)+'" placeholder="품번 · 품명 · 입고처로 찾기">'
      + '<button class="sm ib1" id="kxl" title="엑셀 다운로드" aria-label="엑셀 다운로드">'+ico('dl')+'</button>'
    + '</div>';
  if(K.lock) h+='<div class="lockbar">품번 <b class="mono">'+K.lock+'</b> 만 보는 중 '
    + '<span class="hint">'+kesc(kName(K.lock).nm)+'</span>'
    + '<button class="sm" data-kunlock="1">전체로</button></div>';
  h+='<div class="hint" style="margin-bottom:7px">이 기간 '+kf(list.length)+'품번 · '+kf(nL)+'입고건'
    + ' · 수량 '+kf(tq)+' · 취득금액 '+kf(tc)+' <span class="hint">(그중 부대비용 '+kf(to)+')</span>'
    + (brLabel()? ' <b style="color:var(--acc)">· 브랜드 '+kesc(brLabel())+' 만</b>':'')+'</div>';

  h+=kTblA(list, M);

  h+='<div class="drw"><button class="drwh" data-kdrw="C">'+(K.drw.C?'▾':'▸')
    + ' <b>언제 · 어디서 · 몇 개 들어왔나</b> <span class="hint">입고일 원장 — 입고 한 건씩 날짜순으로 · '+kf(nL)+'건</span></button>'
    + (K.drw.C?'<div class="drwb">'+kTblC()+'</div>':'')+'</div>';
  var bsr=kBsrc(), unres=(bsr['미확정']||{}).n||0;
  h+='<div class="drw"><button class="drwh" data-kdrw="E">'+(K.drw.E?'▾':'▸')
    + ' <b>물건값을 어떻게 원화로 잡았나</b> <span class="hint">기준금액 근거 — ERP이 준 입고단가 그대로인지, USD × 환율인지, 사전원가인지</span>'
    + (unres?'<span class="pill bad" style="margin-left:6px">미확정 '+kf(unres)+'줄</span>':'')+'</button>'
    + (K.drw.E?'<div class="drwb">'+kWhyFx()+'</div>':'')+'</div>';
  h+='<div class="drw"><button class="drwh" data-kdrw="D">'+(K.drw.D?'▾':'▸')
    + ' <b>운임 · 관세 같은 돈이 물건값에 얼마나 얹혔나</b> <span class="hint">부대비용 근거 — 어떤 기준으로 얼마씩 나뉘었는지 · 취득금액 중 '+kf(to)+'원</span></button>'
    + (K.drw.D?'<div class="drwb">'+kWhy(K.lock)+'</div>':'')+'</div>';
  h+='<div class="drw"><button class="drwh" data-kdrw="B">'+(K.drw.B?'▾':'▸')

    + (K.drw.B?'<div class="drwb">'+kTblB(list, M)+'</div>':'')+'</div>';

  $('pStock').innerHTML=h;
  kTop();
  kBind();
}

/** 상단 «기간» 을 화면이 실제로 보고 있는 값으로 맞춘다 — 둘이 어긋나면 그게 곧 결함이다 */
function kTop(){
  var e=document.getElementById('ymStock');
  if(!e||!K.rng) return;
  e.innerHTML=kRangeBar(); kRangeBind();
}
/** 기간 단추·달력 — 앱바만 다시 그린다(표는 «이 기간 보기» 때만) */
function kRangeBind(){
  var on=function(sel,fn){ $('ymStock').querySelectorAll(sel).forEach(function(b){ b.onclick=function(){ fn(b); }; }); };
  on('[data-kopen]', function(){
    K.open=!K.open; K.tmp=null; K.pick=0; K.left=K.rng.from.slice(0,7);
    if(!K.months) run('apiStockMonths',[],function(r){ K.months=(r&&r.months)||null; kTop(); },function(){});
    kTop();
  });
  on('[data-kp]', function(b){
    var p=kPreset(b.getAttribute('data-kp'));
    K.tmp={from:p[0],to:p[1]}; K.pick=0; K.left=p[0].slice(0,7); kTop();
  });
  on('[data-km]', function(b){ K.left=kAddM(K.left,+b.getAttribute('data-km')); kTop(); });
  on('[data-kd]', function(b){
    var ds=b.getAttribute('data-kd');
    if(K.pick===0||!K.tmp){ K.tmp={from:ds,to:ds}; K.pick=1; }
    else { if(ds<K.tmp.from) K.tmp={from:ds,to:K.tmp.from}; else K.tmp.to=ds; K.pick=0; }
    kTop();
  });
  on('[data-kcancel]', function(){ K.open=false; K.tmp=null; K.pick=0; kTop(); });
  on('[data-kok]', function(){
    if(K.tmp&&K.tmp.from&&K.tmp.to) K.rng={from:K.tmp.from,to:K.tmp.to};
    K.open=false; K.tmp=null; K.pick=0; kTop();
    if(kMissing().length>6) note(kMonths().length+'개월은 한 번에 6개월씩 받습니다 — 확인을 한 번 더 누르세요','warn');
    stockFetch();
  });
}

/* ── 엑셀 (화면에 보이는 그대로) ───────────── */
function kCsv(){
  var M=kItems();
  var list=Object.keys(M).filter(kHit).sort(function(a,b){ return M[b].cost-M[a].cost; });
  var L=['품번,품명,입고일,입고건,입고수량,취득단가,취득금액,부대비용'];
  list.forEach(function(it){
    var e=M[it];
    L.push([it, '"'+String(kName(it).nm).replace(/"/g,'""')+'"',
            e.first===e.last?e.first:(e.first+'~'+e.last), e.lots.length,
            e.qty, Math.round(e.unit), Math.round(e.cost), Math.round(e.oh)].join(','));
  });
  kDl(L, '수불부_입고_'+K.rng.from+'_'+K.rng.to+'.csv');
}
function kDl(L, name){
  var blob='﻿'+L.join('\r\n');
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(blob);
  a.download=name;
  a.click();
  note('엑셀 '+(L.length-1)+'줄을 내려받았습니다','ok');
}

/* ═══════════════════════════════════════ 예정 대비 실적 (+ 차이 사유)
   apiPlanActual 이 라인시트 예정 줄·ERP 실적 줄을 준다. 분류·접기는 여기서 한다. 납기·지급은 R003 으로 뺐다(지급 = 대금 탭).
   예정 줄 = [품번,브랜드,발주처,색상,색상코드,수량,금액,납기일,납기월,사전원가,품명]
   실적 줄 = [입고일,거래처,품번,컬러,수입,수량,원화금액,사전원가,USD] (반품 음수)
   분류 규칙·9월 정답은 scratchpad period/C_build.py — 바꾸면 test_planactual.js 로 대조한다. */
/* PA-PURE-START */
var PA_PFX={HR:'ALPHA',GL:'BETA',SN:'GAMMA',OH:'OH',UO:'UO',OD:'OD',UV:'UV',EL:'EL',OA:'OA'};
var PA_CLS=[['ok','일치','기간 안 예정 수량과 실제 수량 차이 ±5% 이내'],['less','부족','예정보다 5% 넘게 적게 입고'],
  ['more','초과','예정보다 5% 넘게 많이 입고'],['none','미입고','기간 안 납기인데 입고 0'],['b4','기입고','기간 안 납기인데 기간 전에 이미 다 입고'],
  ['late','지연','납기가 기간 전인데 이 기간에 입고'],['early','조기','납기가 기간 뒤인데 이 기간에 입고'],['mix','혼재','한 품번에 기간 안·밖 납기가 섞임'],
  ['blank','납기 미정','라인시트 납기일·납기월이 비어 있음'],['nols','미등록','라인시트에 없는 품번 입고']];
function paNv(t){ return String(t==null?'':t).replace(/\(주\)|주식회사|㈜|\s+/g,'').toLowerCase(); }
function paNc(t){ return String(t==null?'':t).replace(/\s+/g,'').toUpperCase(); }
function paUniq(a){ var o={}; a.forEach(function(x){ if(x!=='' && x!=null) o[x]=1; }); return Object.keys(o).sort(); }
function paInP(x,D){ return x[7] ? (x[7]>=D.from && x[7]<=D.to) : (!!x[8] && x[8]>=D.from.slice(0,7) && x[8]<=D.to.slice(0,7)); }
function paInA(r,D){ return r[0]>=D.from && r[0]<=D.to; }
/** 거래처 이름 하나로 — 라인시트 발주처(약칭)·ERP 입고처(정식명)를 «ERP 정식명» 한 줄로 모은다.
 *  1) ERP 이름끼리: 정규화(공백·(주) 빼고 소문자)가 같으면 수량 큰 표기 하나로 (더원 컴퍼니 = 더원컴퍼니)
 *  2) 라인시트 약칭: 입고현황 전체 기간(D.vq)에서 그 약칭 품번을 가장 많이 들인 ERP 거래처(같은 이름 거래처가 그 품번을 들였으면 그 이름)
 *     → 그래도 없으면 포함관계(두코 ⊂ 두코인터내셔널)·영문 글자이름(NFC = 앤에프씨글로벌)이 하나로 맞을 때만. 못 이으면 약칭 그대로. */
function paAlias(D){
  if(D._al) return D._al;
  var sq={}, rep={}, al={}, PF={}, cnt={};
  var addS=function(n,q){ var k=paNv(n); if(!k) return; var e=sq[k]||(sq[k]={}); e[n]=(e[n]||0)+q; };
  var vq=D.vq;
  if(!vq){ vq={}; var byK={};   // 옛 응답(vq 없음) — 기간 안 줄로만
    D.plan.forEach(function(x){ if(x[2] && !byK[x[0]]) byK[x[0]]=x[2]; });
    D.act.forEach(function(r){ var f=byK[r[2]]; if(!f) return; var o=vq[r[1]]||(vq[r[1]]={}); o[f]=(o[f]||0)+Math.abs(r[5]); }); }
  Object.keys(vq).forEach(function(n){ var q=0; Object.keys(vq[n]).forEach(function(f){ q+=vq[n][f]; }); addS(n,q); });
  D.act.forEach(function(r){ addS(r[1], Math.abs(r[5])); });
  Object.keys(sq).forEach(function(k){ var e=sq[k]; rep[k]=Object.keys(e).sort(function(a,b){ return (e[b]-e[a])||(a<b?-1:1); })[0]; al[k]=rep[k]; });
  Object.keys(vq).forEach(function(n){ var r=rep[paNv(n)]; Object.keys(vq[n]).forEach(function(f){
    var c=cnt[paNv(f)]||(cnt[paNv(f)]={}); c[r]=(c[r]||0)+vq[n][f]; }); });
  D.plan.forEach(function(x){ if(x[2]) PF[paNv(x[2])]=x[2]; });
  var sk=Object.keys(rep);
  Object.keys(PF).forEach(function(k){
    var c=cnt[k], best=c && Object.keys(c).sort(function(a,b){ return c[b]-c[a]; })[0];
    if(rep[k] && !(best && !c[rep[k]])) return;   // 이름이 같은 ERP 거래처 — 단, 그 약칭 품번을 실제로 들인 곳이 따로 있으면(아은 → 더아은) 그쪽
    if(best){ al[k]=best; return; }
    var m=sk.filter(function(x){ return paLike(k,x); });
    al[k]= m.length===1? rep[m[0]] : PF[k];
  });
  return (D._al=al);
}
var PA_LAT={a:'에이',b:'비',c:'씨',d:'디',e:'이',f:'에프',g:'지',h:'에이치',i:'아이',j:'제이',k:'케이',l:'엘',m:'엠',n:'엔',o:'오',p:'피',q:'큐',r:'알',s:'에스',t:'티',u:'유',v:'브이',w:'더블유',x:'엑스',y:'와이',z:'제트'};
var PA_SFX=/(글로벌|코리아|인터내셔널|인터네셔널|컴퍼니|코퍼레이션|텍스|트레이딩|상사|산업)$/;
function paHan(t){ return String(t).replace(/앤/g,'엔').replace(PA_SFX,''); }
/** 정규화된 두 이름이 같은 회사로 보이나 — 포함관계(짧은 쪽 한글 2자·영문 3자 이상) 또는 영문 약자를 글자이름으로 읽은 것 */
function paLike(a,b){
  var sh=a.length<b.length?a:b, lo=a.length<b.length?b:a, han=/[가-힣]/.test(sh);
  if(lo.indexOf(sh)>=0 && sh.length>=(han?2:3)) return true;
  var sp=function(t){ return /^[a-z]+$/.test(t)? t.split('').map(function(c){ return PA_LAT[c]; }).join('') : ''; };
  var la=sp(a), lb=sp(b);
  return !!((la && paHan(la)===paHan(b)) || (lb && paHan(lb)===paHan(a)));
}
function paVend(D,name){ return paAlias(D)[paNv(name)] || name; }
/** ERP 정식명 → 그 이름으로 모인 라인시트 약칭들(표에서 이름 위에 올리면 보인다) */
function paAka(D,v){
  if(!D._aka){ var m={}; Object.keys(paAlias(D)).forEach(function(k){ var c=D._al[k]; (m[c]||(m[c]={}))[k]=1; }); D._aka=m; }
  var o=D._aka[v]||{}, a=Object.keys(o).filter(function(k){ return k!==paNv(v); });
  return a.length? '동일 거래처: '+a.join(', ') : '';
}
/** 찾기 — 품번·품명·거래처(정식명·약칭) */
function paQ(D,k,v){
  var q=String(K.q||'').replace(/\s+/g,'').toLowerCase(); if(!q) return true;
  if(!D._nmP){ var n={}; D.plan.forEach(function(x){ if(x[10] && !n[x[0]]) n[x[0]]=x[10]; }); D._nmP=n; }
  var nm=String((D.nm||{})[k]||D._nmP[k]||'').replace(/\s+/g,'').toLowerCase();
  return String(k).toLowerCase().indexOf(q)>=0 || nm.indexOf(q)>=0 || paNv(v||'').indexOf(q)>=0 || paAka(D,v).toLowerCase().replace(/\s+/g,'').indexOf(q)>=0;
}
/** 품번 단위 분류 — C_build.py 와 같은 규칙(±5%) */
function paItems(D){
  var P={}, A={}, bef={}, keys={}, fa=D.from.slice(0,7), tb=D.to.slice(0,7), out=[];
  D.plan.forEach(function(x){ (P[x[0]]||(P[x[0]]=[])).push(x); keys[x[0]]=1; });
  D.act.forEach(function(r){
    if(paInA(r,D)){ (A[r[2]]||(A[r[2]]=[])).push(r); keys[r[2]]=1; }
    else if(r[0]<D.from) bef[r[2]]=(bef[r[2]]||0)+r[5];
  });
  Object.keys(D.before||{}).forEach(function(k){ bef[k]=(bef[k]||0)+D.before[k]; });
  Object.keys(keys).sort().forEach(function(k){
    var pl=P[k]||[], ac=A[k]||[], pin=pl.filter(function(x){ return paInP(x,D); });
    var o={k:k,pq:0,pa:0,aq:0,aa:0,ap:0,usd:0,imp:false,unk:0};
    pin.forEach(function(x){ o.pq+=x[5]; o.pa+=x[6]; });
    ac.forEach(function(r){ o.aq+=r[5]; o.aa+=r[6]; o.ap+=r[7]; o.usd+=r[8]; if(r[4]){ o.imp=true; if(!r[9]) o.unk++; } });
    o.krw=!o.unk;   // 원화(입고대장 기준금액)로 예정과 비교할 수 있나 — 수입도 2026-09부터는 사후원가 원화
    if(pin.length){
      if(!ac.length || o.aq<=0) o.cls=(bef[k]||0)>=o.pq*0.95?'b4':'none';
      else if(Math.abs(o.aq-o.pq)<=o.pq*0.05) o.cls='ok';
      else o.cls=o.aq<o.pq?'less':'more';
    } else if(pl.length){
      if(!ac.length) return;
      if(pl.every(function(x){ return x[7]? x[7]<D.from : (x[8] && x[8]<fa); })) o.cls='late';
      else if(pl.every(function(x){ return x[7]? x[7]>D.to : (x[8] && x[8]>tb); })) o.cls='early';
      else if(pl.every(function(x){ return !x[8]; })) o.cls='blank';
      else o.cls='mix';
    } else o.cls='nols';
    var src=pin.length?pin:pl, pf=PA_PFX[k.slice(0,2)]||k.slice(0,2);
    o.b=src.length? (src[0][1]||pf) : pf;
    o.v=src.length? (src[0][2]? paVend(D,src[0][2]) : '(발주처 없음)') : paVend(D, ac[0][1]);
    o.nm=(src[0]&&src[0][10]) || (D.nm||{})[k] || '';
    o.dd=paUniq((pin.length?pin:pl).map(function(x){ return x[7]||x[8]||'공란'; }));
    o.ad=paUniq(ac.map(function(r){ return r[0]; }));
    if(pl.length && ac.length){
      var pc={}; pl.forEach(function(x){ pc[paNc(x[4])]=1; pc[paNc(x[3])]=1; });
      o.cbad=paUniq(ac.map(function(r){ return r[3]; }).filter(function(c){ return !pc[paNc(c)]; }));
      o.pcol=paUniq(pl.map(function(x){ return x[4]||x[3]; }));
    }
    out.push(o);
  });
  return out;
}
/** 차이 사유 목록 합치기 — 늦게 온 서버 목록이 저장 중(pend)인 줄을 덮지 않는다(메모 memoSet 교훈).
 *  cur = 화면에 있던 것(없으면 null) · r = apiWhyList 답 {ym, rows:{품번:{t,cls,by,at}}, fin, brands}
 *  pend[품번] = {seq, row} — row 가 null 이면 «지우는 중» */
function whyMerge(cur, r){
  var rows={}, pend=(cur&&cur.pend)||{};
  Object.keys((r&&r.rows)||{}).forEach(function(k){ rows[k]=r.rows[k]; });
  Object.keys(pend).forEach(function(k){ if(pend[k].row) rows[k]=pend[k].row; else delete rows[k]; });
  return {ym:r.ym, rows:rows, fin:!!r.fin, brands:r.brands||[], pend:pend};
}

function paKey(){ return K.rng.from+'|'+K.rng.to; }
function paFetch(then){
  if(K.pa && K.pa.key===paKey()){ if(K.drawn!==K.pa || K.drawnBr!==S.br || !$('paBody')) stockRender(); else whyFetch(); if(then) then(); return; }
  if(K.busy) return;
  K.busy=true; kBusy(kMonths().slice(0,12));
  var key=paKey();
  // 사유는 실적 응답에 같이 온다(r.why) — 따로 부르던 apiWhyList 왕복을 없앴다. 옛 서버면 받은 뒤 따로
  run('apiPlanActual',[K.rng.from,K.rng.to],function(r){
    K.busy=false; r.key=key;
    if(r.why && r.why.ym){ K.whyM[r.why.ym]=whyMerge(K.whyM[r.why.ym],r.why); K.whyFresh[r.why.ym]=1; delete r.why; }
    K.pa=r; stockRender(); whyFetch(); if(then) then();
  },function(msg){
    K.busy=false;
    $('pStock').innerHTML='<div class="note bad">예정·실적을 못 불러왔습니다 — '+kesc(msg)+'</div>';
  });
}

/* ── 차이 사유 (R003) — 불일치 품번 줄마다 한 줄. 키 = 기준월(기간 시작 달)+품번.
   쓰기 = 그 브랜드 생산 담당자·재무, 읽기 = 모두. 저장은 화면 먼저(낙관적), 실패하면 되돌린다. */

function whySave(k,cls,text){

  text=String(text||'').trim(); K.whyOpen='';

  if(text===(prev?prev.t:'')){ whyPaint(); return; }
  var seq=++K.whySeq;
  if(text) W.rows[k]={t:text,cls:cls,by:(prev&&prev.by)||'',at:memoNow()}; else delete W.rows[k];
  W.pend[k]={seq:seq,row:W.rows[k]||null};
  whyPaint();
  var mine=function(){ var X=K.whyM[ym]; return X&&X.pend[k]&&X.pend[k].seq===seq? X : null; };   // 그새 또 고쳤으면 옛 답은 버린다
  run('apiWhySave',[ym,k,cls,text],function(r){

/** 1) 예정 대비 실적 */
function paViewPa(D){
  var all=paItems(D).filter(function(o){ return brShow(o.k) && paQ(D,o.k,o.v); });
  var n={}; all.forEach(function(o){ n[o.cls]=(n[o.cls]||0)+1; });
  var L=all.filter(paPick), W=whyW(), nw=W? all.filter(function(o){ return o.cls!=='ok' && !whyText(o.k); }).length : 0;
  var s={pq:0,pa:0,aq:0,aa:0}, si={n:0,pq:0,pa:0,aq:0,aa:0,usd:0,unk:0};
  L.forEach(function(o){ if(o.imp){ si.n++; si.pq+=o.pq; si.pa+=o.pa; si.aq+=o.aq; si.usd+=o.usd; if(o.krw) si.aa+=o.aa; else si.unk++; }
    if(o.krw){ s.pq+=o.pq; s.pa+=o.pa; s.aq+=o.aq; s.aa+=o.aa; } });
  function k3(l,q,a){ return '<div class="pa-k"><div class="l">'+l+'</div><div class="v">'+a+'</div><div class="s">'+q+'개</div></div>'; }
  var h='<div class="pa-sum">'+k3('예정',kf(s.pq),kf(s.pa))+k3('실제',kf(s.aq),kf(s.aa))

    + (si.n? '<div class="pa-k" title="수입 실제 원화 = 입고대장 기준금액(2026-09부터 사후원가). 원화가 아직 없는(환율 미확정) 품번만 원화 합계에서 빠진다"><div class="l">'+ico('ship')+' 수입 '+si.n+'품번</div>'
        + '<div class="v">'+kf(si.aa)+'</div><div class="s">'+paUsd(si.usd)+' · '+kf(si.aq)+' / 예정 '+kf(si.pq)+'개'
        + (si.unk? ' · <span class="neg">원화 미확정 '+si.unk+'</span>' : '')+'</div></div>' : '')
    + '</div><div class="pa-chips">'
    + PA_CLS.filter(function(c){ return n[c[0]]; }).map(function(c){
        return '<button type="button" class="pa-chip" data-pcls="'+c[0]+'" title="'+c[2]+'" aria-pressed="'+(K.paCls===c[0])+'">'
          + paShape(c[0])+c[1]+' <b>'+n[c[0]]+'</b></button>'; }).join('')
    + (W && (nw || K.paCls==='nowhy')? '<button type="button" class="pa-chip" data-pcls="nowhy" title="사유를 아직 안 적은 불일치 품번만" aria-pressed="'+(K.paCls==='nowhy')+'">'
        + ico('msg')+'사유 없음 <span class="pill warn">'+nw+'</span></button>' : '')+'</div>';
  // 브랜드 › 거래처 › 품번
  var B={};
  L.forEach(function(o){ var b=B[o.b]||(B[o.b]={o:[],v:{}}); b.o.push(o); (b.v[o.v]||(b.v[o.v]=[])).push(o); });
  function sum(a){ var z={pq:0,aq:0,pa:0,aa:0}; a.forEach(function(o){ z.pq+=o.pq; z.aq+=o.aq; if(o.krw){ z.pa+=o.pa; z.aa+=o.aa; } }); return z; }
  function big(a){ var z=sum(a); return Math.max(z.pa,z.aa); }
  function grp(cls,key,lab,a,open){
    var z=sum(a);
    var aka=cls==='pa-g2'? paAka(D,lab) : '';
    return '<tr class="lgg '+cls+(open?'':' fold')+'" data-pg="'+kesc(key)+'" tabindex="0"><td colspan="4"'+(aka?' title="'+kesc(aka)+'"':'')+'><span class="chev"></span><b>'+kesc(lab)+'</b>'
      + '<span class="hint">'+a.length+'품번</span></td>'
      + '<td class="n">'+kf(z.pq)+'</td><td class="n">'+kf(z.aq)+'</td><td class="n">'+paD(z.aq-z.pq)+'</td>'
      + '<td class="n">'+kf(z.pa)+'</td><td class="n">'+kf(z.aa)+'</td><td class="n">'+paD(z.aa-z.pa)+'</td>'+whyCount(a)+'</tr>';
  }
  function isOpen(key,def){ var v=K.paOpen[key]; return v===undefined? (K.paCls?true:def) : v; }
  var t='<div class="hstk"><table class="pat"><colgroup><col class="c-bc"><col><col class="c-d"><col class="c-d"><col class="c-q"><col class="c-q"><col class="c-q"><col class="c-a"><col class="c-a"><col class="c-a"><col class="c-w"></colgroup><thead>'
    + '<tr><th class="blank"></th><th class="blank"></th><th class="blank"></th><th class="blank"></th>'
    + '<th colspan="3" class="gh">수량</th><th colspan="3" class="gh">금액</th><th class="blank"></th></tr>'
    + '<tr><th></th><th>품번</th><th>납기</th><th>입고일</th>'
    + '<th class="n">예정</th><th class="n">실제</th><th class="n">차이</th><th class="n">예정</th><th class="n">실제</th><th class="n">차이</th><th class="pa-wc">차이 사유</th></tr></thead><tbody>';
  Object.keys(B).sort(function(a,b){ return big(B[b].o)-big(B[a].o); }).forEach(function(b){
    var ob=isOpen('b:'+b,true); t+=grp('pa-g1','b:'+b,b,B[b].o,ob); if(!ob) return;
    Object.keys(B[b].v).sort(function(x,y){ return big(B[b].v[y])-big(B[b].v[x]); }).forEach(function(v){
      var a=B[b].v[v], ov=isOpen('v:'+b+'|'+v,false); t+=grp('pa-g2','v:'+b+'|'+v,v,a,ov); if(!ov) return;
      a.sort(function(p,q){ return Math.max(q.pa,q.aa)-Math.max(p.pa,p.aa); }).forEach(function(o){
        var cb=o.cbad&&o.cbad.length? ' <span class="pa-cb" title="컬러 불일치 — ERP '+kesc(o.cbad.join(','))+' / 라인시트 '+kesc((o.pcol||[]).join(','))+'">'+ico('unlink')+'</span>' : '';
        t+='<tr><td class="bc">'+paShape(o.cls)+'</td><td><b class="mono">'+o.k+'</b> <span class="hint pa-nm">'+kesc(o.nm)+'</span>'+cb+'</td>'
          + '<td class="mono'+(o.pq?'':' hint')+'">'+paMore(o.dd)+'</td><td class="mono">'+paMore(o.ad)+'</td>'
          + '<td class="n">'+kf(o.pq)+'</td><td class="n">'+kf(o.aq)+'</td><td class="n">'+paD(o.aq-o.pq)+'</td>'
          + '<td class="n">'+kf(o.pa)+'</td>'
          + (!o.krw? '<td class="n" title="수입 — 원화 미확정(환율 안 넣은 달), USD">'+paUsd(o.usd)+'</td><td class="n hint">–</td>'
             : o.imp? '<td class="n" title="수입 — 입고대장 기준금액(원) · '+paUsd(o.usd)+'">'+kf(o.aa)+'</td><td class="n">'+paD(o.aa-o.pa)+'</td>'
                  : '<td class="n">'+kf(o.aa)+'</td><td class="n">'+paD(o.aa-o.pa)+'</td>')+whyCell(o)+'</tr>'+whyRow(o);
      });
    });
  });
  t+='</tbody></table></div>';
  if(!L.length) t='<div class="hint" style="padding:12px 2px">이 기간·브랜드에는 라인시트 납기도 ERP 입고도 없습니다 — 기간을 넓혀 보세요.</div>';
  return h+t;
}


function paRender(){
  if(!K.pa || K.pa.key!==paKey()){ paFetch(); return; }
  var D=K.pa;
  var h='<div class="ftool">';
  h+='<input type="text" id="kq" value="'+kesc(K.q)+'" placeholder="품번 · 품명 · 거래처로 찾기">'
    + '<button class="sm ib1" id="kxl" title="엑셀 다운로드" aria-label="엑셀 다운로드">'+ico('dl')+'</button>'
    + '<span class="hint" title="라인시트를 읽은 시각 — 6시간마다 새로 읽습니다">라인시트 '+kesc(D.at||'')+'</span></div>';
  var miss=kMonths().filter(function(m){ return (D.months||[]).indexOf(m)<0; });
  if(miss.length) h+='<div class="hint pa-h" style="margin-bottom:var(--sp-2)"><span class="pill warn">'+miss.length+'</span> ERP 입고현황이 아직 없는 달: '+kesc(miss.join(', '))+'</div>';
  if(brLabel()) h+='<div class="hint pa-h" style="margin-bottom:var(--sp-2)">브랜드 <b>'+kesc(brLabel())+'</b> 만</div>';
  h+='<div id="paBody">'+paViewPa(D)+'</div>';
  tblHTML($('pStock'),h,kBind);   // 줄이 많으면 나눠 붙인다(App.html tblHTML)
  kTop(); kBind(); K.drawn=D; K.drawnBr=S.br; whyFetch();
  if(window.MO) MO.first($('pStock'), D);   // 새 기간 데이터를 처음 그릴 때만 등장
}
/** 찾기 — 본문만 갈아끼운다(입력칸·커서는 그대로) */
function paRedraw(){
  var b=$('paBody'), el=$('kq'); if(!b||!K.pa) return;
  var pos=el?el.selectionStart:0;
  tblHTML(b,paViewPa(K.pa),kBind); kBind();
  if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} }
}
/** 엑셀 — 걸러 본 품번 전부(접힌 것 포함) + 차이 사유 */
function paCsv(){
  var D=K.pa; if(!D) return;
  var L=[];
  var q=function(t){ t=String(t==null?'':t); return /[",\n]/.test(t)? '"'+t.replace(/"/g,'""')+'"' : t; };
  L.push('브랜드,거래처,품번,품명,분류,납기,입고일,예정수량,실제수량,수량차이,예정금액,실제금액(원화),금액차이,수입USD,원화미확정,차이사유');
  paItems(D).filter(function(o){ return brShow(o.k) && paQ(D,o.k,o.v) && paPick(o); }).forEach(function(o){
    L.push([q(o.b), q(o.v), o.k, q(o.nm), paClsName(o.cls), q(o.dd.join(' ')), q(o.ad.join(' ')), o.pq, o.aq, o.aq-o.pq,
      Math.round(o.pa), o.krw?Math.round(o.aa):'', o.krw?Math.round(o.aa-o.pa):'', o.imp?(+o.usd.toFixed(2)):'', o.unk?'Y':'',
      q(o.cls==='ok'?'':whyText(o.k))].join(','));
  });
  kDl(L, '기간보기_예정 대비 실적_'+K.rng.from+'_'+K.rng.to+'.csv');
}

/* ── 조작 — 그려 놓고 직접 묶는다 (이 앱의 방식) ───── */
function kOn(sel, fn){
  $('pStock').querySelectorAll(sel).forEach(function(b){
    b.onclick = function(){ fn(b); };
  });
}
/** 지우기 — 배부는 서버가 다시 계산한다. 화면이 스스로 고쳐 쓰면 장부와 갈라지므로,
    그 달을 통째로 버리고 다시 받는다.
    («넣었음» 표시를 푸는 일은 후보 목록을 가진 쪽 — Steps.html 의 ⑥ — 이 한다.) */
function kCostDel(ym,cid){
  ui.ask({title:cid+' 삭제', body:'배부가 다시 계산됩니다.', ok:'삭제', danger:true}).then(function(yes){
    if(!yes) return;
    run('apiCostDelete',[ym,cid], function(){
      delete K.mon[ym]; S.close=null; stockFetch();   // 월마감 탭도 다시 받게
    }, function(msg){ note(String(msg),'bad',true); });
  });
}

function kBind(){
  kOn('[data-kgo6]', function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.setAttribute('aria-selected',String(x.dataset.t==='close')); });
    $('pClose').hidden=false; $('pStock').hidden=true; $('pCase').hidden=true; dslot('close');
    S.openStg=6; S.costOpen=true;
    closeBoot(S.ym,false);
  });
  kOn('[data-kdel]', function(b){
    var v=String(b.getAttribute('data-kdel')).split('|');
    kCostDel(v[0], v[1]);
  });
  kOn('[data-kdrw]', function(b){ var k=b.getAttribute('data-kdrw'); K.drw[k]=!K.drw[k]; stockRender(); });
  kOn('[data-ksrc]', function(b){ K.src=b.getAttribute('data-ksrc'); stockRender(); });
  kOn('[data-kbu]',  function(b){ K.bu=b.getAttribute('data-kbu'); stockRender(); });
  kOn('[data-kunlock]', function(){ K.lock=''; stockRender(); });
  kOn('[data-ki]', function(b){ var it=b.getAttribute('data-ki'); K.lock=(K.lock===it)?'':it; if(K.lock) K.drw.D=true; stockRender(); });
  kOn('[data-why]', function(b){ var k=b.getAttribute('data-why'); K.whyOpen=(K.whyOpen===k)?'':k; whyPaint(); });
  var wta=$('whyTa');
  if(wta) wta.onkeydown=function(e){   // Enter 저장 · Shift+Enter 줄바꿈 · 한글 조합 중 Enter 무시 · Esc 닫기
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); K.whyOpen=''; whyPaint(); return; }
    if(e.key!=='Enter' || e.shiftKey || e.isComposing || e.keyCode===229) return;
    e.preventDefault(); whySave(wta.getAttribute('data-k'), wta.getAttribute('data-cls'), wta.value);
  };
  kOn('[data-pcls]', function(b){ var c=b.getAttribute('data-pcls'); K.paCls=(K.paCls===c)?'':c; stockRender(); });
  $('pStock').querySelectorAll('[data-pg]').forEach(function(t){
    var go=function(){ var k=t.getAttribute('data-pg'); K.paOpen[k]=t.classList.contains('fold'); stockRender(); };
    t.onclick=go; t.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); go(); } };
  });
  if($('kxl')) $('kxl').onclick=(K.seg==='sub')? kCsv : paCsv;

  kSearch();
}
/** 찾기 — 입력칸은 다시 만들지 않는다. 다시 만들면 한글 자모가 깨진다. */
function kSearch(){
  var el=$('kq'); if(!el) return;
  var comp=false;
  el.oncompositionstart=function(){ comp=true; };
  el.oncompositionend=function(){ comp=false; K.q=el.value; kRedraw(); };
  el.oninput=function(){ K.q=el.value; if(!comp) kRedraw(); };
}
/** 표만 갈아끼운다 — 입력칸과 커서를 그대로 둔다 */
function kRedraw(){
  if(K.seg!=='sub') return paRedraw();
  var box=$('pStock'), el=$('kq');
  if(!box||!el) return;
  var pos=el.selectionStart;
  var M=kItems();
  var list=Object.keys(M).filter(kHit).sort(function(a,b){ return M[b].cost-M[a].cost; });
  var tmp=document.createElement('div'); tmp.innerHTML=kTblA(list,M);
  var oldT=box.querySelector('.scroll'), newT=tmp.querySelector('.scroll');
  if(oldT&&newT){ oldT.replaceWith(newT); kOn('[data-ki]', function(b){
    var it=b.getAttribute('data-ki'); K.lock=(K.lock===it)?'':it; if(K.lock) K.drw.D=true; stockRender(); }); }
  el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){}
}
</script>

<script>
/* ── 대금 탭 ─────────────────────────────────────────────
   서버(Payable.gs apiPayList)가 건마다 칸을 계산해 준다. 화면은 거르고 그리기만, 저장은 화면 먼저(낙관적) → apiPaySave. */
var PY={d:null, seg:'ym', bm:'', dept:'', q:'', fold:{}, open:'', vo:'', q2:0, busy:false, pend:[]};   // bm = 기준월 — 모든 보기가 같이 쓴다
var PY_DO=['C본부','A본부','운영','B본부'];
var PY_FULL={'C본부':'C본부사업본부','A본부':'A본부사업본부','운영':'운영본부','B본부':'B본부사업본부'};
var PY_ST=['예정','자금반영','지급완료'];
function pyAddM(ym,k){ var n=(+String(ym).slice(0,4))*12+(+String(ym).slice(5,7))-1+k; return Math.floor(n/12)+'-'+('0'+(n%12+1)).slice(-2); }
function pyNowM(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
function pyM(m){ return (+String(m).slice(5,7))+'월'; }
function pyYm2(ym){ return String(ym).slice(2,4)+'-'+String(ym).slice(5,7)+'월'; }
function pyDsort(a,b){ var i=PY_DO.indexOf(a), j=PY_DO.indexOf(b); i=i<0?99:i; j=j<0?99:j; return i-j || (a<b?-1:a>b?1:0); }
function pyCan(r){ var me=(PY.d&&PY.d.me)||{}; return !!(me.fin || (me.prod && (me.depts||[]).indexOf(r.d)>=0)); }
function pyKey(r){ return r.ym+'|'+r.id; }
function pyRow(k){ return (PY.d.rows||[]).filter(function(r){ return pyKey(r)===k; })[0]; }

/** 기본 기준월 = 앱 기준월(마감 대상 달) */
function pyBaseM(){ return (typeof curYm==='function' && curYm()) || (typeof S!=='undefined' && S.ym) || pyAddM(pyNowM(),-1); }
/** 앱바 «기준월» 단추(App.html #pyPm) — 목록만 채운다. 결제조건 보기에서만 잠근다 */
function pyPmSync(D){
  var sel=$('pyPm'); if(!sel) return;
  if(!PY.bm) PY.bm=pyBaseM();
  var ms={}; ms[PY.bm]=1; ms[pyNowM()]=1;
  if(D) D.rows.forEach(function(r){ ms[r.ym]=1; r.cells.forEach(function(c){ ms[c.m]=1; }); });
  var k=Object.keys(ms).sort();
  if(sel._k!==k.join()){ sel._k=k.join(); sel.innerHTML=k.map(function(m){ return '<option value="'+m+'">'+m+'</option>'; }).join(''); }
  sel.value=PY.bm; sel.disabled=(PY.seg==='rule');
}
/** 업로드 팝업 «대금 확인하기» — 입고월 보기 · 그 달 · 올린 본부(하나면) · 목록 다시 받기(새 업로드 반영) → 그린 뒤 강조 */
function payGoUp(ym, ds, ks, bad){
  PY.seg='ym'; PY.bm=ym; PY.dept=ds.length===1?ds[0]:''; PY.q=''; PY.open=''; PY.d=null; PY.up={ks:ks, bad:bad||[]};
  ds.forEach(function(d){ PY.fold[d]=false; });
  var t=document.querySelector('.tab[data-t="pay"]'); if(t) t.click(); else payBoot();
}
/** 올린 건 잠깐 강조 — 환율 없는 수입 건이 있으면 그 줄로 가서 환율 칸에 포커스 */
function pyFlashUp(u){
  var trs=[].filter.call(document.querySelectorAll('#pyBody tr[data-pyk]'),function(t){ return u.ks.indexOf(t.getAttribute('data-pyk'))>=0; });
  trs.forEach(function(t){ t.classList.add('hl'); });
  setTimeout(function(){ trs.forEach(function(t){ t.classList.remove('hl'); }); },1600);
  var f=u.bad.length? trs.filter(function(t){ return t.getAttribute('data-pyk')===u.bad[0]; })[0] : trs[0];
  if(!f) return;
  f.scrollIntoView({block:'center'}); if(window.MO) trs.slice(0,8).forEach(function(t,i){ MO.ring(t,i*30); });
  var b=u.bad.length && f.querySelector('[data-pyrate]'); if(b) b.focus();
}
function payBoot(){
  pyPmSync(PY.d);
  if(PY.d){ if(PY.drawn!==PY.d || !$('pyBody')) payRender(); return; }   // 같은 데이터·같은 화면이면 다시 그리지 않는다
  $('pPay').innerHTML=kBusyCard();
  payFetch();
}
function payFetch(){
  run('apiPayList',[],function(d){
    if(PY.q2>0 && PY.d){ PY.pend.unshift(d); return; }   // 저장 중 — 저장 응답이 다 오면 그 위에 합친다
    PY.d=d;
    if(!PY.bm) PY.bm=pyBaseM();
    if(!PY.dept && d.me && !d.me.fin && (d.me.depts||[]).length===1) PY.dept=d.me.depts[0];
    if(!$('pPay').hidden) payRender();
  },function(m){ $('pPay').innerHTML=''; note(m,'bad',true); });
}

/* ── 저장: 화면 먼저 → 뒤에서 한 번에. 마지막 응답만 받아들인다(중간 응답이 방금 고친 칸을 덮지 않게) */
function paySave(ops){
  PY.q2++;
  run('apiPaySave',[ops],function(d){
    PY.pend.push(d);
    if(--PY.q2>0) return;   // 중간 응답이 방금 고친 칸을 덮지 않게 — 다 오면 차례대로
    var P=PY.pend; PY.pend=[];
    P.forEach(function(x){ if(x.part) pyMerge(x); else { if(!x.me && PY.d) x.me=PY.d.me; PY.d=x; } });
    payRender(); pyRingOps(ops);
  }, function(m){ PY.q2--; PY.pend=[]; note(pyFailMsg(ops,m),'bad',true); PY.d=null; payFetch(); });
}
/** 저장된 칸에 링 1회 — 칸·상태·칸 메모는 그 칸, 메모·환율은 그 단추 */
function pyRingOps(ops){
  if(!window.MO) return;
  (ops||[]).forEach(function(o,i){
    var k=o.ym+'|'+o.id, sel=(o.t==='cell'||o.t==='st'||o.t==='cmemo')?'td.pc[data-pycell="'+k+'|'+o.pm+'"]':o.t==='memo'?'[data-pymemo="'+k+'"]':o.t==='rate'?'[data-pyrate="'+k+'"]':'';
    if(sel) MO.ring(document.querySelector('#pPay '+sel), i*30);
  });
}
/** 저장 실패 알림 — 무엇이(건·칸)·왜(서버 사유)·어떻게(되돌렸으니 다시) */
function pyFailMsg(ops,m){
  var o=ops[0]||{}, r=PY.d&&o.id?pyRow(o.ym+'|'+o.id):null;
  var what={cell:o.pm?pyM(o.pm)+' 말 금액':'금액',st:o.pm?pyM(o.pm)+' 말 상태':'상태',cmemo:'칸 메모',memo:'메모',rate:'환율',adj:'조정',rules:'결제조건'}[o.t]||'대금';
  return '대금 저장 안 됨 — '+(r?r.v+' '+pyYm2(r.ym)+' ':'')+what+'. '+m+' 화면은 저장된 값으로 되돌렸습니다.';
}
/** 저장 응답(고친 건만) → 목록에 갈아끼운다. 정렬은 서버 paySort_ 와 같다 */
function pyMerge(x){
  if(!PY.d) return;
  var ks={}; x.keys.forEach(function(k){ ks[k]=1; });
  PY.d.rows=PY.d.rows.filter(function(r){ return !ks[pyKey(r)]; }).concat(x.rows);
  PY.d.rows.sort(function(p,q){ return p.d<q.d?-1:p.d>q.d?1:p.ym<q.ym?-1:p.ym>q.ym?1:(q.T||q.tot)-(p.T||p.tot); });
  if(x.at) PY.d.at=x.at;
}
function pyTot(r){ var t=0; r.cells.forEach(function(c){ t+=c.a; }); r.tot=t; }
function pyCell(r,pm){
  var c=r.cells.filter(function(x){ return x.m===pm; })[0];
  if(!c){ c={m:pm,a:0,b:0,auto:0,adj:0,st:'예정',man:0,memo:''}; r.cells.push(c); r.cells.sort(function(a,b){ return a.m<b.m?-1:1; }); }
  return c;
}

/* ── 그리기 */
function payRender(){
  var D=PY.d; if(!D) return;
  var me=D.me||{}, depts=(D.depts||[]).slice().sort(pyDsort);
  var h='<div class="ftool">'+paSeg2('data-pyseg',PY.seg,[['ym','입고월'],['pm','지급월'],['vd','거래처'],['sum','요약'],['rule','결제조건']],'보기');
  if(PY.seg!=='rule') h+=paSeg2('data-pydept',PY.dept,[['','전체']].concat(depts.map(function(d){ return [d,d]; })),'본부');
  if(PY.seg==='pm'||PY.seg==='ym'||PY.seg==='vd') h+='<input type="text" id="pyQ" value="'+kesc(PY.q)+'" placeholder="거래처 · 메모">'
    +'<button class="ib1" id="pyCsv" title="다운로드" aria-label="다운로드">'+ico('dl')+'</button>';
  if(PY.seg==='rule' && me.fin) h+='<span style="margin-left:auto"><button class="btn sm" id="pyRAdd">행 추가</button> <button class="btn sm go" id="pyRSave">결제조건 저장</button></span>';
  h+='</div><div id="pyBody">'+payBody()+'</div>';
  tblHTML($('pPay'),h,payBind); PY.drawn=D; pyPmSync(D);   // 줄이 많으면 나눠 붙인다(App.html tblHTML)
  if(window.MO) MO.first($('pPay'), D);   // 새 목록을 처음 그릴 때만 등장
  payBind();
  if(PY.up && PY.seg==='ym'){ var u=PY.up; PY.up=null; tblFlush($('pPay')); pyFlashUp(u); }
  if(typeof ui!=='undefined' && ui.ddEnhanceAll) ui.ddEnhanceAll();
}
function payBody(){ return PY.seg==='ym'? payViewIn() : PY.seg==='pm'? payViewPm() : PY.seg==='vd'? payViewVd() : PY.seg==='rule'? payViewRule() : payViewYm(); }

function pyShape(r,c){
  var i=PY_ST.indexOf(c.st), t=c.st+(PY.d.me.fin?' — 누르면 다음 상태':'');
  var s=i===2? '<span class="sd sd-ok">'+ico('check')+'</span>' : i===1? '<span class="sd sd-me"></span>' : '<span class="sd sd-no"></span>';
  return '<button class="sdb" data-pyst="'+kesc(pyKey(r))+'|'+c.m+'" title="'+t+'" aria-label="'+t+'"'+(PY.d.me.fin?'':' disabled')+'>'+s+'</button>';
}
function pyAmt(r,c){
  var cls='pa'+(c.man?' man':'')+(c.adj?' adj':'');
  var tt=[c.man?'수동':'', c.adj?'조정 '+kf(c.adj):'', c.drift?'자동 '+kf(c.auto+c.adj):'', c.memo].filter(Boolean).join(' · ');
  return '<span class="'+cls+'"'+(tt?' title="'+kesc(tt)+'"':'')+'>'+(c.a<0?'<span class="neg">'+kf(c.a)+'</span>':kf(c.a))+'</span>'+(c.drift?' <span class="sd sd-n" title="'+kesc(tt)+'">!</span>':'');
}
function pyHit(r){
  if(PY.dept && r.d!==PY.dept) return false;
  var q=String(PY.q||'').replace(/\s+/g,'').toLowerCase();
  return !q || (r.v+r.memo+r.cond).replace(/\s+/g,'').toLowerCase().indexOf(q)>=0;
}
/** 지급월 보기 — 기준월 M 말에 지급할 칸: 입고월 < M 이고 M·M+1·M+2 에 남은 칸이 있는 건(환율 기다리는 수입 포함) */
function pyPmRows(){
  var M=PY.bm, ms=[M,pyAddM(M,1),pyAddM(M,2)];
  return { ms:ms, yc:1, rows:PY.d.rows.filter(function(r){
    if(r.ym>=M || !pyHit(r)) return false;
    if(r.T===null && r.usd && r.ym===pyAddM(M,-1)) return true;
    return r.cells.some(function(c){ return ms.indexOf(c.m)>=0 && (c.a || c.man || c.st!=='예정'); });
  }) };
}
/** 입고월 보기 — 기준월에 입고된 건. 열 = 그 건들의 실제 지급월 칸 */
function pyInRows(){
  var M=PY.bm, ms={}, rows=PY.d.rows.filter(function(r){ return r.ym===M && pyHit(r); });
  rows.forEach(function(r){ r.cells.forEach(function(c){ ms[c.m]=1; }); });
  var k=Object.keys(ms).sort(); if(!k.length) k=[pyAddM(M,1)];
  return { ms:k, yc:0, rows:rows };
}
function payViewPm(){ var P=pyPmRows(); return P.rows.length? payTable(P) : '<div class="hint" style="padding:var(--sp-3) 2px">'+kesc(PY.bm)+' 말 지급 대금 없음</div>'; }
function payViewIn(){ var P=pyInRows(); return P.rows.length? payTable(P) : '<div class="hint" style="padding:var(--sp-3) 2px">'+kesc(PY.bm)+' 입고 대금 없음</div>'; }
/** 건 표 — 입고월·지급월 보기 공용. P = {ms 지급월 열, rows, yc 입고월 열 보임} */
function payTable(P){
  var ms=P.ms, N=ms.length, W=P.yc?2:1, NC=W+N+3, by={}, h='';
  var z=function(){ return ms.map(function(){ return 0; }); }, sm=function(a){ return a.reduce(function(s,x){ return s+x; },0); };
  P.rows.forEach(function(r){ (by[r.d]||(by[r.d]=[])).push(r); });
  var cv=function(r,m){ var c=r.cells.filter(function(x){ return x.m===m; })[0]; return c?c.a:0; };
  var tot=z(), vt={};
  h+='<div class="hstk"><table class="pyt"><colgroup><col>'+(P.yc?'<col class="c-ym">':'')+ms.map(function(){ return '<col class="c-m">'; }).join('')+'<col class="c-t"><col class="c-me"><col class="c-b"></colgroup>'
    +'<thead><tr><th>거래처</th>'+(P.yc?'<th>입고월</th>':'')+ms.map(function(m){ return '<th class="n">'+pyM(m)+' 말</th>'; }).join('')
    +'<th class="n">TTL</th><th>메모</th><th></th></tr></thead><tbody>';
  Object.keys(by).sort(pyDsort).forEach(function(d){
    var rs=by[d].sort(function(a,b){ return a.ym<b.ym?1:a.ym>b.ym?-1:(b.tot-a.tot); }), st=z();
    rs.forEach(function(r){ ms.forEach(function(m,i){ st[i]+=cv(r,m); }); });
    var fold=!!PY.fold[d];
    h+='<tr class="pgh'+(fold?' fold':'')+'" data-pyfold="'+kesc(d)+'"><td colspan="'+W+'">'+ico('chev')+' '+kesc(d)+' <span class="hint">'+rs.length+'</span></td>'
      +st.map(function(x){ return '<td class="n">'+kf(x)+'</td>'; }).join('')+'<td class="n">'+kf(sm(st))+'</td><td></td><td></td></tr>';
    st.forEach(function(x,i){ tot[i]+=x; });
    rs.forEach(function(r){
      var e=vt[r.v]||(vt[r.v]=z()); ms.forEach(function(m,i){ e[i]+=cv(r,m); });
      if(fold) return;
      var k=pyKey(r), ed=pyCan(r), t3=0;
      h+='<tr data-pyk="'+kesc(k)+'"><td class="vend">'+kesc(r.v)+(r.ex&&r.pp?' <span class="pill acc" title="'+kesc(r.cond)+'">'+r.pp.join('·')+'</span>':'')
        +(r.k==='수입'?' <span class="hint" title="'+(r.rate?'환율 '+r.rate:'환율 없음')+'">$'+kf2(r.usd)+'</span>':'')+'</td>'
        +(P.yc?'<td class="hint">'+kesc(pyYm2(r.ym))+'</td>':'');
      if(r.T===null && r.usd){
        h+='<td class="n" colspan="'+N+'"><button class="ib on" data-pyrate="'+kesc(k)+'" title="환율 입력" aria-label="환율 입력"><span class="sd sd-bad">!</span></button> <span class="hint">확인 필요</span></td><td class="n">–</td>';
      } else {
        ms.forEach(function(m){
          var c=r.cells.filter(function(x){ return x.m===m; })[0];
          if(c) t3+=c.a;
          h+='<td class="n'+(ed?' pc':'')+'" data-pycell="'+kesc(k)+'|'+m+'">'+(c?pyShape(r,c)+pyAmt(r,c):'<span class="hint">·</span>')+'</td>';
        });
        h+='<td class="n"><b>'+kf(t3)+'</b></td>';
      }
      h+='<td><div class="memo" title="'+kesc(r.memo)+'">'+kesc(r.memo)+'</div></td><td style="white-space:nowrap">'
        +(ed?'<button class="ib'+(r.adjs.length?' on':'')+'" data-pyadj="'+kesc(k)+'" title="조정'+(r.adjs.length?' '+r.adjs.length+'건':'')+'" aria-label="조정">'+ico('coins')+'</button>'
          +'<button class="ib'+(r.memo?' on':'')+'" data-pymemo="'+kesc(k)+'" title="메모" aria-label="메모">'+ico('msg')+'</button>'
          +(r.k==='수입'?'<button class="ib" data-pyrate="'+kesc(k)+'" title="환율 '+(r.rate||'')+'" aria-label="환율">'+ico('fx')+'</button>':''):'')
        +'</td></tr>';
      if(PY.open===k) h+=pyAdjRow(r,ms,NC);
    });
  });
  h+='</tbody><tfoot><tr><td colspan="'+W+'">합계</td>'+tot.map(function(x){ return '<td class="n">'+kf(x)+'</td>'; }).join('')
    +'<td class="n">'+kf(sm(tot))+'</td><td></td><td></td></tr>'+pyCheckRow(W,N)+'</tfoot></table></div>';
  var vs=Object.keys(vt).filter(function(v){ return vt[v].some(function(x){ return x; }); }).sort(function(a,b){ return sm(vt[b])-sm(vt[a]); });
  if(vs.length) h+='<div class="psec"><div class="hstk"><table class="pyt"><colgroup><col>'+ms.map(function(){ return '<col class="c-m">'; }).join('')+'<col class="c-t"></colgroup><thead><tr><th>거래처</th>'+ms.map(function(m){ return '<th class="n">'+pyM(m)+' 말</th>'; }).join('')+'<th class="n">TTL</th></tr></thead><tbody>'
    + vs.map(function(v){ var e=vt[v]; return '<tr><td>'+kesc(v)+'</td>'+e.map(function(x){ return '<td class="n">'+kf(x)+'</td>'; }).join('')+'<td class="n"><b>'+kf(sm(e))+'</b></td></tr>'; }).join('')
    + '</tbody></table></div></div>';
  return h;
}

/* ── 입고대장과 차이
   입고월 보기: 기준월 건 대금 합계 − 기준월 입고대장(국내 공급가×1.1 + 수입 원화). 조정·이월 건도 사유로 드러난다.
   지급월 보기: (예전 정의 유지) 기준월 바로 앞 입고월의 국내 건 — 칸 합 − (공급가×1.1 + 조정). */
function pyDiffSet(){
  var inYm=PY.seg==='ym', ym=inYm?PY.bm:pyAddM(PY.bm,-1);
  return { inYm:inYm, ym:ym, rows:PY.d.rows.filter(function(r){ return r.ym===ym && (!PY.dept || r.d===PY.dept) && (inYm || (r.k==='국내' && r.led!=null)); })
    .map(function(r){ var led=r.k==='국내'&&r.led!=null? Math.round(r.led*1.1) : r.k==='수입'&&r.limp!=null? r.limp : 0;
      return { r:r, L:led+(inYm?0:r.adj) }; }) };
}
function pyCheckRow(W,N){
  var S0=pyDiffSet(), C=0, L=0, n=S0.rows.length;
  S0.rows.forEach(function(o){ C+=o.r.tot; L+=o.L; });
  if(!n) return '';
  var v=C-L, lab=pyYm2(S0.ym)+(S0.inYm?' ':' 국내 ')+n+'건 · 입고대장 '+kf(L), t='차이 내역 — '+lab;
  return '<tr><td colspan="'+W+'" title="'+kesc(lab)+'">입고대장과 차이</td><td class="n" colspan="'+(N+1)+'">'
    +(v?'<button type="button" class="pydf" data-pydiff="1" aria-haspopup="dialog" title="'+kesc(t)+'" aria-label="'+kesc(t)+'">'+paD(v)+'</button>':paD(v))+'</td><td></td><td></td></tr>';
}
/** 차이 건별 분해 — pyCheckRow 와 같은 범위. 건 차이 = Σ(칸 b − 자동) + 조정(입고월 보기) + 나머지(끝전·수입 환율·입고대장에 없음) */
function pyDiffRows(){
  var S0=pyDiffSet(), out=[];
  S0.rows.forEach(function(o){
    var r=o.r, x=r.tot-o.L, left=x, why=[];
    if(!x) return;
    if(r.k==='이월'){ why.push({t:'입고대장에 없음', c:'warn', a:x, tip:'입고대장에 없는 건(이관·수기) — 대금 전체가 차이'}); left=0; }
