/** 생산 — 검수 의뢰 */
function onAsk(){
  flush(); work(true,'검수 의뢰 중…');
  run('apiAskReview',[S.ym,S.id,true],function(res){
    work(false);
    if(res&&res.summary){
      S.det.summary=res.summary;
      if(S.cache[S.id]) S.cache[S.id].summary=res.summary;
      var rows=S.boot.rows||[];
      for(var i=0;i<rows.length;i++) if(rows[i].id===S.id){ rows[i]=res.summary; break; }
    }
    renderInsp(); renderAll();
    note('검수를 의뢰했습니다 — 물류에서 실수량을 확인합니다','done');
  });
}

/** 사유 칸 — 그 품번·컬러에서 어긋난 줄이 있을 때만 */
function rsCell(g, SZ, editable){
  var rs=[], any=null;
  SZ.forEach(function(z){ var r=g.c[z]; if(r&&r.diff){ any=r; r.reasons.forEach(function(x){ if(rs.indexOf(x)<0) rs.push(x); }); } });
  if(!any) return '<span class="mut">–</span>';
  if(!editable) return '<span class="hint">'+esc(rs.join(', ')||'미선택')+'</span>';
  var A=(S.det.reasons.a||[]), B=(S.det.reasons.b||[]);
  return '<select class="rs" data-rk="'+esc(g.item+'|'+g.cc)+'">'
    +'<option value="">— 사유 —</option>'
    +'<optgroup label="오부착 (차월 입고)">'+A.map(function(x){
        return '<option'+(rs.indexOf(x)>=0?' selected':'')+'>'+esc(x)+'</option>'; }).join('')+'</optgroup>'
    +'<optgroup label="부족">'+B.map(function(x){
        return '<option'+(rs.indexOf(x)>=0?' selected':'')+'>'+esc(x)+'</option>'; }).join('')+'</optgroup>'
    +'</select>';
}

/** 예정을 잘못 눌러 생긴 건은 되돌릴 수 있어야 한다.
 *  라인시트에서 온 건이고, 아직 아무도 검수·확정하지 않았을 때만. */
function canDrop(){
  var d=S.det, m=d&&d.meta, sm=d&&d.summary;
  if(!S.boot.canProd || !m) return false;
  if(String(m['출처']||'')!=='라인시트') return false;
  // act 는 WMS·검수가 없으면 «예정 수량» 이 그대로 들어온다 — 손댔는지의 잣대가 못 된다.
  // 아직 «예정만» 인 건, 즉 아무도 검수를 시작하지 않은 건만 되돌린다.
  if(sm && (sm.has_wms || sm.re_q || String(sm.state||'')!=='예정만')) return false;
  if(String(m['상태']||'')==='확정') return false;
  return true;
}
function dropRec(){
  var m=S.det&&S.det.meta; if(!m) return;
  var b=$('iDrop');
  if(b && b.getAttribute('data-ask')!=='1'){          // 팝업 대신 버튼이 직접 묻는다
    b.setAttribute('data-ask','1');
    b.textContent='한 번 더 누르면 지웁니다';
    b.classList.add('go');
    setTimeout(function(){
      if(b && b.getAttribute('data-ask')==='1'){
        b.removeAttribute('data-ask'); b.textContent='이 건 지우기'; b.classList.remove('go');
      }
    }, 5000);
    return;
  }
  work(true,'지우는 중…');
  run('apiDelete',[S.ym,S.id],function(){
    S.cache={}; S.id=null; S.det=null; $('insp').innerHTML='';
    run('apiBoot',[S.ym],function(b){
      work(false); S.boot=b; renderBrands(); renderAll();
      note('지웠습니다 — 예정 목록에 다시 떴습니다','done');
    });
  },function(msg){ work(false); note(msg,'bad',true); });
}

function rowOf(k){ var R=(S.det&&S.det.rows)||[]; for(var i=0;i<R.length;i++) if(R[i].k===k) return R[i]; return null; }

/** 한 줄과 위쪽 요약만 고쳐 쓴다 — 표를 다시 그리면 포커스와 스크롤이 날아간다 */
function patchRow(k){
  var d=S.det; if(!d) return;
  var mode=inspRole(), prod=(mode==='prod');
  var row=rowOf(k); if(!row) return;
  var gk=row.item+'|'+row.cc;
  var tr=$('insp').querySelector('tr[data-g="'+cssq(gk)+'"]');
  if(tr){
    var gs=0,gp=0,ga=0,gd=0,gneed=0,ggap=0;
    (d.rows||[]).forEach(function(r){
      if(r.item+'|'+r.cc!==gk) return;
      gs+=(r.sheet||r.plan); gp+=r.plan; ga+=r.act; gd+=(r.act-r.plan);
      if((r.sheet||r.plan)!==r.plan) ggap++;
      if((r.act-r.plan)&&!r.reasons.length) gneed++;
    });
    var c;
    if(prod){
      if((c=tr.querySelector('[data-c="p"]'))) c.innerHTML='<b>'+fmt(gp)+'</b>';
      var g2=gp-gs;
      if((c=tr.querySelector('[data-c="d"]'))){ c.textContent=g2?sgn(g2):'–';
        c.style.color=g2?'var(--bad)':'var(--ink-3)'; }
      if((c=tr.querySelector('[data-c="m"]'))) c.textContent=g2?(g2<0?'미납 — 다음 차수로':'초과 납품'):'';
      tr.className=ggap?'diff':'';
    }else{
      if((c=tr.querySelector('[data-c="a"]'))) c.innerHTML='<b>'+fmt(ga)+'</b>';
      if((c=tr.querySelector('[data-c="d"]'))){ c.textContent=gd?sgn(gd):'–';
        c.style.color=gd?'var(--bad)':'var(--ink-3)'; }
      tr.className=gneed?'need':(gd?'diff':'');
    }
  }
  patchSum();
}

/** 위쪽 숫자 타일과 아래쪽 버튼 상태만 */
function patchSum(){
  var T=inspSum(), mode=inspRole(), prod=(mode==='prod');
  function set(name,txt,cls){
    var el=$('insp').querySelector('[data-s="'+name+'"]'); if(!el) return;
    el.textContent=txt;
    el.className='v'+(cls?(' '+cls):'');
  }
  set('plan',fmt(T.plan));
  if(!prod) set('act',fmt(T.act));
  if(prod){
    var v=T.plan-T.sheet;
    set('vs',v?sgn(v):'0', v<0?'neg':(v>0?'pos':''));
    set('gap',String(T.gap), T.gap?'neg':'');
  }else{
    set('diff',T.diff?sgn(T.diff):'0', T.diff<0?'neg':(T.diff>0?'pos':''));
    set('need',String(T.need), T.need?'neg':'');
  }
  var done=$('iDone');
  if(done){
    done.disabled=!!T.need;
    var hint=done.nextElementSibling;
    if(hint&&hint.className==='hint')
      hint.textContent=T.need?('어긋난 칸 '+T.need+'개에 사유를 골라야 누를 수 있습니다.')
                             :'이 건이 닫히고 월마감 대사로 넘어갑니다.';
  }
  var pill=$('insp').querySelector('.insph .pill');
  if(pill&&prod){
    pill.textContent=T.gap?('라인시트와 '+T.gap+'칸 다름'):'라인시트와 같음';
    pill.className='pill '+(T.gap?'warn':'ok');
  }
}

/** 속성 선택자에 넣을 수 있게 따옴표를 막는다 */
function cssq(v){ return String(v).replace(/"/g,'\\"'); }

function bindCells(){
  S.el={};
  $('insp').querySelectorAll('input.q[data-k]').forEach(function(inp){
    var k=inp.getAttribute('data-k'); S.el[k]=inp;
    inp.onchange=function(){
      var r=rowOf(k); if(!r) return;
      r.act=Math.max(0, parseInt(String(inp.value).replace(/[^\d]/g,''))||0);
      inp.value=r.act;
      queue(k,{act:r.act}); patchRow(k);
    };
  });
  // 생산 — 명세서 수량
  $('insp').querySelectorAll('input.q[data-p]').forEach(function(inp){
    var k=inp.getAttribute('data-p');
    inp.onchange=function(){
      var r=rowOf(k); if(!r) return;
      var v=Math.max(0, parseInt(String(inp.value).replace(/[^\d]/g,''))||0);
      r.plan=v; if(r.wms===null) r.act=v;
      inp.value=v;
      var one={}; one[k]=v;
      mark('저장 중…');
      run('apiPlanEdit',[S.ym,S.id,one],function(res){
        mark('저장됨 ✓','on');
        if(res&&res.summary){ S.det.summary=res.summary;
          if(S.cache[S.id]) S.cache[S.id].summary=res.summary; }
        renderTl(); renderCal(); syncTabs();
      },function(m){ mark('저장 실패','err'); note(m,'bad',true); });
      patchRow(k);
    };
  });
  $('insp').querySelectorAll('select.rs').forEach(function(sel){
    sel.onchange=function(){
      var key=sel.getAttribute('data-rk'), v=sel.value;
      (S.det.rows||[]).forEach(function(r){
        if(r.item+'|'+r.cc!==key || !r.diff) return;
        r.reasons = v?[v]:[];
        queue(r.k,{reasons:r.reasons});
      });
      patchRow(key.split('|')[0]+'|'+key.split('|')[1]+'|'+(S.det.sizes||[''])[0]);
      patchSum();
    };
  });
}
function queue(k,patch){
  S.pend[k]=Object.assign(S.pend[k]||{},patch);
  mark('저장 중…');
  clearTimeout(S.saveT); S.saveT=setTimeout(flush,700);
}
function mark(t,cls){ var e=$('iSaved'); if(e){ e.textContent=t; e.style.color=cls==='err'?'var(--bad)':(cls==='on'?'var(--ok)':'var(--ink-3)'); } }
function flush(sync){
  clearTimeout(S.saveT);
  var keys=Object.keys(S.pend); if(!keys.length) return;
  var body=S.pend, ym=S.ym, id=S.id; S.pend={}; S.inflight++;
  run('apiReview',[ym,id,body],function(res){
    S.inflight--;
    if(res&&res.summary&&S.cache[id]) S.cache[id].summary=res.summary;
    if(S.id===id&&!S.inflight&&!Object.keys(S.pend).length) mark('저장됨 ✓','on');
    var rows=S.boot.rows||[];
    for(var i=0;i<rows.length;i++) if(rows[i].id===id && res&&res.summary){ rows[i]=res.summary; break; }
    renderTl(); renderCal(); syncTabs();
  },function(m){ S.inflight--; mark('저장 실패','err'); note('저장하지 못했습니다 — '+m,'bad',true); });
}
function onDone(){
  var on=true;
  flush(); work(true,'확인 처리 중…');
  run('apiConfirm',[S.ym,S.id,on],function(res){
    work(false);
    if(res&&res.summary){
      S.det.summary=res.summary;
      if(S.cache[S.id]) S.cache[S.id].summary=res.summary;
      var rows=S.boot.rows||[];
      for(var i=0;i<rows.length;i++) if(rows[i].id===S.id){ rows[i]=res.summary; break; }
    }
    renderInsp(); renderAll();
    note('확인 완료 — 월마감 대사로 넘어갑니다','done');
  });
}

/** 예정 줄을 누르면 그 자리에서 건이 되고 조정 화면이 열린다.
 *  «건 만들기» 라는 행위를 사람에게 시키지 않는다. */
function makeFromPending(key, el){
  if(!S.boot.canProd){ note('생산 담당자만 확정할 수 있습니다','warn'); return; }
  var p=(S.boot.pending||[]).filter(function(x){ return x.key===key; })[0];
  if(!p) return;
  // 누르는 즉시 그 줄을 «만드는 중» 으로 바꾼다 — 서버는 몇 초 걸리고, 그동안 멍하니 두지 않는다
  if(el){ el.style.opacity='.45'; el.classList.add('busy'); el.style.pointerEvents='none';
    var pill=el.querySelector('.pill'); if(pill){ pill.textContent='만드는 중…'; pill.className='pill'; } }
  work(true,(p['출고처']||'')+' 예정을 건으로 만드는 중…');
  run('apiFromLs',[S.ym,key,p['입고처']||'',p['출고일']||''],function(res){
    work(false); S.cache={};
    // 목록을 통째로 다시 받지 않는다 — 새 줄을 끼우고 그 예정만 뺀다
    if(res&&res.row){
      S.boot.rows=(S.boot.rows||[]).filter(function(x){ return x.id!==res.row.id; }).concat([res.row]);
      S.boot.pending=(S.boot.pending||[]).filter(function(x){ return x.key!==key; });
      renderBrands(); renderAll();
    }
    if(res&&res.id) openDetail(res.id);
    note((p['출고처']||'')+' 건이 열렸습니다 — 입고명세서 수량으로 맞춰 주세요','done');
  },function(m){ work(false);
    if(el){ el.style.opacity=''; el.classList.remove('busy'); el.style.pointerEvents=''; }
    note(m,'bad',true); });
}

/* ── 파일 올리기 ──────────────────────────────── */
/** 파일 하나를 서버로 보낸다. 고르기와 끌어놓기가 같은 길을 쓴다. */
/** at(frac, label) 을 주면 이 파일 안의 진행(0~1)을 그쪽에 넘긴다 —
    여러 개를 올릴 때 바깥이 «몇 번째 중 어디» 로 바꿔 막대를 채운다.
    안 주면 스스로 hold.step(label) 만 한다. */
function sendFile(kind, file, then, at){
  if(!file) return;
  var say=function(f,label){ if(at) at(f,label); else hold.step(label); };
  var fr=new FileReader();
  hold(true, (S.holdT||'올리는 중…'), file.name+' 읽는 중…');
  say(0, file.name+' 읽는 중…');
  fr.onload=function(){
    var b64=String(fr.result).split(',')[1];
    var ym=curYm()||S.ym;                       // «보낸 당시» 의 달을 붙잡아 둔다
    say(.35, file.name+' 보내는 중…');
    var api = (kind==='close')?'apiCloseUpload' : (kind==='uni'?'apiUnipassUpload':'apiUpload');
    var args = (kind==='close'||kind==='uni')
      ? [ym,file.name,b64,file.type]
      : [ym,(kind==='wms'?S.id:null),kind,file.name,b64,file.type];
    say(.55, null);
    run(api,args,function(r){
      say(1, file.name+' 끝');
      if(then){ then(null, r); return; }
      hold(false);
      note(upWhat_(kind, file, r), 'done');
      // 올리는 사이에 달을 바꿨으면 화면 갱신은 버린다 —
      // 9월을 보고 있는데 8월 숫자로 덮어쓰는 일이 여기서 났다(closeBoot 에는 있던 방어다)
      if(String(ym)!==String(curYm()||S.ym)){
        note('올리는 사이 달을 바꿔 화면은 그대로 뒀습니다 — '+ym+' 에는 올라갔습니다','warn',true);
        return;
      }
      S.close=null;
      if(kind==='close'||kind==='uni'){ closeBoot(ym,true); }
      else { S.cache={}; boot(ym,true); if(S.id) openDetail(S.id); }
    }, function(m){
      // 실패해도 다음 파일로 넘어간다 — 여기서 멈추면 3개 중 2번째가 깨졌을 때
      // 3번째는 영영 안 올라가고 화면은 아무 말도 안 했다
      if(then){ then(String(m)); return; }
      hold(false);
      note(file.name+' — '+m,'bad',true);
    });
  };
  fr.readAsDataURL(file);
}

/** 무엇이 몇 건 올라갔는지. 서버는 이미 알려 주는데 화면이 버리고 있었다 —
    «올린 게 맞나» 를 모르겠다는 말이 여기서 나왔다. */
function upWhat_(kind, file, r){
  if(!r) return file.name+' 판독 완료';
  if(kind==='uni'){
    var bl=(r.bl||[]).join(', ');
    return '유니패스 '+fmt(r.rows||0)+'건 접수'+(bl?(' — '+bl):'');
  }
  if(kind==='close'){
    return file.name+' — '+fmt(r.rows||0)+'행 · '+fmt(r.qty||0)+'PC'
      +((r.brands&&r.brands.length)?(' · '+[].concat(r.brands).join('·')):'');
  }
  return (r.id?(r.id+' — '):'')+file.name+' 판독 완료';
}

/** 여러 개를 끌어다 놓으면 한 개씩 차례로 — 동시에 보내면 서버에서 서로 덮어쓴다 */
function sendFiles(kind, files){
  var list=[].slice.call(files||[]).filter(function(f){ return /\.(xlsx|xls)$/i.test(f.name); });
  var bad=(files?files.length:0)-list.length;
  if(bad) note('엑셀(.xlsx)만 받습니다 — '+bad+'개는 넘겼습니다','warn');
  if(!list.length) return;
  var fails=[], oks=[], N=list.length, ym0=curYm()||S.ym;
  // 여러 개면 «몇 번째 중 어디» 가 막대로 찬다. 하나면 진행률을 알 길이 없으니
  // 불확정 띠 + 단계 문구로 간다 — 0% 에 붙어 있는 막대가 더 불안하다.
  var P=function(k){ return N>1 ? (k/N) : null; };
  S.holdT = N>1 ? ('올리는 중… 1 / '+N) : '올리는 중…';
  hold(true, S.holdT, list[0].name, P(0));
  (function next(i){
    if(i>=N){
      hold(false); S.holdT=null;
      oks.forEach(function(m){ note(m,'done'); });
      if(fails.length) note((N-fails.length)+'개 올림 · '+fails.length+'개 실패 — '
        +fails.join(' / '), 'bad', true);
      if(String(ym0)!==String(curYm()||S.ym)){
        note('올리는 사이 달을 바꿔 화면은 그대로 뒀습니다 — '+ym0+' 에는 올라갔습니다','warn',true);
        return;
      }
      if(kind==='close'||kind==='uni'){
        // 막는 화면을 내리지 않고 장부를 받는다 — 여기서 내리면 화면이 바뀔 때까지 몇 초가 빈다.
        // 그리고 «재료가 다 있을 때만» 이어서 돌린다 — ERP 칸과 유니패스 칸은 따로 올라가므로,
        // 유니패스가 먼저 끝나면 맞출 입고가 아직 없어 «한 것 없음» 으로 끝나 버렸다.
        hold(true, '정리하는 중', null, null);
        S.close=null; S.openStg=0;
        closeBoot(ym0, true, function(d){
          var ready = d && d.summary && d.options && d.options.uni_n;
          if(ready && typeof autoRun==='function'){ autoRun(ym0, true); return; }
          hold(false);
        });
        return;
      }
      else { S.cache={}; boot(ym0,true); if(S.id) openDetail(S.id); }
      return;
    }
    S.holdT = N>1 ? ('올리는 중… '+(i+1)+' / '+N) : '올리는 중…';
    hold(true, S.holdT, list[i].name, P(i));
    sendFile(kind, list[i], function(err, r){
      if(err) fails.push(list[i].name+': '+err);
      else oks.push(upWhat_(kind, list[i], r));
      hold.step(null, P(i+1));
      next(i+1);
    }, function(f, label){
      hold.step(label, N>1 ? ((i+f)/N) : null);
    });
  })(0);
}

function pick(kind){
  S.kind=kind;
  var f=$('ff'); f.value='';
  f.onchange=function(){ sendFiles(kind, f.files); };
  f.click();
}

/** data-drop="close|uni" 가 붙은 상자에 끌어다 놓기를 단다.
    dragover 에서 preventDefault 를 안 하면 브라우저가 파일을 그냥 열어 버린다. */
function bindDrops(root){
  (root||document).querySelectorAll('[data-drop]').forEach(function(z){
    if(z.__dnd) return; z.__dnd=1;
    var kind=z.getAttribute('data-drop'), deep=0;
    function off(){ deep=0; z.classList.remove('over'); }
    z.addEventListener('dragenter', function(e){ e.preventDefault(); deep++; z.classList.add('over'); });
    z.addEventListener('dragover',  function(e){ e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
    z.addEventListener('dragleave', function(){ if(--deep<=0) off(); });
    z.addEventListener('drop', function(e){
      e.preventDefault(); off();
      sendFiles(kind, e.dataTransfer && e.dataTransfer.files);
    });
  });
}

/* 상자 밖에 떨어뜨리면 브라우저가 파일을 열어 버려 작업이 날아간다 — 창 전체에서 막는다 */
['dragover','drop'].forEach(function(t){
  window.addEventListener(t, function(e){
    if(e.target.closest && e.target.closest('[data-drop]')) return;
    e.preventDefault();
  });
});

<script>
/* ── 월마감 — ③④⑤⑥⑦ 이 위에서 아래로 한 단계씩 열린다 ─────────────
 *
 * 한 걸음은 제자리에서 끝난다. 단계를 열면 그 단계에 필요한 전부가 그 안에 있다 —
 * 다른 탭도, 주소창도 부르지 않는다. 예전엔 관세가 «?duty=» 에만, 환율 자동이 «?fxauto=» 에만,
 * 부대비용 넣기가 수불부 탭에만 있어서, 단계를 따라가다 매번 화면을 떠나야 했다.
 *
 * 진행 표시 규칙은 셋뿐이다.
 *   1. 단계의 진행은 «카드 머리» 와 맨 위 «지금 할 일» 띠에만. 판정은 언제나 데이터(okBy)에서.
 *   2. 오래 걸리는 일은 «그 일을 시킨 단추» 가 말한다(btnGo). 숫자가 전부 바뀌는 일만 화면을 막는다(hold).
 *   3. 제안은 알림에 넣지 않는다 — 알림은 사라지는 물건이고 제안은 읽고 판단하는 물건이다.
 *      «미리보기 → 적용» 패널로 그 카드 안에 편다.
 */

function closeBoot(ym, quiet, then){
  ym = ym || curYm();
  if(S.close && S.closeYm===ym && quiet!==false){ closeRender(); if(then) then(S.close); return; }
  if(!quiet) $('pClose').innerHTML='<div class="skel">불러오는 중…</div>';
  run('apiLedger',[ym],function(r){
    var d=r&&r.close;
    if(!d || String(d.ym)!==String(curYm())) { if(then) then(null); return; }
    S.close=d; S.closeYm=d.ym; S.stock=(r&&r.stock)||null;
    closeRender();
    if(then) then(d);
  },function(m){ $('pClose').innerHTML='<div class="skel">'+esc(m)+'</div>'; if(then) then(null); });
}

function stgCard(no,title,sub,state,inner,open){
  var cls = (state==='done'||state==='skip')?'on':(state==='now'?'now':'');
  var lab = state==='skip'?'해당 없음':(state==='done'?'끝남':(state==='now'?'지금':'대기'));
  return '<div class="stg'+(state==='lock'?' lock':'')+'">'
    +'<button class="stgh" data-stg="'+no+'">'
    +'<span class="stgn '+cls+'">'+(state==='done'?'✓':(state==='skip'?'–':no))+'</span>'
    +'<span class="stgt"><b>'+esc(title)+'</b><br><span class="s">'+sub+'</span></span>'
    +'<span class="hint">'+lab+'</span></button>'
    +'<div class="stgb" data-stgb="'+no+'"'+(open?'':' hidden')+'>'+inner+'</div></div>';
}

/** 단계 안의 «이건 이렇게 합니다» 한 줄. ④ 가 쓰던 모양을 그대로 쓴다. */
function stgTip(txt){
  return '<div class="vrow"><span class="vmk">?</span><span class="hint">'+txt+'</span><span></span></div>';
}

/** 「무엇을 · 어디서 받아 · 여기 놓는다」 — 단계마다 셋을 다 적는다.
 *  한 줄 요약은 이미 아는 사람만 읽는다. 처음 보는 사람이 막히는 곳은 늘 «어디서 받아 오나» 다. */
function stgWhat(what, from, to){
  function r(k,v){ return '<div style="display:grid;grid-template-columns:70px 1fr;gap:9px;padding:2px 0">'
    +'<span class="hint" style="font-weight:700">'+k+'</span>'
    +'<span style="font-size:12.5px;line-height:1.65">'+v+'</span></div>'; }
  return '<div class="vrow"><span class="vmk">?</span><span>'
    + r('무엇을', what) + r('어디서', from) + r('여기 놓는다', to)
    + '</span><span></span></div>';
}

/** 한 단계 안이 여러 걸음일 때(⑤ 가 그렇다) 지금 어디인지 — 끝남 / 지금 / 대기 */
function stepMark(st){
  return st==='done' ? '<span class="pill ok">끝남</span>'
       : st==='now'  ? '<span class="pill warn">지금 할 것</span>'
       :               '<span class="pill mut">대기</span>';
}
function gcCls(st){ return st==='now' ? ' wait' : ''; }

/** «거기로 가기» 단추들. 카드가 다시 그려질 때마다, 그리고 나중에 끼워 넣은
    패널 안에서도 다시 불러야 한다 — 안 그러면 글자만 있고 안 눌린다. */
function bindGoto(root){
  (root||document).querySelectorAll('[data-goto]').forEach(function(b){
    if(b._gb) return; b._gb=1;
    b.onclick=function(){
      S.openStg=+b.getAttribute('data-goto'); closeRender();
      var t=$('pClose').querySelector('[data-stgb="'+S.openStg+'"]');
      if(t) t.scrollIntoView({behavior:'smooth',block:'center'});
    };
  });
}

/** «미리보기 → 적용» 패널 — 관세·환율자동·B/L 이 같은 모양을 쓴다.
    비우기(stgReset)가 이미 이 모양으로 잘 돌고 있어 이름만 붙였다. */
function stgPrev(id, title, body, okTxt, okId, n){
  return '<div class="prev" id="'+id+'"><div class="prevh"><b>'+esc(title)+'</b>'
    +'<span style="margin-left:auto"><button class="btn sm" data-prevx="'+id+'">그만두기</button> '
    +'<button class="btn sm go" id="'+okId+'"'+(n?'':' disabled')+'>'+esc(okTxt)+'</button></span></div>'
    +'<div class="prevb">'+body+'</div></div>';
}

function closeRender(){
  var d=S.close;
  if(!d){ $('pClose').innerHTML='<div class="skel">불러오는 중…</div>'; return; }
  if(!d.summary){
    $('pClose').innerHTML='<div class="secth"><b>'+esc(d.ym)+' 월마감</b></div>'
      +'<div class="skel">ERP 입고현황이 없습니다.'+(d.canUp?' 아래 상자에 놓으면 시작합니다.':'')+'</div>'
      +(d.canUp?('<div class="gridc two">'
        +'<div class="drop" id="dZ1" data-drop="close">'
        +'<b>① ERP 입고현황</b><br>여기로 끌어다 놓거나<br>'
        +'<button class="btn go" id="bUpClose" style="margin-top:7px">고르기</button>'
        +'<div class="hint" style="margin-top:9px;line-height:1.7">'
        +'ERP ERP → 입고현황, <b>「합계 포함」</b> 으로.<br>'
        +'합계행이 없거나 '+esc(d.ym)+' 밖 입고일이 섞이면 거부합니다.</div></div>'
        +'<div class="drop" data-drop="uni">'
        +'<b>② 유니패스 수입신고 실적</b><br>여기로 끌어다 놓거나<br>'
        +'<button class="btn" id="bUpUni0" style="margin-top:7px">고르기</button>'
        +'<div class="hint" style="margin-top:9px;line-height:1.7">'
        +'유니패스 → 수입신고 실적 (조회 기간 최대 한 달).<br>'
        +'올리면 <b>B/L·환율·관세가 이어서 저절로</b> 잡힙니다. 수입이 없는 달은 건너뜁니다.</div></div>'
        +'</div>'):'');
    if($('bUpClose')) $('bUpClose').onclick=function(){ pick('close'); };
    if($('bUpUni0')) $('bUpUni0').onclick=function(){ pick('uni'); };
    bindDrops($('pClose'));   // 빈 달 화면도 끌어다 놓기를 받아야 한다
    return;
  }
  var s=d.summary;
  // 달을 바꿨는데 지난 달 «적용 결과» 가 남아 있으면 거짓말이 된다
  if(S.pvres && S.pvres.ym!==d.ym) S.pvres=null;
  var caseLeft=(S.boot&&S.boot.rows||[]).filter(isLeft).length;
  // 이 달은 건별 검수를 하지 않았는가 (입고내역만으로 마감하는 달)
  var noRecon=!(d.recon&&d.recon.n);

  /* 단계가 끝났는가 — 데이터로 직접 본다 */
  // done 은 «접수한 브랜드 수» 다. 한 본부에 브랜드가 여럿이면
  // 하나만 올려도 done=1 이라 «전부 접수» 로 보였다 — 남은 것(wait)을 봐야 한다.
  var deptLeft=(d.depts||[]).filter(function(x){
    return (x.wait!==undefined && x.wait!==null) ? x.wait>0 : !x.done; }).length;
  var nImp=(d.cards||[]).length;
  var okBy={
    3: (d.parts||[]).length>0 && !deptLeft,
    // 검수 건이 아예 없는 달은 대조할 것이 없다 — 막지 않고 지나가되 그 사실을 남긴다.
    4: (d.recon&&d.recon.n) ? (!d.recon.miss && !d.recon.bad) : true,
    // ⑤ 는 «물건값이 얼마인가», ⑥ 은 «그 위에 뭘 얹는가». 회계적으로 자명한 금이고,
    // 이 금이 생기는 순간 갈 곳 없던 환율자동·관세에 자리가 난다.
    5: !s.unres_n,
    6: d.costs.length>0 && d.costs.every(function(c){ return c.ok; }),
    7: d.checks.every(function(c){ return c.ok; }) && !!d.closed
  };
  function sgs(no){
    if(no===4 && noRecon) return 'skip';
    if(no===5 && !nImp) return 'skip';        // 수입 묶음이 없는 달은 세울 기준금액이 없다
    if(okBy[no]) return 'done';
    for(var i=3;i<no;i++) if(!okBy[i] && !(i===4&&noRecon) && !(i===5&&!nImp)) return 'lock';
    return 'now';
  }
  var openNo=S.openStg;
  if(!openNo){ [3,4,5,6,7].forEach(function(n){ if(!openNo && sgs(n)==='now') openNo=n; }); }
  if(!openNo) openNo=7;

  /* 지금 할 일 — 순서를 설명하지 않고 걸음 하나만 지목한다 */
  var NOW={
    3:['③ ERP 입고현황을 올리세요','드롭존에 엑셀을 끌어다 놓습니다'],
    4:['④ 검수와 ERP을 맞춰 보세요','차이 나는 줄이 있으면 ERP 원본을 고칩니다'],
    5:['⑤ 기준금액을 세우세요', s.unres_n?('미확정 '+fmt(s.unres_n)+'행이 남았습니다'):'수입 묶음의 환율을 확정합니다'],
    6:['⑥ 부대비용을 얹으세요','관세 → 운임·통관수수료 순으로 넣습니다'],
    7:['⑦ 검증하고 확정하세요','V1~V'+d.checks.length+' 가 전부 통과해야 눌립니다']
  };
  var nowNo=0; [3,4,5,6,7].forEach(function(n){ if(!nowNo && sgs(n)==='now') nowNo=n; });

  /* 방금 적용한 것이 «카드 머리» 에도 남는다 — 패널을 닫아도 무엇이 바뀌었는지가 보인다.
     예전엔 적용하면 패널이 닫히고 알림 한 줄이 3초 떴다가 사라졌다. */
  function justDone(no){
    var R=S.pvres;
    return (R && R.step===no && R.short) ? (' · <b style="color:var(--ok)">방금 '+esc(R.short)+'</b>') : '';
  }

  var h='<div class="secth"><b>'+esc(d.ym)+' 월마감</b>'
    +(caseLeft?('<span style="margin-left:auto" class="pill bad">건 '+caseLeft+'개 검수 대기</span>'):'')+'</div>';

  var quiet=!!(S.auto && S.auto.ym===S.ym);   // 자동 결과가 떠 있으면 지시는 그쪽 하나만
  if(!quiet) h+='<div class="todo'+(nowNo?'':' done')+'">'
    +(nowNo
      ? ('<b>지금 할 일 — '+esc(NOW[nowNo][0])+'</b><span class="hint">'+esc(NOW[nowNo][1])+'</span>'
         +'<span style="margin-left:auto;display:flex;gap:6px">'
         +((d.canCost && (nowNo===5||nowNo===6))
            ? '<button class="btn sm go" id="bAuto">자동으로 정리</button>' : '')
         +'<button class="btn sm" data-goto="'+nowNo+'">거기로</button></span>')
      : '<b>끝났습니다 — '+esc(d.ym)+' 마감 확정</b><span class="hint">결과는 수불부 탭에서 봅니다</span>')
    +'</div>';

  /* 요약 타일 */
  h+='<div class="tiles">'
    +'<div><span class="k">수량</span><div class="v">'+fmt(s.qty)+'</div><span class="s">'+fmt(s.lines)+'행 · 품번 '+s.items+'</span></div>'
    +'<div><span class="k">기준금액<i class="q" data-tip="기준">?</i></span><div class="v">'+fmt(s.base)+'</div><span class="s">부대비용 얹기 전 물건값</span></div>'
    +'<div class="cau"><span class="k">부대비용 → 재고</span><div class="v">'+fmt(s.oh_inv)+'</div><span class="s">비용처리 '+fmt(s.oh_exp)+'</span></div>'
    +'<div class="pos"><span class="k">취득원가</span><div class="v">'+fmt(s.landed)+'</div><span class="s">기준금액 + 부대비용</span></div>'
    +'<div class="'+(s.diff_pre?'neg':'')+'"><span class="k">사전원가<i class="q" data-tip="사전">?</i> 대비</span><div class="v">'+fmt(s.diff_pre)+'</div><span class="s">사전 '+fmt(s.amt_pre)+'</span></div>'
    +'</div>';

  h+=autoBox();

  /* 누르는 것 셋 */
  h+='<div class="acts">'
    +actCard(3,'①','ERP 입고현황', sgs(3),
      (d.parts||[]).length ? (fmt(s.lines)+'행 · '+fmt(s.qty)+'개') : '아직 없습니다',
      (d.parts||[]).length
        ? (esc((d.parts[0]||{}).file||'')+(deptLeft?(' · 본부 '+deptLeft+'곳 남음'):''))
        : 'ERP ERP → 입고현황 · 「합계 포함」 으로')
    +actCard(5,'②','수입신고 실적', sgs(5),
      nImp ? ('신고 '+((d.options&&d.options.uni_n)||0)+'건 · 묶음 '+nImp+'개') : '수입 없음',
      nImp ? (s.unres_n ? ('미확정 '+fmt(s.unres_n)+'행 남음') : 'B/L·환율·관세가 저절로 섰습니다')
           : '이 달은 올릴 것이 없습니다')
    +actCard(6,'③','부대비용 고르기', sgs(6),
      fmt(s.oh_inv)+'원 · '+d.costs.length+'건',
      '홈택스 후보에서 고릅니다 — 어느 묶음에 붙일지만 사람이 정합니다')
    +'</div>';

  /* 펼친 카드의 속 — 손잡이 id 가 그대로라 기존 동작이 다 살아 있다 */
  if(openNo===3) h+='<div class="actb">'+stg3(d)+'</div>';
  if(openNo===5) h+='<div class="actb">'+stg5(d,s)+'</div>';
  if(openNo===6) h+='<div class="actb">'+stg6(d,s,okBy,nImp)+'</div>';

  /* 검수 차이는 카드가 아니라 한 줄 — 넘길 일이지 내가 할 일이 아니다 */
  if(d.recon && d.recon.n && (d.recon.miss || d.recon.bad))
    h+='<div class="vrow" style="background:var(--bad-soft)"><span class="vmk no">!</span>'
      +'<span>검수와 ERP이 어긋납니다 — ERP에 없음 '+fmt(d.recon.miss)+' · 수량 차이 '+fmt(d.recon.bad)
      +'<br><span class="hint">ERP 등록을 생산팀에 요청하거나, ERP 원본을 고쳐 ① 에서 다시 올립니다.</span></span>'
      +'<span><button class="btn sm" id="bGoCase">입고 건으로</button></span></div>';

  h+=allocFlow(d,s);
  h+=ledger(d,s);

  h+='<div class="secth" style="border-top:1px solid var(--line-2)"><b>검증하고 확정</b>'
    +'<span class="hint">V1~V'+d.checks.length+(d.closed?(' · '+esc(d.closed.at)+' 확정'):'')+'</span></div>'
    +stg7(d, okBy, noRecon, nImp);

  h+=stgReset(d);

  $('pClose').innerHTML=h;
  $('pClose').querySelectorAll('[data-act]').forEach(function(b){
    b.onclick=function(){
      var no=+b.getAttribute('data-act');
      S.openStg=(S.openStg===no)?0:no; closeRender();
    };
  });
  var fb=$('bFlow');
  if(fb) fb.onclick=function(){ S.flowOpen=!S.flowOpen; closeRender(); };
  $('pClose').querySelectorAll('[data-lg]').forEach(function(tr){
    tr.onclick=function(){
      var k=tr.getAttribute('data-lg');
      S.lgOpen=(S.lgOpen===k)?'':k; closeRender();
    };
  });
  bindStg();
  bindDrops($('pClose'));
}

/** 대장을 엑셀로 — 화면에 보이는 것 그대로 */
function lgCsv(){
  var K=S.stock, d=S.close; if(!K||!K.items) return;
  var ym=d.ym, byCost={}, byFx={};
  (K.costs||[]).forEach(function(c){ byCost[c.id]=c; });
  (K.fx||[]).forEach(function(x){ byFx[x.grp]=x; });
  var out=[['품번','품명','수량','기준금액','어디서','부대비용','어느 묶음','취득원가']];
  Object.keys(K.items).forEach(function(k){
    var it=K.items[k], m=(it.m&&it.m[ym])||[0,0,0];
    if(!m[0] && !m[1] && !m[2]) return;
    var gs={};
    if(it.p) Object.keys(it.p).forEach(function(cid){
      var c=byCost[cid]; if(!c) return;
      String(c.val||'').split(';').forEach(function(g){ g=g.trim(); if(g) gs[g]=1; });
    });
    var gl=Object.keys(gs), fx=gl.length?byFx[gl[0]]:null;
    // m = [수량, 취득금액, 부대비용] — 기준금액은 취득금액에서 부대비용을 뺀 것이다
    out.push([k, it.nm||'', m[0], m[1]-m[2], (fx&&fx.mode)||'입고단가', m[2], gl.join(' '), m[1]]);
  });
  out.sort(function(a,b){ return (typeof a[7]==='number'&&typeof b[7]==='number') ? b[7]-a[7] : 0; });
  var csv='\uFEFF'+out.map(function(r){
    return r.map(function(x){ var t=String(x==null?'':x);
      return /[",\n]/.test(t) ? ('"'+t.split('"').join('""')+'"') : t; }).join(',');
  }).join('\r\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='입고대장_'+d.ym+'.csv'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  note('입고대장을 내려받았습니다','ok');
}

/** 누르는 것 한 장 */
function actCard(no, num, title, st, big, sub){
  var cls = st==='done' ? 'done' : (st==='skip' ? 'skip' : 'now');
  var lab = st==='done' ? '끝남' : (st==='skip' ? '해당 없음' : '지금');
  var open = S.openStg===no;
  return '<button class="act '+cls+(open?' open':'')+'" data-act="'+no+'">'
    +'<span class="an">'+num+'</span>'
    +'<span class="at"><b>'+esc(title)+'</b><br><span class="s">'+sub+'</span></span>'
    +'<span class="av">'+esc(big)+'<br><span class="pill '+(st==='done'?'ok':(st==='skip'?'':'a'))+'">'+lab+'</span></span>'
    +'<span class="ax">'+(open?'▾':'▸')+'</span></button>';
}

/** 부대비용이 어느 서류에서 나와 어디로 갔나 — 비용 쪽에서 본 그림. */
function allocFlow(d,s){
  var K=S.stock;
  if(!K || !(K.costs||[]).length) return '';
  var open=S.flowOpen!==false;
  var h='<div class="secth" style="border-top:1px solid var(--line-2)"><b>부대비용이 어디서 와서 어디로 갔나</b>'
    +'<span class="hint">'+fmt(s.oh_inv)+'원 · 비용 '+K.costs.length+'건</span>'
    +'<span style="margin-left:auto"><button class="btn sm" id="bFlow">'+(open?'접기':'펴기')+'</button></span></div>';
  if(!open) return h;

  /* 날짜·공급자는 마감 쪽 비용에 있다 */
  var meta={}; (d.costs||[]).forEach(function(c){ meta[c.id]=c; });
  var CS=K.costs.filter(function(c){ return c.inv && c.sum; }).map(function(c){
    var m=meta[c.id]||{};
    return { id:c.id, t:c.type, a:c.sum, wsum:c.wsum||0, g:String(c.val||'').split(';')[0].trim(),
             sup:c.sup||m.supplier||'', doc:c.doc||m.doc||'', ymd:m.date||'',
             uni:String(c.type)==='관세' };
  });
  if(!CS.length) return h+'<div class="skel">붙은 부대비용이 없습니다.</div>';

  /* 품번별 몫 */
  var rows=[];
  Object.keys(K.items).forEach(function(k){
    var it=K.items[k]; if(!it.p) return;
    var t=0, gs={};
    Object.keys(it.p).forEach(function(cid){ t+=it.p[cid];
      var c=CS.filter(function(x){ return x.id===cid; })[0]; if(c) gs[c.g]=1; });
    if(!t) return;
    rows.push({ k:k, nm:it.nm||'', v:t, g:Object.keys(gs)[0]||'', p:it.p });
  });
  if(!rows.length) return h+'<div class="skel">아직 품번으로 갈라지지 않았습니다.</div>';

  var LOT={}; CS.forEach(function(c){ LOT[c.g]=(LOT[c.g]||0)+c.a; });
  var lots=Object.keys(LOT).sort(function(a,b){ return LOT[b]-LOT[a]; });
  rows.sort(function(a,b){
    if(a.g!==b.g) return lots.indexOf(a.g)-lots.indexOf(b.g);
    return b.v-a.v; });
  /* 너무 많으면 큰 것만 — 나머지는 한 줄로 */
  var CAP=14, rest=null;
  if(rows.length>CAP){
    var tail=rows.slice(CAP);
    var byG={}; tail.forEach(function(r){ byG[r.g]=(byG[r.g]||0)+r.v; });
    rest=Object.keys(byG).map(function(g){
      return { k:'그 밖 '+tail.filter(function(r){ return r.g===g; }).length+'품번',
               nm:'', v:byG[g], g:g, p:null }; });
    rows=rows.slice(0,CAP).concat(rest);
  }

  var SUM=0; CS.forEach(function(c){ SUM+=c.a; });
  var big=function(a,b){ return b.a-a.a; };   // 얇은 줄을 아래로 — 위쪽은 띠가 엇갈려 글자가 얹힌다
  var uni=CS.filter(function(c){ return c.uni; }).sort(big),
      htx=CS.filter(function(c){ return !c.uni; }).sort(big);
  var uSum=0; uni.forEach(function(c){ uSum+=c.a; });
  var hSum=0; htx.forEach(function(c){ hSum+=c.a; });

  var W=980, SX=8, SW=126, CX=212, CW=98, MX=398, MW=112, RX=596;
  var GAP=7, scale=360/SUM;
  var L={}, y=26;
  uni.forEach(function(c){ var hh=Math.max(c.a*scale,9); L[c.id]={y:y,h:hh}; y+=hh+GAP; });
  var uEnd=y; y+=uni.length?42:0;
  var hStart=y;
  htx.forEach(function(c){ var hh=Math.max(c.a*scale,9); L[c.id]={y:y,h:hh}; y+=hh+GAP; });
  var M={}, y2=26;
  lots.forEach(function(g){ M[g]={y:y2,h:LOT[g]*scale}; y2+=M[g].h+24; });
  var R={}, y3=26;
  rows.forEach(function(r){ var hh=Math.max(r.v*scale,11); R[r.k]={y:y3,h:hh}; y3+=hh+6; });
  var HH=Math.max(y,y2,y3)+14;

  var g2='';
  if(uni.length) g2+='<rect x="'+SX+'" y="8" width="'+(CX+CW-SX)+'" height="'+(uEnd-2)+'" '
    +'fill="var(--acc)" opacity=".07" rx="3"/>'
    +'<text x="'+(SX+6)+'" y="21" font-size="11" fill="var(--acc)" font-weight="700">'
    +'유니패스 수입신고 — 관세 '+fmt(uSum)+'</text>';
  if(htx.length) g2+='<rect x="'+SX+'" y="'+(hStart-18)+'" width="'+(CX+CW-SX)+'" height="'+(y-hStart+20)+'" '
    +'fill="var(--warn)" opacity=".07" rx="3"/>'
    +'<text x="'+(SX+6)+'" y="'+(hStart-5)+'" font-size="11" fill="var(--warn)" font-weight="700">'
    +'홈택스 매입계산서 — 운임·통관 '+fmt(hSum)+'</text>';

  CS.forEach(function(c){
    var col=c.uni?'var(--acc)':'var(--warn)', Lx=L[c.id];
    var tip=c.t+' '+fmt(c.a)+'원 · '+(c.sup||'')+' · '+(c.ymd||'')+' · '+(c.doc||'')
      +' → '+c.g+' ÷ '+fmt(c.wsum)+'개 = 개당 '+fmt(c.wsum?c.a/c.wsum:0)+'원';
    g2+=svgPill(SX, Lx.y, SW, Lx.h, col, (c.sup||''), c.a, tip, 'left');
    g2+=svgBand(SX+SW, Lx.y, Lx.h, CX, Lx.y, Lx.h, col, .3, tip);
    g2+=svgPill(CX, Lx.y, CW, Lx.h, costColor(c.t), c.t, c.a, tip);
  });
  var mf={}; lots.forEach(function(x){ mf[x]=M[x].y; });
  CS.forEach(function(c){
    var hh=c.a*scale, Lx=L[c.id];
    g2+=svgBand(CX+CW, Lx.y, Lx.h, MX, mf[c.g], hh, costColor(c.t), .42, c.t+' '+fmt(c.a)+' → '+c.g);
    mf[c.g]+=hh;
  });
  lots.forEach(function(x){
    g2+=svgPill(MX, M[x].y, MW, M[x].h, 'var(--ink-3)', x.slice(0,6), LOT[x], x+' — '+fmt(LOT[x])+'원');
  });
  var mf2={}; lots.forEach(function(x){ mf2[x]=M[x].y; });
  rows.forEach(function(r){
    var hh=r.v*scale;
    g2+=svgBand(MX+MW, mf2[r.g], hh, RX, R[r.k].y, R[r.k].h, 'var(--acc)', .28,
      r.k+' '+fmt(r.v)+'원'+(r.nm?(' · '+r.nm):''));
    mf2[r.g]+=hh;
    g2+='<rect x="'+RX+'" y="'+R[r.k].y+'" width="13" height="'+R[r.k].h+'" fill="var(--acc)" rx="1"/>'
      +'<text x="'+(RX+20)+'" y="'+(R[r.k].y+R[r.k].h/2+4)+'" font-size="11" fill="var(--ink)" '
      +'font-family="var(--mono)">'+esc(r.k)+'  '+fmt(r.v)+'</text>';
  });

  return h+'<div class="flowbox"><div class="leg2">'
    +'<span><i style="background:var(--acc)"></i>관세 — 유니패스 신고</span>'
    +'<span><i style="background:var(--warn)"></i>운임 — 홈택스 계산서</span>'
    +'<span><i style="background:var(--ok)"></i>통관수수료 — 홈택스 계산서</span></div>'
    +'<div class="scrx"><svg viewBox="0 0 '+W+' '+HH+'" width="100%" '
    +'style="min-width:840px;height:auto;font-family:var(--body)">'+g2+'</svg></div>'
    +'<div class="hint">위쪽은 유니패스에서만, 아래쪽은 홈택스에서만 옵니다 — '
    +'<b>관세가 아래쪽에 서면 잘못 넣은 것</b>입니다. 도형에 대면 증빙번호와 개당 금액이 나옵니다.</div></div>';
}
function costColor(t){
  return t==='관세' ? 'var(--acc)' : (t==='운임' ? 'var(--warn)' : (t==='통관수수료' ? 'var(--ok)' : 'var(--line-2)'));
}
/** 굵기가 금액인 띠 */
function svgBand(x1,y1,h1,x2,y2,h2,fill,op,tip){
  var c1=x1+(x2-x1)*0.45, c2=x2-(x2-x1)*0.45;
  return '<path d="M'+x1+','+y1+' C'+c1+','+y1+' '+c2+','+y2+' '+x2+','+y2
    +' L'+x2+','+(y2+h2)+' C'+c2+','+(y2+h2)+' '+c1+','+(y1+h1)+' '+x1+','+(y1+h1)+' Z"'
    +' fill="'+fill+'" opacity="'+op+'">'+(tip?('<title>월 매입 마감 앱 (데모) — 이어진 포트폴리오</title>'):'')+'</path>';
}
/** 글자 폭 어림 — 한글은 글자당 약 1.0em, 숫자·기호는 약 0.6em */
function svgW(t, px){
  var n=0;
  String(t).split('').forEach(function(ch){ n += (ch.charCodeAt(0)>0x2000) ? 1 : 0.58; });
  return n*px;
}
/** 폭에 맞게 이름을 줄인다 — 잘려 나가느니 «…» 로 끝내는 게 낫다 */
function svgCut(t, px, max){
  var out=String(t);
  if(svgW(out,px)<=max) return out;
  while(out.length>1 && svgW(out+'…',px)>max) out=out.slice(0,-1);
  return out+'…';
}
/** 기둥 — 얇으면 글자를 밖으로 빼고 «바탕을 깔아» 겹쳐도 읽히게 한다.
    배부에는 0.66% 짜리 줄도 있어서(36,330 / 5,513,891) 비율만으로는 글자가 못 들어간다. */
function svgPill(x,y,w,h,fill,name,amt,tip,side){
  var s='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" rx="2">'
    +(tip?('<title>'+esc(tip)+'</title>'):'')+'</rect>';
  var num=fmt(amt);
  if(h>=30){
    s+='<text x="'+(x+7)+'" y="'+(y+15)+'" font-size="11.5" fill="#fff">'
      +esc(svgCut(name,11.5,w-14))+'</text>'
      +'<text x="'+(x+w-7)+'" y="'+(y+h-7)+'" font-size="10.5" fill="#fff" text-anchor="end" '
      +'font-family="var(--mono)">'+num+'</text>';
  }else if(h>=17){
    var room=w-16-svgW(num,10.5);
    s+='<text x="'+(x+7)+'" y="'+(y+h/2+4)+'" font-size="10.5" fill="#fff">'
      +esc(svgCut(name,10.5,room))
      +' <tspan font-family="var(--mono)">'+num+'</tspan></text>';
  }else{
    /* 밖으로 — 흐름 위에 얹히므로 바탕을 깔지 않으면 안 읽힌다 */
    var lab=svgCut(name,10.5,120)+' '+num;
    var lw=svgW(lab,10.5)+10;
    var tx=(side==='left')?(x-7):(x+w+7);
    var bx=(side==='left')?(tx-lw):(tx-5);
    s+='<rect x="'+bx+'" y="'+(y+h/2-8)+'" width="'+lw+'" height="16" rx="2" '
      +'fill="var(--surf)"/>'
      +'<text x="'+tx+'" y="'+(y+h/2+4)+'" font-size="10.5" fill="var(--ink-2)"'
      +((side==='left')?' text-anchor="end"':'')+'>'+esc(svgCut(name,10.5,120))
      +' <tspan font-family="var(--mono)" fill="var(--ink-3)">'+num+'</tspan></text>';
  }
  return s;
}

/** 입고대장 — 마감의 결과물. 줄을 누르면 그 값이 어디서 왔는지 그 자리에서 펼쳐진다. */
function ledger(d,s){
  var K=S.stock;
  if(!K || !K.items) return '<div class="secth"><b>입고대장</b></div>'
    +'<div class="skel">아직 없습니다 — ① 에서 ERP 입고현황을 올리면 여기에 품번별로 섭니다.</div>';
  var ym=d.ym;
  var byCost={}; (K.costs||[]).forEach(function(c){ byCost[c.id]=c; });
  var byFx={};   (K.fx||[]).forEach(function(x){ byFx[x.grp]=x; });
  var rows=[];
  Object.keys(K.items).forEach(function(k){
    var it=K.items[k], m=(it.m&&it.m[ym])||[0,0,0];
    if(!m[0] && !m[1] && !m[2]) return;
    // m = [수량, «취득금액», 부대비용]. m[1] 은 이미 부대비용을 품고 있다 —
    // 그대로 기준금액으로 쓰면 열이 부풀고 취득원가는 부대비용을 두 번 더한다.
    rows.push({ k:k, nm:it.nm||'', q:m[0], base:m[1]-m[2], oh:m[2], p:it.p||null, aq:it.q||0,
                s:it.s||null, g:it.g||[] });
  });
  rows.sort(function(a,b){ return (b.base+b.oh)-(a.base+a.oh); });
  var q=String(S.lgQ||'').trim().toUpperCase();
  var L=rows.filter(function(r){
    if(!q) return true;
    return r.k.toUpperCase().indexOf(q)>=0 || String(r.nm).toUpperCase().indexOf(q)>=0;
  });
  var cap=S.lgAll?L.length:Math.min(L.length,30);

  var h='<div class="secth" style="border-top:1px solid var(--line-2)"><b>입고대장</b>'
    +'<span class="hint">'+fmt(rows.length)+'품번 · 줄을 누르면 이 값이 어디서 왔는지 펼쳐집니다</span>'
    +'<span style="margin-left:auto;display:flex;gap:6px;align-items:center">'
    +'<input type="text" id="lgQ" value="'+esc(S.lgQ||'')+'" placeholder="품번·품명으로 찾기" '
    +'style="font:inherit;font-size:12.5px;padding:3px 7px;border:1px solid var(--line-2);'
    +'background:var(--surf);color:var(--ink);width:170px">'
    +'<button class="btn sm" id="lgCsv">엑셀로</button></span></div>';

  h+='<div class="tw"><table><thead><tr><th>품번</th><th>품명</th><th class="n">수량</th>'
    +'<th class="n">기준금액</th><th>어디서</th><th class="n">부대비용</th><th>어느 묶음</th>'
    +'<th class="n">취득원가</th></tr></thead><tbody>';
  L.slice(0,cap).forEach(function(r){
    var gs={}, cl=[];
    if(r.p) Object.keys(r.p).forEach(function(cid){
      var c=byCost[cid]; if(!c) return;
      cl.push({ c:c, amt:r.p[cid] });
      String(c.val||'').split(';').forEach(function(g){ g=g.trim(); if(g) gs[g]=1; });
    });
    /* 묶음은 서버가 준 것을 먼저 쓴다 — 부대비용에서 거꾸로 캐면 비용 없는 달에 안 보인다 */
    var gl = (r.g && r.g.length) ? r.g : Object.keys(gs);
    var bs = bsTop(r.s);
    var fx = gl.length ? byFx[gl[0]] : null;
    var src = '<span class="pill'+(bs.k==='환율적용'?' a':'')+'">'+esc(bs.lbl)+'</span>';
    var open=S.lgOpen===r.k;
    h+='<tr data-lg="'+esc(r.k)+'"'+(open?' class="on"':'')+' style="cursor:pointer">'
      +'<td class="k"><b>'+esc(r.k)+'</b></td><td class="hint">'+esc(r.nm)+'</td>'
      +'<td class="n">'+fmt(r.q)+'</td><td class="n">'+fmt(r.base)+'</td>'
      +'<td>'+src+'</td>'
      +'<td class="n">'+(r.oh?fmt(r.oh):'–')+'</td>'
      +'<td class="k hint">'+esc(gl.join(', ')||'–')+'</td>'
      +'<td class="n"><b>'+fmt(r.base+r.oh)+'</b></td></tr>';
    if(open) h+='<tr><td colspan="8" class="lgev">'+lgWhy(r,cl,fx,gl)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  if(L.length>cap) h+='<div style="padding:7px"><button class="btn sm" id="lgMore">'
    +'나머지 '+fmt(L.length-cap)+'품번 더 보기</button></div>';
  return h;
}

/** 20260729 → 2026-07-29 */
function ymd8(v){
  var t=String(v||'').replace(/[^0-9]/g,'');
  return (t.length===8) ? (t.slice(0,4)+'-'+t.slice(4,6)+'-'+t.slice(6,8)) : String(v||'');
}

/** 환율 시트의 «출처» 는 기계가 적은 문자열이다 — 어느 자료인지 사람 말로 푼다.
    · API012 20260729 과세환율        ← B/L 잇기가 적음. 날짜는 유니패스 «수리일»
    · 관세청 과세환율 20260729 · 수리일 ← 위와 같음 (새로 적는 꼴)
    · 과세환율(입고일 20260729)        ← 과세환율 자동이 적음. 날짜는 ERP «입고일»
    · ERP에 외화단가 없음 — …          ← 수입이 아님 */
function fxSrcOf(fx){
  var raw=String((fx&&fx.src)||'');
  var m=raw.match(/^API012\s+(\d{8})\s*과세환율$/)
       || raw.match(/^관세청 과세환율\s+(\d{8})\s*·\s*수리일$/);
  if(m) return { 자료:'관세청 유니패스 · 과세환율(수입)', 날:ymd8(m[1]), 잡은법:'유니패스 수리일', raw:raw };
  m=raw.match(/^과세환율\(입고일\s*(\d{8})\)$/)
   || raw.match(/^관세청 과세환율\s+(\d{8})\s*·\s*입고일$/);
  if(m) return { 자료:'관세청 유니패스 · 과세환율(수입)', 날:ymd8(m[1]), 잡은법:'ERP 입고일', raw:raw };
  return { 자료:raw, 날:'', 잡은법:'', raw:raw };
}

/** 근거 한 줄 — «어디서» 와 «값» 을 한 줄에, 설명은 그 밑에.
    세 칸으로 벌리면 좁은 칸에서 값이 잘려 나간다 — 값이 안 보이면 표의 뜻이 없다. */
function srcRow(where, what, val, mono){
  return '<tr><td class="sw">'+esc(where)
    +(what?('<div class="hint">'+esc(what)+'</div>'):'')+'</td>'
    +'<td class="n'+(mono?' mono':'')+'"><b>'+(mono?esc(val):val)+'</b></td></tr>';
}

/** 이 품번의 기준금액을 «실제로» 세운 것 — 금액이 가장 큰 근거.
    환율 시트에 환율이 적혀 있어도 ERP에 입고단가가 있으면 입고단가가 이긴다. */
function bsTop(s){
  var K=s?Object.keys(s):[];
  if(!K.length) return { k:'입고단가', lbl:'입고단가', mix:0 };
  K.sort(function(a,b){ return Math.abs(s[b])-Math.abs(s[a]); });
  var lbl={'입고단가':'입고단가','환율적용':'환율','사전원가예외':'사전원가','미확정':'아직 미정'}[K[0]]||K[0];
  return { k:K[0], lbl:lbl+(K.length>1?' 외':''), mix:K.length-1 };
}

/** 이 줄의 값이 어디서 왔나 */
function lgWhy(r, cl, fx, gl){
  var h='<div class="lgw">';
  /* 기준금액 — 어느 자료에서 끌어왔는지 줄마다 밝힌다 */
  h+='<div><div class="lgh">기준금액 <b class="mono">'+fmt(r.base)+'</b></div>';
  h+='<div class="tw srcw"><table><tbody>';
  var B=bsTop(r.s), S0=r.s||{};
  var BW={'입고단가':'ERP이 준 원화 단가','환율적용':'ERP 외화금액 × 과세환율',
          '사전원가예외':'ERP에 외화단가가 없어 사전원가로','미확정':'아직 안 정해졌습니다'};
  if(B.mix){
    /* 한 품번이 여러 기준에 걸쳤다 — 섞인 채로 한 줄로 뭉뚱그리면 검증이 안 된다 */
    Object.keys(S0).sort(function(a,b){ return Math.abs(S0[b])-Math.abs(S0[a]); })
      .forEach(function(kk){ h+=srcRow(kk, BW[kk]||'', fmt(S0[kk])); });
    h+=srcRow('= 기준금액', '위를 합친 것', fmt(r.base));
  }else if(B.k==='환율적용' && fx && fx.rate){
    var S=fxSrcOf(fx);
    // 외화금액은 대장에 안 실린다 — 환율로 되짚어 보여 주되 «되짚은 값» 임을 밝힌다
    var usd = fx.rate ? (r.base/fx.rate) : 0;
    h+=srcRow('ERP 입고현황', '이 품번의 외화금액 — 기준금액 ÷ 환율로 되짚음',
              usd ? ('≈ USD '+usd.toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2})) : '–', 1);
    h+=srcRow(S.자료, (S.날?S.날+' 고시':'')+(S.잡은법?' · '+S.잡은법+' 기준':''),
              fmtu(fx.rate), 1);
    if(fx.bl) h+=srcRow('유니패스 수입신고 실적', 'H-B/L · 이 날짜가 나온 신고건', fx.bl, 1);
    else h+=srcRow('유니패스 수입신고 실적', '이 묶음에 안 붙어 있습니다', '–');
    h+=srcRow('= 기준금액', '외화금액 × 환율', fmt(r.base));
  }else if(B.k==='사전원가예외'){
    h+=srcRow('사전원가', 'ERP에 외화단가가 없어 사전원가로 세웠습니다', fmt(r.base));
  }else if(B.k==='미확정'){
    h+=srcRow('아직 미정', '입고단가도 외화단가도 없습니다 — ⑤ 기준금액 세우기 에서 정하세요', fmt(r.base));
  }else{
    h+=srcRow('ERP 입고현황', '입고단가를 그대로 썼습니다', fmt(r.base));
    if(fx && fx.mode==='환율' && fx.rate)
      h+=srcRow('(환율 안 씀)', '이 묶음엔 @'+fmtu(fx.rate)+' 가 적혀 있지만 ERP 입고단가가 있어 쓰이지 않았습니다', '–');
  }
  if(gl.length) h+=srcRow('입고묶음', '이 품번이 들어온 묶음', esc(gl.join(' · ')), 0);
  h+='</tbody></table></div></div>';
  /* 부대비용 */
  h+='<div><div class="lgh">부대비용 <b class="mono">'+fmt(r.oh)+'</b></div>';
  if(!cl.length) h+='<div class="hint">이 품번에 붙은 부대비용이 없습니다.</div>';
  else{
    var CO={'관세':'var(--acc)','운임':'var(--warn)','통관수수료':'var(--ok)'};
    h+='<div style="display:flex;height:10px;margin:3px 0 5px">'
      + cl.map(function(x){ var w=(x.amt/(r.oh||1)*100).toFixed(1);
          return '<span title="'+esc(x.c.type)+'" style="width:'+w+'%;background:'
            +(CO[x.c.type]||'var(--line-2)')+'"></span>'; }).join('')+'</div>';
    h+='<div class="tw" style="border:0"><table><tbody>'
      + cl.map(function(x){
          var per = x.c.wsum ? Math.round(x.c.sum/x.c.wsum) : 0;
          return '<tr><td>'+esc(x.c.type)+'</td>'
            +'<td class="hint mono">'+esc(x.c.val||'')+'</td>'
            +'<td class="n hint">'+fmt(x.c.sum)+' ÷ '+fmt(x.c.wsum)+'개</td>'
            +'<td class="n hint">개당 '+fmt(per)+'</td>'
            +'<td class="n"><b>'+fmt(x.amt)+'</b></td></tr>'; }).join('')
      +'</tbody></table></div>';
    if(r.aq && r.aq!==r.q)
      h+='<div class="hint">배부에 쓰인 수량은 '+fmt(r.aq)+'개입니다 — '
        +'대장 수량 '+fmt(r.q)+'개와 다른 것은 반품이 상계됐기 때문입니다(반품은 배부 대상이 아닙니다).</div>';
  }
  h+='</div></div>';
  return h;
}

/** 이 달을 통째로 비우기 — 재무만. 주소가 아니라 단추로 한다(탭에 남은 주소가 사고를 냈다). */
function stgReset(d){
  if(!d.canFin) return '';
  var R=S.rst;
  if(d.closed) return '<div class="rst"><span class="hint">확정된 달은 비울 수 없습니다 — 「확정 해제」 를 먼저 하세요.</span></div>';
  if(!R) return '<div class="rst"><button class="btn sm" id="bRst1">이 달 처음부터 다시</button>'
    +'<span class="hint">입고현황 · 메타 · 비용 · 비용품번 · 환율 · 유니패스를 이 달만 지웁니다. 지우기 전에 백업을 뜹니다.</span></div>';
  if(R.stage==='ready'){
    var cnt=Object.keys(R.now||{}).map(function(k){ return k+' '+fmt(R.now[k])+'행'; }).join(' · ');
    return '<div class="rst on"><b>정말 '+esc(R.ym)+' 을 비웁니다.</b>'
      +'<span class="hint">지울 것 — '+esc(cnt)+'</span>'
      +'<span class="hint">'+((R.backup&&R.backup.skipped)
          ? esc(R.backup.why||'백업을 뜨지 않았습니다')
          : ('떠 둔 백업 — '+esc((R.backup&&R.backup.name)||'')))+'</span>'
      +'<div style="margin-top:8px"><button class="btn sm bad" id="bRst2">비웁니다</button> '
      +'<button class="btn sm" id="bRst0">그만두기</button></div></div>';
  }
  return '<div class="rst"><span class="hint">비웠습니다. 되돌리려면 ?restore='
    +esc(R.backup&&R.backup.name||'')+'&amp;ym='+esc(R.ym)+'</span></div>';
}

/* ③ ERP 업로드 */
function stg3(d){
  var h=stgWhat(
    '그 달에 <b>무엇이 몇 개 들어왔는지</b> 적힌 엑셀 한 벌. 이 달 마감의 바탕이 되는 원본입니다.',
    'ERP ERP → 입고현황 → 그 달을 골라 <b>「합계 포함」</b>으로 내려받습니다. (합계행이 없으면 거부합니다)',
    '아래 점선 상자. 본부별로 나눠 받았으면 <b>여러 개를 한꺼번에</b> 끌어다 놓아도 됩니다.');
  h+=stgTip('본부 카드가 전부 「올림」 이 되면 이 단계는 끝입니다. '
    +'같은 브랜드를 다시 올리면 그 브랜드 행만 갈아끼웁니다 — 다른 본부가 올린 것은 안 지워집니다.');
  var parts=d.parts||[], depts=d.depts||[];
  if(depts.length){
    h+='<div class="gridc">'+depts.map(function(x){
      // 한 본부에 브랜드가 여럿이면 하나만 올려도 done=1 이라 «올림» 으로 보였다 — 남은 것을 본다
      var left=(x.wait!==undefined && x.wait!==null) ? x.wait>0 : !x.done;
      if(!left && !x.done && x.none) return '<div class="gc"><span class="k">'+esc(x.dept)
        +'<span class="pill">이 달 없음</span></span><span class="v hint">입고가 없습니다</span></div>';
      if(x.dept==='(미지정)') return '<div class="gc wait"><span class="k">본부 없는 브랜드'
        +'<span class="pill bad">등록 필요</span></span>'
        +'<span class="v">'+fmt(x.n)+'행 · '+fmt(x.qty)+'PC</span>'
        +'<span class="hint">'+esc((x.brands||[]).map(function(b){ return b.brand; }).join('·'))
        +' — 어느 본부인지 등록돼 있지 않습니다. 재무팀에 «본부» 시트 등록을 요청하세요.</span></div>';
      return '<div class="gc '+(left?'wait':'')+'"><span class="k">'+esc(x.dept)
        +(left?'<span class="pill bad">대기 '+fmt(x.wait||0)+'</span>':'<span class="pill ok">올림</span>')+'</span>'
        +'<span class="v">'+fmt(x.n)+'행 · '+fmt(x.qty)+'PC</span>'
        +'<div class="bar"><i class="'+(left?'part':'')+'" style="width:'+(left?0:100)+'%"></i></div></div>';
    }).join('')+'</div>';
  }
  if(parts.length){
    h+='<div class="tw"><table><thead><tr><th>조각</th><th>브랜드</th><th class="n">행</th><th>올린 사람</th><th>시각</th><th></th></tr></thead><tbody>';
    parts.forEach(function(p){
      var bs=String(p.brand||'').split('+').filter(String);
      h+='<tr><td class="mono">'+esc(p.file||'')+'</td>'
        +'<td class="mono">'+esc(bs.join('·'))+'</td>'
        +'<td class="n">'+fmt(p.n)+'</td><td class="hint">'+esc(p.who||'')+'</td>'
        +'<td class="hint">'+esc(p.at||'')+'</td>'
        +'<td>'+(d.canUp?'<button class="btn sm" data-pdel="'+esc(p.brand||'')+'">삭제</button>':'')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  if(d.canUp) h+='<div class="drop" data-drop="close"><b>ERP 입고현황</b> 을 여기로 끌어다 놓으면 그 브랜드 행만 갈아끼웁니다<br>'
    +'<button class="btn go" id="bUpClose2" style="margin-top:7px">ERP 입고현황 올리기</button></div>';
  else h+='<div class="skel">올리기는 재무·생산 담당자만 됩니다 — 담당자에게 요청하세요.</div>';
  return h;
}

      +stgTip('나중에 검수를 끝내고 오면 이 자리에 대조표가 저절로 생깁니다. 건너뛴다고 ⑦ 확정이 막히지는 않습니다.')

    '왼쪽은 「입고 건」 탭에서 [확인 완료] 한 검수 결과, 오른쪽은 ③ 에서 올린 ERP 입고현황.',
    '고칠 곳은 여기가 아닙니다 — <b>ERP 원본</b> 을 고쳐 ③ 에서 다시 올리면 이 표가 맞아 들어갑니다.');
  h+=stgTip('<b>ERP에 없음</b> = 검수는 했는데 ERP 등록이 빠진 것 → 생산팀에 등록을 요청합니다. '
    +'<b>수량 차이</b> = 둘 중 하나가 틀린 것 → ERP 원본을 고쳐 ③ 에서 다시 올립니다.');
  h+='<div class="tw" style="max-height:320px;overflow:auto"><table><thead><tr><th>품번</th>'
    +'<th class="n">검수</th><th class="n">ERP</th><th class="n">차이</th></tr></thead><tbody>';
  (r.rows||[]).forEach(function(x){
    h+='<tr'+(x.diff?' class="diff"':'')+'><td class="mono">'+esc(x.item)+'</td>'
      +'<td class="n">'+fmt(x.act)+'</td><td class="n">'+(x.miss?'<span class="pill bad">없음</span>':fmt(x.recv))+'</td>'
      +'<td class="n">'+(x.diff?sgn(x.diff):'–')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  if(caseLeft) h+='<div class="vrow"><span class="vmk no">!</span><span>검수 대기 '+caseLeft+'건</span>'
    +'<span><button class="btn sm" id="bGoCase">건 화면으로</button></span></div>';
  return h;
}

/* ⑤ 기준금액 세우기 — 유니패스 · B/L · 환율 */
function stg5(d,s){
  if(!(d.cards||[]).length)
    return stgWhat(
      '여기서 할 일이 없습니다 — 이 달은 <b>수입 묶음이 한 개도 없습니다</b>.',
      '이 달 ERP 입고현황에 수입 건이 없습니다. 국내 매입만 있는 달입니다.',
      'ERP 입고단가가 그대로 기준금액이 됩니다. 아무것도 안 하고 <b>⑥ 부대비용 얹기</b> 로 넘어가세요.');

  var nImp=(d.cards||[]).length;
  var uniN=(d.options&&d.options.uni_n)||0;
  var blN=(d.cards||[]).filter(function(g){ return String(g.bl||'').trim(); }).length;
  /* ⑤ 는 사실 세 걸음이다. 지금 어디인지가 안 보이면 셋을 다 눌러 보게 된다. */
  var st1 = uniN ? 'done' : 'now';
  var st2 = blN ? 'done' : (st1==='done' ? 'now' : 'wait');
  var st3 = !s.unres_n ? 'done' : (st2==='done' ? 'now' : 'wait');

  var h=stgWhat(
    '수입 묶음의 <b>기준금액</b> — 부대비용을 얹기 전의 «물건값» 을 세웁니다. '
    +'환율이 안 서면 그 줄의 원가가 <b>0 원</b>으로 잡힙니다.',
    '① 관세청 유니패스에서 받은 수입신고 실적 엑셀 → ② 그 안에 적힌 B/L 번호 → ③ 관세청 과세환율(입고일 기준).',
    '아래 <b>수입 묶음</b> 표의 「기준 · 환율 · B/L」 칸. <b>미확정이 0 행</b>이 되면 ⑥ 으로 넘어갑니다.');
  h+=stgTip('아래 세 걸음을 <b>왼쪽부터 차례로</b> 하세요 — ① 올리기 → ② 이어 보기 → ③ 환율 넣기. '
    +'②③ 은 눌러도 바로 저장되지 않습니다. <b>무엇을 어떻게 바꿀지 먼저 보여 준 뒤</b>, 「적용」 을 눌러야 저장됩니다.');

  if(s.unres_n){
    h+='<div class="vrow"><span class="vmk no">!</span>'
      +'<span><b>기준금액 미확정 '+fmt(s.unres_n)+'행</b> ('+fmt(s.unres_qty)+' PCS)'
      +' — 원가가 0으로 잡히는 줄입니다. 아래 ② → ③ 을 차례로 눌러 환율을 세우세요.'
      +'<br><span class="hint">'+esc((s.unres_groups||[]).join(', '))+'</span></span><span></span></div>';
  }

  h+='<div class="gridc">'
    +'<div class="gc'+gcCls(st1)+'"><span class="k">① 유니패스 수입신고실적 '+stepMark(st1)+'</span>'
      +'<span class="v">'+uniN+'건 올림 — 관세·인도조건·B/L 이 들어 있습니다</span>'
      +(d.canCost?'<div class="drop" data-drop="uni" style="margin:6px 0 0;padding:8px">끌어다 놓거나<br>'
      +'<button class="btn sm'+(st1==='now'?' go':'')+'" id="bUpUni" style="margin-top:4px">엑셀 올리기</button></div>'
      +'<span class="hint">'+(uniN
        ? ('이미 '+uniN+'건 올라와 있습니다. 다시 올리면 이 달 것만 갈아끼웁니다.')
        : '<b>아직 한 건도 없습니다.</b> 관세청 유니패스(unipass.customs.go.kr) → 「수입신고 실적」 에서 그 달치를 내려받아 여기 놓으세요. 조회 기간은 최대 한 달입니다.')
      +' 이 파일 하나가 ②③ 의 환율과 ⑥ 의 관세, 둘 다의 재료입니다.</span>':'')+'</div>'
    +'<div class="gc'+gcCls(st2)+'"><span class="k">② B/L 자동연결 '+stepMark(st2)+'</span>'
      +'<span class="v">수입 묶음 '+nImp+'개 중 B/L 붙은 것 '+blN+'개</span>'
      +(d.canCost?'<button class="btn sm'+(st2==='now'?' go':'')+'" id="bBl" style="margin-top:2px"'
        +(st1==='done'?'':' disabled')+'>자동으로 이어 보기</button>':'')
      +'<span class="hint">'+(st1==='done'
        ? '신고서의 결제금액과 묶음 USD 를 맞춰 봅니다. 오차 1.5% 안이면 「확실」, 5% 안이면 「유력」 — 그 둘만 기본으로 체크됩니다. 누르면 <b>목록부터 보여 주고</b>, 「체크한 것 적용」 을 눌러야 저장됩니다.'
        : '<b>① 을 먼저 하세요.</b> 유니패스 실적이 없으면 맞춰 볼 상대가 없어 이 단추는 안 눌립니다.')+'</span></div>'
    +'<div class="gc'+gcCls(st3)+'"><span class="k">③ 과세환율 자동 '+stepMark(st3)+'</span>'
      +'<span class="v">'+(s.unres_n?('아직 미확정 '+fmt(s.unres_n)+'행'):'미확정 0 행 — 전부 확정됐습니다')+'</span>'
      +(d.canCost?'<button class="btn sm'+(st3==='now'?' go':'')+'" id="bFxAuto" style="margin-top:2px"'
        +(s.unres_n?'':' disabled')+'>환율 자동으로 넣기</button>':'')
      +'<span class="hint">'+(s.unres_n
        ? '② 로도 안 붙은 묶음에, <b>입고일의 관세청 과세환율</b> 을 넣습니다. USD 가 아예 없는 묶음은 사전원가를 기준으로 돌립니다. 여기도 먼저 보여 주고 「전부 넣기」 를 눌러야 저장됩니다.'
        : '세울 것이 남지 않았습니다 — 더 누를 필요가 없습니다.')+'</span></div>'
    +'</div>';

  h+='<div id="prevWrap5"></div>';

  h+='</tbody></table></div>';

/* ⑥ 부대비용 얹기 */
function stg6(d,s,okBy,nImp){
  nImp = (nImp===undefined) ? (d.cards||[]).length : nImp;
  var blN=(d.cards||[]).filter(function(g){ return String(g.bl||'').trim(); }).length;
  // 관세는 «B/L 에 붙은 입고묶음» 위에만 얹힌다. 하나도 없으면 눌러도 전부 실패한다 —
  // 그럴 거면 애초에 못 누르게 하고, 어디로 가야 하는지를 그 자리에서 준다.
  var noBl = !!(nImp && !blN);

    '물건값 위에 얹는 돈 — <b>관세 · 운임 · 통관수수료</b> 를 입고 묶음마다 나눠 붙입니다.',
    '관세는 ⑤ 에서 올린 <b>유니패스 수입신고 실적</b>, 운임·통관수수료는 <b>홈택스 매입계산서</b>(수집기가 매일 새벽 받아 둡니다).',
    '아래 <b>넣은 부대비용</b> 표. 붙인 금액은 수량비례로 쪼개져 품번별 취득원가에 들어갑니다.');
  h+=stgTip('<b>관세</b><i class="q" data-tip="관세">?</i> 는 인천세관 계산서로 넣지 마세요 — 거기엔 관세와 부가세가 뭉쳐 있어 B/L 별로 못 쪼갭니다. '
    +'유니패스 신고 건마다 따로 적힌 관세를 그대로 씁니다.');

  if(noBl || loose5)
    h+='<div class="vrow"><span class="vmk no">!</span>'
      +'<span><b>⑤ 를 먼저 끝내세요.</b> '
      +(noBl ? 'B/L 이 붙은 입고묶음이 <b>하나도 없습니다</b> — 관세를 얹을 자리가 아직 없습니다. '
             : '기준금액이 미확정인 줄이 남아 있습니다. ')
      +'⑤ 의 「② 자동으로 이어 보기」 를 먼저 하면 여기 「관세 넣기」 가 열립니다.</span>'
      +'<span><button class="btn sm go" data-goto="5">⑤ 로 가기</button></span></div>';

  h+='<div class="gridc">'
    +'<div class="gc'+(noBl?' wait':'')+'"><span class="k">① 관세</span>'
      +'<span class="v">'+fmt(sumType_(d,'관세'))+'원 넣음 · 유니패스 신고 '+((d.options&&d.options.uni_n)||0)+'건</span>'
      +(d.canCost?'<button class="btn sm'+(noBl?'':' go')+'" id="bDuty" style="margin-top:2px"'+(noBl?' disabled':'')+'>관세 넣기</button>':'')
      +'<span class="hint">'+(noBl
        ? '<b>지금은 안 눌립니다</b> — B/L 에 붙은 입고묶음이 있어야 관세가 갈 곳이 생깁니다. 위 「⑤ 로 가기」 를 누르세요.'
        : 'B/L 에 붙은 입고묶음에 얹습니다. 이미 넣은 신고번호는 저절로 걸러집니다. 누르면 <b>목록부터 보여 주고</b>, 「넣기」 를 눌러야 저장됩니다.')+'</span></div>'
    +'<div class="gc"><span class="k">② 운임 · 통관수수료</span>'
      +'<span class="v">'+fmt(sumType_(d,'운임')+sumType_(d,'통관수수료'))+'원 넣음</span>'
      +(d.canCost?'<button class="btn sm go" id="bCost" style="margin-top:2px">부대비용 넣기</button>':'')
      +'<span class="hint">홈택스 후보를 누르면 유형·금액·공급자·증빙이 저절로 채워집니다 — 남는 일은 <b>어느 묶음에 붙일지</b> 고르기 하나입니다.</span></div>'
    +'<div class="gc"><span class="k">합계</span>'
      +'<span class="v">'+d.costs.length+'건 · 재고반영 '+fmt(s.oh_inv)+'원</span>'
      +'<span class="hint">배부 방식 — B/L 통배부, 수량 균등. (관세+운임+통관) ÷ B/L 통합수량. 반품 줄은 배부 대상에서 뺍니다.</span></div>'
    +'</div>';

  h+='<div id="prevWrap6"></div><div id="costWrap"></div>';

  if(d.costs.length){
    h+='<div class="secth" style="border-top:1px solid var(--line)"><b>넣은 부대비용</b></div>'
      +'<div class="tw"><table><thead><tr><th></th><th>유형</th><th class="n">금액</th><th>붙은 묶음</th>'
      +'<th class="n">대상</th><th class="n">배부</th><th>공급자</th><th></th></tr></thead><tbody>';
    d.costs.forEach(function(c){
      h+='<tr'+(c.ok?'':' class="need"')+'><td class="mono hint">'+esc(c.id)+'</td><td>'+esc(c.type)+'</td>'
        +'<td class="n">'+fmt(c.amount)+'</td><td class="hint mono">'+esc(c.scope_val||c.scope)+'</td>'
        +'<td class="n">'+fmt(c.targets)+'</td><td class="n">'+fmt(c.allocated)+'</td>'
        +'<td class="hint">'+esc(c.supplier||'')+'</td>'
        +'<td>'+(d.canCost?'<button class="btn sm" data-cdel="'+esc(c.id)+'">삭제</button>':'')+'</td></tr>';
      if(!c.ok&&c.issues&&c.issues.length)
        h+='<tr class="need"><td colspan="8" class="hint" style="color:var(--bad)">'+esc(c.issues.join(' · '))+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }else{
    h+='<div class="skel">아직 넣은 부대비용이 <b>한 건도 없습니다</b>. 순서는 이렇습니다 — '
      +'먼저 위 <b>「관세 넣기」</b> 로 유니패스 관세를 한 번에 넣고, 그다음 <b>「부대비용 넣기」</b> 로 '
      +'홈택스에서 받아 둔 운임·통관수수료 계산서를 하나씩 고릅니다. 여기 넣은 것이 곧 재고 취득원가가 됩니다.</div>';
  }

  if((d.pivot||[]).length){
    h+='<div class="secth" style="border-top:1px solid var(--line)"><b>입고처별</b> '
      +'<span class="hint">이 단계의 결과 — 품번별 근거는 수불부 탭에서 봅니다</span></div>'
      +'<div class="tw" style="max-height:280px;overflow:auto"><table><thead><tr><th>입고처</th><th class="n">행</th>'
      +'<th class="n">수량</th><th class="n">기준금액</th><th class="n">부대비용</th><th class="n">취득원가</th></tr></thead><tbody>';
    d.pivot.forEach(function(p){
      h+='<tr><td>'+esc(p.vendor)+(p.unres?' <span class="pill bad">미확정 '+p.unres+'</span>':'')+'</td>'
        +'<td class="n">'+fmt(p.lines)+'</td><td class="n">'+fmt(p.qty)+'</td>'
        +'<td class="n">'+fmt(p.base)+'</td><td class="n">'+(p.oh?fmt(p.oh):'–')+'</td>'
        +'<td class="n"><b>'+fmt(p.landed)+'</b></td></tr>';
    });
    h+='<tr class="tot"><td>합계</td><td class="n">'+fmt(s.lines)+'</td><td class="n">'+fmt(s.qty)+'</td>'
      +'<td class="n">'+fmt(s.base)+'</td><td class="n">'+fmt(s.oh_inv)+'</td><td class="n">'+fmt(s.landed)+'</td></tr>';
    h+='</tbody></table></div>';
  }
  return h;
}
function sumType_(d,t){
  var n=0; (d.costs||[]).forEach(function(c){ if(c.type===t) n+=c.amount||0; }); return n;
}

/* ⑦ 검증 후 확정 */
function stg7(d, okBy, noRecon, nImp){
  // V 검사가 막혔을 때 «그래서 뭘 하라» 가 없어 숫자 나열만 읽혔다.
  var WHAT={
    V1:'③에서 ERP 입고현황을 다시 올리세요 — 파일 합계행과 적재 합계가 다릅니다.',
    V2:'⑥에서 그 비용의 붙은 묶음을 고치세요 — 어디에도 안 닿는 비용이 있습니다.',
    V3:'⑤로 돌아가 환율을 세우세요 — 기준금액 미확정이 남아 있습니다.',
    V4:'ERP 원본에 중복이 있거나, 대상 없는 비용이 있습니다 — ③ 또는 ⑥으로.',
    V5:'입고 건 탭에서 검수를 끝내고 오세요.'
  };
  var h=stgWhat(
    '③~⑥ 으로 만든 이 달 숫자가 <b>앞뒤가 맞는지</b> 기계가 다시 검사합니다(V1~V'+d.checks.length+').',
    '검사 재료는 이미 이 화면 안에 다 있습니다 — 따로 받아 올 것이 없습니다.',
    '전부 「통과」 면 아래 <b>「이 달 마감 확정」</b> 이 열립니다. 확정하면 품번별 입고가 재고수불부(Baserow)로 넘어갑니다.');
  d.checks.forEach(function(c){
    var key=String(c.id||'').toUpperCase();
    h+='<div class="vrow"><span class="vmk '+(c.ok?'ok':'no')+'">'+(c.ok?'✓':'!')+'</span>'
      +'<span><b>'+esc(c.id)+'</b> '+esc((c.name||'').split(':')[0])+'<br><span class="hint">'+esc(c.detail||'')+'</span>'
      +(c.ok?'':('<br><span class="hint" style="color:var(--bad)">'+esc(WHAT[key]||'')+'</span>'))
      +'</span><span class="hint">'+(c.ok?'통과':'막힘')+'</span></div>';
  });
  // 검증만 보면 ④ 대사를 한 번도 안 돌린 달도 확정이 눌린다 — 앞 단계까지 본다.
  // 확정은 재고수불부 전송까지 가므로 되돌리기가 비싸다.
  var vOk=d.checks.every(function(c){ return c.ok; });
  var stepLeft=[];
  if(okBy){
    if(!okBy[3]) stepLeft.push('③ ERP 입고현황 올리기');
    if(!okBy[4] && !noRecon) stepLeft.push('④ 검수 ↔ ERP 대사');
    if(!okBy[5] && nImp) stepLeft.push('⑤ 기준금액 세우기');
    if(!okBy[6]) stepLeft.push('⑥ 부대비용 얹기');
  }
  var allOk=vOk && !stepLeft.length;
  var cl=d.closed;
  h+='<div class="confirm">';
  if(cl){
    h+='<span class="pill ok">확정 '+esc(cl.at)+'</span><span class="hint">'+esc(cl.by||'')+'</span>'
      +(cl.push&&cl.push.ok
        ? '<span class="pill ok">수불부 '+fmt(cl.push.sent)+'행 전송</span>'
        : '<span class="pill bad">재고수불부로 못 보냈습니다 — 숫자는 확정돼 있습니다</span>'
          +'<button class="btn sm" id="bRepush">다시 보내기</button>')
      +(d.canFin?'<button class="btn sm" id="bUnfix" style="margin-left:auto">확정 해제</button>':'');
  }else{
    h+='<button class="btn go" id="bFix"'+(allOk&&d.canFin?'':' disabled')+'>이 달 마감 확정</button>'
      +'<span class="hint">'+(allOk
        ? ((noRecon?'이 달은 건별 검수 없이 입고내역으로 마감합니다. ':'')
           +'확정하면 이 달 숫자가 잠깁니다. 품번별 입고가 재고수불부(Baserow)로 넘어갑니다. '
           +'<b>확정을 해제해도 이미 보낸 줄은 안 돌아옵니다</b> — 고친 뒤 다시 확정해서 다시 보내야 바뀝니다.')
        : (stepLeft.length
            ? ('먼저 끝내야 합니다 — '+stepLeft.join(' · '))
            : ('검증 V1~V'+d.checks.length+' 가 전부 통과해야 누를 수 있습니다. 위 «막힘» 을 보세요.')))
      +'</span>';
  }
  h+='<span class="hint" id="fixMsg"></span></div>';
  return h;
}

/* ── 단계 안의 단추들 ─────────────────────────── */
function bindStg(){

  function on(id,fn){ var e=$(id); if(e) e.onclick=fn; }

  bindGoto(P);
  P.querySelectorAll('[data-prevx]').forEach(function(b){
    b.onclick=function(){ S.prev=null; closeRender(); };
  });
  P.querySelectorAll('[data-tip]').forEach(function(b){
    b.onclick=function(e){ e.stopPropagation(); note(TIPS[b.getAttribute('data-tip')]||'','info',true); };
  });

  on('autoX', function(){ S.auto=null; closeRender(); });
  on('bAuto', function(){ autoRun(S.ym, false); });

  /* 대장 — 찾는 동안 화면을 다시 그리면 한글 조합이 깨진다. 입력 칸은 안 건드린다. */
  (function(){
    var q=$('lgQ'); if(!q) return;
    var ime=false;
    q.addEventListener('compositionstart', function(){ ime=true; });
    q.addEventListener('compositionend', function(){ ime=false; lgApply(q.value); });

        closeRender();
        var n=$('lgQ'); if(n && at){ n.focus(); try{ n.setSelectionRange(ss,ss); }catch(e){} }
      }, 220);
    }
  })();
  on('lgMore', function(){ S.lgAll=true; closeRender(); });
  on('lgCsv',  function(){ lgCsv(); });

  on('bRst0', function(){ S.rst=null; closeRender(); });
  on('bRst1', function(){
    var done=btnGo($('bRst1'),'백업 뜨는 중…');
    run('apiMonthReset',[S.ym],function(r){ done(); S.rst=r; closeRender(); },
        function(m){ done(); note(m,'bad',true); });

  });

  on('bUpClose2', function(){ pick('close'); });
  on('bUpUni',    function(){ pick('uni'); });
  on('bGoCase',   function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.setAttribute('aria-selected',String(x.dataset.t==='case')); });
    $('pCase').hidden=false; $('pClose').hidden=true;
    S.onlyLeft=true; var b=$('bOnlyLeft'); b.setAttribute('aria-pressed','true'); b.textContent='전체 보기';
    renderTl(); $('tl').scrollIntoView({behavior:'smooth',block:'center'});
  });

  /* ── ⑤ B/L 자동연결 — 제안을 카드 안에 편다 ── */

    var nG=((d&&d.cards)||[]).length;
    var done=btnGo($('bBl'),'신고서와 묶음 맞춰 보는 중… 묶음 '+nG+'개');

      done(); S.pvres=null;
      S.prev={ kind:'bl', data:r };
      closeRender(); paintPrev();
    }, function(m){ done(); note(m,'bad',true); });
  });

  on('bFxAuto', function(){
    var nU=(d&&d.summary&&d.summary.unres_n)||0;
    var done=btnGo($('bFxAuto'),'관세청에 과세환율 묻는 중… 미확정 '+fmt(nU)+'행');
    run('apiFxAuto',[S.ym,false],function(r){
      done(); S.pvres=null;
      S.prev={ kind:'fx', data:r };
      closeRender(); paintPrev();
    }, function(m){ done(); note(m,'bad',true); });
  });

  /* ── ⑥ 관세 넣기 ── */
  on('bDuty', function(){
    var nD=(d&&d.options&&d.options.uni_n)||0;
    var done=btnGo($('bDuty'),'유니패스 신고 읽는 중… '+fmt(nD)+'건');
    run('apiDutyToCost',[S.ym,false],function(r){
      done(); S.pvres=null;
      S.prev={ kind:'duty', data:r };
      closeRender(); paintPrev();
    }, function(m){ done(); note(m,'bad',true); });
  });

  on('bCost', function(){ S.costOpen=!S.costOpen; closeRender(); paintCost(); });

    var m=$('fixMsg');
    hold(true,'확정하고 수불부로 보내는 중…','되돌리려면 «확정 해제» 를 눌러야 합니다');
    run('apiCloseConfirm',[S.ym,true],function(r){
      hold(false);
      note('마감을 확정했습니다'+(r.state&&r.state.push&&r.state.push.ok
        ? (' — 수불부 '+fmt(r.state.push.sent)+'행 전송'):''),'ok',true);
      S.close=null; closeBoot(S.ym,true);

      S.close=null; closeBoot(S.ym,true);
    }, function(m){ done(); note(m,'bad',true); });
  });
  on('bRepush', function(){
    var done=btnGo($('bRepush'),'다시 보내는 중…');
    run('apiCloseRepush',[S.ym],function(r){
      done(); note('다시 보냈습니다 — '+fmt(r.state.push.sent)+'행','ok');
      S.close=null; closeBoot(S.ym,true);
    }, function(m){ done(); note(m,'bad',true); });
  });

  P.querySelectorAll('[data-fxs]').forEach(function(b){
    b.onclick=function(){
      var i=b.getAttribute('data-fxs'), g=d.cards[+i];
      var q=function(k){ var e=P.querySelector('[data-fx="'+k+'"][data-i="'+i+'"]'); return e?e.value:''; };
      var done=btnGo(b,'저장 중…');
      run('apiFxSave',[S.ym,g.grp,q('mode'),q('rate'),'',q('bl'),''],function(r){
        done(); note(g.grp+' 저장했습니다','ok'); useClose(r);
      },function(m){ done(); note(m,'bad',true); });
    };
  });
  P.querySelectorAll('[data-cdel]').forEach(function(b){
    b.onclick=function(){
      var id=b.getAttribute('data-cdel');
      b.outerHTML='<span class="hint" style="color:var(--bad)">지울까요?</span> '
        +'<button class="btn sm bad" data-cy="'+esc(id)+'">예</button> <button class="btn sm" data-cn="1">아니오</button>';
      P.querySelectorAll('[data-cn]').forEach(function(x){ x.onclick=closeRender; });
      P.querySelectorAll('[data-cy]').forEach(function(x){
        x.onclick=function(){
          var done=btnGo(x,'지우는 중…');
          run('apiCostDelete',[S.ym,x.getAttribute('data-cy')],function(r){
            done(); note('지웠습니다','ok');
            // 지운 비용이 쓰던 증빙을 «넣었음» 목록에서도 푼다 — 안 그러면 다시 못 넣는다
            var gone=x.getAttribute('data-cy');
            if(S.ht && S.ht.used) Object.keys(S.ht.used).forEach(function(doc){
              if(String(S.ht.used[doc])===String(gone)) delete S.ht.used[doc]; });
            useClose(r); },
            function(m){ done(); note(m,'bad',true); });
        };
      });
    };
  });
  P.querySelectorAll('[data-pdel]').forEach(function(b){
    b.onclick=function(){
      var k=b.getAttribute('data-pdel');
      var done=btnGo(b,'지우는 중…');
      run('apiClosePartDelete',[S.ym,k],function(r){
        done(); note(k+' 적재를 지웠습니다','ok'); useClose(r); },
        function(m){ done(); note(m,'bad',true); });
    };
  });

  paintPrev();
  paintCost();
}

/** 쓰기 응답에 딸려 온 장부를 그대로 그린다 — 다시 묻지 않는다.
    모양이 아니면(요약이 없으면) 예전처럼 다시 묻는다. */
function useClose(r){
  if(r && r.summary && r.ym){ S.close=r; S.closeYm=r.ym; closeRender(); return true; }
  S.close=null; closeBoot(S.ym,true); return false;
}

/** 사람이 고를 것이 없는 일을 이어서 돌린다 — B/L 잇기 → 과세환율 → 관세.
    auto 가 참이면 «올리자마자» 부른 것이라 조용히 돈다. */
function autoRun(ym, auto){
  hold(true, '정리하는 중', null, null);
  run('apiAutoRun',[ym||S.ym],function(r){
    hold(false);
    S.auto=r;
    // «자동으로 한 것» 칸이 같은 내용을 표로 남긴다 — 알림으로 또 띄우지 않는다
    if(!(r.did||[]).length && !(r.left||[]).length) note('정리할 것이 없었습니다','ok');
    useClose(r.close);
  },function(m){ hold(false); note(m,'bad',true); S.close=null; closeBoot(ym||S.ym,true); });
}

/** 기계가 끝낸 것과, 사람이 해야 남는 것 */
function autoBox(){
  var a=S.auto; if(!a || a.ym!==S.ym) return '';
  var h='<div class="prev" id="autoBox"><div class="prevh"><b>자동으로 한 것</b>'
    +'<span style="margin-left:auto"><button class="btn sm" id="autoX">닫기</button></span></div><div class="prevb">';
  if((a.did||[]).length){
    h+='<div class="tw"><table><tbody>'+a.did.map(function(m){
      return '<tr><td style="width:26px">✓</td><td>'+esc(m)+'</td></tr>'; }).join('')+'</tbody></table></div>';
  }else h+='<div class="skel">기계가 새로 한 것은 없습니다.</div>';
  var L=(a.left||[]).filter(function(x){ return x.n; });
  if(L.length){
    h+='<div class="secth" style="border-top:1px solid var(--line)"><b>여기서부터는 사람이 골라야 합니다</b></div>';
    h+='<div class="tw"><table><tbody>'+L.map(function(x){
      var go={bl:5,fx:5,duty:6,cost:6}[x.what]||6;
      return '<tr><td style="width:26px">!</td><td>'+esc(x.msg)+'</td>'
        +'<td style="width:92px"><button class="btn sm" data-goto="'+go+'">'
        +(go===5?'⑤':'⑥')+' 로 가기</button></td></tr>'; }).join('')+'</tbody></table></div>';
  }else{
    h+='<div class="vrow"><span class="vmk ok">✓</span>'
      +'<span>사람이 더 고를 것이 없습니다 — ⑦ 에서 확정만 하면 됩니다.</span>'
      +'<span><button class="btn sm go" data-goto="7">⑦ 로 가기</button></span></div>';
  }
  return h+'</div></div>';
}

/* ── 미리보기 패널 그리기 ───────────────────── */
function pvChecked(i){ var e=$('pvck'+i); return e?e.checked:false; }
function pvFx(){ var e=$('pvFxChk'); return e?e.checked:true; }

/* ── 적용한 뒤 «무엇이 어떻게 됐는지» 를 그 자리에 남긴다 ─────────────
 *  예전엔 적용하면 패널이 닫히고 알림 한 줄이 3초 떴다 사라졌다.
 *  그래서 환율 시트에 한 줄도 안 생긴 채로 다음 단계로 간 일이 실제로 있었다.
 *  이제 «닫기» 를 누를 때까지 남는다. */
function pvDoneBox(R){
  var okRows=R.ok||[], noRows=R.no||[];
  var b='<div class="vrow"><span class="vmk '+(okRows.length?'ok':'no')+'">'+(okRows.length?'✓':'!')+'</span>'
    +'<span style="font-size:13px"><b>'+esc(R.head)+'</b><br><span class="hint">'+(R.sub||'')+'</span></span><span></span></div>';
  if(okRows.length){
    b+='<div class="secth" style="border-top:1px solid var(--line)"><b>된 것 '+fmt(okRows.length)+'개</b>'
      +'<span class="hint">여기까지는 저장이 끝났습니다 — 아래 표에서 바로 보입니다</span></div>'
      +'<div class="tw"><table><tbody>'+okRows.map(function(x){
        return '<tr><td class="mono">'+esc(x[0])+'</td><td class="hint">'+esc(x[1]||'')+'</td></tr>'; }).join('')
      +'</tbody></table></div>';
  }
  if(noRows.length){
    b+='<div class="secth" style="border-top:1px solid var(--line)"><b>안 된 것 '+fmt(noRows.length)+'개</b>'
      +'<span class="hint">오른쪽이 «왜 안 됐는지» 입니다 — 그것부터 고치고 다시 누르세요</span></div>'
      +'<div class="tw"><table><tbody>'+noRows.map(function(x){
        return '<tr class="need"><td class="mono">'+esc(x[0])+'</td>'
          +'<td class="hint" style="color:var(--bad)">'+esc(x[1]||'')+'</td></tr>'; }).join('')
      +'</tbody></table></div>';
  }
  if(!okRows.length && !noRows.length)
    b+='<div class="skel">바뀐 줄이 <b>하나도 없습니다</b> — 아무것도 저장되지 않았습니다. 앞 단계로 돌아가세요.</div>';
  if(R.next)
    b+='<div class="vrow" style="border-top:1px solid var(--line)"><span class="vmk">→</span>'
      +'<span><b>다음</b> — '+R.next+'</span><span>'+(R.nextBtn||'')+'</span></div>';
  return b;
}
function paintDone(){
  var R=S.pvres; if(!R) return;
  var wrap=$(R.step===6?'prevWrap6':'prevWrap5'); if(!wrap) return;
  // 된 것이 하나도 없으면 빨강, 섞였으면 주황, 전부 됐으면 초록
  var tone=!(R.ok||[]).length ? 'bad' : ((R.no||[]).length ? 'warn' : 'ok');
  wrap.innerHTML='<div class="prev" style="border-color:var(--'+tone+')">'
    +'<div class="prevh" style="background:var(--'+tone+'-soft)"><b>'+esc(R.title)+'</b>'
    +'<span style="margin-left:auto"><button class="btn sm" id="pvDoneX">닫기</button></span></div>'
    +'<div class="prevb">'+pvDoneBox(R)+'</div></div>';
  var x=$('pvDoneX'); if(x) x.onclick=function(){ S.pvres=null; closeRender(); };
  bindGoto(wrap);
}

          +'<td class="n">'+fmtu(x.usd)+'</td>'
          +'<td class="n">'+(x['오차']!=null?(Number(x['오차']).toFixed(2)+'%'):'–')+'</td>'

        if(x['경고']) body+='<tr class="need"><td></td><td colspan="7" class="hint" style="color:var(--bad)">'+esc(x['경고'])+'</td></tr>';
        else if(x['다음후보']) body+='<tr><td></td><td colspan="7" class="hint">다음 후보 — '+esc(x['다음후보'])+'</td></tr>';

      if((r['남은묶음']||[]).length){
        body+='<div class="secth"><b>안 붙은 묶음 '+r['남은묶음'].length+'개</b></div><div class="tw"><table><tbody>';
        r['남은묶음'].forEach(function(x){

      body='<div class="tw"><table><thead><tr><th>묶음</th><th>입고일</th><th>기준</th><th class="n">환율</th><th>출처 · 사유</th></tr></thead><tbody>';
      pl.forEach(function(x){

      +'<div class="vrow"><span class="vmk">→</span><span>올리는 곳은 ⑤ 안에 있습니다.</span>'
      +'<span><button class="btn sm go" data-goto="5">⑤ 로 가기</button></span></div>';
    else{

      pl2.forEach(function(x){

      });
      body+='</tbody></table></div>';

          +'⑤ 의 「② 자동으로 이어 보기」 를 먼저 끝내면 여기서 넣을 수 있게 됩니다.</span>'
          +'<span><button class="btn sm go" data-goto="5">⑤ 로 가기</button></span></div>';

  wrap.innerHTML=stgPrev('pv', title, body, ok, 'pvGo', n);
  wrap.querySelectorAll('[data-prevx]').forEach(function(b){

/* ── 미리보기 패널의 «적용» ─────────────────── */
function pvApply(){
  var p=S.prev; if(!p) return;
  var done=btnGo($("pvGo"), p.kind==="bl" ? "체크한 것 저장 중…"
                          : p.kind==="fx" ? "환율 저장 중…"
                          : "관세 저장 중…");

  if(p.kind==="bl"){
    var sel=[];
    (p.data.rows||[]).forEach(function(x,i){
      if(pvChecked(i) && x["묶음"] && x["묶음"].length) sel.push(x);
    });
    if(!sel.length){ done(); note("체크한 줄이 하나도 없습니다 — 왼쪽 네모를 하나 이상 켜고 다시 누르세요","warn",true); return; }
    var nG=0; sel.forEach(function(x){ nG+=(x["묶음"]||[]).length; });
    var withFx=pvFx(), left0=(p.data["남은묶음"]||[]).slice();
    hold(true, "B/L 잇는 중… "+nG+"묶음",
      withFx ? "환율 시트에 B/L 번호를 적고, 기준이 빈 묶음엔 신고일 과세환율을 채웁니다"
             : "환율 시트에 B/L 번호를 적습니다");
    run("apiBlApply",[S.ym,sel,withFx],function(r){
      hold(false); done(); S.prev=null;
      var okRows=[];
      sel.forEach(function(x){
        (x["묶음"]||[]).forEach(function(g0){
          var g=(typeof g0==="string")?g0:String((g0&&g0.grp)||"");
          okRows.push([g, "B/L "+(x.BL||"")+" 로 이었습니다"]);
        });
      });
      var noRows=left0.map(function(x){ return [x.grp, x["사유"]||"이번엔 안 붙었습니다"]; });
      ((r&&r.notes)||[]).forEach(function(m){ noRows.push(["과세환율", String(m)]); });
      var after=(r&&r.close&&r.close.summary)||null;
      S.pvres={
        ym:S.ym, step:5, bad:!!noRows.length,
        title:"B/L 을 이어 붙였습니다 — 결과",
        head:fmt((r&&r["붙인묶음"])||nG)+"묶음에 B/L 번호를 적었습니다"
             +((r&&r["환율채움"])?(" · 그중 "+fmt(r["환율채움"])+"묶음은 과세환율까지 채웠습니다"):" · 채운 환율은 없습니다"),
        sub:"<b>환율 시트("+esc(S.ym)+")에 저장이 끝났습니다.</b> 아래 <b>수입 묶음</b> 표의 「B/L · 기준 · 환율」 칸에서 바로 확인하세요.",
        short:"B/L "+fmt((r&&r["붙인묶음"])||nG)+"묶음 이음",
        ok:okRows, no:noRows,
        next: !after ? '아래 <b>수입 묶음</b> 표에서 B/L 칸이 찼는지 눈으로 확인하세요.'
             : (after.unres_n
                ? ('아직 <b>미확정 '+fmt(after.unres_n)+'행</b>이 남았습니다 — 바로 위 「③ 환율 자동으로 넣기」 를 이어서 누르세요.')
                : '미확정이 <b>0 행</b>이 됐습니다 — ⑥ 부대비용 얹기로 넘어가세요.'),
        nextBtn: (after && !after.unres_n) ? '<button class="btn sm go" data-goto="6">⑥ 으로 가기</button>' : ''
      };
      useClose(r&&r.close);
    }, function(m){ hold(false); done(); note(m,"bad",true); });
    return;
  }

  if(p.kind==="fx"){
    var plOk=(p.data.plan||[]).filter(function(x){ return x.ok; });
    hold(true, "과세환율 넣는 중… "+plOk.length+"묶음",
      "묶음마다 입고일의 관세청 과세환율을 조회해 환율 시트에 적습니다");
    run("apiFxAuto",[S.ym,true],function(r){
      hold(false); done(); S.prev=null;
      var okRows=(r.done||[]).map(function(x){
        return [x.grp, (x.mode==="환율" ? ("환율 "+fmtu(x.rate)) : String(x.mode||""))
          +(x.src?(" — "+x.src):"")]; });
      var noRows=(r.fail||[]).map(function(f){ return [(f.p&&f.p.grp)||"", String(f.msg||"")]; })
        .concat((r.plan||[]).filter(function(x){ return !x.ok; })
          .map(function(x){ return [x.grp, String(x.why||"")]; }));
      S.pvres={
        ym:S.ym, step:5, bad:!!(r.left||noRows.length),
        title:"과세환율을 세웠습니다 — 결과",
        head:fmt(okRows.length)+"묶음의 기준금액을 세웠습니다 · "
             +(r.left?("아직 미확정 "+fmt(r.left)+"행"):"미확정 0 행"),
        sub:"<b>환율 시트("+esc(S.ym)+")에 저장이 끝났습니다.</b> 아래 <b>수입 묶음</b> 표의 「기준 · 환율」 칸에서 확인하세요.",
        short:"환율 "+fmt(okRows.length)+"묶음 세움",
        ok:okRows, no:noRows,
        next: r.left
          ? ('아직 <b>미확정 '+fmt(r.left)+'행</b>이 남았습니다 — 아래 표에서 그 묶음의 「기준」 과 「환율」 을 직접 쳐 넣고 「저장」 을 누르세요.')
          : '미확정이 <b>0 행</b>이 됐습니다 — ⑥ 부대비용 얹기로 넘어가세요.',
        nextBtn: r.left ? '' : '<button class="btn sm go" data-goto="6">⑥ 으로 가기</button>'
      };
      closeRender(); S.close=null; closeBoot(S.ym,true);
    }, function(m){ hold(false); done(); note(m,"bad",true); });
    return;
  }

  if(p.kind==="duty"){
    var pl2Ok=(p.data.plan||[]).filter(function(x){ return x.ok; });
    hold(true, "관세 넣는 중… "+pl2Ok.length+"건",
      "유니패스 신고의 관세를 B/L 에 붙은 입고묶음에 얹습니다");
    run("apiDutyToCost",[S.ym,true],function(r){
      hold(false); done(); S.prev=null;
      var sumD=0; (r.done||[]).forEach(function(x){ sumD+=x.duty||0; });
      var okRows=(r.done||[]).map(function(x){
        return [String(x.no||"")+"  "+fmt(x.duty)+"원", ((x.grps||[]).join(", ")||"?")+" 에 얹었습니다"]; });
      var noRows=(r.fail||[]).map(function(f){ return [(f.p&&f.p.no)||"", String(f.msg||"")]; })
        .concat((r.plan||[]).filter(function(x){ return !x.ok; })
          .map(function(x){ return [String(x.no||x.bl||""), String(x.why||"")]; }));
      var needBl=noRows.filter(function(x){ return String(x[1]).indexOf("B/L 자동연결")>=0; }).length;
      S.pvres={
        ym:S.ym, step:6, bad:!!noRows.length,
        title:"관세를 넣었습니다 — 결과",
        head:fmt((r.done||[]).length)+"건 · 합계 "+fmt(sumD)+"원을 부대비용으로 넣었습니다",
        sub:"<b>비용 시트에 저장이 끝났습니다.</b> 아래 <b>넣은 부대비용</b> 표에 「관세」 줄로 들어가 있습니다 — 같은 신고번호는 두 번 안 들어갑니다.",
        short:"관세 "+fmt((r.done||[]).length)+"건 넣음",
        ok:okRows, no:noRows,
        next: (!(r.done||[]).length && needBl)
          ? '<b>한 건도 못 넣었습니다.</b> B/L 에 붙은 입고묶음이 없어서입니다 — ⑤ 의 「② 자동으로 이어 보기」 를 먼저 하세요.'
          : '다음은 <b>운임 · 통관수수료</b> 입니다 — 위 「부대비용 넣기」 를 누르고 홈택스 후보를 고르세요.',
        nextBtn: (!(r.done||[]).length && needBl)
          ? '<button class="btn sm go" data-goto="5">⑤ 로 가기</button>' : ''
      };
      closeRender(); S.close=null; closeBoot(S.ym,true);
    }, function(m){ hold(false); done(); note(m,"bad",true); });
  }
}

/* ── ⑥ 부대비용 넣기 — 수불부에서 이사해 왔다 ─────────────
 *  예전엔 이 폼이 수불부 탭에 있어서, 단계 ⑥ 을 하다가 탭을 갈아타야 했다.
 *  붙일 묶음 목록(grps)은 apiClose 가 같이 내려 준다 — 수불부와 «같은 함수»(costGroups_)라
 *  두 화면의 분모가 갈라질 수 없다. 왕복도 안 는다. */

}
