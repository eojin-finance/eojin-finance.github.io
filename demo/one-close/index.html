    if(left) why.push(r.k==='수입'? (r.T===null? {t:'환율 없음', c:'warn', a:left, tip:'송금 환율을 아직 안 넣음 · 입고대장 원화 '+kf(r.limp)}

      : {t:Math.abs(left)<10?'끝전':'기타', c:'mut', a:left, tip:'VAT 반올림 — 공급가+round(공급가×0.1) vs round(공급가×1.1)'});

/* ── 거래처 원장 — 기준월 M 기준. 미지급 = 입고 대금(TTL) − 지급월 칸(지급월이 지난 것). 이월 건 포함 */
function pyVdRows(){
  var M=PY.bm, V={};
  PY.d.rows.forEach(function(r){
    if(r.ym>M || !pyHit(r)) return;
    var e=V[r.v]||(V[r.v]={v:r.v, ds:{}, rows:[], open0:0, inc:0, pay:0, fut:{}});
    e.ds[r.d]=1; e.rows.push(r);
    if(r.ym<M) e.open0+=r.tot; else e.inc+=r.tot;
    r.cells.forEach(function(c){ if(c.m<M) e.open0-=c.a; else if(c.m===M) e.pay+=c.a; else e.fut[c.m]=(e.fut[c.m]||0)+c.a; });
  });
  return Object.keys(V).map(function(v){ var e=V[v]; e.end=e.open0+e.inc-e.pay; return e; })
    .filter(function(e){ return e.open0||e.inc||e.pay||e.end; })
    .sort(function(a,b){ return b.end-a.end || (a.v<b.v?-1:1); });
}

    paySave([{t:'adj',ym:r.ym,id:r.id,kind:kind,a:n,pm:pmv,memo:memo}]);
  });
  on('[data-pyadel]',function(b){
    var a=b.getAttribute('data-pyadel').split('|'), no=+a.pop(), r=pyRow(a.join('|')); if(!r) return;
    var x=r.adjs.filter(function(j){ return j.no===no; })[0]; if(!x) return;
    ui.ask({title:x.kind+' '+kf(x.a)+' 삭제', ok:'삭제', danger:true}).then(function(yes){
      if(!yes) return;
      var c=pyCell(r,x.pm); c.adj-=x.a; c.a-=x.a; r.adj-=x.a; r.adjs.splice(r.adjs.indexOf(x),1); pyTot(r); pyRedraw();
      paySave([{t:'adj',ym:r.ym,id:r.id,no:no,del:true}]);
    });
  });
  // 결제조건
  B.querySelectorAll('[data-pyr]').forEach(function(el){ el.onchange=function(){
    var a=el.getAttribute('data-pyr').split('|'), r=PY.rules[+a[0]], f=a[1], v=el.value.trim();
    if(f[0]==='p') r.p[+f[1]]=Number(v.replace(/[,\s%]/g,''))||0;
    else if(f==='lo'||f==='hi') r[f]=v===''?null:Number(v.replace(/[,\s]/g,''));
    else r[f]=v; }; });
  on('[data-pyrdel]',function(b){ PY.rules.splice(+b.getAttribute('data-pyrdel'),1); pyRedraw(); });
  var ra=$('pyRAdd'); if(ra) ra.onclick=function(){ PY.rules.push({d:'',v:'',mo:'',lo:null,hi:null,p:[0,0,0],memo:''}); pyRedraw(); };
  var rs=$('pyRSave'); if(rs) rs.onclick=function(){
    var bad=PY.rules.filter(function(r){ return r.p[0]+r.p[1]+r.p[2]!==100; });
    if(bad.length){ note('비율 합이 100 이 아닌 줄 '+bad.length+'개','warn'); return; }
    PY.d.rules=PY.rules.map(function(r,i){ return {i:i,d:r.d,v:r.v,mo:r.mo,lo:r.lo,hi:r.hi,p:r.p.slice(),memo:r.memo}; });
    paySave([{t:'rules',rows:PY.rules}]); note('결제조건 '+PY.rules.length+'줄','ok');
  };
}
/** 본문만 갈아끼운다 — 찾기 칸 커서 그대로 */
function pyRedraw(){
  var b=$('pyBody'), el=$('pyQ'); if(!b) return;
  var pos=el?el.selectionStart:0, foc=document.activeElement===el;
  tblHTML(b,payBody(),payBind); payBind();
  if(typeof ui!=='undefined' && ui.ddEnhanceAll) ui.ddEnhanceAll();
  if(el && foc){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} }
}

/** 내려받기 — 보이는 보기의 열 순서. 입고월·지급월: 사업본부·업체명·(입고월)·지급월 칸…·TTL·메모, 본부 소계, 거래처 합계, TTL. 거래처: 원장 목록 열 */
function payCsv(){
  var L=[], q=function(t){ t=String(t==null?'':t); return /[",\n]/.test(t)? '"'+t.replace(/"/g,'""')+'"' : t; };
  var sm=function(a){ return a.reduce(function(s,x){ return s+x; },0); }, nm='대금_'+(PY.seg==='ym'?'입고':PY.seg==='vd'?'거래처':'지급')+'_'+PY.bm+(PY.dept?'_'+PY.dept:'')+'.csv';
  if(PY.seg==='vd'){
    L.push(['업체명','본부','기초 미지급',pyM(PY.bm)+' 발생',pyM(PY.bm)+' 말 지급','기말 미지급','이후 지급 예정'].join(','));
    var T=[0,0,0,0];
    pyVdRows().forEach(function(e){ var a=[e.open0,e.inc,e.pay,e.end].map(Math.round); a.forEach(function(x,i){ T[i]+=x; });
      L.push([q(e.v),q(Object.keys(e.ds).sort(pyDsort).join('·'))].concat(a).concat([q(Object.keys(e.fut).sort().filter(function(m){ return e.fut[m]; }).map(function(m){ return pyM(m)+' '+Math.round(e.fut[m]); }).join(' / '))]).join(',')); });
    L.push(['TTL',''].concat(T).concat(['']).join(','));
    return kDl(L,nm);
  }
  var P=PY.seg==='ym'?pyInRows():pyPmRows(), ms=P.ms, y=P.yc?1:0, pad=y?['','']:[''];
  var cv=function(r,m){ var c=r.cells.filter(function(x){ return x.m===m; })[0]; return c?Math.round(c.a):0; }, z=function(){ return ms.map(function(){ return 0; }); };
  L.push(['사업본부','업체명'].concat(y?['입고월']:[]).concat(ms.map(function(m){ return pyM(m)+' 말'; })).concat(['TTL','메모']).join(','));
  var by={}, vt={}, T2=z();
  P.rows.forEach(function(r){ (by[r.d]||(by[r.d]=[])).push(r); });
  Object.keys(by).sort(pyDsort).forEach(function(d){
    var st=z(), full=PY_FULL[d]||d;
    by[d].sort(function(a,b){ return a.ym<b.ym?1:a.ym>b.ym?-1:(b.tot-a.tot); }).forEach(function(r){
      var a=ms.map(function(m){ return cv(r,m); }), e=vt[r.v]||(vt[r.v]=z());
      a.forEach(function(x,i){ st[i]+=x; e[i]+=x; });
      L.push([q(full),q(r.v)].concat(y?[pyYm2(r.ym)]:[]).concat(a).concat([sm(a),q(r.memo)]).join(','));
    });
    st.forEach(function(x,i){ T2[i]+=x; });
    L.push([q(full+' S.TTL'),''].concat(y?['']:[]).concat(st).concat([sm(st),'']).join(','));
  });
  L.push('');
  Object.keys(vt).forEach(function(v){ var e=vt[v]; L.push(pad.concat([q(v)]).concat(e).concat([sm(e)]).join(',')); });
  L.push(['TTL'].concat(pad).concat(T2).concat([sm(T2)]).join(','));
  kDl(L,nm);
}
</script>

<script>
/* ── 레드라인 (Redline.gs) ─────────────────────────────────────────────
   앱바 펜 단추 → 화면 전체에 그리기 층(투명, 빨간 테두리). 휠은 아래 화면으로 넘기고 드래그만 가로챈다.
   드래그 → 빨간 사각형 → 옆 입력 상자(Enter 저장 · Shift+Enter 줄바꿈 · Esc 취소, 한글 조합 중 Enter 무시).
   저장은 화면 먼저(낙관적) → 뒤에서 apiRedlineSave(영역 JPEG 포함). 실패하면 되돌린다.
   좌표: x·w = 앱(.app) 폭 기준 % · y·h = 앱 위끝부터 문서 px(스크롤 오프셋 포함). 다시 그릴 때 그때의 앱 위치에 맞춘다.
   데이터는 모드를 켤 때만 부른다(첫 접속에 영향 없음). */
var RL={on:false, d:null, ed:null, pend:{}, seq:0};
var RL_H2C='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
var RL_ICO={check:'<path d="M20 6 9 17l-5-5"/>', trash:'<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>'};
function rlIco(n){ return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+RL_ICO[n]+'</svg>'; }
function rlR2(v){ return Math.round(v*100)/100; }
function rlApp(){ return document.querySelector('.app'); }
function rlTab(){ var t=document.querySelector('.tab[aria-selected=true]'); return t?t.getAttribute('data-t'):'case'; }
function rlSeg(tab){
  if(tab==='stock' && typeof K!=='undefined') return K.seg||'';
  if(tab==='pay' && typeof PY!=='undefined') return PY.seg||'';
  return '';
}
/** 지금 화면 상태 — 나중에 무엇을 가리키는지 알 수 있게 */
function rlState(){
  var tab=rlTab(), o={tab:tab, seg:rlSeg(tab), ym:curYm(), br:S.br||''};
  if(tab==='stock' && typeof K!=='undefined') o.stock={seg:K.seg, rng:K.rng, q:K.q, paCls:K.paCls};
  if(tab==='pay' && typeof PY!=='undefined') o.pay={seg:PY.seg, pm:PY.pm, dept:PY.dept, q:PY.q, open:PY.open};
  var P=document.querySelector('#pCase:not([hidden]),#pClose:not([hidden]),#pStock:not([hidden]),#pPay:not([hidden])');
  if(P) o.pressed=[].slice.call(P.querySelectorAll('[aria-pressed=true]')).map(function(b){ return (b.textContent||b.title||'').trim().slice(0,20); }).filter(String).slice(0,12);
  return o;
}
function rlMine(m){ return !!(m.own || (RL.d && RL.d.fin)); }
function rlHere(){ var tab=rlTab(), seg=rlSeg(tab);
  return ((RL.d&&RL.d.rows)||[]).filter(function(m){ return m.tab===tab && String((m.state||{}).seg||'')===seg; })
    .filter(function(m){ return !m.gone; }).sort(function(a,b){ return (a.id||'R~'+a.seq)<(b.id||'R~'+b.seq)?-1:1; }); }

function rlInit(){
  if($('rlLayer')) return;
  var L=document.createElement('div'); L.id='rlLayer'; L.hidden=true; document.body.appendChild(L);
  var M=document.createElement('div'); M.id='rlMarks'; M.hidden=true; document.body.appendChild(M);
  L.addEventListener('pointerdown', rlDown);
  L.addEventListener('wheel', rlWheel, {passive:false});
  window.addEventListener('resize', function(){ if(RL.on) rlPaint(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && RL.on && !RL.ed && !document.querySelector('dialog[open]')) rlToggle(false); });
}
function rlToggle(on){
  rlInit();
  RL.on = (on===undefined) ? !RL.on : !!on;
  $('rlBtn').setAttribute('aria-pressed', String(RL.on));
  $('rlLayer').hidden=!RL.on; $('rlMarks').hidden=!RL.on;
  if(!RL.on){ rlEdClose(); return; }
  rlPaint(); rlFetch();
}
function rlFetch(){
  run('apiRedlineList',[],function(d){
    // 저장 중인 표시(tmp·고치는 중)는 서버 목록이 덮지 않게 합친다
    var keep=((RL.d&&RL.d.rows)||[]).filter(function(m){ return !m.id; });
    d.rows=d.rows.map(function(m){ return RL.pend[m.id]||m; }).concat(keep);
    RL.d=d; if(RL.on) rlPaint();
  },function(m){ note(m,'bad',true); });
}

/* ── 그리기 */
function rlGeo(){ var r=rlApp().getBoundingClientRect(); return {x:r.left+scrollX, y:r.top+scrollY, w:r.width, h:r.height}; }
function rlDoc(m){ var A=rlGeo(), b=m.box||{}, p=b.pct||{}, q=b.px||{};
  return {x:A.x+(p.x||0)*A.w/100, y:A.y+(q.y||0), w:(p.w||0)*A.w/100, h:q.h||0}; }
function rlPos(el,r){ el.style.left=r.x+'px'; el.style.top=r.y+'px'; if(r.w!=null){ el.style.width=r.w+'px'; el.style.height=r.h+'px'; } }
function rlPaint(){
  var M=$('rlMarks'); if(!M) return;
  M.querySelectorAll('.rl-box:not(.draft),.rl-pin').forEach(function(x){ x.remove(); });
  rlHere().forEach(function(m,i){
    var r=rlDoc(m), done=m.st==='반영됨';
    var b=document.createElement('div'); b.className='rl-box'+(done?' done':''); rlPos(b,r); M.appendChild(b);
    var p=document.createElement('button'); p.type='button'; p.className='rl-pin'+(done?' done':'')+(m.id?'':' tmp');
    p.textContent=String(i+1);
    p.title=(m.id||'저장 중')+' · '+(m.by||'')+(m.at?' · '+m.at:'')+(done?' · 반영됨':'')+'\n'+m.text;
    p.setAttribute('aria-label','레드라인 '+(i+1)+(done?' 반영됨':''));
    rlPos(p,{x:r.x-11, y:r.y-11});
    p.onclick=function(ev){ ev.stopPropagation(); rlEdOpen(m); };
    M.appendChild(p);
  });
}

/* 휠은 아래 화면으로 — 가장 가까운 스크롤 상자, 없으면 문서 */
function rlWheel(e){
  e.preventDefault();
  var L=$('rlLayer'); L.style.pointerEvents='none';
  var el=document.elementFromPoint(e.clientX,e.clientY); L.style.pointerEvents='';
  var k=e.deltaMode===1?16:e.deltaMode===2?innerHeight:1, dx=e.deltaX*k, dy=e.deltaY*k;
  if(e.shiftKey && !dx){ dx=dy; dy=0; }
  for(var n=el; n && n!==document.body && n!==document.documentElement; n=n.parentElement){
    var cs=getComputedStyle(n);
    var cy=dy && /(auto|scroll)/.test(cs.overflowY) && (dy>0 ? n.scrollTop+n.clientHeight<n.scrollHeight-1 : n.scrollTop>0);
    var cx=dx && /(auto|scroll)/.test(cs.overflowX) && (dx>0 ? n.scrollLeft+n.clientWidth<n.scrollWidth-1 : n.scrollLeft>0);
    if(cy||cx){ n.scrollBy(cx?dx:0, cy?dy:0); return; }
  }
  (document.scrollingElement||document.documentElement).scrollBy(dx,dy);
}

function rlDown(e){
  if(e.button!==0) return;
  var bb=$('rlBtn').getBoundingClientRect();
  if(e.clientX>=bb.left && e.clientX<=bb.right && e.clientY>=bb.top && e.clientY<=bb.bottom){ rlToggle(false); return; }   // 층이 단추를 덮어도 끌 수 있게
  e.preventDefault();
  if(RL.ed) rlEdClose();
  var L=$('rlLayer'), M=$('rlMarks'); try{ L.setPointerCapture(e.pointerId); }catch(er){}
  var x0=e.clientX+scrollX, y0=e.clientY+scrollY, R=document.createElement('div'); R.className='rl-box draft'; M.appendChild(R);
  var cur=null;
  function mv(ev){ var x1=ev.clientX+scrollX, y1=ev.clientY+scrollY;
    cur={x:Math.min(x0,x1), y:Math.min(y0,y1), w:Math.abs(x1-x0), h:Math.abs(y1-y0)}; rlPos(R,cur); }
  function up(){
    L.removeEventListener('pointermove',mv); L.removeEventListener('pointerup',up); L.removeEventListener('pointercancel',up);
    if(!cur || cur.w<8 || cur.h<8){ R.remove(); return; }
    rlEdOpen(null, cur, R);
  }
  L.addEventListener('pointermove',mv); L.addEventListener('pointerup',up); L.addEventListener('pointercancel',up);
}

/* ── 입력 상자 — 새 표시(m=null, r=문서 좌표, R=그린 사각형) 또는 있는 표시(m) */
function rlEdOpen(m, r, R){
  rlEdClose();
  r=r||rlDoc(m);
  var M=$('rlMarks'), can=!m || rlMine(m), E=document.createElement('div');
  E.className='rl-ed'; E.setAttribute('role','dialog'); E.setAttribute('aria-label', m?'레드라인 '+(m.id||''):'레드라인 지시');
  var h='<textarea rows="3" aria-label="수정 지시"'+(can?'':' readonly')+'></textarea>';
  if(m) h+='<div class="rl-f"><span class="rl-m">'+esc((m.id||'저장 중')+' · '+(m.by||'')+(m.at?' · '+m.at:''))+'</span>'
    +(can && m.id?'<button type="button" class="rl-i" data-rl="done" aria-pressed="'+(m.st==='반영됨')+'" title="반영됨" aria-label="반영됨">'+rlIco('check')+'</button>'
      +'<button type="button" class="rl-i del" data-rl="del" title="지우기" aria-label="지우기">'+rlIco('trash')+'</button>':'')+'</div>';
  if(m && m.reply) h+='<div class="rl-rp">'+esc(m.reply)+'</div>';
  E.innerHTML=h; M.appendChild(E);
  var dw=Math.max(document.documentElement.scrollWidth, innerWidth), W=280;
  rlPos(E,{x: r.x+r.w+8+W<=dw ? r.x+r.w+8 : Math.max(8, r.x-W-8), y:r.y});
  var ta=E.querySelector('textarea'); ta.value=m?m.text:'';
  RL.ed={el:E, m:m, r:r, R:R};
  ta.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); rlEdClose(); return; }
    if(e.key==='Enter' && !e.shiftKey){
      if(e.isComposing || e.keyCode===229) return;   // 한글 조합 중 Enter 는 조합 끝내기 — 저장 아님
      e.preventDefault(); if(can) rlEdSave();
    }
  });
  E.querySelectorAll('[data-rl]').forEach(function(b){ b.onclick=function(ev){ ev.stopPropagation(); var k=b.getAttribute('data-rl'); if(k==='done') rlDone(m); else rlDel(m); }; });
  ta.focus(); if(m) ta.setSelectionRange(ta.value.length, ta.value.length);
}
function rlEdClose(){
  var e=RL.ed; if(!e) return; RL.ed=null;
  e.el.remove(); if(e.R) e.R.remove();
}
function rlEdSave(){
  var e=RL.ed; if(!e) return;
  var t=e.el.querySelector('textarea').value.trim();
  if(!t){ e.el.querySelector('textarea').focus(); return; }   // 지시는 반드시 글로
  rlEdClose();
  if(e.m){ if(t!==e.m.text) rlEdit(e.m, t); return; }
  rlAdd(e.r, t);
}

/* ── 저장 (화면 먼저) */
function rlAdd(r, text){
  var A=rlGeo(), st=rlState(), v={x:r.x-scrollX, y:r.y-scrollY, w:r.w, h:r.h};
  var box={pct:{x:rlR2((r.x-A.x)/A.w*100), y:rlR2((r.y-A.y)/A.h*100), w:rlR2(r.w/A.w*100), h:rlR2(r.h/A.h*100)},
    px:{x:Math.round(r.x-A.x), y:Math.round(r.y-A.y), w:Math.round(r.w), h:Math.round(r.h)},
    doc:{x:Math.round(r.x), y:Math.round(r.y)}, scroll:{x:Math.round(scrollX), y:Math.round(scrollY)},
    view:{w:innerWidth, h:innerHeight}, app:{w:Math.round(A.w), h:Math.round(A.h)}};
  var els=rlEls(v);
  var me=(S.boot&&S.boot.me)||{};
  var m={id:'', seq:++RL.seq, tab:st.tab, state:st, box:box, text:text, st:'열림', own:true, by:me.name||me.email||'', at:''};
  RL.d=RL.d||{rows:[], fin:false}; RL.d.rows.push(m); rlPaint();
  // 글은 바로 저장, 영역 이미지(캡처 + Drive 1~2초)는 뒤따라 apiRedlineImg — 저장 응답이 캡처·Drive 를 기다리지 않게
  var idP=new Promise(function(res){
    run('apiRedlineSave',[{t:'add', tab:st.tab, state:st, box:box, els:els, text:text, img:''}],function(x){
      m.id=x.id; m.at=x.at; rlPaint(); res(x.id);
    },function(msg){ RL.d.rows.splice(RL.d.rows.indexOf(m),1); rlPaint(); note(msg,'bad',true); res(''); });
  });
  Promise.all([idP, rlShot(r)]).then(function(a){
    if(!a[0] || !a[1]) return;
    run('apiRedlineImg',[a[0],a[1]],function(y){ m.img=y.img; rlPaint(); },
      function(msg){ note('레드라인 '+a[0]+' 글은 저장, 이미지는 못 남김: '+msg,'warn'); });
  });
}
function rlOp(m, op, undo){
  RL.pend[m.id]=m; rlPaint();
  run('apiRedlineSave',[op],function(){ delete RL.pend[m.id]; },
    function(msg){ delete RL.pend[m.id]; undo(); rlPaint(); note(msg,'bad',true); });
}
function rlEdit(m, t){ var o=m.text; m.text=t; rlOp(m,{t:'edit', id:m.id, text:t},function(){ m.text=o; }); }
function rlDone(m){ var o=m.st; m.st=o==='반영됨'?'열림':'반영됨'; rlEdClose(); rlOp(m,{t:'done', id:m.id, on:m.st==='반영됨'},function(){ m.st=o; }); }
function rlDel(m){
  ui.ask({title:(m.id||'')+' 삭제', body:m.text, ok:'삭제', danger:true}).then(function(yes){
    if(!yes) return;
    m.gone=1; rlEdClose();
    rlOp(m,{t:'del', id:m.id},function(){ m.gone=0; });
  });
}

/* 영역 안 요소 요약 — 격자 점마다 elementsFromPoint, 위 3개씩, 중복 빼고 2,000자 */
function rlEls(v){
  var L=$('rlLayer'), M=$('rlMarks'), seen=[], out=[];
  var nx=Math.min(12, Math.max(3, Math.round(v.w/60))), ny=Math.min(10, Math.max(3, Math.round(v.h/40)));
  for(var j=0;j<ny;j++) for(var i=0;i<nx;i++){
    var x=v.x+(i+.5)*v.w/nx, y=v.y+(j+.5)*v.h/ny;
    if(x<0||y<0||x>innerWidth||y>innerHeight) continue;
    var k=0;
    document.elementsFromPoint(x,y).forEach(function(el){
      if(k>=3 || el===L || M.contains(el) || el===document.body || el===document.documentElement) return;
      k++; if(seen.indexOf(el)>=0) return; seen.push(el);
      var cl=typeof el.className==='string'?el.className.trim().split(/\s+/).filter(String).slice(0,2):[];
      var tx=(el.children.length<=4?(el.innerText||el.textContent||''):'').replace(/\s+/g,' ').trim().slice(0,40);
      out.push(el.tagName.toLowerCase()+(el.id?'#'+el.id:'')+(cl.length?'.'+cl.join('.'):'')+(tx?' "'+tx+'"':''));
    });
  }
  return out.join('\n').slice(0,2000);
}

/* 영역 캡처 — html2canvas 는 필요할 때만 불러온다. 못 하면 '' (글만 저장) */
var _RLQ=null;
function rlLib(cb){
  if(window.html2canvas) return cb(window.html2canvas);
  if(_RLQ){ _RLQ.push(cb); return; }
  _RLQ=[cb];
  var s=document.createElement('script'); s.src=RL_H2C; s.async=true;
  var done=function(){ if(!_RLQ) return; var q=_RLQ; _RLQ=null; q.forEach(function(f){ f(window.html2canvas||null); }); };
  s.onload=done; s.onerror=done; setTimeout(done,8000); document.head.appendChild(s);
}
function rlShot(r){
  return new Promise(function(res){
    var fin=false, end=function(v){ if(!fin){ fin=true; res(v||''); } };
    setTimeout(function(){ end(''); }, 12000);
    rlLib(function(h2c){
      if(!h2c) return end('');
      var sc=Math.min(window.devicePixelRatio||1, 900/Math.max(1,r.w));
      try{
        h2c(document.body,{x:r.x, y:r.y, width:r.w, height:r.h, scale:sc, logging:false, useCORS:true,
          backgroundColor:getComputedStyle(document.body).backgroundColor||null,
          ignoreElements:function(el){ return el.id==='rlLayer'||el.id==='rlMarks'||el.id==='notes'; }})
          .then(function(c){ try{ end(c.toDataURL('image/jpeg',0.7)); }catch(e){ end(''); } }, function(){ end(''); });
      }catch(e){ end(''); }
    });
  });
}
