    '<div class="cap">이 발주처의 특정 납기월만</div>'+
    ms.map(function(m){ return '<button data-mo="'+esc(m)+'">'+esc(m)+' 납기</button>'; }).join('')+
    '<div class="sep"></div><button data-list="1">걸린 규칙 전체 보기</button>';
  document.body.appendChild(el);
  el.style.left=Math.min(e.clientX,window.innerWidth-260)+'px';
  el.style.top=Math.min(e.clientY,window.innerHeight-el.offsetHeight-12)+'px';
  el.onclick=function(ev){ ev.stopPropagation(); };
  Array.prototype.forEach.call(el.querySelectorAll('button'),function(b){
    b.onclick=function(){
      payCtxClose();
      if(b.getAttribute('data-list')) payListOpen();
      else payExOpen(v,b.getAttribute('data-mo'));
    };
  });
  payCtx=el;
}

/** 예외 하나를 넣거나 고친다. 적용 전에 각 달이 얼마 움직이는지 같이 보여준다. */
function payExOpen(v,mo){
  mo=mo||'';
  var ex=payEx(), cur=null;
  ex.forEach(function(r){ if(r.v===v && (r.mo||'')===mo) cur=r; });
  var p=cur? cur.p.slice() : [30,40,30];
  var rs=rows(), before=payPreview(rs,ex);

  modal('<h3>'+esc(v)+(mo? ' · '+esc(mo)+' 납기':' 전체')+' 예외</h3>'+
    '<p>납기 다음 달부터 몇 %씩 나갈지 적습니다. 합이 100%여야 합니다.</p>'+
    '<div class="payrow">'+[0,1,2].map(function(k){
      return '<label>'+['익월','익익월','익익익월'][k]+
        '<input type="number" min="0" max="100" step="5" id="payp'+k+'" value="'+p[k]+'"></label>'; }).join('')+
    '</div><div id="paysum" class="paysum"></div><div id="paydelta"></div>'+
    '<div class="mrow">'+(cur? '<button class="btn gh" id="paydel">예외 지우기</button>':'')+
    '<button class="btn gh" id="paycancel" style="margin-left:auto">취소</button>'+
    '<button class="btn" id="payok">적용하고 저장</button></div>');

  function read(){ return [0,1,2].map(function(k){ return Number(document.getElementById('payp'+k).value)||0; }); }
  function preview(){
    var np=read(), sum=np[0]+np[1]+np[2];
    document.getElementById('paysum').innerHTML = sum===100
      ? '<span class="ok">합 100%</span>'
      : '<span class="bad">합이 '+sum+'% 입니다 — 100%여야 저장됩니다</span>';
    var trial=ex.filter(function(r){ return !(r.v===v && (r.mo||'')===mo); })
      .concat([{v:v,mo:mo,lo:null,hi:null,p:np,row:0}]);
    var after=payPreview(rs,trial), keys={};
    Object.keys(before).forEach(function(k){ keys[k]=1; });
    Object.keys(after).forEach(function(k){ keys[k]=1; });
    var rowsH=Object.keys(keys).sort().map(function(k){
      var d=Math.round((after[k]||0)-(before[k]||0));
      if(!d) return '';
      return '<tr><td>'+esc(k)+'</td><td class="r">'+n0(after[k]||0)+'</td>'+
             '<td class="r '+(d>0?'up':'dn')+'">'+(d>0?'+':'')+n0(d)+'</td></tr>';
    }).join('');
    document.getElementById('paydelta').innerHTML = rowsH
      ? '<div class="paycap">이 예외로 움직이는 자금</div><table class="paydelta">'+
        '<thead><tr><th>지급월</th><th class="r">적용 후</th><th class="r">차이</th></tr></thead>'+
        '<tbody>'+rowsH+'</tbody></table>'
      : '<div class="paycap">달라지는 금액이 없습니다</div>';
    return np;
  }
  [0,1,2].forEach(function(k){ document.getElementById('payp'+k).oninput=preview; });
  preview();
  document.getElementById('paycancel').onclick=closeModal;
  document.getElementById('payok').onclick=function(){
    var np=read();
    if(np[0]+np[1]+np[2]!==100){ toast('비율 합이 100%가 아닙니다'); return; }
    paySave(ex.filter(function(r){ return !(r.v===v && (r.mo||'')===mo); })
              .concat([{v:v,mo:mo,lo:null,hi:null,p:np,row:0}]));
  };
  var dl=document.getElementById('paydel');
  if(dl) dl.onclick=function(){
    paySave(ex.filter(function(r){ return !(r.v===v && (r.mo||'')===mo); }));
  };
}

/** 시트에 쓰고 스냅샷까지 다시 만든다 — 새로고침해도 되돌아가지 않게. */
function paySave(ex){
  closeModal();
  busyOn('결제조건 저장 중','9.결제조건 탭 기록 · 스냅샷 재생성');
  google.script.run
    .withSuccessHandler(function(r){
      busyOff();
      if(!r||!r.ok){ toast((r&&r.msg)||'저장 실패'); return; }
      var d=expand(JSON.parse(r.data));
      PAYRULES=(d.pay&&d.pay.rows)||[];
      PAYERR=(d.pay&&d.pay.err)||'';
      BUILT=r.built||BUILT;
      draw();
      toast('결제조건 저장됨 — 예외 '+r.n+'개');
    })
    .withFailureHandler(function(e){ busyOff(); toast('실패 — '+(e&&e.message||e)); })
    .apiSavePayRules(ex.map(function(r){
      return { v:r.v||'', mo:r.mo||'', lo:r.lo, hi:r.hi, p:r.p };
    }));
}

/* 발매월 × 브랜드 — 돈이 언제 들어오나.
   A본부·BETA·GAMMA 은 원본에 발매일이 있어 월이 잡히고, 나머지는 '발매일없음' 한 칸에 모인다.
   시점 미정 금액이 얼마인지가 이 표의 진짜 용건이라 그 칸을 숨기지 않고 맨 뒤에 세운다. */
/* ── 예상 vs 실적 ─────────────────────────────────────────────
   대장(예상)은 시즌 전체 발주고, 실적은 그 달까지 팔린 것이다. 둘을 한 줄에 놓으면
   "발주한 게 실제로 나가고 있나" 가 품번 단위로 보인다.

   조인은 품번만 쓴다. 색상은 표기가 브랜드마다 달라서(ALPHA·UO·OH 는 BLK 약어,
   BETA·GAMMA·OD 는 BLACK 풀네임, UV 는 빈칸, COSTCO 는 혼용률까지 붙는다) 맞출 수가 없다.
   품번만으로도 소진율·달성률은 다 나온다.

   무상량(마케팅·샘플·폐기 출고)은 판매량에서 빼고 따로 센다. 섞으면 소진율이 부풀려진다. */
function actBy(mo){
  var m={};
  ACT.forEach(function(r){
    if(mo && r.mo!==mo) return;
    var x=m[r.pn]||(m[r.pn]={q:0,fq:0,av:0,a:0,c:0,tag:0});
    x.q+=r.q; x.fq+=r.fq; x.av+=r.av; x.a+=r.a; x.c+=r.c;
    if(r.tag) x.tag=Math.max(x.tag,r.tag);
  });
  return m;
}
/** 화면 필터가 걸린 대장 행을 품번으로 접는다 — 예상 쪽. */
function expBy(rs){
  var m={};
  rs.forEach(function(r){
    var x=m[r.pn]||(m[r.pn]={b:r.b,nm:r.nm,q:0,sal:0,cost:0,tag:0});
    x.q+=qtyOf(r); x.sal+=saleOf(r); x.cost+=amtOf(r);
    if(r.sp) x.tag=Math.max(x.tag,Number(r.sp)||0);
  });
  return m;
}
/** ERP 시트의 재고·입고를 품번으로 접는다. 같은 품번이 여러 탭에 있으면 더한다. */
function stkBy(){
  var m={};
  STK.forEach(function(r){
    var x=m[r.pn]||(m[r.pn]={in_:0,out:0,wh:0,shop:0,stk:0});
    x.in_+=r.in_; x.out+=r.out; x.wh+=r.wh; x.shop+=r.shop; x.stk+=r.stk;
  });
  return m;
}
/** 재고가 연동된 브랜드만. 나머지는 '미연동'이라고 말해 줘야 0 과 헷갈리지 않는다. */
function stkBrands(){
  var b={};
  STKSRC.forEach(function(s){ if(s.b) b[s.b]=1; });
  return b;
}
function ratebar(p){
  var w=Math.max(0,Math.min(100,p));
  var c = p>=80?'var(--ok)' : p>=40?'var(--acc)' : p>0?'var(--warn)' : 'var(--faint)';
  return '<div class="rbar"><i style="width:'+w.toFixed(1)+'%;background:'+c+'"></i>'+
         '<b>'+(p?p.toFixed(0)+'%':'-')+'</b></div>';
}
/* ── 발매일 × 브랜드 ─────────────────────────────────────────
   시트 `1.예상매출` 의 발매일자별 표를 그대로 화면에 올린 것이다. 품번 단위(아래 표)보다
   한 단계 위에서 "이번 차수가 얼마나 나갔나" 를 본다.

   예상은 대장의 발매일(rd)로 묶고, 실적은 6.실적_재고 의 발매일로 묶는다. 둘 다 원천이
   우리 2.매출대장 이라 같은 날짜다. ERP 시트의 품번 탭도 결국 우리 걸 베낀 것이라 안 쓴다.

   발매일이 없는 브랜드(OH·OD·UV·UO·COSTCO — 원본에 열 자체가 없다)는 맨 뒤에 한 줄로 모은다.
   0 이 아니라 '아직 기준이 없는 것' 이라 섞으면 안 된다. */
function relRows(rs){
  var E={}, ord=[];
  function key(d,b){ return (d||'￿발매일 없음')+'|'+b; }
  rs.forEach(function(r){
    var d=r.rd||'', b=r.b, k=key(d,b);
    if(!E[k]){ E[k]={d:d,b:b,q:0,sal:0,sq:0,sa:0,stk:0,has:false}; ord.push(k); }
    var e=E[k]; e.q+=qtyOf(r); e.sal+=saleOf(r);
  });
  var SB=stkBrands();
  /* 실적의 발매일(r.rel)은 2.매출대장 E 에서, 예상의 발매일(r.rd)은 변환탭 CB 에서 온다.
     두 경로가 늘 같지는 않아서(I-019·I-033) 섞으면 같은 품번이 다른 줄로 갈라진다 —
     발매일 없음 줄이 소진율 158% 로 나오던 원인이다. 여기서는 대장 쪽 rd 하나로 통일한다. */
  var rdOf={};
  rs.forEach(function(r){ if(!rdOf[r.pn] && r.rd) rdOf[r.pn]=r.rd; });
  STK.forEach(function(r){
    var k=key(rdOf[r.pn]||'',r.b);
    if(!E[k]) return;                 /* 대장에 없는 품번(전 시즌)은 이 표의 관심 밖 */
    var e=E[k]; e.sq+=r.sq; e.sa+=r.sa; e.stk+=r.stk; e.has=true;
  });
  Object.keys(E).forEach(function(k){ if(SB[E[k].b]) E[k].live=true; });
  return ord.map(function(k){ return E[k]; })
    .filter(function(e){ return e.q||e.sal; })
    .sort(function(a,b){
      var x=a.d||'￿', y=b.d||'￿';
      return x<y?-1:x>y?1:(a.b<b.b?-1:1);
    });
}
function relPanel(rs){
  var L=relRows(rs);
  if(!L.length) return '';
  var T={q:0,sal:0,sq:0,sa:0};
  L.forEach(function(e){ T.q+=e.q; T.sal+=e.sal; T.sq+=e.sq; T.sa+=e.sa; });
  var dash='<span style="color:var(--faint)">-</span>';
  var nolive='<span style="color:var(--faint)" title="이 브랜드는 ERP 재고가 아직 연동되지 않았습니다">·</span>';
  var head='<th class="nos">발매일</th><th class="nos">브랜드</th>'+
    '<th class="nos r">발주수량</th><th class="nos r">정가 합계</th>'+
    '<th class="nos r">판매수량</th><th class="nos r">실판가 합계</th>'+
    '<th class="nos r">미판매재고</th><th class="nos" style="width:112px">판매율</th>';
  var body=L.map(function(e){
    var live=e.live;
    return '<tr'+(e.d?'':' class="paysub"')+'><td>'+esc(e.d||'발매일 없음')+'</td><td>'+esc(e.b)+'</td>'+
      '<td class="r">'+(e.q?n0(e.q):dash)+'</td>'+
      '<td class="r">'+(e.sal?n0(e.sal):dash)+'</td>'+
      '<td class="r">'+(live?(e.sq?n0(e.sq):dash):nolive)+'</td>'+
      '<td class="r">'+(live?(e.sa?n0(e.sa):dash):nolive)+'</td>'+
      '<td class="r">'+(live&&e.q?n0(e.q-e.sq):nolive)+'</td>'+
      '<td>'+(live?ratebar(e.q?e.sq/e.q*100:0):nolive)+'</td></tr>';
  }).join('');
  var foot='<td colspan="2">합계</td><td class="r">'+n0(T.q)+'</td><td class="r">'+n0(T.sal)+'</td>'+
    '<td class="r">'+n0(T.sq)+'</td><td class="r">'+n0(T.sa)+'</td>'+
    '<td class="r">'+n0(T.q-T.sq)+'</td><td>'+ratebar(T.q?T.sq/T.q*100:0)+'</td>';
  var nostk=L.filter(function(e){ return !e.live; }).length;
  return '<div class="panel"><div class="ph"><h2>발매일 × 브랜드</h2>'+bl()+
    '<span class="sub">'+n0(L.length)+'줄 · 예상·실적 둘 다 VAT 포함</span></div>'+
    tbl(head,body,foot,['116px','84px','104px','132px','104px','132px','112px','112px'])+
    '<div class="pb" style="padding-top:10px;font-size:11px;color:var(--mut)">'+
      '시트 <b>1.예상매출</b> 의 발매일자별 표와 같은 숫자입니다. '+
      '발매일이 없는 브랜드는 원본에 발매일 열 자체가 없어 맨 뒤에 모았습니다 — 0 이 아니라 기준이 없는 겁니다. '+
      '그 줄의 판매율은 100%를 넘을 수 있습니다 — 분모는 26FW 발주량인데 실제로는 이월분까지 같이 팔리기 때문입니다.'+
      (nostk? ' 재고가 아직 연동되지 않은 브랜드는 <b>·</b> 로 둡니다.':'')+
      '</div></div>';
}

function actPanel(rs){
  if(!ACT.length) return ACTERR
    ? '<div class="panel"><div class="ph"><h2>예상 vs 실적</h2></div>'+
      '<div class="paywarn">판매실적을 못 읽었습니다 ('+esc(ACTERR)+')</div></div>' : '';
  var A=actBy(AP.mo), E=expBy(rs);
  var SK=stkBy(), SB=stkBrands();
  /* 재고 없음(0)과 아예 안 들어온 브랜드를 구분한다 - 둘을 섞으면 0 으로 읽힌다 */
  var nostk='<span style="color:var(--faint)" title="이 브랜드는 ERP 재고가 아직 연동되지 않았습니다">·</span>';
  var keys=Object.keys(E).filter(function(pn){ return AP.only!=='sold' || (A[pn]&&A[pn].q); });
  var T={q:0,sq:0,fq:0,sal:0,sa:0,sc:0,n:0,hit:0,in_:0,stk:0};
  keys.forEach(function(pn){
    var e=E[pn], a=A[pn];
    T.q+=e.q; T.sal+=e.sal; T.n++;
    if(a){ T.hit++; T.sq+=a.q; T.fq+=a.fq; T.sa+=a.a; T.sc+=a.c; }
    var k=SB[e.b]?SK[pn]:null;
    if(k){ T.in_+=k.in_; T.stk+=k.stk; }
  });

             up: a.q? a.a/a.q : 0 };
  }).sort(SORT[AP.sort]||SORT.rate);
  var shown=list.slice(0,AP.n);

  var dash='<span style="color:var(--faint)">-</span>';
  var body=shown.map(function(x){
    return '<tr class="actrow" data-apn="'+esc(x.pn)+'" title="누르면 원본 판매행이 열립니다">'+
      '<td>'+esc(x.pn)+'</td><td>'+esc(x.b)+'</td>'+
      '<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis">'+esc(x.nm||'')+'</td>'+
      '<td class="r">'+n0(x.q)+'</td>'+
      '<td class="r">'+(x.sk? (x.sk.in_?n0(x.sk.in_):dash) : nostk)+'</td>'+
      '<td class="r">'+(x.sq?n0(x.sq):dash)+
        (x.fq?'<span class="freeq" title="무상출고 - 매출 0">+'+n0(x.fq)+'</span>':'')+'</td>'+
      '<td>'+ratebar(x.r)+'</td>'+
      '<td class="r">'+(x.sk? (x.sk.stk?n0(x.sk.stk):dash) : nostk)+'</td>'+
      '<td class="r">'+n0(x.sal)+'</td>'+
      '<td class="r">'+(x.sa?n0(x.sa):dash)+'</td>'+

      '<td class="r">'+(x.tag?n0(x.tag):dash)+'</td>'+

      '<td class="r">'+(x.tag&&x.up? (x.up/x.tag*100).toFixed(0)+'%' :dash)+'</td></tr>';
  }).join('');
  var foot='<td colspan="3">합계 · '+n0(T.n)+'품번 (실적 있는 품번 '+n0(T.hit)+')</td>'+
    '<td class="r">'+n0(T.in_)+'</td>'+
    '<td class="r">'+n0(T.q)+'</td><td class="r">'+n0(T.sq)+'</td>'+
    '<td>'+ratebar(T.q?T.sq/T.q*100:0)+'</td><td class="r">'+n0(T.stk)+'</td>'+
    '<td class="r">'+n0(T.sal)+'</td><td class="r">'+n0(T.sa)+'</td>'+
    '<td>'+ratebar(T.sal?T.sa/T.sal*100:0)+'</td><td></td><td></td><td></td>';
  /* 열 폭 - 입고·재고가 끼어들었다 */

  var mo = AP.mo || '누적';
  var kpi=[['소진율',(T.q?(T.sq/T.q*100).toFixed(1):'0')+'%',n0(T.sq)+' / '+n0(T.q)+'장'],
           ['매출 달성률',(T.sal?(T.sa/T.sal*100).toFixed(1):'0')+'%',won(T.sa)+' / '+won(T.sal)],
           ['실현 마진',T.sa&&T.sc?((T.sa/1.1-T.sc)/(T.sa/1.1)*100).toFixed(1)+'%':'-','공급가 기준'],
           ['무상출고',n0(T.fq)+'장','마케팅·샘플·폐기']];

  return '<div class="panel"><div class="ph"><h2>예상 vs 실적</h2>'+bl()+
    '<select id="actmo" style="width:auto;margin-left:6px">'+
      '<option value=""'+(AP.mo?'':' selected')+'>누적 전체</option>'+

      [['rate','소진율 낮은 순'],['rated','소진율 높은 순'],['sales','실매출 큰 순'],['gap','예상-실적 차 큰 순']]

    '<div class="pb"><div class="kpis2">'+kpi.map(function(x){
      return '<div class="kpi"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+

      '조인은 품번으로만 합니다 - 색상 표기가 브랜드마다 달라 맞출 수 없습니다.<br>'+
      stkNote()+'</div></div>';
}

/** 재고가 어느 시점·어느 기간의 숫자인지 화면에 그대로 적는다. 비면 비었다고 적는다. */
function stkNote(){
  if(STKERR) return '<b style="color:var(--warn)">재고를 못 읽었습니다</b> - '+esc(STKERR);
  if(!STKSRC.length) return '재고는 아직 연동 전입니다.';
  var miss=STKSRC.filter(function(s){ return !s.asof && !s.f; });
  return '<b>재고·입고</b>는 <b>판매현황_ERPERP</b> 시트에서 옵니다 - '+
    STKSRC.map(function(s){
      return esc(s.b)+(s.n!=null?' '+n0(s.n)+'품번':'')+
        (s.asof? ' (재고 '+esc(s.asof)+' 기준'+(s.f?' · 입출고 '+esc(s.f)+'~'+esc(s.to||''):'')+')' : '');
    }).join(' · ')+
    (miss.length? ' <b style="color:var(--warn)">— '+esc(miss.map(function(s){return s.b;}).join('·'))+
      ' 은 기간이 안 적혀 있습니다. 그 시트 [0.추출기준] 탭을 채워 주세요</b>':'')+
    '. 여기 없는 브랜드는 <b>·</b> 로 표시됩니다(0 이 아니라 미연동).';
}

/** 품번 하나의 원본 판매행. 스냅샷에 못 싣는 크기라 누를 때 서버에서 가져온다. */
function actDrill(pn){
  modal('<div class="mhead"><b>'+esc(pn)+'</b> 원본 판매행</div>'+
        '<div class="pb" style="color:var(--mut)">불러오는 중…</div>','1180px');
  google.script.run
    .withSuccessHandler(function(r){
      if(!r||!r.ok){ modal('<div class="mhead">원본을 못 읽었습니다</div><div class="pb">'+
        esc((r&&r.msg)||'')+'</div>'); return; }
      var rs=r.rows||[];
      if(!rs.length){
        modal('<div class="mhead"><b>'+esc(pn)+'</b></div><div class="pb">'+
          '6.실적_원본 에 이 품번의 행이 없습니다.<br><span style="color:var(--mut)">'+
          '원본 탭은 최근 2개월만 들고 있습니다 - 보유 '+esc((r.has||[]).join(' · '))+
          '. 그보다 오래된 달은 집계로만 보입니다.</span></div>'); return; }
      var q=0,a=0,av=0,c=0,st={};
      rs.forEach(function(x){ q+=x.q; a+=x.a; av+=x.av; c+=x.c; st[x.st]=(st[x.st]||0)+x.q; });
      var LIM=300, sh=rs.slice(0,LIM);
      var head='<th class="nos">판매일</th><th class="nos">매장</th><th class="nos">구분</th>'+
        '<th class="nos">색상</th><th class="nos">사이즈</th><th class="nos r">수량</th>'+
        '<th class="nos r">TAG가</th><th class="nos r">실판매</th><th class="nos r">원가</th>';
      var body=sh.map(function(x){
        return '<tr'+(x.q<0?' class="retrow"':'')+'><td>'+esc(x.d)+'</td>'+
          '<td style="max-width:190px;overflow:hidden;text-overflow:ellipsis">'+esc(x.st)+'</td>'+
          '<td>'+esc(x.w||'')+(x.k&&x.k!=='정상'?' <span class="rulechip">'+esc(x.k)+'</span>':'')+'</td>'+
          '<td>'+esc(x.cl)+'</td><td>'+esc(x.sz)+'</td>'+
          '<td class="r">'+n0(x.q)+'</td><td class="r">'+n0(x.tag)+'</td>'+
          '<td class="r">'+n0(x.a)+'</td><td class="r">'+n0(x.c)+'</td></tr>';
      }).join('');
      var tops=Object.keys(st).sort(function(x,y){ return st[y]-st[x]; }).slice(0,5);
      modal('<div class="mhead"><b>'+esc(pn)+'</b> · '+esc(sh[0].nm||'')+'</div>'+
        '<div class="pb" style="padding-bottom:4px"><p>'+n0(rs.length)+'행 · '+n0(q)+'장 · <b>'+
          n0(a)+'원</b> (VAT 포함) · 공급가 '+n0(av)+' · 원가 '+n0(c)+'</p>'+
        '<p style="color:var(--mut);font-size:11.5px">상위 매장 - '+
          tops.map(function(t){ return esc(t)+' '+n0(st[t]); }).join(' · ')+'</p></div>'+
        tbl(head,body,'')+
        (rs.length>LIM? '<div class="pb" style="color:var(--mut)">앞 '+LIM+'행만 표시 - 전체 '+n0(rs.length)+'행</div>':''),
        '1180px');
    })
    .withFailureHandler(function(e){ modal('<div class="mhead">실패</div><div class="pb">'+
      esc(e&&e.message||e)+'</div>'); })
    .apiSalesRows(pn, AP.mo||'');
}


function salesPanel(rs){
  var rows=rs.filter(hasSale);
  if(!rows.length) return '';
  var cell={}, mon={}, br={}, cnt={};
  rows.forEach(function(r){
    var m=rmOf(r), b=r.b, x=saleOf(r);
    cell[b+''+m]=(cell[b+''+m]||0)+x;
    mon[m]=(mon[m]||0)+x; br[b]=(br[b]||0)+x; cnt[m]=(cnt[m]||0)+1;
  });
  var ms=Object.keys(mon).sort(function(a,b){
    if((a==='발매일없음')!==(b==='발매일없음')) return a==='발매일없음'?1:-1;
    return a<b?-1:1; });
  var bs=Object.keys(br).sort(function(a,b){ return br[b]-br[a]; });
  var tot=bs.reduce(function(s,b){ return s+br[b]; },0);
  var unknown=mon['발매일없음']||0;

  var head='<th class="nos">브랜드</th>'+ms.map(function(m){
    return '<th class="nos r">'+esc(m)+'</th>'; }).join('')+'<th class="nos r">합계</th>';
  var body=bs.map(function(b){
    return '<tr><td>'+esc(b)+'</td>'+ms.map(function(m){
      var x=cell[b+''+m]||0;
      return '<td class="r">'+(x?n0(x):'<span style="color:var(--faint)">–</span>')+'</td>';
    }).join('')+'<td class="r"><b>'+n0(br[b])+'</b></td></tr>';
  }).join('');
  var foot='<td>합계</td>'+ms.map(function(m){
    return '<td class="r">'+n0(mon[m])+'</td>'; }).join('')+'<td class="r">'+n0(tot)+'</td>';

  return '<div class="panel"><div class="ph"><h2>발매월 × 브랜드</h2>'+bl()+
    '<span class="sub">'+n0(rows.length)+'행 · 예상매출 VAT 포함</span></div>'+
    (unknown? '<div class="paywarn">발매일이 없어 시점을 못 잡은 금액 <b>'+won(unknown)+'</b>'+
      ' ('+(tot? Math.round(unknown/tot*100):0)+'%) — 원본에 발매일 열이 없는 브랜드입니다.'+
      ' 발매일 기준을 정하면 월로 흩어집니다</div>':'')+
    tbl(head,body,foot,['150px'].concat(ms.map(function(){ return '132px'; })).concat(['140px']))+
    '<div class="pb" style="padding-top:10px;font-size:11px;color:var(--mut)">'+
      '기본은 시트가 계산한 값 그대로입니다 — 대장과 같은 숫자입니다. '+
      '화면에서 고친 행만 수량 × 확정판매가로 다시 냅니다.</div></div>';
}

/* 매출 요약 — 매입과 나란히 두면 마진이 눈에 들어온다. 공급가액은 VAT 제외라 ÷1.1 이다. */
function salesSummary(rs){
  var sal=0, cost=0, q=0, n=0;
  rs.forEach(function(r){
    var x=saleOf(r);
    if(!x) return;
    sal+=x; cost+=amtOf(r); q+=qtyOf(r); n++;
  });
  if(!n) return '';
  var sup=sal/1.1, mar=sup-cost;
  var k=[['예상매출(VAT+)',won(sal),n0(n)+'행 · '+n0(q)+'장'],
         ['공급가액(VAT−)',won(sup),'예상매출 ÷ 1.1'],
         ['매입원가액',won(cost),'VAT 별도'],
         ['마진',won(mar),sup? (mar/sup*100).toFixed(1)+'%':'—']];
  return '<div class="panel"><div class="ph"><h2>매출 요약</h2>'+bl()+
    '<span class="sub">판매가가 잡힌 행만</span></div>'+
    '<div class="pb"><div class="kpis2">'+k.map(function(x){
      return '<div class="kpi"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+
             '</div><div class="s">'+esc(x[2])+'</div></div>'; }).join('')+'</div></div></div>';
}

/* 대시보드는 둘로 나눠 둔다. 매입은 "언제 얼마가 나가나"(자금계획), 매출은 "발주한 게 팔리나".
   묻는 때도 보는 사람도 달라서 한 화면에 쌓으면 둘 다 안 읽힌다.
   화면에서 내린 표(발주처×납기월·납기월별 자금 소요·납기월 상세·브랜드/원산지/발주처 순위·
   매출 요약·발매월×브랜드)는 함수를 지우지 않고 남겨 뒀다 — 다시 부르기만 하면 돌아온다. */
function drawBuy(rs){
  document.getElementById('vbuy').innerHTML = payPanel(rs);
  wirePay();
}
function drawSell(rs){
  /* 위가 발매일 단위(차수가 얼마나 나갔나), 아래가 품번 단위(뭐가 안 팔리나) */
  document.getElementById('vsell').innerHTML = relPanel(rs) + actPanel(rs);
  wireAct();
}

/** 발주처 × 지급월 표의 조작 전부. */
function wirePay(){
  var pg=document.getElementById('paygrain');
  if(pg) pg.onchange=function(){ PAY.grain=pg.value; PAYOPEN={}; draw(); };
  [['payv-tbl','tbl'],['payv-col','col'],['payv-bar','bar']].forEach(function(x){
    var el=document.getElementById(x[0]);
    if(el) el.onclick=function(){ PAY.view=x[1]; draw(); };
  });
  [['vat-off',false],['vat-on',true]].forEach(function(x){
    var el=document.getElementById(x[0]);
    if(el) el.onclick=function(){ VATIN=x[1]; draw(); };
  });
  var pr=document.getElementById('payrules');
  if(pr) pr.onclick=payListOpen;
  /* 창 크기 · 창 이동 — 머리글의 '이전/이후' 칸도 같은 동작을 한다 */
  Array.prototype.forEach.call(document.querySelectorAll('[data-win]'),function(b){
    b.onclick=function(){ PAY.win=+b.getAttribute('data-win'); PAY.start=0; draw(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-step]'),function(b){
    b.onclick=function(){ PAY.start=Math.max(0,PAY.start+ +b.getAttribute('data-step')); draw(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('th[data-go]'),function(th){
    th.onclick=function(){
      var d=+th.getAttribute('data-go');
      PAY.start=Math.max(0,PAY.start + d*(PAY.win||1));
      draw();
    };
  });
  var pa=document.getElementById('payall');
  if(pa) pa.onclick=function(){
    /* 하나라도 접혀 있으면 전부 펼치고, 전부 펼쳐져 있으면 전부 접는다 */
    var vs=paySplitRows(rows()).vs;
    var allOpen=vs.length && vs.every(function(v){ return PAYOPEN[v]; });
    PAYOPEN={};
    if(!allOpen) vs.forEach(function(v){ PAYOPEN[v]=true; });
    draw();
  };
  /* 펴고 접는 것만으로 전체를 다시 그린다 — 상태가 한 군데(PAYOPEN)에만 있어 어긋날 일이 없다 */
  Array.prototype.forEach.call(document.querySelectorAll('tr.payv'),function(tr){
    tr.onclick=function(){ var v=tr.getAttribute('data-payv'); PAYOPEN[v]=!PAYOPEN[v]; draw(); };
  });
  /* 납기액 좌클릭 = 대장 펼쳐보기. 부모 tr 의 펼치기와 겹치므로 전파를 멈춘다. */
  Array.prototype.forEach.call(document.querySelectorAll('td.drill'),function(td){
    td.onclick=function(e){
      e.stopPropagation();
      payDrill(td.getAttribute('data-dv'), td.getAttribute('data-dm')||'');
    };
  });
  /* 우클릭 = 그 발주처에 예외. 대상이 클릭으로 정해지니 이름 오타가 날 수 없다. */
  Array.prototype.forEach.call(document.querySelectorAll('[data-payv]'),function(el){
    el.oncontextmenu=function(e){ payCtxOpen(e,el.getAttribute('data-payv')); };
  });
}

/** 예상 vs 실적 표의 조작 전부. */
function wireAct(){
  var am=document.getElementById('actmo');
  if(am) am.onchange=function(){ AP.mo=am.value; AP.n=60; draw(); };
  var as=document.getElementById('actsort');
  if(as) as.onchange=function(){ AP.sort=as.value; draw(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-aonly]'),function(b){
    b.onclick=function(){ AP.only=b.getAttribute('data-aonly'); AP.n=60; draw(); };
  });
  var amore=document.getElementById('actmore');

/* ---------- ledger ---------- */
var SORT={k:'amt',d:-1};
var COLS=[
  {k:'b',t:'브랜드',g:function(r){return r.b;}},
  {k:'pn',t:'품번',g:function(r){return r.pn;}},
  {k:'nm',t:'품명',g:function(r){return r.nm;},w:1},
  {k:'cl',t:'색상',g:function(r){return r.cl;}},
  {k:'v',t:'발주처',g:vendOf,ed:'text'},
  {k:'og',t:'원산지',g:function(r){return r.og;}},
  {k:'bt',t:'차수',g:batOf,ed:'text'},
  {k:'dd',t:'납기일',g:dueOf,ed:'date'},
  {k:'q',t:'발주량',g:qtyOf,r:1},
  {k:'c',t:'사전원가',g:costOf,r:1,ed:'num'},
  {k:'amt',t:'매입예정액',g:amtOf,r:1},
  {k:'ct',t:'원가구분',g:ctOf}
];
/* 대장 — 열별 필터 + 표시 행수 상한.
   1,000행 넘게 한 번에 그리면 브라우저가 버벅인다. 기본 100행만 그리고,
   합계·건수는 상한과 무관하게 필터 전체를 기준으로 낸다(잘라 보는 것 때문에 총액이 바뀌면 안 된다). */
var LED_LIMIT=100, LED_F={};
function ledFilter(rs){
  var ks=Object.keys(LED_F).filter(function(k){ return String(LED_F[k]||'').trim()!==''; });
  if(!ks.length) return rs;
  return rs.filter(function(r){
    return ks.every(function(k){
      var c=COLS.filter(function(x){return x.k===k;})[0]; if(!c) return true;
      var v=c.g(r);
      return String(c.r?n0(v):(v==null?'':v)).toLowerCase()
        .indexOf(String(LED_F[k]).trim().toLowerCase())>=0;
    });
  });
}
function drawLed(all){
  var rs=ledFilter(all);
  var col=COLS.filter(function(c){return c.k===SORT.k;})[0]||COLS[10];
  var s=rs.slice().sort(function(a,b){ var x=col.g(a),y=col.g(b);
    if(typeof x==='number'&&typeof y==='number') return (x-y)*SORT.d;
    return String(x).localeCompare(String(y),'ko')*SORT.d; });
  var shown=(LED_LIMIT>0?s.slice(0,LED_LIMIT):s);
  var head=COLS.map(function(c){ return '<th class="'+(c.r?'r':'')+'" data-k="'+c.k+'">'+c.t+
    (SORT.k===c.k?'<span class="ar">'+(SORT.d>0?'▲':'▼')+'</span>':'')+'</th>'; }).join('')+
    '</tr><tr class="frow">'+COLS.map(function(c){
      return '<th class="nos"><input type="text" class="lf" data-k="'+c.k+'" value="'+
        esc(LED_F[c.k]||'')+'" placeholder="'+esc(c.t)+'"></th>'; }).join('');
  var body=shown.map(function(r){ return '<tr data-id="'+esc(r.id)+'"'+(isEd(r)?' class="ed"':'')+'>'+
    COLS.map(function(c){ var v=c.g(r), e=EDITS[r.id], dirty=e&&c.ed&&e[c.k]!==undefined;
      return '<td class="'+(c.r?'r ':'')+(c.ed?'cell-ed ':'')+(dirty?'dirty':'')+'" data-c="'+c.k+'"'+
        (c.w?' style="max-width:210px;overflow:hidden;text-overflow:ellipsis"':'')+'>'+
        (c.r?n0(v):esc(v||''))+'</td>'; }).join('')+'</tr>'; }).join('');
  var tq=rs.reduce(function(a,r){return a+qtyOf(r);},0), ta=rs.reduce(function(a,r){return a+amtOf(r);},0);
  var nf=Object.keys(LED_F).filter(function(k){return String(LED_F[k]||'').trim()!=='';}).length;
  var sel='<select id="ledlim" style="width:auto;margin-left:10px">'+
    [100,300,1000,0].map(function(v){ return '<option value="'+v+'"'+(LED_LIMIT===v?' selected':'')+'>'+
      (v?v+'행':'전체')+'</option>'; }).join('')+'</select>';
  document.getElementById('vled').innerHTML='<div class="panel ledger"><div class="ph"><h2>매입 약정 대장</h2>'+bl()+
    sel+'<button class="btn gh" id="ledclr" style="margin-left:6px">필터 해제</button>'+
    '<span class="sub">'+n0(rs.length)+'행 중 '+n0(shown.length)+'행 표시'+
    (nf?' · 열 필터 '+nf+'개':'')+(rs.length!==all.length?' · 전체 '+n0(all.length)+'행':'')+
    ' — 합계는 잘라낸 것과 무관하게 '+n0(rs.length)+'행 기준</span></div>'+
    tbl(head,body,'<td colspan="8">'+n0(rs.length)+'행</td><td class="r">'+n0(tq)+'</td><td></td><td class="r">'+
      n0(ta)+'</td><td></td>')+'</div>';
  var lim=document.getElementById('ledlim');
  if(lim) lim.onchange=function(){ LED_LIMIT=Number(lim.value); draw(); };
  var clr=document.getElementById('ledclr');
  if(clr) clr.onclick=function(){ LED_F={}; draw(); };
  Array.prototype.forEach.call(document.querySelectorAll('#vled input.lf'),function(inp){
    inp.onclick=function(e){ e.stopPropagation(); };
    inp.onchange=function(){ LED_F[inp.getAttribute('data-k')]=inp.value; draw(); };
    inp.onkeydown=function(e){ if(e.key==='Enter'){ LED_F[inp.getAttribute('data-k')]=inp.value; draw(); } };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#vled thead th[data-k]'),function(h){
    h.onclick=function(){ var k=h.getAttribute('data-k'); if(!k) return;
      if(SORT.k===k) SORT.d*=-1; else { SORT.k=k; SORT.d=-1; } draw(); }; });
  var tb=document.querySelector('#vled tbody');
  if(tb) tb.onclick=function(e){
    var td=e.target.closest('td'), tr=e.target.closest('tr'); if(!tr) return;
    var id=tr.getAttribute('data-id'), ck=td&&td.getAttribute('data-c');
    var c=COLS.filter(function(x){return x.k===ck;})[0];
    if(c&&c.ed) inlineEdit(td,id,c); else openDrawer(id);
  };
}
function inlineEdit(td,id,col){
  if(td.querySelector('input')) return;
  var r=byId[id], cur=col.g(r), old=td.innerHTML;
  var inp=document.createElement('input');
  inp.className='inline'+(col.ed==='num'?'':' txt');
  inp.type=col.ed==='date'?'date':(col.ed==='num'?'number':'text');
  inp.value=col.ed==='num'?cur:(cur||'');
  td.textContent=''; td.appendChild(inp); inp.focus(); inp.select();
  var done=false;
  function fin(save){
    if(done) return; done=true;
    var v=inp.value;
    if(save){
      if(col.ed==='num'){ v=Number(v); if(!isFinite(v)) v=cur; }
      if(String(v)!==String(cur)){ setEdit(id,col.k,v); return; }
    }
    td.innerHTML=old;
  }
  inp.onblur=function(){ fin(true); };
  inp.onkeydown=function(e){ if(e.key==='Enter') inp.blur();
    else if(e.key==='Escape'){ fin(false); } };
}

/* 오래 걸리는 작업 동안 화면을 잠근다 — 두 번 눌러 두 번 만드는 사고를 막는다 */
var busyTimer=null,busyT0=0,busyNote='';
function busyOn(title,note,withBar){
  busyT0=Date.now(); busyNote=note;
  document.getElementById('busyt').textContent=title;
  document.getElementById('busys').textContent=note;
  document.getElementById('busybar').hidden=!withBar;
  document.getElementById('busypct').hidden=!withBar;
  document.getElementById('busyspin').hidden=!!withBar;
  if(withBar) busyPct(0,note);
  document.getElementById('busy').classList.add('on');
  clearInterval(busyTimer);
  busyTimer=setInterval(function(){
    document.getElementById('busys').textContent=
      busyNote+'  ·  '+Math.round((Date.now()-busyT0)/1000)+'초';
  },1000);
}
/* 서버가 알려준 실제 진행률. 못 받으면 경과 초만 계속 돈다 — 가짜 퍼센트는 안 만든다. */
function busyPct(p,note){
  var el=document.getElementById('busypct');
  el.hidden=false; el.textContent=Math.max(0,Math.min(100,Math.round(p)))+'%';
  document.getElementById('busybar').hidden=false;
  document.querySelector('#busybar i').style.width=Math.max(0,Math.min(100,p))+'%';
  if(note) busyNote=note;
}
function busyNoPct(){
  document.getElementById('busypct').hidden=true;
  document.getElementById('busybar').hidden=true;
  document.getElementById('busyspin').hidden=false;
}
function busyOff(){ clearInterval(busyTimer); document.getElementById('busy').classList.remove('on'); }

/* base64 를 브라우저가 그대로 저장하게 한다 — 드라이브 링크를 거치지 않는다 */
function saveB64(b64,name){
  try{
    var bin=atob(b64), arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    var blob=new Blob([arr],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },3000);
    return true;
  }catch(e){ return false; }
}

/* ERP·BI 두 내보내기가 흐름이 같다 — 한 함수로 묶는다 */
function runExport(opt){
  var rs=rows(); if(!rs.length){ toast('내보낼 행이 없습니다'); return; }
  var payload=rs.map(function(r){ return { pn:r.pn, bt:batOf(r), nm:r.nm, b:r.b, mj:r.mj, sb:r.sb,
    og:r.og, v:vendOf(r), od:r.od, dd:dueOf(r), tp:r.tp, c:costOf(r), cn:r.cl,
    cl:r.cl, cc:r.cc, wy:r.wy, ln:r.ln,
    sizes:sizesOf(r).filter(function(x){ return x.q; }) }; });
  var n=opt.perSize? payload.reduce(function(a,r){ return a+r.sizes.length; },0) : payload.length;
  var btn=document.getElementById(opt.btn); btn.disabled=true;
  var tok='x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  busyOn(opt.title, n0(n)+'행 · '+opt.cols+'열 변환', true);
  var tries=0, got=false;
  var poll=setInterval(function(){
    tries++;
    if(!got&&tries>3) busyNoPct();
    google.script.run.withSuccessHandler(function(pr){
      if(pr&&typeof pr.p==='number'){ got=true; busyPct(pr.p,pr.msg||''); }
    }).withFailureHandler(function(){}).apiProgress(tok);
  },1200);
  var runner=google.script.run
    .withSuccessHandler(function(res){
      clearInterval(poll); busyPct(100,'완료'); busyOff(); btn.disabled=false;
      if(!res||!res.ok){ toast((res&&res.msg)||'내보내기 실패'); return; }
      var saved=res.b64? saveB64(res.b64,res.name) : false;
      var warn='';
      if(res.unplaced) warn='<br><span style="color:var(--warn)">템플릿에 열이 없어 사이즈별로 못 나눈 수량 '+
        n0(res.unplacedQty)+'장 ('+res.unplaced+'건) — TTL 에는 포함됐고 <b>미배치사이즈</b> 시트에 목록이 있습니다</span>';
      modal('<h3>'+(saved?'내려받는 중입니다':opt.title.replace(' 만드는 중','')+' 완료')+'</h3>'+
        '<p><b>'+esc(res.name)+'</b><br>'+n0(res.n)+'행 · '+opt.cols+'열<br>'+
        '<span style="color:var(--mut)">내 드라이브 › 라인시트 ERP 내보내기</span>'+
        (saved?'':'<br><span style="color:var(--warn)">브라우저가 저장을 막았습니다 — 아래에서 여세요</span>')+
        warn+'</p><div class="mrow">'+
        '<button class="btn gh" id="mf">폴더 열기</button>'+
        '<button class="btn gh" id="mv">파일 열기</button>'+
        '<button class="btn" id="mc">닫기</button></div>');
      document.getElementById('mf').onclick=function(){ window.open(res.folder,'_blank'); };
      document.getElementById('mv').onclick=function(){ window.open(res.view,'_blank'); };
      document.getElementById('mc').onclick=closeModal;
    })
    .withFailureHandler(function(err){ clearInterval(poll); busyOff(); btn.disabled=false;
      toast('내보내기 실패 — '+(err&&err.message||err)); });
  runner[opt.api](payload,tok);
}

  document.getElementById('mc').onclick=closeModal;
  document.getElementById('mo').onclick=function(){ closeModal(); setStat('c-mut','되돌리는 중…');
    google.script.run.withSuccessHandler(function(){ EDITS={}; draw(); setStat('c-ok','저장됨',ME);
      toast('되돌렸습니다'); })
      .withFailureHandler(function(e){ setStat('c-crit','실패'); toast('실패 — '+(e&&e.message||e)); })
      .apiResetEdits(); };
};
document.getElementById('refresh').onclick=function(){
  var b=this; b.disabled=true;
  busyOn('시트에서 다시 읽는 중','중간관리시트 변환 탭 10개 · 스냅샷 재생성');
  google.script.run
    .withSuccessHandler(function(r){
      busyOff(); b.disabled=false;
      if(!r||!r.ok){ toast((r&&r.msg)||'갱신 실패'); return; }
      applyPayload(expand(JSON.parse(r.data)),r.edits);
      PERF={server:r.ms,parse:0,render:0,total:r.ms,built:r.built,fresh:true};
      draw(); toast(BASE.length+'행 다시 읽음 · '+r.ms+'ms');
    })
    .withFailureHandler(function(e){ busyOff(); b.disabled=false;
      toast('갱신 실패 — '+(e&&e.message||e)); })
    .apiRebuild();
};

/* ---------- 유효성 ----------
   변환 탭 A:C 가 행마다 등급·확인 필요 항목을 적어둔다.
   여기서는 그걸 항목별로 묶어 "무엇을 몇 건 고쳐야 하는가" 로 보여주고,
   그 아래에 실제 행을 깐다. 좌측 필터(브랜드·발주처 등)가 그대로 걸린다. */
function drawVal(rs){
  var bad=rs.filter(function(r){ return r.vm; });
  var items={};
  bad.forEach(function(r){
    String(r.vm).split(' / ').forEach(function(m){
      m=String(m).trim(); if(!m) return;
      var g=m.indexOf('[A]')===0?'A':(m.indexOf('[B]')===0?'B':'B');
      var label=m.replace(/^\[[AB]\]\s*/,'');
      /* 뒤에 구체값이 붙는 메시지(":" · "(" 뒤)는 앞부분으로 묶어야 같은 항목으로 센다 */
      var t=label.split(':')[0].split('(')[0].split('→')[0].trim();
      var k=g+'|'+t;
      if(!items[k]) items[k]={g:g,t:t,n:0,pn:{}};
      items[k].n++; items[k].pn[r.pn]=1;
    });
  });
  var list=Object.keys(items).map(function(k){ var o=items[k];
    o.pns=Object.keys(o.pn); return o; })
    .sort(function(a,b){ return (a.g===b.g)?(b.n-a.n):(a.g<b.g?-1:1); });

  var nA=bad.filter(function(r){return r.vg==='A';}).length;
  var nB=bad.filter(function(r){return r.vg==='B';}).length;

  var ih=list.map(function(o){
    return '<tr><td><span class="chip '+(o.g==='A'?'c-crit':'c-warn')+'">'+o.g+'</span></td>'+
      '<td>'+esc(o.t)+'</td><td class="r">'+n0(o.n)+'</td><td class="r">'+n0(o.pns.length)+'</td>'+
      '<td style="max-width:420px;overflow:hidden;text-overflow:ellipsis" title="'+esc(o.pns.join(', '))+'">'+
      esc(o.pns.slice(0,8).join(', '))+(o.pns.length>8?' 외 '+(o.pns.length-8)+'개':'')+'</td></tr>';
  }).join('') || '<tr><td colspan="5">확인 필요 항목 없음</td></tr>';

  var rh=bad.slice().sort(function(a,b){ return (a.vg===b.vg)?0:(a.vg==='A'?-1:1); })
    .map(function(r){
      return '<tr data-id="'+esc(r.id)+'"><td><span class="chip '+(r.vg==='A'?'c-crit':'c-warn')+'">'+
        esc(r.vg)+'</span></td><td>'+esc(r.b)+'</td><td>'+esc(r.pn)+'</td><td>'+esc(r.cl)+'</td>'+
        '<td>'+esc(r.nm)+'</td><td>'+esc(r.vm)+'</td></tr>';
    }).join('') || '<tr><td colspan="6">확인 필요 행 없음</td></tr>';

  document.getElementById('vval').innerHTML=
    checkPanel(rs)+
    '<div class="panel"><div class="ph"><h2>확인 필요 항목</h2>'+bl()+
    '<span class="sub">확인 필요 '+n0(bad.length)+'행 / 필터 대상 '+n0(rs.length)+'행'+
    ' · <b>[A] 반드시 수정 '+n0(nA)+'행</b> · [B] 확인 권장 '+n0(nB)+'행'+
    ' — [A] 는 집계가 틀어지는 결함, [B] 는 값이 추정치가 되는 건</span></div>'+
    '<table><thead><tr><th>등급</th><th>점검 항목</th><th class="r">건수</th><th class="r">품번수</th>'+
    '<th>해당 품번</th></tr></thead><tbody>'+ih+'</tbody></table></div>'+
    '<div class="panel" style="margin-top:12px"><div class="ph"><h2>행 목록</h2>'+bl()+
    '<span class="sub">행을 누르면 상세가 열립니다</span></div>'+
    '<table><thead><tr><th>등급</th><th>브랜드</th><th>품번</th><th>색상</th><th>품명</th>'+
    '<th>확인 필요 항목</th></tr></thead><tbody>'+rh+'</tbody></table></div>';

  var tb=document.querySelector('#vval tbody');
  var tbs=document.querySelectorAll('#vval tbody');
  if(tbs.length>1) tbs[1].onclick=function(e){
    var tr=e.target.closest('tr'); if(!tr) return;
    var id=tr.getAttribute('data-id'); if(id) openDrawer(id);
  };
}

/* ---------- views ---------- */
var VIEW='buy';
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
  t.onclick=function(){ VIEW=t.getAttribute('data-v');
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){
      x.setAttribute('aria-selected',String(x===t)); });
    draw(); };
});
function draw(){
  var rs=rows();
  drawKpi(rs);
  document.getElementById('vbuy').hidden=(VIEW!=='buy');
  document.getElementById('vsell').hidden=(VIEW!=='sell');
  document.getElementById('vled').hidden=(VIEW!=='led');
  document.getElementById('vval').hidden=(VIEW!=='val');
  if(VIEW==='buy') drawBuy(rs);
  else if(VIEW==='sell') drawSell(rs);
  else if(VIEW==='led') drawLed(rs);
  else drawVal(rs);
  drawAge(); drawErr();
  var ne=Object.keys(EDITS).length;
  document.getElementById('foot').innerHTML=
    '원천 — 라인시트 중간관리시트 · 변환탭 10개(BETA·GAMMA·OH·ALPHA·OD3·UV2·COSTCO) 직결 · 원본은 매시 정각 자동 동기화 · 읽은 시각 '+esc(BUILT)+'<br>'+
    BASE.length+'행 / 사이즈 '+SZ.length+'행 · 원가 기준 VAT 별도 · 결제조건 미반영'+
    (ne?' · 수정 '+ne+'행 (_편집 시트에 기록)':'')+
    (ORPH&&ORPH.n?'<br><span style="color:var(--crit)">⚠ 품번이 비어 집계에서 빠진 사이즈 '+ORPH.n+
      '행 · '+n0(ORPH.q)+'장 — 원본 '+esc(ORPH.keys.join(', '))+' 행의 품번을 채워야 합니다</span>':'')+
    (PERF?'<br>로딩 '+PERF.total+'ms — 서버 '+PERF.server+' · 해석 '+PERF.parse+' · 렌더 '+PERF.render+
      ' (스냅샷 '+esc(PERF.built||'—')+(PERF.fresh?' · 즉석 생성':'')+')':'');
}

/* 스냅샷이 얼마나 묵었는지 항상 보이게 한다 — 자동 갱신이 멈춰도 눈치챌 수 있게 */
function drawAge(){
  var el=document.getElementById('age'); if(!el||!BUILT) return;
  var m=Math.round((Date.now()-new Date(String(BUILT).replace(/-/g,'/')).getTime())/60000);
  if(!isFinite(m)) return;
  var txt = m<1?'방금' : m<60?(m+'분 전') : (Math.floor(m/60)+'시간 '+(m%60)+'분 전');
  el.textContent='스냅샷 '+txt;
  el.className='chip '+(m>180?'c-crit':(m>60?'c-warn':'c-mut'));
  el.title='마지막 갱신 '+BUILT+(m>60?' — 우측 [새로고침]으로 갱신하세요':'');
}

/* 변환 탭 수식이 깨지면 집계를 믿을 수 없다. 조용히 넘기지 않고 빨간 배지로 세운다. */
function drawErr(){
  var el=document.getElementById('err'); if(!el) return;
  if(ERRS&&ERRS.n){
    el.hidden=false;
    el.textContent='수식 오류 '+ERRS.n;
    el.title='변환 탭에 #REF!·#VALUE! 가 '+ERRS.n+'칸 있습니다 ('+((ERRS.tabs||[]).join(' '))+
      ') — 집계 숫자를 믿을 수 없습니다';
  } else el.hidden=true;
}
setInterval(function(){ try{ drawAge(); }catch(e){} },60000);

/* ---------- boot ---------- */
/* 스냅샷은 열 이름을 반복하지 않고 반복값을 사전으로 뽑아 두었다 — 여기서 되돌린다.
   자리 순서는 Snapshot.gs 의 ROWF 와 반드시 같아야 한다. */
function expand(p){
  var d=p.dict;
  var base=p.rows.map(function(r){
    return { id:r[0], b:d.b[r[1]], pn:r[2], nm:r[3], cl:r[4], v:d.v[r[5]], og:d.og[r[6]],
             bt:r[7], od:r[8], dd:r[9], q:r[10], c:r[11], ct:d.ct[r[12]], mj:d.mj[r[13]],
             sb:r[14], tp:r[15], cc:r[16]||'', wy:(d.wy&&d.wy[r[17]])||'',
             ln:(d.ln&&d.ln[r[18]])||'',
             vg:r[19]||'', vm:r[20]||'', vn:r[21]||0,
             rd:r[22]||'', sp:r[23]||0, sa:r[24]||0 }; });
  var sizes=[];
  p.sz.forEach(function(s){ var b=base[s[0]]; if(b) sizes.push({id:b.id,s:d.sz[s[1]],q:s[2]}); });
  return { base:base, sizes:sizes, orphan:p.orphan, errs:p.errs, sewon:p.sewon,
           pay:p.pay, perf:p.perf, stk:p.stk, built:p.built };
}
function applyPayload(d,edits){
  BASE=d.base; SZ=d.sizes; SEWON=d.sewon; ORPH=d.orphan; BUILT=d.built; ERRS=d.errs;
  PAYRULES=(d.pay&&d.pay.rows)||[]; PAYERR=(d.pay&&d.pay.err)||'';
  ACT=(d.perf&&d.perf.rows)||[]; ACTMOS=(d.perf&&d.perf.months)||[];
  ACTERR=(d.perf&&d.perf.err)||'';
  STK=(d.stk&&d.stk.rows)||[]; STKSRC=(d.stk&&d.stk.srcs)||[]; STKERR=(d.stk&&d.stk.err)||'';
  EDITS=edits||{};
  byId={}; BASE.forEach(function(r){ byId[r.id]=r; });
  szBy={}; SZ.forEach(function(s){ (szBy[s.id]=szBy[s.id]||[]).push({s:s.s,q:s.q}); });
  buildFilters(); draw();
}
/* 화면이 iframe 안이라 브라우저 콘솔을 밖에서 볼 수 없다.
   그래서 터진 것도 서버(_성능 시트)에 남긴다 — 안 남으면 아예 실행이 안 된 것이다. */
function report(kind,note,extra){
  try{ google.script.run.withFailureHandler(function(){}).apiPerf(
    Object.assign({kind:kind,note:String(note).slice(0,300)},extra||{})); }catch(e){}
}
window.onerror=function(m,src,ln,col){ report('jserror',m+' @'+ln+':'+col); };
window.addEventListener('unhandledrejection',function(e){
  report('jsreject',(e&&e.reason&&e.reason.message)||String(e&&e.reason)); });

(function boot(){
  var t0=performance.now();
  report('boot-start','스크립트 진입');
  try{
    var P=JSON.parse(document.getElementById('DATA').textContent);
    var E=JSON.parse(document.getElementById('EDITS').textContent);
    var B=JSON.parse(document.getElementById('BOOT').textContent);
    var t1=performance.now();
    ME=B.me||'';
    applyPayload(expand(P),E);
    var t2=performance.now();
    PERF={ server:B.serverMs, parse:Math.round(t1-t0), render:Math.round(t2-t1),
           total:Math.round(t2), built:P.built, fresh:!!B.fresh };
    draw();
    document.getElementById('boot').style.display='none';
    setStat('c-ok','저장됨',ME);
    /* 체감 시간을 서버에 남긴다 — 브라우저 밖에서는 이 숫자를 볼 방법이 없다 */
    report('load', B.fresh?'스냅샷 즉석생성':'스냅샷 적중',
      { ms:B.serverMs, render:PERF.render, total:PERF.total+B.serverMs,
        bytes:(B.meta&&B.meta.bytes)||0, rows:BASE.length, sizes:SZ.length });
  }catch(err){
    report('boot-fail',(err&&err.message||err)+' | '+(err&&err.stack||'').slice(0,200));
    try{
      document.getElementById('bootmsg').innerHTML='<span style="color:var(--crit)">화면을 그리지 못했습니다 — '+
        esc(err&&err.message||err)+'</span>';
      setStat('c-crit','오류');
    }catch(e2){}
  }
})();
})();
</script>
