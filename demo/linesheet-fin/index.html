function safe_(json) {
  /* 데이터 안의 <\/script> 가 태그를 닫고 나가지 못하게 한다. */
  return String(json == null ? 'null' : json)

  /* ?diag=1 — iframe 을 타지 않는 평문 자가진단 (Diag.gs) */
  if (e && e.parameter && e.parameter.diag) return diagOutput_();

  var t0 = Date.now();
  var t = HtmlService.createTemplateFromFile('index');

  var snap = readSnapshot_(), fresh = false;
  if (!snap) { buildSnapshot(); snap = readSnapshot_(); fresh = true; }

  t.DATA = safe_(snap ? snap.s : 'null');
  t.EDITS = safe_(JSON.stringify(readEdits_()));
  t.BOOT = safe_(JSON.stringify({
    me: me_(), fresh: fresh, meta: snap ? snap.meta : null, serverMs: Date.now() - t0
  }));

  return t.evaluate()
    .setTitle('라인시트 재무 집계')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}

function include(f) { return HtmlService.createHtmlOutputFromFile(f).getContent(); }

function me_() {
  try { return Session.getActiveUser().getEmail() || '(알 수 없음)'; }
  catch (e) { return '(알 수 없음)'; }
}

function ss_() { return SpreadsheetApp.openById(CFG.SS_ID); }

/* ───────── 값 정리 ───────── */

function s_(v) { return v == null ? '' : String(v).trim(); }
function n_(v) { var x = Number(v); return isFinite(x) ? x : 0; }

/** 날짜를 yyyy-MM-dd 로. Date · 시리얼번호 · 문자열 전부 받는다. */
function ymd_(v) {
  if (v instanceof Date) return Utilities.formatDate(v, CFG.TZ, 'yyyy-MM-dd');
  if (typeof v === 'number' && v > 1000) {
    var d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
    return Utilities.formatDate(d, 'UTC', 'yyyy-MM-dd');
  }
  var t = s_(v);
  return /^\d{4}-\d{2}-\d{2}/.test(t) ? t.slice(0, 10) : '';
}

/** ymd_ 의 확장. 20260801 처럼 8자리로 적은 것도 받는다 — 사람이 손으로 채우는 칸이라 이 모양이 자주 나온다.
    시리얼번호는 2만~8만 대라 8자리 YYYYMMDD 와 겹치지 않는다.
    (ERP업로드 쪽 ymd8_ 는 반대로 대시를 떼는 함수다. 이름이 겹치지 않게 dt8_ 로 둔다.) */
function dt8_(v) {
  if (typeof v === 'number' && v >= 19000101 && v <= 21001231) {
    var t = String(Math.round(v));
    return t.slice(0, 4) + '-' + t.slice(4, 6) + '-' + t.slice(6, 8);
  }
  var s = s_(v);
  if (/^\d{8}$/.test(s)) return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8);
  return ymd_(v);
}

/* ───────── 데이터 읽기 ───────── */

/**
 * 변환 탭 4개(BETA·GAMMA·OH·ALPHA)에서 베이스 로우와 사이즈 행을 읽는다.
 * 컬럼 위치는 변환 탭 설계에 묶여 있다 — 탭 구조를 바꾸면 여기도 바꾼다.
 * 아래 열 기호는 유효성 3열을 끼우기 전 기준이다. 실제로는 전부 +3 (col0) 이다.
 *   A 행키 · B 품번 · C 차수 · D 품명 · N 발주일 · P TAG가
 *   BB 브랜드 · BC 색상 · BD 발주처(정규화) · BE 원산지 · BF 발주량 · BG 사전원가
 *   BH 매입예정액 · BI 납기일 · BJ 납기월 · BK 원가구분 · BM 대복종 · BN 소복종 · BO 시즌
 *   W 행키 · X 사이즈 · Y 수량   (전개 블록)
 * 매출 블록(발매일·확정판매가·예상매출)은 변환 탭 오른쪽 끝에 따로 있다 — CB~CF(OH 만 BX~CB).
 * ERP·BI 양식에는 안 들어가지만 화면에서 매출을 보려면 필요해서 rd·sp·sa 세 칸만 읽는다.
 */
/* #REF! · #VALUE! 같은 수식 오류. 변환 탭이 깨지면 조용히 쓰레기가 집계되므로 센다. */
function errCount_(grid) {
  var n = 0;
  for (var i = 0; i < grid.length; i++) {
    var r = grid[i];
    for (var j = 0; j < r.length; j++) {
      var v = r[j];
      if (typeof v === 'string' && v.charAt(0) === '#' && v.length > 2 &&
          v.indexOf('!') > 0) n++;
    }
  }
  return n;
}

function readAll_() {
  var ss = ss_(), base = [], sizes = [], ids = {}, orphan = { n: 0, q: 0, keys: [] };
  var errs = { n: 0, tabs: [] };

  CFG.BRANDS.forEach(function (cf) {
    var sh = ss.getSheetByName(cf.tab);
    if (!sh) throw new Error('탭 없음: ' + cf.tab);
    var r0 = cf.row0, c0 = cf.col0;
    var room = sh.getMaxRows() - r0 + 1;
    var n = Math.min(cf.n, room);

    var A = sh.getRange(r0,  1 + c0, n,    4).getValues();   // 행키·품번·차수·품명
    var N = sh.getRange(r0, 14 + c0, n,    3).getValues();   // 발주일·가격확정일·TAG가
    var B = sh.getRange(r0, 54 + c0, n,   18).getValues();   // 브랜드명 ~ 라인 + 캔슬(BV)
    var W = sh.getRange(r0, 23 + c0, room, 3).getValues();   // 전개 블록 행키·사이즈·수량
    /* A:C 는 col0 앞쪽의 유효성 3열이라 위 블록에 안 잡힌다. 따로 읽는다. */
    var V = sh.getRange(r0,  1,      n,    3).getValues();   // 등급·확인 필요 항목·건수
    /* 매출 블록 5칸 — 발매일 · 발매월 · 확정판매가(VAT+) · 판매가구분 · 예상매출(VAT+).
       변환탭 오른쪽 끝에 따로 붙어 있어 col0 과 무관한 절대 위치다. 기본 CB(80).
       OH 만 원본에 발매일 열이 없어 블록이 네 칸 앞이다(BX=76) — 칸 순서는 같다. */
    var SC = cf.salesCol || 80, maxC = sh.getMaxColumns();
    var S5 = (SC + 4 <= maxC) ? sh.getRange(r0, SC, n, 5).getValues() : null;

    var e = errCount_(A) + errCount_(N) + errCount_(B) + errCount_(W);
    if (e) { errs.n += e; errs.tabs.push(cf.tab + ':' + e); }

    for (var i = 0; i < n; i++) {
      var pn = s_(A[i][1]);
      if (!pn) continue;
      /* 캔슬(BV) 표시된 행은 매입약정대장도 빼고 있다. 웹앱만 포함하면 총액이 어긋난다. */
      if (s_(B[i][17])) continue;
      var key = s_(A[i][0]);
      ids[cf.b + '-' + key] = 1;
      base.push({
        id: cf.b + '-' + key,
        b: s_(B[i][0]) || cf.b,
        pn: pn,
        bt: s_(A[i][2]),
        nm: s_(A[i][3]),
        od: ymd_(N[i][0]),
        tp: n_(N[i][2]),
        cl: s_(B[i][1]).replace(/\s+/g, ' '),
        v: s_(B[i][2]),
        og: s_(B[i][3]),
        q: n_(B[i][4]),
        c: n_(B[i][5]),
        dd: ymd_(B[i][7]),
        ct: s_(B[i][9]),
        mj: s_(B[i][11]),
        sb: s_(B[i][12]),
        ss: s_(B[i][13]) || '26FW',
        cc: s_(B[i][14]),      // BP 색상코드(정규화)
        wy: s_(B[i][15]),      // BQ 생산방식
        ln: s_(B[i][16]),      // BR 라인
        vg: s_(V[i][0]),       // 유효성 등급 A/B (빈칸이면 이상 없음)
        vm: s_(V[i][1]),       // 확인 필요 항목 — " / " 로 여러 건이 이어붙는다
        vn: n_(V[i][2]),       // 건수
        /* 매출 3칸 — 발매일·확정판매가(VAT+)·예상매출(VAT+) */
        rd: S5 ? ymd_(S5[i][0]) : '',
        sp: S5 ? n_(S5[i][2]) : 0,
        sa: S5 ? n_(S5[i][4]) : 0
      });
    }
    for (var j = 0; j < W.length; j++) {
      var k = s_(W[j][0]);
      if (!k) continue;
      var q = n_(W[j][2]);
      if (!q) continue;
      var sid = cf.b + '-' + k;
      /* 기준 블록에 짝이 없는 사이즈 행 — 원본에서 품번이 비어 생긴다.
         조용히 버리면 수량이 사라진 줄 아무도 모른다. 세어서 화면에 알린다. */
      if (!ids[sid]) {
        orphan.n++; orphan.q += q;
        if (orphan.keys.indexOf(sid) < 0) orphan.keys.push(sid);
        continue;
      }
      sizes.push({ id: sid, s: s_(W[j][1]), q: q });
    }
  });

  /* 33열 표준 탭 — OD·UV·COSTCO. 대장과 같은 기준(집계반영='반영')으로만 넣는다. */
  (CFG.BRANDS2 || []).forEach(function (cf) {
    var sh = ss.getSheetByName(cf.tab);
    /* 탭이 아직 없으면 조용히 건너뛴다. 브랜드를 붙일 때 설정이 탭보다 먼저 올라가는데,
       그때 화면 전체가 죽으면 안 된다. 탭이 생기면 다음 스냅샷부터 저절로 들어온다.
       errs 에 넣지 않는 건 그 배지가 '수식 오류' 용이라서다 — 없는 탭을 수식 오류로 세우면
       고칠 것도 없는 빨간불이 켜진다(I-006 과 같은 오탐). 탭이 통째로 빠지는 사고는
       Diag 가 대장 총액과 대조해서 잡는다. */
    if (!sh) return;
    var room = sh.getMaxRows() - cf.row0 + 1;
    var n = Math.min(cf.n, room);
    var G = sh.getRange(cf.row0, 1, n, 33).getValues();

    var e2 = errCount_(G);
    if (e2) { errs.n += e2; errs.tabs.push(cf.tab + ':' + e2); }

    /* 사이즈 전개 — 원본 미러에서 라벨 행을 보고 사이즈 열을 잡는다. */
    var SZL = null, SZG = null, szW = 0;
    if (cf.raw && cf.lblRow) {
      var rsh = ss.getSheetByName(cf.raw);
      if (rsh) {
        szW = cf.szTo - cf.szFrom + 1;
        var maxC = rsh.getMaxColumns();
        if (cf.szFrom <= maxC) {
          if (cf.szFrom + szW - 1 > maxC) szW = maxC - cf.szFrom + 1;
          SZL = rsh.getRange(cf.lblRow, cf.szFrom, 1, szW).getValues()[0];
          var szRows = Math.min(n, rsh.getMaxRows() - cf.srcRow0 + 1);
          if (szRows > 0) SZG = rsh.getRange(cf.srcRow0, cf.szFrom, szRows, szW).getValues();
        }
      }
    }

    for (var i = 0; i < n; i++) {
      var pn2 = s_(G[i][5]);
      if (!pn2) continue;
      if (cf.season && s_(G[i][11]) !== cf.season) continue;
      if (s_(G[i][32]) !== '반영') continue;
      var rid2 = cf.b + '-' + cf.k + s_(G[i][3]);
      /* 원본행(D열)으로 사이즈 전개를 붙인다. 라벨이 비었거나 소계('TTL')면 사이즈가 아니다. */
      if (SZG && SZL) {
        var si = n_(G[i][3]) - cf.srcRow0;
        if (si >= 0 && si < SZG.length) {
          for (var c2 = 0; c2 < szW; c2++) {
            var lab = s_(SZL[c2]);
            if (!lab || lab.toUpperCase().indexOf('TTL') >= 0) continue;
            var qq = n_(SZG[si][c2]);
            if (!qq) continue;
            sizes.push({ id: rid2, s: lab, q: qq });
          }
        }
      }
      base.push({
        id: rid2,
        b:  s_(G[i][4]) || cf.b,
        pn: pn2,
        bt: s_(G[i][8]),
        nm: s_(G[i][7]),
        od: ymd_(G[i][15]),
        tp: n_(G[i][28]),
        cl: s_(G[i][6]).replace(/\s+/g, ' '),
        v:  s_(G[i][12]),
        og: s_(G[i][13]),
        q:  n_(G[i][18]),
        c:  n_(G[i][19]),
        dd: ymd_(G[i][16]),
        ct: s_(G[i][21]),
        mj: s_(G[i][9]),
        sb: '',
        ss: s_(G[i][11]) || '26FW',
        cc: s_(G[i][10]),
        wy: s_(G[i][14]),
        ln: '',
        vg: s_(G[i][0]),
        vm: s_(G[i][1]),
        vn: n_(G[i][2]),
        /* 33열 스키마는 X 발매일 · Z 확정판매가 · AB 예상매출 */
        rd: ymd_(G[i][23]),
        sp: n_(G[i][25]),
        sa: n_(G[i][27])
      });
    }
  });

  return { base: base, sizes: sizes, sewon: SEWON, orphan: orphan, errs: errs,
           pay: readPay_(),
           perf: readPerf_(),
           stk: readStock_(),
           built: Utilities.formatDate(new Date(), CFG.TZ, 'yyyy-MM-dd HH:mm') };
}

/**
 * 결제조건 — `9.결제조건` 탭 한 줄이 규칙 하나다.
 *   발주처 · 납기월 · 구간하한 · 구간상한 · 익월% · 익익월% · 익익익월% · 메모
 *
 * 범위가 좁은 줄이 먼저 이긴다: 발주처+납기월 > 발주처 > 빈칸(기본).
 * 같은 범위 안에서는 금액 구간으로 고르고, 구간이 비면 금액과 무관하게 적용된다.
 * 여기서는 읽어서 넘기기만 한다 — 어느 줄이 이기는지는 화면이 정한다(같은 규칙을 두 군데 두지 않으려고).
 */
function readPay_() {
  var sh = ss_().getSheetByName(CFG.PAY_TAB);
  if (!sh) return { rows: [], err: '탭 없음: ' + CFG.PAY_TAB };
  var last = sh.getLastRow();
  if (last < 4) return { rows: [] };
  var V = sh.getRange(4, 1, last - 3, 7).getValues();
  var out = [];
  for (var i = 0; i < V.length; i++) {
    var r = V[i];
    var p = [n_(r[4]), n_(r[5]), n_(r[6])];
    /* 비율이 셋 다 비면 빈 줄이다. 지우다 만 줄을 규칙으로 읽지 않는다. */
    if (!p[0] && !p[1] && !p[2]) continue;
    out.push({
      v:  s_(r[0]),
      mo: ymd_(r[1]).slice(0, 7) || s_(r[1]),
      lo: r[2] === '' || r[2] === null ? null : n_(r[2]),
      hi: r[3] === '' || r[3] === null ? null : n_(r[3]),
      p:  p,
      row: 4 + i
    });
  }
  return { rows: out };
}

/**
 * 판매실적 — `6.실적_판매` 한 줄이 품번×판매월 하나다.
 * 원본 ERP 판매현황은 한 달이 68,186행이라 스냅샷에 못 싣는다. 여기 올라오는 건
 * 이미 품번으로 접힌 값(월 1,004행)이고, 개별 행은 apiSalesRows 로 그때그때 가져온다.
 *
 * 무상량은 매출 0 출고(마케팅·샘플·폐기)다. 판매량과 섞으면 소진율이 부풀려져서 따로 받는다.
 * 반품은 원본에서 음수 수량으로 들어와 순판매량에 이미 반영돼 있다.
 */
function readPerf_() {
  var sh = ss_().getSheetByName(CFG.PERF_TAB);
  if (!sh) return { rows: [], err: '탭 없음: ' + CFG.PERF_TAB };
  var last = sh.getLastRow();
  if (last < 3) return { rows: [] };
  var V = sh.getRange(3, 1, last - 2, 16).getValues();
  var out = [], mos = {};
  for (var i = 0; i < V.length; i++) {
    var r = V[i], pn = s_(r[0]);
    if (!pn) continue;
    var mo = s_(r[3]);
    if (mo) mos[mo] = 1;
    out.push({
      pn: pn, b: s_(r[1]), ls: s_(r[2]) === 'O', mo: mo,
      q: n_(r[7]), fq: n_(r[8]),        /* 순판매량 · 무상량 */
      av: n_(r[9]), a: n_(r[10]),       /* 실판매 V− · V+ */
      c: n_(r[11]), tag: n_(r[12])      /* 사전원가금액 · 최초판매가 */
    });
  }
  return { rows: out, months: Object.keys(mos).sort() };
}

/**
 * ERPERP 실적(재고·입고·판매)을 중간관리시트 `6.실적_재고` 탭으로 굽는다.
 *
 * 전에는 스냅샷이 ERP 시트를 그때그때 직접 읽었다. 그러면 웹앱에만 숫자가 있고
 * 중간관리시트에는 아무것도 안 남아 시트에서 피벗을 못 돌린다. 그래서 탭으로 떨구고
 * 웹앱은 그 탭을 읽는다 — 경로가 하나가 되고, ERP 시트가 잠깐 안 열려도
 * 마지막으로 성공한 값이 탭에 남는다.
 *
 * 어느 탭을 읽을지와 기간은 ERP 시트의 `0.추출기준` 이 정한다. 브랜드를 늘릴 때
 * 거기 한 줄만 추가하면 되고 이 코드는 안 고친다.
 */
var STOCK_HEAD = ['품번', '브랜드', '기간입고', '기간출고', '기간판매', '실판매금액',
                  '창고재고', '매장전산재고', '매장미착재고', '매장실재고', '총재고',
                  '사전원가', '재고원가(VAT-)', '결측', '기간시작', '기간종료', '재고기준일',
                  '발매일'];
var STOCK_ROW0 = 5;   /* 1~2 안내 · 3 빈줄 · 4 머리글 · 5부터 데이터 */

/**
 * ERP 시트의 숫자 칸에는 두 종류의 문자가 섞여 있다. 뜻이 달라서 갈라 읽어야 한다.
 *   '.'      ERP 가 0 을 찍는 표기다. 0 으로 읽으면 맞다.
 *   '#####'  칸 폭에 안 맞아 잘린 표시값이 그대로 붙여넣어진 것이다. 원래 숫자는 사라졌다.
 *            0 으로 읽으면 없는 실적을 0 으로 확정해 버리니 결측으로 남기고 세어 둔다.
 * 반환은 [값, 결측여부].
 */
function cellNum_(v) {
  if (typeof v === 'number') return [v, false];
  var t = s_(v);
  if (t === '' || t === '.') return [0, false];
  if (/^#+$/.test(t)) return [null, true];
  var x = Number(t.replace(/,/g, ''));
  return isFinite(x) ? [x, false] : [null, true];
}

/** ERP 시트에서 긁어온다. 실패하면 던진다 — 부르는 쪽이 판단한다. */
function fetchStock_() {
  var ss = SpreadsheetApp.openById(CFG.STOCK_SS);
  var cf = ss.getSheetByName(CFG.STOCK_CFG);
  if (!cf) throw new Error('기준 탭 없음: ' + CFG.STOCK_CFG);
  var C = cf.getRange(6, 1, Math.max(cf.getLastRow() - 5, 1), 8).getValues();
  var srcs = [], rows = [], miss = 0;
  var rel = relDateByPn_();
  for (var i = 0; i < C.length; i++) {
    var t = s_(C[i][0]), b = s_(C[i][1]);
    if (!t || !b) continue;
    srcs.push({ tab: t, b: b, f: dt8_(C[i][2]), to: dt8_(C[i][3]),
                asof: dt8_(C[i][4]), got: dt8_(C[i][5]), by: s_(C[i][6]), n: 0, miss: 0 });
  }
  if (!srcs.length) throw new Error(CFG.STOCK_CFG + ' 에 읽을 줄이 없습니다');

  /* A 발매일 · B 품번 · I 사전원가 · M 기간입고 · O 기간출고 · U 기간판매 · W 실판매금액
     · AN 창고 · AP 매장전산 · AR 매장미착 · AT 매장실 · AV 총재고.
     AW(총재고 금액) 는 거의 전부 '#####' 라 못 쓴다 — 재고원가는 총재고 x 사전원가로 직접 낸다. */
  var PICK = [[12, '입고'], [14, '출고'], [20, '판매'], [22, '실판매금액'],
              [39, '창고재고'], [41, '매장전산'], [43, '매장미착'], [45, '매장실'], [47, '총재고']];
  for (var k = 0; k < srcs.length; k++) {
    var sh = ss.getSheetByName(srcs[k].tab);
    if (!sh) { srcs[k].err = '탭 없음'; continue; }
    var last = sh.getLastRow();
    if (last < 5) continue;
    var wide = Math.min(sh.getLastColumn(), 49);
    var V = sh.getRange(5, 1, last - 4, wide).getValues();
    for (var r = 0; r < V.length; r++) {
      var pn = s_(V[r][1]);
      if (!pn) continue;
      srcs[k].n++;
      var vals = [], bad = [];
      for (var c = 0; c < PICK.length; c++) {
        var got = cellNum_(V[r][PICK[c][0]]);
        if (got[1]) { bad.push(PICK[c][1]); srcs[k].miss++; miss++; }
        vals.push(got[0] === null ? '' : got[0]);
      }
      var pre = cellNum_(V[r][8])[0];
      var stk = vals[8];
      rows.push([pn, srcs[k].b,
                 vals[0], vals[1], vals[2], vals[3],
                 vals[4], vals[5], vals[6], vals[7], vals[8],
                 pre === null ? '' : pre,
                 (pre === null || stk === '') ? '' : stk * pre,
                 bad.join(','),
                 srcs[k].f, srcs[k].to, srcs[k].asof,
                 rel[pn] || '']);
    }
  }
  return { rows: rows, srcs: srcs, miss: miss };
}

/** 품번 -> 발매일. 2.매출대장 이 원천이다(E열). 같은 품번이 여러 색상으로 흩어져 있어도 발매일은 같다. */
function relDateByPn_() {
  var sh = ss_().getSheetByName('2.매출대장');
  if (!sh) return {};
  var last = sh.getLastRow();
  if (last < 3) return {};
  var V = sh.getRange(3, 1, last - 2, 5).getValues(), m = {};
  for (var i = 0; i < V.length; i++) {
    var pn = s_(V[i][1]);
    if (!pn || m[pn]) continue;
    var d = ymd_(V[i][4]);
    if (d) m[pn] = d;
  }
  return m;
}

/** 긁어서 탭에 통째로 다시 쓴다. 스냅샷이 부르고, 편집기에서 직접 불러도 된다. */
function syncStock() {
  var got = fetchStock_();
  var ss = ss_();
  var sh = ss.getSheetByName(CFG.STOCK_TAB);
  if (!sh) sh = ss.insertSheet(CFG.STOCK_TAB);
  var need = got.rows.length + STOCK_ROW0 + 20;
  if (sh.getMaxRows() < need) sh.insertRowsAfter(sh.getMaxRows(), need - sh.getMaxRows());
  if (sh.getMaxColumns() < STOCK_HEAD.length) {
    sh.insertColumnsAfter(sh.getMaxColumns(), STOCK_HEAD.length - sh.getMaxColumns());
  }
  sh.getRange(1, 1, sh.getMaxRows(), STOCK_HEAD.length).clearContent();

  var stamp = Utilities.formatDate(new Date(), CFG.TZ, 'yyyy-MM-dd HH:mm');
  var note = got.srcs.map(function (s) {
    return s.b + ' ' + s.n + '품번' +
      (s.asof ? '(재고 ' + s.asof + (s.f ? ' · 입출고 ' + s.f + '~' + s.to : '') + ')'
              : '(기준 미기입)') + (s.err ? ' ⚠' + s.err : '');
  }).join('  ·  ');
  sh.getRange(1, 1).setValue(
    '■ ERPERP 실적 — 판매현황_ERPERP 시트에서 가져옵니다. 스크립트가 통째로 덮어쓰니 손으로 고치지 마세요.');
  sh.getRange(2, 1).setValue('갱신 ' + stamp + '  ·  ' + note +
    (got.miss ? '  ·  ⚠ 원본이 #### 로 잘려 못 읽은 칸 ' + got.miss + '개 (결측 열 참고 — 0 이 아니라 모르는 값입니다)' : ''));
  sh.getRange(4, 1, 1, STOCK_HEAD.length).setValues([STOCK_HEAD])
    .setFontWeight('bold').setBackground('#eef2f9');
  if (got.rows.length) {
    var body = sh.getRange(STOCK_ROW0, 1, got.rows.length, STOCK_HEAD.length);
    body.setValues(got.rows);
    /* 서식을 매번 못박는다. 열 서식이 남아 있으면 숫자를 넣어도 getValues() 가 Date 를
       돌려줘서(1,188,000 -> 5152-08-18) 스냅샷에 epoch 밀리초가 실린다. 한 번 당했다. */
    body.offset(0, 0, got.rows.length, 2).setNumberFormat('@');            /* 품번·브랜드 */
    body.offset(0, 2, got.rows.length, 11).setNumberFormat('#,##0');       /* 수량·금액 */
    body.offset(0, 13, got.rows.length, 1).setNumberFormat('@');           /* 결측 */
    body.offset(0, 14, got.rows.length, 4).setNumberFormat('yyyy-mm-dd');  /* 기간·기준일·발매일 */
  }
  sh.setFrozenRows(4);
  return { ok: true, n: got.rows.length, miss: got.miss, srcs: got.srcs, built: stamp };
}

/**
 * 스냅샷이 읽는 쪽. ERP 시트가 아니라 방금 구운 `6.실적_재고` 탭을 본다.
 * 탭이 아직 없거나 비어 있으면 빈 채로 돌려준다 — 화면이 '미연동' 으로 표시한다.
 */
function readStock_() {
  try {
    var sh = ss_().getSheetByName(CFG.STOCK_TAB);
    if (!sh) return { rows: [], srcs: [], err: '탭 없음: ' + CFG.STOCK_TAB };
    var last = sh.getLastRow();
    if (last < STOCK_ROW0) return { rows: [], srcs: [] };
    var V = sh.getRange(STOCK_ROW0, 1, last - STOCK_ROW0 + 1, STOCK_HEAD.length).getValues();
    var rows = [], by = {}, miss = 0;
    for (var i = 0; i < V.length; i++) {
      var r = V[i], pn = s_(r[0]);
      if (!pn) continue;
      var b = s_(r[1]);
      if (s_(r[13])) miss++;
      rows.push({ pn: pn, b: b,
                  in_: n_(r[2]), out: n_(r[3]), sq: n_(r[4]), sa: n_(r[5]),
                  wh: n_(r[6]), shop: n_(r[9]), stk: n_(r[10]),
                  pre: n_(r[11]), sc: n_(r[12]),
                  rel: ymd_(r[17]) || s_(r[17]) });
      if (!by[b]) by[b] = { b: b, n: 0, f: ymd_(r[14]) || s_(r[14]),
                            to: ymd_(r[15]) || s_(r[15]), asof: ymd_(r[16]) || s_(r[16]) };
      by[b].n++;
    }
    var srcs = Object.keys(by).map(function (k) { return by[k]; });
    return { rows: rows, srcs: srcs, miss: miss, built: s_(sh.getRange(2, 1).getValue()) };
  } catch (e) {
    return { rows: [], srcs: [], err: String(e) };
  }
}

/**
 * 품번 하나의 원본 판매행. 스냅샷에 실을 수 없는 크기라 누를 때만 서버에서 읽는다.
 * 6.실적_원본 은 최근 2개월만 들고 있어서, 그보다 오래된 달은 집계로만 보인다.
 */
function apiSalesRows(pn, mo) {
  try {
    var sh = ss_().getSheetByName(CFG.PERF_RAW);
    if (!sh) return { ok: false, msg: '탭 없음: ' + CFG.PERF_RAW };
    var last = sh.getLastRow();
    if (last < 2) return { ok: true, rows: [], has: [] };
    /* 탭이 품번순으로 정렬돼 있다(push_raw.py). 그래서 품번 열만 훑어 구간을 잡고
       그 구간만 읽는다 — 88만 셀을 통째로 읽으면 누를 때마다 십수 초가 걸린다. */
    var KEY = 5;                                     /* E열 = 품번 */
    var col = sh.getRange(2, KEY, last - 1, 1).getValues();
    var from = -1, to = -1;
    for (var i = 0; i < col.length; i++) {
      if (String(col[i][0]).trim() !== pn) { if (from >= 0) break; continue; }
      if (from < 0) from = i;
      to = i;
    }
    if (from < 0) {
      /* 못 찾았을 때만 보유 월을 훑는다 — 왜 비었는지 화면에서 말해 주려고. */
      var ds = sh.getRange(2, 1, Math.min(last - 1, 3000), 1).getValues(), has = {};
      for (var k = 0; k < ds.length; k++) {
        var v = ds[k][0];
        var t = v instanceof Date ? Utilities.formatDate(v, CFG.TZ, 'yyyy-MM') : String(v).slice(0, 7);
        if (t) has[t] = 1;
      }
      return { ok: true, rows: [], has: Object.keys(has).sort() };
    }
    var V = sh.getRange(2 + from, 1, to - from + 1, 13).getValues();
    var out = [];
    for (var n = 0; n < V.length; n++) {
      var r = V[n];
      var d = r[0] instanceof Date ? Utilities.formatDate(r[0], CFG.TZ, 'yyyy-MM-dd') : s_(r[0]);
      if (mo && d.slice(0, 7) !== mo) continue;
      out.push({ d: d, st: s_(r[1]), w: s_(r[2]), k: s_(r[3]), nm: s_(r[5]),
                 cl: s_(r[6]), sz: s_(r[7]), q: n_(r[8]), tag: n_(r[9]),
                 a: n_(r[10]), av: n_(r[11]), c: n_(r[12]) });
    }
    out.sort(function (x, y) { return x.d < y.d ? -1 : x.d > y.d ? 1 : 0; });
    return { ok: true, rows: out, has: [] };
  } catch (e) {
    return { ok: false, msg: String(e) };
  }
}

/* 예전의 apiData()·chunk 캐시는 스냅샷(Snapshot.gs)이 대체했다.
   화면은 doGet 이 심어 준 데이터로 바로 그리고, 갱신은 apiRebuild 로 한다. */

/* ───────── 편집 ───────── */

function editSheet_() {
  var ss = ss_(), sh = ss.getSheetByName(CFG.EDITS);
  if (!sh) {
    sh = ss.insertSheet(CFG.EDITS);
    sh.getRange(1, 1, 1, EDIT_HEADER.length).setValues([EDIT_HEADER])
      .setFontWeight('bold').setBackground('#e9eef2');
    sh.setFrozenRows(1);
  }
  return sh;
}

function readEdits_() {
  var sh = editSheet_(), last = sh.getLastRow();
  if (last < 2) return {};
  var v = sh.getRange(2, 1, last - 1, EDIT_HEADER.length).getValues(), out = {};
  v.forEach(function (r) {
    var id = s_(r[0]);
    if (!id) return;
    var e = {};
    if (s_(r[4]) !== '') e.v = s_(r[4]);
    if (s_(r[5]) !== '') e.bt = s_(r[5]);
    if (s_(r[6]) !== '') e.dd = ymd_(r[6]);
    if (s_(r[7]) !== '') e.c = n_(r[7]);
    if (s_(r[8]) !== '') { try { e.sizes = JSON.parse(r[8]); } catch (x) {} }
    e._by = s_(r[9]); e._at = s_(r[10]);
    out[id] = e;
  });
  return out;
}

/** 한 행의 수정분을 통째로 저장한다 (부분 갱신이 아니라 덮어쓰기). */
function apiSaveEdit(id, patch, meta) {
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var sh = editSheet_(), last = sh.getLastRow();
    var ids = last > 1 ? sh.getRange(2, 1, last - 1, 1).getValues() : [];
    var row = -1;
    for (var i = 0; i < ids.length; i++) if (s_(ids[i][0]) === id) { row = i + 2; break; }

    var empty = !patch || (patch.v === undefined && patch.bt === undefined &&
      patch.dd === undefined && patch.c === undefined &&
      (!patch.sizes || !Object.keys(patch.sizes).length));

    if (empty) {
      if (row > 0) sh.deleteRow(row);
      return { ok: true, removed: true };
    }
    var line = [id, (meta && meta.b) || '', (meta && meta.pn) || '', (meta && meta.cl) || '',
      patch.v === undefined ? '' : patch.v,
      patch.bt === undefined ? '' : patch.bt,
      patch.dd === undefined ? '' : patch.dd,
      patch.c === undefined ? '' : patch.c,
      patch.sizes && Object.keys(patch.sizes).length ? JSON.stringify(patch.sizes) : '',
      me_(), Utilities.formatDate(new Date(), CFG.TZ, 'yyyy-MM-dd HH:mm:ss')];
    if (row > 0) sh.getRange(row, 1, 1, line.length).setValues([line]);
    else sh.appendRow(line);
    return { ok: true };
  } finally { lock.releaseLock(); }
}

/**
 * 결제조건 예외를 `9.결제조건` 탭에 쓴다.
 *
 * 기본 3줄(4~6행)은 건드리지 않는다 — 구간표는 협의로 정해진 값이라 화면에서 못 고치게 한다.
 * 예외는 7행부터 통째로 다시 쓴다. 한 줄씩 고치면 지운 줄과 남은 줄이 어긋나는데,
 * 어차피 수십 줄이라 통째 교체가 더 안전하다.
 *
 * 쓰고 나서 스냅샷을 다시 만든다. 안 그러면 화면은 바뀌었는데 새로고침하면 되돌아간다.
 */
function apiSavePayRules(ex) {
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var sh = ss_().getSheetByName(CFG.PAY_TAB);
    if (!sh) return { ok: false, msg: '탭 없음: ' + CFG.PAY_TAB };
    var FIRST = 7;                                  // 4~6 은 기본 구간표
    var last = sh.getLastRow();
    if (last >= FIRST) sh.getRange(FIRST, 1, last - FIRST + 1, 8).clearContent();

    ex = (ex || []).filter(function (r) {
      return s_(r.v) || s_(r.mo);                   // 범위가 없으면 예외가 아니다
    });
    if (ex.length) {
      var who = me_(), when = Utilities.formatDate(new Date(), CFG.TZ, 'yyyy-MM-dd HH:mm');
      var rows = ex.map(function (r) {
        return [s_(r.v), s_(r.mo),
                r.lo == null || r.lo === '' ? '' : n_(r.lo),
                r.hi == null || r.hi === '' ? '' : n_(r.hi),
                n_(r.p[0]) || '', n_(r.p[1]) || '', n_(r.p[2]) || '',
                '앱에서 ' + when + ' · ' + who];
      });
      sh.getRange(FIRST, 1, rows.length, 8).setValues(rows);
    }
    SpreadsheetApp.flush();
    var b = buildSnapshot();
    return { ok: true, n: ex.length, data: readSnapshotRaw_(), built: b.built };
  } finally { lock.releaseLock(); }
}

function apiResetEdits() {
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var sh = editSheet_(), last = sh.getLastRow();
    if (last > 1) sh.deleteRows(2, last - 1);
    return { ok: true };
  } finally { lock.releaseLock(); }
}

/* ───────── ERP 양식 내보내기 ───────── */

/** 내보낸 파일이 드라이브 최상위에 흩어지지 않게 한곳에 모은다. */
function exportFolder_() {
  var name = '라인시트 ERP 내보내기';
  var it = DriveApp.getFoldersByName(name);
  return it.hasNext() ? it.next() : DriveApp.createFolder(name);
}

function batNum_(v) { var m = String(v == null ? '' : v).match(/\d+/); return m ? Number(m[0]) : ''; }

/**
 * 화면이 보낸 행들을 ERP 73열로 전개한다.
 * rows = [{pn,bt,nm,b,mj,sb,og,v,od,dd,tp,c,cn,sizes:[{s,q}]}]  — 화면이 수정분을 이미 반영해 보낸다.
 */
function buildSewon_(rows) {
  var out = [SEWON.slice()];
  var idx = {};
  SEWON.forEach(function (h, i) { idx[h] = i; });

  rows.forEach(function (r) {
    (r.sizes || []).forEach(function (z) {
      if (!z.q) return;
      var o = new Array(SEWON.length).fill('');
      o[idx['품번']] = r.pn;
      o[idx['차수']] = batNum_(r.bt);
      o[idx['품명']] = r.nm;
      o[idx['브랜드']] = r.b;
      o[idx['연도']] = 2026;
      o[idx['시즌']] = 'FW';
      o[idx['대복종']] = r.mj || '';
      o[idx['소복종']] = r.sb || '';
      o[idx['제품구분']] = (r.mj === 'ACC' ? 'ACC' : 'APP');
      o[idx['기획구분']] = '정규';
      o[idx['매입구분']] = (r.og === '한국' ? '국내' : '수입');
      o[idx['대표발주처']] = r.v || '';
      o[idx['발주일']] = r.od || '';
      o[idx['납기일']] = r.dd || '';
      o[idx['가격확정일']] = r.od || '';
      o[idx['TAG가']] = r.tp || '';
      o[idx['최초가']] = r.tp || '';
      o[idx['화폐구분']] = 'KRW';
      o[idx['사전원가']] = r.c || '';
      o[idx['색상']] = r.cn || '';
      o[idx['사이즈']] = z.s;
      o[idx['발주처코드']] = r.v || '';
      o[idx['원산지']] = r.og || '';
      o[idx['발주량']] = z.q;
      out.push(o);
    });
  });
  return out;
}

/**
 * 임시 스프레드시트에 써서 xlsx 로 내보낸 뒤 드라이브에 남기고 링크를 준다.
 * GAS 웹앱은 iframe 안이라 브라우저에서 만든 blob 을 바로 내려받게 할 수 없다.
 */
/* 진행률 — 긴 작업이 캐시에 남기고, 화면이 따로 물어본다.
   google.script.run 은 한 번 부르면 끝날 때까지 아무것도 못 돌려주기 때문이다. */
function prog_(tok, p, msg) {
  if (!tok) return;
  try { CacheService.getScriptCache().put('sx_' + tok, JSON.stringify({ p: p, msg: msg }), 600); }
  catch (e) {}
}
function apiProgress(tok) {
  try {
    var v = CacheService.getScriptCache().get('sx_' + tok);
    return v ? JSON.parse(v) : null;
  } catch (e) { return null; }
}

function apiSewonExport(rows, tok) {
  if (!rows || !rows.length) return { ok: false, msg: '내보낼 행이 없습니다' };
  prog_(tok, 2, '행 전개');
  var a = buildSewon_(rows);
  if (a.length < 2) return { ok: false, msg: '사이즈 수량이 있는 행이 없습니다' };

  var name = 'ERP_상품등록_26FW_' + Utilities.formatDate(new Date(), CFG.TZ, 'yyMMdd_HHmm') +
             '_' + (a.length - 1) + '행';
  prog_(tok, 8, '임시 시트 준비');
  var tmp = SpreadsheetApp.create('__tmp_' + name);
  try {
    var sh = tmp.getSheets()[0];
    sh.setName('엑셀양식');

    /* 한 번에 다 쓰지 않고 나눠 쓴다 — 진행률을 실제로 셀 수 있는 유일한 구간이다 */
    var CH = 400, done = 0;
    for (var i = 0; i < a.length; i += CH) {
      var part = a.slice(i, i + CH);
      sh.getRange(i + 1, 1, part.length, SEWON.length).setValues(part);
      done += part.length;
      prog_(tok, 8 + Math.round(done / a.length * 47),
            '행 쓰는 중 ' + done.toLocaleString() + ' / ' + a.length.toLocaleString());
    }
    SpreadsheetApp.flush();

    prog_(tok, 58, 'xlsx 변환 중');
    var url = 'https://docs.google.com/spreadsheets/d/' + tmp.getId() + '/export?format=xlsx';
    var blob = UrlFetchApp.fetch(url, {
      headers: { Authorization: 'Bearer ' + ScriptApp.getOAuthToken() },
      muteHttpExceptions: true
    }).getBlob().setName(name + '.xlsx');
    prog_(tok, 82, '드라이브 저장');

       uc?export=download 는 구글이 막았고, getDownloadUrl 도 브라우저가 다른 계정
       (authuser=2)으로 열어버리면 남의 파일이 된다 — 실측으로 둘 다 실패했다.
       그래서 파일 바이트를 화면으로 직접 넘긴다. 링크는 보조로만 남긴다. */
    prog_(tok, 90, '파일 전달 준비');
    var who = '';
    try { who = Session.getEffectiveUser().getEmail() || ''; } catch (e) {}
    var au = who ? '?authuser=' + encodeURIComponent(who) : '';

    var b64 = Utilities.base64Encode(blob.getBytes());

/* ───────── BI 내보내기 ───────── */

/* BI 발주현황 양식 31열 (Downloads\발주_상품정보_템플릿.xlsx 1행 그대로).
   ERP과 정반대로 사이즈가 가로로 눕는다 — 1행 = 품번x색상. */
var BI_HEAD = ['발주일자','매입처명','납기일자','예상발매일','스타일넘버','연도','대복종코드','소복종코드',
'품명','색상','컬러코드','생산방식','원산지','라인','120','130','140','150','160','170','00M','00L','0XL',
'XXL','00F','TTL','컬러 Ratio','사전원가','사후원가','예상판매가','M/UP'];

/* 우리 사이즈 → 템플릿 열. 여기 없는 사이즈는 열이 아예 없어서 못 넣는다(TTL 에는 들어간다). */
/* 브랜드마다 같은 사이즈를 다르게 적는다 — BETA·ALPHA 는 M/L/XL, OH 는 00M/00L.
   양쪽 표기를 모두 받는다. 00S·0XS·110·100·60 은 템플릿에 열이 아예 없다. */
var BI_SIZE = { '120':'120','130':'130','140':'140','150':'150','160':'160','170':'170',
                'M':'00M','00M':'00M','L':'00L','00L':'00L','XL':'0XL','0XL':'0XL',
                'XXL':'XXL','FREE':'00F','00F':'00F' };
var BI_ORIGIN = { '한국':'KR','국내':'KR','중국':'CN','베트남':'VN' };

function ymd8_(v) { var t = s_(v); return t ? t.replace(/-/g, '') : ''; }

/**
 * rows = 화면이 보낸 행들(수정 반영됨). 반환 { grid, unplaced }
 *   grid      — 31열 시트
 *   unplaced  — 템플릿에 열이 없어 못 넣은 사이즈 (품번·색상·사이즈·수량)
 */
function buildBi_(rows) {
  var out = [BI_HEAD.slice()], unplaced = [['스타일넘버','색상','사이즈','수량','사유']];
  var idx = {};
  BI_HEAD.forEach(function (h, i) { idx[h] = i; });

  /* 컬러 Ratio = 그 컬러 수량 / 같은 스타일 전체 수량 */
  var styleTot = {};
  rows.forEach(function (r) {
    var t = 0;
    (r.sizes || []).forEach(function (z) { t += Number(z.q) || 0; });
    styleTot[r.pn] = (styleTot[r.pn] || 0) + t;
  });

  rows.forEach(function (r) {
    var o = new Array(BI_HEAD.length).fill('');
    var ttl = 0;
    (r.sizes || []).forEach(function (z) {
      var q = Number(z.q) || 0;
      if (!q) return;
      ttl += q;
      var col = BI_SIZE[z.s];
      if (col) o[idx[col]] = (Number(o[idx[col]]) || 0) + q;
      else unplaced.push([r.pn, r.cl, z.s, q, '템플릿에 ' + z.s + ' 열 없음']);
    });
    if (!ttl) return;

    o[idx['발주일자']] = ymd8_(r.od);
    o[idx['매입처명']] = r.v || '';
    o[idx['납기일자']] = ymd8_(r.dd);
    o[idx['예상발매일']] = '';                    // 3사 원본에 없음
    o[idx['스타일넘버']] = r.pn;
    o[idx['연도']] = 2026;
    o[idx['대복종코드']] = String(r.pn).substr(5, 1);   // 품번 6번째 자리
    o[idx['소복종코드']] = r.sb || '';
    o[idx['품명']] = r.nm || '';
    o[idx['색상']] = r.cl || '';
    o[idx['컬러코드']] = r.cc || '';
    o[idx['생산방식']] = r.wy || '';
    o[idx['원산지']] = BI_ORIGIN[r.og] || r.og || '';
    o[idx['라인']] = r.ln || '';
    o[idx['TTL']] = ttl;                          // 열이 없는 사이즈까지 포함한 진짜 합계
    var st = styleTot[r.pn] || 0;
    o[idx['컬러 Ratio']] = st ? Math.round(ttl / st * 1000) / 10 + '%' : '';
    o[idx['사전원가']] = r.c || '';
    o[idx['사후원가']] = '';                       // 3사 원본에 확정 사후원가 없음
    o[idx['예상판매가']] = r.tp || '';
    o[idx['M/UP']] = (r.c && r.tp) ? Math.round(r.tp / r.c * 100) / 100 : '';
    out.push(o);
  });
  return { grid: out, unplaced: unplaced };
}

function apiBiExport(rows, tok) {
  if (!rows || !rows.length) return { ok: false, msg: '내보낼 행이 없습니다' };
  prog_(tok, 4, '행 구성');

  var name = 'BI_발주현황_26FW_' + Utilities.formatDate(new Date(), CFG.TZ, 'yyMMdd_HHmm') +

    SpreadsheetApp.flush();

    prog_(tok, 60, 'xlsx 변환 중');

    var blob = UrlFetchApp.fetch(url, {

      muteHttpExceptions: true
    }).getBlob().setName(name + '.xlsx');

    prog_(tok, 84, '드라이브 저장');
    var folder = exportFolder_();
    var file = folder.createFile(blob);
    prog_(tok, 92, '파일 전달 준비');
    var who = '';
    try { who = Session.getEffectiveUser().getEmail() || ''; } catch (e) {}
    var au = who ? '?authuser=' + encodeURIComponent(who) : '';
    var uq = 0;
    for (var k = 1; k < r.unplaced.length; k++) uq += Number(r.unplaced[k][3]) || 0;
    var b64 = Utilities.base64Encode(blob.getBytes());
    prog_(tok, 100, '완료');
    return {
      ok: true, n: a.length - 1, name: file.getName(), b64: b64,

  } finally {
    try { DriveApp.getFileById(tmp.getId()).setTrashed(true); } catch (e) {}

}

/* ───────── 점검용 ───────── */

function selftest() {
  var d = readAll_();
  var q = 0, amt = 0;
  d.base.forEach(function (r) { q += r.q; amt += r.q * r.c; });
  var sq = 0;
  d.sizes.forEach(function (s) { sq += s.q; });
  Logger.log('base %s / sizes %s / 발주량 %s / 사이즈합 %s / 약정액 %s',
    d.base.length, d.sizes.length, q, sq, Math.round(amt));
  return { base: d.base.length, sizes: d.sizes.length, qty: q, sizeQty: sq, amt: Math.round(amt) };
}


/**
 * 스냅샷 — 로딩 시간을 줄이는 백엔드.
 *
 * 왜 필요한가.
 *   원래는 화면이 뜬 뒤 google.script.run 으로 apiData() 를 한 번 더 불렀다.
 *   그 한 번에 (1) 변환 탭 12번 읽기 (2) 30만자 JSON 직렬화 (3) GAS 브리지 왕복
 *   이 전부 들어간다. 사용자는 빈 화면을 그동안 보고 있다.
 *
 * 어떻게 바꿨나.
 *   트리거가 미리 읽어 압축한 결과를 _스냅샷 시트에 넣어 둔다.
 *   doGet 은 그 문자열을 HTML 안에 그대로 박아 내려보낸다.
 *   화면은 받자마자 그린다 — 왕복 0회.
 *
 * 압축 방식 (v3).
 *   열 이름을 행마다 반복하지 않고 배열로 눕히고,
 *   브랜드·발주처·원산지·원가구분·대복종·사이즈처럼 값이 반복되는 것은 사전으로 뽑아 번호만 남긴다.
 *   사이즈 행은 행ID 문자열 대신 행 번호를 가리킨다.
 */

var SNAP = {
  SHEET: '_스냅샷',
  CHUNK: 40000,          // 셀 하나에 5만자까지 들어간다. 여유를 둔다.
  VER: 16,
  TRIGGER: 'buildSnapshot',
  EVERY_MIN: 15
};

/* 행 배열의 자리 — 화면(expand)과 반드시 같은 순서여야 한다 */
var ROWF = ['id','b','pn','nm','cl','v','og','bt','od','dd','q','c','ct','mj','sb','tp','cc','wy','ln','vg','vm','vn','rd','sp','sa'];

function snapSheet_() {
  var ss = ss_(), sh = ss.getSheetByName(SNAP.SHEET);
  if (!sh) {
    sh = ss.insertSheet(SNAP.SHEET);
    sh.getRange('A1').setValue('(자동 생성 — 건드리지 마세요. buildSnapshot 이 덮어씁니다)');
    sh.hideSheet();
  }
  return sh;
}

/** 사전을 만들며 번호를 돌려주는 도우미 */
function dictor_() {
  var map = {}, list = [];
  return {
    idx: function (v) {
      v = v == null ? '' : String(v);
      if (map[v] === undefined) { map[v] = list.length; list.push(v); }
      return map[v];
    },
    list: function () { return list; }
  };
}

/** 변환 탭을 읽어 압축 페이로드를 만든다. */
function packSnapshot_() {
  var raw = readAll_();
  var db = dictor_(), dv = dictor_(), dog = dictor_(), dct = dictor_(), dmj = dictor_(),
      dsz = dictor_(), dwy = dictor_(), dln = dictor_();
  var pos = {};

  var rows = raw.base.map(function (r, i) {
    pos[r.id] = i;
    /* vg·vm·vn 은 사전 압축하지 않는다 — vm 은 행마다 다른 긴 문장이라 사전이 커지기만 한다. */
    return [r.id, db.idx(r.b), r.pn, r.nm, r.cl, dv.idx(r.v), dog.idx(r.og), r.bt,
            r.od, r.dd, r.q, r.c, dct.idx(r.ct), dmj.idx(r.mj), r.sb, r.tp,
            r.cc, dwy.idx(r.wy), dln.idx(r.ln), r.vg || '', r.vm || '', r.vn || 0,
            r.rd || '', r.sp || 0, r.sa || 0];
  });

  var sz = [];
  raw.sizes.forEach(function (s) {
    var i = pos[s.id];
    if (i === undefined) return;
    sz.push([i, dsz.idx(s.s), s.q]);
  });

  return {
    v: SNAP.VER,
    built: raw.built,
    f: ROWF,
    dict: { b: db.list(), v: dv.list(), og: dog.list(), ct: dct.list(), mj: dmj.list(),
            sz: dsz.list(), wy: dwy.list(), ln: dln.list() },
    rows: rows,
    sz: sz,
    orphan: raw.orphan,
    errs: raw.errs,
    pay: raw.pay,
    perf: raw.perf,
    stk: raw.stk,
    sewon: SEWON
  };
}

/**
 * 스냅샷을 만들어 시트에 저장한다. 트리거가 부르고, 없으면 doGet 이 부른다.
 * 반환값은 로그·화면 표시용 요약.
 */
function buildSnapshot() {
  var lock = LockService.getScriptLock();
  if (!lock.tryLock(5000)) return { ok: false, msg: '다른 갱신이 진행 중' };
  try {
    var t0 = Date.now();
    /* ERP 실적을 6.실적_재고 로 먼저 굽는다. 여기서 실패해도 스냅샷은 계속 만든다 —
       탭에 남아 있는 지난번 값으로 그리면 되고, 실적 때문에 전체가 멈추면 안 된다. */
    try { syncStock(); } catch (e) { console.warn('syncStock 실패: ' + e); }
    var payload = packSnapshot_();
    var s = JSON.stringify(payload);
    var n = Math.ceil(s.length / SNAP.CHUNK);

    var sh = snapSheet_();
    sh.clearContents();
    var out = [['(자동 생성 — 건드리지 마세요)']];
    out.push([JSON.stringify({ v: SNAP.VER, n: n, built: payload.built,
      bytes: s.length, rows: payload.rows.length, sizes: payload.sz.length })]);
    for (var i = 0; i < n; i++) out.push([s.substr(i * SNAP.CHUNK, SNAP.CHUNK)]);
    sh.getRange(1, 1, out.length, 1).setValues(out);
    cacheWrite_(s, { v: SNAP.VER, n: n, built: payload.built, bytes: s.length,
                     rows: payload.rows.length, sizes: payload.sz.length });

    var ms = Date.now() - t0;
    logPerf_('snapshot', { ms: ms, bytes: s.length, rows: payload.rows.length,
      sizes: payload.sz.length, note: '스냅샷 갱신' });
    return { ok: true, ms: ms, bytes: s.length, rows: payload.rows.length,
             sizes: payload.sz.length, chunks: n, built: payload.built };
  } finally { lock.releaseLock(); }
}

/* 시트 읽기는 500ms 쯤 든다. 같은 문자열을 CacheService 에도 두고 먼저 본다.
   캐시는 언제든 비워질 수 있으므로 시트가 정본이고 캐시는 사본일 뿐이다. */
function cacheKey_(i) { return 'LFS' + SNAP.VER + '_' + i; }

function cacheWrite_(s, meta) {
  try {
    var c = CacheService.getScriptCache(), SZ = 90000;
    var n = Math.ceil(s.length / SZ);
    if (n > 9) return;                       // 캐시에 담기엔 크다 — 시트만 쓴다
    var m = { };
    for (var i = 0; i < n; i++) m[cacheKey_(i)] = s.substr(i * SZ, SZ);
    m[cacheKey_('m')] = JSON.stringify({ n: n, bytes: s.length, meta: meta });
    c.putAll(m, 21600);                      // 6시간
  } catch (e) {}
}

function cacheRead_() {
  try {
    var c = CacheService.getScriptCache();
    var h = c.get(cacheKey_('m'));
    if (!h) return null;
    var head = JSON.parse(h), keys = [];
    for (var i = 0; i < head.n; i++) keys.push(cacheKey_(i));
    var got = c.getAll(keys), s = '';
    for (var j = 0; j < head.n; j++) {
      var part = got[cacheKey_(j)];
      if (part == null) return null;         // 일부만 남았으면 통째로 버린다
      s += part;
    }
    return s.length === head.bytes ? { s: s, meta: head.meta, from: 'cache' } : null;
  } catch (e) { return null; }
}

/** 스냅샷을 한 번만 읽어 본문과 메타를 함께 준다 (같은 시트를 두 번 읽지 않으려고). */
function readSnapshot_() {
  var hit = cacheRead_();
  if (hit) return hit;
  var got = readSnapshotSheet_();
  if (got) cacheWrite_(got.s, got.meta);
  return got;
}

function readSnapshotSheet_() {
  var sh = ss_().getSheetByName(SNAP.SHEET);
  if (!sh) return null;
  var last = sh.getLastRow();
  if (last < 3) return null;
  var v = sh.getRange(1, 1, last, 1).getValues();
  var meta;
  try { meta = JSON.parse(v[1][0]); } catch (e) { return null; }
  if (!meta || meta.v !== SNAP.VER) return null;      // 형식이 바뀌면 버린다
  var s = '';
  for (var i = 2; i < 2 + meta.n; i++) {
    if (!v[i]) return null;
    s += v[i][0];
  }
  return s.length === meta.bytes ? { s: s, meta: meta, from: 'sheet' } : null;
}

function readSnapshotRaw_() { var r = readSnapshot_(); return r ? r.s : null; }
function snapMeta_() { var r = readSnapshot_(); return r ? r.meta : null; }

/* 트리거는 코드로 만들지 않는다.
   ScriptApp.newTrigger 는 script.scriptapp 권한이 필요한데, 이미 승인이 끝난 프로젝트에
   매니페스트로 권한을 더해도 구글이 재동의를 다시 묻지 않아 계속 실패한다(실측).
   편집기 좌측 [트리거] 패널에서 클릭 세 번으로 만드는 쪽이 확실하고 권한도 필요 없다.
     실행할 함수 buildSnapshot / 시간 기반 / 분 타이머 / 15분마다 */

/** 화면의 [새로고침] — 지금 다시 읽어 스냅샷을 갈고, 새 데이터를 돌려준다. */
function apiRebuild() {
  var r = buildSnapshot();
  if (!r.ok) return r;
  r.data = readSnapshotRaw_();
  r.edits = readEdits_();
  return r;
}

/* ───────── 성능 기록 ───────── */

var PERF = { SHEET: '_성능', HEADER: ['일시','구분','서버ms','전송ms','렌더ms','합계ms','바이트','행','사이즈','사용자','비고'] };

function perfSheet_() {
  var ss = ss_(), sh = ss.getSheetByName(PERF.SHEET);
  if (!sh) {
    sh = ss.insertSheet(PERF.SHEET);
    sh.getRange(1, 1, 1, PERF.HEADER.length).setValues([PERF.HEADER])
      .setFontWeight('bold').setBackground('#e9eef2');
    sh.setFrozenRows(1);
  }
  return sh;
}

function logPerf_(kind, o) {
  try {
    var sh = perfSheet_();
    sh.appendRow([Utilities.formatDate(new Date(), CFG.TZ, 'yyyy-MM-dd HH:mm:ss'), kind,

<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#F2F5F7; --surf:#FFFFFF; --surf2:#E9EEF2; --surf3:#F7F9FB;
  --ink:#13171B; --ink2:#3A424B; --mut:#697382; --faint:#98A2AE;
  --rule:#D9E0E6; --rule2:#C2CBD4;
  --acc:#175C88; --acc2:#2E7FB3; --acc-w:#E2EEF6;
  --ok:#186A4A; --ok-w:#DFEFE7;
  --warn:#8A5E06; --warn-w:#F8EBD4;
  --crit:#A2352A; --crit-w:#F8E3E0;
  --edit:#B4700A; --edit-w:#FDF0D8;
  --mono:'IBM Plex Mono',SFMono-Regular,Consolas,monospace;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --h:52px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1215; --surf:#181C21; --surf2:#22282F; --surf3:#1D2228;
  --ink:#E6E9EC; --ink2:#BEC5CD; --mut:#8B95A1; --faint:#69727D;
  --rule:#293038; --rule2:#39424C;
  --acc:#6BA6CD; --acc2:#8FC0E0; --acc-w:#172935;
  --ok:#5CB289; --ok-w:#152820;
  --warn:#CFA144; --warn-w:#2A2214;
  --crit:#DB8175; --crit-w:#2D1A17;
  --edit:#D5A64A; --edit-w:#2E2513;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}

.top{height:var(--h);background:var(--surf);border-bottom:1px solid var(--rule2);display:flex;
  align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:40}
.brandmark{font-weight:700;font-size:15px;letter-spacing:-.02em;white-space:nowrap}
.brandmark span{color:var(--mut);font-weight:400;font-size:11px;font-family:var(--mono);
  letter-spacing:.06em;margin-left:8px}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{background:none;border:1px solid transparent;padding:5px 13px;border-radius:5px;color:var(--mut);
  font-weight:500;font-size:13px}
.tab[aria-selected="true"]{background:var(--acc-w);color:var(--acc);border-color:var(--acc-w)}
.spacer{flex:1}
.chip{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;padding:3px 8px;
  border-radius:4px;white-space:nowrap}
.c-ok{background:var(--ok-w);color:var(--ok)} .c-warn{background:var(--warn-w);color:var(--warn)}
.c-crit{background:var(--crit-w);color:var(--crit)} .c-mut{background:var(--surf2);color:var(--mut)}
.btn{background:var(--acc);color:#fff;border:1px solid var(--acc);padding:6px 13px;border-radius:5px;
  font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--acc2);border-color:var(--acc2)}
.btn.gh{background:transparent;color:var(--ink2);border-color:var(--rule2);font-weight:500}
.btn.gh:hover{background:var(--surf2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.shell{display:grid;grid-template-columns:178px 1fr;min-height:calc(100vh - var(--h))}
.rail{background:var(--surf);border-right:1px solid var(--rule);padding:16px 14px 40px;
  position:sticky;top:var(--h);height:calc(100vh - var(--h));overflow-y:auto}
.rail h3{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin:0 0 8px;font-weight:600}
.fgroup{margin-bottom:20px}
.fgroup+.fgroup{padding-top:16px;border-top:1px solid var(--rule)}
input[type=text],select{width:100%;background:var(--surf3);border:1px solid var(--rule2);color:var(--ink);
  padding:6px 9px;border-radius:5px;font-family:inherit;font-size:13px}
input[type=text]:focus,select:focus{border-color:var(--acc2);outline:none}
.opts{display:flex;flex-direction:column;gap:1px}
.opt{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;font-size:13px;cursor:pointer}
.opt:hover{background:var(--surf2)}
.opt input{accent-color:var(--acc);margin:0}
.opt .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.main{padding:20px 14px 64px;min-width:0}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-bottom:18px}
.kpi{background:var(--surf);padding:12px 14px}
.kpi .k{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.kpi .v{font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .v em{font-style:normal;font-size:12px;font-weight:400;color:var(--mut);margin-left:2px}
.kpi .s{font-size:11px;color:var(--faint);margin-top:1px}

.panel{background:var(--surf);border:1px solid var(--rule);margin-bottom:18px}
.ph{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid var(--rule);
  background:var(--surf3)}
.ph h2{font-size:13px;font-weight:600;margin:0}
/* 필터를 걸어 놓고 전체 숫자로 착각하는 사고를 막는다 — 제목 옆에 대상 범위를 늘 붙여 둔다 */
.ph .bl{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em;
  padding:2px 7px;border-radius:3px;background:var(--acc-w);color:var(--acc);white-space:nowrap}
/* 지급월 표 — 발주처 줄을 펴면 납기월 줄이 나온다 */
tr.payv{cursor:pointer}
tr.payv:hover{background:var(--acc-w)}
tr.payv.open>td:first-child{font-weight:600}
tr.paysub>td{background:var(--surf3);color:var(--ink2)}
tr.paysub>td:first-child{padding-left:26px;font-size:11.5px}
.caret{display:inline-block;width:12px;color:var(--faint);font-family:var(--mono)}
.ratechip{font-family:var(--mono);font-size:8.5px;color:var(--acc);background:var(--acc-w);
  padding:0 2px;border-radius:2px;margin-right:3px;vertical-align:1px}
.rulechip{font-family:var(--mono);font-size:8.5px;color:var(--mut);background:var(--surf2);
  padding:0 3px;border-radius:2px;margin-left:4px}
.paywarn{background:var(--warn-w);color:var(--warn);padding:8px 15px;font-size:11.5px;
  border-bottom:1px solid var(--rule)}
td.drill{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;
  text-decoration-color:var(--faint);text-underline-offset:3px}
td.drill:hover{background:var(--acc-w);color:var(--acc);font-weight:600}
table.drill{font-size:12px}
table.drill tbody tr:hover{background:var(--acc-w)}
table.drill thead th{position:sticky;top:0;z-index:1}
.kpis2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule)}
.kpis2 .kpi{background:var(--surf);padding:10px 13px}
.kpis2 .kpi .k{font-size:11px;color:var(--mut)}
.kpis2 .kpi .v{font-size:19px;font-weight:600;letter-spacing:-.01em}
.kpis2 .kpi .s{font-size:11px;color:var(--faint);margin-top:1px}
/* 열 폭 고정 — 펴고 접어도 표가 안 움직인다 */
table.fixed{table-layout:fixed;width:auto;min-width:100%}
table.fixed td,table.fixed th{overflow:hidden;text-overflow:ellipsis}
/* 숫자 칸은 절대 자르지 않는다. 오른쪽 정렬이라 왼쪽부터 잘리는데, 그러면
   2,274,718,428 이 274,718,428 로 보인다 — 자릿수가 통째로 사라져도 티가 안 난다.
   폭이 모자라면 칸이 넘치게 두고(열 폭을 줄여 맞춘다), 자르지는 않는다. */
table.fixed td.r{overflow:visible;text-overflow:clip}
tr.paysub>td:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 납기(들어오는 달)는 지급과 색을 갈라 둔다 — 같은 격자에 겹쳐 놓기 때문에 */
tr.paydue>td{background:var(--warn-w);color:var(--warn);font-weight:600}
tr.paydue>td:first-child{padding-left:26px;font-size:11.5px;font-weight:500}
td.duecell{color:var(--warn);font-weight:600}
tfoot tr:last-child td{border-top:1px solid var(--rule)}
.tagd{font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:2px;margin-right:5px;
  background:var(--warn);color:#fff}
/* 열이 12개월까지 늘어 가로로 밀린다 — 행 이름만은 붙들어 둬야 어느 줄인지 안 놓친다.

/* 매입 금액 표시 기준. 대장·구간판정·마진은 늘 VAT 별도로 계산하고,
   화면에 찍을 때만 1.1 을 곱한다. 계산 기준을 바꾸면 결제조건 구간이 흔들린다.
   주의 — 시트 1.예상매입 도 전체에 ×1.1 을 쓴다(해외 발주처도 포함). 그 정의를 그대로 따른다. */
var VATIN=false;
function vmul(){ return VATIN?1.1:1; }
function vlab(){ return VATIN?'VAT 포함':'VAT 별도'; }
function nv(x){ return n0((x||0)*vmul()); }
function wv(x){ return won((x||0)*vmul()); }
/* 매출 — 기본은 변환탭이 계산해 둔 값(sa)을 그대로 쓴다. 그게 대장에 들어간 값이라서다.
   화면에서 고친 행만 수량×확정판매가로 다시 낸다.
   항상 다시 곱하면 안 된다 — qtyOf 는 사이즈 행 합이라 원본 수량열과 미세하게 다를 수 있고
   (OD 26WI 901장 같은 원본 결함), 그러면 웹앱 매출이 대장과 조용히 갈라진다. */
function saleOf(r){
  if(isEd(r) && r.sp) return qtyOf(r)*Number(r.sp);
  return Number(r.sa)||0;
}
function rdOf(r){ return r.rd||''; }
/* 발매월 — 없으면 '발매일없음'. OD·UV·COSTCO·UO 는 원본에 발매일 열이 아예 없다. */
function rmOf(r){ var d=rdOf(r); return d? d.slice(0,7) : '발매일없음'; }
function hasSale(r){ return (Number(r.sa)||0)>0 || (Number(r.sp)||0)>0; }
function ctOf(r){ return costOf(r)===0? '원가없음' : (r.ct||'—'); }
function isEd(r){ return !!EDITS[r.id]; }

/* ---------- filters ---------- */
var F={q:'',b:{},m:{},c:{},o:{},v:''};
function uniq(fn){ var m={}; BASE.forEach(function(r){ var k=fn(r); m[k]=(m[k]||0)+1; });
  return Object.keys(m).sort().map(function(k){ return {k:k,n:m[k]}; }); }
function anyOn(o){ return Object.keys(o).some(function(k){ return o[k]; }); }
function pass(r){
  if(F.q&&(r.pn+' '+r.nm+' '+r.cl).toLowerCase().indexOf(F.q.toLowerCase())<0) return false;
  if(anyOn(F.b)&&!F.b[r.b]) return false;
  if(anyOn(F.m)&&!F.m[monOf(r)]) return false;
  if(anyOn(F.c)&&!F.c[ctOf(r)]) return false;
  if(anyOn(F.o)&&!F.o[r.og]) return false;
  if(F.v&&vendOf(r)!==F.v) return false;
  return true;
}
function rows(){ return BASE.filter(pass); }
function chkGroup(el,items,store){
  el.innerHTML=items.map(function(i){ return '<label class="opt"><input type="checkbox" value="'+esc(i.k)+'"'+
    (store[i.k]?' checked':'')+'><span>'+esc(i.k)+'</span><span class="cnt">'+i.n+'</span></label>'; }).join('');
  el.onchange=function(e){ store[e.target.value]=e.target.checked; draw(); };
}
function buildFilters(){
  chkGroup(document.getElementById('fb'),uniq(function(r){return r.b;}),F.b);
  chkGroup(document.getElementById('fm'),uniq(monOf),F.m);
  chkGroup(document.getElementById('fc'),uniq(ctOf),F.c);
  chkGroup(document.getElementById('fo'),uniq(function(r){return r.og;}),F.o);
  var vs=uniq(vendOf);
  document.getElementById('fv').innerHTML='<option value="">전체 ('+vs.length+'곳)</option>'+
    vs.map(function(v){ return '<option'+(F.v===v.k?' selected':'')+'>'+esc(v.k)+'</option>'; }).join('');
  document.getElementById('fv').onchange=function(e){ F.v=e.target.value; draw(); };
  document.getElementById('q').oninput=function(e){ F.q=e.target.value.trim(); draw(); };
}

/* ---------- KPI ---------- */
function drawKpi(rs){
  var q=0,a=0,fx=0,pl=0,vs={},pns={};
  rs.forEach(function(r){ q+=qtyOf(r); var m=amtOf(r); a+=m;
    if(ctOf(r)==='확정') fx+=m; else if(ctOf(r)==='사전(계획)') pl+=m;
    vs[vendOf(r)]=1; pns[r.pn]=1; });
  var sal=0, nsal=0;
  rs.forEach(function(r){ var x=saleOf(r); if(x){ sal+=x; nsal++; } });
  var k=[['매입 약정액',wv(a),vlab()],['예상매출',won(sal),'VAT 포함 · '+n0(nsal)+'행'],
    ['발주량',n0(q)+'<em>장</em>',''],
    ['품번×색상',n0(rs.length)+'<em>행</em>',Object.keys(pns).length+'개 품번'],
    ['발주처',Object.keys(vs).length+'<em>곳</em>',''],
    ['확정 원가',won(fx),a?Math.round(fx/a*100)+'%':'—'],
    ['계획 원가',won(pl),a?Math.round(pl/a*100)+'%':'—']];
  document.getElementById('kpis').innerHTML=k.map(function(x){
    return '<div class="kpi"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div><div class="s">'+x[2]+'</div></div>';
  }).join('');
}

/* ---------- summary ---------- */
function agg(rs,keyfn){ var m={}; rs.forEach(function(r){ var k=keyfn(r);
  if(!m[k]) m[k]={k:k,q:0,a:0,n:0}; m[k].q+=qtyOf(r); m[k].a+=amtOf(r); m[k].n++; });
  return Object.keys(m).map(function(k){ return m[k]; }); }
function tbl(head,body,foot,cols,cls){
  /* cols 를 주면 table-layout:fixed 로 잠근다 — 행을 펴고 접어도 열이 안 움직인다. */
  return '<div class="tw"><table'+((cols||cls)?' class="'+(cols?'fixed':'')+(cls?' '+cls:'')+'"':'')+'>'+
    (cols? '<colgroup>'+cols.map(function(w){ return '<col style="width:'+w+'">'; }).join('')+'</colgroup>' : '')+
    '<thead><tr>'+head+'</tr></thead><tbody>'+
    body+'</tbody>'+
    (foot? '<tfoot>'+(foot instanceof Array? foot:[foot]).map(function(f){ return '<tr>'+f+'</tr>'; }).join('')+'</tfoot>' : '')+
    '</table></div>'; }
function chart(rs){
  var a=agg(rs,monOf).sort(function(x,y){ return x.k<y.k?-1:1; });
  if(!a.length) return '<div class="empty">표시할 데이터가 없습니다</div>';
  var max=Math.max.apply(null,a.map(function(x){return x.a;}))||1;
  var W=760,H=232,L=56,R=14,T=26,B=44,iw=W-L-R,ih=H-T-B;
  var gap=iw/a.length, bw=Math.min(78,gap*0.62), g='',lb='';
  a.forEach(function(x,i){
    var h=Math.max(1,x.a/max*ih), cx=L+gap*i+gap/2, y=T+ih-h;
    g+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+
      '" fill="'+(x.k==='납기불명'?'var(--faint)':'var(--acc)')+'" rx="1"/>';
    lb+='<text x="'+cx.toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" font-size="10.5" '+
      'font-weight="600" font-family="IBM Plex Mono, monospace" fill="var(--ink)">'+
      (x.a/1e8).toFixed(x.a>=1e8?1:2)+'</text>';
    lb+='<text x="'+cx.toFixed(1)+'" y="'+(T+ih+16)+'" text-anchor="middle" font-size="10" '+
      'font-family="IBM Plex Mono, monospace" fill="var(--mut)">'+esc(x.k.replace('2026-','26.'))+'</text>';
  });
  var ax='';
  for(var i=0;i<=3;i++){ var yy=T+ih-ih*i/3;
    ax+='<line x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+
      '" stroke="var(--rule)" stroke-width="1"'+(i?' stroke-dasharray="2 3"':'')+'/>'+
      '<text x="'+(L-8)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" '+
      'font-family="IBM Plex Mono, monospace" fill="var(--faint)">'+(max*i/3/1e8).toFixed(1)+'억</text>'; }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="납기월별 매입 약정액">'+ax+g+lb+
    '<text x="'+L+'" y="'+(H-6)+'" font-size="10" font-family="IBM Plex Sans KR, sans-serif" '+
    'fill="var(--faint)">단위: 억원 · 원가 기준 · '+vlab()+'</text></svg>';
}
/* 발주처 × 납기월 매트릭스 — 어느 업체에 몇 월에 얼마가 나가는지 한 장으로 본다.
   브랜드는 왼쪽 필터로 좁히면 이 표가 그대로 따라온다.
   납기월을 쓰는 이유: 입고월은 4사 원본에만 있고 OD·UV·COSTCO 에는 없다.
   자금 소요 기준도 납기월이라 여기서는 납기월로 통일한다. */
var MTX = { mode: 'a' };   // a=약정액, q=발주량

/* ---------- 결제조건 ----------
   규칙은 코드가 아니라 `9.결제조건` 탭에 있다 — 누가 언제 고쳤는지가 남아야 하는 값이라서.
   한 줄이 규칙 하나다:  발주처 · 납기월 · 구간하한 · 구간상한 · 익월% · 익익월% · 익익익월%

   범위가 좁은 줄이 먼저 이긴다.
     ① 발주처 + 납기월 지정   ② 발주처만 지정   ③ 둘 다 빈칸(= 기본)
   같은 범위 안에서는 금액 구간으로 고르고, 구간이 비어 있으면 금액과 무관하게 적용된다.

   기산점은 납기월이다. 이 표가 예정이기 때문이다 — 입고월은 ERP 에만 있고
   아직 안 들어온 건에는 아예 없다.

   '건'을 무엇으로 묶느냐가 구간 판정을 바꾸고, 구간이 바뀌면 지급 시점이 바뀐다.
   대장 행(품번×색상)으로 쪼개면 71.7%가 1천만 이하라 거의 다 익월 일시불이 되고,
   발주처×납기월로 묶으면 금액의 86%가 1억 이상 구간으로 올라간다.
   실측 차이가 2026-09 에 +3.6억, 2027-01 에 −5.1억이다. 그래서 고르게 해 둔다. */
var PAY = { grain:'vm', view:'tbl', win:6, start:0 };   // win=한 번에 펴는 월 수(0=전체), start=창 위치

/* 규칙 탭이 비었거나 못 읽었을 때만 쓰는 최후의 기본값. 화면이 빈 표가 되는 것보다 낫다. */
var PAY_FALLBACK = [
  { v:'', mo:'', lo:0,         hi:10000000,  p:[100,0,0],  row:0 },
  { v:'', mo:'', lo:10000001,  hi:100000000, p:[50,50,0],  row:0 },
  { v:'', mo:'', lo:100000001, hi:null,      p:[50,30,20], row:0 }
];
function payRules(){ return (PAYRULES&&PAYRULES.length)? PAYRULES : PAY_FALLBACK; }

/** 이 건(발주처·납기월·금액)에 적용할 줄 하나를 고른다. 없으면 null. */
function payRuleFor(v,mo,amt){
  var rs=payRules(), best=null, bestScope=-1;
  for(var i=0;i<rs.length;i++){
    var r=rs[i];
    if(r.v && r.v!==v) continue;
    if(r.mo && r.mo!==mo) continue;
    if(r.lo!=null && amt<r.lo) continue;
    if(r.hi!=null && amt>r.hi) continue;
    var scope = (r.v?2:0)+(r.mo?1:0);          // 좁을수록 큰 값
    if(scope>bestScope){ best=r; bestScope=scope; }
  }
  return best;
}
/** 화면에 띄울 규칙 이름 — 왜 이 비율이 나왔는지 손으로 짚을 수 있어야 한다. */
/* 금액을 사람 단위로 짧게 — 열 폭을 잡아먹지 않게 '10,000,001' 이 아니라 '1천만' 으로. */
function payAmtShort(n){
  n=Math.round(n||0);
  if(n>=1e8) return (n%1e8? (n/1e8).toFixed(1):(n/1e8))+'억';
  if(n>=1e4) return Math.round(n/1e4).toLocaleString('ko-KR')+'만';
  return n0(n);
}
function payRuleName(r){
  if(!r) return '규칙 없음';
  if(r.v && r.mo) return r.mo+' 전용';
  if(r.v) return '업체 전용';
  if(r.lo==null && r.hi==null) return '전 구간';
  if(r.hi==null) return payAmtShort(r.lo)+' 초과';
  if(!r.lo) return payAmtShort(r.hi)+' 이하';
  return payAmtShort(r.lo)+'~'+payAmtShort(r.hi);
}
/* 툴팁에는 범위를 끝까지 적는다 — 짧은 라벨만 보고 헷갈리지 않게. */
function payRuleFull(r){
  if(!r) return '적용할 규칙이 없습니다';
  var who = r.v? (r.v+(r.mo? ' · '+r.mo+' 납기':' 전체')+' 전용 규칙') : '기본 구간표';
  var rng = (r.lo==null&&r.hi==null) ? '금액 무관'
          : (r.lo==null? '~'+n0(r.hi) : (r.hi==null? n0(r.lo)+'~' : n0(r.lo)+' ~ '+n0(r.hi)));
  return who+' · '+rng+' · '+r.p.filter(function(x){ return x; }).join('/');
}
function addMonth(mo,k){
  var y=Number(String(mo).slice(0,4)), m=Number(String(mo).slice(5,7));
  if(!y||!m) return null;
  m+=k; y+=Math.floor((m-1)/12); m=(m-1)%12+1;
  return y+'-'+(m<10?'0':'')+m;
}
/** 한 건을 지급월로 흩는다. 납기월이 없으면 지급월도 못 정한다 — 0 으로 숨기지 않고 따로 세운다. */
function paySpread(v,mo,amt){
  var r=payRuleFor(v,mo,amt);
  if(!r) return [{ pm:'규칙 없음', amt:amt, pct:100, rule:null }];
  var out=[], sum=r.p[0]+r.p[1]+r.p[2];
  r.p.forEach(function(pct,i){
    if(!pct) return;
    out.push({ pm: mo==='납기불명' ? '지급월 미정' : (addMonth(mo,i+1)||'지급월 미정'),
               amt: amt*pct/100, pct:pct, rule:r });
  });
  /* 합이 100 이 아니면 잔액이 증발한다. 조용히 넘기지 않고 '비율합 오류' 로 세운다. */
  if(sum!==100) out.push({ pm:'비율합 오류', amt:amt*(100-sum)/100, pct:100-sum, rule:r });
  return out;
}

/* 지금 보고 있는 범위를 제목 옆에 박아 둔다. 필터가 걸린 줄 모르고 읽는 일이 없게. */
function brandSel(){ return Object.keys(F.b).filter(function(k){ return F.b[k]; }).sort(); }
function bl(){
  var b=brandSel();
  return '<span class="bl">'+esc(b.length? b.join(' · ') : '전체 브랜드')+'</span>';
}
function matrixPanel(rs){
  var months = {}, vends = {}, cell = {};
  rs.forEach(function(r){
    var m = monOf(r), v = vendOf(r) || '(발주처 없음)';
    var val = MTX.mode === 'q' ? qtyOf(r) : amtOf(r)*vmul();
    months[m] = (months[m] || 0) + val;
    vends[v] = (vends[v] || 0) + val;
    var k = v + '␀' + m;
    cell[k] = (cell[k] || 0) + val;
  });
  var ms = Object.keys(months).sort(function(a,b){
    if(a === '납기불명') return 1; if(b === '납기불명') return -1; return a < b ? -1 : 1; });
  var vs = Object.keys(vends).sort(function(a,b){ return vends[b] - vends[a]; });
  if(!vs.length) return '';
  var tot = vs.reduce(function(s,v){ return s + vends[v]; }, 0);

  var head = '<th class="nos">발주처</th>' + ms.map(function(m){
    return '<th class="nos r">' + esc(m) + '</th>'; }).join('') + '<th class="nos r">합계</th>';
  var body = vs.map(function(v){
    return '<tr><td>' + esc(v) + '</td>' + ms.map(function(m){
      var x = cell[v + '␀' + m] || 0;
      return '<td class="r">' + (x ? n0(x) : '<span style="color:var(--faint)">–</span>') + '</td>';
    }).join('') + '<td class="r"><b>' + n0(vends[v]) + '</b></td></tr>';
  }).join('');
  var foot = '<td>합계</td>' + ms.map(function(m){
    return '<td class="r">' + n0(months[m]) + '</td>'; }).join('') + '<td class="r">' + n0(tot) + '</td>';

  return '<div class="panel"><div class="ph"><h2>발주처 × 납기월</h2>' + bl() +
    '<select id="mtxmode" style="width:auto;margin-left:10px">' +
    '<option value="a"' + (MTX.mode==='a'?' selected':'') + '>약정액('+vlab()+')</option>' +
    '<option value="q"' + (MTX.mode==='q'?' selected':'') + '>발주량</option></select>' +
    '<span class="sub">' + vs.length + '개 발주처 × ' + ms.length + '개월 · 브랜드는 왼쪽 필터로 좁히세요' +
    ' · 입고월이 아니라 납기월 기준(OD·UV·COSTCO 원본에 입고월이 없음)</span></div>' +
    tbl(head, body, foot) + '</div>';
}

/* 발주처 × 납기월을 결제조건에 태워 발주처 × 지급월로 옮긴다.
   여기 숫자가 실제로 통장에서 나가는 달이다 — 납기월 표와 총액은 같고 시점만 다르다.

   표 보기는 계층 행이다: 평소엔 발주처 한 줄, 펴면 그 발주처의 납기월 수만큼 줄이 열리고
   각 줄이 지급월로 흩어진다. 막대 보기는 같은 건을 시간축 위에 눕혀 몇 달에 걸리는지 보여준다. */
var PAYOPEN = {};

function paySplitRows(rs){
  var g={};
  rs.forEach(function(r){
    var v=vendOf(r)||'(발주처 없음)', m=monOf(r);
    var k = PAY.grain==='row' ? (v+''+m+''+r.id) : (v+''+m);
    if(!g[k]) g[k]={v:v,m:m,a:0,n:0};
    g[k].a+=amtOf(r); g[k].n++;
  });
  var cells=Object.keys(g).map(function(k){
    var d=g[k];
    d.parts=paySpread(d.v,d.m,d.a);
    d.rule=payRuleFor(d.v,d.m,d.a);
    return d;
  });
  var vend={}, pm={}, cell={}, due={}, dm={}, dcell={};
  cells.forEach(function(d){
    due[d.v]=(due[d.v]||0)+d.a;
    /* 납기(들어오는 달)도 같은 격자에 올린다 — 지급과 위아래로 대조하려고 */
    dm[d.m]=(dm[d.m]||0)+d.a;
    dcell[d.v+''+d.m]=(dcell[d.v+''+d.m]||0)+d.a;
    d.parts.forEach(function(x){
      pm[x.pm]=(pm[x.pm]||0)+x.amt;
      vend[d.v]=(vend[d.v]||0)+x.amt;
      cell[d.v+''+x.pm]=(cell[d.v+''+x.pm]||0)+x.amt;
    });
  });
  function tail(m){ return m==='지급월 미정'||m==='납기불명'||m==='규칙 없음'||m==='비율합 오류'; }
  function sortM(a,b){
    if(tail(a)!==tail(b)) return tail(a)?1:-1;
    return a<b?-1:1; }
  /* 차트는 지급월만 쓰고(pms), 표는 납기월까지 합친 열을 쓴다(ms) */
  var pms=Object.keys(pm).sort(sortM);
  var u={};
  Object.keys(pm).forEach(function(k){ u[k]=1; });
  Object.keys(dm).forEach(function(k){ u[k]=1; });
  var ms=Object.keys(u).sort(sortM);
  var vs=Object.keys(vend).sort(function(a,b){ return vend[b]-vend[a]; });
  /* 발주처 이름을 한 글자만 잘못 적으면 그 예외는 조용히 안 먹는다 — 기본 규칙으로 흘러
     아무 표시 없이 숫자만 달라진다. 그래서 한 건도 못 잡은 예외 줄을 세어 둔다. */
  var used={};
  cells.forEach(function(d){ if(d.rule) used[d.rule.row]=1; });
  var dead=payRules().filter(function(r){ return (r.v||r.mo) && !used[r.row]; });
  return { cells:cells, ms:ms, pms:pms, vs:vs, pm:pm, dm:dm, vend:vend, cell:cell, dcell:dcell,
           due:due, dead:dead,
           tot:vs.reduce(function(s,v){ return s+vend[v]; },0),
           dtot:vs.reduce(function(s,v){ return s+(due[v]||0); },0) };
}

/* 월 열은 시즌이 바뀌면 계속 늘어난다. 다 펴면 가로로 밀리고, 밀리면 어느 달인지 놓친다.
   그래서 창(기본 6개월)만 펴고 나머지는 양끝 '이전 / 이후' 한 칸에 합쳐 둔다.
   접었다고 돈이 사라지면 안 되니 그 칸에 합계를 그대로 적는다 — 합계 열과 더해서 검산도 된다.
   '납기불명'·'지급월 미정'은 달이 아니라서 창과 무관하게 늘 맨 뒤에 둔다. */
function payIsTail(m){
  return m==='지급월 미정'||m==='납기불명'||m==='규칙 없음'||m==='비율합 오류';
}
function payWindow(P){
  var mon=P.ms.filter(function(m){ return !payIsTail(m); });
  var tail=P.ms.filter(payIsTail);
  var w=PAY.win|0;
  if(!w || w>=mon.length) return { before:[], mid:mon, after:[], tail:tail, max:0 };
  var max=mon.length-w;
  var s=Math.max(0,Math.min(PAY.start,max));
  PAY.start=s;
  return { before:mon.slice(0,s), mid:mon.slice(s,s+w), after:mon.slice(s+w), tail:tail, max:max };
}

function payTableView(P){
  var SEP='', W=payWindow(P);
  var hasB=W.before.length, hasA=W.after.length;
  function cell(x,cls){
    return '<td class="r'+(cls?' '+cls:'')+'">'+(x?nv(x):'<span style="color:var(--faint)">–</span>')+'</td>';
  }
  /* f(month) → 금액. 창 밖은 합쳐서 한 칸에 넣는다. */
  function band(f,cls,markDue){
    var h='';
    if(hasB) h+=cell(W.before.reduce(function(s,m){ return s+f(m); },0),'bucket');
    W.mid.forEach(function(m){
      var x=f(m);
      h+= (markDue===m) ? '<td class="r duecell" title="이 달에 들어옵니다">'+nv(x)+'</td>' : cell(x,cls);
    });
    if(hasA) h+=cell(W.after.reduce(function(s,m){ return s+f(m); },0),'bucket');
    W.tail.forEach(function(m){ h+=cell(f(m),cls); });
    return h;
  }

  var head='<th class="nos">발주처 · 납기월</th><th class="nos r">납기액</th>'+
    (hasB? '<th class="nos r bucket" data-go="-1" title="'+esc(W.before[0]+' ~ '+W.before[hasB-1])+
           ' · 눌러서 이동">◂ 이전 '+hasB+'</th>':'')+
    W.mid.map(function(m){ return '<th class="nos r">'+esc(m)+'</th>'; }).join('')+
    (hasA? '<th class="nos r bucket" data-go="1" title="'+esc(W.after[0]+' ~ '+W.after[hasA-1])+
           ' · 눌러서 이동">이후 '+hasA+' ▸</th>':'')+
    W.tail.map(function(m){ return '<th class="nos r">'+esc(m)+'</th>'; }).join('');

  var body=P.vs.map(function(v){
    var open=!!PAYOPEN[v];
    var h='<tr class="payv'+(open?' open':'')+'" data-payv="'+esc(v)+'"><td>'+
      '<span class="caret">'+(open?'▾':'▸')+'</span>'+esc(v)+'</td>'+
      '<td class="r drill" data-dv="'+esc(v)+'" title="누르면 대장 행이 열립니다">'+nv(P.due[v])+'</td>'+
      band(function(m){ return P.cell[v+SEP+m]||0; })+'</tr>';
    if(!open) return h;

    h+='<tr class="paydue"><td><span class="tagd">납기</span>들어오는 달</td>'+
       '<td class="r">'+nv(P.due[v])+'</td>'+
       band(function(m){ return P.dcell[v+SEP+m]||0; },'duecell')+'</tr>';

    P.cells.filter(function(c){ return c.v===v; })
      .sort(function(a,b){ return a.m<b.m?-1:1; })
      .forEach(function(c){
        var by={}; c.parts.forEach(function(x){ by[x.pm]=x; });
        /* 창 안에 그 건의 납기월이 있으면 그 칸에 납기액을 얹는다 — 한 줄에서 유입→유출이 보이게 */
        var mark = W.mid.indexOf(c.m)>=0 ? c.m : null;
        h+='<tr class="paysub"><td title="'+esc(payRuleFull(c.rule))+'"><span class="subm">'+
           esc(c.m)+' 납기</span><span class="rulechip">'+esc(payRuleName(c.rule))+'</span></td>'+
           '<td class="r drill" data-dv="'+esc(v)+'" data-dm="'+esc(c.m)+'" title="누르면 대장 행이 열립니다">'+nv(c.a)+'</td>'+
           (function(){
             var out='';
             if(hasB) out+=cell(W.before.reduce(function(s,m){ return s+(by[m]?by[m].amt:0); },0),'bucket');
             W.mid.forEach(function(m){
               var x=by[m];
               if(x) out+='<td class="r"><span class="ratechip">'+x.pct+'</span>'+nv(x.amt)+'</td>';
               else if(m===mark) out+='<td class="r duecell" title="이 달에 들어옵니다">'+nv(c.a)+'</td>';
               else out+='<td class="r"><span style="color:var(--faint)">–</span></td>';
             });
             if(hasA) out+=cell(W.after.reduce(function(s,m){ return s+(by[m]?by[m].amt:0); },0),'bucket');
             W.tail.forEach(function(m){
               var x=by[m];
               out+= x? '<td class="r"><span class="ratechip">'+x.pct+'</span>'+nv(x.amt)+'</td>'
                      : '<td class="r"><span style="color:var(--faint)">–</span></td>';
             });
             return out;
           })()+'</tr>';
      });
    return h;
  }).join('');

  var footPay='<td>합계 · 지급</td><td class="r">'+nv(P.tot)+'</td>'+
    band(function(m){ return P.pm[m]||0; });
  var footDue='<td><span class="tagd">납기</span>합계 · 납기</td><td class="r">'+nv(P.dtot)+'</td>'+
    band(function(m){ return P.dm[m]||0; },'duecell');

  var cols=['176px','112px'];
  if(hasB) cols.push('104px');
  W.mid.forEach(function(){ cols.push('104px'); });
  if(hasA) cols.push('104px');
  W.tail.forEach(function(){ cols.push('104px'); });
  return tbl(head,body,[footPay,footDue],cols,'paytbl');
}

/* 기둥 — 한 기둥이 그 달에 나갈 돈 전부. 안쪽이 발주처별로 나뉜다.
   "언제 얼마를 준비해야 하나" 에 정면으로 답하는 그림이다. */
function payColView(P){
  var ms=P.pms.filter(function(m){ return m!=='지급월 미정'&&m!=='규칙 없음'&&m!=='비율합 오류'; });
  if(!ms.length) return '<div class="empty">그릴 지급월이 없습니다</div>';
  var top=P.vs.slice(0,5), ser=top.concat(['기타']);
  var max=Math.max.apply(null,ms.map(function(m){ return P.pm[m]; }))||1;
  var W=980,H=330,L=66,R=16,T=34,B=46, iw=W-L-R, ih=H-T-B;
  var step=iw/ms.length, bw=Math.min(76,step*0.62), g='';
  for(var t=0;t<=4;t++){
    var y=T+ih-ih*t/4;
    g+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+
       '" stroke="var(--rule)" stroke-width="1"/>'+
       '<text x="'+(L-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5">'+wv(max*t/4)+'</text>';
  }
  ms.forEach(function(m,i){
    var x=L+step*i+(step-bw)/2, acc=0;
    ser.forEach(function(sv,si){
      var val = sv==='기타'
        ? P.vs.slice(5).reduce(function(s,v){ return s+(P.cell[v+''+m]||0); },0)
        : (P.cell[sv+''+m]||0);
      if(!val) return;
      var h=ih*val/max, y=T+ih-h-ih*acc/max;
      acc+=val;
      g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+
         '" height="'+Math.max(h-2,1).toFixed(1)+'" rx="2" fill="var(--sv'+(si+1)+')">'+
         '<title>라인시트 재무 집계 (데모) — 이어진 포트폴리오</title></rect>';
    });
    g+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(T+ih-ih*P.pm[m]/max-7).toFixed(1)+
       '" text-anchor="middle" font-size="10.5" class="cbig">'+wv(P.pm[m])+'</text>'+
       '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(T+ih+16)+'" text-anchor="middle" font-size="10">'+esc(m)+'</text>';
  });
  g+='<line x1="'+L+'" y1="'+(T+ih)+'" x2="'+(W-R)+'" y2="'+(T+ih)+'" stroke="var(--faint)" stroke-width="1"/>';
  var out=P.ms.filter(function(m){ return ms.indexOf(m)<0; });
  return '<div class="pb paychart">'+
    '<ul class="paylegend">'+ser.map(function(s,i){
      return '<li><i style="background:var(--sv'+(i+1)+')"></i>'+esc(s)+'</li>'; }).join('')+'</ul>'+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="지급월별 자금 소요">'+g+'</svg>'+
    '<div class="paycap">단위 원 · '+vlab()+
      (out.length? ' · '+esc(out.join(' · '))+' '+wv(out.reduce(function(s,m){ return s+P.pm[m]; },0))+'은 달이 없어 제외':'')+
      ' — 정확한 금액은 [표] 보기</div></div>';
}

/* 건별 — 한 줄이 발주처 × 납기월 한 건. 칸 높이가 금액이라 눈으로 크기가 읽힌다. */
function payRibbonView(P){
  var ms=P.pms, idx={}, n=ms.length||1;
  ms.forEach(function(m,i){ idx[m]=i; });
  var top=P.cells.slice().sort(function(a,b){ return b.a-a.a; }).slice(0,40);
  var max=0;
  top.forEach(function(c){ c.parts.forEach(function(x){ max=Math.max(max,x.amt); }); });
  max=max||1;
  var head='<th class="nos">발주처</th><th class="nos r">납기월</th><th class="nos r">납기액</th>'+
    '<th class="nos">적용 규칙</th><th class="nos" style="min-width:320px">'+
    esc(ms[0]||'')+' &nbsp;→&nbsp; '+esc(ms[n-1]||'')+'</th>';
  var body=top.map(function(c){
    var bar=c.parts.map(function(x){
      var i=idx[x.pm]||0, h=Math.max(4,26*x.amt/max);
      return '<i style="left:'+(i*100/n).toFixed(2)+'%;width:'+(100/n-1).toFixed(2)+'%;height:'+h.toFixed(1)+'px"'+
        ' title="'+esc(x.pm)+' '+nv(x.amt)+'원 ('+x.pct+'%)"></i>';
    }).join('');
    return '<tr><td data-payv="'+esc(c.v)+'">'+esc(c.v)+'</td><td class="r">'+esc(c.m)+'</td><td class="r">'+nv(c.a)+'</td>'+
      '<td><span class="rulechip">'+esc(payRuleName(c.rule))+'</span></td>'+
      '<td><div class="paybar">'+bar+'</div></td></tr>';
  }).join('');
  return tbl(head,body,'')+
    '<div class="pb paycap">칸 높이 = 금액 (가장 큰 칸 '+wv(max)+' 기준) · 금액 상위 40건'+
    (P.cells.length>40? ' / 전체 '+n0(P.cells.length)+'건':'')+'</div>';
}

/* 납기액을 누르면 그 뒤에 깔린 대장 행을 펼친다.
   합계만 보다가 "어느 품번이지?" 를 물으려면 지금은 대장 탭으로 건너가 필터를 다시 걸어야 한다.
   숫자를 누르면 바로 나오는 편이 맞다. 우클릭(예외 지정)과 겹치지 않게 좌클릭만 쓴다. */
function payDrill(v, mo){
  var rs=rows().filter(function(r){
    if((vendOf(r)||'(발주처 없음)')!==v) return false;
    return mo? monOf(r)===mo : true;
  });
  rs.sort(function(a,b){ return amtOf(b)-amtOf(a); });
  var q=0, a=0;
  rs.forEach(function(r){ q+=qtyOf(r); a+=amtOf(r); });
  var LIM=200, shown=rs.slice(0,LIM);
  var body=shown.map(function(r){
    return '<tr data-id="'+esc(r.id)+'"><td>'+esc(r.b)+'</td><td>'+esc(r.pn)+'</td>'+
      '<td>'+esc(r.cl)+'</td><td style="max-width:190px;overflow:hidden;text-overflow:ellipsis">'+esc(r.nm)+'</td>'+
      '<td class="r">'+esc(dueOf(r)||'—')+'</td>'+
      '<td class="r">'+n0(qtyOf(r))+'</td><td class="r">'+n0(costOf(r))+'</td>'+
      '<td class="r">'+nv(amtOf(r))+'</td></tr>';
  }).join('');
  modal('<h3>'+esc(v)+(mo? ' · '+esc(mo)+' 납기':' 전체')+'</h3>'+
    '<p>'+n0(rs.length)+'행 · '+n0(q)+'장 · <b>'+nv(a)+'원</b> ('+vlab()+')'+
      (rs.length>LIM? ' &nbsp;<span style="color:var(--warn)">— 금액 상위 '+LIM+'행만 표시</span>':'')+'</p>'+
    '<div class="tw" style="max-height:52vh">'+
    '<table class="drill"><thead><tr><th>브랜드</th><th>품번</th><th>색상</th><th>품명</th>'+
    '<th class="r">납기일</th><th class="r">발주량</th><th class="r">사전원가</th><th class="r">매입예정액</th>'+
    '</tr></thead><tbody>'+body+'</tbody>'+
    '<tfoot><tr><td colspan="5">합계</td><td class="r">'+n0(q)+'</td><td></td><td class="r">'+nv(a)+'</td></tr></tfoot>'+
    '</table></div>'+
    '<div class="mrow"><span class="paycap">행을 누르면 그 건의 상세가 열립니다</span>'+
    '<button class="btn gh" id="drillx" style="margin-left:auto">닫기</button></div>', '900px');
  document.getElementById('drillx').onclick=closeModal;
  /* 한 건을 더 파고들 수 있게 — 기존 드로어를 그대로 쓴다 */
  Array.prototype.forEach.call(document.querySelectorAll('table.drill tbody tr'),function(tr){
    tr.style.cursor='pointer';
    tr.onclick=function(){ closeModal(); openDrawer(tr.getAttribute('data-id')); };
  });
}

function payPanel(rs){
  var P=paySplitRows(rs);
  if(!P.vs.length) return '';
  var bad=P.ms.filter(function(m){ return m==='규칙 없음'||m==='비율합 오류'; });
  var view = PAY.view==='col'? payColView(P) : (PAY.view==='bar'? payRibbonView(P) : payTableView(P));
  return '<div class="panel"><div class="ph"><h2>발주처 × 지급월</h2>'+bl()+
    '<div class="seg">'+
      '<button type="button" id="payv-tbl" aria-pressed="'+(PAY.view==='tbl')+'">표</button>'+
      '<button type="button" id="payv-col" aria-pressed="'+(PAY.view==='col')+'">기둥</button>'+
      '<button type="button" id="payv-bar" aria-pressed="'+(PAY.view==='bar')+'">건별</button>'+
    '</div>'+
    '<div class="seg" style="margin-left:6px" title="매입 금액을 찍는 기준입니다. 계산·구간판정은 늘 VAT 별도로 합니다">'+
      '<button type="button" id="vat-off" aria-pressed="'+(!VATIN)+'">VAT 별도</button>'+
      '<button type="button" id="vat-on" aria-pressed="'+(VATIN)+'">VAT 포함</button>'+
    '</div>'+
    (PAY.view==='tbl'? (function(){
       var W=payWindow(P);
       var sizes=[[3,'3개월'],[6,'6개월'],[12,'12개월'],[0,'전체']];
       return '<div class="seg" style="margin-left:6px">'+sizes.map(function(x){
           return '<button type="button" data-win="'+x[0]+'" aria-pressed="'+(PAY.win===x[0])+'">'+x[1]+'</button>';
         }).join('')+'</div>'+
         (W.max? '<span class="winnav"><button class="navbtn" data-step="-1"'+(PAY.start<=0?' disabled':'')+'>◀</button>'+
           '<b>'+esc(W.mid[0]||'')+' ~ '+esc(W.mid[W.mid.length-1]||'')+'</b>'+
           '<button class="navbtn" data-step="1"'+(PAY.start>=W.max?' disabled':'')+'>▶</button></span>':'');
     })() : '')+
    (PAY.view==='tbl'? '<button class="btn gh xs" id="payall" style="margin-left:4px">'+
        (P.vs.length && P.vs.every(function(v){ return PAYOPEN[v]; }) ? '전체 접기':'전체 펼치기')+'</button>':'')+
    '<button class="btn gh xs" id="payrules" style="margin-left:4px">결제조건'+
      (payEx().length? ' <span class="exn">'+payEx().length+'</span>':'')+'</button>'+
    '<select id="paygrain" style="width:auto;margin-left:4px">'+
      '<option value="vm"'+(PAY.grain==='vm'?' selected':'')+'>건 = 발주처 × 납기월</option>'+
      '<option value="row"'+(PAY.grain==='row'?' selected':'')+'>건 = 대장 행</option></select>'+
    '<span class="sub">'+n0(P.cells.length)+'건 · 납기월 다음 달부터 · '+vlab()+'</span></div>'+
    (PAYERR? '<div class="paywarn">결제조건을 못 읽었습니다 ('+esc(PAYERR)+') — 기본 규칙으로 계산했습니다</div>':'')+
    (bad.length? '<div class="paywarn">'+esc(bad.join(' · '))+' 열이 있습니다 — <b>9.결제조건</b> 탭을 확인하세요</div>':'')+
    (P.dead.length? '<div class="paywarn">한 건도 못 잡은 예외 '+P.dead.length+'줄 — '+
      esc(P.dead.map(function(r){ return (r.v||'')+(r.mo?' '+r.mo:''); }).join(', '))+
      ' · 발주처 이름이 대장과 다르면 그 줄은 조용히 안 먹습니다</div>':'')+
    view+
    '<div class="pb" style="padding-top:10px;font-size:11px;color:var(--mut)">'+
      '<span class="tagd">납기</span> 주황은 <b>들어오는 달</b>, 검정은 <b>나가는 달</b>입니다. 같은 열에서 위아래로 견주시면 됩니다. '+
      '발주처 이름에 <b>우클릭</b>하면 그 발주처(또는 그 발주처의 특정 납기월)에 예외를 겁니다. '+
      '적용 전에 각 달 자금이 얼마 움직이는지 보여줍니다. 규칙은 <b>9.결제조건</b> 탭에 기록됩니다.</div></div>';
}

/* ---------- 결제조건 편집 ----------
   대상은 언제나 "표에서 지금 보고 있는 그 발주처, 그 달"이다. 그래서 우클릭으로 연다 —
   발주처 이름을 타이핑할 일이 없어 오타가 구조적으로 안 난다.
   걸어둔 규칙 전체는 헤더의 [결제조건] 버튼으로 본다.

   기본 구간표(발주처·납기월이 빈 줄)는 화면에서 못 고친다. 협의로 정해진 값이라
   시트에서만 바꾸게 둔다. 화면이 건드리는 건 예외뿐이다. */
function payBase(){ return payRules().filter(function(r){ return !r.v && !r.mo; }); }
function payEx(){ return payRules().filter(function(r){ return r.v || r.mo; }); }
function exKey(r){ return (r.v||'')+''+(r.mo||''); }

/** 지금 화면 규칙에 예외 목록을 갈아끼운 사본으로 지급월 합계를 낸다(저장 전 미리보기용). */
function payPreview(rs,exList){
  var save=PAYRULES;
  PAYRULES=payBase().concat(exList);
  var out={};
  try{ paySplitRows(rs).cells.forEach(function(c){
    c.parts.forEach(function(x){ out[x.pm]=(out[x.pm]||0)+x.amt; }); }); }
  finally{ PAYRULES=save; }
  return out;
}

function payMonthsOf(rs){
  var s={};
  rs.forEach(function(r){ s[monOf(r)]=1; });
  return Object.keys(s).sort(function(a,b){
    if((a==='납기불명')!==(b==='납기불명')) return a==='납기불명'?1:-1; return a<b?-1:1; });
}

var payCtx=null;
function payCtxClose(){ if(payCtx){ payCtx.remove(); payCtx=null; } }
document.addEventListener('click',payCtxClose);
document.addEventListener('keydown',function(e){ if(e.key==='Escape') payCtxClose(); });

function payCtxOpen(e,v){
  e.preventDefault(); payCtxClose();
  var rs=rows(), ms=payMonthsOf(rs).filter(function(m){ return m!=='납기불명'; });
